<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>音声の確認</title>
<style>
  body { font-family: -apple-system, system-ui, sans-serif; margin: 0; padding: 14px; background: #fff; color: #111; font-size: 16px; line-height: 1.55; }
  h1 { font-size: 20px; margin: 4px 0 10px; }
  h2 { font-size: 16px; margin: 18px 0 6px; }
  .row { padding: 10px; margin: 8px 0; border-radius: 10px; background: #f3f4f6; }
  .ok { background: #dcfce7; } .ng { background: #fee2e2; }
  button { font-size: 17px; padding: 12px; width: 100%; margin: 6px 0; border-radius: 10px; border: 1px solid #cbd5e1; background: #fff; color: #1d4ed8; }
  .v { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid #e5e7eb; font-size: 14px; }
  .v button { width: auto; padding: 6px 12px; font-size: 14px; margin: 0; }
  pre { white-space: pre-wrap; font-size: 13px; margin: 0; }
  small { color: #555; }
</style>
</head>
<body>
<h1>音声の確認（版 v4）</h1>
<p><a href="./" style="color:#1d4ed8">‹ アプリに戻る</a></p>
<p><small>アプリ本体とは別のページです。結果の画面を撮影して送ってください。</small></p>

<h2>A. 音声入力（v4: 2つの方法を試す）</h2>
<div class="row"><b>それぞれ、ページを開き直してから1つだけ試してください。</b></div>
<button id="mA">方法A：同じ仕組みを使い回す（3回続けて話す）</button>
<button id="mB">方法B：ずっと聞き続ける（25秒の間に3回話す）</button>
<div id="mOut" class="row">結果: 未実行</div>
<details><summary>以前のボタン（①〜⑤）</summary>
<div id="sr" class="row">確認中…</div>
<button id="rec">① 押してから英語で話す（例: I agree with this idea.）</button>
<div id="heard" class="row">聞き取った文: まだ</div>
<button id="rec2">③ 設定を変えて話す（途中の聞き取りも受け取る・12秒）</button>
<button id="recja">④ 日本語で話す（例: これはテストです）</button>
<button id="mic">⑤ マイクの音量を見る（5秒・話すと棒が伸びる）</button>
<div id="meter" class="row">⑤の結果: 未実行</div>
<button id="loop">② 読み上げ → 音声入力 → 読み上げ を自動で（運転中モードの試験）</button>
<div id="loopout" class="row">②の結果: 未実行</div>

</details>
<h2>B. 読み上げの声</h2>
<div id="vc" class="row">確認中…</div>
<div id="voices"></div>

<h2>記録</h2>
<div class="row"><pre id="log"></pre></div>

<script>
const $ = (id) => document.getElementById(id);
const log = (m) => { $('log').textContent = new Date().toTimeString().slice(0, 8) + ' ' + m + '\n' + $('log').textContent; };
const standalone = navigator.standalone === true || matchMedia('(display-mode: standalone)').matches;
log('起動: ' + (standalone ? 'ホーム画面から' : 'Safari から'));

// ---- 音声入力 ----
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
$('sr').textContent = SR ? '音声入力の機能: あり' : '音声入力の機能: なし（この開き方では使えません）';
$('sr').className = 'row ' + (SR ? 'ok' : 'ng');
// どこで止まるかが分かるよう、音声入力の合図をすべて記録する
// 前の音声入力が「end」を出し切るまで、次を始めない（iPhone は途中で止めるとマイクが無音のままになる）
let srIdle = Promise.resolve();
async function listen(ms = 7000, opt = {}) {
  await srIdle;
  await new Promise((r) => setTimeout(r, 300));
  let markIdle; srIdle = new Promise((r) => (markIdle = r));
  return new Promise((resolve) => {
    if (!SR) { markIdle(); return resolve({ ok: false, why: 'no-api' }); }
    const r = new SR();
    r.lang = opt.lang || 'en-US'; r.interimResults = !!opt.interim; r.maxAlternatives = 3; r.continuous = !!opt.continuous;
    let done = false, best = '';
    const t0 = Date.now(), sec = () => ((Date.now() - t0) / 1000).toFixed(1) + '秒';
    // 結果が来ても止めない。iPhone が自分で end を出すのを待つ（abort すると次からマイクが無音になった）
    const fin = (x) => { if (done) return; done = true; clearTimeout(t); resolve(x); };
    for (const ev of ['audiostart', 'soundstart', 'speechstart', 'speechend', 'soundend', 'audioend', 'nomatch'])
      r.addEventListener(ev, () => log(`  ${sec()} 合図: ${ev}`));
    r.onresult = (e) => {
      const res = e.results[e.results.length - 1];
      best = res[0].transcript;
      log(`  ${sec()} 聞き取り${res.isFinal ? '（確定）' : '（途中）'}: ${best}`);
      if (res.isFinal || !opt.interim) fin({ ok: true, text: best });
    };
    r.onerror = (e) => { log(`  ${sec()} 音声入力エラー: ${e.error}${done ? '（時間切れで止めた後）' : ''}`); fin({ ok: !!best, text: best, why: e.error }); };
    r.onend = () => { log(`  ${sec()} 合図: end`); clearTimeout(guardEnd); markIdle(); fin({ ok: !!best, text: best, why: 'end-no-result' }); };
    let guardEnd = null;
    // 時間切れは stop（穏やかに終える）。end が来なければ2秒後に次へ進めるようにする
    const t = setTimeout(() => { log(`  ${sec()} 時間切れ（stop で終えた）`); try { r.stop(); } catch {} guardEnd = setTimeout(markIdle, 2000); fin({ ok: !!best, text: best, why: 'timeout' }); }, ms);
    try { r.start(); log(`音声入力: 開始（${r.lang}${opt.interim ? '・途中も受け取る' : ''}${opt.continuous ? '・続けて聞く' : ''}）`); }
    catch (e) { log('音声入力 start 失敗: ' + e.message); markIdle(); fin({ ok: false, why: 'start-failed' }); }
  });
}
async function runRec(opt, ms) {
  $('heard').textContent = '聞いています…（話してください）';
  const r = await listen(ms, opt);
  $('heard').textContent = r.ok ? '聞き取った文: ' + r.text : '聞き取れませんでした（' + r.why + '）';
  $('heard').className = 'row ' + (r.ok ? 'ok' : 'ng');
}
$('rec2').onclick = () => runRec({ interim: true, continuous: true }, 12000);
$('recja').onclick = () => runRec({ lang: 'ja-JP', interim: true }, 10000);
// マイクの音が届いているか（音声認識とは別に、録音だけを試す）
$('mic').onclick = async () => {
  try {
    const st = await navigator.mediaDevices.getUserMedia({ audio: true });
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const an = ctx.createAnalyser(); ctx.createMediaStreamSource(st).connect(an);
    const buf = new Uint8Array(an.fftSize); let peak = 0; const t0 = Date.now();
    const tick = () => {
      an.getByteTimeDomainData(buf);
      const v = Math.max(...buf.map((x) => Math.abs(x - 128))) / 128; peak = Math.max(peak, v);
      $('meter').textContent = '音量 ' + '█'.repeat(Math.round(v * 30)) + `（最大 ${Math.round(peak * 100)}%）`;
      if (Date.now() - t0 < 5000) requestAnimationFrame(tick);
      else { st.getTracks().forEach((x) => x.stop()); ctx.close(); log(`マイク: 最大音量 ${Math.round(peak * 100)}%`); $('meter').className = 'row ' + (peak > 0.05 ? 'ok' : 'ng'); }
    };
    tick();
  } catch (e) { $('meter').textContent = 'マイクを使えません（' + e.name + '）'; $('meter').className = 'row ng'; log('マイク: ' + e.name); }
};
$('rec').onclick = async () => {
  await runRec({}, 7000);
};

// ---- v4: 方法A（1つの音声入力を使い回す） ----
let shared = null;
function onceShared(ms) {
  return new Promise((resolve) => {
    if (!SR) return resolve({ ok: false, why: 'no-api' });
    if (!shared) { shared = new SR(); shared.lang = 'en-US'; shared.interimResults = true; shared.continuous = false; log('方法A: 音声入力を1つ作った'); }
    const r = shared; let done = false, best = '';
    const t0 = Date.now(), sec = () => ((Date.now() - t0) / 1000).toFixed(1) + '秒';
    const fin = (x) => { if (done) return; done = true; clearTimeout(t); resolve(x); };
    r.onaudiostart = () => log(`  ${sec()} 合図: audiostart`);
    r.onspeechstart = () => log(`  ${sec()} 合図: speechstart`);
    r.onresult = (e) => { const res = e.results[e.results.length - 1]; best = res[0].transcript; if (res.isFinal) log(`  ${sec()} 聞き取り（確定）: ${best}`); };
    r.onerror = (e) => log(`  ${sec()} エラー: ${e.error}`);
    r.onend = () => { log(`  ${sec()} 合図: end`); fin({ ok: !!best, text: best }); };
    const t = setTimeout(() => { try { r.stop(); } catch {} }, ms);
    try { r.start(); log('方法A: 開始'); } catch (e) { log('方法A start 失敗: ' + e.message); fin({ ok: false }); }
  });
}
$('mA').onclick = async () => {
  const res = [];
  for (let k = 1; k <= 3; k++) {
    $('mOut').textContent = `${k}回目: 英語で話してください（例: I agree with this idea.）`;
    const r = await onceShared(7000);
    res.push(r.ok ? '○' : '×');
    await new Promise((x) => setTimeout(x, 600));
  }
  $('mOut').textContent = `方法Aの結果: ${res.join(' ')}（○が3つなら使える）`;
  $('mOut').className = 'row ' + (res.every((x) => x === '○') ? 'ok' : 'ng');
  log('方法Aの結果: ' + res.join(' '));
};
// ---- v4: 方法B（一度だけ始めて聞き続ける） ----
$('mB').onclick = () => {
  if (!SR) return;
  const r = new SR(); r.lang = 'en-US'; r.interimResults = false; r.continuous = true;
  let n = 0; const t0 = Date.now(), sec = () => ((Date.now() - t0) / 1000).toFixed(1) + '秒';
  r.onaudiostart = () => log(`  ${sec()} 合図: audiostart`);
  r.onresult = (e) => {
    for (let i = e.resultIndex; i < e.results.length; i++) if (e.results[i].isFinal) {
      n++; log(`  ${sec()} 聞き取り ${n}: ${e.results[i][0].transcript}`);
      $('mOut').textContent = `方法B: ${n}回 聞き取れた（続けて話してください）`;
    }
  };
  r.onerror = (e) => log(`  ${sec()} エラー: ${e.error}`);
  r.onend = () => { log(`  ${sec()} 合図: end`); $('mOut').textContent = `方法Bの結果: ${n}回 聞き取れた（3回なら使える）`; $('mOut').className = 'row ' + (n >= 3 ? 'ok' : 'ng'); };
  setTimeout(() => { try { r.stop(); } catch {} }, 25000);
  try { r.start(); log('方法B: 開始（25秒）'); $('mOut').textContent = '方法B: 英語で1文ずつ、間を空けて3回話してください'; } catch (e) { log('方法B start 失敗: ' + e.message); }
};

// ---- 読み上げ ----
const live = new Set();
let chosen = { 'en': null, 'ja': null };
function say(text, lang, voice) {
  return new Promise((resolve) => {
    const u = new SpeechSynthesisUtterance(text);
    u.lang = lang; if (voice) u.voice = voice;
    live.add(u);
    u.onend = () => { live.delete(u); resolve(true); };
    u.onerror = (e) => { live.delete(u); log('読み上げエラー: ' + e.error); resolve(false); };
    speechSynthesis.speak(u);
  });
}
$('loop').onclick = async () => {
  $('loopout').textContent = '実行中…画面に触らずに、読み上げのあと英語で答えてください';
  const a = await say('Please say in English: I agree.', 'en-US', chosen.en);
  const r = await listen();
  const b = await say(r.ok ? 'I heard: ' + r.text : 'I could not hear you.', 'en-US', chosen.en);
  const ok = a && r.ok && b;
  $('loopout').textContent = '②の結果: ' + (ok ? '最後まで自動で進みました（聞き取り: ' + r.text + '）' : '途中で止まりました（' + (r.ok ? '読み上げ' : r.why) + '）');
  $('loopout').className = 'row ' + (ok ? 'ok' : 'ng');
};

// 声の一覧。名前から男女と品質を推定する（iPhone の声の名前の一覧に基づく推定）
const FEMALE = /samantha|ava|allison|susan|victoria|karen|moira|tessa|fiona|serena|kate|nicky|zoe|joelle|kyoko|o-ren|hattori|siri.*female|female|flo|grandma|sandy|shelley|martha|catherine/i;
const MALE = /alex|aaron|fred|daniel|oliver|tom|evan|nathan|arthur|gordon|rishi|otoya|siri.*male|male|reed|rocko|eddy|grandpa|ralph|albert|junior|lee/i;
function describe(v) {
  const g = FEMALE.test(v.name) ? '女性' : MALE.test(v.name) ? '男性' : '不明';
  const q = /premium|プレミアム/i.test(v.name + v.voiceURI) ? '最高品質' : /enhanced|拡張/i.test(v.name + v.voiceURI) ? '高品質' : '標準';
  return { g, q };
}
function listVoices() {
  const vs = speechSynthesis.getVoices().filter((v) => /^(en|ja)/.test(v.lang));
  if (!vs.length) return;
  const hq = vs.filter((v) => describe(v).q !== '標準').length;
  $('vc').textContent = `英語・日本語の声: ${vs.length} 個（うち高品質 ${hq} 個）`;
  $('vc').className = 'row ' + (hq ? 'ok' : '');
  $('voices').innerHTML = vs.sort((a, b) => a.lang.localeCompare(b.lang) || a.name.localeCompare(b.name)).map((v, i) => {
    const d = describe(v);
    return `<div class="v"><span>${v.name}<br><small>${v.lang} ・ ${d.g} ・ ${d.q}${v.localService ? '' : ' ・ ネット'}</small></span><button data-i="${i}">試す</button></div>`;
  }).join('');
  const sorted = vs;
  $('voices').querySelectorAll('button').forEach((b) => b.onclick = () => {
    const v = sorted[Number(b.dataset.i)];
    chosen[v.lang.slice(0, 2)] = v;
    say(v.lang.startsWith('ja') ? '公共交通機関をもっと使うべきだと思います。' : 'I believe that people should use public transportation more often.', v.lang, v);
    log('試した声: ' + v.name + ' (' + v.lang + ')');
  });
}
listVoices();
speechSynthesis.onvoiceschanged = listVoices;
</script>
</body>
</html>
