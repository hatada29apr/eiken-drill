はなく build が必要。"},{"t":"People plant more trees because birds have built more nests.","why":"鳥が巣を増やすことを植樹の原因としており、元の関係と異なる。"},{"t":"Trees give people more places to keep birds in cages.","why":"鳥が巣を作る場所を、人が鳥かごを置く場所に変えている。"}],"answer":0,"point":"動名詞が表す行為を when＋主語＋動詞に変え、受け手を主語にして言い換えられる。","level":1,"drive":{"ja":"木を植えると、鳥が巣を作れる場所が増える。同じ意味を別の構文で英語にしてください。","en":"Birds have more places to build nests when people plant trees."},"explain":"Birdsが主語、haveが動詞で、when節は植樹する場合を示す。places to doは用途を表し、論述で利点を具体化できる。別の言い方: Planting trees gives birds more nesting sites."},{"id":"g2-paraphrase-218","q":"The new sports center is too far away for children to reach on foot.","q_ja":"新しいスポーツセンターは、子どもが歩いて行くには遠すぎる。","choices":[{"t":"Children can walk to the new sports center because it is close enough to reach.","why":"子どもが歩いて行ける近さだという、逆の意味になっている。"},{"t":"The new sports center is too far away for youngsters to reach on foot.","why":"children を同義語の youngsters に替えただけで、構文は言い換えていない。"},{"t":"Children cannot walk to the new sports center because it is so far away.","why":"正解。too ... to ... を、距離が理由で歩いて行けないという because の文に変えている。"},{"t":"Children are not able walking to the new sports center because of its distance.","why":"be able の後ろは to＋動詞の原形なので、walking ではなく to walk が必要。"},{"t":"The new sports center is far away, so children are advised to walk there.","why":"歩いて行けないという内容を、歩くよう勧めるという内容に変えている。"},{"t":"The new sports center is difficult to reach because children cannot enter on foot.","why":"距離ではなく、徒歩での入場が認められないことを理由にしている。"}],"answer":2,"point":"too＋形容詞＋for＋人＋to do は、その人ができない理由を because で示して言い換える。","level":2,"drive":{"ja":"新しいスポーツセンターは、子どもが歩いて行くには遠すぎる。同じ意味を別の構文で英語にしてください。","en":"Children cannot walk to the new sports center because it is so far away."},"explain":"Childrenが主語で、because節が歩けない理由を示す。cannotは論述で困難を表せる。別の言い方: The new sports center is too far away for children to walk to."},{"id":"g2-paraphrase-219","q":"Although phone repairs cost less now, fewer people choose them than they did in the past.","q_ja":"携帯電話の修理代は以前より安くなったが、修理を選ぶ人は以前より少ない。","choices":[{"t":"The number of people choosing phone repairs has fallen because these services now cost less than before.","why":"修理代の低下と利用者の減少を、譲歩ではなく原因と結果の関係にしている。"},{"t":"Although phone repairs cost less now, fewer people select them than they did in the past.","why":"choose を同義語の select に替えただけで、構文は元のまま。"},{"t":"Fewer people choose phone repairs than before, even though the cost of these services has risen recently.","why":"修理代が安くなったのではなく、高くなったという意味に変わっている。"},{"t":"Although repairing phones is now cheaper, the number of people choosing these services have fallen since then.","why":"主語の中心は単数の the number なので、have ではなく has が必要。"},{"t":"The number of people choosing phone repairs has fallen even though these services now cost less.","why":"正解。fewer people を the number ... has fallen で表し、料金低下との譲歩関係も保っている。"},{"t":"Phone repairs cost less than before, but the people choosing them pay more for each repair now.","why":"修理を選ぶ人数の減少を述べず、利用者が払う修理代が増えたという内容を加えている。"}],"answer":4,"point":"fewer people は人数の減少。although の譲歩関係と、料金・人数それぞれの増減を保つ。","level":3,"drive":{"ja":"携帯電話の修理代は以前より安くなったが、修理を選ぶ人は以前より少ない。同じ意味を別の構文で英語にしてください。","en":"The number of people choosing phone repairs has fallen even though these services now cost less."},"explain":"主語の中心はnumberで、has fallenが述語。even thoughは譲歩を示し、要約で対比を保てる。別の言い方: Despite lower prices, fewer people choose phone repairs."},{"id":"g2-paraphrase-220","q":"Schools should teach students how to save water.","q_ja":"学校は生徒に節水の方法を教えるべきだ。","choices":[{"t":"Students should teach schools how to save more water.","why":"生徒が学校に教えるという意味になり、教える側と教わる側が逆。"},{"t":"Students should be taught how to save water at school.","why":"正解。学校が教えるという能動態を、生徒が学校で教わるという受動態に変えている。"},{"t":"Schools should teach students how to conserve water.","why":"save を同義語の conserve に替えただけで、構文の言い換えになっていない。"},{"t":"Students should be teach how to save water at school.","why":"受動態には過去分詞が必要なので、be teach ではなく be taught にする。"},{"t":"Schools should leave students to learn about saving water alone.","why":"学校が教えるのではなく、生徒に独学を任せるという意味になっている。"},{"t":"Students should learn how to use more water at school.","why":"節水の方法ではなく、より多くの水を使う方法を学ぶという内容になっている。"}],"answer":1,"point":"teach＋人＋内容は、人＋be taught＋内容という受動態で言い換えられる。","level":1,"drive":{"ja":"学校は生徒に節水の方法を教えるべきだ。同じ意味を別の構文で英語にしてください。","en":"Students should be taught how to save water at school."},"explain":"Studentsが主語の受動態で、how以下は教わる内容を示す。should be＋過去分詞は、論述で受け手を中心に提言できる。別の言い方: Schools should teach students to save water."},{"id":"g2-paraphrase-101","q":"Ken is too tired to study tonight.","q_ja":"ケンは疲れすぎていて、今夜は勉強できません。","choices":[{"t":"Ken is not tired, so he can study tonight.","why":"疲れていないので勉強できるという意味になり、元の文と逆。"},{"t":"Ken is so tired that he cannot study tonight.","why":"正解。疲れすぎて勉強できないことを、so ... that ... cannotで表している。"},{"t":"Ken is too exhausted to study tonight.","why":"tiredを同義語のexhaustedに替えただけで、構文を変えていない。"},{"t":"Ken cannot studies tonight because he is very tired.","why":"cannotの後は動詞の原形なので、studiesではなくstudyにする。"},{"t":"Ken's brother is too tired to study tonight.","why":"疲れて勉強できない人が、ケンからケンの兄弟に変わっている。"},{"t":"Ken is tired tonight because he cannot study.","why":"勉強できないことが疲れの原因になっており、原因と結果が逆。"}],"answer":1,"point":"too ... toは「〜すぎて…できない」。so ... that ... cannotでも表せる。","level":1,"drive":{"ja":"ケンは疲れすぎていて、今夜は勉強できません。同じ意味を別の構文で言いましょう。","en":"Ken is so tired that he cannot study tonight."},"explain":"Kenが主語で、that節が疲労の結果を示す。so＋形容詞＋that節で程度と結果を結び、論述で行動できない理由を説明できる。別の言い方: Ken is too tired to study tonight."},{"id":"g2-paraphrase-102","q":"I need ten minutes to walk to school daily.","q_ja":"私は毎日、学校まで歩くのに１０分かかります。","choices":[{"t":"I require ten minutes to walk to school daily.","why":"needを同義語のrequireに替えただけで、構文を変えていない。"},{"t":"My sister spends ten minutes walking to school daily.","why":"学校まで歩く人が、私から私の姉妹に変わっている。"},{"t":"I spend ten minutes walk to school every day.","why":"spend＋時間の後は動名詞なので、walkではなくwalkingにする。"},{"t":"My daily walk to school takes twenty minutes.","why":"学校まで歩く時間が、１０分から２０分に変わっている。"},{"t":"Walking to school takes me ten minutes each day.","why":"正解。歩くことを主語にして、毎日の通学に１０分かかることを表している。"},{"t":"I walk home from school in ten minutes daily.","why":"学校へ歩いて行く話から、学校から家へ歩いて帰る話に変わっている。"}],"answer":4,"point":"「〜するのに時間がかかる」は、動名詞を主語にして「〜ing takes 人＋時間」で表せる。","level":1,"drive":{"ja":"私は毎日、学校まで歩くのに１０分かかります。同じ意味を別の構文で言いましょう。","en":"Walking to school takes me ten minutes each day."},"explain":"歩く行為が主語で、takesが所要時間を示す。take＋人＋時間で負担を数値化でき、論述で通学の具体例に使える。別の言い方: It takes me ten minutes to walk to school every day."},{"id":"g2-paraphrase-103","q":"Students need a library card to borrow books.","q_ja":"生徒が本を借りるには、図書館の利用カードが必要です。","choices":[{"t":"Students can borrow books without having a library card.","why":"カードなしで本を借りられるという意味になり、元の文と逆。"},{"t":"Students require a library card to borrow books.","why":"needを同義語のrequireに替えただけで、構文を変えていない。"},{"t":"To borrow books, students must have a library card.","why":"正解。本を借りるという目的を文頭に置き、カードが必要なことをmust haveで表している。"},{"t":"To borrow books, students must has a library card.","why":"mustの後は動詞の原形なので、hasではなくhaveにする。"},{"t":"Teachers need a library card, but students do not.","why":"カードが必要なのは教師で、生徒には不要という意味に変わっている。"},{"t":"Students must borrow books to get a library card.","why":"カードを得るために本を借りるという意味になり、必要な条件が逆。"}],"answer":2,"point":"「〜するには…が必要」は、To＋動詞の原形を文頭に置き、must haveでも表せる。","level":1,"drive":{"ja":"生徒が本を借りるには、図書館の利用カードが必要です。同じ意味を別の構文で言いましょう。","en":"To borrow books, students must have a library card."},"explain":"文頭のTo句が目的、主節が必要条件を示す。must＋原形で要件を明示し、論述で制度の利用条件を説明できる。別の言い方: Students cannot borrow books without a library card."}],"reason":[{"id":"g2-reason-001","q":"TOPIC: Should schools let students grow vegetables in a school garden?\nPosition: Agree","q_ja":"学校は校内の畑で生徒に野菜を育てさせるべきか。立場：賛成。","choices":[{"t":"Garden work takes time away from other subjects that students need to study.","why":"他の教科の学習時間が減るという欠点で、反対の立場を支える。"},{"t":"Growing vegetables helps students understand how much care is needed to produce food.","why":"正解。食べ物を作る手間を学べるという教育上の利点が、賛成の理由になる。"},{"t":"Some schools have vegetable gardens between their main buildings and their sports fields.","why":"畑の場所という事実だけで、野菜を育てるべき理由を示していない。"},{"t":"Schools should let students grow vegetables because school gardens are a good idea.","why":"畑をよいと評価して主張を繰り返すだけで、具体的な利点がない。"},{"t":"Last spring, I grew three small tomatoes in our school garden with my friend.","why":"一度の個人的な体験だけで、生徒全体に当てはまる理由になっていない。"},{"t":"Schools should give students more choices about the colors of their sports uniforms.","why":"運動着の色の選択についての提案で、野菜を育てることの理由ではない。"}],"answer":1,"point":"賛成の理由では、その活動から生徒が何を学べるかを示す。","drive":{"ja":"学校で生徒に野菜を育てさせることに賛成です。学べることを理由に、英語で一文述べてください。","en":"Growing vegetables helps students understand how much care is needed to produce food."},"level":1,"explain":"動名詞句が主語、helpsが動詞で、how節は理解する内容。help＋人＋原形で学習効果を論じる。別の言い方: Growing vegetables helps students learn how much care producing food requires."},{"id":"g2-reason-002","q":"TOPIC: Should local libraries replace all printed books with electronic books?\nPosition: Disagree","q_ja":"地域の図書館は紙の本をすべて電子書籍に置き換えるべきか。立場：反対。","choices":[{"t":"Electronic books allow libraries to offer more titles without needing additional shelf space.","why":"棚を増やさず本を増やせるという利点で、置き換えに賛成する理由になる。"},{"t":"Our library lent me a printed book about birds on Saturday last week.","why":"個人が本を借りた出来事だけで、紙の本を残す一般的な理由がない。"},{"t":"Libraries should keep printed books because replacing all of them is not a good idea.","why":"置き換えに反対という主張を言い換えており、理由の中身がない。"},{"t":"Local libraries should display more paintings by artists who live in the area.","why":"地域の絵画の展示についての提案で、本の形式を変えることと関係がない。"},{"t":"People without suitable devices may lose access to books if printed copies disappear.","why":"正解。端末を持たない人が本を読めなくなるおそれが、全面的な置き換えに反対する理由になる。"},{"t":"Printed books and electronic books are both available at some local libraries today.","why":"現在の図書館の状況を述べるだけで、置き換えに反対する理由を示していない。"}],"answer":4,"point":"反対の理由では、提案によって誰にどのような不利益が生じるかを示す。","drive":{"ja":"図書館の紙の本をすべて電子書籍に変えることに反対です。端末を持たない人への影響を英語で一文述べてください。","en":"People without suitable devices may lose access to books if printed copies disappear."},"level":2,"explain":"Peopleが主語、may loseが述語、if節が条件。without suitable devicesは適切な端末を持たない人を限定する。別の言い方: If printed copies disappear, people who lack suitable devices may lose access to books."},{"id":"g2-reason-003","q":"TOPIC: Should companies encourage employees to take short exercise breaks during work?\nPosition: Agree","q_ja":"会社は勤務中に短い運動休憩を取るよう従業員に勧めるべきか。立場：賛成。","choices":[{"t":"Short exercise breaks help employees reduce stress and return to work feeling refreshed.","why":"正解。ストレスが減り、気分を切り替えて仕事に戻れるという利点が賛成を支える。"},{"t":"Taking exercise breaks may interrupt important tasks and make it harder to finish work.","why":"仕事が中断するという欠点で、運動休憩に反対する理由になる。"},{"t":"Some employees take short exercise breaks near their desks during the working day.","why":"休憩の様子を述べるだけで、運動休憩を勧める理由にはなっていない。"},{"t":"Companies should encourage exercise breaks because taking these breaks is a good practice.","why":"よい習慣だと評価して主張を繰り返すだけで、効果を説明していない。"},{"t":"Yesterday, I stretched beside my desk for five minutes before the afternoon meeting.","why":"昨日の個人的な行動だけで、従業員全体への利点を説明していない。"},{"t":"Companies should choose brighter colors when they order new signs for their buildings.","why":"建物の看板の色についての提案で、運動休憩の理由から外れている。"}],"answer":0,"point":"行動の説明だけでなく、その行動がもたらす効果を理由として述べる。","drive":{"ja":"勤務中の短い運動休憩に賛成です。心身への効果を理由に、英語で一文述べてください。","en":"Short exercise breaks help employees reduce stress and return to work feeling refreshed."},"level":2,"explain":"休憩が主語、helpが動詞、reduceとreturnが並列。feeling refreshedで状態を示し、効果を論じる。別の言い方: Exercise breaks ease stress and refresh workers."},{"id":"g2-reason-004","q":"TOPIC: Should supermarkets stop selling vegetables that have unusual shapes?\nPosition: Disagree","q_ja":"スーパーは形が不ぞろいな野菜の販売をやめるべきか。立場：反対。","choices":[{"t":"Supermarkets should stay open later so that customers can shop after finishing work.","why":"営業時間についての提案で、野菜の形による販売の判断とは関係がない。"},{"t":"Vegetables with unusual shapes are sometimes placed in separate boxes near store entrances.","why":"売り場の配置という事実だけで、販売を続ける理由を述べていない。"},{"t":"Selling only vegetables with regular shapes makes it easier to arrange attractive displays.","why":"形のそろった野菜だけを売る利点で、販売中止に賛成する理由になる。"},{"t":"Rejecting vegetables only because of their shape increases the amount of food wasted.","why":"正解。形だけで売らないと食品廃棄が増えるため、販売中止に反対する理由になる。"},{"t":"I bought two unusually shaped carrots at the supermarket near my house yesterday.","why":"個人の買い物の体験だけで、販売を続ける一般的な理由がない。"},{"t":"Supermarkets should continue selling these vegetables because stopping their sale is a bad idea.","why":"販売中止に反対する主張を繰り返しており、なぜ悪いのかを説明していない。"}],"answer":3,"point":"反対の理由には、提案を実行した場合に増える問題を使える。","drive":{"ja":"形が不ぞろいな野菜の販売中止に反対です。食品廃棄への影響を英語で一文述べてください。","en":"Rejecting vegetables only because of their shape increases the amount of food wasted."},"level":2,"explain":"動名詞句が主語、increasesが動詞、wastedはfoodを修飾。only because of their shapeで拒否の理由を形だけに限定する。別の言い方: Turning vegetables away solely because of their shape leads to more food being wasted."},{"id":"g2-reason-005","q":"TOPIC: Should schools offer students basic cooking lessons?\nPosition: Agree","q_ja":"学校は生徒に基本的な料理の授業を行うべきか。立場：賛成。","choices":[{"t":"Cooking lessons require equipment that some schools may find too expensive to buy.","why":"道具を買う費用という負担で、料理の授業に反対する理由になる。"},{"t":"My classmates and I cooked vegetable soup in our school kitchen last Thursday.","why":"一度の授業の体験だけで、料理を学ぶ一般的な利点を示していない。"},{"t":"Schools should offer cooking lessons because learning to cook at school is worthwhile.","why":"料理を学ぶ価値があるという主張の繰り返しで、具体的な理由がない。"},{"t":"Some schools have special rooms where students cook meals during their afternoon lessons.","why":"授業の場所や時間という事実だけで、授業を行う理由を述べていない。"},{"t":"Schools should invite local musicians to perform at more events during the year.","why":"音楽家を学校行事に招く提案で、料理の授業の理由から外れている。"},{"t":"Basic cooking skills help students prepare healthy meals when they start liv ":"Schools may list the names of both printed and digital textbooks in documents sent to parents.","why":"保護者への案内内容という事実で、置き換えの不利益を説明していない。"}],"answer":4,"point":"すべてを置き換える提案では、一つの問題が利用全体に及ぼす影響を考える。","level":3,"drive":{"ja":"学校は紙の教科書をすべてデジタル教科書に置き換えるべきか。反対の理由を英語で一文。","en":"If a device stops working, students may lose access to every textbook they need for lessons."},"explain":"if節が条件、主節はstudentsが主語。may lose access toで利用不能の可能性を示し、提案のリスクを論じる。別の言い方: Broken devices may block access to all textbooks."},{"id":"g2-reason-208","q":"TOPIC: Should companies encourage employees to take short exercise breaks?\nPosition: Agree","q_ja":"会社は従業員に短い運動休憩を取るよう勧めるべきか。立場は賛成。","choices":[{"t":"Short exercise breaks can reduce the physical discomfort caused by sitting at a desk for hours.","why":"正解。長時間座ることで生じる体の不快感を和らげる利点が、運動休憩を勧める理由になる。"},{"t":"Frequent exercise breaks may interrupt meetings and make it harder for teams to follow shared schedules.","why":"会議や予定への悪影響で、運動休憩を勧めることへの反対理由になる。"},{"t":"Office exercise breaks sometimes include stretching arms and legs while standing beside a chair or desk.","why":"運動の具体的な動作の説明だけで、従業員への利点を示していない。"},{"t":"An employee in my office stretched beside the window before yesterday's meeting with our sales team.","why":"一人の従業員の一度の行動で、一般的な効果を説明する理由になっていない。"},{"t":"Employees who leave their desks to exercise may be unavailable when customers need an immediate response.","why":"顧客への対応が遅れる可能性という欠点で、賛成の立場を支えない。"},{"t":"Company notices about exercise breaks may appear on office walls or in messages sent to staff.","why":"休憩の案内方法を述べただけで、勧めるべき理由を説明していない。"}],"answer":0,"point":"活動の手順を説明する文と、健康への効果を説明する文を区別する。","level":2,"drive":{"ja":"会社は従業員に短い運動休憩を取るよう勧めるべきか。賛成の理由を英語で一文。","en":"Short exercise breaks can reduce the physical discomfort caused by sitting at a desk for hours."},"explain":"Short exercise breaksが主語、reduceが動詞。caused byで不調の原因を絞り、対策の効果を論じる。別の言い方: Exercise breaks can ease discomfort from sitting."},{"id":"g2-reason-209","q":"TOPIC: Should towns build more public playgrounds?\nPosition: Agree","q_ja":"町は公共の遊び場をもっと作るべきか。立場は賛成。","choices":[{"t":"Building new playgrounds costs towns money for land and equipment.","why":"土地や遊具の費用という負担で、増設に反対する側の理由になる。"},{"t":"Public playgrounds often have swings and slides for local children.","why":"遊具の種類を説明しただけで、遊び場を増やす利点がない。"},{"t":"My cousin played on a slide near our home yesterday.","why":"いとこの一度の体験だけで、公共の遊び場を増やす一般的な理由にならない。"},{"t":"Noise from busy playgrounds may disturb people in nearby houses.","why":"近隣住民への騒音という欠点で、増設に賛成する理由ではない。"},{"t":"Playground signs usually show the name of the local town.","why":"看板の表示内容という事実だけで、増設すべき理由を説明していない。"},{"t":"Public playgrounds give children places to play without paying money.","why":"正解。無料で遊べる場所が増えるという地域の子どもへの利点がある。"}],"answer":5,"point":"公共施設の理由では、利用者が得られる身近な利点を具体的に示す。","level":1,"drive":{"ja":"町は公共の遊び場をもっと作るべきか。賛成の理由を英語で一文。","en":"Public playgrounds give children places to play without paying money."},"explain":"Public playgroundsが主語、giveが動詞で、to playはplacesを修飾。without＋動名詞で不要な負担を示し、利点を論じる。別の言い方: Public playgrounds are free to use."},{"id":"g2-reason-210","q":"TOPIC: Should local museums offer free admission to children?\nPosition: Agree","q_ja":"地域の博物館は子どもの入館を無料にするべきか。立場は賛成。","choices":[{"t":"Free admission for children could reduce the money museums receive to repair displays and protect collections.","why":"展示の修理や資料の保護に使う収入が減る欠点で、無料化への反対理由になる。"},{"t":"Museum admission prices for adults and children are usually printed on signs beside the ticket counter.","why":"入館料の表示場所の事実だけで、子どもを無料にする理由を説明していない。"},{"t":"Free admission would make museum visits more affordable for families who want their children to learn history.","why":"正解。歴史を学ばせたい家庭の費用負担を軽くできるため、子どもの入館無料化を支持する理由になる。"},{"t":"My parents took my younger brother to a free museum during our summer holiday by the sea.","why":"家族の一度の旅行体験で、一般の家庭にとっての利点を説明していない。"},{"t":"Museums that admit children free may need extra staff to manage larger groups during busy holiday periods.","why":"職員を増やす必要という負担
