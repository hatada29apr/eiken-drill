語1文で。市民参加は環境研究の範囲と科学への理解を広げるが、一貫した指導と確認によって情報の質を守る必要がある。","en":"Public involvement broadens environmental research and scientific understanding, provided that consistent guidance and verification safeguard the quality of information collected by volunteers."},"level":3},{"id":"p1-summary-006","q":"To support struggling rural businesses, a regional authority has moved some administrative offices out of the capital. A new branch employing 60 people has increased spending in nearby shops. Relocation may distribute economic activity more evenly, yet employees sometimes resist moving because their partners cannot find suitable work. Its success therefore depends not only on office investment but also on employment opportunities for accompanying family members.","q_ja":"地方の事業者を支えるため、ある広域行政機関は一部の事務所を中心都市から移した。60人が働く新拠点は近隣商店での支出を増やした。移転は経済活動の分散につながるが、配偶者の仕事が見つからず抵抗する職員もいるため、家族の就業機会も成功に必要である。","choices":[{"t":"Relocation may distribute economic activity more evenly, yet employees sometimes resist moving because their partners cannot find suitable work in areas receiving new offices.","why":"本文の表現をほぼそのまま取り出しており、成功条件の言い換えとして不十分。"},{"t":"Moving a branch with 60 employees increases spending in nearby shops, but accompanying partners need suitable employment if relocation is to achieve its aims.","why":"60人の拠点と近隣商店という具体例を残している。"},{"t":"Administrative relocation distributes economic benefits more widely, but governments must provide permanent wage subsidies to local employers before employees' families will agree to move.","why":"地元企業への恒久的な賃金補助が必要だという条件は本文にない。"},{"t":"Moving administrative workplaces away from the capital increases spending in surrounding businesses, supporting struggling rural economies through the purchases made by newly arrived public employees.","why":"地域への経済効果だけを扱い、配偶者の雇用と移転への抵抗を落としている。"},{"t":"Relocating government offices may spread economic benefits geographically, but effective implementation requires employment prospects for employees' families alongside investment in the offices themselves.","why":"正解。経済活動の分散という目的と、家族の就業機会という成功条件を結ぶ。"},{"t":"Moving public offices invariably revitalizes every rural economy, and creating jobs for accompanying partners completely removes employee resistance to relocation regardless of other personal circumstances.","why":"すべての地域が必ず再生し、家族の雇用だけで抵抗が完全になくなるという断定は過剰。"}],"answer":4,"point":"経済活動の分散という目的と、家族の就業機会という成功条件を結ぶ。","drive":{"ja":"次の段落の要点を英語1文で。行政機関の移転は経済的恩恵を地域に分散させ得るが、施設投資とともに職員の家族の就業機会を確保する必要がある。","en":"Relocating government offices may spread economic benefits geographically, but effective implementation requires employment prospects for employees' families alongside investment in the offices themselves."},"level":2},{"id":"p1-summary-007","q":"Some cities publish transport data so that private developers can create services for passengers. One application combines information from 12 bus routes to suggest convenient connections. Opening these records encourages innovation without requiring authorities to design every service themselves. Nevertheless, detailed travel records could reveal individuals' movements. Authorities must therefore remove identifying information before release, balancing the usefulness of shared data against passengers' privacy.","q_ja":"民間開発者が利用者向けサービスを作れるよう、交通データを公開する都市がある。あるアプリは12のバス路線の情報から乗り継ぎを提案する。公開は行政自身がすべてを開発しなくても革新を促すが、詳細な移動記録は個人の行動を明らかにし得るため、公開前に個人を識別できる情報を除く必要がある。","choices":[{"t":"Opening these records encourages innovation without requiring authorities to design every service themselves, but detailed travel records could reveal individuals' movements without privacy safeguards.","why":"本文の語句をほぼ写しており、識別情報を除くという対応もまとめていない。"},{"t":"An application using information from 12 bus routes improves connections, illustrating innovation through shared data that must exclude identifying details to protect passenger privacy.","why":"12路線と乗り継ぎアプリという数字・具体例が残っている。"},{"t":"Publishing transport data promotes private innovation, although authorities must charge developers licensing fees to compensate passengers whose personal travel records are included in shared datasets.","why":"開発者への料金請求と利用者への補償という仕組みは本文にない。"},{"t":"Public transport records enable private developers to suggest convenient connections, encouraging new passenger services without requiring public authorities to design each application with their own staff.","why":"民間のサービス開発という利点だけで、プライバシーへの危険と対処が欠けている。"},{"t":"Publishing transport records inevitably exposes every passenger's movements, making complete secrecy the only effective policy despite the potential advantages of private innovation in passenger services.","why":"全員の移動が必ず露見し、全面非公開しかないという断定は本文の方針に反する。"},{"t":"Sharing transport information stimulates private service development, but authorities must protect individual privacy by removing personal identifiers while preserving the data's practical value.","why":"正解。データ公開の利点とプライバシー保護を両立させる対応を残す。"}],"answer":5,"point":"データ公開の利点とプライバシー保護を両立させる対応を残す。","drive":{"ja":"次の段落の要点を英語1文で。交通情報の共有は民間のサービス開発を促すが、実用性を保ちつつ個人を識別する情報を除き、プライバシーを守る必要がある。","en":"Sharing transport information stimulates private service development, but authorities must protect individual privacy by removing personal identifiers while preserving the data's practical value."},"level":2},{"id":"p1-summary-008","q":"International partnerships allow universities with limited resources to share expensive research facilities. Under one agreement, scientists from four institutions use the same advanced microscope. Such cooperation expands access to equipment and encourages the exchange of expertise. However, disputes may arise over ownership of discoveries. Establishing clear rules before research begins is therefore crucial to maintaining trust and ensuring that the benefits of collaboration are fairly distributed.","q_ja":"国際連携によって、資源の限られた大学も高価な研究設備を共同利用できる。ある協定では4機関の研究者が高度な顕微鏡を共有する。設備へのアクセスと専門知識の交流が広がる一方、発見の権利を巡る争いもあり得るため、開始前の明確なルールが信頼と利益の公平な配分に重要である。","choices":[{"t":"Such cooperation expands access to equipment and encourages the exchange of expertise, but disputes may arise over ownership of discoveries without clear rules before research begins.","why":"本文の表現をほぼそのまま組み合わせており、要点を自分の表現に置き換えていない。"},{"t":"Scientists from four institutions share an advanced microscope and expertise through international cooperation, but clear ownership rules are needed beforehand to distribute research benefits fairly.","why":"4機関と顕微鏡という数字・具体例が残っている。"},{"t":"International academic cooperation broadens access to research resources and expertise, but prior agreements on discovery ownership are essential for trust and equitable sharing of benefits.","why":"正解。資源・知識の共有という利点と、権利の事前合意という条件をまとめる。"},{"t":"International university partnerships expand access to equipment and knowledge, but participating institutions must transfer ownership of all discoveries to an independent global agency before research begins.","why":"発見の権利を国際機関へすべて移すという条件は本文にない。"},{"t":"Universities with limited resources gain access to expensive research facilities through international agreements, while scientists exchange expertise by using equipment that their institutions could not otherwise afford.","why":"設備と知識の共有という利点だけで、権利を巡る問題と事前のルールが抜けている。"},{"t":"International research partnerships guarantee equal scientific opportunities for all universities, while advance ownership agreements permanently eliminate every dispute and ensure complete trust among all participating scientific institutions.","why":"すべての大学の平等や、あらゆる争いの永久的な解消を保証するのは言い過ぎ。"}],"answer":2,"point":"資源・知識の共有という利点と、権利の事前合意という条件をまとめる。","drive":{"ja":"次の段落の要点を英語1文で。大学の国際協力は研究資源と専門知識へのアクセスを広げるが、信頼と公平な利益配分には発見の権利に関する事前合意が必要である。","en":"International academic cooperation broadens access to research resources and expertise, but prior agreements on discovery ownership are essential for trust and equitable sharing of benefits."},"level":3},{"id":"p1-summary-009","q":"Public agencies increasingly offer essential services through digital platforms, reducing paperwork and travel for many residents. A town, for instance, now accepts housing applications through a website rather than requiring visits to its offices. Nevertheless, people without reliable internet access or sufficient digital skills may find these services harder to use. Retaining personal assistance is therefore necessary to prevent administrative efficiency from widening inequalities in access.","q_ja":"行政機関は重要なサービスをデジタル化し、多くの住民の書類作業や移動を減らしている。ある町では窓口訪問の代わりに住宅の申請をウェブで受け付ける。しかし、安定した通信環境や十分な操作技能のない人には利用が難しくなるため、利用格差を広げないよう対人支援を残す必要がある。","choices":[{"t":"People without reliable internet access or sufficient digital skills may find these services harder to use, so retaining personal assistance is therefore necessary for access.","why":"本文の表現をほぼ写しており、効率化の利点も要約していない。"},{"t":"Online housing applications reduce paperwork and office visits, but residents lacking reliable internet or digital skills still need personal assistance to access these services.","why":"住宅申請と窓口訪問という具体例を残したままで、行政サービス全体に一般化していない。"},{"t":"Digital public services improve administrative efficiency, but agencies must distribute free computers to every resident before replacing office procedures with applications through online platforms.","why":"全住民への無料のコンピューター配布という要件は本文にない。"},{"t":"Residents with reliable internet access avoid office visits and paperwork through digital platforms, making essential administrative procedures more convenient for people with sufficient digital skills.","why":"利用できる人の利便性だけで、利用が難しい人への支援が欠けている。"},{"t":"Digitizing public services streamlines administration for many users, but continued human support is essential to preserve access for residents facing technological barriers.","why":"正解。効率化を認めつつ、技術面で困難を抱える人への支援を残す。"},{"t":"Digital administration inevitably denies essential services to all residents lacking advanced technical expertise, making the complete abandonment of online platforms necessary to secure equal access.","why":"高度な技能がない人は全員利用できず、オンラインを全面廃止すべきだという断定は過剰。"}],"answer":4,"point":"効率化を認めつつ、技術面で困難を抱える人への支援を残す。","drive":{"ja":"次の段落の要点を英語1文で。行政サービスのデジタル化は多くの利用者の手続きを効率化するが、技術的な障壁のある住民の利用を守るため対人支援が必要である。","en":"Digitizing public services streamlines administration for many users, but continued human support is essential to preserve access for residents facing technological barriers."},"level":2},{"id":"p1-summary-010","q":"Some governments require producers to take responsibility for products after consumers discard them. Under one scheme, electronics companies pay for collecting used televisions and recovering valuable materials. Shifting disposal costs to manufacturers encourages designs that are easier to repair or recycle. However, compliance may place a heavier burden on smaller firms. Flexible payment arrangements could preserve this environmental incentive while reducing pressure on businesses with fewer resources.","q_ja":"消費者が捨てた製品への責任を生産者に求める政府がある。ある制度では電子機器メーカーが使用済みテレビの回収と有用な素材の再生に費用を払う。処分費用の移転は修理・再資源化しやすい設計を促すが、小規模企業の負担が重くなり得るため、柔軟な支払い方法が環境面の誘因と負担軽減の両立に役立つ。","choices":[{"t":"Producer responsibility encourages sustainable product design, but adaptable payment terms may ease the disproportionate financial strain on smaller firms without weakening environmental incentives.","why":"正解。環境面の誘因と企業規模による負担差を残し、柔軟な支払いで結ぶ。"},{"t":"Shifting disposal costs to manufacturers encourages designs that are easier to repair or recycle, but compliance may place a heavier burden on smaller firms.","why":"本文の語句をほぼそのままつなぎ、柔軟な支払いという対応策も落としている。"},{"t":"Electronics companies funding used television collection and material recovery face incentives to improve designs, while flexible payments could reduce the burden on smaller producers.","why":"電子機器メーカーとテレビ回収という具体例が残っている。"},{"t":"Making producers responsible for discarded goods promotes sustainable design, but governments must exempt smaller firms entirely and recover their unpaid costs through higher consumer taxes.","why":"小規模企業の全面免除や消費者への増税は本文にない。"},{"t":"Manufacturers paying disposal costs have an incentive to design products that are easier to repair or recycle, supporting material recovery after consumers discard unwanted goods.","why":"設計改善の誘因だけを述べ、小規模企業の負担と支払い方法の調整が抜けている。"},{"t":"Producer responsibility completely eliminates waste and guarantees affordable compliance for every company, making additional financial flexibility unnecessary regardless of differences in business size or resources.","why":"廃棄物の全廃と全企業の負担可能性を保証し、柔軟性も不要とするのは本文に反する。"}],"answer":0,"point":"環境面の誘因と企業規模による負担差を残し、柔軟な支払いで結ぶ。","drive":{"ja":"次の段落の要点を英語1文で。生産者責任は持続可能な製品設計を促すが、小規模企業の過重な負担は環境面の誘因を保つ柔軟な支払い条件で軽減し得る。","en":"Producer responsibility encourages sustainable product design, but adaptable payment terms may ease the disproportionate financial strain on smaller firms without weakening environmental incentives."},"level":3},{"id":"p1-summary-101","grade":"p1","type":"summary","level":2,"q":"Local governments are funding digital support at public offices. Trained staff help residents use online services, making public support easier to obtain. For example, older people learn to apply for housing assistance on office computers. This support also reduces waiting times because fewer applications contain mistakes. Residents without internet access receive help as well. Consequently, digital support improves access to public services and helps offices process requests faster.","q_ja":"地方自治体は公共窓口でのデジタル支援に資金を出している。研修を受けた職員が住民によるオンラインサービスの利用を手伝い、公的支援を受けやすくしている。例えば、高齢者は窓口のコンピューターで住宅支援の申請方法を学ぶ。申請の不備が減るため、この支援は待ち時間も短縮する。インターネットを利用できない住民も支援を受ける。その結果、デジタル支援は公共サービスの利用を容易にし、窓口での申請処理を速める。","choices":[{"t":"Digital support improves access to public services and helps offices process requests faster by reducing application mistakes.","why":"本文の結論をほぼそのまま使っており、要点を自分の言葉に言い換えていない。"},{"t":"Public investment in digital assistance improves access to essential services while reducing delays for people needing support.","why":"正解。公的支援の利用のしやすさと処理の迅速化を、具体例を省いて別の表現でまとめている。"},{"t":"Teaching older people to request housing assistance on office computers improves service access and speeds up application processing.","why":"高齢者が窓口のコンピューターで住宅支援を申請するという具体例が残っており、段落全体を一般化していない。"},{"t":"Online guidance makes public services more accessible and speeds up applications while allowing governments to close local offices.","why":"利用のしやすさと処理の迅速化に加え、本文にない窓口の閉鎖を述べている。"},{"t":"Residents receive guidance on using online services from trained staff at public offices even without home internet access.","why":"支援を受ける方法だけをまとめており、申請の不備が減って処理が速くなるという要点が抜けている。"},{"t":"Government funding for digital guidance ensures that every resident receives public assistance immediately without making any application mistakes.","why":"利用や処理の改善を、全住民が不備なく直ちに支援を受けられるという保証にまで言い過ぎている。"}],"answer":1,"point":"具体例を省き、公共サービスを利用しやすくなることと処理が速くなることの両方を言い換える。","drive":{"ja":"次の段落の要点を英語1文で。公的なデジタル利用支援は、公共サービスを利用しやすくし、手続きの待ち時間も減らす。","en":"Public investment in digital assistance improves access to essential services while reducing delays for people needing support."}},{"id":"p1-summary-102","grade":"p1","type":"summary","level":2,"q":"Many towns are improving public buildings to save energy. Better windows and heating systems reduce running costs, leaving more money for public services. One town replaced windows in three libraries and used the savings to buy books. Nevertheless, these improvements require substantial spending at the start. Towns must plan their budgets carefully so that the cost of construction does not reduce funding for essential services.","q_ja":"多くの町が省エネルギーのために公共施設を改修している。性能のよい窓や暖房設備は運営費を減らし、公共サービスに使える資金を増やす。ある町は図書館3館の窓を交換し、節約した資金で本を購入した。それでも、こうした改修には初めに多額の支出が必要になる。工事費によって不可欠なサービスへの予算が減らないよう、町は慎重に予算を計画しなければならない。","choices":[{"t":"Replacing windows in three libraries saves energy and provides money for books although construction requires careful financial planning.","why":"図書館3館の窓や本の購入という具体例と数字を残しており、公共施設全体の話としてまとめていない。"},{"t":"Energy improvements to public buildings pay for themselves immediately and provide enough savings to cover every public service.","why":"初期費用への注意が必要なのに、すぐに費用を回収し、すべての公共サービスを賄えると言い過ぎている。"},{"t":"Better windows and heating systems reduce running costs, leaving more money for public services despite substantial spending initially.","why":"本文の窓や暖房設備についての文をほぼ写しており、要点を別の表現にまとめていない。"},{"t":"Improving energy efficiency lowers public spending and supports services while national grants cover the full cost of construction.","why":"国の補助金が工事費の全額を賄うという、本文にない資金源を加えている。"},{"t":"Renovating public buildings reduces energy costs and protects services although the initial expense requires careful budget planning.","why":"正解。改修による経費削減とサービス維持の利点、初期費用に備える必要を、具体例を省いてまとめている。"},{"t":"Public buildings use less energy after improvements to their windows and heating systems, freeing money for additional services.","why":"設備の改善と節約という利点だけを説明し、初期費用と慎重な予算計画の必要性を落としている。"}],"answer":4,"point":"経費削減という利点だけでなく、初期費用への備えという注意点も残す。","drive":{"ja":"次の段落の要点を英語1文で。公共施設の改修はエネルギー費を減らしてサービスを支えるが、初期費用を考えた慎重な予算計画が必要だ。","en":"Renovating public buildings reduces energy costs and protects services although the initial expense requires careful budget planning."}},{"id":"p1-summary-103","grade":"p1","type":"summary","level":2,"q":"Public universities are sharing expensive research equipment. Sharing reduces the need for separate purchases and gives smaller institutions access to advanced tools. For instance, four universities use a single machine to examine water pollution. This arrangement supports research without increasing public spending. However, researchers may need the same equipment at the same time. Clear booking rules are therefore necessary to give each institution a fair chance to use it.","q_ja":"公立大学は高価な研究設備を共同利用している。共同利用によって個別に購入する必要が減り、小規模な機関も高度な機器を使えるようになる。例えば、4大学が1台の装置で水質汚染を調べている。この仕組みは公的支出を増やさずに研究を支える。しかし、研究者が同じ時期に同じ設備を必要とする場合がある。そのため、各機関に公平な利用機会を与えるには、明確な予約ルールが必要である。","choices":[{"t":"Shared research equipment lowers public spending and expands scientific opportunities provided that institutions coordinate its use fairly.","why":"正解。設備の共同利用による節約と研究機会の拡大、公平な利用調整という条件を言い換えてまとめている。"},{"t":"Sharing reduces the need for separate purchases and gives smaller institutions access to advanced tools under clear booking rules.","why":"本文の共同利用の利点を説明する文をほぼ写しており、表現を十分に言い換えていない。"},{"t":"Sharing scientific tools reduces university costs and widens research access while private companies take responsibility for managing bookings.","why":"民間企業が予約管理を担当するという、本文にない運営方法を付け加えている。"},{"t":"Four universities examine water pollution with a single machine, limiting equipment costs while requiring fair arrangements for shared access.","why":"4大学、1台の装置、水質汚染の調査という具体例と数字を残している。"},{"t":"Smaller institutions gain access to advanced scientific tools through equipment sharing, enabling them to conduct research with other universities.","why":"小規模機関の研究機会という利点に偏り、購入費の節約と公平な利用ルールの必要性をまとめていない。"},{"t":"Common equipment removes financial barriers to university research and guarantees immediate access whenever scientists need to use advanced tools.","why":"費用の障壁がなくなり、必要なときに必ずすぐ使えると断定しており、利用が重なるという問題も無視している。"}],"answer":0,"point":"共同利用の利点をまとめたうえで、公平な利用調整が必要という条件も残す。","drive":{"ja":"次の段落の要点を英語1文で。研究設備の共同利用は公的支出を抑えて研究機会を広げるが、機関同士で公平に利用を調整する必要がある。","en":"Shared research equipment lowers public spending and expands scientific opportunities provided that institutions coordinate its use fairly."}},{"id":"p1-summary-104","grade":"p1","type":"summary","level":2,"q":"Some cities offer financial support for repairing household products. These payments help families save money and reduce waste by keeping products in use longer. In one city, residents receive twenty dollars toward repairing a broken washing machine. However, financial support alone is not enough. Without trained repair workers nearby, residents may still replace damaged products. The policy therefore needs a reliable local repair service to achieve its aims.","q_ja":"一部の都市は家庭用品の修理に金銭的な支援を提供している。この支給は、製品を長く使い続けることで家計の節約とごみの削減に役立つ。ある都市では、住民は壊れた洗濯機の修理に20ドルの支援を受ける。しかし、金銭的な支援だけでは十分ではない。近くに熟練した修理業者がいなければ、住民は結局、壊れた製品を買い替えることがある。そのため、この政策が目的を達成するには、地域で信頼できる修理サービスが必要である。","choices":[{"t":"Residents receiving twenty dollars for washing machine repairs save money and reduce waste if skilled repair workers are available.","why":"20ドルの支援や洗濯機の修理という具体例を残しており、政策の要点を一般化していない。"},{"t":"These payments help families save money and reduce waste by keeping products in use longer with trained repair workers.","why":"支給の効果を述べた本文の文をほぼそのまま使っており、要点を別の表現に言い換えていない。"},{"t":"Financial aid for repairs cuts living costs and waste while requiring shops to offer every resident free replacement products.","why":"店に無料の代替製品を提供させるという、本文にない義務を加えている。"},{"t":"Repair subsidies reduce household expenses and material waste although their success depends on access to skilled workers.","why":"正解。修理支援による家計負担とごみの削減、熟練した修理業者の必要性を、具体例を省いてまとめている。"},{"t":"Financial support encourages families to keep household products longer, helping them spend less money and throw away fewer items.","why":"製品を長く使う利点だけを説明しており、地域の修理業者が必要という政策の条件が抜けている。"},{"t":"City repair payments end household product waste and ensure that families never need to buy replacement goods in future.","why":"ごみがなくなり、今後は買い替えが一切不要になると言い過ぎており、修理業者が必要という条件も落としている。"}],"answer":3,"point":"修理支援の効果と、その効果を実現するために必要な人材の両方を残す。","drive":{"ja":"次の段落の要点を英語1文で。修理への補助は家計負担とごみを減らすが、効果を上げるには熟練した修理業者を利用できる必要がある。","en":"Repair subsidies reduce household expenses and material waste although their success depends on access to skilled workers."}}],"template":[{"id":"p1-template-001","q":"I am firmly ___ that governments should establish ethical guidelines for technologies capable of influencing public opinion.","q_ja":"私は、世論に影響を及ぼし得る技術に対して、政府が倫理指針を定めるべきだと固く確信している。","choices":[{"t":"committed","why":"「尽力している」という意味で、取り組む対象は通常、前置詞を使って示す。この形では確信を表せない。"},{"t":"convinced","why":"正解。確信していることを表す定型表現で、後ろの節に自分の立場を示せる。"},{"t":"dedicated","why":"「専念している」という意味で、専念する対象を示す前置詞が必要。この形では確信を表せない。"},{"t":"devoted","why":"「献身的な」という意味で、献身の対象を示す前置詞が必要。この形では確信を表せない。"}],"answer":1,"point":"序論では、固く確信していることを表す定型文の後ろに主張を置き、続く二つの本論で根拠を示す。","drive":{"ja":"序論で、政府は世論に影響する技術の倫理指針を定めるべきだと、固い確信を示してください。","en":"I am firmly convinced that governments should establish ethical guidelines for technologies capable of influencing public opinion."},"level":1},{"id":"p1-template-002","q":"There are two main ___ why I support allocating more public funding to scientific research that addresses environmental challenges.","q_ja":"環境問題に取り組む科学研究への公的資金の配分増加を私が支持するのには、主に二つの理由がある。","choices":[{"t":"causes","why":"出来事を引き起こす原因を指す。自分の支持理由を後ろの節で示す定型表現には合わない。"},{"t":"factors","why":"結果に影響する要因を指す。自分が支持する理由を示すこの定型表現には合わない。"},{"t":"points","why":"論点や要点を指す。支持する理由を後ろの節で説明するこの形には合わない。"},{"t":"reasons","why":"正解。自分が支持する理由を示す定型表現になり、二つの本論段落を予告できる。"}],"answer":3,"point":"序論の末尾で主な理由が二つあると予告し、本論の第1段落と第2段落で一つずつ説明する。","drive":{"ja":"序論の末尾で、環境問題に取り組む科学研究への公的資金の増加を支持する理由が二つあると予告してください。","en":"There are two main reasons why I support allocating more public funding to scientific research that addresses environmental challenges."},"level":1},{"id":"p1-template-003","q":"In ___ of these points, I believe that international cooperation is essential to ensuring equitable access to essential medicines.","q_ja":"これらの論点を踏まえると、必要不可欠な医薬品への公平なアクセスを確保するには国際協力が不可欠だと私は考える。","choices":[{"t":"light","why":"正解。前後の前置詞と組み合わせると「～を踏まえて」という定型表現になり、本論を受けて結論を導ける。"},{"t":"sight","why":"視界を表す名詞。前後の前置詞と組み合わせても、論点を考慮するという意味にはならない。"},{"t":"perspective","why":"視点を表す名詞。この前置詞の組み合わせでは「～を踏まえて」という定型表現にならない。"},{"t":"focus","why":"焦点を表す名詞。この前置詞の組み合わせでは、論点を踏まえて結論を導く表現にならない。"}],"answer":0,"point":"結論では「これらの論点を踏まえて」という定型表現で本論を受け、序論で示した立場を再提示する。","drive":{"ja":"結論で、これらの論点を踏まえると、医薬品への公平なアクセスには国際協力が不可欠だと述べてください。","en":"In light of these points, I believe that international cooperation is essential to ensuring equitable access to essential medicines."},"level":2},{"id":"p1-template-004","q":"Taking these arguments into ___, I conclude that public transport should receive sustained investment to reduce dependence on private vehicles.","q_ja":"これらの議論を考慮すると、自家用車への依存を減らすため、公共交通機関に継続的な投資を行うべきだと私は結論づける。","choices":[{"t":"attention","why":"注意を表す名詞。この動詞と前置詞の組み合わせでは「考慮に入れる」という表現にならない。"},{"t":"concern","why":"懸念や関心を表す名詞。この位置では「考慮に入れる」という定型表現を作れない。"},{"t":"account","why":"正解。前の動詞と前置詞に続けると「～を考慮に入れる」という定型表現になる。"},{"t":"regard","why":"配慮を表す名詞だが、この動詞と前置詞の組み合わせでは使わない。"}],"answer":2,"point":"結論の冒頭を「これらの議論を考慮すると」という分詞構文にすると、本論から主張の再提示へつなげられる。","drive":{"ja":"結論で、これらの議論を考慮すると、車への依存を減らすために公共交通への継続的な投資が必要だと述べてください。","en":"Taking these arguments into account, I conclude that public transport should receive sustained investment to reduce dependence on private vehicles."},"level":1},{"id":"p1-template-005","q":"On ___, I believe that stricter regulation of personal data is necessary to protect citizens from commercial exploitation.","q_ja":"総合的に判断すると、商業的な搾取から市民を守るには、個人データに関する規制の強化が必要だと私は考える。","choices":[{"t":"equilibrium","why":"均衡を表す名詞だが、この前置詞の後ろでは「総合的に判断すると」という定型表現にならない。"},{"t":"balance","why":"正解。直前の前置詞と組み合わせると、複数の点を比較して下す総合的な判断を示せる。"},{"t":"stability","why":"安定を表す名詞。この位置では、議論を総合して判断するという意味にならない。"},{"t":"proportion","why":"比率や釣り合いを表す名詞。この位置では、総合的な判断を示す定型表現にならない。"}],"answer":1,"point":"結論で総合的な判断を示す定型表現を使うと、検討した論点を受けて自分の立場を再確認できる。","drive":{"ja":"結論で、総合的に判断すると、市民を商業的な搾取から守るために個人データの規制強化が必要だと述べてください。","en":"On balance, I believe that stricter regulation of personal data is necessary to protect citizens from commercial exploitation."},"level":2},{"id":"p1-template-006","q":"To ___ up, governments should expand access to vocational education, which enables workers to adapt to technological change.","q_ja":"要約すると、労働者が技術の変化に適応できるよう、政府は職業教育を受ける機会を拡大すべきである。","choices":[{"t":"count","why":"数を数えるという意味。この組み合わせでは、議論を要約して結論を示す表現にならない。"},{"t":"total","why":"合計するという意味。この組み合わせでは、議論を要約する定型表現にならない。"},{"t":"add","why":"足し合わせるという意味。この組み合わせでは、後ろの主張を議論の要約として導入できない。"},{"t":"sum","why":"正解。後ろの語と組み合わせると「要約すると」という定型表現になり、結論の主張を導ける。"}],"answer":3,"point":"結論の冒頭で議論を要約すると示し、主張を再提示する。関係詞の非制限用法で主張の意味を補足できる。","drive":{"ja":"結論で、要約すると、技術の変化に労働者が適応できるよう政府は職業教育の機会を拡大すべきだと述べてください。","en":"To sum up, governments should expand access to vocational education, which enables workers to adapt to technological change."},"level":1},{"id":"p1-template-007","q":"In ___, I remain convinced that reducing economic inequality requires not only financial assistance but also investment in education.","q_ja":"結論として、経済格差を縮小するには金銭的な支援だけでなく教育への投資も必要だと、私は引き続き確信している。","choices":[{"t":"conclusion","why":"正解。直前の前置詞と組み合わせると「結論として」という定型表現になり、立場の再提示を導ける。"},{"t":"closure","why":"終結を表す名詞だが、この位置では論述の結論を導く定型表現にならない。"},{"t":"completion","why":"完了を表す名詞。この位置では「結論として」という意味の定型表現にならない。"},{"t":"ending","why":"終わりを表す名詞。この前置詞と組み合わせても、結論を導入する定型表現にはならない。"}],"answer":0,"point":"結論では序論の立場を再提示し、「～だけでなく～も」という構文で本論の二つの観点を簡潔にまとめられる。","drive":{"ja":"結論として、経済格差の縮小には金銭的支援だけでなく教育への投資も必要だと、確信を改めて示してください。","en":"In conclusion, I remain convinced that reducing economic inequality requires not only financial assistance but also investment in education."},"level":1},{"id":"p1-template-008","q":"I support greater transparency in public spending on the ___ that citizens are entitled to scrutinize how their taxes are used.","q_ja":"市民には税金の使途を精査する権利があることを根拠に、私は公的支出の透明性を高めることを支持する。","choices":[{"t":"motives","why":"行動の動機を指す名詞。この形では、後ろの節を主張の根拠として導入する定型表現にならない。"},{"t":"causes","why":"出来事の原因を指す名詞。この形では、後ろの節を支持の根拠として導入できない。"},{"t":"grounds","why":"正解。前の前置詞と冠詞、後ろの接続詞を合わせると「～という根拠で」という定型表現になる。"},{"t":"origins","why":"物事の起源を指す名詞。この形では、主張の根拠を示す定型表現にならない。"}],"answer":2,"point":"序論では「～という根拠で」という定型表現により、立場とその基本的な根拠を示せる。本論で根拠を詳しく展開する。","drive":{"ja":"序論で、市民には税金の使途を精査する権利があることを根拠に、公的支出の透明性向上を支持してください。","en":"I support greater transparency in public spending on the grounds that citizens are entitled to scrutinize how their taxes are used."},"level":3},{"id":"p1-template-009","q":"Having considered these arguments, I have ___ to the conclusion that international institutions should strengthen their efforts to resolve regional conflicts.","q_ja":"これらの議論を検討した結果、国際機関は地域紛争の解決に向けた取り組みを強化すべきだという結論に私は至った。","choices":[{"t":"arrived","why":"結論に至ることを表す場合、後ろには別の前置詞を用いる。ここにある前置詞とは組み合わせない。"},{"t":"come","why":"正解。後ろの前置詞と名詞句を合わせると「～という結論に至る」という定型表現になる。"},{"t":"reached","why":"結論に達することを表せるが、結論を表す名詞句を直接続けるため、ここにある前置詞が余分になる。"},{"t":"approached","why":"近づくという意味で、対象の名詞句を直接続ける。この形では「結論に至った」を表せない。"}],"answer":1,"point":"結論では、議論を検討済みであることを完了形の分詞構文で示し、「結論に至る」という定型表現につなげられる。","drive":{"ja":"結論で、これらの議論を検討した結果、国際機関は地域紛争の解決に向けた取り組みを強化すべきだという結論に至ったと述べてください。","en":"Having considered these arguments, I have come to the conclusion that international institutions should strengthen their efforts to resolve regional conflicts."},"level":2},{"id":"p1-template-010","q":"I firmly believe that maintaining the independence of scientific research is ___ the utmost importance when governments allocate public funds.","q_ja":"政府が公的資金を配分する際、科学研究の独立性を維持することが極めて重要だと、私は固く信じている。","choices":[{"t":"with","why":"付随や手段などを示す前置詞。この位置では、後ろの名詞句と合わせて「極めて重要な」を表せない。"},{"t":"at","why":"地点や水準などを示す前置詞。この名詞句とは組み合わせず、「極めて重要な」という表現にはならない。"},{"t":"by","why":"手段や行為者などを示す前置詞。この位置では、後ろの名詞句と合わせて重要性を表せない。"},{"t":"of","why":"正解。後ろの名詞句と組み合わせると「極めて重要な」という意味になり、重要性を強調できる。"}],"answer":3,"point":"序論では固い信念を示す定型文に、重要性を表す前置詞と抽象名詞の表現を組み合わせ、主張を明確にできる。","drive":{"ja":"序論で、公的資金の配分に際して科学研究の独立性を維持することが極めて重要だと、固い信念を示してください。","en":"I firmly believe that maintaining the independence of scientific research is of the utmost importance when governments allocate public funds."},"level":2}],"vocab_ej":[{"id":"p1-vocab_ej-001","q":"Independent inspections help [[enhance]] public confidence in the safety of nuclear power plants.","q_ja":"独立した立場からの検査は、原子力発電所の安全性に対する国民の信頼を高めるのに役立つ。","choices":[{"t":"〜を取り替える","why":"「取り替える」は replace の意味で、信頼の程度を高めることとは異なる。"},{"t":"〜を高める","why":"正解。enhance は質や価値などを高める意味で、ここでは国民の信頼を強めることを表す。"},{"t":"〜を取り囲む","why":"「取り囲む」は形の似た encircle などの意味で、enhance の意味ではない。"},{"t":"〜を見積もる","why":"「見積もる」は estimate の意味で、信頼を高めるという文意に合わない。"}],"answer":1,"point":"enhance public confidence で「国民の信頼を高める」。質・効果・価値などを高める際に使う。","level":1,"accept":["高める","向上させる","〜を向上させる","強める","〜を強める"],"drive":{"ja":"独立した立場からの検査は、原子力発電所の安全性に対する国民の信頼を高めるのに役立つ。","en":"Independent inspections help enhance public confidence in the safety of nuclear power plants."}},{"id":"p1-vocab_ej-002","q":"Governments should [[phase out]] subsidies for fossil fuels gradually, allowing businesses enough time to invest in cleaner sources of energy.","q_ja":"政府は、企業がより環境負荷の低いエネルギー源に投資するための十分な時間を確保できるよう、化石燃料への補助金を段階的に廃止すべきだ。","choices":[{"t":"段階的に導入する","why":"これは phase in の意味で、phase out は制度などを段階的に終わらせることを表す。"},{"t":"一時的に停止する","why":"phase out は再開を前提とした一時停止ではなく、廃止に向けて徐々に減らすことを表す。"},{"t":"対象別に配分する","why":"補助金の配分方法を変える意味はなく、補助金自体をなくしていくという文意である。"},{"t":"段階的に廃止する","why":"正解。phase out は徐々に使用や実施をやめる意味で、企業に移行期間を与えるという後半ともつながる。"}],"answer":3,"point":"phase out は「段階的に廃止する」。導入を表す phase in と区別する。","level":2,"accept":["徐々に廃止する","〜を段階的に廃止する","段階的になくす","徐々になくす"],"drive":{"ja":"政府は、企業がより環境負荷の低いエネルギー源に投資するための十分な時間を確保できるよう、化石燃料への補助金を段階的に廃止すべきだ。","en":"Governments should phase out subsidies for fossil fuels gradually, allowing businesses enough time to invest in cleaner sources of energy."}},{"id":"p1-vocab_ej-003","q":"Although automation requires substantial initial investment, subsequent savings in operating costs may [[offset]] that expense without reducing the amount companies must pay at the outset.","q_ja":"自動化には多額の初期投資が必要だが、その後の運営費の節約によって、企業が当初支払わなければならない額を減らすことなく、その支出を相殺できる可能性がある。","choices":[{"t":"〜を相殺する","why":"正解。offset は別の利益などで負担を埋め合わせる意味で、後の節約が初期支出を補うことを表す。"},{"t":"〜を値引きする","why":"当初の支払額は減らないと明記されており、初期費用そのものを値引きする意味ではない。"},{"t":"〜を先送りする","why":"後の節約で支出を埋め合わせるのであり、初期費用の支払いを延期するとは述べていない。"},{"t":"〜を算定する","why":"費用を計算するという意味はなく、節約額が支出を埋め合わせる関係を表している。"}],"answer":0,"point":"offset an expense は「支出を相殺する」。支出自体の値引きや支払いの延期とは区別する。","level":3,"accept":["相殺する","埋め合わせる","〜を埋め合わせる","補う","〜を補う"],"drive":{"ja":"自動化には多額の初期投資が必要だが、その後の運営費の節約によって、企業が当初支払わなければならない額を減らすことなく、その支出を相殺できる可能性がある。","en":"Although automation requires substantial initial investment, subsequent savings in operating costs may offset that expense without reducing the amount companies must pay at the outset."}},{"id":"p1-vocab_ej-004","q":"Strict limits on construction help [[preserve]] natural habitats that would otherwise disappear as cities expand.","q_ja":"建設を厳しく制限することは、そうしなければ都市の拡大に伴って失われてしまう自然の生息地を保全するのに役立つ。","choices":[{"t":"〜を観察する","why":"「観察する」は observe の意味で、生息地を失われないように守ることとは異なる。"},{"t":"〜を予測する","why":"「予測する」は形の似た predict の意味で、preserve の意味ではない。"},{"t":"〜を保全する","why":"正解。preserve は損なわれたり失われたりしないよう守る意味で、建設の制限によって生息地を残すことを表す。"},{"t":"〜を予約する","why":"「予約する」は形の似た reserve の意味で、この文の preserve には当てはまらない。"}],"answer":2,"point":"preserve natural habitats で「自然の生息地を保全する」。文化遺産などを守る場合にも使う。","level":1,"accept":["保全する","保護する","〜を保護する","守る","〜を守る","保存する"],"drive":{"ja":"建設を厳しく制限することは、そうしなければ都市の拡大に伴って失われてしまう自然の生息地を保全するのに役立つ。","en":"Strict limits on construction help preserve natural habitats that would otherwise disappear as cities expand."}},{"id":"p1-vocab_ej-005","q":"Companies handling personal information must [[comply with]] privacy regulations, even when doing so increases the cost of developing new digital services.","q_ja":"個人情報を扱う企業は、新たなデジタルサービスの開発費が増える場合でも、プライバシーに関する規制を遵守しなければならない。","choices":[{"t":"〜を遵守する","why":"正解。comply with は規則や要求などに従う意味で、企業が規制を守る必要性を述べている。"},{"t":"〜を編集する","why":"「編集する」は形の似た compile と混同しやすい意味で、comply with は規制の編集を表さない。"},{"t":"〜と競争する","why":"「競争する」は compete with の意味で、規制に従うという文意には合わない。"},{"t":"〜を補完する","why":"「補完する」は complement の意味で、規制の不足を補うという文ではない。"}],"answer":0,"point":"comply with regulations で「規制を遵守する」。前置詞 with と一緒に覚える。","level":2,"accept":["遵守する","守る","〜を守る","従う","〜に従う","順守する","〜を順守する"],"drive":{"ja":"個人情報を扱う企業は、新たなデジタルサービスの開発費が増える場合でも、プライバシーに関する規制を遵守しなければならない。","en":"Companies handling personal information must comply with privacy regulations, even when doing so increases the cost of developing new digital services."}},{"id":"p1-vocab_ej-006","q":"Replacing trained inspectors with cheaper automated checks could [[compromise]] passenger safety if the system failed to detect faults that experienced staff would normally identify.","q_ja":"訓練を受けた検査員を低コストの自動検査に置き換えると、経験豊かな職員なら通常見つけられる欠陥をシステムが検知できない場合、乗客の安全を損なうおそれがある。","choices":[{"t":"〜で折り合う","why":"compromise には「妥協する」という意味もあるが、ここでは安全を目的語に取り、安全への悪影響を表す。"},{"t":"〜を保証する","why":"欠陥を見逃す可能性を述べているため、安全を確実にするという意味ではない。"},{"t":"〜を損なう","why":"正解。compromise は安全性などを損なう意味でも使われ、ここでは検知の失敗が安全を脅かすことを表す。"},{"t":"〜を評価する","why":"安全性を測定・評価するという意味はなく、検査方法の変更によって生じる危険を述べている。"}],"answer":2,"point":"compromise safety は「安全を損なう」。compromise の「妥協する」という意味と文型で区別する。","level":3,"accept":["損なう","危うくする","〜を危うくする","脅かす","〜を脅かす","低下させる"],"drive":{"ja":"訓練を受けた検査員を低コストの自動検査に置き換えると、経験豊かな職員なら通常見つけられる欠陥をシステムが検知できない場合、乗客の安全を損なうおそれがある。","en":"Replacing trained inspectors with cheaper automated checks could compromise passenger safety if the system failed to detect faults that experienced staff would normally identify."}},{"id":"p1-vocab_ej-007","q":"Local authorities need sufficient funding to [[implement]] policies aimed at reducing inequality in access to education.","q_ja":"地方自治体が教育を受ける機会の格差を縮めるための政策を実施するには、十分な資金が必要である。","choices":[{"t":"〜を暗示する","why":"「暗示する」は形の似た imply の意味で、政策を実行に移すこととは異なる。"},{"t":"〜を輸入する","why":"「輸入する」は形の似た import の意味で、implement の意味ではない。"},{"t":"〜を検討する","why":"ここでは政策を考慮する段階ではなく、実際に実行するための資金を述べている。"},{"t":"〜を実施する","why":"正解。implement は計画や政策などを実行に移す意味で、必要な資金についての文脈に合う。"}],"answer":3,"point":"implement policies で「政策を実施する」。計画を考える段階から実行に移す動詞。","level":1,"accept":["実施する","実行する","〜を実行する","実行に移す","〜を実行に移す"],"drive":{"ja":"地方自治体が教育を受ける機会の格差を縮めるための政策を実施するには、十分な資金が必要である。","en":"Local authorities need sufficient funding to implement policies aimed at reducing inequality in access to education."}},{"id":"p1-vocab_ej-008","q":"Unpaid internships may [[constitute]] a barrier to social mobility, since applicants from poorer households often cannot afford to work without a salary.","q_ja":"低所得世帯の応募者は無給で働く経済的余裕がないことが多いため、無給のインターンシップは社会的地位を向上させるうえでの障壁となる可能性がある。","choices":[{"t":"〜に貢献する","why":"「貢献する」は形の似た contribute to の意味で、constitute a barrier は障壁そのものになることを表す。"},{"t":"〜に相当する","why":"正解。constitute はあるものに当たる、またはそれを成すという意味で、ここでは障壁となることを表す。"},{"t":"〜に相談する","why":"「相談する」は形の似た consult の意味で、障壁を成すという文意には合わない。"},{"t":"〜を取り除く","why":"無給で働けない人の機会を制限するという文であり、障壁をなくす意味ではない。"}],"answer":1,"point":"constitute a barrier は「障壁となる」。constitute は「構成する」のほか「〜に相当する」も表す。","level":2,"accept":["相当する","〜に当たる","当たる","〜となる","〜を成す","構成する"],"drive":{"ja":"低所得世帯の応募者は無給で働く経済的余裕がないことが多いため、無給のインターンシップは社会的地位を向上させるうえでの障壁となる可能性がある。","en":"Unpaid internships may constitute a barrier to social mobility, since applicants from poorer households often cannot afford to work without a salary."}},{"id":"p1-vocab_ej-009","q":"Although the pilot reduced delays, the report offered only [[qualified]] support for expansion, noting that costs in rural areas remained uncertain.","q_ja":"試験的な導入によって遅延は減ったものの、報告書は、農村部での費用が依然として不確かなことを指摘し、拡大には留保付きの支持しか示さなかった。","choices":[{"t":"資格を備えた","why":"qualified は人について「資格のある」とも訳すが、ここで修飾しているのは人ではなく支持である。"},{"t":"全面的である","why":"only と費用への懸念が示すように支持には制限があり、全面的な賛成という意味ではない。"},{"t":"留保を伴った","why":"正解。qualified support は懸念や条件を伴う限定的な支持で、費用が不確かな点と対応する。"},{"t":"数値で示した","why":"「数値で示した」は quantified などに対応し、形の似た qualified のこの用法とは異なる。"}],"answer":2,"point":"qualified support は「留保付きの支持」。人の資格を表す qualified とは、修飾する名詞で区別する。","level":3,"accept":["留保付きの","留保つきの","条件付きの","条件つきの","限定的な","制限のある"],"drive":{"ja":"試験的な導入によって遅延は減ったものの、報告書は、農村部での費用が依然として不確かなことを指摘し、拡大には留保付きの支持しか示さなかった。","en":"Although the pilot reduced delays, the report offered only qualified support for expansion, noting that costs in rural areas remained uncertain."}},{"id":"p1-vocab_ej-010","q":"Investment in preventive healthcare may reduce public spending [[in the long run]] despite its initial costs.","q_ja":"予防医療への投資は、初期費用がかかるものの、長期的には公的支出を減らす可能性がある。","choices":[{"t":"長期的に見れば","why":"正解。in the long run は長い期間で考えた場合を表し、初期費用と将来の節約を対比している。"},{"t":"短期的に見れば","why":"これは in the short run の意味で、long が表す時間の長さと逆になる。"},{"t":"実施に先立って","why":"実施前という意味はなく、投資の効果を長い期間で評価する表現である。"},{"t":"定期的に繰り返し","why":"繰り返す頻度を表す熟語ではなく、長期的な結果について述べている。"}],"answer":0,"point":"in the long run は「長期的には」。当面の費用と将来の効果を比較する論述で使える。","level":1,"accept":["長期的には","長期的に","長い目で見れば","長い目で見ると","長期的な観点では"],"drive":{"ja":"予防医療への投資は、初期費用がかかるものの、長期的には公的支出を減らす可能性がある。","en":"Investment in preventive healthcare may reduce public spending in the long run despite its initial costs."}},{"id":"p1-vocab_ej-011","q":"Universities seeking to [[retain]] experienced researchers should provide stable employment, as short contracts may encourage them to accept positions at institutions abroad.","q_ja":"経験豊かな研究者を引き留めようとする大学は、短期契約だと研究者が海外の機関の職に就くよう促しかねないため、安定した雇用を提供すべきだ。","choices":[{"t":"〜を再訓練する","why":"「再訓練する」は形の似た retrain の意味で、ここでは研究者の技能を訓練し直す話ではない。"},{"t":"〜を引き留める","why":"正解。retain は保持する意味で、人を目的語に取るここでは研究者に組織にとどまってもらうことを表す。"},{"t":"〜を採用する","why":"新しく雇うことではなく、所属する研究者が海外へ移るのを防ぐという文意である。"},{"t":"〜を呼び戻す","why":"すでに去った人を戻すという意味はなく、研究者が離れずに残るようにすることを表す。"}],"answer":1,"point":"retain researchers は「研究者を引き留める」。retain は人・情報・権利などを保持する場合に使う。","level":2,"accept":["引き留める","引き止める","〜を引き止める","つなぎ留める","〜をつなぎ留める","確保し続ける"],"drive":{"ja":"経験豊かな研究者を引き留めようとする大学は、短期契約だと研究者が海外の機関の職に就くよう促しかねないため、安定した雇用を提供すべきだ。","en":"Universities seeking to retain experienced researchers should provide stable employment, as short contracts may encourage them to accept positions at institutions abroad."}},{"id":"p1-vocab_ej-012","q":"Although officials support the proposed dam, final approval remains [[subject to]] an independent review confirming that the project would not damage habitats downstream.","q_ja":"当局者は提案されているダムを支持しているが、最終承認には、その事業が下流の生息地を損なわないことを独立した審査で確認するという条件が依然として付いている。","choices":[{"t":"〜を話題とする","why":"subject の「主題」という名詞の意味との混同で、承認と審査の条件関係を表せない。"},{"t":"〜を免除される","why":"審査を受けなくてよいという意味ではなく、承認には審査による確認が必要だと述べている。"},{"t":"〜の影響を受けやすい","why":"subject to は悪天候などの影響を受けやすい場合にも使うが、ここでは承認に必要な条件を示す。"},{"t":"〜を条件とする","why":"正解。subject to はここでは条件付きであることを表し、当局者の支持だけでは最終承認にならない。"}],"answer":3,"point":"approval is subject to a review は「承認は審査を条件とする」。影響を受けやすいという別義と区別する。","level":3,"accept":["条件とする","〜が条件である","〜を条件としている","〜を必要条件とする","〜を前提とする"],"drive":{"ja":"当局者は提案されているダムを支持しているが、最終承認には、その事業が下流の生息地を損なわないことを独立した審査で確認するという条件が依然として付いている。","en":"Although officials support the proposed dam, final approval remains subject to an independent review confirming that the project would not damage habitats downstream."}}],"vocab_je":[{"id":"p1-vocab_je-001","q":"Local authorities should ___（配分する） more funds to public transport to improve access to essential services.","q_ja":"地方自治体は、不可欠なサービスを利用しやすくするため、公共交通により多くの資金を配分すべきだ。","choices":[{"t":"accumulate","why":"「蓄積する」という意味で、資金を公共交通に配分することを表さない。"},{"t":"allocate","why":"正解。allocate funds to は、特定の用途に資金を配分することを表す。"},{"t":"generate","why":"「生み出す」という意味で、既存の資金の配分を表さない。"},{"t":"withdraw","why":"「引き出す・撤回する」という意味で、資金を配分することを表さない。"}],"answer":1,"point":"allocate A to B で「AをBに配分する」。公的資金の使い道を述べる際に使える。","level":1,"accept":["devote","assign"],"drive":{"ja":"地方自治体は、不可欠なサービスを利用しやすくするため、公共交通により多くの資金を配分すべきだ。","en":"Local authorities should allocate more funds to public transport to improve access to essential services."}},{"id":"p1-vocab_je-002","q":"The expansion of automated services may ___（引き起こす） new forms of inequality unless governments support workers whose jobs are disappearing.","q_ja":"政府が仕事を失いつつある労働者を支援しなければ、自動化されたサービスの拡大は新たな形の不平等を引き起こす可能性がある。","choices":[{"t":"give way to","why":"「～に取って代わられる」という意味で、不平等を発生させることを表さない。"},{"t":"make up for","why":"「～を埋め合わせる」という意味で、不平等を引き起こすことを表さない。"},{"t":"keep pace with","why":"「～に遅れずについていく」という意味で、原因と結果の関係を表さない。"},{"t":"give rise to","why":"正解。give rise to は、問題や変化などを引き起こすことを表す。"}],"answer":3,"point":"give rise to の後ろには結果を表す名詞を置き、社会的な変化の影響を説明する。","level":2,"accept":["cause","lead to","bring about"],"drive":{"ja":"政府が仕事を失いつつある労働者を支援しなければ、自動化されたサービスの拡大は新たな形の不平等を引き起こす可能性がある。","en":"The expansion of automated services may give rise to new forms of inequality unless governments support workers whose jobs are disappearing."}},{"id":"p1-vocab_je-003","q":"The long-term benefits of preventive healthcare may ___（上回る） its initial costs, even when the savings are difficult to measure during the first few years.","q_ja":"予防医療の長期的な利益は、最初の数年間は節約額を測定しにくい場合でも、初期費用を上回る可能性がある。","choices":[{"t":"outweigh","why":"正解。outweigh は、比較した際に利益などの価値や重要性が費用などを上回ることを表す。"},{"t":"offset","why":"「相殺する」という意味で、費用を埋め合わせることは表すが、上回ることまでは表さない。"},{"t":"outnumber","why":"「数で上回る」という意味で、利益と費用の価値を比較するこの文には合わない。"},{"t":"overestimate","why":"「過大評価する」という意味で、利益自体が費用を評価するという不自然な内容になる。"}],"answer":0,"point":"利益が費用や不利益を上回る比較には outweigh を使う。offset は相殺することを表す。","level":3,"accept":["exceed","more than compensate for"],"drive":{"ja":"予防医療の長期的な利益は、最初の数年間は節約額を測定しにくい場合でも、初期費用を上回る可能性がある。","en":"The long-term benefits of preventive healthcare may outweigh its initial costs, even when the savings are difficult to measure during the first few years."}},{"id":"p1-vocab_je-004","q":"Stricter regulations would ___（抑制する） industrial pollution, which places a heavy burden on public health systems.","q_ja":"より厳しい規制は、公的医療制度に重い負担をかけている産業公害を抑制するだろう。","choices":[{"t":"detect","why":"「検出する」という意味で、公害の発生や規模を抑えることを表さない。"},{"t":"assess","why":"「評価する」という意味で、公害を抑制することを表さない。"},{"t":"curb","why":"正解。curb は、好ましくない活動や増加を抑制することを表す。"},{"t":"monitor","why":"「監視する」という意味で、公害を継続的に調べることと抑制することは異なる。"}],"answer":2,"point":"curb は公害・排出・過剰な消費などを抑制する政策について使える。","level":2,"accept":["limit","reduce","restrain"],"drive":{"ja":"より厳しい規制は、公的医療制度に重い負担をかけている産業公害を抑制するだろう。","en":"Stricter regulations would curb industrial pollution, which places a heavy burden on public health systems."}},{"id":"p1-vocab_je-005","q":"The decline in rural employment should not ___（～に起因するとされる） automation alone, since changes in consumer demand have also reduced local production.","q_ja":"消費者需要の変化も地域の生産を減少させているため、地方の雇用減少の原因を自動化だけに求めるべきではない。","choices":[{"t":"be assigned to","why":"「～に割り当てられる」という意味で、雇用減少の原因を説明する表現にはならない。"},{"t":"be attributed to","why":"正解。be attributed to は、ある結果が特定の原因によるものとされることを表す。"},{"t":"be committed to","why":"「～に専念する」という意味で、雇用減少を原因に結び付ける表現にはならない。"},{"t":"be converted into","why":"「～に変換される」という意味で、原因についての判断を表さない。"}],"answer":1,"point":"結果を主語にした be attributed to の後ろに、その原因と考えられるものを置く。","level":2,"accept":["be ascribed to","be explained by"],"drive":{"ja":"消費者需要の変化も地域の生産を減少させているため、地方の雇用減少の原因を自動化だけに求めるべきではない。","en":"The decline in rural employment should not be attributed to automation alone, since changes in consumer demand have also reduced local production."}},{"id":"p1-vocab_je-006","q":"Access to the research grant is ___（～を条件としている） independent ethical approval, meaning that even highly promising projects cannot receive funding before their review is complete.","q_ja":"その研究助成金の受給は独立した倫理審査での承認を条件としており、非常に有望な計画であっても審査が完了するまでは資金を受け取れない。","choices":[{"t":"consistent with","why":"「～と矛盾しない」という意味で、承認が受給の必須条件であることまでは表さない。"},{"t":"conducive to","why":"「～を促進する」という意味で、承認を条件とする関係を逆に捉えている。"},{"t":"concurrent with","why":"「～と同時に起こる」という意味で、承認が受給の条件であることを表さない。"},{"t":"contingent on","why":"正解。contingent on は、ある事柄の実現が別の条件の成立にかかっていることを表す。"}],"answer":3,"point":"be contingent on は条件への依存を表す。整合性を表す be consistent with と区別する。","level":3,"accept":["conditional on","dependent on","subject to"],"drive":{"ja":"その研究助成金の受給は独立した倫理審査での承認を条件としており、非常に有望な計画であっても審査が完了するまでは資金を受け取れない。","en":"Access to the research grant is contingent on independent ethical approval, meaning that even highly promising projects cannot receive funding before their review is complete."}},{"id":"p1-vocab_je-007","q":"A ___（持続可能な） energy policy must meet current demand without exhausting resources needed by future generations.","q_ja":"持続可能なエネルギー政策は、将来の世代が必要とする資源を使い果たすことなく、現在の需要を満たさなければならない。","choices":[{"t":"sustainable","why":"正解。sustainable は、資源などを維持しながら長期的に続けられることを表す。"},{"t":"substantial","why":"「相当な・大規模な」という意味で、将来も維持できることを表さない。"},{"t":"profitable","why":"「利益を生む」という意味で、資源を使い果たさず継続できることを表さない。"},{"t":"renewable","why":"「再生可能な」。a renewable energy policy（再生可能エネルギーの政策）とは言えるが、（持続可能な）の意味にはならない。"}],"answer":0,"point":"sustainable は政策や開発の持続可能性を表す。renewable は資源などが再生可能であることを表す。","level":2,"accept":["environmentally sustainable","ecologically sustainable"],"drive":{"ja":"持続可能なエネルギー政策は、将来の世代が必要とする資源を使い果たすことなく、現在の需要を満たさなければならない。","en":"A sustainable energy policy must meet current demand without exhausting resources needed by future generations."}},{"id":"p1-vocab_je-008","q":"Healthcare costs ___（～を占める） a growing share of public spending, leaving less money available for infrastructure unless tax revenue also increases.","q_ja":"医療費が公的支出に占める割合は増大しており、税収も増加しない限り、インフラに使える資金は少なくなる。","choices":[{"t":"allow for","why":"「～を考慮に入れる」という意味で、公的支出の中の割合を表さない。"},{"t":"account to","why":"割合を占める意味では account for を使う。account to は前置詞が違う。"},{"t":"account for","why":"正解。account for は、全体のうち特定の割合を占めることを表す。"},{"t":"result from","why":"「～に起因する」という意味で、支出の構成比を表さない。"}],"answer":2,"point":"account for a share of で「～の一部を占める」。account for には「説明する」という意味もある。","level":2,"accept":["represent","constitute","make up"],"drive":{"ja":"医療費が公的支出に占める割合は増大しており、税収も増加しない限り、インフラに使える資金は少なくなる。","en":"Healthcare costs account for a growing share of public spending, leaving less money available for infrastructure unless tax revenue also increases."}},{"id":"p1-vocab_je-009","q":"Policymakers must ___（両立させる） economic growth with environmental protection, ensuring that measures to increase national income do not deplete the natural resources on which future prosperity depends.","q_ja":"政策立案者は、国民所得を増やす施策が将来の繁栄を支える天然資源を枯渇させないようにしながら、経済成長と環境保護を両立させなければならない。","choices":[{"t":"associate","why":"「関連付ける」という意味で、二つの目標の対立を調整して両立させることまでは表さない。"},{"t":"reconcile","why":"正解。reconcile A with B は、対立し得る二つの目標などを両立させることを表す。"},{"t":"equate","why":"「同一視する」という意味で、異なる目標を両立させることとは異なる。"},{"t":"replace","why":"「置き換える」という意味で、経済成長を環境保護に替えることになり、両方を実現する意味にならない。"}],"answer":1,"point":"reconcile A with B は対立の調整を含む。「関連付ける」だけの associate A with B と区別する。","level":3,"accept":["balance","harmonize","harmonise"],"drive":{"ja":"政策立案者は、国民所得を増やす施策が将来の繁栄を支える天然資源を枯渇させないようにしながら、経済成長と環境保護を両立させなければならない。","en":"Policymakers must reconcile economic growth with environmental protection, ensuring that measures to increase national income do not deplete the natural resources on which future prosperity depends."}},{"id":"p1-vocab_je-010","q":"Tax relief provides an ___（動機付けとなるもの） for companies to invest in equipment that reduces carbon emissions.","q_ja":"税負担の軽減は、企業が炭素排出量を削減する設備に投資する動機付けとなる。","choices":[{"t":"obligation","why":"「義務」という意味で、投資を促す動機付けとは異なる。"},{"t":"indication","why":"「兆候・指標」という意味で、企業の投資を促すものを表さない。"},{"t":"innovation","why":"「革新」という意味で、投資する理由となる誘因を表さない。"},{"t":"incentive","why":"正解。incentive は、利益などによって行動を促す動機付けや誘因を表す。"}],"answer":3,"point":"provide an incentive for A to do で「Aが～する動機付けを与える」。税制の効果を説明できる。","level":1,"accept":["inducement","economic incentive"],"drive":{"ja":"税負担の軽減は、企業が炭素排出量を削減する設備に投資する動機付けとなる。","en":"Tax relief provides an incentive for companies to invest in equipment that reduces carbon emissions."}},{"id":"p1-vocab_je-011","q":"For regions with limited public funds, shared transport services may offer a ___（実行可能な） alternative to maintaining bus routes with very few passengers.","q_ja":"公的資金が限られている地域では、共同利用型の交通サービスが、乗客の非常に少ないバス路線を維持することに代わる実行可能な選択肢となる可能性がある。","choices":[{"t":"viable","why":"正解。viable は、計画や選択肢が実際に機能し、実行できる見込みがあることを表す。"},{"t":"visible","why":"「目に見える」という意味で、選択肢を実行できるかどうかを表さない。"},{"t":"variable","why":"「変わりやすい」という意味で、実行可能性を表さない。"},{"t":"vulnerable","why":"「影響や被害を受けやすい」という意味で、実行可能な選択肢という意味にならない。"}],"answer":0,"point":"viable alternative は「実行可能な代替案」。政策を現実に運用できるか論じる際に使える。","level":2,"accept":["feasible","workable","practical"],"drive":{"ja":"公的資金が限られている地域では、共同利用型の交通サービスが、乗客の非常に少ないバス路線を維持することに代わる実行可能な選択肢となる可能性がある。","en":"For regions with limited public funds, shared transport services may offer a viable alternative to maintaining bus routes with very few passengers."}},{"id":"p1-vocab_je-012","q":"Repeated failures to explain how personal data are used may ___（損なう） public trust in digital health services, even if those services improve access to treatment.","q_ja":"個人データの利用方法について説明を怠ることが繰り返されれば、デジタル医療サービスが治療を受けやすくしていても、そのサービスに対する国民の信頼を損なう可能性がある。","choices":[{"t":"underestimate","why":"「過小評価する」という意味で、信頼そのものを弱めることを表さない。"},{"t":"underlie","why":"「根底にある」という意味で、信頼の基盤を崩すことを表さない。"},{"t":"undermine","why":"正解。undermine は、信頼や権威などの基盤を弱めて損なうことを表す。"},{"t":"undervalue","why":"「価値を低く見積もる」という意味で、信頼を失わせる作用を表さない。"}],"answer":2,"point":"undermine trust は「信頼を損なう」。underestimate は程度、undervalue は価値を低く評価することを表す。","level":3,"accept":["erode","weaken","damage"],"drive":{"ja":"個人データの利用方法について説明を怠ることが繰り返されれば、デジタル医療サービスが治療を受けやすくしていても、そのサービスに対する国民の信頼を損なう可能性がある。","en":"Repeated failures to explain how personal data are used may undermine public trust in digital health services, even if those services improve access to treatment."}}]}};

  s.set ||= { pause: 6, rate: 0.95, repeat: 2 };
  s.set.level ??= 'r'; s.set.mode ??= 'choice'; s.set.timeMul ??= 1;
  s.daily ||= {};
  for (const k in s.daily) if (typeof s.daily[k] === 'number') s.daily[k] = { n: s.daily[k], ok: 0, ms: 0 };
  s.stat ||= {}; // stat[grade][type] = { n, ok, ms }
  return s;
})();
function save() { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch {} }
function rec(id) { return store.rec[id] ||= { n: 0, ok: 0, box: 0, due: 0 }; }
function today() { const d = new Date(); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); }
function addStat(o, correct, ms) { o.n++; if (correct) o.ok++; o.ms += ms; return o; }
function grade(it, correct, ms) {
  const id = it.id, r = rec(id);
  ms = Math.min(ms, MAX_MS);
  r.n++; if (correct) r.ok++;
  r.ms = (r.ms || 0) + ms;
  const g = store.grade;
  addStat(((store.stat[g] ||= {})[it.type] ||= { n: 0, ok: 0, ms: 0 }), correct, ms);
  r.box = correct ? Math.min(r.box + 1, BOX_DAYS.length - 1) : 0;
  r.due = Date.now() + (correct ? BOX_DAYS[r.box] * 864e5 : 10 * 60e3); // 間違えたら10分後から再出題
  r.last = correct ? 1 : 0;
  addStat((store.daily[today()] ||= { n: 0, ok: 0, ms: 0 }), correct, ms);
  save();
}

// ---------- 出題 ----------
function itemsOf(g, type, all = false) {
  const lv = store.set.level;
  return ((DATA[g] || {})[type] || []).map((it) => ({ ...it, type }))
    .filter((it) => all || lv === 'r' || String(it.level || 2) === lv);
}
function allItems(g, types = TYPES) { return types.flatMap((t) => itemsOf(g, t)); }
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function pick(pool, n) {
  const now = Date.now();
  const due = shuffle(pool.filter((it) => store.rec[it.id] && store.rec[it.id].due <= now))
    .sort((a, b) => rec(a.id).box - rec(b.id).box);
  const fresh = shuffle(pool.filter((it) => !store.rec[it.id]));
  const rest = shuffle(pool.filter((it) => store.rec[it.id] && store.rec[it.id].due > now));
  return [...due, ...fresh, ...rest].slice(0, n);
}
function wrongPool(g) { return TYPES.flatMap((t) => itemsOf(g, t, true)).filter((it) => store.rec[it.id] && store.rec[it.id].last === 0); }

// ---------- 集計 ----------
const pct = (o) => (o && o.n ? Math.round((o.ok / o.n) * 100) + '%' : '—');
const secAvg = (o) => (o && o.n ? (o.ms / o.n / 1000).toFixed(1) + '秒' : '—');
const minutes = (ms) => (ms < 60e3 ? Math.round(ms / 1000) + '秒' : Math.round(ms / 60e3) + '分');
function gradeTotal(g) {
  return Object.values(store.stat[g] || {}).reduce((a, o) => ({ n: a.n + o.n, ok: a.ok + o.ok, ms: a.ms + o.ms }), { n: 0, ok: 0, ms: 0 });
}

// ---------- 画面 ----------
const app = document.getElementById('app');
const h = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let session = null;

function tiles(g, types) {
  return types.map((t) => {
    const its = itemsOf(g, t);
    const done = its.filter((it) => store.rec[it.id]);
    const ok = done.filter((it) => store.rec[it.id].last === 1).length;
    const bar = its.length ? Math.round((ok / its.length) * 100) : 0;
    const st = (store.stat[g] || {})[t];
    const goal = targetSec(t, g);
    return `<button class="tile" data-t="${t}" ${its.length ? '' : 'disabled'}>
      <b>${TYPE_INFO[t].name}</b><small>${its.length ? `${done.length}/${its.length}問 ・ 正解率 ${pct(st)}<br>平均 ${secAvg(st)}${goal ? `（目標 ${goal}秒）` : ''}` : 'この難易度の問題なし'}</small>
      <div class="bar"><i style="width:${bar}%"></i></div></button>`;
  }).join('');
}
const opt = (list, cur) => list.map(([v, l]) => `<option value="${v}" ${v == cur ? 'selected' : ''}>${l}</option>`).join('');

function home() {
  stopDrive();
  if (session) clearInterval(session.tick);
  const g = store.grade;
  const pool = allItems(g);
  const seen = pool.filter((it) => store.rec[it.id]).length;
  const wrong = wrongPool(g).length;
  const dueN = pool.filter((it) => store.rec[it.id] && store.rec[it.id].due <= Date.now()).length;
  const td = store.daily[today()] || { n: 0, ok: 0, ms: 0 }, tot = gradeTotal(g);
  app.innerHTML = `
    <h1>英検用脳筋ドリル</h1>
    <div class="seg">${Object.entries(GRADES).map(([k, v]) => `<button data-g="${k}" class="${k === g ? 'on' : ''}">${v}</button>`).join('')}</div>
    <div class="seg small">${Object.entries(LEVELS).map(([k, v]) => `<button data-lv="${k}" class="${k === store.set.level ? 'on' : ''}">${v}</button>`).join('')}</div>
    <div class="seg small">${Object.entries(MODES).map(([k, v]) => `<button data-mode="${k}" class="${k === store.set.mode ? 'on' : ''}">${v}</button>`).join('')}</div>
    <div class="stats">
      <div><small>今日</small><b>${td.n}問</b><small>正解率 ${pct(td)}<br>${minutes(td.ms)}</small></div>
      <div><small>${GRADES[g]} 累計</small><b>${pct(tot)}</b><small>${tot.n}回解答<br>平均 ${secAvg(tot)}</small></div>
      <div><small>問題（${LEVELS[store.set.level]}）</small><b>${seen}/${pool.length}</b><small>解いた数<br>復習待ち ${dueN}</small></div>
    </div>
    <button class="big" id="mix">おまかせ 10問</button>
    <div class="grid">
      <button class="big sub" id="vmix">単語・熟語 10問</button>
      <button class="big sub" id="wrong" ${wrong ? '' : 'disabled'}>間違えた問題 ${wrong}</button>
    </div>
    <button class="big sub" id="drive">運転中モード</button>
    <h2>ライティングの型</h2>
    <div class="grid">${tiles(g, WRITE_TYPES)}</div>
    <h2>単語・熟語（文の中で覚える）</h2>
    <div class="grid">${tiles(g, VOCAB_TYPES)}</div>
    <h2>設定</h2>
    <div class="card">
      <div class="row"><span>目標時間</span><select id="timeMul">${opt([[1, '標準'], [1.5, '長め（1.5倍）'], [0, '表示しない']], store.set.timeMul)}</select></div>
      <div class="row"><span>運転中モード：答える時間</span><span><select id="pause">${opt([3, 4, 6, 8, 10, 15].map((v) => [v, v]), store.set.pause)}</select> 秒</span></div>
      <div class="row"><span>読み上げの速さ</span><select id="rate">${opt([0.8, 0.9, 0.95, 1, 1.1].map((v) => [v, v]), store.set.rate)}</select></div>
      <div class="row"><span>英文を読む回数</span><select id="repeat">${opt([1, 2, 3].map((v) => [v, v]), store.set.repeat)}</select></div>
    </div>
    <p class="muted">版 ${h(BUILD)}</p>`;
  app.querySelectorAll('[data-g]').forEach((b) => b.onclick = () => { store.grade = b.dataset.g; save(); home(); });
  app.querySelectorAll('[data-lv]').forEach((b) => b.onclick = () => { store.set.level = b.dataset.lv; save(); home(); });
  app.querySelectorAll('[data-mode]').forEach((b) => b.onclick = () => { store.set.mode = b.dataset.mode; save(); home(); });
  app.querySelector('#mix').onclick = () => start(pick(pool, 10), 'おまかせ');
  app.querySelector('#vmix').onclick = () => start(pick(allItems(g, VOCAB_TYPES), 10), '単語・熟語');
  app.querySelector('#wrong').onclick = () => start(shuffle(wrongPool(g)).slice(0, 10), '間違えた問題');
  app.querySelector('#drive').onclick = () => driveMenu();
  app.querySelectorAll('[data-t]').forEach((b) => b.onclick = () => start(pick(itemsOf(g, b.dataset.t), 10), TYPE_INFO[b.dataset.t].name));
  for (const k of ['timeMul', 'pause', 'rate', 'repeat']) app.querySelector('#' + k).onchange = (e) => { store.set[k] = Number(e.target.value); save(); if (k === 'timeMul') home(); };
}

function start(items, title) {
  if (!items.length) return;
  session = { items, i: 0, ok: 0, title, wrong: [], ms: 0, inTime: 0 };
  question();
  scrollTo(0, 0);
}

// 入力式の判定: 大文字小文字・前後の空白・句読点の違いは無視する。日本語は空白と「〜」・句読点を無視する
const normEn = (x) => String(x).toLowerCase().replace(/[’‘]/g, "'").replace(/[.,!?;:"]/g, '').replace(/\s+/g, ' ').trim();
const normJa = (x) => String(x).replace(/[\s　〜～~、。・「」（）()]/g, '');
function judgeInput(it, text) {
  const norm = TYPE_INFO[it.type].ja ? normJa : normEn;
  const v = norm(text);
  if (!v) return false;
  return [it.choices[it.answer].t, ...(it.accept || [])].some((a) => norm(a) === v);
}
function qToHtml(it) {
  return h(it.q).replace(/___/g, '<b class="blank">＿＿＿</b>').replace(/\[\[(.+?)\]\]/g, '<b class="mark">$1</b>');
}

function question() {
  const s = session, it = s.items[s.i];
  const info = TYPE_INFO[it.type];
  const input = store.set.mode === 'input';
  const order = shuffle(it.choices.map((c, idx) => idx));
  const lvTag = `<span class="lv">Lv${it.level || 2}</span>`;
  app.innerHTML = `
    <div class="top"><button id="quit">‹ やめる</button><span class="grow">${h(s.title)} ${s.i + 1}/${s.items.length}</span><span class="timer" id="timer">0秒</span></div>
    <div class="card">
      <div class="label">${lvTag} ${info.name} — ${input && !info.cloze ? info.write : info.hint}</div>
      <div class="q">${qToHtml(it)}</div>
      ${it.q_ja ? `<div class="qja" id="qja" style="display:none">${h(it.q_ja)}</div>` : ''}
    </div>
    ${input ? (info.cloze
      ? `<div class="card"><input id="ans" class="ans" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
           placeholder="${info.ja ? '日本語の意味を入力' : '英語を入力'}" ${info.ja ? '' : 'lang="en" inputmode="latin"'}>
           <button class="big" id="submit">答える</button></div>`
      : `<div class="card"><textarea id="ans" class="ans" rows="4" autocomplete="off" autocorrect="off" autocapitalize="sentences" spellcheck="false" lang="en"
           placeholder="自分の英文を書く（頭の中で考えるだけでもよい）"></textarea>
           <button class="big" id="submit">模範解答を見る</button></div>`)
    : `<div id="choices">${order.map((idx) => `<button class="choice" data-i="${idx}">${h(it.choices[idx].t)}<div class="why">${h(it.choices[idx].why)}</div></button>`).join('')}</div>`}
    <div id="after"></div>`;
  const goal = targetSec(it.type, store.grade), t0 = Date.now();
  const timerEl = app.querySelector('#timer');
  const tick = () => {
    const sec = Math.floor((Date.now() - t0) / 1000);
    timerEl.textContent = goal ? `${sec}秒 / ${goal}` : `${sec}秒`;
    timerEl.classList.toggle('over', goal > 0 && sec > goal);
  };
  tick(); clearInterval(s.tick); s.tick = setInterval(tick, 250);
  app.querySelector('#quit').onclick = home;
  const stopTimer = () => {
    clearInterval(s.tick);
    const ms = Math.min(Date.now() - t0, MAX_MS), inTime = !goal || ms <= goal * 1000;
    s.ms += ms; if (inTime) s.inTime++;
    timerEl.textContent = `${(ms / 1000).toFixed(1)}秒` + (goal ? (inTime ? ' ✓' : ' 超過') : '');
    timerEl.classList.toggle('over', !inTime);
    const qja = app.querySelector('#qja'); if (qja) qja.style.display = 'block';
    return ms;
  };
  const finish = (correct, ms) => {
    grade(it, correct, ms);
    if (correct) s.ok++; else s.wrong.push(it);
  };
  const nextBtn = (label) => {
    const last = s.i === s.items.length - 1;
    return `<div class="footer"><button class="big" id="next">${label || (last ? '結果を見る' : '次へ')}</button></div>`;
  };
  const goNext = () => { const last = s.i === s.items.length - 1; if (last) result(); else { s.i++; question(); scrollTo(0, 0); } };
  const correctBox = () => `<div class="choice ok">${h(it.choices[it.answer].t)}<div class="why" style="display:block">${h(it.choices[it.answer].why)}</div></div>`;

  if (input) {
    const ans = app.querySelector('#ans');
    setTimeout(() => ans.focus(), 50);
    const submit = () => {
      if (app.querySelector('#after').innerHTML) return;
      const ms = stopTimer();
      ans.disabled = true;
      if (info.cloze) {
        // 自動で判定し、表記の揺れで不正解になったときは自分で正解にできる
        let correct = judgeInput(it, ans.value);
        app.querySelector('#after').innerHTML = `
          <div class="point"><b id="verdict">${correct ? '正解' : '不正解'}</b>　${h(it.point)}</div>
          ${correctBox()}
          ${correct ? '' : `<button class="big sub" id="override">表記の違いなので正解にする</button>`}
          ${nextBtn()}`;
        const ov = app.querySelector('#override');
        if (ov) ov.onclick = () => { correct = true; ov.remove(); app.querySelector('#verdict').textContent = '正解（自己判定）'; };
        app.querySelector('#next').onclick = () => { finish(correct, ms); goNext(); };
      } else {
        // 英文を書く種類は自己判定
        app.querySelector('#after').innerHTML = `
          <div class="label" style="margin-top:12px">模範解答</div>
          ${correctBox()}
          <div class="point">${h(it.point)}</div>
          <div class="grid footer-grid"><button class="big sub" id="ng">書けなかった</button><button class="big" id="ok">書けた</button></div>`;
        app.querySelector('#ok').onclick = () => { finish(true, ms); goNext(); };
        app.querySelector('#ng').onclick = () => { finish(false, ms); goNext(); };
      }
    };
    app.querySelector('#submit').onclick = submit;
    if (info.cloze) ans.onkeydown = (e) => { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); submit(); } };
    return;
  }
  const box = app.querySelector('#choices');
  box.querySelectorAll('.choice').forEach((b) => b.onclick = () => {
    if (box.classList.contains('answered')) return;
    const pickI = Number(b.dataset.i), correct = pickI === it.answer;
    box.classList.add('answered');
    box.querySelector(`[data-i="${it.answer}"]`).classList.add('ok');
    if (!correct) b.classList.add('ng');
    const ms = stopTimer();
    finish(correct, ms);
    app.querySelector('#after').innerHTML = `
      <div class="point"><b>${correct ? '正解' : '不正解'}</b>　${h(it.point)}</div>
      ${nextBtn()}`;
    app.querySelector('#next').onclick = goNext;
  });
}

function result() {
  const s = session;
  app.innerHTML = `
    <div class="top"><button id="back">‹ ホーム</button><span class="grow">${h(s.title)}</span><span></span></div>
    <div class="result">${s.ok} / ${s.items.length}</div>
    <div class="stats">
      <div><small>正解率</small><b>${Math.round((s.ok / s.items.length) * 100)}%</b></div>
      <div><small>合計時間</small><b>${minutes(s.ms)}</b></div>
      <div><small>1問平均</small><b>${(s.ms / s.items.length / 1000).toFixed(1)}秒</b></div>
      ${store.set.timeMul === 0 ? '' : `<div><small>目標内</small><b>${s.inTime}/${s.items.length}</b></div>`}
    </div>
    <p class="muted" style="text-align:center">間違えた問題は、10分後から優先して出ます</p>
    ${s.wrong.length ? `<button class="big" id="retry">間違えた ${s.wrong.length} 問をもう一度</button>` : ''}
    <button class="big sub" id="more">続けて 10問</button>`;
  app.querySelector('#back').onclick = home;
  const r = app.querySelector('#retry'); if (r) r.onclick = () => start(shuffle(s.wrong), 'やり直し');
  app.querySelector('#more').onclick = () => start(pick(allItems(store.grade), 10), 'おまかせ');
}

// ---------- 運転中モード ----------
let drive = null;
const hasTTS = 'speechSynthesis' in window;
const live = new Set(); // 読み上げ中のデータを持ち続ける（iPhone で途中で音が切れるのを防ぐ）
function pickVoice(lang) {
  const v = speechSynthesis.getVoices();
  return v.find((x) => x.lang.replace('_', '-') === lang && x.localService) ||
    v.find((x) => x.lang.replace('_', '-') === lang) || v.find((x) => x.lang.startsWith(lang.slice(0, 2))) || null;
}
function say(text, lang) {
  return new Promise((resolve) => {
    if (!hasTTS || !drive) return resolve(false);
    // 前の読み上げが残っているときだけ取り消す。取り消した直後に話すと iPhone では捨てられることがあるので少し待つ
    const busy = speechSynthesis.speaking || speechSynthesis.pending;
    if (busy) speechSynthesis.cancel();
    if (speechSynthesis.paused) speechSynthesis.resume();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = lang; const v = pickVoice(lang); if (v) u.voice = v;
    u.rate = store.set.rate; u.volume = 1;
    live.add(u);
    let done = false;
    const finish = (ok) => { if (done) return; done = true; live.delete(u); clearTimeout(guard); resolve(ok); };
    u.onstart = () => sayStatus('読み上げ中');
    u.onend = () => { sayStatus('待機'); finish(true); };
    u.onerror = (e) => { sayStatus('エラー: ' + e.error); finish(false); };
    const guard = setTimeout(() => finish(false), text.length * 160 / store.set.rate + 5000); // 終了の合図が来ないときの打ち切り
    // 最初の1回はボタンを押した処理の中で同期的に呼ぶ必要がある（iPhone は、押した直後でないと音を出さない）
    if (busy) setTimeout(() => speechSynthesis.speak(u), 120); else speechSynthesis.speak(u);
  });
}
function sayStatus(t) { const el = document.getElementById('sst'); if (el) el.textContent = '音声: ' + t; }
const wait = (ms) => new Promise((r) => { drive && (drive.timer = setTimeout(r, ms)); if (!drive) r(); });

function driveMenu() {
  const g = store.grade;
  const sel = new Set(store.set.driveTypes || ['reason', 'ja2en', 'template', 'connector', 'collocation', 'vocab_je', 'vocab_ej']);
  app.innerHTML = `
    <div class="top"><button id="back">‹ ホーム</button><span class="grow">運転中モード（${GRADES[g]}・${LEVELS[store.set.level]}）</span><span></span></div>
    <div class="card">
      <p style="margin-top:0"><b>走り出す前に「スタート」を押してください。</b>あとは画面に触れずに続きます。</p>
      <p class="muted">日本語の問い → ${store.set.pause}秒の間（口に出して答える）→ 英語の模範文 ×${store.set.repeat}。<br>
      画面は点けたままになります。ロックすると止まることがあります。止めるのは停車してから。</p>
    </div>
    <h2>出す種類</h2>
    <div class="card">${TYPES.map((t) => `<label class="row"><span>${TYPE_INFO[t].name}（${itemsOf(g, t).length}）</span>
      <input type="checkbox" data-t="${t}" ${sel.has(t) ? 'checked' : ''}></label>`).join('')}</div>
    <div class="footer"><button class="big" id="go">スタート</button></div>`;
  app.querySelector('#back').onclick = home;
  app.querySelector('#go').onclick = () => {
    const types = [...app.querySelectorAll('[data-t]')].filter((c) => c.checked).map((c) => c.dataset.t);
    store.set.driveTypes = types; save();
    const items = pick(allItems(g, types), 9999);
    if (items.length) runDrive(items); // runDrive は最初の await より前に読み上げを始める
  };
}

async function runDrive(items) {
  drive = { items, i: 0, timer: null, lock: null };
  app.innerHTML = `<div class="drive"><div class="phase" id="ph"></div><div class="text" id="tx"></div>
    <div class="count" id="ct"></div><button class="stop" id="stop">停止</button><div class="sst" id="sst">音声: 準備中</div></div>`;
  document.getElementById('stop').onclick = home;
  // ここまで await を挟まない。ボタンを押した処理の中で最初の読み上げを始めて、iPhone の音声を有効にする
  const first = say('スタートします。', 'ja-JP');
  keepAwake(); // 画面を消さない設定は待たずに進める
  await first;
  const ph = document.getElementById('ph'), tx = document.getElementById('tx'), ct = document.getElementById('ct');
  while (drive && drive.i < drive.items.length) {
    const it = drive.items[drive.i];
    ct.textContent = `${drive.i + 1} 問目 ／ ${TYPE_INFO[it.type].name}`;
    ph.textContent = '問い'; tx.textContent = it.drive.ja;
    await say(it.drive.ja, 'ja-JP'); if (!drive) break;
    ph.textContent = '答えてください'; await wait(store.set.pause * 1000); if (!drive) break;
    ph.textContent = '模範文'; tx.textContent = it.drive.en;
    for (let k = 0; k < store.set.repeat && drive; k++) { await say(it.drive.en, 'en-US'); await wait(900); }
    if (!drive) break;
    drive.i++;
    await wait(800);
  }
  if (drive) { await say('おつかれさまでした。', 'ja-JP'); home(); }
}
async function keepAwake() {
  try { if ('wakeLock' in navigator && drive) drive.lock = await navigator.wakeLock.request('screen'); } catch {}
}
document.addEventListener('visibilitychange', () => { if (drive && document.visibilityState === 'visible') keepAwake(); });
function stopDrive() {
  if (!drive) return;
  clearTimeout(drive.timer);
  try { drive.lock && drive.lock.release(); } catch {}
  drive = null;
  if (hasTTS) speechSynthesis.cancel();
}

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
home();
</script>
</body>
</html>
