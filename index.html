 Sunday work.","why":"追加の人件費という負担で、反対の立場の理由になる。"},{"t":"Some libraries list their Sunday opening hours near the entrance.","why":"開館時間の掲示についての事実で、日曜開館の利点ではない。"},{"t":"Sunday work reduces the time library staff spend with family.","why":"職員の家族との時間が減るという欠点で、立場と逆になる。"},{"t":"The library near our station opened last Sunday at ten.","why":"一つの図書館の開館時刻だけでは、一般的な理由にならない。"},{"t":"Opening local libraries on Sundays is the right thing to do.","why":"日曜開館を肯定する主張の繰り返しで、理由の中身がない。"}],"answer":0,"point":"施設を開ける理由は、利用する人にどんな利点があるかで考える。","level":1,"drive":{"ja":"地域の図書館は日曜日も開館するべきか。賛成の理由を英語で一文。","en":"Sunday opening gives busy workers more chances to borrow books."},"explain":"Sunday openingが主語で、give＋人＋物は人に機会などを与えることを表す。to borrow booksはchancesを修飾し、どのような機会かを説明する。別の言い方: Opening libraries on Sundays gives busy workers more opportunities to borrow books."},{"id":"g2-reason-213","q":"TOPIC: Should school clubs require students to practice every weekend?\nPosition: Disagree","q_ja":"学校の部活動は毎週末の練習を生徒に義務付けるべきか。立場：反対。","choices":[{"t":"Weekend practice gives teams more time to improve their skills.","why":"技術を伸ばす時間が増えるという、義務付けに賛成する理由。"},{"t":"Some school clubs use the gym for practice on Saturdays.","why":"練習場所と曜日の事実で、義務付けに反対する理由ではない。"},{"t":"Practicing every weekend helps new members learn the club rules.","why":"新入部員が規則を覚えやすいという利点で、立場と逆になる。"},{"t":"Our tennis club practiced for two hours last Saturday morning.","why":"自分の部の一回の出来事で、一般的な理由になっていない。"},{"t":"Students need free weekends to rest after busy school days.","why":"正解。忙しい平日の後に休む時間が必要なので、義務付けへの反対を支える。"},{"t":"A weekly practice plan includes dates and times for members.","why":"練習計画に書かれる情報だけで、反対の根拠を示していない。"}],"answer":4,"point":"反対の理由は、義務によって失われる時間や必要な休息に注目する。","level":1,"drive":{"ja":"部活動は毎週末の練習を義務付けるべきか。反対の理由を英語で一文。","en":"Students need free weekends to rest after busy school days."},"explain":"Studentsが主語、needが動詞で、to restは目的を示す。need＋名詞で反対論の根拠となる必要性を述べ、afterで背景を補う。別の言い方: Students need weekends off to rest."},{"id":"g2-reason-214","q":"TOPIC: Should supermarkets encourage customers to bring their own shopping bags?\nPosition: Agree","q_ja":"スーパーは買い物客に自分の袋を持参するよう勧めるべきか。立場：賛成。","choices":[{"t":"Customers sometimes forget their shopping bags on the kitchen table.","why":"忘れることがあるという事実だけで、持参を勧める利点ではない。"},{"t":"Carrying empty bags makes shopping less convenient for some people.","why":"袋を運ぶ不便さを述べており、持参を勧める立場と逆になる。"},{"t":"Supermarkets sell shopping bags in different sizes near the door.","why":"袋の販売についての事実で、持参を勧める理由ではない。"},{"t":"Encouraging shoppers to bring bags is clearly the best choice.","why":"持参を勧める主張を繰り返すだけで、理由を示していない。"},{"t":"Checking customers' own bags can create extra work for staff.","why":"職員の負担が増えるという欠点で、反対の立場を支える。"},{"t":"Using the same bags again helps reduce waste from shopping.","why":"正解。袋の再利用によってごみを減らせるという一般的な利点がある。"}],"answer":5,"point":"環境の理由は、どんな行動が何を減らすのかを具体的に示す。","level":1,"drive":{"ja":"スーパーは買い物客に自分の袋の持参を勧めるべきか。賛成の理由を英語で一文。","en":"Using the same bags again helps reduce waste from shopping."},"explain":"Using以下の動名詞句が主語、helpsが動詞で、reduceが続く。help＋原形で行動の効果を示し、from shoppingでごみの発生源を絞って環境論を具体化する。別の言い方: Reusing bags cuts waste."},{"id":"g2-reason-215","q":"TOPIC: Should companies let employees choose when to start work?\nPosition: Agree","q_ja":"会社は従業員が仕事の開始時刻を選べるようにするべきか。立場：賛成。","choices":[{"t":"Different starting times make it harder for managers to arrange meetings with all employees.","why":"会議の調整が難しくなるという欠点で、反対の立場を支える。"},{"t":"Flexible starting times help employees balance their jobs with responsibilities such as taking children to school.","why":"正解。仕事と子どもの送迎などの責任を両立しやすくなるという利点がある。"},{"t":"Employees at some companies record their starting times on a computer near the office entrance.","why":"出勤時刻を記録する方法の事実で、時刻を選べる利点ではない。"},{"t":"Customers may struggle to reach the right employee when working hours differ within a team.","why":"顧客が担当者に連絡しにくくなるという欠点で、立場と逆になる。"},{"t":"One employee at my father's company started work at ten after a dental appointment yesterday.","why":"特定の従業員の一度の出来事で、一般的な利点の説明ではない。"},{"t":"Company guides sometimes include a section explaining how employees should report changes in starting times.","why":"開始時刻の変更手続きについての事実で、制度を導入する理由ではない。"}],"answer":1,"point":"働き方の利点は、仕事以外の責任との両立という一般論でも説明できる。","level":2,"drive":{"ja":"会社は従業員が仕事の開始時刻を選べるようにするべきか。賛成の理由を英語で一文。","en":"Flexible starting times help employees balance their jobs with responsibilities such as taking children to school."},"explain":"開始時刻が主語、helpの後で従業員が両立する内容を示す。balance A with Bで両立の利点を述べ、such asで具体例を添える。別の言い方: Flexible hours aid work-life balance."},{"id":"g2-reason-217","q":"TOPIC: Should towns turn unused land into community gardens?\nPosition: Agree","q_ja":"町は使われていない土地を住民が共同で使う菜園にするべきか。立場：賛成。","choices":[{"t":"Growing vegetables together gives residents opportunities to meet neighbors and build stronger relationships in their community.","why":"正解。共同作業を通じて住民同士のつながりが強まるという利点がある。"},{"t":"Local governments must spend money on preparing garden soil before residents can begin growing vegetables there.","why":"土の準備に費用がかかるという負担で、反対の立場を支える。"},{"t":"Community gardens usually have a map showing which part of the land each group will use.","why":"区画の割り当てを示す地図についての事実で、菜園を作る利点ではない。"},{"t":"Disagreements about sharing water and tools may cause trouble between the people who use community gardens.","why":"共同利用で争いが起きる可能性という欠点で、立場と逆になる。"},{"t":"My neighbor brought home three tomatoes from our community garden on a warm afternoon last summer.","why":"一人が収穫した体験だけでは、町全体への一般的な利点を説明していない。"},{"t":"Residents who join a community garden often write their names on a list at the town office.","why":"参加者の登録手続きの事実で、土地を菜園にする理由ではない。"}],"answer":0,"point":"共同活動の理由には、活動を通じて地域の人間関係がどう変わるかを書く。","level":2,"drive":{"ja":"町は使われていない土地を住民の共同菜園にするべきか。賛成の理由を英語で一文。","en":"Growing vegetables together gives residents opportunities to meet neighbors and build stronger relationships in their community."},"explain":"Growing以下が主語、givesが動詞で、to以下の二つの動作が機会の内容を示す。give＋人＋機会で共同活動の社会的効果を論じられる。別の言い方: Gardening together helps neighbors connect."},{"id":"g2-reason-218","q":"TOPIC: Should city buses accept payment only through smartphone apps?\nPosition: Disagree","q_ja":"市内バスはスマートフォンのアプリだけで支払いを受け付けるべきか。立場：反対。","choices":[{"t":"Passengers can pay through an app before boarding, which reduces the time drivers spend handling cash.","why":"現金の取り扱い時間を減らせる利点で、アプリだけにすることへの賛成を支える。"},{"t":"Bus payment apps often show both the price of a ticket and the date it was purchased.","why":"表示される情報の説明で、支払い方法を限定することへの反対理由ではない。"},{"t":"People who cannot use smartphones would lose access to buses even when they have enough money for tickets.","why":"正解。運賃を払えてもスマートフォンを使えない人が利用できなくなるという問題がある。"},{"t":"Passengers who use smartphone apps may still choose to pay cash when both payment methods remain available.","why":"両方の支払い方法がある場合の選択を述べるだけで、アプリ限定の問題を説明していない。"},{"t":"Drivers would no longer need to prepare change if every passenger bought a ticket through a smartphone app.","why":"つり銭の準備が不要になる利点で、反対の立場とは逆になる。"},{"t":"Requiring smartphone apps for all bus payments is a policy that city transport services should avoid introducing.","why":"導入を避けるべきという主張の繰り返しで、なぜ反対するのかがない。"}],"answer":2,"point":"便利な仕組みでも、それだけに限定すると利用できなくなる人がいないか考える。","level":3,"drive":{"ja":"市内バスはスマートフォンのアプリだけで支払いを受け付けるべきか。反対の理由を英語で一文。","en":"People who cannot use smartphones would lose access to buses even when they have enough money for tickets."},"explain":"who cannot use smartphonesはPeopleを限定し、スマートフォンを使えない人を指す。even when節は、運賃が十分にあってもバスを利用できなくなるという譲歩を示す。別の言い方: People unable to use smartphones would be unable to take buses even if they had enough money for the fare."},{"id":"g2-reason-219","q":"TOPIC: Should schools lend sports equipment to students who cannot afford to buy it?\nPosition: Agree","q_ja":"学校はスポーツ用品を買う余裕がない生徒に用品を貸すべきか。立場：賛成。","choices":[{"t":"Students who already own sports equipment often keep it at school so they can practice after their lessons.","why":"自分の用品を持つ生徒の保管方法で、買えない生徒への貸し出しを支える理由ではない。"},{"t":"Schools may have to reduce spending on other activities to replace damaged equipment that students have borrowed.","why":"破損した用品の補充で他の活動の予算が減るという欠点で、立場と逆になる。"},{"t":"Some students borrow sports equipment only after a teacher has written their names and class numbers in a notebook.","why":"貸し出し手続きについての事実で、対象の生徒に貸す利点を示していない。"},{"t":"Students from families with enough money can choose equipment that fits them rather than depending on school supplies.","why":"買う余裕のある家庭の選択を述べており、買えない生徒に貸す理由になっていない。"},{"t":"Borrowing equipment allows students to join sports activities without their families having to pay for expensive items first.","why":"正解。購入費を先に用意できない家庭の生徒も活動に参加できるようになる。"},{"t":"Teachers would need additional time to check whether borrowed equipment had been returned safely after each practice session.","why":"返却確認に時間が必要という教員の負担で、反対の立場を支える。"}],"answer":4,"point":"対象が限定された提案では、その対象の人が直面する問題を解決する理由を選ぶ。","level":3,"drive":{"ja":"学校はスポーツ用品を買う余裕がない生徒に用品を貸すべきか。賛成の理由を英語で一文。","en":"Borrowing equipment allows students to join sports activities without their families having to pay for expensive items first."},"explain":"Borrowing equipmentが主語で、allow＋人＋to不定詞は可能になる行動を示す。without their families having to payは家族の支払いが不要であることを表し、firstは参加前の負担を示す。別の言い方: Students can take part in sports by borrowing equipment, without their families first having to buy expensive items."},{"id":"g2-reason-220","q":"TOPIC: Should towns replace all in-person disaster training with online videos?\nPosition: Disagree","q_ja":"町は対面の防災訓練をすべてオンライン動画に替えるべきか。立場：反対。","choices":[{"t":"Online videos let residents review safety instructions at a convenient time without traveling to a public training center.","why":"時間や移動の面での動画の利点で、置き換えに賛成する理由になる。"},{"t":"Watching instructions alone does not give residents the chance to practice using emergency equipment with someone checking their actions.","why":"正解。動画の視聴だけでは、指導者の確認を受けながら器具を使う実践ができない。"},{"t":"Residents who attend training sessions may also watch online videos later to review the emergency procedures they have learned.","why":"対面訓練と動画を併用する場合の行動を述べるだけで、全面的な置き換えの欠点を示していない。"},{"t":"Towns can update online safety videos when instructions change, allowing residents to check the latest information from home.","why":"情報の更新と確認のしやすさという動画の利点で、立場と逆になる。"},{"t":"A disaster training video may contain several sections, with each section explaining a different type of emergency equipment.","why":"動画の構成という事実で、対面訓練を残すべき理由ではない。"},{"t":"Moving all disaster training online would be an unsuitable choice for towns that currently hold sessions for local residents.","why":"全面的なオンライン化は不適切という主張を繰り返すだけで、具体的な根拠がない。"}],"answer":1,"point":"説明を見られることと、実際の動作を確認してもらえることの違いを読む。","level":3,"drive":{"ja":"町は対面の防災訓練をすべてオンライン動画に替えるべきか。反対の理由を英語で一文。","en":"Watching instructions alone does not give residents the chance to practice using emergency equipment with someone checking their actions."},"explain":"Watching instructions aloneが主語で、does not giveが述部となり、to practice以下が機会の内容を説明する。with＋目的語＋現在分詞は付帯状況を表し、ここでは誰かが動作を確認している状態を示す。別の言い方: Merely watching instructions gives residents no opportunity to practice using emergency equipment while someone checks their actions."}],"summary":[{"id":"g2-summary-001","q":"A town library has started lending tools that people rarely need, such as electric drills. Residents can borrow them instead of buying their own. This helps families spend less money and keeps fewer unused products in their homes. Borrowers must return each tool in good condition so others can use it.","q_ja":"ある町の図書館は、電動ドリルなど、めったに必要としない工具の貸し出しを始めた。住民は自分で買う代わりに借りられる。これにより家計の支出が減り、家に使わない製品がたまるのを防げる。ほかの人も使えるよう、借りた人は工具を良い状態で返す必要がある。","choices":[{"t":"Residents can borrow them instead of buying their own, and borrowers must return each tool in good condition.","why":"本文の表現をほぼそのままつないでおり、費用と不要な物を減らす効果を言い換えてまとめていない。"},{"t":"Lending electric drills helps families save money and space, provided that residents return the tools in good condition.","why":"電動ドリルという具体例を残しており、貸し出す道具全体の利点としてまとめていない。"},{"t":"Sharing equipment through libraries reduces household costs and clutter, while users are responsible for keeping borrowed items usable.","why":"正解。図書館で道具を共有すると出費や不要な物が減り、利用者には道具を良い状態で保つ責任がある。"},{"t":"Libraries lend equipment to save residents money and space, while paid workers visit homes to check borrowed items.","why":"有料の作業員が家を訪ねて道具を点検するという、本文にない仕組みを加えている。"},{"t":"Library users must bring tools back in good condition so other residents can borrow the same equipment later.","why":"返却時の状態と次の利用者への配慮だけで、家計や収納への利点が抜けている。"},{"t":"Borrowing library equipment removes all household expenses and storage problems, while every resident always returns tools without damage.","why":"費用や収納の問題がすべてなくなることや、全員が必ず無傷で返すことまでは述べていない。"}],"answer":2,"point":"貸し出しの利点と利用者の責任を残し、道具の具体例は省いて一般化する。","drive":{"ja":"次の段落の要点を英語1文で。図書館で道具を共有すると出費や不要な物が減り、利用者には道具を良い状態で保つ責任がある。","en":"Sharing equipment through libraries reduces household costs and clutter, while users are responsible for keeping borrowed items usable."},"level":3,"explain":"動名詞が主語で、while節が利用者の責任を添える。be responsible for＋動名詞で要約に義務を残す。別の言い方: Sharing tools cuts costs and clutter but requires care."},{"id":"g2-summary-002","q":"Students at a high school grow vegetables behind their classrooms. By watering plants and checking the soil, they learn where food comes from. They also work in groups and decide how to divide the jobs. Teachers say the garden gives students useful knowledge about food and practice in working with others.","q_ja":"ある高校の生徒たちは教室の裏で野菜を育てている。水やりや土の確認を通して、食べ物がどこから来るかを学ぶ。また、グループで作業し、仕事の分担を決める。教師たちは、菜園は食べ物に関する役立つ知識と、ほかの人と協力する練習の機会を与えると話している。","choices":[{"t":"They learn where food comes from and work in groups and decide how to divide the jobs.","why":"本文の語句をほぼそのまま並べており、食の学習と協力する力の育成を言い換えていない。"},{"t":"Watering vegetables and checking the soil teach students about food, while dividing garden jobs helps them work together.","why":"水やりや土の確認という具体例を残しており、活動全体から得る学びにまとめていない。"},{"t":"Growing food at school builds knowledge and teamwork, and selling the vegetables pays for all the students' textbooks.","why":"野菜を売って生徒の教科書代をすべて払うという、本文にない内容を加えている。"},{"t":"Students learn about food by growing vegetables behind their classrooms and observing the soil as their plants develop.","why":"栽培から食について学ぶ点だけを扱い、分担して協力する力を育てる点が抜けている。"},{"t":"School gardens give every student complete knowledge of food production and prevent any disagreements during group activities.","why":"全員が食料生産を完全に理解し、意見の対立が一切なくなるという断定は本文を超えている。"},{"t":"School gardening helps students understand food production and develop the skills they need to cooperate with other people.","why":"正解。学校での栽培活動は、食料生産への理解と、ほかの人と協力する力を育てる。"}],"answer":5,"point":"複数の学習効果を拾い、作業の具体例を知識と協力する力にまとめる。","drive":{"ja":"次の段落の要点を英語1文で。学校での栽培活動は、食料生産への理解と、ほかの人と協力する力を育てる。","en":"School gardening helps students understand food production and develop the skills they need to cooperate with other people."},"level":2,"explain":"主語は栽培活動で、helpsが二つの動作につながる。help＋人＋動詞の原形で学習効果を並べる。別の言い方: School gardening builds food knowledge and teamwork."},{"id":"g2-summary-003","q":"Some office workers take short breaks to move around during the day. For example, they walk along a hallway for five minutes after finishing a task. Moving helps them feel less tired. However, workers need to plan these breaks carefully so that they can still complete their work on time.","q_ja":"一部の会社員は日中、体を動かすために短い休憩を取る。例えば、仕事を一つ終えた後、廊下を5分間歩く。体を動かすと疲れを感じにくくなる。ただし、時間どおりに仕事を終えられるよう、休憩を注意深く計画する必要がある。","choices":[{"t":"Brief activity breaks help employees feel refreshed, but they must manage their time to meet their work deadlines.","why":"正解。体を動かす短い休憩は気分を回復させるが、仕事の期限を守るための時間管理が必要である。"},{"t":"Moving helps them feel less tired, but workers need to plan these breaks carefully to complete their work.","why":"本文の語句をほぼそのまま使っており、休憩の効果と時間管理の必要性を言い換えていない。"},{"t":"Walking along a hallway for five minutes refreshes office workers, but their breaks require planning to avoid delays.","why":"廊下を5分間歩くという例と数字が残っており、体を動かす休憩全般にまとめていない。"},{"t":"Active breaks reduce tiredness, but employees must record their walking distance so their managers can calculate their pay.","why":"歩いた距離を記録し、上司が給与計算に使うという、本文にない内容を加えている。"},{"t":"Office workers feel less tired after moving around, and they sometimes take these breaks after completing a task.","why":"疲労を軽くする効果と休憩のタイミングだけで、仕事に遅れないための時間管理が抜けている。"},{"t":"Taking active breaks always removes tiredness completely and enables all employees to finish every task ahead of schedule.","why":"疲れが必ず完全に消え、全員がすべての仕事を早く終えるという誇張で、注意点も失われている。"}],"answer":0,"point":"However の前の利点と後の注意点を、どちらも残して要約する。","drive":{"ja":"次の段落の要点を英語1文で。体を動かす短い休憩は気分を回復させるが、仕事の期限を守るための時間管理が必要である。","en":"Brief activity breaks help employees feel refreshed, but they must manage their time to meet their work deadlines."},"level":2,"explain":"前半は休憩が主語で、butが従業員の時間管理の必要性をつなぐ。to meetは時間管理の目的を示す。別の言い方: Short active breaks help workers feel refreshed, but they must organize their time to meet their work deadlines."},{"id":"g2-summary-004","q":"A supermarket lowers the prices of food that must be eaten soon. For instance, bread is cheaper near closing time. Customers can save money by choosing these products, and the store throws away less food. However, shoppers should buy only what they can finish before it becomes unsafe to eat.","q_ja":"あるスーパーは、早く食べる必要のある食品を値下げする。例えば、閉店時刻が近づくとパンが安くなる。客はこうした商品を選んで節約でき、店も捨てる食品を減らせる。ただし、安全に食べられなくなる前に食べ切れる量だけ買うべきである。","choices":[{"t":"Customers can save money by choosing these products, and the store throws away less food, but shoppers should be careful.","why":"本文の表現をほぼ写し、注意点も曖昧にしているため、食べ切れる量という要点を適切にまとめていない。"},{"t":"Cheaper bread near closing time saves shoppers money and reduces waste, but customers should purchase only manageable amounts.","why":"閉店間際のパンという具体例を残しており、値引き食品全体の利点と注意点にまとめていない。"},{"t":"Discounted food saves money and limits waste, but stores require customers to show proof that they own refrigerators.","why":"冷蔵庫を持つ証明を店が求めるという、本文にない購入条件を加えている。"},{"t":"Lower prices help shoppers spend less, and customers can find these cheaper food products as closing time approaches.","why":"節約と値引きのタイミングだけで、食品廃棄の削減と食べ切れる量への注意が抜けている。"},{"t":"Discounting food reduces waste and shopping costs, but buyers must choose amounts they can eat before it spoils.","why":"正解。食品の値引きは廃棄と買い物費用を減らすが、安全なうちに食べ切れる量を選ぶ必要がある。"},{"t":"Reducing food prices ends all waste and lets customers buy unlimited amounts without worrying about food becoming unsafe.","why":"廃棄が完全になくなり、量や安全性を気にせず買えるという内容は、本文の注意点に反する誇張である。"}],"answer":4,"point":"値引きの二つの利点と、買い過ぎを避ける条件を一文にまとめる。","drive":{"ja":"次の段落の要点を英語1文で。食品の値引きは廃棄と買い物費用を減らすが、安全なうちに食べ切れる量を選ぶ必要がある。","en":"Discounting food reduces waste and shopping costs, but buyers must choose amounts they can eat before it spoils."},"level":3,"explain":"動名詞句が主語で、but節が購入時の注意点を示す。they can eat before it spoilsがamountsを修飾し、傷む前に食べ切れる量という基準を示す。別の言い方: Discounts on food cut waste and grocery spending, but shoppers must buy only as much as they can eat before it goes bad."},{"id":"g2-summary-005","q":"A neighborhood group invites residents to walk in a local park each weekend. Last month, twelve people joined the walks. Participants get exercise without paying for a gym. They also have chances to talk with neighbors they did not know before, which helps people feel more connected to their community.","q_ja":"ある地域の団体は、毎週末に地元の公園を歩く活動に住民を招いている。先月は12人が参加した。参加者はジムの料金を払わずに運動できる。また、それまで知らなかった近所の人と話す機会もあり、地域とのつながりをより強く感じられる。","choices":[{"t":"Participants get exercise without paying for a gym and have chances to talk with neighbors they did not know before.","why":"本文の表現をほぼそのままつないでおり、運動と地域の人間関係という要点を言い換えていない。"},{"t":"Community walking groups offer inexpensive exercise and help residents build relationships with people who live in their area.","why":"正解。地域の歩く活動は、安く運動する機会を提供し、近所の人との関係づくりを助ける。"},{"t":"Twelve residents walked in a park last month, getting free exercise and opportunities to make friends with nearby people.","why":"参加者12人や先月の公園での活動という数字・具体例を残しており、活動の利点に絞れていない。"},{"t":"Neighborhood walks provide affordable exercise and social contact, while local doctors give each participant a free health check afterward.","why":"活動後に医師が参加者全員を無料で診察するという、本文にない内容を加えている。"},{"t":"Residents exercise without gym fees by walking together in a local park during activities organized by a neighborhood group.","why":"費用をかけずに運動できる点と活動場所だけで、近所の人とのつながりを深める点が抜けている。"},{"t":"Community walking groups make every resident physically fit and ensure that nobody in the neighborhood ever feels lonely again.","why":"住民全員が健康になり、誰も二度と孤独を感じないという効果は本文を超える断定である。"}],"answer":1,"point":"参加人数や場所の例を省き、運動面と人間関係の両方の利点を残す。","drive":{"ja":"次の段落の要点を英語1文で。地域の歩く活動は、安く運動する機会を提供し、近所の人との関係づくりを助ける。","en":"Community walking groups offer inexpensive exercise and help residents build relationships with people who live in their area."},"level":2,"explain":"歩く団体が主語で、offerとhelpをandで結ぶ。help＋人＋動詞の原形で対人面の効果も示す。別の言い方: Local walks offer cheap exercise and social ties."},{"id":"g2-summary-006","q":"A community center teaches people to repair clothes rather than throw them away. In one lesson, visitors learn to replace buttons on shirts. These skills allow people to use clothes longer and spend less on new ones. The classes also help reduce the amount of clothing that ends up in the rubbish.","q_ja":"ある公民館では、服を捨てずに修理する方法を教えている。ある授業では、参加者はシャツのボタンを付け替える方法を学ぶ。こうした技能があれば服を長く使え、新しい服への支出も減らせる。講座は、ごみになる衣服の量を減らすことにも役立つ。","choices":[{"t":"These skills allow people to use clothes longer and spend less on new ones, and the classes also reduce rubbish.","why":"本文の語句をほぼそのままつないでおり、修理の効果を自分の表現でまとめていない。"},{"t":"Replacing buttons on shirts helps people wear clothing longer, spend less on replacements, and throw fewer clothes away.","why":"シャツのボタンの付け替えという具体例を残しており、衣服の修理全体の効果にまとめていない。"},{"t":"Repair lessons reduce clothing costs and waste, and participants receive free sewing machines to continue their work at home.","why":"自宅で使うミシンを参加者が無料でもらえるという、本文にない内容を加えている。"},{"t":"Learning to mend clothing extends its use, lowers replacement costs, and decreases the amount of material thrown away.","why":"正解。衣服の修理を学ぶと、服を長く使え、買い替え費用と捨てる量を減らせる。"},{"t":"People learn to mend clothing at a community center and keep wearing their old clothes for a longer period.","why":"学ぶ場所と長く着られる点だけで、購入費用と衣服のごみを減らす点が抜けている。"},{"t":"Clothing repair classes remove the need to buy any new clothes and completely stop clothing waste throughout the community.","why":"新しい服が一切不要になり、地域の衣服のごみが完全になくなるという誇張である。"}],"answer":3,"point":"具体的な修理方法を省き、長期使用・節約・廃棄削減という効果を残す。","drive":{"ja":"次の段落の要点を英語1文で。衣服の修理を学ぶと、服を長く使え、買い替え費用と捨てる量を減らせる。","en":"Learning to mend clothing extends its use, lowers replacement costs, and decreases the amount of material thrown away."},"level":3,"explain":"学ぶことが主語で、三つの動詞が効果を並べる。過去分詞thrown awayで廃棄対象を短く修飾する。別の言い方: Mending skills extend clothing use and cut costs and waste."},{"id":"g2-summary-007","q":"Online lessons let students study without traveling to a school. One student who lives far away can attend an evening class from home. However, some learners find it difficult to ask questions through a screen. Teachers may need to set aside extra time to check whether everyone understands the lesson.","q_ja":"オンライン授業なら、生徒は学校に通わずに学べる。遠くに住むある生徒も、自宅から夜の授業に参加できる。ただし、画面越しに質問するのは難しいと感じる学習者もいる。教師は全員が授業を理解しているか確かめるため、追加の時間を設ける必要があるかもしれない。","choices":[{"t":"Students study without traveling to a school, but teachers may need to set aside extra time to check understanding.","why":"本文の表現をほぼ写しており、質問の難しさと理解確認の関係を言い換えてまとめていない。"},{"t":"An evening class lets a distant student learn at home, but asking questions online may require extra teacher support.","why":"遠方の生徒が自宅で夜の授業を受けるという具体例を残しており、授業全体の特徴にまとめていない。"},{"t":"Online classes save travel time, but teachers must visit students' homes every week to check their progress in person.","why":"教師が毎週家庭訪問をして対面で学習状況を確認するという、本文にない対応を加えている。"},{"t":"Students attend classes without traveling to school and can join evening lessons while staying in their own homes.","why":"通学せずに受講できる点と自宅での受講だけで、質問の難しさと教師の対応が抜けている。"},{"t":"Online learning makes questions impossible for every student and forces teachers to explain every lesson again to everyone.","why":"全員が質問できず、すべての授業の説明をやり直す必要があるという断定は本文を超えている。"},{"t":"Remote classes avoid travel, but communication difficulties may require teachers to spend more time checking their students' understanding.","why":"正解。オンライン授業は通学を不要にするが、意思疎通の難しさから理解の確認に追加の時間が必要な場合がある。"}],"answer":5,"point":"便利さだけで終えず、意思疎通の難しさと必要になり得る対応も残す。","drive":{"ja":"次の段落の要点を英語1文で。オンライン授業は通学を不要にするが、意思疎通の難しさから理解の確認に追加の時間が必要な場合がある。","en":"Remote classes avoid travel, but communication difficulties may require teachers to spend more time checking their students' understanding."},"level":3,"explain":"前半はRemote classes、後半はcommunication difficultiesが主語で、butが対比を示す。require＋人＋to不定詞で必要となり得る行動を示す。別の言い方: Online classes remove the need to travel, but communication problems may require teachers to spend extra time checking how well their students understand."},{"id":"g2-summary-008","q":"A bus company has placed screens at busy stops to show when buses will arrive. For example, a passenger can see that the next bus is eight minutes away. This makes waiting less stressful. However, the information depends on an internet connection, so the screens may stop updating when the connection fails.","q_ja":"あるバス会社は、到着時刻を表示する画面を利用者の多い停留所に設置した。例えば、次のバスがあと8分で来ると確認できる。これにより待つときの不安が軽くなる。ただし、情報の表示にはインターネット接続が必要なため、接続に不具合があると更新が止まることがある。","choices":[{"t":"This makes waiting less stressful, but the screens may stop updating when the connection fails at busy bus stops.","why":"本文の表現をほぼそのままつないでおり、表示の効果と情報更新の弱点を言い換えていない。"},{"t":"A screen showing an eight minute wait reduces passenger stress, but an internet failure can stop its information updates.","why":"8分待ちという数字と表示例が残っており、到着案内の効果と弱点にまとめていない。"},{"t":"Arrival displays ease passengers' worries while waiting, but connection problems can prevent them from receiving current bus information.","why":"正解。到着案内の表示は待つ不安を和らげるが、通信の問題で最新のバス情報を得られなくなる場合がある。"},{"t":"Bus arrival screens reduce waiting worries, but passengers must pay a small charge whenever they check the displayed times.","why":"到着時刻を確認するたびに利用者が料金を払うという、本文にない条件を加えている。"},{"t":"Passengers feel less worried because screens at busy stops show them when the buses they need will arrive.","why":"到着情報による安心だけで、通信障害によって更新が止まる可能性が抜けている。"},{"t":"Arrival screens completely remove waiting stress and always provide correct bus times even when their internet connection stops working.","why":"不安が完全になくなり、接続が止まっても常に正確な時刻を示すという内容は本文に反する。"}],"answer":2,"point":"機器の利点と、動作に必要な条件が失われた場合の問題をまとめる。","drive":{"ja":"次の段落の要点を英語1文で。到着案内の表示は待つ不安を和らげるが、通信の問題で最新のバス情報を得られなくなる場合がある。","en":"Arrival displays ease passengers' worries while waiting, but connection problems can prevent them from receiving current bus information."},"level":3,"explain":"表示が主語の節と通信問題が主語の節をbutで結ぶ。prevent＋人＋fromで情報取得の障害を表す。別の言い方: Displays ease worries, but outages can block updates."},{"id":"g2-summary-009","q":"An apartment building has a shelf where residents leave books they have finished reading. Last week, someone added three travel books. Other residents can take books without paying and return them when they finish. By passing books around, people enjoy different stories without buying new copies, and fewer books are thrown away.","q_ja":"ある集合住宅には、読み終えた本を住民が置く棚がある。先週は誰かが旅行の本を3冊置いた。ほかの住民は無料で本を持っていき、読み終えたら返せる。本を回し読みすることで、新しく買わずにさまざまな物語を楽しめ、捨てられる本も減る。","choices":[{"t":"Sharing books among neighbors provides reading variety at no cost and reduces the number of books people discard.","why":"正解。住民同士で本を共有すると、無料でさまざまな本を読め、捨てる本の数も減らせる。"},{"t":"People enjoy different stories without buying new copies, and fewer books are thrown away by residents passing books around.","why":"本文の表現をほぼそのまま使っており、本の共有による読書と廃棄削減の利点を言い換えていない。"},{"t":"Sharing three travel books on an apartment shelf lets residents read for free and keeps books out of rubbish.","why":"旅行の本3冊という具体例と数字を残しており、本の共有全体の効果にまとめていない。"},{"t":"Book sharing offers free reading and cuts waste, while publishers send new books to the building each month.","why":"出版社が毎月新しい本を住宅に送るという、本文にない仕組みを加えている。"},{"t":"Residents borrow books without paying from a shelf in their building and put them back after they finish reading.","why":"無料で借りて返す仕組みだけで、さまざまな本を読める点と廃棄を減らす点が抜けている。"},{"t":"Sharing books means residents never need to purchase any books again and prevents every book from being thrown away.","why":"今後一切本を買う必要がなくなり、すべての本の廃棄を防げるという誇張である。"}],"answer":0,"point":"冊数や本の種類を省き、多様な読書・費用・廃棄量への効果をまとめる。","drive":{"ja":"次の段落の要点を英語1文で。住民同士で本を共有すると、無料でさまざまな本を読め、捨てる本の数も減らせる。","en":"Sharing books among neighbors provides reading variety at no cost and reduces the number of books people discard."},"level":2,"explain":"本の共有が主語で、二つの動詞が利点を並べる。at no costで要約に無料という条件を残す。別の言い方: Book sharing offers varied reading for free and cuts waste."},{"id":"g2-summary-010","q":"A youth center offers cooking lessons for teenagers. In one class, students make vegetable soup using simple ingredients. They learn to prepare meals instead of depending on ready meals from shops. They also practice choosing different kinds of food, which helps them plan meals that support their health when they live on their own.","q_ja":"ある青少年センターは10代の若者に料理教室を開いている。ある授業では、簡単な材料で野菜スープを作る。生徒は店の調理済み食品に頼らず食事を作ることを学ぶ。また、さまざまな種類の食品を選ぶ練習をし、将来一人で暮らすときに健康を支える献立を考えるのに役立てる。","choices":[{"t":"They learn to prepare meals instead of depending on ready meals from shops and practice choosing different kinds of food.","why":"本文の語句をほぼそのままつないでおり、自立後の食生活に役立つという要旨を言い換えていない。"},{"t":"Making vegetable soup with simple ingredients helps teenagers cook for themselves and select healthy meals when living on their own.","why":"野菜スープと簡単な材料という具体例が残っており、料理教室で身につける力全体にまとめていない。"},{"t":"Cooking lessons teach teenagers independent meal preparation and healthy choices, while the center delivers free ingredients to their homes weekly.","why":"センターが毎週材料を無料で自宅に届けるという、本文にないサービスを加えている。"},{"t":"Teenagers practice preparing their own meals at a youth center so they can depend less on food bought from shops.","why":"自分で調理して市販食品への依存を減らす点だけで、健康に配慮して食品を選ぶ力が抜けている。"},{"t":"Cooking classes prepare teenagers to feed themselves and make healthy food choices when they begin living independently.","why":"正解。料理教室は、若者が自立して暮らす際に、自分で食事を作り健康的な食品を選ぶ力を育てる。"},{"t":"Cooking lessons ensure that all teenagers always eat perfectly healthy meals and never need to buy any prepared food again.","why":"全員が常に完全に健康的な食事をし、調理済み食品を一切買わなくなるという断定は本文を超えている。"}],"answer":4,"point":"料理の具体例を省き、自分で作る力と健康的に選ぶ力を残す。","drive":{"ja":"次の段落の要点を英語1文で。料理教室は、若者が自立して暮らす際に、自分で食事を作り健康的な食品を選ぶ力を育てる。","en":"Cooking classes prepare teenagers to feed themselves and make healthy food choices when they begin living independently."},"level":2,"explain":"料理教室が主語で、when節が自立後の時を示す。prepare＋人＋toで将来への備えを要約する。別の言い方: Cooking classes build self-reliance and healthy eating skills."},{"id":"g2-summary-201","q":"Some schools open their gardens to local people on weekends. Neighbors help students grow food and teach them simple skills. For example, they show children how to plant tomatoes. Working together gives students useful knowledge and helps people in the area become closer.","q_ja":"学校の庭で地域の人と作物を育てることで、生徒は知識を得て地域の交流も深まる。例えば、住民がトマトの植え方を教える。","choices":[{"t":"Neighbors help students grow food and teach them simple skills.","why":"本文の丸写しに近く、地域の交流が深まる点も欠けている。"},{"t":"Growing tomatoes at school teaches children skills and connects neighbors.","why":"具体例のトマトを残しており、活動全体を一般化していない。"},{"t":"School gardens help children learn and bring local people together.","why":"正解。学習と地域の交流という二つの効果をまとめ、作物の例は省く。"},{"t":"Garden projects help schools earn money and build local friendships.","why":"本文にない学校の収入という内容を足している。"},{"t":"Children learn useful gardening skills from neighbors during weekend activities.","why":"学習面だけで、地域の人々の関係が深まる点がない。"},{"t":"School gardens give every child the skills to grow food.","why":"すべての子供が技能を身につけるとは本文に書かれていない。"}],"answer":2,"point":"学習と地域の交流という二つの効果をまとめ、作物の例は省く。","level":1,"drive":{"ja":"次の段落の要点を英語1文で。学校の庭で地域の人と作物を育てることで、生徒は知識を得て地域の交流も深まる。","en":"School gardens help children learn and bring local people together."},"explain":"School gardensが主語で、helpとbringをandで結ぶ。help＋人＋動詞原形で、学習を促す効果を示せる。別の言い方: School gardens support learning and community ties."},{"id":"g2-summary-202","q":"Some supermarkets offer lower prices for food that must be eaten soon. This helps customers save money and keeps usable food out of the trash. For example, bread may cost half its usual price in the evening. However, shoppers need to plan their meals carefully so that their purchases are eaten in time.","q_ja":"期限の近い食品の値引きは節約と食品廃棄の削減に役立つが、購入者には計画的な消費が必要である。パンが夕方に半額になる例が挙げられている。","choices":[{"t":"This helps customers save money and keeps usable food out of the trash, but shoppers need to plan their meals carefully.","why":"本文の表現をほぼそのままつなげており、言い換えができていない。"},{"t":"Selling evening bread at half price saves shoppers money and prevents waste if they finish their purchases in time.","why":"半額のパンという具体例と数字が残っている。"},{"t":"Lower food prices reduce waste and household spending, while stores teach customers how to prepare meals before products spoil.","why":"店が調理法を教えるという本文にない内容を加えている。"},{"t":"Customers can spend less on food by buying cheaper products in the evening and planning when to eat them.","why":"購入者の節約と計画だけで、食品廃棄を減らす効果を欠いている。"},{"t":"Discounting food near its use date reduces costs and waste, but buyers must arrange to consume it promptly.","why":"正解。節約・廃棄削減の利点と、早く消費するための計画の必要性を両方残す。"},{"t":"Discounted food removes the problem of supermarket waste and allows shoppers to reduce spending without changing their eating plans.","why":"廃棄問題がなくなると言い過ぎており、計画が必要という注意点にも反する。"}],"answer":4,"point":"節約・廃棄削減の利点と、早く消費するための計画の必要性を両方残す。","level":2,"drive":{"ja":"次の段落の要点を英語1文で。期限の近い食品の値引きは節約と食品廃棄の削減に役立つが、購入者には計画的な消費が必要である。","en":"Discounting food near its use date reduces costs and waste, but buyers must arrange to consume it promptly."},"explain":"動名詞句が主語で、butが注意点を導く。arrange toで事前の手配を表し、必要な対応を示せる。別の言い方: Food discounts cut costs and waste but need meal planning."},{"id":"g2-summary-203","q":"A town moved its recycling collection point closer to a bus stop, expecting more residents to use it. The number of visitors rose, but workers found more unsuitable items among the materials collected. After clearer signs were added, sorting improved. The experience suggests that convenient locations work better when people also receive clear instructions.","q_ja":"資源回収は利用しやすい場所に設けるだけでなく、明確な分別案内を組み合わせることが重要である。バス停近くへの移転で利用者は増えたが、不適切な品も増え、表示の改善で分別が改善した。","choices":[{"t":"Making recycling easier to access is more effective when residents also understand how to separate their waste correctly.","why":"正解。利用しやすさだけでは不十分で、正しい分別を伝える案内との組み合わせが要点となる。"},{"t":"The experience suggests that convenient locations work better when people also receive clear instructions about the materials collected.","why":"本文の結論部分と語句をほぼそのまま使っている。"},{"t":"Moving collection near a bus stop increased visits, while adding clearer signs later helped residents sort their recycling better.","why":"バス停への移転という個別の事例を残しており、一般的な要点にまとめていない。"},{"t":"Residents recycle more accurately when workers check their materials at convenient collection points and explain mistakes to them directly.","why":"職員が直接点検して説明したという本文にない対応を加えている。"},{"t":"Clearer signs improved waste sorting after workers noticed unsuitable items among materials brought to the new recycling collection point.","why":"表示改善と分別だけで、利用しやすい場所にする意義が抜けている。"},{"t":"Providing convenient collection points and clear signs ensures that residents bring suitable materials and removes the need for further guidance.","why":"適切な分別の保証や追加の案内が不要になることまでは示されていない。"}],"answer":0,"point":"利用しやすさだけでは不十分で、正しい分別を伝える案内との組み合わせが要点となる。","level":3,"drive":{"ja":"次の段落の要点を英語1文で。資源回収は利用しやすい場所に設けるだけでなく、明確な分別案内を組み合わせることが重要である。","en":"Making recycling easier to access is more effective when residents also understand how to separate their waste correctly."},"explain":"動名詞句が主語、isが動詞で、when節は条件を示す。how toは方法をまとめ、必要な知識を示せる。別の言い方: Clear guidance makes convenient recycling more effective."},{"id":"g2-summary-204","q":"Some libraries lend tools as well as books. People can borrow things they rarely use, such as electric drills. They spend less money because they do not need to buy these items. Sharing tools also means that fewer new products need to be made.","q_ja":"図書館で道具を貸し出すと、利用者の出費が減り、新しい製品を作る必要も少なくなる。電動ドリルのように使用頻度の低い物を借りられる。","choices":[{"t":"People spend less money because they do not need to buy these items.","why":"本文の表現をほぼ写しており、製造需要が減る点も抜けている。"},{"t":"Lending electric drills saves people money and reduces the need for production.","why":"具体例の電動ドリルを残している。"},{"t":"Library tools lower household costs and provide extra income for local shops.","why":"地元の店の収入が増えるという本文にない内容を足している。"},{"t":"People avoid buying rarely used tools by borrowing them from local libraries.","why":"購入費の節約だけで、新しい製品の製造が減る点がない。"},{"t":"Tool sharing ends unnecessary production and gives every family major financial savings.","why":"不要な製造がなくなり全家庭が大幅に節約できるという断定は強すぎる。"},{"t":"Borrowing shared tools saves money and reduces demand for new goods.","why":"正解。個別の道具名を省き、費用と製造需要への二つの効果をまとめる。"}],"answer":5,"point":"個別の道具名を省き、費用と製造需要への二つの効果をまとめる。","level":1,"drive":{"ja":"次の段落の要点を英語1文で。図書館で道具を貸し出すと、利用者の出費が減り、新しい製品を作る必要も少なくなる。","en":"Borrowing shared tools saves money and reduces demand for new goods."},"explain":"動名詞句が主語で、savesとreducesを並列する。demand forは需要の対象を示し、購入減の影響を要約できる。別の言い方: Tool sharing cuts costs and demand for new goods."},{"id":"g2-summary-205","q":"Some companies let employees choose when to start work within a set period. Workers can avoid crowded trains or take their children to school before coming to the office. However, teams sometimes struggle to find a time when everyone is available. Companies therefore need to arrange shared hours for meetings and group tasks.","q_ja":"始業時刻の選択は従業員の生活に合わせやすい一方、共同作業のために全員が働く時間を確保する必要がある。混雑回避や子供の送迎ができるが、予定を合わせにくい場合もある。","choices":[{"t":"Workers can avoid crowded trains or take their children to school before coming to the office within a set period.","why":"本文の語句をほぼそのまま使い、共同作業の課題を含めていない。"},{"t":"Flexible starting times suit employees' personal needs, but teams require common working hours to coordinate their activities.","why":"正解。時間選択の利点と、共同作業を調整するための条件を対比してまとめる。"},{"t":"Avoiding crowded trains and taking children to school become easier, though employees still need shared hours for team activities.","why":"混雑した電車と送迎という具体例を残している。"},{"t":"Allowing different starting times supports workers' private lives, but companies must employ extra staff to manage meetings and group tasks.","why":"会議の管理に追加の人員が必要だという内容は本文にない。"},{"t":"Employees gain more control over their mornings because they can choose their starting times within a period set by companies.","why":"従業員側の利点だけで、予定調整の難しさと共通時間の必要性がない。"},{"t":"Flexible schedules meet employees' needs and make teamwork more efficient once companies set a common period for meetings and tasks.","why":"共通時間の設定で共同作業の効率まで向上するとは述べていない。"}],"answer":1,"point":"時間選択の利点と、共同作業を調整するための条件を対比してまとめる。","level":2,"drive":{"ja":"次の段落の要点を英語1文で。始業時刻の選択は従業員の生活に合わせやすい一方、共同作業のために全員が働く時間を確保する必要がある。","en":"Flexible starting times suit employees' personal needs, but teams require common working hours to coordinate their activities."},"explain":"二つの主語と動詞の組をbutで対比する。to coordinateは目的を表し、共通時間が必要な理由を示せる。別の言い方: Flexible starts suit workers, but teams need shared hours."},{"id":"g2-summary-206","q":"A school replaced printed notices with messages sent to parents' phones. Although teachers used less paper, some families missed information because they shared a device or checked messages infrequently. The school then offered paper copies on request. Keeping both methods helped it reduce printing while still reaching families with different communication needs.","q_ja":"学校からの連絡を電子化しつつ紙も選べるようにすることで、印刷を減らしながら家庭ごとの連絡手段の違いに対応できる。携帯端末を共有する家庭などが情報を見落としたため、希望者には紙を渡した。","choices":[{"t":"Keeping both methods helped it reduce printing while still reaching families with different communication needs after changing its notices.","why":"本文の結論の表現をほぼそのまま使っている。"},{"t":"Sending notices to phones and providing paper on request reaches families who share devices while reducing the school's printing.","why":"端末を共有する家庭という具体例を残している。"},{"t":"Schools can cut printing and reach families by offering paper notices while teaching parents to check electronic messages regularly.","why":"保護者に確認の習慣を教えるという対応は本文にない。"},{"t":"Combining electronic notices with optional printed copies lets schools save paper while keeping families with different needs informed.","why":"正解。電子化による節約と、紙を選べることによる情報保障の両方を残す。"},{"t":"Providing printed notices on request helps families receive school information when shared devices or infrequent phone checks cause problems.","why":"情報の受け取りやすさだけで、電子化による紙の節約が抜けている。"},{"t":"Using both paper and electronic notices prevents families from missing school information while allowing schools to reduce their printing.","why":"連絡の見落としを防ぎきれるという断定は本文の範囲を超えている。"}],"answer":3,"point":"電子化による節約と、紙を選べることによる情報保障の両方を残す。","level":3,"drive":{"ja":"次の段落の要点を英語1文で。学校からの連絡を電子化しつつ紙も選べるようにすることで、印刷を減らしながら家庭ごとの連絡手段の違いに対応できる。","en":"Combining electronic notices with optional printed copies lets schools save paper while keeping families with different needs informed."},"explain":"動名詞句が主語、letsが動詞で、whileは同時の効果を示す。keep＋目的語＋過去分詞で、情報が届く状態を表せる。別の言い方: Mixed notice formats save paper and inform families."},{"id":"g2-summary-207","q":"Some towns hold walking events for residents. People follow an easy route together and talk while they walk. For example, a group may visit a nearby park. These events help people move their bodies more often and give them chances to make new friends.","q_ja":"地域のウォーキング行事は、住民の運動と新しい友人づくりの機会になる。参加者は一緒に歩き、近くの公園を訪れることもある。","choices":[{"t":"Community walks encourage exercise and help residents form new friendships.","why":"正解。行き先の例を省き、運動と交流という二つの要点を言い換える。"},{"t":"These events help people move their bodies more often together.","why":"本文の語句の丸写しに近く、交流の効果も含めていない。"},{"t":"Walking to nearby parks helps residents exercise and meet new people.","why":"具体例である公園への訪問を残している。"},{"t":"Town walks improve fitness and attract more visitors to local stores.","why":"地元の店への来客増加という本文にない効果を加えている。"},{"t":"Residents get more exercise by following easy routes at town events.","why":"運動面だけで、友人づくりの効果が抜けている。"},{"t":"Community walks make residents healthy and end loneliness throughout the town.","why":"健康や孤独解消の効果を地域全体に断定していて言い過ぎである。"}],"answer":0,"point":"行き先の例を省き、運動と交流という二つの要点を言い換える。","level":1,"drive":{"ja":"次の段落の要点を英語1文で。地域のウォーキング行事は、住民の運動と新しい友人づくりの機会になる。","en":"Community walks encourage exercise and help residents form new friendships."},"explain":"Community walksが主語で、動詞をandで結ぶ。form friendshipsは友人関係の成立を表し、交流の効果を示す。別の言い方: Local walks promote exercise and friendship."},{"id":"g2-summary-208","q":"Some clothing shops collect used clothes from customers and repair them for resale. This gives clothing a longer life and offers shoppers cheaper choices. For example, a damaged jacket can be sold again after its buttons are replaced. However, checking and repairing each item takes time, so shops must consider the additional work involved.","q_ja":"古着を直して販売すると衣服を長く使え、安い商品も提供できるが、店には点検と修理の手間がかかる。ボタンを付け直した上着の再販売が例に挙げられている。","choices":[{"t":"This gives clothing a longer life and offers shoppers cheaper choices, but checking and repairing each item takes time.","why":"本文の表現をほぼそのまま組み合わせている。"},{"t":"Replacing buttons on damaged jackets lets shops sell affordable clothing again, although checking and repairing the items takes time.","why":"ボタンと上着という具体例が残っている。"},{"t":"Repairing clothes for resale reduces waste and prices, while customers pay shops a fee to cover the additional work.","why":"客が修理の手間を補う料金を支払うという内容はない。"},{"t":"Shops spend time checking used clothes and making repairs before offering the items for sale again to their customers.","why":"店側の作業だけで、衣服の長期使用と安い選択肢という利点がない。"},{"t":"Selling repaired clothing provides cheaper choices and longer use, making the extra preparation worthwhile for every shop that participates.","why":"追加作業に見合う価値がどの店にもあるとは述べられていない。"},{"t":"Reselling repaired clothing extends its use and provides affordable options, although shops face extra work preparing the items.","why":"正解。再利用と価格の利点をまとめ、店側の追加作業という負担も含める。"}],"answer":5,"point":"再利用と価格の利点をまとめ、店側の追加作業という負担も含める。","level":2,"drive":{"ja":"次の段落の要点を英語1文で。古着を直して販売すると衣服を長く使え、安い商品も提供できるが、店には点検と修理の手間がかかる。","en":"Reselling repaired clothing extends its use and provides affordable options, although shops face extra work preparing the items."},"explain":"動名詞句が主語で、although節は留保を示す。face extra workは負担を表し、施策の難点を示す。別の言い方: Resale extends clothing use at low prices but takes work."},{"id":"g2-summary-209","q":"A neighborhood allowed residents to turn an empty lot into small vegetable gardens. At first, each person watered only their own area, and plants suffered when owners were away. Residents later agreed to share watering duties. This arrangement kept more plants healthy, although members still had to discuss how to divide the work fairly.","q_ja":"地域の菜園で水やりを分担すると植物を守りやすくなるが、公平な作業分担の調整は引き続き必要である。当初は各自が自分の区画だけに水をやり、不在時に植物が弱っていた。","choices":[{"t":"This arrangement kept more plants healthy, although members still had to discuss how to divide the work fairly among themselves.","why":"本文の結論をほぼそのまま使っており、共同管理への言い換えができていない。"},{"t":"Watering vegetables together on an empty lot protects plants during owners' absences, though residents must discuss fair divisions of work.","why":"空き地での野菜栽培という具体例を残している。"},{"t":"Sharing care in community gardens protects plants during absences, but residents still need to agree on a fair workload.","why":"正解。共同管理の効果を認めつつ、公平な負担配分がなお必要という留保を残す。"},{"t":"Joint garden care keeps plants healthy during absences, but neighborhood leaders must decide each resident's duties to ensure fair treatment.","why":"地域の責任者が作業を決めるという本文にない方法を加えている。"},{"t":"Residents need discussions about fairness when dividing watering duties after problems occurred while individual garden owners were away from home.","why":"公平な分担の課題だけを述べ、共同作業で植物の状態が改善した点がない。"},{"t":"Shared gardening duties keep plants healthy during absences and settle disagreements once residents have divided the work among themselves fairly.","why":"分担で意見の相違まで解決するという効果は本文から言えない。"}],"answer":2,"point":"共同管理の効果を認めつつ、公平な負担配分がなお必要という留保を残す。","level":3,"drive":{"ja":"次の段落の要点を英語1文で。地域の菜園で水やりを分担すると植物を守りやすくなるが、公平な作業分担の調整は引き続き必要である。","en":"Sharing care in community gardens protects plants during absences, but residents still need to agree on a fair workload."},"explain":"動名詞句が主語で、butは対比を示す。still need toは必要性の継続を表し、残る課題を示せる。別の言い方: Shared garden care protects plants but needs fair workloads."},{"id":"g2-summary-210","q":"Some schools let students taste new lunch dishes before adding them to the menu. Students give their opinions, and cooks change the dishes when needed. For example, they may use fewer onions. Listening to students can make meals more popular and leave less food uneaten.","q_ja":"新しい給食について生徒の意見を聞いて調整すると、人気が高まり食べ残しも減らせる。タマネギを減らすことが例に挙げられている。","choices":[{"t":"Students give their opinions, and cooks change the dishes when needed.","why":"本文の文をそのまま写しており、人気や食べ残しへの効果がない。"},{"t":"Using fewer onions can improve school meals and reduce food waste.","why":"タマネギを減らすという具体例を要点として残している。"},{"t":"Students' meal suggestions reduce waste and lower the cost of ingredients.","why":"食材費が下がるという本文にない効果を足している。"},{"t":"Students taste new dishes and tell cooks which changes they prefer.","why":"試食と意見聴取の手順だけで、その効果を要約していない。"},{"t":"Student feedback can improve school meals and reduce wasted food.","why":"正解。試食の具体例を省き、生徒の意見が給食の改善と廃棄削減につながる点をまとめる。"},{"t":"Listening to students makes every school dish popular and prevents leftovers.","why":"どの料理も人気になり食べ残しがなくなるという断定は強すぎる。"}],"answer":4,"point":"試食の具体例を省き、生徒の意見が給食の改善と廃棄削減につながる点をまとめる。","level":1,"drive":{"ja":"次の段落の要点を英語1文で。新しい給食について生徒の意見を聞いて調整すると、人気が高まり食べ残しも減らせる。","en":"Student feedback can improve school meals and reduce wasted food."},"explain":"Student feedbackが主語で、canは両動詞にかかる。canは可能性を表し、効果を断定せず要約できる。別の言い方: Student input can improve meals and reduce leftovers."},{"id":"g2-summary-211","q":"Some schools let students borrow used uniforms. Families spend less money on school clothes. The schools also throw away fewer uniforms. For example, one school collects jackets every spring. Students can choose clean clothes that fit them and return them when they grow.","q_ja":"使い終えた制服を生徒に貸す学校がある。家庭は学校用の服に使うお金を減らせる。学校が捨てる制服も少なくなる。例えば、ある学校は毎年春に上着を集めている。生徒は体に合う清潔な服を選び、成長したら返すことができる。","choices":[{"t":"Families spend less money on school clothes and schools throw away fewer uniforms.","why":"本文の語句をほぼそのままつないでおり、言い換えた要約になっていない。"},{"t":"Sharing school clothing saves families money and helps cut waste.","why":"正解。制服の貸し借りによる家計とごみ削減の両方の利点を言い換えている。"},{"t":"Collecting jackets every spring helps schools offer cheap clothes and reduce waste.","why":"上着を毎年春に集めるという具体例が残っている。"},{"t":"Uniform sharing cuts waste and gives schools money to buy books.","why":"学校が本を買うお金を得ることは本文にない。"},{"t":"Students choose clean uniforms that fit and return them after growing.","why":"選び方と返し方の細部だけで、費用とごみの削減をまとめていない。"},{"t":"Sharing uniforms ends clothing costs and stops schools from producing waste.","why":"費用も学校のごみもなくなるという断定は、本文の削減という内容を超えている。"}],"answer":1,"point":"制服の例や貸し出しの手順を省き、費用とごみが減るという二つの効果を残す。","level":1,"drive":{"ja":"次の段落の要点を英語1文で。学校で制服を共有すると、家庭の出費とごみを減らせる。","en":"Sharing school clothing saves families money and helps cut waste."},"explain":"動名詞句が主語で、savesとhelpsをandで結ぶ。save＋人＋物は出費の軽減を端的に示せる。別の言い方: Sharing uniforms cuts family costs and waste."},{"id":"g2-summary-212","q":"Several neighborhood shops now accept containers that customers bring from home. This service reduces the need for packaging, but workers must check whether each container is clean. For example, a bakery sells bread this way. Shop owners therefore need clear rules to protect food while producing less rubbish.","q_ja":"近所のいくつかの店は、客が家から持参する容器を受け入れるようになった。このサービスは包装を減らすが、従業員は容器がそれぞれ清潔か確かめなければならない。例えば、あるパン屋はこの方法でパンを売っている。そのため店主は、ごみを減らしながら食品を守るための明確なルールを必要としている。","choices":[{"t":"This service reduces the need for packaging, but workers must check whether each container is clean.","why":"本文の一文をそのまま使っており、語句を言い換えていない。"},{"t":"A bakery accepts customers' own containers to reduce packaging while staff check them to keep food safe.","why":"パン屋という具体例を残しており、店全体に共通する要点にまとめていない。"},{"t":"Stores can reduce packaging with personal containers, although customers must pay extra for staff to inspect them.","why":"容器の確認のために客が追加料金を払うことは本文にない。"},{"t":"Workers need to inspect containers brought from home and follow clear rules to protect the food they sell.","why":"衛生管理だけを述べ、ごみや包装を減らす目的を落としている。"},{"t":"Customer containers help stores limit waste, but safe use requires clear standards for checking their cleanliness.","why":"正解。包装ごみの削減と、そのために必要な衛生確認のルールを言い換えている。"},{"t":"Accepting containers from customers allows shops to remove packaging waste without facing any problems with food safety.","why":"包装ごみをなくし、食品の安全上の問題も生じないとするのは言い過ぎ。"}],"answer":4,"point":"環境面の利点と衛生上の条件を、逆接で結んで両方残す。","level":2,"drive":{"ja":"次の段落の要点を英語1文で。客が持参する容器で店のごみを減らせるが、安全に使うには清潔さを確認する明確な基準が必要だ。","en":"Customer containers help stores limit waste, but safe use requires clear standards for checking their cleanliness."},"explain":"butで利点と条件の二節を結ぶ。require＋名詞で、安全確保に必要な条件を要約できる。別の言い方: Reusing containers cuts waste but requires hygiene checks."},{"id":"g2-summary-213","q":"A town is considering keeping its library open later without adding staff. Visitors would enter with special cards, allowing people who work late to borrow books. However, some residents need help using library services. Although the town could save on wages, replacing staffed hours with card access might limit support for those visitors.","q_ja":"ある町は職員を増やさずに図書館の開館時間を延ばすことを検討している。利用者は専用カードで入館し、遅くまで働く人も本を借りられるようになる。しかし、図書館のサービスを使うのに助けが必要な住民もいる。町は人件費を節約できる可能性があるが、職員がいる時間をカードで入る時間に置き換えると、そうした利用者への支援が限られるかもしれない。","choices":[{"t":"Extending library access without employees may control costs and improve convenience while reducing assistance available to some users.","why":"正解。時間延長による便利さと費用面の利点、支援が減る可能性を過不足なく言い換えている。"},{"t":"Although the town could save on wages, replacing staffed hours with card access might limit support for those visitors.","why":"本文の最後の一文をそのまま使っており、言い換えた要約ではない。"},{"t":"Special cards would let people who work late borrow books, saving wages but leaving some residents without staff assistance.","why":"専用カードと遅くまで働く人という具体的な仕組みや対象が残っている。"},{"t":"Longer library hours may lower employment costs and improve access, while volunteers provide the support that visitors still need.","why":"ボランティアが支援を提供するという解決策は本文にない。"},{"t":"Residents who struggle with library services may receive less help when the town replaces staffed hours with entry by card.","why":"支援の減少だけをまとめ、利用時間が広がる便利さと費用面の利点を落としている。"},{"t":"Libraries that extend opening hours without employees will reduce costs and satisfy working residents while meeting every visitor's needs.","why":"すべての利用者のニーズを満たすとは言えず、支援が限られる可能性を無視している。"}],"answer":0,"point":"便利さ・費用・支援の三点を残し、可能性を確実な結果に変えない。","level":3,"drive":{"ja":"次の段落の要点を英語1文で。職員なしで図書館の利用時間を延ばすと費用を抑えて便利にできる一方、一部の利用者への支援が減る可能性がある。","en":"Extending library access without employees may control costs and improve convenience while reducing assistance available to some users."},"explain":"動名詞句が主語で、while以下が不利益を添える。mayは効果を断定せず、提案の評価に使える。別の言い方: Unstaffed hours may cut costs and improve access but limit help."},{"id":"g2-summary-214","q":"Some towns offer free walking groups for older people. Walking helps members stay healthy. Meeting others also gives them a chance to make friends. For example, one group meets in a park on Tuesdays. Members enjoy talking as they walk together near their homes.","q_ja":"高齢者向けに無料のウォーキンググループを設けている町もある。歩くことは参加者の健康維持に役立つ。他の人に会うことで友人を作る機会も得られる。例えば、あるグループは火曜日に公園に集まる。参加者は家の近くを一緒に歩きながら会話を楽しむ。","choices":[{"t":"Walking helps members stay healthy and gives them a chance to make friends.","why":"本文の表現をほぼそのまま組み合わせており、言い換えができていない。"},{"t":"Tuesday walks in a park help older people stay well and make friends.","why":"火曜日と公園という具体例が残っている。"},{"t":"Walking groups help older people stay healthy and earn money from towns.","why":"参加者が町からお金を得ることは本文にない。"},{"t":"Group walks help older adults stay well and build friendships.","why":"正解。健康維持と友人づくりという二つの利点を、具体例を省いて言い換えている。"},{"t":"Older people meet near home and enjoy talking during their walks.","why":"場所と会話の細部にとどまり、健康面の利点を落としている。"},{"t":"Walking groups keep older people free from illness and solve loneliness.","why":"病気にならず孤独も解消すると言い切るのは、本文の利点を誇張している。"}],"answer":3,"point":"活動の場所や曜日を省き、健康と人とのつながりを要点として残す。","level":1,"drive":{"ja":"次の段落の要点を英語1文で。グループで歩くことは、高齢者の健康維持と友人づくりに役立つ。","en":"Group walks help older adults stay well and build friendships."},"explain":"Group walksが主語で、help以下に二つの動作を並べる。help＋人＋原形で活動の効用を述べられる。別の言い方: Walking together supports seniors' health and friendships."},{"id":"g2-summary-215","q":"Some companies allow employees to take short online courses during working hours. Staff can learn useful skills without traveling to a classroom. For example, they may study how to prepare reports. However, regular duties sometimes interrupt lessons, so managers need to set aside time when employees can focus on learning.","q_ja":"勤務時間中に短いオンライン講座を受けることを従業員に認める会社もある。従業員は教室へ移動せずに役立つ技能を学べる。例えば、報告書の作成方法を学ぶことがある。しかし、通常業務で受講が中断することもあるため、管理職は従業員が学習に集中できる時間を確保する必要がある。","choices":[{"t":"Regular duties sometimes interrupt lessons, so managers need to set aside time when employees can focus on learning.","why":"本文の表現をほぼそのまま抜き出しており、言い換えた要約になっていない。"},{"t":"Learning to prepare reports online saves employees travel, but managers must protect their study time from regular duties.","why":"報告書の作成という講座内容の具体例を残している。"},{"t":"Online workplace training offers convenient skill development, but employees need study periods free from interruptions by their usual tasks.","why":"正解。移動せず技能を学べる便利さと、業務に妨げられない学習時間の必要性をまとめている。"},{"t":"Online courses help staff gain skills conveniently, while managers reward workers who finish lessons with higher monthly pay.","why":"講座の修了者の給料を上げることは本文にない。"},{"t":"Managers should reserve time for employees to concentrate on lessons because regular work can interrupt learning during office hours.","why":"学習時間の確保だけを述べ、移動なしで技能を学べる利点を落としている。"},{"t":"Taking online courses at work gives employees the skills they need and removes the need for classroom training entirely.","why":"必要な技能がすべて身に付き、教室での研修が不要になるという結論は本文を超えている。"}],"answer":2,"point":"オンライン受講の利点だけでなく、集中する時間を確保する必要性も残す。","level":2,"drive":{"ja":"次の段落の要点を英語1文で。職場でのオンライン研修は便利に技能を伸ばせるが、通常業務で中断されない学習時間が必要だ。","en":"Online workplace training offers convenient skill development, but employees need study periods free from interruptions by their usual tasks."},"explain":"butで研修の利点と必要条件を結ぶ。free fromは妨げがない状態を表し、改善策を示せる。別の言い方: Online training is convenient but needs uninterrupted study time."},{"id":"g2-summary-216","q":"A city plans to replace paper bus timetables with electronic displays. These would show delays, helping passengers adjust their journeys. However, displays may stop working during power failures. Keeping a basic printed timetable at each stop would provide useful information then, even though it could not show changes in the service.","q_ja":"ある市は、紙のバス時刻表を電子表示に置き換える計画を立てている。電子表示は遅延を知らせ、乗客が移動計画を調整するのに役立つ。しかし、停電時には作動しなくなる可能性がある。各停留所に基本的な紙の時刻表を残せば、その際に役立つ情報を提供できるが、運行状況の変化は示せない。","choices":[{"t":"Keeping a basic printed timetable at each stop would provide useful information then, even though it could not show changes.","why":"本文の最後の文をほぼそのまま使っており、言い換えができていない。"},{"t":"Electronic displays show bus delays, while a printed timetable at each stop supplies basic information when power failures occur.","why":"停留所ごとの紙の時刻表という具体的な設置方法が残っている。"},{"t":"Electronic travel information needs a paper backup because passengers cannot understand the instructions shown on screens during bus delays.","why":"乗客が画面の案内を理解できないという理由は本文にない。"},{"t":"Printed bus schedules provide basic travel information during power failures, although they cannot report changes to the usual service.","why":"紙の時刻表の役割だけを述べ、電子表示で最新情報を得られる利点を落としている。"},{"t":"Combining electronic displays with printed schedules ensures passengers receive accurate information about every service change, including during power failures.","why":"停電中もすべての変更を正確に把握できるとは言えず、紙の時刻表の限界を誇張している。"},{"t":"Electronic travel information helps passengers respond to disruptions, but paper backups remain useful despite lacking updates when electricity is unavailable.","why":"正解。最新情報の利点と、更新はできなくても停電時に役立つ紙の補助という関係をまとめている。"}],"answer":5,"point":"電子表示と紙の役割を区別し、紙では最新の変更を示せないという限界も保つ。","level":3,"drive":{"ja":"次の段落の要点を英語1文で。電子の交通情報は運行の乱れへの対応に役立つが、停電時には更新できない紙の補助情報も有用だ。","en":"Electronic travel information helps passengers respond to disruptions, but paper backups remain useful despite lacking updates when electricity is unavailable."},"explain":"butは電子情報の利点と紙の補助情報の有用性を対比する。despite＋動名詞で更新できないという限界を認め、when節で停電時という条件を示す。別の言い方: Electronic information helps travelers adjust to service disruptions, but printed backups are still useful during power failures even though they cannot provide updates."},{"id":"g2-summary-217","q":"Some schools put water stations in their halls. Students can fill their own bottles there instead of buying drinks. This helps them spend less money and use fewer plastic bottles. For example, one school has a station beside its gym for students to use.","q_ja":"廊下に給水所を設置する学校もある。生徒は飲み物を買う代わりに、そこで自分のボトルに水を入れられる。これにより出費を抑え、使うペットボトルを減らせる。例えば、ある学校は体育館の横に生徒が使える給水所を設けている。","choices":[{"t":"School water stations help students save money and reduce plastic waste.","why":"正解。給水所による出費とプラスチックごみの削減を、具体例を省いて言い換えている。"},{"t":"This helps them spend less money and use fewer plastic bottles.","why":"本文の一文をそのまま使っており、語句を言い換えていない。"},{"t":"Water beside a school gym reduces students' costs and plastic bottle use.","why":"体育館の横という具体例を残している。"},{"t":"School water stations cut plastic waste and help students get better grades.","why":"生徒の成績が上がることは本文にない。"},{"t":"Students bring their own bottles and fill them in school halls.","why":"ボトルと場所の細部だけで、費用とごみが減る利点をまとめていない。"},{"t":"Water stations remove students' drink costs and end plastic waste at school.","why":"飲料費も学校のプラスチックごみもなくなるという断定は本文を超えている。"}],"answer":0,"point":"設置場所を省き、お金とごみを減らすという効果を中心にまとめる。","level":1,"drive":{"ja":"次の段落の要点を英語1文で。学校の給水所は、生徒の出費とプラスチックごみを減らすのに役立つ。","en":"School water stations help students save money and reduce plastic waste."},"explain":"給水所が主語で、help以下の二動詞をandで結ぶ。reduce＋名詞は量の減少を示し、環境対策の効果を書ける。別の言い方: Water stations cut students' costs and plastic waste."},{"id":"g2-summary-218","q":"Some towns lend tools to residents who only need them occasionally. People can repair things without buying equipment they would rarely use. For example, they can borrow electric drills. However, tools may be damaged if borrowers lack experience, so these services also offer simple instructions on handling the equipment safely.","q_ja":"たまにしか使わない工具を住民に貸す町もある。住民は、めったに使わない道具を買わずに物を修理できる。例えば、電動ドリルを借りられる。しかし、経験の少ない利用者が工具を壊す可能性があるため、こうしたサービスは道具を安全に扱うための簡単な説明も提供している。","choices":[{"t":"People can repair things without buying equipment they would rarely use, but tools may be damaged if borrowers lack experience.","why":"本文の表現をほぼそのままつなげており、言い換えた要約になっていない。"},{"t":"Borrowing electric drills helps residents avoid purchases, while simple instructions explain how to handle these tools without damaging them.","why":"電動ドリルという具体例が残っている。"},{"t":"Tool lending reduces unnecessary purchases, and borrowers receive money from towns whenever they repair broken equipment using the service.","why":"修理をすると町からお金を受け取れるという内容は本文にない。"},{"t":"Community tool sharing avoids unnecessary purchases, while guidance helps inexperienced users handle borrowed equipment safely and prevent damage.","why":"正解。買わずに済む利点と、不慣れな利用者の安全な使用や破損防止に向けた説明をまとめている。"},{"t":"Tool services provide simple safety instructions because residents with little experience may damage equipment when attempting repairs at home.","why":"説明を提供する理由だけを述べ、不要な購入を避けられる利点を落としている。"},{"t":"Residents who borrow shared tools avoid equipment costs, and the instructions ensure that nobody causes damage while using them.","why":"説明があれば誰も工具を壊さないと保証するのは言い過ぎ。"}],"answer":3,"point":"貸し出しの経済的な利点と、安全に使うための支援を一文にまとめる。","level":2,"drive":{"ja":"次の段落の要点を英語1文で。地域で工具を共有すると不要な購入を避けられ、使い方の説明は不慣れな利用者の安全な使用と破損防止に役立つ。","en":"Community tool sharing avoids unnecessary purchases, while guidance helps inexperienced users handle borrowed equipment safely and prevent damage."},"explain":"whileで共有の効果と説明の役割を並べる。help＋人＋原形で、支援が可能にする行動を示せる。別の言い方: Sharing avoids purchases, while guidance promotes safe tool use."},{"id":"g2-summary-219","q":"A school offers extra fruit at lunch so students can try healthier food. Although more fruit is being taken, teachers have noticed that some pieces are thrown away untouched. Simply counting what students select may therefore give a misleading picture of the program's success; the school also needs to check what they actually eat.","q_ja":"ある学校は、生徒がより健康的な食べ物を試せるよう、昼食時に果物を追加で提供している。選ばれる果物は増えているものの、一部は手を付けられずに捨てられていると教員が気づいた。そのため、選ばれた量だけを数えると取り組みの成果を誤って捉える可能性があり、学校は生徒が実際に何を食べるかも確認する必要がある。","choices":[{"t":"Simply counting what students select may therefore give a misleading picture of the program's success, despite more fruit being taken.","why":"本文の語句をほぼそのまま組み合わせており、言い換えができていない。"},{"t":"Evaluating efforts to improve school meals requires checking actual consumption, since increased selection does not necessarily mean healthier eating.","why":"正解。選ばれる量と実際に食べる量を区別し、取り組みの評価に必要な確認を言い換えている。"},{"t":"Offering extra fruit at lunch encourages healthier choices, but schools must check whether the pieces students take are actually eaten.","why":"昼食の追加の果物という具体例を残し、取り組みの評価という一般的な要点にまとめていない。"},{"t":"Measuring actual eating is necessary because students choose more fruit mainly to please teachers rather than to improve their health.","why":"教員を喜ばせるために果物を選ぶという生徒の動機は本文にない。"},{"t":"Some fruit selected by students is discarded without being eaten, even though the school offers it to encourage healthier food choices.","why":"廃棄と提供目的だけを述べ、成果を判断するには実際の摂取を確認する必要があるという結論を落としている。"},{"t":"The rise in fruit selection proves the school has improved students' diets, even if some of the food is discarded.","why":"選択量の増加で食生活の改善が証明されたとするのは、本文が留保する成果を断定している。"}],"answer":1,"point":"選ぶことと食べることを区別し、観察された増加を成果の証明と取り違えない。","level":3,"drive":{"ja":"次の段落の要点を英語1文で。給食改善の成果を評価するには実際の摂取を調べる必要があり、選択量の増加が健康的な食生活につながるとは限らない。","en":"Evaluating efforts to improve school meals requires checking actual consumption, since increased selection does not necessarily mean healthier eating."},"explain":"Evaluating以下の動名詞句が主語で、requiresが評価に必要なことを示す。since節は理由を表し、not necessarilyは選択量の増加が必ずしも健康的な食生活につながらないことを示す。別の言い方: To assess efforts to improve school meals, schools must check what students actually eat, because selecting more healthy food does not necessarily mean eating more healthily."},{"id":"g2-summary-220","q":"Some towns ask residents to pick up rubbish together. This makes local streets cleaner. It also helps people get to know their neighbors. For example, one town holds a cleanup on Sunday mornings. People talk while working and learn the names of others nearby.","q_ja":"住民に一緒にごみを拾うよう呼びかける町もある。これで地域の通りがきれいになる。また、住民が近所の人を知る助けにもなる。例えば、ある町は日曜日の朝に清掃活動を行う。住民は作業中に話し、近くに住む人たちの名前を覚える。","choices":[{"t":"This makes local streets cleaner and helps people get to know their neighbors.","why":"本文の表現をほぼそのままつないでおり、語句を言い換えていない。"},{"t":"Sunday morning cleanups make streets tidier and help residents know their neighbors.","why":"日曜日の朝という具体例が残っている。"},{"t":"Street cleanups build friendships and help towns pay for new roads.","why":"新しい道路の費用を賄えることは本文にない。"},{"t":"Neighbors learn each other's names while talking and picking up rubbish together.","why":"会話と名前を覚える細部だけで、地域がきれいになる効果を落としている。"},{"t":"Community cleanups remove street rubbish permanently and make every resident close friends.","why":"ごみが二度と出ず、住民全員が親友になるという誇張は本文にない。"},{"t":"Cleaning streets together improves neighborhoods and brings local people closer together.","why":"正解。街の美化と住民の交流という二つの効果を、曜日などを省いて言い換えている。"}],"answer":5,"point":"清掃の日時や会話の細部を省き、地域環境と住民の関係への効果を残す。","level":1,"drive":{"ja":"次の段落の要点を英語1文で。一緒に通りを清掃すると地域がきれいになり、住民同士の距離も縮まる。","en":"Cleaning streets together improves neighborhoods and brings local people closer together."},"explain":"動名詞句が主語で、二つの述語をandで結ぶ。bring＋人＋closer togetherは交流の効果を示せる。別の言い方: Joint cleanups improve streets and strengthen local ties."},{"id":"g2-summary-101","q":"Some schools have small gardens. Children learn how plants grow and how to work with other students. For example, twenty children may grow carrots together. They take turns watering the plants and checking their leaves. These activities give children useful lessons outside the classroom.","q_ja":"小さな菜園がある学校もあります。子どもたちは植物がどう育つかや、ほかの生徒とどう協力するかを学びます。例えば、20人で一緒にニンジンを育てることがあります。交代で水をやり、葉を観察します。こうした活動から、教室の外で役立つことを学べます。","choices":[{"t":"Children learn how plants grow and how to work with other students.","why":"本文の文をそのまま写しており、要点を自分の言葉で言い換えていない。"},{"t":"Twenty students grow carrots together and learn how to care for plants.","why":"20人やニンジンという具体例が残り、協力することを学ぶという要点も十分に表していない。"},{"t":"School gardens teach children about nature and help them work together.","why":"正解。自然についての学びと協力する力という二つの要点を、具体例を省いて言い換えている。"},{"t":"School gardens teach children about plants and provide free meals for families.","why":"家族に無料の食事を提供するという、本文にない内容を加えている。"},{"t":"Children discover how plants grow by watering them and checking their leaves.","why":"植物についての学びだけを述べ、水やりと葉の観察を足しているが、協力する力に触れていない。"},{"t":"School gardens teach every child all the skills needed to become farmers.","why":"全員が農家になるためのすべての技能を学ぶとは書かれておらず、効果を大きく言い過ぎている。"}],"answer":2,"point":"植物の育ち方と協力する力を残し、人数や野菜の名前は省いて言い換える。","level":1,"drive":{"ja":"次の段落の要点を英語1文で。学校の菜園で、子どもたちは自然について学び、協力する力を身に付ける。","en":"School gardens teach children about nature and help them work together."},"explain":"対応する正解英文が提示されていないため確定不可。対応問題を確認し、不要な解説なら項目を削除する。"},{"id":"g2-summary-102","q":"Some libraries lend tools that people only use sometimes. People spend less money and need less space for things at home. For example, they can borrow a drill for three days. They return it after finishing their work, so they do not have to buy or store one.","q_ja":"時々しか使わない道具を貸し出す図書館もあります。人々は出費を減らせて、家で物を置く場所も少なくて済みます。例えば、ドリルを3日間借りられます。作業が終わったら返すので、購入したり保管したりする必要がありません。","choices":[{"t":"Libraries lend drills for three days, helping people avoid buying these tools.","why":"ドリルや3日間という具体例が残り、保管場所を節約できるという要点も抜けている。"},{"t":"People spend less money and need less space for things at home.","why":"本文の文をそのまま写しており、道具の貸し出しによる利点を言い換えていない。"},{"t":"Library staff visit homes to repair things and reduce costs for families.","why":"図書館の職員が家を訪ねて修理するという、本文にない内容を加えている。"},{"t":"Library users save money because they can return tools after finishing work.","why":"費用の節約だけを述べ、返却の細部を足しているが、家の保管場所について触れていない。"},{"t":"Borrowing tools from libraries helps people spend less and save space.","why":"正解。道具を借りることで費用と保管場所を節約できるという要点を、具体例を省いてまとめている。"},{"t":"Borrowing library tools removes the need to buy any equipment for life.","why":"一生どんな道具も買わずに済むとは書かれておらず、貸し出しの効果を言い過ぎている。"}],"answer":4,"point":"道具を借りる二つの利点である費用と保管場所の節約を残し、道具名や日数は省く。","level":1,"drive":{"ja":"次の段落の要点を英語1文で。図書館で道具を借りると、購入費用と家の保管場所を節約できる。","en":"Borrowing tools from libraries helps people spend less and save space."},"explain":"対応する正解英文が提示されていないため確定不可。対応問題を確認し、不要な解説なら項目を削除する。"},{"id":"g2-summary-103","q":"Some adults take classes on the internet. Students can choose where to learn and when to open each lesson. For example, they may watch a lesson at home at nine in the evening. This freedom makes it easier to fit learning into a busy day.","q_ja":"インターネットで授業を受ける大人もいます。受講者は学ぶ場所や、各授業を開く時間を選べます。例えば、夜9時に自宅で授業を見ることができます。この自由さのおかげで、忙しい一日の中でも学習の時間を取りやすくなります。","choices":[{"t":"Online lessons let people study wherever and whenever it suits them.","why":"正解。自分に合った場所と時間で学べるという要点を、時刻や場所の例を省いて言い換えている。"},{"t":"Students can choose where to learn and when to open each lesson.","why":"本文の文をそのまま写しており、学ぶ場所と時間の自由さを言い換えていない。"},{"t":"Adults can watch lessons at home at nine in the evening.","why":"自宅や夜9時という具体例が残り、場所と時間を選べるという要点をまとめていない。"},{"t":"Internet classes help busy adults find better jobs after completing their lessons.","why":"受講後によりよい仕事が見つかるという、本文にない内容を加えている。"},{"t":"Adults can learn at home by watching their classes on the internet.","why":"自宅で学ぶという場所の面だけを述べ、授業を見る方法を足しているが、時間の自由さに触れていない。"},{"t":"Internet classes make studying easy for everyone, whatever their daily schedule is.","why":"どんな生活時間の人でも学習が簡単になるとは書かれておらず、便利さを言い過ぎている。"}],"answer":0,"point":"学ぶ場所と時間を選べるという共通の要点を残し、自宅や具体的な時刻は省く。","level":1,"drive":{"ja":"次の段落の要点を英語1文で。オンライン授業なら、自分に合った場所と時間で学べる。","en":"Online lessons let people study wherever and whenever it suits them."},"explain":"対応する正解英文が提示されていないため確定不可。対応問題を確認し、不要な解説なら項目を削除する。"},{"id":"g2-summary-104","q":"Planning meals before shopping has two benefits. Families throw away less food and spend less money at the supermarket. For example, they can check whether they already have apples or carrots. Then they buy only what they need for their meals, instead of buying extra food.","q_ja":"買い物の前に献立を考えることには二つの利点があります。家庭で捨てる食べ物が減り、スーパーで使うお金も少なくなります。例えば、リンゴやニンジンがすでにあるかを確認できます。そのうえで、余分に買わず、食事に必要な物だけを買います。","choices":[{"t":"Families throw away less food and spend less money at the supermarket.","why":"本文の文をそのまま写しており、献立を考える利点を言い換えていない。"},{"t":"Families check for apples and carrots before buying food for their meals.","why":"リンゴやニンジンという具体例が残り、食品の無駄と出費が減るという要点をまとめていない。"},{"t":"Meal plans keep families healthy and help them avoid expensive hospital visits.","why":"健康を保ち、高額な通院を避けられるという、本文にない内容を加えている。"},{"t":"Planning meals helps families waste less food and lower their costs.","why":"正解。献立を考えることで食品の無駄と出費を減らせるという要点を、具体例を省いて言い換えている。"},{"t":"Families save money by checking their food before visiting the supermarket.","why":"出費の節約だけを述べ、買い物前の確認を足しているが、捨てる食べ物が減ることに触れていない。"},{"t":"Meal plans stop families from wasting food or making unnecessary purchases again.","why":"食品の無駄や不要な買い物がなくなると断定しており、減らせるという本文の内容を言い過ぎている。"}],"answer":3,"point":"食品の無駄と出費が減るという二つの利点を残し、食品名や買い物の手順は省く。","level":1,"drive":{"ja":"次の段落の要点を英語1文で。買い物前に献立を考えると、食品の無駄と出費を減らせる。","en":"Planning meals helps families waste less food and lower their costs."},"explain":"（確認できる文法部分）：less＋不可算名詞は数量がより少ないことを表す。less自体に断定を弱める働きはない。全文の修正案は対応するdrive.enの確認が必要。"}],"template":[{"id":"g2-template-001","q":"I ___ that schools should provide more chances to learn about nature.","q_ja":"私は、学校は自然について学ぶ機会をもっと提供すべきだという意見に賛成です。","choices":[{"t":"agree to","why":"that 節を続けるこの形では、agree の後に to を置かない。"},{"t":"agreement","why":"agreement は名詞で、ここに必要な動詞ではない。"},{"t":"agree","why":"正解。I agree that ... で、続く意見への賛成を示す。"},{"t":"agree with","why":"agree with の後には通常、人や意見を表す名詞を置き、ここでは that 節を直接続けない。"}],"answer":2,"point":"I agree that＋主語＋動詞で賛成する内容を述べる。","drive":{"ja":"私は、学校は自然について学ぶ機会をもっと提供すべきだという意見に賛成です。","en":"I agree that schools should provide more chances to learn about nature."},"level":1,"explain":"I＋agreeにthat節で賛成内容を続ける。shouldは提案を表し、序論で立場を明示できる。別の言い方: I think schools should offer more nature education."},{"id":"g2-template-002","q":"I ___ that children should spend all their free time studying.","q_ja":"私は、子どもは自由な時間をすべて勉強に使うべきだという意見に反対です。","choices":[{"t":"disagreement","why":"disagreement は名詞で、主語 I に続く動詞ではない。"},{"t":"disagree to","why":"that 節を続けるときは disagree の後に to を置かない。"},{"t":"disagree with","why":"disagree with の後には通常、人や意見を表す名詞を置く。"},{"t":"disagree","why":"正解。I disagree that ... で、勉強にすべての自由時間を使うことへの反対を示す。"}],"answer":3,"point":"I disagree that ... で、続く意見への反対を示す。","drive":{"ja":"私は、子どもは自由な時間をすべて勉強に使うべきだという意見に反対です。","en":"I disagree that children should spend all their free time studying."},"level":1,"explain":"I＋disagreeにthat節で反対する内容を続ける。spend＋時間＋動名詞で時間の使い方を論じる。別の言い方: Children should not spend all their free time studying."},{"id":"g2-template-003","q":"For these two ___, I believe that towns should protect their old buildings.","q_ja":"これらの二つの理由から、私は町が古い建物を守るべきだと考えます。","choices":[{"t":"reasons","why":"正解。two の後に複数形 reasons を置き、二つの理由から結論を導く。"},{"t":"reason","why":"two の後の可算名詞は複数形 reasons にする。"},{"t":"reasoning","why":"reasoning は推論という意味で、ここで two に続けて理由を数える形にはできない。"},{"t":"reasonable","why":"reasonable は形容詞で、two の後に必要な名詞ではない。"}],"answer":0,"point":"For these two reasons, ... で二つの理由をまとめて結論を述べる。","drive":{"ja":"これらの二つの理由から、私は町が古い建物を守るべきだと考えます。","en":"For these two reasons, I believe that towns should protect their old buildings."},"level":1,"explain":"文頭で根拠を受け、I＋believeのthat節で主張する。For these two reasonsは本文の二つの理由を結論に結び付ける。別の言い方: Thus, towns should preserve old buildings."},{"id":"g2-template-004","q":"In ___, I think that students should have time to relax after school.","q_ja":"結論として、私は生徒には放課後にくつろぐ時間が必要だと考えます。","choices":[{"t":"conclude","why":"conclude は動詞で、In の後に必要な名詞ではない。"},{"t":"conclusion","why":"正解。In conclusion は「結論として」を表す。"},{"t":"conclusive","why":"conclusive は形容詞で、In conclusion の形にならない。"},{"t":"concluding","why":"In concluding では、ここで必要な「結論として」という定型表現にならない。"}],"answer":1,"point":"結論を導く定型表現は In conclusion, ...。","drive":{"ja":"結論として、私は生徒には放課後にくつろぐ時間が必要だと考えます。","en":"In conclusion, I think that students should have time to relax after school."},"level":1,"explain":"文頭で結論を示し、I＋thinkのthat節で意見を述べる。time to relaxは時間の用途を表し、提案を具体化する。別の言い方: In short, students need time to relax after school."},{"id":"g2-template-005","q":"In my ___, cities should make sidewalks safer for older people.","q_ja":"私の意見では、都市は高齢者にとって歩道をもっと安全にすべきです。","choices":[{"t":"opinionated","why":"opinionated は自分の意見を曲げないという意味の形容詞。"},{"t":"opinions","why":"この定型表現では複数形ではなく、単数形 opinion を使う。"},{"t":"opine","why":"opine は動詞で、my の後に必要な名詞ではない。"},{"t":"opinion","why":"正解。In my opinion は「私の意見では」を表す。"}],"answer":3,"point":"In my opinion, ... で、自分の立場を文頭に示す。","drive":{"ja":"私の意見では、都市は高齢者にとって歩道をもっと安全にすべきです。","en":"In my opinion, cities should make sidewalks safer for older people."},"level":1,"explain":"citiesが主語、should makeが述語。make＋目的語＋形容詞で改善を提案し、In my opinionで立場を示す。別の言い方: Cities should make sidewalks safer for seniors."},{"id":"g2-template-006","q":"I would ___ to explain why schools should teach basic cooking skills.","q_ja":"私は、学校が基本的な調理の技術を教えるべき理由を説明したいと思います。","choices":[{"t":"like","why":"正解。would like to do は「〜したいと思う」を表す。"},{"t":"liking","why":"would の直後には動詞の原形を置く。"},{"t":"liked","why":"would の直後には過去形ではなく原形を置く。"},{"t":"likes","why":"would の後には三人称単数現在形ではなく原形を置く。"}],"answer":0,"point":"I would like to explain why ... で、理由の説明を始められる。","drive":{"ja":"私は、学校が基本的な調理の技術を教えるべき理由を説明したいと思います。","en":"I would like to explain why schools should teach basic cooking skills."},"level":1,"explain":"Iが主語で、would like to explainは説明したいという意向を丁寧に表す。explainの目的語となるwhy節で、学校が基礎的な調理技能を教えるべき理由を示す。別の言い方: I want to explain why schools should teach basic cooking skills."},{"id":"g2-template-007","q":"I am ___ that learning about other cultures is important for students.","q_ja":"私は、異文化について学ぶことは生徒にとって重要だと確信しています。","choices":[{"t":"convince","why":"am の後に原形 convince をそのまま置けない。"},{"t":"conviction","why":"conviction は名詞で、I am conviction とは言わない。"},{"t":"convinced","why":"正解。I am convinced that ... で、確信している内容を示す。"},{"t":"convincingly","why":"convincingly は副詞で、ここで必要な状態を表せない。"}],"answer":2,"point":"I am convinced that ... は強い確信を示す序論や結論の表現。","drive":{"ja":"私は、異文化について学ぶことは生徒にとって重要だと確信しています。","en":"I am convinced that learning about other cultures is important for students."},"level":2,"explain":"I am convinced thatで、that節の内容を確信していることを表す。that節では動名詞句learning about other culturesが主語となり、学生にとっての重要性を述べる。別の言い方: I firmly believe that it is important for students to learn about other cultures."},{"id":"g2-template-008","q":"There ___ two main reasons why local libraries should stay open longer.","q_ja":"地域の図書館が開館時間を延ばすべき主な理由は二つあります。","c I agree with the view that children should learn how to manage money."},{"id":"g2-template-201","q":"There are two main ___ why schools should serve healthy meals.","q_ja":"学校が健康的な食事を提供すべき主な理由は二つあります。","choices":[{"t":"causes","why":"原因を表す名詞。意見を支える理由を紹介する reasons why の形には合わない。"},{"t":"reasons","why":"正解。two main reasons why で、そうすべき主な理由が二つあると示せる。"},{"t":"effects","why":"結果や影響を表す名詞で、これから説明する理由を指す語ではない。"},{"t":"factors","why":"要因を表す名詞。ここでは factors why ではなく reasons why とする。"}],"answer":1,"point":"序論で二つの理由を予告する型は There are two main reasons why ...。","level":1,"drive":{"ja":"学校が健康的な食事を提供すべき主な理由は二つあります。理由を予告する序論の文です。","en":"There are two main reasons why schools should serve healthy meals."},"explain":"There areで理由の存在を示し、why節がその内容を補う。序論で論拠の数を予告すると、読み手に論の見通しを示せる。別の言い方: two key reasons"},{"id":"g2-template-202","q":"From my ___ of view, local libraries should offer more activities for children.","q_ja":"私の考えでは、地域の図書館は子ども向けの活動をもっと提供すべきです。","choices":[{"t":"angle","why":"見方や角度を表す名詞だが、angle of view はこの意見表明の定型表現には使わない。"},{"t":"direction","why":"方向を表す名詞。from my direction of view では自分の意見を示す定型表現にならない。"},{"t":"position","why":"立場を表す名詞だが、ここでは position of view とは言わない。"},{"t":"point","why":"正解。from my point of view で「私の考えでは」と立場を示せる。"}],"answer":3,"point":"序論で自分の立場を示す from my point of view は、語順も含めて覚える。","level":2,"drive":{"ja":"私の考えでは、地域の図書館は子ども向けの活動をもっと提供すべきです。自分の立場を示す序論の文です。","en":"From my point of view, local libraries should offer more activities for children."},"explain":"主語はlocal librariesで、should offerが提案を表す。From my point of viewは文全体にかかり、序論で自分の判断だと明示できる。別の言い方: In my opinion"},{"id":"g2-template-203","q":"To ___ up, I believe cities should improve their bus services.","q_ja":"要するに、都市はバスのサービスを改善すべきだと私は考えます。","choices":[{"t":"sum","why":"正解。to sum up は「要するに」という意味で、結論を始める定型表現。"},{"t":"add","why":"add up は数などを足す意味。ここで意見をまとめる表現にはならない。"},{"t":"count","why":"count up は数を数える意味。結論を導く to sum up とは異なる。"},{"t":"total","why":"total は合計するという動詞だが、to total up はこの結論の定型表現ではない。"}],"answer":0,"point"
