ough the transition depends on environmental benefits achieved over the long term.","why":"優先する対象を利益から支出へ変え、移行が利益に依存するという別の関係を述べている。"},{"t":"Although renewable energy offers environmental benefits in the long term, governments should give priority to the substantial initial costs of the transition.","why":"譲歩節と主節の内容を入れ替え、環境上の利益より初期費用を優先すべきだとしている。"},{"t":"The transition to renewable energy involves substantial initial costs because governments should prioritize the environmental benefits it offers in the long term.","why":"譲歩を因果に変え、利益を優先すべきことが初期費用の原因だとしている。"}],"answer":2,"point":"Although節には認める事情を置き、主節にはそれでも維持する主張を置く。","drive":{"ja":"再生可能エネルギーへの移行には多額の初期費用がかかるとはいえ、政府はその長期的な環境上の利益を優先すべきだ。","en":"Although the transition to renewable energy involves substantial initial costs, governments should prioritize its long-term environmental benefits."},"level":2},{"id":"p1-ja2en-002","q":"独立した監督が欠けているため、公的資金が不適切に使われ、その結果、政府への信頼が損なわれている。","q_ja":"監督の欠如、公的資金の不適切な使用、政府への信頼の低下という因果の順序を確認する。","choices":[{"t":"The misuse of public funds has weakened independent oversight, consequently leading to a decline in the level of public trust in government.","why":"公的資金の不適切な使用が監督を弱めたとしており、最初の原因と結果が逆になっている。"},{"t":"Declining public trust in government has encouraged the misuse of public funds, which has consequently resulted in a lack of independent oversight.","why":"信頼の低下を出発点にし、監督の欠如を最終的な結果にして因果の順序を逆転させている。"},{"t":"Public funds have been misused despite independent oversight, consequently weakening public trust in the government responsible for providing supervision to public institutions.","why":"監督が欠けているという原因を、監督があるにもかかわらずという譲歩に変えている。"},{"t":"The lack of independent oversight results from the misuse of public funds, while declining public trust in government is responsible for both.","why":"監督の欠如を不適切な使用の結果とし、さらに信頼の低下を両方の原因にしている。"},{"t":"Independent oversight is lacking because public trust in government has weakened, consequently causing public funds to be misused by the institutions concerned.","why":"信頼の低下を監督の欠如の原因にしており、日本語の因果の順序と異なる。"},{"t":"The lack of independent oversight has led to the misuse of public funds, consequently undermining public trust in government.","why":"正解。監督の欠如を原因、不適切な使用を中間の結果、信頼の低下をその帰結として示している。"}],"answer":5,"point":"A has led to B, consequently doing Cで、原因から結果、さらにその帰結へとつなぐ。","drive":{"ja":"独立した監督が欠けているため、公的資金が不適切に使われ、その結果、政府への信頼が損なわれている。","en":"The lack of independent oversight has led to the misuse of public funds, consequently undermining public trust in government."},"level":3},{"id":"p1-ja2en-003","q":"政府が国家の安全保障を重視するのに対し、人権団体は市民のプライバシーを守る必要性を強調している。","q_ja":"政府と人権団体がそれぞれ重視する対象を対比する。","choices":[{"t":"Whereas the government places emphasis on national security, human rights organizations stress the need to protect citizens' privacy.","why":"正解。政府の安全保障重視と、人権団体のプライバシー保護重視を対比している。"},{"t":"The government emphasizes national security because human rights organizations insist that citizens' privacy needs protection from threats to the nation.","why":"二者の対比を、プライバシー保護の主張が政府の姿勢の原因になるという因果関係に変えている。"},{"t":"Whereas human rights organizations prioritize national security, the government stresses the need to protect the privacy of individual citizens.","why":"対比する二者の主張を入れ替え、人権団体が安全保障を、政府がプライバシーを重視するとしている。"},{"t":"The government stresses the need for national security, thereby prompting human rights organizations to prioritize the protection of citizens' privacy.","why":"対照的な立場を述べるだけでなく、政府の姿勢が人権団体を動かしたという因果を加えている。"},{"t":"While emphasizing national security, the government urges human rights organizations to stress the need to protect the privacy of individual citizens.","why":"分詞構文の主語を政府にし、人権団体が独自に強調している内容を政府からの要請に変えている。"},{"t":"Human rights organizations emphasize privacy protection on condition that the government places sufficient emphasis on national security in its public policies.","why":"対比を条件に変え、政府が安全保障を重視することを人権団体の主張の条件にしている。"}],"answer":0,"point":"Whereas A, Bは二つの立場を対比する形であり、原因や条件を表す形ではない。","drive":{"ja":"政府が国家の安全保障を重視するのに対し、人権団体は市民のプライバシーを守る必要性を強調している。","en":"Whereas the government places emphasis on national security, human rights organizations stress the need to protect citizens' privacy."},"level":2},{"id":"p1-ja2en-004","q":"以上の理由から、政府は地域間の格差を縮めるために公共交通への投資を優先すべきだと結論づけられる。","q_ja":"提示済みの理由から結論を導き、投資の目的を地域間格差の縮小として示す。","choices":[{"t":"In conclusion, regional disparities should be reduced so that the government has reasons to prioritize investment in public transport across the country.","why":"格差の縮小を投資の目的ではなく、政府が投資を優先する理由を得るための手段に変えている。"},{"t":"For these reasons, prioritizing investment in public transport should enable the government to conclude that regional disparities have already been substantially reduced.","why":"政策提言ではなく、投資を優先すれば格差がすでに縮小したと結論づけられるという内容に変えている。"},{"t":"It follows from reducing regional disparities that the government should provide reasons for prioritizing further investment in public transport across the country.","why":"結論の根拠を提示済みの理由から格差の縮小へ変え、政府に理由の提示を求めている。"},{"t":"For these reasons, it can be concluded that the government should prioritize investment in public transport to reduce regional disparities.","why":"正解。理由に基づく結論を示し、格差を縮めるという目的に向けた投資の優先を提言している。"},{"t":"For these reasons, the government should conclude its investment in public transport so that regional disparities can be reduced throughout the country.","why":"concludeの目的語を投資にしているため、結論を出すのではなく投資を終えるという意味になっている。"},{"t":"In conclusion, the government should prioritize reducing regional disparities in order to establish sufficient reasons for investing further in public transport systems.","why":"投資によって格差を縮める関係を逆にし、投資の理由を作るために格差を縮めるとしている。"}],"answer":3,"point":"For these reasonsで結論を導き、to不定詞で提言する施策の目的を示す。","drive":{"ja":"以上の理由から、政府は地域間の格差を縮めるために公共交通への投資を優先すべきだと結論づけられる。","en":"For these reasons, it can be concluded that the government should prioritize investment in public transport to reduce regional disparities."},"level":2},{"id":"p1-ja2en-005","q":"温室効果ガスの排出量の削減は、将来の世代が負う経済的負担の軽減につながる。","q_ja":"排出量の削減を名詞句の主語とし、将来世代の経済的負担への効果を述べる。","choices":[{"t":"The reduction of greenhouse gas emissions results from the alleviation of the economic burden that future generations will have to bear.","why":"results fromにより、負担の軽減が排出量削減の原因となり、日本語と因果の向きが逆になっている。"},{"t":"The reduction of greenhouse gas emissions contributes to the alleviation of the economic burden that future generations will have to bear.","why":"正解。削減と軽減を名詞化し、排出量削減が将来世代の負担軽減につながる関係を表している。"},{"t":"The reduction of greenhouse gas emissions contributes to alleviate the economic burden that future generations will be required to bear.","why":"contribute toのtoは前置詞なので、後ろにはalleviationやalleviatingが必要であり、alleviateは置けない。"},{"t":"The reducing of greenhouse gas emissions contributes to the alleviate of the economic burden that future generations will have to bear.","why":"the alleviateという名詞句は作れず、動詞alleviateを名詞alleviationにする必要がある。"},{"t":"The alleviation of greenhouse gas emissions contributes to the reduction of future generations that will bear an increasingly substantial economic burden.","why":"削減の対象を排出量から将来の世代へ移し、負担を軽減するという名詞句の関係を崩している。"},{"t":"The economic burden of reducing greenhouse gas emissions contributes to the alleviation of the responsibilities that future generations will have to bear.","why":"主語を排出量の削減から削減に伴う経済的負担へ変え、軽減する対象も経済的負担から責任へ変えている。"}],"answer":1,"point":"The reduction of A contributes to the alleviation of Bのように、動作を名詞化して因果を述べる。","drive":{"ja":"温室効果ガスの排出量の削減は、将来の世代が負う経済的負担の軽減につながる。","en":"The reduction of greenhouse gas emissions contributes to the alleviation of the economic burden that future generations will have to bear."},"level":3},{"id":"p1-ja2en-006","q":"もし政府の補助金がなければ、多くの小規模企業は今、環境に優しい技術を導入する余裕がないだろう。","q_ja":"現在の補助金が存在しないと仮定した場合の、現在の企業の資金面への影響を表す。","choices":[{"t":"If government subsidies had been unavailable, many small businesses would have been unable to afford the adoption of environmentally friendly technology.","why":"仮定法過去完了で過去の補助金と過去の導入可能性を述べており、現在の仮定になっていない。"},{"t":"If government subsidies were unavailable now, many small businesses would have been unable to afford environmentally friendly technology in the past.","why":"現在の条件に対して過去の結果を述べており、現在の導入余力についての仮定になっていない。"},{"t":"If many small businesses could not afford environmentally friendly technology, government subsidies would be unavailable to support their adoption of it.","why":"導入する余裕がないことを条件、補助金がないことを結果にし、仮定の条件と帰結を逆転させている。"},{"t":"If government subsidies had been unavailable, many small businesses would now have sufficient resources to adopt environmentally friendly technology without assistance.","why":"条件を過去に移したうえで、現在は導入資金が十分にあるという帰結に変えている。"},{"t":"If it were not for government subsidies, many small businesses would now be unable to afford the adoption of environmentally friendly technology.","why":"正解。If it were not forで現在の補助金がない状況を仮定し、wouldで現在の帰結を述べている。"},{"t":"If government subsidies are withdrawn next year, many small businesses will be unable to afford environmentally friendly technology in the following years.","why":"現在の事実に反する仮定を、来年の補助金廃止を条件とする将来の予測に変えている。"}],"answer":4,"point":"If it were not for A, 主語 would ...で、現在のAがなければどうなるかを仮定する。","drive":{"ja":"もし政府の補助金がなければ、多くの小規模企業は今、環境に優しい技術を導入する余裕がないだろう。","en":"If it were not for government subsidies, many small businesses would now be unable to afford the adoption of environmentally friendly technology."},"level":3},{"id":"p1-ja2en-007","q":"もし自治体が事前に避難計画を更新していたなら、昨年の洪水でこれほど多くの住民が危険にさらされることはなかっただろう。","q_ja":"過去に実行されなかった対策と、過去に生じた被害についての仮定を表す。","choices":[{"t":"If local authorities updated their evacuation plans now, fewer residents would be exposed to danger during floods occurring in the coming years.","why":"昨年の出来事への反実仮想を、現在の更新と将来の洪水についての仮定に変えている。"},{"t":"If fewer residents had been exposed to danger during last year's floods, local authorities would have updated their evacuation plans in advance.","why":"住民が危険にさらされなかったことを条件、計画の事前更新を帰結にして、条件と結果を逆転させている。"},{"t":"Had local authorities updated their evacuation plans beforehand, so many residents would not have been exposed to danger during last year's floods.","why":"正解。Hadで始まる仮定法過去完了とwould not have beenで、昨年の出来事に反する仮定を表している。"},{"t":"Were local authorities to update their evacuation plans next year, so many residents would not have been exposed during last year's floods.","why":"来年の計画更新を昨年の被害を防ぐ条件にしており、条件と結果の時間関係が成立していない。"},{"t":"Had local authorities updated their evacuation plans beforehand, so many residents would not now be exposed to danger during the current floods.","why":"帰結を現在の洪水での危険に変えており、昨年の洪水についての過去の帰結を表していない。"},{"t":"Local authorities would have updated their evacuation plans beforehand if last year's floods had exposed so many residents to danger in the region.","why":"昨年の洪水による危険を事前の計画更新の条件にしており、原因と結果の時間的な順序が逆になっている。"}],"answer":2,"point":"Had 主語 過去分詞はIf 主語 had 過去分詞の倒置形で、過去の事実に反する条件を表す。","drive":{"ja":"もし自治体が事前に避難計画を更新していたなら、昨年の洪水でこれほど多くの住民が危険にさらされることはなかっただろう。","en":"Had local authorities updated their evacuation plans beforehand, so many residents would not have been exposed to danger during last year's floods."},"level":3},{"id":"p1-ja2en-008","q":"独立機関が評価したその政策は、低所得世帯の医療サービスへのアクセスを改善すると期待されている。","q_ja":"独立機関による評価が政策を修飾し、アクセス改善への期待もその政策に向けられている文を選ぶ。","choices":[{"t":"The policy, which was evaluated by an independent agency, is expected to improve access to healthcare services for households with low incomes.","why":"正解。非制限用法の関係詞節が政策を説明し、低所得世帯の医療へのアクセスを改善するのも政策となっている。"},{"t":"The independent agency, which was evaluated under the policy, is expected to improve access to healthcare services for households with low incomes.","why":"評価された対象を政策から独立機関へ変え、アクセス改善が期待される対象も独立機関にしている。"},{"t":"The policy is expected to improve access to healthcare services for households with low incomes, which were evaluated by an independent agency.","why":"関係詞節が低所得世帯を修飾しており、独立機関が評価した対象が政策ではなく世帯になっている。"},{"t":"The policy is expected to improve access for households with low incomes to healthcare services that were evaluated by an independent agency.","why":"独立機関による評価が医療サービスを修飾しており、政策を評価したという意味になっていない。"},{"t":"An independent agency is expected to evaluate the policy that has improved access to healthcare services for households with low incomes.","why":"政策の評価を将来の期待にし、アクセスの改善をすでに生じた事実にして、二つの出来事の時制を変えている。"},{"t":"The policy, which evaluated an independent agency, is expected to improve access to healthcare services for households with low incomes in the region.","why":"関係詞節を能動態にし、評価を受けた政策ではなく独立機関を評価した政策という意味にしている。"}],"answer":0,"point":"非制限用法のwhich節では、先行詞と、節内でその先行詞が果たす役割を確認する。","drive":{"ja":"独立機関が評価したその政策は、低所得世帯の医療サービスへのアクセスを改善すると期待されている。","en":"The policy, which was evaluated by an independent agency, is expected to improve access to healthcare services for households with low incomes."},"level":2},{"id":"p1-ja2en-009","q":"確かに自動化は生産性を高めるが、そのことは職を失う労働者への支援を怠る理由にはならない。","q_ja":"生産性向上を認めても、失職する労働者への支援を怠ることは正当化されないという論理を選ぶ。","choices":[{"t":"Admittedly, neglecting support for displaced workers increases productivity, but this does not justify the introduction of automation throughout the economy.","why":"譲歩する内容を支援の放置による生産性向上に変え、正当化されない対象も自動化の導入に変えている。"},{"t":"Although automation increases productivity, neglecting support for displaced workers is necessary to justify the economic benefits that automation brings to society.","why":"支援を怠ることを正当化できないのではなく、自動化の利益を正当化するために支援の放置が必要だとしている。"},{"t":"Admittedly, automation increases productivity because support for displaced workers is neglected, although such support remains a major concern for policymakers.","why":"支援の放置を生産性向上の原因にしており、その向上では放置を正当化できないという関係を示していない。"},{"t":"Admittedly, automation increases productivity, but providing support for displaced workers does not justify neglecting the economic benefits of automation itself.","why":"労働者支援によって自動化の利益を無視することは正当化できないという、逆向きの正当化関係に変えている。"},{"t":"Admittedly, automation increases productivity, provided that support for workers who lose their jobs is neglected during the transition to automated production.","why":"生産性向上を認める譲歩と支援放置への反論を、支援の放置が生産性向上の条件だという内容に変えている。"},{"t":"Admittedly, automation increases productivity, but this does not justify neglecting support for workers who lose their jobs as a result.","why":"正解。自動化の利点を認めつつ、それを理由に自動化で失職する労働者への支援を怠ることは正当化できないと述べている。"}],"answer":5,"point":"Admittedly A, but this does not justify Bで、Aを認めてもBの正当化にはならないと述べる。","drive":{"ja":"確かに自動化は生産性を高めるが、そのことは職を失う労働者への支援を怠る理由にはならない。","en":"Admittedly, automation increases productivity, but this does not justify neglecting support for workers who lose their jobs as a result."},"level":3},{"id":"p1-ja2en-010","q":"デジタル技術へのアクセスの拡大は、行政サービスを利用しやすくするだけでなく、政治参加も促す。","q_ja":"アクセスの拡大を共通の主語として、行政サービスの利用と政治参加への二つの効果を並べる。","choices":[{"t":"The expansion of access to digital technology results not only from easier access to public services but also from increased political participation.","why":"アクセスの拡大を二つの効果の原因ではなく結果にし、因果の向きを逆にしている。"},{"t":"Not only public services but also political participation encourage the expansion of access to digital technology among citizens across the country.","why":"行政サービスと政治参加を主語にして、両者が技術へのアクセス拡大を促すという逆の因果を述べている。"},{"t":"The expansion of access to digital technology not only facilitates use of public services but also the encouragement of wider political participation.","why":"not onlyの後ろの動詞facilitatesに対し、but alsoの後ろが名詞句になり、二つの述語が並列になっていない。"},{"t":"The expansion of access to digital technology not only facilitates the use of public services but also encourages political participation.","why":"正解。名詞化した主語に対し、行政サービスの利用促進と政治参加の促進を二つの動詞句で並列している。"},{"t":"Expanding public services not only facilitates access to digital technology but also encourages political participation among citizens who use those services.","why":"主語をデジタル技術へのアクセス拡大から行政サービスの拡大へ変え、何が二つの効果を生むのかを取り違えている。"},{"t":"The expansion of access to digital technology encourages political participation only when citizens find it easier to make use of public services.","why":"二つの効果の並列を条件関係に変え、行政サービスを利用しやすい場合だけ政治参加を促すとしている。"}],"answer":3,"point":"not only A but also Bでは、同じ主語にかかるAとBの文法上の形をそろえる。","drive":{"ja":"デジタル技術へのアクセスの拡大は、行政サービスを利用しやすくするだけでなく、政治参加も促す。","en":"The expansion of access to digital technology not only facilitates the use of public services but also encourages political participation."},"level":2},{"id":"p1-ja2en-101","q":"その政策には費用がかかることは認めるが、公共サービスの改善につながる。","q_ja":"その政策には費用がかかることは認めるが、公共サービスの改善につながる。","choices":[{"t":"Because the policy improves public services, we should accept the cost of introducing it.","why":"改善を理由に費用を受け入れるべきだという主張で、費用を認めた上で利点を述べる譲歩ではない。"},{"t":"Admittedly, the policy is costly, but it leads to an improvement in public services.","why":"正解。費用という欠点を認めた上で、公共サービスを改善するという利点を述べている。"},{"t":"Although public services are costly, improving them will lead to the introduction of the policy.","why":"費用がかかる対象が公共サービスに変わり、サービスの改善が政策の導入につながるという関係になっている。"},{"t":"The policy leads to better public services because the cost of introducing it is high.","why":"高い費用がサービス改善の原因になっており、日本語の譲歩の関係を因果関係に変えている。"},{"t":"Whereas the policy is costly, other policies lead to an improvement in public services.","why":"別の政策との対比になっており、同じ政策の欠点と利点を述べる日本語とは異なる。"},{"t":"Despite the improvement in public services, introducing the policy will lead to higher costs.","why":"認める内容がサービスの改善、主に述べる内容が費用の増加となり、譲歩の範囲が逆になっている。"}],"answer":1,"point":"Admittedly で欠点を認め、but の後で主に伝えたい利点を述べる。","level":1,"drive":{"ja":"その政策には費用がかかることは認めるが、公共サービスの改善につながる。","en":"Admittedly, the policy is costly, but it leads to an improvement in public services."}},{"id":"p1-ja2en-102","q":"公共交通への投資は、人々に車の利用を減らすよう促すことで大気汚染を減らす。","q_ja":"公共交通への投資は、人々に車の利用を減らすよう促すことで大気汚染を減らす。","choices":[{"t":"A reduction in air pollution encourages people to use cars less and invest in public transport.","why":"大気汚染の減少が車の利用減少と投資を促すという、逆向きの因果関係になっている。"},{"t":"People reduce investment in public transport by using cars less to improve local air quality.","why":"減らす対象が大気汚染ではなく投資となり、車の利用減少が投資を減らす手段になっている。"},{"t":"Invest in public transport reduces air pollution by encouraging people to use cars less.","why":"主語の位置に動詞の原形 Invest を置いている。「投資」を主語にするには名詞 Investment などが必要。"},{"t":"Public transport attracts investment because people use cars less as a result of lower air pollution.","why":"大気汚染の減少が車の利用減少を生み、その結果として投資が集まるという順序に変わっている。"},{"t":"Investment in public transport reduces air pollution by encouraging people to use cars less.","why":"正解。投資を名詞の主語にし、車の利用を減らすよう促すことを汚染削減の手段としている。"},{"t":"Investment in public transport encourages people to reduce air pollution by using cars for shorter trips.","why":"by 以下が人々の汚染削減の方法を説明し、短距離の移動に車を使うという別の内容になっている。"}],"answer":4,"point":"Investment in ～ を主語にし、by doing で結果を生む手段を示す。","level":1,"drive":{"ja":"公共交通への投資は、人々に車の利用を減らすよう促すことで大気汚染を減らす。","en":"Investment in public transport reduces air pollution by encouraging people to use cars less."}},{"id":"p1-ja2en-103","q":"もし今、政府の支援がもっとあれば、小規模企業はより多くの労働者を雇えるだろう。","q_ja":"もし今、政府の支援がもっとあれば、小規模企業はより多くの労働者を雇えるだろう。","choices":[{"t":"If more government support were available now, small businesses could employ more workers.","why":"正解。現在の仮定を if 節の were と主節の could で表している。"},{"t":"If more government support had been available then, small businesses could have employed more workers.","why":"過去に支援があった場合の仮定で、今の支援について述べる日本語とは時点が異なる。"},{"t":"Small businesses would receive more government support now if they employed more workers.","why":"雇用を増やすことが支援を受ける条件となり、支援と雇用の関係が逆になっている。"},{"t":"More government support is available now because small businesses have employed more workers.","why":"実際に雇用が増えたことを支援の原因として述べており、現在の仮定になっていない。"},{"t":"If more government support were available now, small businesses could have employed more workers last year.","why":"結果が昨年の雇用についての仮定となり、これから雇用を増やせるという日本語の意味からずれる。"},{"t":"Small businesses currently supported by the government would employ more workers if demand increased.","why":"政府の支援は企業を修飾する説明で、雇用を増やす条件が需要の増加に変わっている。"}],"answer":0,"point":"現在の仮定は If ～ were ..., ～ could ... で表せる。","level":1,"drive":{"ja":"もし今、政府の支援がもっとあれば、小規模企業はより多くの労働者を雇えるだろう。","en":"If more government support were available now, small businesses could employ more workers."}},{"id":"p1-ja2en-104","q":"したがって、政府は道路を増やすよりも、既存の公共交通の改善を優先すべきだ。","q_ja":"したがって、政府は道路を増やすよりも、既存の公共交通の改善を優先すべきだ。","choices":[{"t":"Consequently, the government should build more roads before giving priority to improvements in existing public transport.","why":"公共交通の改善より先に道路を増やすとしており、優先順位が逆になっている。"},{"t":"Although the government should improve existing public transport, it should give priority to building more roads.","why":"交通改善を譲歩として扱い、道路を増やすことを主張しているため、結論の内容が逆になる。"},{"t":"Consequently, the government should prioritize improving existing public transport rather than building more roads.","why":"正解。Consequently で結論を導き、道路建設より既存の公共交通の改善を優先すると述べている。"},{"t":"The government should improve existing public transport because giving priority to road construction will reduce traffic.","why":"道路建設の効果を交通改善の理由にしており、二つの施策の優先順位を示していない。"},{"t":"Consequently, improving existing public transport should take priority only after the government has built more roads.","why":"道路を増やし終えてから交通改善を優先するという条件を加え、道路建設を先にしている。"},{"t":"The government should therefore prioritize building more roads that improve access to existing public transport services.","why":"公共交通に関する部分が道路を修飾し、優先する対象が交通改善ではなく道路建設になっている。"}],"answer":2,"point":"Consequently で結論を示し、prioritize A rather than B で A を優先すると述べる。","level":1,"drive":{"ja":"したがって、政府は道路を増やすよりも、既存の公共交通の改善を優先すべきだ。","en":"Consequently, the government should prioritize improving existing public transport rather than building more roads."}}],"paraphrase":[{"id":"p1-paraphrase-001","q":"When governments disclose how public funds are spent, citizens are more likely to trust public institutions.","q_ja":"政府が公的資金の使途を公開すると、市民は公的機関を信頼しやすくなる。","choices":[{"t":"The disclosure of public spending by governments increases the likelihood that citizens will trust public institutions.","why":"正解。公開を名詞化し、信頼が高まる可能性も保っている。"},{"t":"Government disclosure of public spending makes citizens less likely to trust public institutions.","why":"less likely により信頼の変化が逆になる。"},{"t":"Public trust causes governments to disclose their spending.","why":"公開が信頼を高めるという因果の向きを逆にしている。"},{"t":"The disclosure of public spending increase public trust.","why":"単数の disclosure に対応する動詞は increases。"},{"t":"When governments reveal how public funds are spent, citizens are more likely to trust public institutions.","why":"disclose を reveal に替えただけで、ほぼ丸写しになっている。"},{"t":"It is good for citizens when governments talk about public money.","why":"good では使途の公開と信頼の関係が伝わらない。"}],"answer":0,"point":"disclose を disclosure に、be more likely to を increase the likelihood that に変える。","drive":{"ja":"政府が公的資金の使途を公開すると、市民は公的機関を信頼しやすくなる。を言い換えてください","en":"The disclosure of public spending by governments increases the likelihood that citizens will trust public institutions."},"level":2},{"id":"p1-paraphrase-002","q":"Although international trade stimulates economic growth, it can leave some domestic industries vulnerable to competition from overseas producers.","q_ja":"国際貿易は経済成長を促すものの、一部の国内産業を海外の生産者との競争に対して弱い立場に置くことがある。","choices":[{"t":"International trade always protects domestic industries from foreign competition.","why":"競争に弱くなる可能性を、必ず保護するという意味に変えている。"},{"t":"Although international trade encourages economic growth, it can leave some domestic industries vulnerable to competition from overseas producers.","why":"stimulates を encourages に替えただけで、ほぼ丸写しになっている。"},{"t":"International trade, which promote economic growth, may expose industries to foreign competition.","why":"単数扱いの international trade を受けるので promotes が必要。"},{"t":"International trade, which promotes economic growth, may nevertheless expose certain domestic industries to competition from foreign producers.","why":"正解。成長への貢献と競争に弱くなる可能性の両方を保っている。"},{"t":"International trade benefits every domestic industry.","why":"一部への不利益を、すべての国内産業の利益に変えている。"},{"t":"International trade is good for the economy but bad for some businesses.","why":"good と bad では成長と海外との競争という具体的な内容がぼやける。"}],"answer":3,"point":"譲歩を非制限用法の which と nevertheless で表す。","drive":{"ja":"国際貿易は経済成長を促すものの、一部の国内産業を海外の生産者との競争に対して弱い立場に置くことがある。を言い換えてください","en":"International trade, which promotes economic growth, may nevertheless expose certain domestic industries to competition from foreign producers."},"level":2},{"id":"p1-paraphrase-003","q":"Providing affordable public transport enables residents with limited incomes to gain better access to employment opportunities across the city.","q_ja":"手頃な料金の公共交通を提供すると、所得の限られた住民が市内各地の雇用機会によりアクセスしやすくなる。","choices":[{"t":"Affordable public transport prevents residents on limited incomes from accessing employment opportunities.","why":"アクセスの改善を妨害に変えている。"},{"t":"The provision of affordable public transport improves access to employment opportunities throughout the city for residents on limited incomes.","why":"正解。提供を名詞化し、対象者と雇用機会へのアクセス改善を保っている。"},{"t":"The provision of affordable public transport improve access to employment.","why":"単数の provision に対応する動詞は improves。"},{"t":"Providing affordable public transportation enables residents with limited incomes to gain better access to employment opportunities across the city.","why":"transport を transportation に替えただけで、原文をほぼ写している。"},{"t":"Affordable public transport is good for people with little money.","why":"雇用機会へのアクセス改善という具体的な効果が抜けている。"},{"t":"Better access to employment makes public transport affordable for residents on limited incomes.","why":"低料金の交通がアクセスを改善するという因果を逆にしている。"}],"answer":1,"point":"Providing を the provision of に、enable を improve access to に言い換える。","drive":{"ja":"手頃な料金の公共交通を提供すると、所得の限られた住民が市内各地の雇用機会によりアクセスしやすくなる。を言い換えてください","en":"The provision of affordable public transport improves access to employment opportunities throughout the city for residents on limited incomes."},"level":2},{"id":"p1-paraphrase-004","q":"If companies were required to explain their automated decisions, individuals would find it easier to challenge unfair treatment.","q_ja":"企業が自動化された意思決定の説明を義務づけられれば、個人は不公平な扱いに異議を申し立てやすくなるだろう。","choices":[{"t":"Requiring companies to explain automated decisions would make challenges to unfair treatment harder.","why":"容易になるという結果を難しくなるに変えている。"},{"t":"Individuals should explain automated decisions to companies before challenging unfair treatment.","why":"説明する主体を企業から個人に変えている。"},{"t":"A requirement for companies to explain automated decisions would facilitates challenges to unfair treatment.","why":"would の後には原形 facilitate が必要。"},{"t":"If companies were required to explain their automated decisions, people would find it easier to challenge unfair treatment.","why":"individuals を people に替えただけで、ほぼ丸写しになっている。"},{"t":"It would be good if companies explained their computer systems.","why":"説明義務と不公平な扱いへの異議申し立ての関係が抜けている。"},{"t":"A requirement for companies to explain automated decisions would facilitate individuals’ challenges to unfair treatment.","why":"正解。仮定の義務化を名詞化し、異議申し立てが容易になるという結果を保っている。"}],"answer":5,"point":"仮定の条件を a requirement で表し、would facilitate で結果を示す。","drive":{"ja":"企業が自動化された意思決定の説明を義務づけられれば、個人は不公平な扱いに異議を申し立てやすくなるだろう。を言い換えてください","en":"A requirement for companies to explain automated decisions would facilitate individuals’ challenges to unfair treatment."},"level":2},{"id":"p1-paraphrase-005","q":"Because natural resources are limited, governments need to encourage industries to use materials more efficiently and reduce unnecessary waste.","q_ja":"天然資源は限られているため、政府は産業界に資材の利用効率を高め、不要な廃棄物を減らすよう促す必要がある。","choices":[{"t":"Natural resources are unlimited, so governments need not encourage efficient material use.","why":"資源の制約と政府の働きかけの必要性を否定している。"},{"t":"Given limited natural resources, governments must encouraging industries to reduce waste.","why":"must の後には原形 encourage が必要。"},{"t":"Given the limited availability of natural resources, governments must promote more efficient material use and reductions in unnecessary waste among industries.","why":"正解。資源の制約を理由として示し、産業界に促す二つの行動を保っている。"},{"t":"Because natural resources are limited, governments need to encourage industries to use materials more efficiently and decrease unnecessary waste.","why":"reduce を decrease に替えただけで、ほぼ丸写しになっている。"},{"t":"Using materials well is good, and throwing things away is bad.","why":"資源の制約と政府による産業界への働きかけが失われている。"},{"t":"Natural resources become limited because governments encourage efficient material use and waste reduction.","why":"資源の制約を政策の理由ではなく結果にしている。"}],"answer":2,"point":"理由節を Given と名詞句に変え、行為を material use や reductions で名詞化する。","drive":{"ja":"天然資源は限られているため、政府は産業界に資材の利用効率を高め、不要な廃棄物を減らすよう促す必要がある。を言い換えてください","en":"Given the limited availability of natural resources, governments must promote more efficient material use and reductions in unnecessary waste among industries."},"level":2},{"id":"p1-paraphrase-006","q":"By supporting independent journalism, public institutions can help citizens distinguish reliable information from misleading claims during national elections.","q_ja":"独立した報道を支援することで、公的機関は国政選挙の期間中、市民が信頼できる情報と誤解を招く主張を区別するのを助けられる。","choices":[{"t":"Public support for independent journalism guarantees that citizens reject every misleading claim during national elections.","why":"支援できるという可能性を、すべて退ける保証に強めている。"},{"t":"Independent journalists help public institutions distinguish reliable information from misleading claims during national elections.","why":"支援する主体と情報を区別する主体を変えている。"},{"t":"Public institutions can assist citizens in distinguish reliable information from misleading claims.","why":"前置詞 in の後は動名詞 distinguishing が必要。"},{"t":"By supporting independent journalism, public institutions can help citizens separate reliable information from misleading claims during national elections.","why":"distinguish を separate に替えただけで、ほぼ丸写しになっている。"},{"t":"Support for independent journalism by public institutions can assist citizens in distinguishing reliable information from misleading claims during national elections.","why":"正解。支援を名詞化し、主体、情報の区別、選挙という場面を保っている。"},{"t":"Independent journalism is good for people when they vote.","why":"支援する主体と情報判断への効果が具体的に示されていない。"}],"answer":4,"point":"help someone distinguish を assist someone in distinguishing に変えられる。","drive":{"ja":"独立した報道を支援することで、公的機関は国政選挙の期間中、市民が信頼できる情報と誤解を招く主張を区別するのを助けられる。を言い換えてください","en":"Support for independent journalism by public institutions can assist citizens in distinguishing reliable information from misleading claims during national elections."},"level":2},{"id":"p1-paraphrase-007","q":"Unless governments invest in preventive healthcare, the financial burden of treating avoidable diseases is likely to increase over time.","q_ja":"政府が予防医療に投資しなければ、予防可能な病気を治療する経済的負担は時間とともに増す可能性が高い。","choices":[{"t":"Government investment in preventive healthcare will probably increase the financial burden of treating preventable diseases.","why":"投資がない場合の負担増を、投資による負担増に変えている。"},{"t":"Without government investment in preventive healthcare, treating preventable diseases will probably impose an increasing financial burden over time.","why":"正解。投資がない条件と治療による負担増の見込みを保っている。"},{"t":"Without government investment in preventive healthcare, the financial burden of treating diseases are likely to increase.","why":"主語の中心は単数の burden なので is が必要。"},{"t":"Unless governments invest in preventive healthcare, the financial burden of treating avoidable illnesses is likely to increase over time.","why":"diseases を illnesses に替えただけで、ほぼ丸写しになっている。"},{"t":"Preventive healthcare is good because getting sick is bad.","why":"政府の投資不足と将来の経済的負担の関係が抜けている。"},{"t":"Without government investment in preventive healthcare, treatment costs will certainly disappear over time.","why":"負担が増す見込みを確実に消滅するという逆の結果にしている。"}],"answer":1,"point":"Unless の条件節を without と名詞句に変え、負担を impose a burden で表す。","drive":{"ja":"政府が予防医療に投資しなければ、予防可能な病気を治療する経済的負担は時間とともに増す可能性が高い。を言い換えてください","en":"Without government investment in preventive healthcare, treating preventable diseases will probably impose an increasing financial burden over time."},"level":2},{"id":"p1-paraphrase-008","q":"Although digital services improve convenience, requiring everyone to use them may exclude citizens who lack adequate internet access.","q_ja":"デジタルサービスは利便性を高めるものの、全員に利用を義務づけると、十分なインターネット接続環境がない市民を排除するおそれがある。","choices":[{"t":"Although digital services enhance convenience, making their use compulsory may exclude citizens whose internet access is inadequate.","why":"正解。although を残して対比を保ちつつ、requiring everyone to use them を making their use compulsory、who lack adequate internet access を whose internet access is inadequate と構文ごと言い換えている。"},{"t":"Compulsory use of digital services always includes citizens whose internet access is inadequate.","why":"排除のおそれを必ず包摂するという意味に変えている。"},{"t":"Although digital services increase convenience, requiring everyone to use them may exclude citizens who lack adequate internet access.","why":"improve を increase に替えただけで、ほぼ丸写しになっている。"},{"t":"Despite enhance convenience, compulsory use of digital services may exclude some citizens.","why":"despite の後には動名詞 enhancing が必要。"},{"t":"Digital services are good, but they are bad for some people.","why":"義務化と接続環境の不足という条件が抜けている。"},{"t":"Citizens without adequate internet access require everyone to use digital services.","why":"排除されるおそれのある市民を、利用を義務づける主体に変えている。"}],"answer":0,"point":"譲歩は despite と動名詞で、所有の関係は whose で表せる。","drive":{"ja":"デジタルサービスは利便性を高めるものの、全員に利用を義務づけると、十分なインターネット接続環境がない市民を排除するおそれがある。を言い換えてください","en":"Although digital services enhance convenience, making their use compulsory may exclude citizens whose internet access is inadequate."},"level":2},{"id":"p1-paraphrase-009","q":"Reducing dependence on imported energy would make the national economy less vulnerable to sudden changes in international fuel prices.","q_ja":"輸入エネルギーへの依存を減らせば、国の経済は国際的な燃料価格の急変の影響を受けにくくなるだろう。","choices":[{"t":"Reduced reliance on energy imports would increase the national economy’s vulnerability to international fuel price changes.","why":"影響を受けにくくなるという結果を逆にしている。"},{"t":"Reducing dependence on imported energy would make the national economy less vulnerable to sudden shifts in international fuel prices.","why":"changes を shifts に替えただけで、ほぼ丸写しになっている。"},{"t":"Reduced reliance on energy imports would decreases vulnerability to international fuel price changes.","why":"would の後には原形 decrease が必要。"},{"t":"Importing less energy would be good for the country.","why":"価格変動への弱さが軽減するという具体的な効果が抜けている。"},{"t":"A reduction in reliance on energy imports would decrease the national economy’s vulnerability to abrupt fluctuations in international fuel prices.","why":"正解。依存の低下と価格変動への弱さの軽減を名詞化して保持している。"},{"t":"Reduced vulnerability to international fuel price changes would cause less dependence on imported energy.","why":"依存低下が弱さを軽減するという因果を逆にしている。"}],"answer":4,"point":"less vulnerable を decrease vulnerability、dependence を reliance で言い換える。","drive":{"ja":"輸入エネルギーへの依存を減らせば、国の経済は国際的な燃料価格の急変の影響を受けにくくなるだろう。を言い換えてください","en":"A reduction in reliance on energy imports would decrease the national economy’s vulnerability to abrupt fluctuations in international fuel prices."},"level":3},{"id":"p1-paraphrase-010","q":"Public funding for scientific research should not depend solely on whether a project is likely to generate immediate commercial profits.","q_ja":"科学研究への公的資金の提供は、その事業がすぐに商業的利益を生む見込みだけで決めるべきではない。","choices":[{"t":"Public funding for scientific research should depend entirely on immediate commercial profits.","why":"利益だけで決めるべきではないという主張を逆にしている。"},{"t":"The allocation of public research funds should not be determine exclusively by immediate commercial prospects.","why":"受動態の be の後には過去分詞 determined が必要。"},{"t":"Public funding for scientific research should not depend only on whether a project is likely to generate immediate commercial profits.","why":"solely を only に替えただけで、ほぼ丸写しになっている。"},{"t":"The allocation of public funds to scientific research should not be determined exclusively by a project’s prospects for immediate commercial profit.","why":"正解。資金配分を名詞化し、短期の利益だけで判断しないという限定を保っている。"},{"t":"Giving money to science is good even when business is bad.","why":"資金配分の基準と短期の利益の見込みという論点が失われている。"},{"t":"Scientific research should never receive public funding if it might produce commercial profits.","why":"利益だけで判断しないという限定を、利益の可能性があれば支援しないという禁止に変えている。"}],"answer":3,"point":"not solely を not exclusively、利益を生む見込みを prospects for profit で表す。","drive":{"ja":"科学研究への公的資金の提供は、その事業がすぐに商業的利益を生む見込みだけで決めるべきではない。を言い換えてください","en":"The allocation of public funds to scientific research should not be determined exclusively by a project’s prospects for immediate commercial profit."},"level":3},{"id":"p1-paraphrase-101","q":"The government increased funding for public transport because it wanted to reduce air pollution.","q_ja":"政府は大気汚染を減らしたかったため、公共交通への資金を増やした。","choices":[{"t":"Public transport received less government funding as part of an effort to reduce air pollution.","why":"原文では資金を増やしているが、この文では資金を減らしている。"},{"t":"A desire to reduce air pollution led the government to increase public transport funding.","why":"正解。大気汚染を減らしたいという目的を名詞の主語にし、資金増加につながったと表している。"},{"t":"The government increased funding for public transport because it wanted to decrease air pollution.","why":"reduceを同義語のdecreaseに替えただけで、構文を変えていない。"},{"t":"The government wanted more air pollution, so it increased the funding available for public transport.","why":"資金を増やした目的が、大気汚染の削減から増加に変わっている。"},{"t":"The government increased public transport funding because of it wanted to reduce air pollution.","why":"because ofの後ろに主語と動詞のある節は置けない。この形ではbecauseを使う。"},{"t":"Public transport companies increased government funding because they wanted to reduce levels of air pollution.","why":"資金を増やした主体が、政府から公共交通の会社に変わっている。"}],"answer":1,"point":"because節の目的は、A desire to do led A to doの形でも表せる。","level":1,"drive":{"ja":"政府は大気汚染を減らしたかったため、公共交通への資金を増やした。目的を名詞の主語にして英語で言い換えてください。","en":"A desire to reduce air pollution led the government to increase public transport funding."}},{"id":"p1-paraphrase-102","q":"Although the policy was expensive, it improved access to health care in rural areas.","q_ja":"その政策には費用がかかったが、地方で医療を受けやすくなった。","choices":[{"t":"The costly policy made it more difficult for people in rural areas to receive health care.","why":"原文では医療を受けやすくなったが、この文では受けにくくなっている。"},{"t":"Although the policy was costly, it improved access to health care in rural areas.","why":"expensiveを同義語のcostlyに替えただけで、構文を変えていない。"},{"t":"Despite the policy was expensive, it made health care more accessible in rural areas.","why":"despiteの直後に主語と動詞のある節は置けない。despite its high costなどとする。"},{"t":"The policy improved access to health care in rural areas because it was expensive.","why":"費用がかかっても改善したという譲歩を、費用がかかったから改善したという因果関係に変えている。"},{"t":"Despite its high cost, the policy made health care more accessible in rural areas.","why":"正解。Althoughの節をDespiteと名詞句に変え、費用がかかっても医療を受けやすくなったという意味を保っている。"},{"t":"The policy improved access to health care in rural areas without requiring any spending.","why":"原文では費用がかかったが、この文では支出が一切不要だったとしている。"}],"answer":4,"point":"Althoughの後ろには節、despiteの後ろには名詞句を置いて譲歩を表す。","level":1,"drive":{"ja":"その政策には費用がかかったが、地方で医療を受けやすくなった。despiteを使って英語で言い換えてください。","en":"Despite its high cost, the policy made health care more accessible in rural areas."}},{"id":"p1-paraphrase-103","q":"If governments do not share information, progress in clean energy will be slower.","q_ja":"各国政府が情報を共有しなければ、クリーンエネルギーの進歩は遅くなる。","choices":[{"t":"Without information sharing among governments, progress in clean energy will proceed at a slower pace.","why":"正解。情報を共有しないという条件をWithoutと名詞句に変え、進歩が遅くなるという意味を保っている。"},{"t":"Clean energy will develop more quickly if governments keep their information instead of sharing it.","why":"情報を共有しない場合の結果が、進歩の減速から加速に変わっている。"},{"t":"If governments do not share knowledge, progress in clean energy will be slower.","why":"informationを同義語のknowledgeに替えただけで、構文を変えていない。"},{"t":"Unless governments shares their information, progress in clean energy will proceed at a slower pace.","why":"主語governmentsは複数なので、動詞はsharesではなくshareにする。"},{"t":"Slower progress in clean energy will lead governments to stop sharing information with one another.","why":"情報を共有しないことが進歩を遅らせるという因果の向きを逆にしている。"},{"t":"Information sharing among governments will slow the pace of progress in clean energy research.","why":"情報を共有しないと遅くなるという原文を、共有すると遅くなるという意味に変えている。"}],"answer":0,"point":"If A do notの条件は、Withoutと動名詞を含む名詞句でも表せる。","level":1,"drive":{"ja":"各国政府が情報を共有しなければ、クリーンエネルギーの進歩は遅くなる。withoutを使って英語で言い換えてください。","en":"Without information sharing among governments, progress in clean energy will proceed at a slower pace."}},{"id":"p1-paraphrase-104","q":"The new law protects personal data and also limits how companies use it.","q_ja":"新しい法律は個人データを保護し、企業によるその利用も制限する。","choices":[{"t":"The new law protects personal data while allowing companies to use it without any limits.","why":"原文では企業の利用を制限するが、この文では制限なしに利用を認めている。"},{"t":"The new law protects personal data and also restricts how companies use it.","why":"limitsを同義語のrestrictsに替えただけで、構文を変えていない。"},{"t":"The new law provides protection for personal data but places no restrictions on company use.","why":"企業による利用にも制限を設けるという原文と異なり、制限を設けないとしている。"},{"t":"The new law not only protects personal data but also restricts its use by companies.","why":"正解。二つの働きをnot onlyとbut alsoでつなぎ、企業による利用をits use by companiesと言い換えている。"},{"t":"The new law provides protection for personal data and places restrict on its corporate use.","why":"placesの目的語には名詞が必要なので、動詞restrictではなく名詞restrictionsを使う。"},{"t":"Companies must protect the new law, which sets limits on how they use personal data.","why":"法律が個人データを保護するという内容を、企業が法律を守る必要があるという内容に変えている。"}],"answer":3,"point":"二つの働きはnot only A but also Bで表せる。AとBの文法上の形をそろえる。","level":1,"drive":{"ja":"新しい法律は個人データを保護し、企業によるその利用も制限する。not onlyとbut alsoを使って英語で言い換えてください。","en":"The new law not only protects personal data but also restricts its use by companies."}}],"reason":[{"id":"p1-reason-001","q":"TOPIC: Should governments expand public transport subsidies?\nPosition: Agree\nPOINT: Equality\nChoose the general reason that supports the position using the specified POINT.","q_ja":"政府は公共交通への補助金を拡大すべきか（賛成）。指定の観点「公平性」を使って、この立場を支える一般的な理由を選んでください。","choices":[{"t":"Transport subsidies undermine equality when benefits mainly reach affluent urban commuters while disadvantaged residents in remote communities receive little financial assistance.","why":"公平性に触れているが、指定された立場と逆の理由になっている。"},{"t":"Expanded transport subsidies reduce vehicle emissions by encouraging commuters to abandon private cars, thereby improving air quality in crowded urban areas.","why":"同じ政策に関する理由だが、指定された公平性とは別の観点を述べている。"},{"t":"By reducing fares, public subsidies promote equality, enabling residents with limited incomes to access employment opportunities beyond their immediate neighborhoods.","why":"正解。公平性の観点から政策の影響を説明し、賛成の立場を支える一般的な理由になっている。"},{"t":"Public transport subsidies appear in municipal budgets, which classify expenditure according to administrative departments and the services receiving direct financial support.","why":"制度や対象の事実を説明しているだけで、指定された立場を支える理由を示していない。"},{"t":"Governments should expand financial assistance for public transport because providing broader public subsidies for these services is a policy that deserves support.","why":"指定された立場を言い換えているだけで、なぜそうすべきかを説明していない。"},{"t":"When my municipality introduced subsidized bus passes last April, I used mine to attend a recruitment event in a neighboring district.","why":"特定の個人的な体験にとどまり、指定された立場を支える一般的な理由になっていない。"}],"answer":2,"point":"「公平性」が政策によってどう変わるかを説明し、賛成の立場につながる因果関係を示す。","drive":{"ja":"政府は公共交通への補助金を拡大すべきか。賛成の立場で、「公平性」を使った一般的な理由を英語で一文述べてください。","en":"By reducing fares, public subsidies promote equality, enabling residents with limited incomes to access employment opportunities beyond their immediate neighborhoods."},"level":2},{"id":"p1-reason-002","q":"TOPIC: Should public institutions replace most administrative staff with automated systems?\nPosition: Disagree\nPOINT: Accountability\nChoose the general reason that supports the position using the specified POINT.","q_ja":"公的機関は事務職員の大半を自動化システムで置き換えるべきか（反対）。指定の観点「説明責任」を使って、この立場を支える一般的な理由を選んでください。","choices":[{"t":"Automated systems strengthen accountability by recording administrative decisions consistently, allowing public institutions to investigate errors more thoroughly than conventional paper procedures permit.","why":"説明責任に触れているが、指定された立場と逆の理由になっている。"},{"t":"Replacing administrative staff with automated systems would impose substantial initial costs, diverting limited public resources from essential services for vulnerable local residents.","why":"同じ政策に関する理由だが、指定された説明責任とは別の観点を述べている。"},{"t":"Public institutions maintain administrative records in electronic databases, with separate departments responsible for managing applications relating to various categories of public services.","why":"制度や対象の事実を説明しているだけで、指定された立場を支える理由を示していない。"},{"t":"Public institutions should retain most administrative employees because replacing the majority of these workers with automated systems is an approach they should reject.","why":"指定された立場を言い換えているだけで、なぜそうすべきかを説明していない。"},{"t":"After an automated application system rejected my housing documents last winter, I visited the municipal office and requested clarification from a senior official.","why":"特定の個人的な体験にとどまり、指定された立場を支える一般的な理由になっていない。"},{"t":"Extensive automation may weaken accountability, as citizens affected by incorrect decisions could struggle to identify officials responsible for explaining and correcting them.","why":"正解。説明責任の観点から政策の影響を説明し、反対の立場を支える一般的な理由になっている。"}],"answer":5,"point":"「説明責任」が政策によってどう変わるかを説明し、反対の立場につながる因果関係を示す。","drive":{"ja":"公的機関は事務職員の大半を自動化システムで置き換えるべきか。反対の立場で、「説明責任」を使った一般的な理由を英語で一文述べてください。","en":"Extensive automation may weaken accountability, as citizens affected by incorrect decisions could struggle to identify officials responsible for explaining and correcting them."},"level":3},{"id":"p1-reason-003","q":"TOPIC: Should governments provide more funding for basic scientific research?\nPosition: Agree\nPOINT: Innovation\nChoose the general reason that supports the position using the specified POINT.","q_ja":"政府は基礎科学研究への資金提供を増やすべきか（賛成）。指定の観点「技術革新」を使って、この立場を支える一般的な理由を選んでください。","choices":[{"t":"Public investment in basic research fosters innovation by supporting investigations whose uncertain commercial prospects would otherwise discourage private companies from financing them.","why":"正解。技術革新の観点から政策の影響を説明し、賛成の立場を支える一般的な理由になっている。"},{"t":"Increasing public funding could hinder innovation if researchers prioritize administrative requirements over original investigations, reducing their willingness to explore unconventional scientific ideas.","why":"技術革新に触れているが、指定された立場と逆の理由になっている。"},{"t":"Greater funding for basic research would create stable employment for laboratory technicians, helping universities retain qualified personnel despite fluctuations in private sector recruitment.","why":"同じ政策に関する理由だが、指定された技術革新とは別の観点を述べている。"},{"t":"Basic research receives funding from several government agencies, whose annual reports describe the academic institutions and scientific fields included in their grant programs.","why":"制度や対象の事実を説明しているだけで、指定された立場を支える理由を示していない。"},{"t":"Governments should allocate additional resources to basic scientific research because increasing public financial support for this category of research is a desirable policy.","why":"指定された立場を言い換えているだけで、なぜそうすべきかを説明していない。"},{"t":"During my university internship last summer, a government research grant allowed our laboratory to purchase equipment for an experimental project on advanced materials.","why":"特定の個人的な体験にとどまり、指定された立場を支える一般的な理由になっていない。"}],"answer":0,"point":"「技術革新」が政策によってどう変わるかを説明し、賛成の立場につながる因果関係を示す。","drive":{"ja":"政府は基礎科学研究への資金提供を増やすべきか。賛成の立場で、「技術革新」を使った一般的な理由を英語で一文述べてください。","en":"Public investment in basic research fosters innovation by supporting investigations whose uncertain commercial prospects would otherwise discourage private companies from financing them."},"level":3},{"id":"p1-reason-004","q":"TOPIC: Should cities prohibit private cars throughout their central districts?\nPosition: Disagree\nPOINT: Accessibility\nChoose the general reason that supports the position using the specified POINT.","q_ja":"都市は中心地区全域で自家用車の利用を禁止すべきか（反対）。指定の観点「アクセスのしやすさ」を使って、この立場を支える一般的な理由を選んでください。","choices":[{"t":"Prohibiting private cars improves accessibility by allowing cities to redesign central streets for reliable bus services and continuous routes for pedestrians using wheelchairs.","why":"アクセスのしやすさに触れているが、指定された立場と逆の理由になっている。"},{"t":"A comprehensive ban could reduce commercial revenue if customers choose suburban shopping centers, placing additional financial pressure on independent retailers in central districts.","why":"同じ政策に関する理由だが、指定されたアクセスのしやすさとは別の観点を述べている。"},{"t":"Central districts contain offices, shops, and public facilities, while municipal transport maps identify roads connecting these locations with surrounding residential and commercial neighborhoods.","why":"制度や対象の事実を説明しているだけで、指定された立場を支える理由を示していない。"},{"t":"A comprehensive ban would restrict accessibility for residents with mobility impairments, who may depend on private vehicles where suitable public transport remains unavailable.","why":"正解。アクセスのしやすさの観点から政策の影響を説明し、反対の立場を支える一般的な理由になっている。"},{"t":"Cities should reject comprehensive prohibitions on private cars in their central districts because banning these vehicles throughout such areas is an undesirable municipal policy.","why":"指定された立場を言い換えているだけで、なぜそうすべきかを説明していない。"},{"t":"When my city closed a central street to private cars last month, I drove my grandfather to a medical appointment via another neighborhood.","why":"特定の個人的な体験にとどまり、指定された立場を支える一般的な理由になっていない。"}],"answer":3,"point":"「アクセスのしやすさ」が政策によってどう変わるかを説明し、反対の立場につながる因果関係を示す。","drive":{"ja":"都市は中心地区全域で自家用車の利用を禁止すべきか。反対の立場で、「アクセスのしやすさ」を使った一般的な理由を英語で一文述べてください。","en":"A comprehensive ban would restrict accessibility for residents with mobility impairments, who may depend on private vehicles where suitable public transport remains unavailable."},"level":3},{"id":"p1-reason-005","q":"TOPIC: Should governments require manufacturers to collect used electronic devices?\nPosition: Agree\nPOINT: Resources\nChoose the general reason that supports the position using the specified POINT.","q_ja":"政府は使用済み電子機器の回収を製造業者に義務づけるべきか（賛成）。指定の観点「資源」を使って、この立場を支える一般的な理由を選んでください。","choices":[{"t":"Mandatory collection may waste resources when transporting small quantities of discarded devices over long distances consumes more fuel than existing local recycling arrangements.","why":"資源に触れているが、指定された立場と逆の理由になっている。"},{"t":"Mandatory collection conserves resources by enabling manufacturers to recover valuable metals from discarded devices, reducing their dependence on the extraction of raw materials.","why":"正解。資源の観点から政策の影響を説明し、賛成の立場を支える一般的な理由になっている。"},{"t":"Requiring manufacturers to collect used electronic devices would create employment in regional processing facilities, potentially supporting communities affected by declining demand for traditional manufacturing.","why":"同じ政策に関する理由だが、指定された資源とは別の観点を述べている。"},{"t":"Electronic devices contain several types of metals, and manufacturers publish product specifications that describe the components incorporated into different models of household equipment.","why":"制度や対象の事実を説明しているだけで、指定された立場を支える理由を示していない。"},{"t":"Governments should impose collection requirements on electronics manufacturers because making these companies responsible for collecting used devices is a measure that should be adopted.","why":"指定された立場を言い換えているだけで、なぜそうすべきかを説明していない。"},{"t":"Last spring, I returned an outdated tablet to its manufacturer, and the collection center sent me a receipt describing the recycling service it provided.","why":"特定の個人的な体験にとどまり、指定された立場を支える一般的な理由になっていない。"}],"answer":1,"point":"「資源」が政策によってどう変わるかを説明し、賛成の立場につながる因果関係を示す。","drive":{"ja":"政府は使用済み電子機器の回収を製造業者に義務づけるべきか。賛成の立場で、「資源」を使った一般的な理由を英語で一文述べてください。","en":"Mandatory collection conserves resources by enabling manufacturers to recover valuable metals from discarded devices, reducing their dependence on the extraction of raw materials."},"level":2},{"id":"p1-reason-006","q":"TOPIC: Should universities make all lectures available exclusively online?\nPosition: Disagree\nPOINT: Inequality\nChoose the general reason that supports the position using the specified POINT.","q_ja":"大学はすべての講義をオンラインのみで提供すべきか（反対）。指定の観点「格差」を使って、この立場を支える一般的な理由を選んでください。","choices":[{"t":"Moving all lectures online reduces inequality by allowing students living far from campus to participate without bearing the substantial expense of relocation.","why":"格差に触れているが、指定された立場と逆の理由になっている。"},{"t":"Exclusive online lectures may weaken academic interaction, as spontaneous discussions between students and instructors become harder to maintain through scheduled digital sessions.","why":"同じ政策に関する理由だが、指定された格差とは別の観点を述べている。"},{"t":"Online lectures are delivered through digital platforms, which universities incorporate into course catalogs alongside descriptions of assessment methods and required learning materials.","why":"制度や対象の事実を説明しているだけで、指定された立場を支える理由を示していない。"},{"t":"Universities should reject the exclusive online delivery of all lectures because offering every lecture through online platforms is an educational policy worth opposing.","why":"指定された立場を言い換えているだけで、なぜそうすべきかを説明していない。"},{"t":"Exclusive online provision could deepen inequality, since students lacking reliable internet connections or suitable study environments would face additional barriers to participation.","why":"正解。格差の観点から政策の影響を説明し、反対の立場を支える一般的な理由になっている。"},{"t":"When I attended an online economics lecture from my apartment last semester, construction noise interrupted my concentration during the discussion of international trade.","why":"特定の個人的な体験にとどまり、指定された立場を支える一般的な理由になっていない。"}],"answer":4,"point":"「格差」が政策によってどう変わるかを説明し、反対の立場につながる因果関係を示す。","drive":{"ja":"大学はすべての講義をオンラインのみで提供すべきか。反対の立場で、「格差」を使った一般的な理由を英語で一文述べてください。","en":"Exclusive online provision could deepen inequality, since students lacking reliable internet connections or suitable study environments would face additional barriers to participation."},"level":2},{"id":"p1-reason-007","q":"TOPIC: Should local governments purchase food for public facilities from nearby producers?\nPosition: Agree\nPOINT: Resilience\nChoose the general reason that supports the position using the specified POINT.","q_ja":"自治体は公共施設向けの食料を近隣の生産者から購入すべきか（賛成）。指定の観点「供給体制の強さ」を使って、この立場を支える一般的な理由を選んでください。","choices":[{"t":"Relying on nearby producers weakens supply resilience when a regional crop failure affects multiple suppliers simultaneously, leaving public facilities with limited alternatives.","why":"供給体制の強さに触れているが、指定された立場と逆の理由になっている。"},{"t":"Purchasing food locally supports agricultural employment by providing nearby producers with predictable demand, helping smaller farms maintain their operations despite competitive market conditions.","why":"同じ政策に関する理由だが、指定された供給体制の強さとは別の観点を述べている。"},{"t":"Public facilities purchase food under procurement contracts, which specify delivery schedules and product categories for suppliers participating in local government purchasing programs.","why":"制度や対象の事実を説明しているだけで、指定された立場を支える理由を示していない。"},{"t":"Local purchasing strengthens supply resilience by reducing dependence on distant distribution networks, which may be disrupted by severe weather or fuel shortages.","why":"正解。供給体制の強さの観点から政策の影響を説明し、賛成の立場を支える一般的な理由になっている。"},{"t":"Local governments should source food for public facilities from nearby producers because adopting this purchasing approach is a municipal policy that deserves implementation.","why":"指定された立場を言い換えているだけで、なぜそうすべきかを説明していない。"},{"t":"After a storm delayed deliveries last autumn, I collected vegetables from a nearby farm for the community center where I was volunteering that week.","why":"特定の個人的な体験にとどまり、指定された立場を支える一般的な理由になっていない。"}],"answer":3,"point":"「供給体制の強さ」が政策によってどう変わるかを説明し、賛成の立場につながる因果関係を示す。","drive":{"ja":"自治体は公共施設向けの食料を近隣の生産者から購入すべきか。賛成の立場で、「供給体制の強さ」を使った一般的な理由を英語で一文述べてください。","en":"Local purchasing strengthens supply resilience by reducing dependence on distant distribution networks, which may be disrupted by severe weather or fuel shortages."},"level":3},{"id":"p1-reason-008","q":"TOPIC: Should police be permitted to use facial recognition without independent approval?\nPosition: Disagree\nPOINT: Privacy\nChoose the general reason that supports the position using the specified POINT.","q_ja":"警察による顔認識技術の使用を独立機関の承認なしに認めるべきか（反対）。指定の観点「プライバシー」を使って、この立場を支える一般的な理由を選んでください。","choices":[{"t":"Without independent oversight, facial recognition threatens privacy by enabling authorities to track individuals across public spaces without demonstrating a legitimate investigative need.","why":"正解。プライバシーの観点から政策の影響を説明し、反対の立場を支える一般的な理由になっている。"},{"t":"Allowing police immediate access to facial recognition protects privacy by helping investigators identify relevant suspects without examining extensive personal records belonging to unrelated citizens.","why":"プライバシーに触れているが、指定された立場と逆の理由になっている。"},{"t":"Unrestricted facial recognition may undermine public confidence when inaccurate matches lead to wrongful questioning, damaging cooperation between police departments and the communities they serve.","why":"同じ政策に関する理由だが、指定されたプライバシーとは別の観点を述べている。"},{"t":"Facial recognition systems compare captured images with stored photographs, and police departments describe their technical equipment in documents concerning operational procedures and procurement.","why":"制度や対象の事実を説明しているだけで、指定された立場を支える理由を示していない。"},{"t":"Police should obtain independent approval before using facial recognition because allowing this technology to operate without such authorization is a practice that requires rejection.","why":"指定された立場を言い換えているだけで、なぜそうすべきかを説明していない。"},{"t":"During a visit to a railway station last year, I noticed a facial recognition camera and asked an officer about its stated operational purpose.","why":"特定の個人的な体験にとどまり、指定された立場を支える一般的な理由になっていない。"}],"answer":0,"point":"「プライバシー」が政策によってどう変わるかを説明し、反対の立場につながる因果関係を示す。","drive":{"ja":"警察による顔認識技術の使用を独立機関の承認なしに認めるべきか。反対の立場で、「プライバシー」を使った一般的な理由を英語で一文述べてください。","en":"Without independent oversight, facial recognition threatens privacy by enabling authorities to track individuals across public spaces without demonstrating a legitimate investigative need."},"level":3},{"id":"p1-reason-009","q":"TOPIC: Should governments invest more in restoring urban wetlands?\nPosition: Agree\nPOINT: Flooding\nChoose the general reason that supports the position using the specified POINT.","q_ja":"政府は都市部の湿地再生への投資を増やすべきか（賛成）。指定の観点「洪水」を使って、この立場を支える一般的な理由を選んでください。","choices":[{"t":"Restored wetlands could aggravate flooding if poorly planned projects obstruct existing drainage channels, preventing storm water from flowing efficiently away from residential areas.","why":"洪水に触れているが、指定された立場と逆の理由になっている。"},{"t":"Urban wetland restoration supports biodiversity by providing habitats for native species, which often struggle to survive in densely developed areas dominated by concrete surfaces.","why":"同じ政策に関する理由だが、指定された洪水とは別の観点を述べている。"},{"t":"Urban wetlands occupy land within municipal boundaries, and restoration proposals generally include maps showing project locations alongside existing roads, buildings, and drainage infrastructure.","why":"制度や対象の事実を説明しているだけで、指定された立場を支える理由を示していない。"},{"t":"Governments should increase investment in restoring urban wetlands because allocating additional public funds to these restoration projects is an environmental policy that merits support.","why":"指定された立場を言い換えているだけで、なぜそうすべきかを説明していない。"},{"t":"Following heavy rainfall last June, I photographed standing water near a restored wetland and submitted the images to the neighborhood association at its meeting.","why":"特定の個人的な体験にとどまり、指定された立場を支える一般的な理由になっていない。"},{"t":"Wetland restoration alleviates flooding by creating areas that absorb excess rainfall, thereby reducing pressure on drainage systems during periods of intense precipitation.","why":"正解。洪水の観点から政策の影響を説明し、賛成の立場を支える一般的な理由になっている。"}],"answer":5,"point":"「洪水」が政策によってどう変わるかを説明し、賛成の立場につながる因果関係を示す。","drive":{"ja":"政府は都市部の湿地再生への投資を増やすべきか。賛成の立場で、「洪水」を使った一般的な理由を英語で一文述べてください。","en":"Wetland restoration alleviates flooding by creating areas that absorb excess rainfall, thereby reducing pressure on drainage systems during periods of intense precipitation."},"level":3},{"id":"p1-reason-010","q":"TOPIC: Should public libraries eliminate their printed collections entirely?\nPosition: Disagree\nPOINT: Inclusion\nChoose the general reason that supports the position using the specified POINT.","q_ja":"公共図書館は印刷資料を全面的に廃止すべきか（反対）。指定の観点「包摂」を使って、この立場を支える一般的な理由を選んでください。","choices":[{"t":"Entirely digital collections promote inclusion by allowing residents with physical disabilities to borrow materials remotely, removing the need to travel to library buildings.","why":"包摂に触れているが、指定された立場と逆の理由になっている。"},{"t":"Eliminating printed collections may weaken cultural preservation because older publications without digital versions could disappear from community institutions that traditionally safeguard local historical records.","why":"同じ政策に関する理由だが、指定された包摂とは別の観点を述べている。"},{"t":"Eliminating printed collections undermines inclusion by excluding residents who lack digital skills, preventing them from independently accessing information through familiar and accessible formats.","why":"正解。包摂の観点から政策の影響を説明し、反対の立場を支える一般的な理由になっている。"},{"t":"Public libraries classify printed collections according to established cataloging systems, while digital materials appear in electronic databases maintained through contracts with publishing companies.","why":"制度や対象の事実を説明しているだけで、指定された立場を支える理由を示していない。"},{"t":"Public libraries should retain printed collections because completely eliminating printed materials from these institutions is an approach to library management that should be rejected.","why":"指定された立場を言い換えているだけで、なぜそうすべきかを説明していない。"},{"t":"When my local library removed several printed reference books last September, I borrowed an older encyclopedia from another branch to complete a family history project.","why":"特定の個人的な体験にとどまり、指定された立場を支える一般的な理由になっていない。"}],"answer":2,"point":"「包摂」が政策によってどう変わるかを説明し、反対の立場につながる因果関係を示す。","drive":{"ja":"公共図書館は印刷資料を全面的に廃止すべきか。反対の立場で、「包摂」を使った一般的な理由を英語で一文述べてください。","en":"Eliminating printed collections undermines inclusion by excluding residents who lack digital skills, preventing them from independently accessing information through familiar and accessible formats."},"level":2},{"id":"p1-reason-101","q":"TOPIC: Should governments provide more funding for public transport?\nPosition: Agree\nPOINT: Costs","q_ja":"政府は公共交通への資金援助を増やすべきか。立場は賛成。費用の観点から理由を選ぶ。","choices":[{"t":"Public transport services require expensive repairs, placing an additional financial burden on the government each year.","why":"公共交通への支出が政府の負担になるという内容で、資金援助を増やすことに反対する理由。"},{"t":"Public funding for transport reduces travel costs, leaving households with more money for other basic needs.","why":"正解。公的資金で交通費が下がり、家計に余裕が生まれるという一般的な利点が賛成を支える。"},{"t":"The use of public transport reduces air pollution by keeping more private cars off busy roads.","why":"環境面では賛成を支えるが、指定された費用の観点を使っていない。"},{"t":"Public transport budgets include money for vehicles, station buildings, staff salaries, and regular repairs to equipment.","why":"予算の使い道を挙げているだけで、資金援助を増やす利点を説明していない。"},{"t":"Public transport services allow older residents to visit hospitals even after they stop driving their cars.","why":"高齢者の移動を支える利点だが、指定された費用の観点を使っていない。"},{"t":"Local governments discuss public transport costs when they prepare their budgets for the next financial year.","why":"予算を作る際の事実を述べているだけで、資金援助を増やす理由になっていない。"}],"answer":1,"point":"費用の観点では、公的支援によって家計の負担がどう変わるかを理由にする。","level":1,"drive":{"ja":"政府は公共交通への資金援助を増やすべきか。賛成の立場で、費用の観点から理由を英語で述べる。","en":"Public funding for transport reduces travel costs, leaving households with more money for other basic needs."}},{"id":"p1-reason-102","q":"TOPIC: Should cities use facial recognition cameras in public places?\nPosition: Disagree\nPOINT: Privacy","q_ja":"都市は公共の場所で顔認証カメラを使うべきか。立場は反対。プライバシーの観点から理由を選ぶ。","choices":[{"t":"Facial recognition cameras allow police officers to identify suspects quickly and improve safety in crowded areas.","why":"安全性の向上という賛成の理由で、反対の立場もプライバシーの観点も満たしていない。"},{"t":"The installation of facial recognition cameras requires public money that cities could spend on other services.","why":"費用の面では反対を支えるが、指定されたプライバシーの観点を使っていない。"},{"t":"City officials discuss privacy rules before they decide where to install new facial recognition camera systems.","why":"導入前の手続きの事実だけで、カメラの使用に反対する理由になっていない。"},{"t":"Images from facial recognition cameras are stored in computer systems managed by local public safety departments.","why":"画像の保存先を述べているだけで、プライバシーへの悪影響を説明していない。"},{"t":"The collection of facial images threatens privacy by allowing authorities to track people without their permission.","why":"正解。本人の許可なく行動を追跡できることがプライバシーを脅かすため、反対の理由になる。"},{"t":"Facial recognition systems sometimes fail to identify people correctly, leading police officers to question innocent citizens.","why":"認証の精度の面では反対を支えるが、指定されたプライバシーの観点を使っていない。"}],"answer":4,"point":"プライバシーの観点では、本人の許可のない情報収集や追跡がもたらす問題を示す。","level":1,"drive":{"ja":"都市は公共の場所で顔認証カメラを使うべきか。反対の立場で、プライバシーの観点から理由を英語で述べる。","en":"The collection of facial images threatens privacy by allowing authorities to track people without their permission."}},{"id":"p1-reason-103","q":"TOPIC: Should governments invest more in renewable energy?\nPosition: Agree\nPOINT: Employment","q_ja":"政府は再生可能エネルギーへの投資を増やすべきか。立場は賛成。雇用の観点から理由を選ぶ。","choices":[{"t":"Investment in renewable energy creates employment by increasing demand for workers who build and maintain facilities.","why":"正解。施設の建設や保守を担う働き手への需要が増え、雇用が生まれるという利点が賛成を支える。"},{"t":"Renewable energy projects require large initial payments, increasing pressure on governments with limited budgets for public services.","why":"初期費用の負担を述べた反対の理由で、賛成の立場も雇用の観点も満たしていない。"},{"t":"The expansion of renewable energy reduces air pollution by replacing power plants that burn coal and oil.","why":"環境面では賛成を支えるが、指定された雇用の観点を使っていない。"},{"t":"Employment reports list the number of workers currently working at solar and wind power facilities across regions.","why":"雇用に関する報告書の内容だけで、投資を増やすことの利点を説明していない。"},{"t":"Renewable energy production reduces dependence on imported fuel, protecting countries from sudden changes in foreign fuel supplies.","why":"エネルギーの安定供給の面では賛成を支えるが、指定された雇用の観点を使っていない。"},{"t":"Workers at renewable energy facilities have several roles, including equipment inspection, office administration, and daily site management.","why":"現在ある仕事の種類を挙げただけで、投資の増加が雇用に与える利点を説明していない。"}],"answer":0,"point":"雇用の観点では、投資が働き手への需要や仕事の数を増やすことを理由にする。","level":1,"drive":{"ja":"政府は再生可能エネルギーへの投資を増やすべきか。賛成の立場で、雇用の観点から理由を英語で述べる。","en":"Investment in renewable energy creates employment by increasing demand for workers who build and maintain facilities."}},{"id":"p1-reason-104","q":"TOPIC: Should local governments provide public services only online?\nPosition: Disagree\nPOINT: Access","q_ja":"地方自治体は行政サービスをオンラインだけで提供すべきか。立場は反対。利用のしやすさの観点から理由を選ぶ。","choices":[{"t":"The use of online public services reduces office expenses by removing the need for large service counters.","why":"経費削減という賛成の理由で、反対の立場も利用のしやすさの観点も満たしていない。"},{"t":"Local government websites provide access to forms for residents who need to apply for various public services.","why":"ウェブサイトの機能を述べているだけで、オンラインだけにすることに反対する理由になっていない。"},{"t":"Online public services require personal information, raising concerns about the safety of data stored in government systems.","why":"個人情報の安全性の面では反対を支えるが、指定された利用のしやすさの観点を使っていない。"},{"t":"Providing services only online limits access for residents who lack internet connections or basic computer skills.","why":"正解。ネット環境や基本的な操作の技能がない住民は利用しにくくなるため、反対の理由になる。"},{"t":"Public service websites have separate pages for different procedures, such as tax payments and applications for financial support.","why":"サイト内のページ構成を述べているだけで、利用しにくくなる住民がいることを説明していない。"},{"t":"Moving public services online reduces personal contact, making it harder for staff to build trust with local residents.","why":"職員と住民の信頼関係の面では反対を支えるが、指定された利用のしやすさの観点を使っていない。"}],"answer":3,"point":"利用のしやすさの観点では、サービスを使うための環境や技能がない人への影響を考える。","level":1,"drive":{"ja":"地方自治体は行政サービスをオンラインだけで提供すべきか。反対の立場で、利用のしやすさの観点から理由を英語で述べる。","en":"Providing services only online limits access for residents who lack internet connections or basic computer skills."}}],"summary":[{"id":"p1-summary-001","q":"Municipal libraries are expanding their lending services beyond books to include equipment that residents rarely need to own. One district, for instance, lends electric drills for three days at a time. Sharing such goods reduces household expenses and the demand for new products. Nevertheless, maintaining the equipment requires additional staff and funding, which local authorities must secure if these services are to remain dependable.","q_ja":"自治体の図書館は、住民が所有する必要の少ない道具へ貸出対象を広げている。ある地区では電動ドリルを一度に3日間貸している。共有は家計の負担と新品への需要を減らすが、安定したサービスの維持には人員と財源の確保が必要である。","choices":[{"t":"Sharing such goods reduces household expenses and the demand for new products, but maintaining the equipment requires additional staff and funding.","why":"本文の表現をほぼそのままつないでおり、語句を言い換えて要点をまとめていない。"},{"t":"Lending electric drills for three days reduces household spending and demand for new goods, although dependable services require maintenance staff and funding.","why":"電動ドリルと3日間という具体例・数字を残しており、一般化が不十分。"},{"t":"Public lending of household equipment lowers personal costs and resource consumption, but reliable provision depends on sufficient maintenance funding and personnel.","why":"正解。利点と維持条件を両方残し、道具の種類や貸出日数は省く。"},{"t":"Public equipment lending reduces personal expenses and resource use, while membership fees provide the funding needed to maintain dependable services for residents.","why":"維持費を会費で賄うという仕組みは本文にない。"},{"t":"Borrowing equipment enables residents to avoid unnecessary purchases, reducing their household expenses and demand for products that they would otherwise rarely use.","why":"購入抑制の利点だけを述べ、維持に必要な人員と財源を落としている。"},{"t":"Shared equipment services eliminate household purchasing costs and resource waste, requiring only minimal public investment to remain fully dependable for all residents.","why":"費用や資源の無駄をなくす、少額の投資だけで維持できるという断定は本文を超えている。"}],"answer":2,"point":"利点と維持条件を両方残し、道具の種類や貸出日数は省く。","drive":{"ja":"次の段落の要点を英語1文で。道具の公共貸出は家計負担と資源消費を減らすが、安定した運営には維持費と人員が必要である。","en":"Public lending of household equipment lowers personal costs and resource consumption, but reliable provision depends on sufficient maintenance funding and personnel."},"level":2},{"id":"p1-summary-002","q":"Some employers now use automated systems to screen job applications, hoping to process large numbers more efficiently. A retailer, for example, used software to assess 800 applicants in a week. However, systems trained on past hiring decisions may reproduce existing inequalities. Independent reviews of their recommendations are therefore necessary to prevent efficiency gains from coming at the expense of fair access to employment.","q_ja":"多数の応募を効率よく処理するため、自動選考システムを導入する雇用主がいる。ある小売企業は1週間で800人を評価した。しかし、過去の採用判断を学習したシステムは既存の不平等を再現する恐れがあり、公平な雇用機会を守るために独立した審査が必要である。","choices":[{"t":"Systems trained on past hiring decisions may reproduce existing inequalities, so independent reviews of their recommendations are necessary to protect access to employment.","why":"本文の語句をほぼそのまま利用し、効率化という利点もまとめていない。"},{"t":"Software assessing 800 retail applicants within a week illustrates faster recruitment, although independent checks remain necessary to prevent unfair treatment of job seekers.","why":"800人、1週間、小売という具体的な情報を残している。"},{"t":"Automated recruitment accelerates application processing, but employers must publish every applicant's personal records so that external specialists can assess the fairness of decisions.","why":"応募者全員の個人記録を公表する義務は本文にない。"},{"t":"Learning from previous hiring decisions exposes recruitment software to inherited inequalities, making independent assessment of its recommendations essential for protecting disadvantaged job seekers.","why":"偏りと審査の必要性だけを扱い、大量の応募を効率よく処理する利点が欠けている。"},{"t":"Automated selection inevitably discriminates against qualified applicants, making external intervention the only possible way to secure equal employment opportunities throughout the entire economy.","why":"必ず差別する、介入が唯一の方法だという断定は本文にない。"},{"t":"Automated recruitment improves processing efficiency, but external oversight is needed to address inherited bias and protect equal opportunities for those seeking work.","why":"正解。効率化の利点と偏りのリスクを、監督の必要性につなげてまとめる。"}],"answer":5,"point":"効率化の利点と偏りのリスクを、監督の必要性につなげてまとめる。","drive":{"ja":"次の段落の要点を英語1文で。採用の自動化は効率を高めるが、過去の偏りを引き継ぐ恐れがあるため、公平性を守る外部の監督が必要である。","en":"Automated recruitment improves processing efficiency, but external oversight is needed to address inherited bias and protect equal opportunities for those seeking work."},"level":3},{"id":"p1-summary-003","q":"Coastal communities are restoring wetlands as an alternative to relying entirely on concrete barriers against flooding. In one village, a restored marsh absorbed water during two major storms. Such projects also create habitats for wildlife. Nevertheless, wetlands require considerable space, and their protective effects develop gradually. Consequently, planners should combine restoration with other defenses rather than expect it to provide immediate protection everywhere.","q_ja":"沿岸地域では、洪水対策をコンクリートの防壁だけに頼らず、湿地を再生する動きがある。ある村では再生した湿地が2度の大きな嵐で水を吸収した。生息地も生まれるが、広い土地と時間が必要なため、計画担当者はほかの防御策と組み合わせるべきである。","choices":[{"t":"Wetland restoration supports biodiversity and flood management, but spatial constraints and delayed benefits make its integration with additional protective measures necessary.","why":"正解。効果だけでなく、効果の限界と対策を併用する結論まで残す。"},{"t":"Wetlands require considerable space, and their protective effects develop gradually, so planners should combine restoration with other defenses against flooding in coastal communities.","why":"本文の表現をほぼ写しており、生息地を生む利点も省いている。"},{"t":"A village marsh absorbed floodwater during two major storms and supported wildlife, although restoration requires space, time, and coordination with other coastal defenses.","why":"村と2度の嵐という事例の情報を残している。"},{"t":"Restoring coastal wetlands protects wildlife and reduces flooding, while tourism revenue from the new habitats finances the construction of additional protective coastal barriers.","why":"観光収入で防壁建設の費用を賄うという内容は本文にない。"},{"t":"Restored wetlands provide habitats for wildlife while absorbing excess water, offering coastal communities an alternative to depending entirely on concrete barriers against dangerous flooding.","why":"湿地の利点だけで、土地や時間の制約と対策の併用が抜けている。"},{"t":"Once wetlands are restored, coastal communities receive complete flood protection and permanent wildlife habitats, eliminating the need for concrete defenses or further public investment.","why":"完全な防御が得られ、ほかの対策が不要になるという誇張は本文の結論に反する。"}],"answer":0,"point":"効果だけでなく、効果の限界と対策を併用する結論まで残す。","drive":{"ja":"次の段落の要点を英語1文で。湿地再生は生物多様性と洪水対策に役立つが、土地と時間の制約があり、ほかの防御策との併用が必要である。","en":"Wetland restoration supports biodiversity and flood management, but spatial constraints and delayed benefits make its integration with additional protective measures necessary."},"level":3},{"id":"p1-summary-004","q":"Governments sometimes offer subsidies to encourage households to improve the energy efficiency of their homes. For example, a local program covers half the cost of replacing old windows. These measures lower energy consumption, but families with limited savings may still struggle to pay the remaining expense. Unless assistance reflects differences in household income, public spending may primarily benefit residents who could already afford the improvements.","q_ja":"政府は住宅の省エネルギー化を促すために補助金を出すことがある。ある地域では古い窓の交換費用の半分を負担する。省エネには役立つが、貯蓄の少ない世帯は残額を払えない場合がある。所得差を考慮しないと、もともと改修できる住民に公費の恩恵が偏る恐れがある。","choices":[{"t":"These measures lower energy consumption, but families with limited savings may still struggle to pay the remaining expense unless assistance reflects household income.","why":"本文の語句をほぼそのまま使い、十分に言い換えていない。"},{"t":"Covering half the cost of replacing old windows reduces energy use, but households with limited savings may need assistance adjusted to their income levels.","why":"費用の半分と窓の交換という数字・具体例が残っている。"},{"t":"Subsidizing household energy improvements reduces consumption, but assistance should prioritize tenants because property owners recover all renovation costs through higher rents within several years.","why":"借家人の優先や家賃での全額回収は本文にない。"},{"t":"Home efficiency subsidies reduce energy use, yet support must account for financial disparities to avoid disproportionately benefiting households already able to afford renovations.","why":"正解。省エネ効果と受益の偏りをまとめ、所得差を考慮する条件を残す。"},{"t":"Households with limited savings may struggle to cover remaining renovation expenses, even when public subsidies reduce the amount they must pay for home improvements.","why":"支払いの困難だけを扱い、省エネ効果と所得に応じた支援の必要性が欠けている。"},{"t":"Energy renovation subsidies always transfer public funds exclusively to wealthy homeowners, leaving poorer households unable to obtain any benefit regardless of the assistance provided.","why":"必ず富裕層だけが受益し、支援にかかわらず低所得世帯には恩恵がないというのは言い過ぎ。"}],"answer":3,"point":"省エネ効果と受益の偏りをまとめ、所得差を考慮する条件を残す。","drive":{"ja":"次の段落の要点を英語1文で。住宅の省エネ補助金は消費エネルギーを減らすが、改修できる世帯に恩恵が偏らないよう経済格差を考慮した支援が必要である。","en":"Home efficiency subsidies reduce energy use, yet support must account for financial disparities to avoid disproportionately benefiting households already able to afford renovations."},"level":3},{"id":"p1-summary-005","q":"Researchers increasingly invite members of the public to collect environmental data. Volunteers in one project recorded bird sightings at 40 locations, extending coverage beyond what professional teams could manage. This participation also strengthens public understanding of science. However, inconsistent recording methods may reduce the reliability of findings. Providing clear instructions and checking submitted observations are therefore essential if broader participation is to produce useful evidence.","q_ja":"研究者は環境データの収集に市民を招くようになっている。ある事業ではボランティアが40か所で鳥の目撃を記録し、専門家だけでは難しい範囲を調べた。科学への理解も深まるが、記録方法が不統一だと信頼性が低下するため、明確な指示と観察記録の確認が必要である。","choices":[{"t":"This participation also strengthens public understanding of science, but inconsistent recording methods may reduce the reliability of findings without clear instructions and observation checks.","why":"本文の語句をほぼそのままつなぎ、調査範囲の拡大もまとめていない。"},{"t":"Public involvement broadens environmental research and scientific understanding, provided that consistent guidance and verification safeguard the quality of information collected by volunteers.","why":"正解。調査と理解の広がりを一般化し、品質を確保する条件を付ける。"},{"t":"Volunteers recording bird sightings at 40 locations expand research coverage and scientific understanding, although clear instructions and checks are necessary to ensure reliable findings.","why":"鳥の目撃と40か所という例・数字を残している。"},{"t":"Citizen involvement extends environmental monitoring and scientific understanding, but reliable findings require volunteers to earn professional qualifications before submitting any observations to research teams.","why":"観察記録を提出する前に専門資格を取得する必要があるとは書かれていない。"},{"t":"Citizen observations extend environmental monitoring beyond the reach of professional teams, allowing researchers to gather evidence from more locations through the participation of volunteers.","why":"調査範囲の拡大だけで、科学への理解と記録の品質管理を落としている。"},{"t":"Public participation guarantees comprehensive environmental evidence and universal scientific understanding, removing the need for professional researchers to inspect observations or provide volunteers with guidance.","why":"網羅的な証拠と全員の理解を保証し、点検も指導も不要だという誇張は本文に反する。"}],"answer":1,"point":"調査と理解の広がりを一般化し、品質を確保する条件を付ける。","drive":{"ja":"次の段落の要点を英
