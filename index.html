 school teachers helps young students use the internet wisely.","why":"正解。不可算名詞 advice に helps が対応し、wisely が use を修飾している。"},{"t":"Teachers protect students of online dangers by giving safety advice.","why":"「人を〜から守る」は protect 人 from なので、of を from にする。"},{"t":"Teachers offer students advice about using the internet in a safety way.","why":"way を修飾する形容詞が必要なので、名詞 safety を safe にする。"},{"t":"Teachers share safety tips who help students use the internet wisely.","why":"先行詞の tips は人ではないので、who を which または that にする。"}],"answer":2,"point":"advice は単数扱いの不可算名詞で、safe は形容詞、safety は名詞として使う。","level":1,"drive":{"ja":"先生からの安全に関する助言は、生徒がインターネットを賢く使うのに役立つ。","en":"Safety advice from school teachers helps young students use the internet wisely."},"explain":"主語adviceにhelpsが続き、wiselyが使い方を示す。help＋人＋動詞で教育の効果を説明できる。別の言い方: Teachers' safety advice helps students use the web wisely."},{"id":"g2-error-101","q":"学校の庭で作業する生徒たちは、先生たちから役立つ助言をもらいます。","q_ja":"日本語の意味に合う、誤りのない英文を選びましょう。","choices":[{"t":"The students in the school garden gets helpful advice from teachers.","why":"主語は複数の students なので、gets を get にする。"},{"t":"Teachers give useful advices to students working in the school garden.","why":"advice は数えられない名詞なので、advices を advice にする。"},{"t":"Students working in the school garden get useful advice from teachers.","why":"正解。複数の主語 Students に get が対応し、advice も正しい形で使われている。"},{"t":"Students working in the school garden listen teachers for useful advice.","why":"人の話を聞くときは listen to を使うので、listen の後に to を入れる。"},{"t":"Teachers offer helpfully advice to the students in the school garden.","why":"名詞 advice を説明するので、副詞 helpfully を形容詞 helpful にする。"},{"t":"Students which work in the school garden get useful advice from teachers.","why":"先行詞 Students は人なので、関係代名詞 which を who にする。"}],"answer":2,"point":"長い主語でも中心の名詞を確認する。Students working in the school garden は複数なので get を使う。","level":1,"drive":{"ja":"学校の庭で作業する生徒たちは、先生たちから役立つ助言をもらいます。","en":"Students working in the school garden get useful advice from teachers."},"explain":"対応する正解英文が提示されていないため確定不可。対応問題を確認し、不要な解説なら項目を削除する。"},{"id":"g2-error-102","q":"彼女は、前日に空き瓶を分別したと言いました。","q_ja":"日本語の意味に合う、誤りのない英文を選びましょう。","choices":[{"t":"She said she had sorted much empty bottles the previous day.","why":"bottles は数えられる名詞の複数形なので、much を many にする。"},{"t":"According her, she had sorted empty bottles on the previous day.","why":"「彼女によると」は according to her なので、According の後に to を入れる。"},{"t":"She said she has sorted empty bottles the day before.","why":"過去に話した時点より前の出来事なので、has sorted を had sorted にする。"},{"t":"She said she had careful sorted empty bottles the previous day.","why":"動詞 sorted を説明するので、形容詞 careful を副詞 carefully にする。"},{"t":"She said she had sorted empty bottles the day before.","why":"正解。過去の発言を said、発言の前日に行った分別を had sorted で表している。"},{"t":"She was the person which had sorted empty bottles the previous day.","why":"先行詞 the person は人なので、関係代名詞 which を who にする。"}],"answer":4,"point":"過去の発言より前の出来事は had ＋過去分詞で表す。the day before は「その前日」。","level":1,"drive":{"ja":"彼女は、前日に空き瓶を分別したと言いました。","en":"She said she had sorted empty bottles the day before."},"explain":"対応する正解英文が提示されていないため確定不可。対応問題を確認し、不要な解説なら項目を削除する。"},{"id":"g2-error-103","q":"ドアの近くにある本は、私たちの町について役立つ情報を提供しています。","q_ja":"日本語の意味に合う、誤りのない英文を選びましょう。","choices":[{"t":"Near the door, there are books with useful informations about our town.","why":"information は数えられない名詞なので、informations を information にする。"},{"t":"We can learn for our town from useful books near the door.","why":"「町について学ぶ」は learn about our town なので、for を about にする。"},{"t":"The books beside the door give usefully information about our town.","why":"名詞 information を説明するので、副詞 usefully を形容詞 useful にする。"},{"t":"Books on the shelf near the door gives information about our town.","why":"主語の中心は複数の Books なので、gives を give にする。"},{"t":"The books who are near the door provide information about our town.","why":"先行詞 The books は物なので、関係代名詞 who を which にする。"},{"t":"The books near the door give useful information about our town.","why":"正解。複数の主語 The books に give が対応し、useful information の形も正しい。"}],"answer":5,"point":"information は数えられない名詞なので複数形にしない。「役立つ情報」は useful information。","level":1,"drive":{"ja":"ドアの近くにある本は、私たちの町について役立つ情報を提供しています。","en":"The books near the door give useful information about our town."},"explain":"対応する正解英文が提示されていないため確定不可。対応問題を確認し、不要な解説なら項目を削除する。監査全体の件数：16件（🔴10件、🟡6件）。"}],"ja2en":[{"id":"g2-ja2en-001","q":"私は、学校は生徒にもっと読書を勧めるべきだという意見に賛成です。","q_ja":"日本語の意味に合う英文を選ぶ。","choices":[{"t":"I agree that schools should encourage students to read more.","why":"正解。agree that で、学校が読書を勧めることへの賛成を表している。"},{"t":"I disagree that schools should encourage students to read more.","why":"disagree は反対するという意味で、賛否が逆。"},{"t":"I agree that students should encourage schools to read more.","why":"勧める側と勧められる側が逆。"},{"t":"I agree that schools should encourage students to read less.","why":"less は「より少なく」で、読む量の増減が逆。"},{"t":"I agree that schools should discourage students from reading more.","why":"discourage は思いとどまらせるという意味で、勧めることにならない。"},{"t":"I agree that schools should encourage students read more.","why":"encourage 人 to do の to が抜けている。"}],"answer":0,"point":"I agree that ... で賛成、encourage 人 to do で行動を勧める。","drive":{"ja":"私は、学校は生徒にもっと読書を勧めるべきだという意見に賛成です。","en":"I agree that schools should encourage students to read more."},"level":1,"explain":"Iが主語、agreeが動詞で、that節が賛成の内容。encourage＋人＋to不定詞は、論述で促したい行動を示す。別の言い方: I support schools encouraging students to read more."},{"id":"g2-ja2en-002","q":"私は、すべての宿題をなくすべきだとは思いません。","q_ja":"日本語の意味に合う英文を選ぶ。","choices":[{"t":"I think that all homework should be removed.","why":"否定がなく、すべての宿題をなくすことに賛成している。"},{"t":"I do not think that all homework has already been removed.","why":"すでになくされたかどうかの話で、なくすべきかという判断ではない。"},{"t":"I do not think that all homework should be removed.","why":"正解。I do not think that ... と should で、宿題をすべてなくすべきだという意見への否定を表す。"},{"t":"I do not think that all homework should be increased.","why":"increased は増やされるという意味で、なくすという意味ではない。"},{"t":"I do not think that only some homework should be removed.","why":"only some は一部だけという意味で、すべてという範囲が変わっている。"},{"t":"I do not think that all homework should removed.","why":"受け身の should be removed に必要な be がない。"}],"answer":2,"point":"「〜だとは思わない」は I do not think that ...。","drive":{"ja":"私は、すべての宿題をなくすべきだとは思いません。","en":"I do not think that all homework should be removed."},"level":2,"explain":"Iが主語、do not thinkが判断を否定し、that節が判断の対象。shouldの受け身は、論述で廃止案を検討する型。別の言い方: I think some homework should remain."},{"id":"g2-ja2en-003","q":"オンライン授業は便利ですが、すべての生徒に適しているわけではありません。","q_ja":"日本語の意味に合う英文を選ぶ。","choices":[{"t":"Although online classes are convenient, they suit every student.","why":"すべての生徒に適しているという意味になり、否定が抜けている。"},{"t":"Because online classes are convenient, they do not suit every student.","why":"Because は理由を表し、「便利ですが」という譲歩を示さない。"},{"t":"Although online classes are convenient, no students can attend them.","why":"誰も受講できないという、日本語にない内容になっている。"},{"t":"Although online classes are convenient, they do not suits every student.","why":"do not の後は原形 suit を使う。"},{"t":"Although online classes are inconvenient, they do not suit every student.","why":"inconvenient は不便なという意味で、前半の意味が逆。"},{"t":"Although online classes are convenient, they do not suit every student.","why":"正解。便利さを認めた上で、すべての生徒に合うわけではないと述べている。"}],"answer":5,"point":"Although ... で譲歩を表し、not ... every で部分否定を表す。","drive":{"ja":"オンライン授業は便利ですが、すべての生徒に適しているわけではありません。","en":"Although online classes are convenient, they do not suit every student."},"level":2,"explain":"Although節で利点を認め、主節のtheyは授業を指す。not＋everyの部分否定で、論述に例外を示す。別の言い方: Online classes are handy, but do not suit everyone."},{"id":"g2-ja2en-004","q":"この方法には費用がかかることは確かですが、時間を節約できます。","q_ja":"日本語の意味に合う英文を選ぶ。","choices":[{"t":"It is true that this method saves money, but it takes time.","why":"費用を節約するが時間がかかるという意味で、利点と欠点が逆。"},{"t":"It is true that this method costs money, but it can save time.","why":"正解。費用がかかることを認め、時間を節約できるという利点を続けている。"},{"t":"It is true that this method costs time, but it can save money.","why":"時間がかかるが費用を節約できるという意味で、内容が逆。"},{"t":"It is true that this method costs money, but it cannot save time.","why":"cannot によって、時間を節約できないという意味になっている。"},{"t":"It is true that this method cost money, but it can save time.","why":"単数主語 this method に対する現在形は costs。"},{"t":"It is true that this method costs money because it can save time.","why":"because は理由を表し、「ですが」という対比を示さない。"}],"answer":1,"point":"It is true that ..., but ... で事実を認めた上で別の論点を述べる。","drive":{"ja":"この方法には費用がかかることは確かですが、時間を節約できます。","en":"It is true that this method costs money, but it can save time."},"level":2,"explain":"Itは形式主語でthat節が内容、butで対比する。cost moneyとsave timeで、論述の費用と効果を比較できる。別の言い方: This method has a cost, but it can save time."},{"id":"g2-ja2en-005","q":"公共交通機関が安くなれば、より多くの人がそれを利用するでしょう。","q_ja":"日本語の意味に合う英文を選ぶ。","choices":[{"t":"If public transportation becomes cheaper, fewer people will use it.","why":"fewer people はより少ない人という意味で、増減が逆。"},{"t":"If public transportation becomes more expensive, more people will use it.","why":"more expensive はより高くという意味で、条件が逆。"},{"t":"If public transportation becomes cheaper, more people will avoid it.","why":"avoid は避けるという意味で、利用するという意味ではない。"},{"t":"If public transportation will become cheaper, more people will use it.","why":"この未来の条件を表す if 節では、will become ではなく becomes を使う。"},{"t":"If public transportation becomes cheaper, more people will use it.","why":"正解。料金が下がるという条件と、利用者が増えるという予想を示している。"},{"t":"If public transportation becomes cheaper, more people used it.","why":"used は過去形で、将来の予想を示していない。"}],"answer":4,"point":"未来の条件は If＋現在形、予想する結果は will＋動詞の原形。","drive":{"ja":"公共交通機関が安くなれば、より多くの人がそれを利用するでしょう。","en":"If public transportation becomes cheaper, more people will use it."},"level":2,"explain":"If節が条件、主節が利用者増の予測。条件節の現在形と主節のwillで、論述に施策の効果を示す。別の言い方: Lower fares will lead more people to use public transportation."},{"id":"g2-ja2en-006","q":"運動は健康を保つのに役立つので、学校は生徒に運動を勧めるべきです。","q_ja":"日本語の意味に合う英文を選ぶ。","choices":[{"t":"Schools should encourage students to exercise although it helps them stay healthy.","why":"although は譲歩で、健康に役立つことを理由として示していない。"},{"t":"Students should encourage schools to exercise because it helps them stay healthy.","why":"勧める側と勧められる側が逆。"},{"t":"Schools should discourage students from exercising because it helps them stay healthy.","why":"discourage は思いとどまらせるという意味で、勧めるという意味ではない。"},{"t":"Schools should encourage students to exercise because it helps them stay healthy.","why":"正解。because の後に、運動を勧める理由を示している。"},{"t":"Schools should encourage students to exercise because it prevents them from staying healthy.","why":"prevents them from staying healthy は健康を保つのを妨げるという意味で、理由が逆。"},{"t":"Schools should encourage students to exercise because it help them stay healthy.","why":"主語 it に対する現在形は helps。"}],"answer":3,"point":"主張の後に because＋理由を置くと、主張の根拠を示せる。","drive":{"ja":"運動は健康を保つのに役立つので、学校は生徒に運動を勧めるべきです。","en":"Schools should encourage students to exercise because it helps them stay healthy."},"level":1,"explain":"Schoolsが主語、because節が理由。help＋人＋原形は論述で効果を示す型。別の言い方: Schools should promote exercise because it keeps students healthy."},{"id":"g2-ja2en-007","q":"例えば、生徒は昼休みに図書館で本を借りることができます。","q_ja":"日本語の意味に合う英文を選ぶ。","choices":[{"t":"For example, students can borrow books from the library during their lunch break.","why":"正解。例示、図書館から借りる行為、昼休みという時を正しく表している。"},{"t":"For example, students can lend books to the library during their lunch break.","why":"lend ... to ... は貸すという意味で、図書館から借りるという意味ではない。"},{"t":"For example, students cannot borrow books from the library during their lunch break.","why":"cannot によって借りられないという意味になっている。"},{"t":"In conclusion, students can borrow books from the library during their lunch break.","why":"In conclusion は結論を示す表現で、「例えば」ではない。"},{"t":"For example, students can buy books from the library during their lunch break.","why":"buy は買うという意味で、借りるという意味ではない。"},{"t":"For example, students can borrowed books from the library during their lunch break.","why":"can の後は原形 borrow を使う。"}],"answer":0,"point":"For example, ... で例を示し、borrow ... from ... で借りる相手や場所を示す。","drive":{"ja":"例えば、生徒は昼休みに図書館で本を借りることができます。","en":"For example, students can borrow books from the library during their lunch break."},"level":1,"explain":"studentsが主語、can borrowが述語。For exampleで論述の根拠を具体化する。別の言い方: For instance, students can borrow library books at lunchtime."},{"id":"g2-ja2en-008","q":"このような活動を通して、若者は地域社会について学ぶことができます。","q_ja":"日本語の意味に合う英文を選ぶ。","choices":[{"t":"Without such activities, young people can learn about their local communities.","why":"Without は「〜なしで」で、「〜を通して」ではない。"},{"t":"Through such activities, young people can teach their local communities about young people.","why":"地域社会に若者について教えるという意味で、学ぶ主体と内容が変わっている。"},{"t":"Through such activities, young people can learn about their local communities.","why":"正解。活動を通して、地域社会について学べることを表している。"},{"t":"Through such activities, young people cannot learn about their local communities.","why":"cannot によって学べないという意味になっている。"},{"t":"Through such activities, young people can learn their local communities.","why":"地域社会について学ぶという意味には learn about の about が必要。"},{"t":"Before such activities, young people can learn about their local communities.","why":"Before は「〜の前に」で、活動を通して学ぶという意味ではない。"}],"answer":2,"point":"Through＋名詞で「〜を通して」、learn about ... で「〜について学ぶ」。","drive":{"ja":"このような活動を通して、若者は地域社会について学ぶことができます。","en":"Through such activities, young people can learn about their local communities."},"level":1,"explain":"Through句が手段、young peopleが主語。suchで前述の活動を受け、要約をつなぐ。別の言い方: Such activities help young people learn about their communities."},{"id":"g2-ja2en-009","q":"これらの二つの理由から、私は都市にはもっと公園が必要だと考えます。","q_ja":"日本語の意味に合う英文を選ぶ。","choices":[{"t":"For these two reasons, I believe that cities need fewer parks.","why":"fewer parks はより少ない公園という意味で、増やす必要性を示していない。"},{"t":"For these two reasons, I do not believe that cities need more parks.","why":"do not believe によって結論の賛否が逆になっている。"},{"t":"For these two reasons, I believe that parks need more cities.","why":"都市と公園の関係が逆。"},{"t":"For these two reasons, I believe that cities needs more parks.","why":"複数主語 cities に対する現在形は need。"},{"t":"Despite these two reasons, I believe that cities need more parks.","why":"Despite は「〜にもかかわらず」で、理由に基づく結論を示さない。"},{"t":"For these two reasons, I believe that cities need more parks.","why":"正解。二つの理由を受け、都市にもっと公園が必要だという結論を述べている。"}],"answer":5,"point":"For these two reasons, ... は二つの理由を受けて結論を示す型。","drive":{"ja":"これらの二つの理由から、私は都市にはもっと公園が必要だと考えます。","en":"For these two reasons, I believe that cities need more parks."},"level":1,"explain":"Iが主語、believeが動詞、that節が意見。For these two reasonsで論述を締める。別の言い方: These two reasons show why I think cities need more parks."},{"id":"g2-ja2en-010","q":"結論として、私たちは食品の無駄を減らすために行動すべきです。","q_ja":"日本語の意味に合う英文を選ぶ。","choices":[{"t":"For example, we should take action to reduce food waste.","why":"For example は例示で、結論を示す表現ではない。"},{"t":"In conclusion, we should take action to reduce food waste.","why":"正解。結論として、食品の無駄を減らすための行動を提案している。"},{"t":"In conclusion, we should take action to increase food waste.","why":"increase は増やすという意味で、目的が逆。"},{"t":"In conclusion, we should avoid taking action to reduce food waste.","why":"avoid taking action は行動を避けるという意味で、提案が逆。"},{"t":"In conclusion, we should take action to reducing food waste.","why":"目的を表す不定詞の to の後は原形 reduce を使う。"},{"t":"In conclusion, we should take action because food waste has already disappeared.","why":"食品の無駄がすでになくなったからという、日本語にない理由を加えている。"}],"answer":1,"point":"In conclusion, ... で結論を導き、take action to do で行動の目的を示す。","drive":{"ja":"結論として、私たちは食品の無駄を減らすために行動すべきです。","en":"In conclusion, we should take action to reduce food waste."},"level":1,"explain":"weが主語、should takeが述語でto不定詞が目的。In conclusionで提言を結論に置く。別の言い方: To conclude, we should act to cut food waste."},{"id":"g2-ja2en-201","q":"制服は高価だが、多くの親は制服を支持している。","q_ja":"制服は高価だが、多くの親は制服を支持している。","choices":[{"t":"Many parents support school uniforms because they are expensive.","why":"高価であることを支持の理由にしており、譲歩の関係を表していない。"},{"t":"School uniforms are expensive because many parents support wearing them.","why":"親の支持が制服の高い価格の原因だという因果関係を加えている。"},{"t":"Although school uniforms are expensive, many parents still support them.","why":"正解。高価だという難点を認めながら、親が支持していることを述べている。"},{"t":"If school uniforms become expensive, many parents will support them.","why":"現在の譲歩を、価格が上がった場合の条件と結果に変えている。"},{"t":"Many parents support school uniforms to make them more expensive.","why":"制服の価格を上げることが支持の目的になっている。"},{"t":"School uniforms remain expensive despite the support of many parents.","why":"譲歩の中心が、親の支持があっても価格が高いという内容に変わっている。"}],"answer":2,"point":"「難点はあるが支持する」は、難点を譲歩の節に、支持を主節に置く。","level":1,"drive":{"ja":"制服は高価だが、多くの親は制服を支持している。","en":"Although school uniforms are expensive, many parents still support them."},"explain":"Although節で譲歩し、主語parentsと動詞supportで主張する。stillは難点があっても支持する姿勢を示し、反論への応答に使える。別の言い方: Despite the cost, parents like uniforms."},{"id":"g2-ja2en-202","q":"在宅勤務によって通勤時間が減るので、働く人は家族とより多くの時間を過ごせる。","q_ja":"在宅勤務によって通勤時間が減るので、働く人は家族とより多くの時間を過ごせる。","choices":[{"t":"Workers spend less time commuting because they have more time with their families at home.","why":"家族との時間が増えることを通勤時間が減る原因にしており、因果の向きが逆。"},{"t":"Working from home saves commuting time because workers want more time with their families.","why":"家族との時間を望む気持ちが通勤時間を節約する原因になっており、原文と異なる。"},{"t":"Workers save commuting time at home so that their families can start working there too.","why":"通勤時間の節約の目的を家族も在宅勤務を始めることに変えている。"},{"t":"Although working from home saves commuting time, workers can spend more time with their families.","why":"通勤時間の節約と家族との時間の増加を、因果ではなく譲歩の関係にしている。"},{"t":"If workers spent more time with their families, working from home would save commuting time.","why":"家族との時間を条件、通勤時間の節約を結果にした仮定に変えている。"},{"t":"Since working from home reduces commuting time, workers can spend more time with their families.","why":"正解。通勤時間の減少を原因、その分家族と過ごせることを結果としている。"}],"answer":5,"point":"原因を表す節には通勤時間の減少を置き、主節で家族と過ごせるという結果を述べる。","level":2,"drive":{"ja":"在宅勤務によって通勤時間が減るので、働く人は家族とより多くの時間を過ごせる。","en":"Since working from home reduces commuting time, workers can spend more time with their families."},"explain":"Since節は在宅勤務によって通勤時間が減るという原因を示す。主節のcan spendは、その結果として家族と過ごす時間を増やせることを表す。別の言い方: Working from home cuts commuting time, allowing workers to spend more time with their families."},{"id":"g2-ja2en-203","q":"もし今この町にもっと公園があれば、住民は屋外でより気軽に運動できるだろう。","q_ja":"もし今この町にもっと公園があれば、住民は屋外でより気軽に運動できるだろう。","choices":[{"t":"If this town had had more parks, residents could have exercised outdoors more easily in the past.","why":"過去に公園がもっとあった場合という仮定で、今の状況についての仮定ではない。"},{"t":"If this town had more parks now, residents would find it easier to exercise outdoors regularly.","why":"正解。現在の事実と異なる仮定を過去形で表し、運動しやすくなるという結果を述べている。"},{"t":"If residents found it easier to exercise outdoors now, this town would have more public parks.","why":"運動のしやすさを条件、公園の多さを結果にしており、条件と結果が逆。"},{"t":"Because this town now has more parks, residents find it easier to exercise outdoors every day.","why":"公園が実際に増えたという事実とその結果を述べており、仮定になっていない。"},{"t":"Even if this town had more parks now, residents would still find outdoor exercise quite difficult.","why":"公園が増えても運動は難しいという譲歩に変え、想定される結果も変えている。"},{"t":"This town would have more parks now if residents had exercised outdoors more often last year.","why":"昨年の運動が今の公園の数を決めるという、原文にない過去の条件を加えている。"}],"answer":1,"point":"今の事実と異なる仮定は、条件節の過去形と主節の助動詞の過去形で表す。","level":3,"drive":{"ja":"もし今この町にもっと公園があれば、住民は屋外でより気軽に運動できるだろう。","en":"If this town had more parks now, residents would find it easier to exercise outdoors regularly."},"explain":"If節で今の仮定、主節で住民への効果を述べる。find it easier toは行動のしやすさを示し、改善案の評価に使える。別の言い方: More parks would make outdoor exercise easier."},{"id":"g2-ja2en-204","q":"紙の本は重い一方で、電子書籍は持ち運びやすい。","q_ja":"紙の本は重い一方で、電子書籍は持ち運びやすい。","choices":[{"t":"Paper books are heavy because electronic books are easy to carry.","why":"二つの特徴の対比を、紙の本が重い理由に変えている。"},{"t":"Electronic books are easy to carry to make paper books lighter.","why":"持ち運びやすさの目的が紙の本を軽くすることになっている。"},{"t":"Paper books become heavy when electronic books are easy to carry.","why":"紙の本が重くなる条件を述べており、特徴の対比ではない。"},{"t":"Carrying heavy paper books makes electronic books easier to carry around.","why":"紙の本を運ぶ行為が電子書籍の持ち運びを容易にするという因果関係に変えている。"},{"t":"Paper books are heavy, while electronic books are easy to carry.","why":"正解。紙の本の重さと電子書籍の持ち運びやすさを対比している。"},{"t":"Heavy paper books are carried as easily as electronic books today.","why":"両者が同じくらい持ち運びやすいという比較に変わっている。"}],"answer":4,"point":"二つの異なる特徴を対比するときは、接続詞で二つの節をつなぐ。","level":1,"drive":{"ja":"紙の本は重い一方で、電子書籍は持ち運びやすい。","en":"Paper books are heavy, while electronic books are easy to carry."},"explain":"主語booksにareを続け、whileで二つの特徴を対比する。easy to carryは携帯性を表し、選択肢の比較に使える。別の言い方: Paper books are heavy, but e-books are portable."},{"id":"g2-ja2en-205","q":"公共交通機関の改善は、高齢者が病院に行くのをより容易にする。","q_ja":"公共交通機関の改善は、高齢者が病院に行くのをより容易にする。","choices":[{"t":"Improving public transport makes it easier for older people to get to the hospital.","why":"正解。改善することを動名詞で主語にし、病院への移動が容易になるという効果を述べている。"},{"t":"Older people getting to the hospital makes it easier to improve public transport services.","why":"高齢者が病院に行くことが交通機関の改善を容易にするという、逆の関係になっている。"},{"t":"Public transport improves because older people find it easier to get to the hospital.","why":"病院に行きやすいことを交通機関が改善する原因にしている。"},{"t":"To improving public transport makes it easier for older people to reach the hospital.","why":"主語の形が誤り。不定詞の形にするなら動詞の原形を用い、動名詞なら前の前置詞を除く。"},{"t":"Improving hospitals makes it easier for older people to travel on public transport nearby.","why":"改善の対象が病院に変わり、交通機関の利用を容易にするという別の内容になっている。"},{"t":"Older people improve public transport so that hospital staff can travel around more easily.","why":"高齢者を改善の実行者にし、移動しやすくなる対象も病院職員に変えている。"}],"answer":0,"point":"「改善すること」を動名詞で主語にすると、行為とその効果を一文で述べられる。","level":2,"drive":{"ja":"公共交通機関の改善は、高齢者が病院に行くのをより容易にする。","en":"Improving public transport makes it easier for older people to get to the hospital."},"explain":"動名詞句が主語、makesが動詞で、itは後の不定詞を受ける。forは行動する人を示し、改善の受益者を明示できる。別の言い方: Better transit helps seniors reach the hospital."},{"id":"g2-ja2en-206","q":"学校は、オンラインで学ぶ生徒を支援するために、放課後も図書館を開けておくべきだ。","q_ja":"学校は、オンラインで学ぶ生徒を支援するために、放課後も図書館を開けておくべきだ。","choices":[{"t":"Schools should help students learn online so that school libraries can stay open after regular classes end.","why":"図書館の開館を支援の目的にしており、手段と目的が逆になっている。"},{"t":"Schools should keep libraries open to help students who only begin learning online after regular classes end.","why":"放課後という修飾を開館ではなくオンライン学習を始める時に結び付け、限定も加えている。"},{"t":"Students who learn online should help schools keep their libraries open after the end of regular classes.","why":"支援を受ける生徒が学校を助ける側に変わり、行為者と対象が逆になっている。"},{"t":"Schools should keep libraries open after classes to support students who do their learning online.","why":"正解。放課後は開館する時間を修飾し、オンラインで学ぶという節は支援対象の生徒を修飾する。"},{"t":"Schools should support students who keep libraries open after classes so that other students can learn online.","why":"支援対象を図書館の開館を手伝う生徒に変え、別の生徒の学習を目的としている。"},{"t":"Schools should keep libraries open after classes because students who learn online already support their school libraries.","why":"開館の目的を、生徒が既に図書館を支えているという理由に置き換えている。"}],"answer":3,"point":"時間を表す語句がどの動作にかかるかと、関係詞の節がどの名詞を説明するかを確認する。","level":3,"drive":{"ja":"学校は、オンラインで学ぶ生徒を支援するために、放課後も図書館を開けておくべきだ。","en":"Schools should keep libraries open after classes to support students who do their learning online."},"explain":"Schoolsが主語、who節は生徒を修飾、to以下は目的。keep＋目的語＋形容詞で開館継続を提案する。別の言い方: Libraries should stay open after class for online learners."},{"id":"g2-ja2en-207","q":"これらの理由から、町はもっとバスを走らせるべきだ。","q_ja":"これらの理由から、町はもっとバスを走らせるべきだ。","choices":[{"t":"Running more buses should give the town reasons to act.","why":"バスを増やすことが理由を生むという内容で、既に示した理由から結論を出していない。"},{"t":"The town runs more buses to explain these reasons clearly.","why":"理由を説明するためにバスを運行するという目的の文に変わっている。"},{"t":"These reasons exist because the town already runs more buses.","why":"バスの増便を理由が存在する原因にしており、論理の向きが逆。"},{"t":"If the town runs more buses, these reasons will appear.","why":"増便を条件、理由が生じることを結果とした文に変わっている。"},{"t":"Despite these reasons, the town should still run more buses.","why":"示した理由に逆らって増便を勧めており、理由に基づく結論ではない。"},{"t":"For these reasons, the town should run more buses.","why":"正解。示した理由を根拠として、町への提案を結論にしている。"}],"answer":5,"point":"結論では「これらの理由から」に続けて、理由が支える提案を述べる。","level":1,"drive":{"ja":"これらの理由から、町はもっとバスを走らせるべきだ。","en":"For these reasons, the town should run more buses."},"explain":"冒頭で根拠を受け、主語townにshould runを続ける。shouldは提言を表し、論述の結論に使える。別の言い方: Therefore, the town should increase bus services."},{"id":"g2-ja2en-208","q":"運動が健康に良いことは確かだが、学校は生徒に休む時間も与えるべきだ。","q_ja":"運動が健康に良いことは確かだが、学校は生徒に休む時間も与えるべきだ。","choices":[{"t":"Schools should give students time to rest because exercise certainly helps them stay healthy.","why":"運動の健康効果を休む時間が必要な理由としており、譲歩の関係を表していない。"},{"t":"Exercise certainly helps students stay healthy although schools should give them time to rest.","why":"譲歩の範囲が逆で、休息の必要性を認めつつ運動の効果を主張する文になっている。"},{"t":"Although exercise certainly benefits health, schools should also give their students time to rest.","why":"正解。運動の効果を認めた上で、休む時間も必要だという提案を主節で述べている。"},{"t":"Schools should give students time to rest so that exercise becomes better for health.","why":"運動の健康効果を高めることが休息の目的になっており、原文にない関係を加えている。"},{"t":"If schools gave students time to rest, exercise would certainly become good for health.","why":"休息を条件にして初めて運動が健康に良くなるという仮定に変えている。"},{"t":"Schools certainly benefit from exercise although their students should also have time to rest.","why":"運動の効果を受ける対象が健康から学校に変わり、譲歩と主張の範囲も逆になっている。"}],"answer":2,"point":"譲歩では、認める事実を従属節に置き、最も伝えたい提案を主節に置く。","level":2,"drive":{"ja":"運動が健康に良いことは確かだが、学校は生徒に休む時間も与えるべきだ。","en":"Although exercise certainly benefits health, schools should also give their students time to rest."},"explain":"Although節で利点を認め、主語schoolsの主節で提案する。give＋人＋物は提供を表し、休息の保障を論じられる。別の言い方: Exercise is healthy, but schools should allow rest."},{"id":"g2-ja2en-209","q":"もし昨年その工場が排水を処理していたら、川の魚はもっと多く生き残っていただろう。","q_ja":"もし昨年その工場が排水を処理していたら、川の魚はもっと多く生き残っていただろう。","choices":[{"t":"If the factory treated its waste water now, more fish in the river would survive next year.","why":"今の処理と来年の生存を結ぶ仮定で、昨年についての実現しなかった仮定ではない。"},{"t":"If more fish had survived in the river last year, the factory would have treated its waste water.","why":"魚の生存を条件、排水処理を結果にしており、条件と結果が逆になっている。"},{"t":"Because the factory treated its waste water last year, more fish in the river were able to survive.","why":"排水処理と魚の生存を実際に起きた事実として述べており、過去の仮定ではない。"},{"t":"The factory would have treated its waste water last year so that more river fish could survive.","why":"排水処理を仮定の結果にし、魚の生存を目的にしており、条件と結果の構造が異なる。"},{"t":"If the factory had treated its waste water last year, more fish in the river would have survived.","why":"正解。昨年の事実と異なる条件と、その場合に実現したであろう結果を表している。"},{"t":"Even if the factory had treated its waste water last year, fewer fish in the river would have survived.","why":"処理しても魚の生存数は少なかったという譲歩に変わり、想定される効果も異なる。"}],"answer":4,"point":"過去の事実と異なる仮定では、条件節を過去完了にし、結果も過去について述べる。","level":3,"drive":{"ja":"もし昨年その工場が排水を処理していたら、川の魚はもっと多く生き残っていただろう。","en":"If the factory had treated its waste water last year, more fish in the river would have survived."},"explain":"If節はhad＋過去分詞、主節はwould have＋過去分詞。過去の反実仮想で条件と結果を結び、対策の効果を検証できる。別の言い方: Treating the wastewater would have saved more fish."},{"id":"g2-ja2en-210","q":"食品の無駄を減らすことは、学校の節約に役立つ。","q_ja":"食品の無駄を減らすことは、学校の節約に役立つ。","choices":[{"t":"Saving money on meals helps schools reduce their food waste.","why":"食費の節約が食品の無駄の削減を助けるという内容で、原因と効果の向きが逆。"},{"t":"Reducing food waste helps schools save money on their meals.","why":"正解。食品の無駄を減らす行為を主語にして、学校の節約という効果を述べている。"},{"t":"Schools saving money is the main cause of food waste.","why":"学校の節約が食品の無駄を生む原因だという、別の因果関係になっている。"},{"t":"Reduce food waste helps schools save money on their meals.","why":"動詞の原形をそのまま主語にしているため、「減らすこと」を表す動名詞などが必要。"},{"t":"Food waste helps schools decide how to save money.","why":"無駄を減らす行為ではなく、無駄そのものが節約方法の判断に役立つという意味になっている。"},{"t":"Schools save money so that they can reduce food waste.","why":"節約を手段、食品の無駄の削減を目的にしており、原文の関係が逆。"}],"answer":1,"point":"動作を「〜すること」という主語にするときは動名詞を使い、その後に効果を続ける。","level":1,"drive":{"ja":"食品の無駄を減らすことは、学校の節約に役立つ。","en":"Reducing food waste helps schools save money on their meals."},"explain":"動名詞句が主語、helpsが動詞で、schoolsがsaveの動作主。help＋人＋動詞原形は支援効果を表し、施策の利点を示せる。別の言い方: Less food waste cuts school meal costs."},{"id":"g2-ja2en-211","q":"リサイクルには時間がかかるが、環境を守るのに役立つ。","q_ja":"リサイクルには時間がかかるが、環境を守るのに役立つ。","choices":[{"t":"Recycling takes time because it helps to protect the environment.","why":"環境保護に役立つことを、時間がかかる原因にしている。"},{"t":"Although recycling takes time, it helps protect the environment.","why":"正解。時間がかかる点を認めたうえで、環境への利点を述べている。"},{"t":"Protecting the environment takes time although it helps with recycling.","why":"時間がかかる対象と、役立つ活動の関係が逆になっている。"},{"t":"Recycling helps protect the environment only when it takes time.","why":"時間がかかる場合に限るという条件を加えている。"},{"t":"Taking time to protect the environment helps people recycle.","why":"環境を守るために時間を使うことが、リサイクルを助ける意味になる。"},{"t":"Recycling takes time so that people can protect the environment.","why":"時間がかかることを、環境を守るための目的と結び付けている。"}],"answer":1,"point":"譲歩は「不都合はあるが利点もある」という関係を表す。","level":1,"drive":{"ja":"リサイクルには時間がかかるが、環境を守るのに役立つ。","en":"Although recycling takes time, it helps protect the environment."},"explain":"Although節で難点を示し、主節のitは活動を指す。help＋原形で効果を述べ、利点の論証に使う。別の言い方: Recycling is time-consuming but helps protect the environment."},{"id":"g2-ja2en-212","q":"在宅勤務によって通勤が減るため、働く人は家族と過ごす時間を増やせる。","q_ja":"在宅勤務によって通勤が減るため、働く人は家族と過ごす時間を増やせる。","choices":[{"t":"Workers spend more time with their families, which makes working from home reduce commuting.","why":"家族との時間が増えることを、在宅勤務が通勤を減らす原因にしている。"},{"t":"Working from home reduces commuting because workers already spend more time with their families.","why":"家族との時間が多いことを、通勤が減る原因にしている。"},{"t":"Workers can reduce commuting so that their families spend more time working from home.","why":"在宅勤務をする主体が家族になり、目的と結果も変わっている。"},{"t":"Although working from home reduces commuting, workers can spend more time with their families.","why":"原因と結果の関係を、譲歩の関係として結んでいる。"},{"t":"Because working from home reduces commuting, workers can spend more time with their families.","why":"正解。在宅勤務による通勤の減少を、家族との時間が増える理由としている。"},{"t":"Working from home gives workers more family time only if their families reduce commuting.","why":"家族自身が通勤を減らすことを条件にしている。"}],"answer":4,"point":"原因を述べる節と、その結果を述べる主節の向きを確認する。","level":2,"drive":{"ja":"在宅勤務によって通勤が減るため、働く人は家族と過ごす時間を増やせる。","en":"Because working from home reduces commuting, workers can spend more time with their families."},"explain":"Because節は在宅勤務による通勤の減少を原因として示す。spend＋時間＋with＋人は、その人と時間を過ごすことを表す。別の言い方: By reducing commuting, working from home allows workers to spend more time with their families."},{"id":"g2-ja2en-213","q":"仮に今、町にもっと公園があれば、住民は家の近くでより頻繁に運動できるだろう。","q_ja":"仮に今、町にもっと公園があれば、住民は家の近くでより頻繁に運動できるだろう。","choices":[{"t":"If the town had more parks now, residents could exercise near their homes more often.","why":"正解。現在の仮定を had で表し、その場合に可能になることを could で述べている。"},{"t":"If the town had had more parks before, residents could have exercised near their homes more often.","why":"過去に公園がもっとあった場合という仮定になっている。"},{"t":"Residents could exercise near their homes more often now if they had built more parks before.","why":"住民が以前に公園を造ったことを条件にしており、現在の公園の数という条件からずれている。"},{"t":"If residents exercised near their homes more often now, the town could have more parks.","why":"住民の運動を条件に、公園が増えるという逆の関係を述べている。"},{"t":"The town could have more parks now so that residents had exercised near their homes more often.","why":"現在の目的を表す節に過去完了を置き、時の関係を誤っている。"},{"t":"If the town has more parks next year, residents will exercise near their homes more often.","why":"来年起こり得る条件と結果を述べ、現在の事実に反する仮定を表していない。"}],"answer":0,"point":"現在の事実とは異なる仮定は、条件節の過去形と主節の could などで表す。","level":3,"drive":{"ja":"仮に今、町にもっと公園があれば、住民は家の近くでより頻繁に運動できるだろう。","en":"If the town had more parks now, residents could exercise near their homes more often."},"explain":"If節で現在を仮定し、主節で結果を述べる。hadとcouldを組み合わせ、改善効果を論じる。別の言い方: With more parks, residents could exercise close to home more often."},{"id":"g2-ja2en-214","q":"オンライン授業は時間を節約する一方、教室での授業は話し合いをしやすくする。","q_ja":"オンライン授業は時間を節約する一方、教室での授業は話し合いをしやすくする。","choices":[{"t":"Online classes save time because classroom lessons make discussions easier.","why":"二つの利点を対比せず、一方を他方の原因にしている。"},{"t":"Classroom discussions save time while online lessons make classes easier.","why":"時間を節約するものと、容易になるものが日本語と異なる。"},{"t":"Online classes save time by making discussions easier in classrooms.","why":"教室での話し合いを容易にすることを、オンライン授業の手段にしている。"},{"t":"Online classes save time, while classroom lessons make discussions easier.","why":"正解。オンライン授業と教室での授業の利点を対比している。"},{"t":"Classroom lessons make discussions easier after online classes save time.","why":"対比ではなく、オンライン授業の後という時間の順序を表している。"},{"t":"Online classes save classroom time so that lessons need less discussion.","why":"話し合いを減らすという目的を加え、教室での授業の利点を述べていない。"}],"answer":3,"point":"二つの方法の違いは while を使って一文で対比できる。","level":1,"drive":{"ja":"オンライン授業は時間を節約する一方、教室での授業は話し合いをしやすくする。","en":"Online classes save time, while classroom lessons make discussions easier."},"explain":"whileで二つの主語と動詞を対比する。make＋目的語＋形容詞で効果を示し、授業方法を比較する。別の言い方: Online classes save time, but in-person classes aid discussion."},{"id":"g2-ja2en-215","q":"学校での食品廃棄を減らすことは、子どもが食べ物の大切さを学ぶのに役立つ。","q_ja":"学校での食品廃棄を減らすことは、子どもが食べ物の大切さを学ぶのに役立つ。","choices":[{"t":"Schools that reduce food waste help children who already understand the importance of food.","why":"食べ物の大切さをすでに理解している子どもを助ける意味で、理解を促すという結果を表していない。"},{"t":"Learning the importance of food helps children reduce the amount of waste at school.","why":"食べ物の大切さを学ぶことを原因にしており、因果の向きが逆である。"},{"t":"Reducing food waste at school is helped by children learning the importance of food.","why":"子どもの学びが食品廃棄の削減を助けるという受け身で、因果の向きが逆である。"},{"t":"The reduce of food waste at school helps children learn the importance of food.","why":"冠詞の後に動詞の原形を置いており、行動を表す名詞句になっていない。"},{"t":"Reducing food waste at school helps children who already teach the importance of food.","why":"子どもが学ぶという結果ではなく、すでに教えている子どもへの援助を表している。"},{"t":"Reducing food waste at school helps children learn the importance of food.","why":"正解。食品廃棄を減らす行動を主語とし、子どもの学びにつながることを述べている。"}],"answer":5,"point":"動名詞句を主語にすると、行動そのものを一つの事柄として述べられる。","level":2,"drive":{"ja":"学校での食品廃棄を減らすことは、子どもが食べ物の大切さを学ぶのに役立つ。","en":"Reducing food waste at school helps children learn the importance of food."},"explain":"Reducing以下が主語、helpsが動詞。help＋人＋原形で学びへの効果を示し、教育上の利点を論じる。別の言い方: Cutting school food waste teaches children to value food."},{"id":"g2-ja2en-216","q":"公共交通機関は常に便利とは限らないが、車を持たない人にとっては重要である。","q_ja":"公共交通機関は常に便利とは限らないが、車を持たない人にとっては重要である。","choices":[{"t":"Although public transportation is not always convenient, people who use it do not have cars.","why":"車を持たない人にとって重要だという主張が、利用者は車を持たないという説明に変わっている。"},{"t":"Public transportation is important when it is inconvenient for people who do not own cars.","why":"便利でない場合を重要である条件にしており、譲歩の範囲が変わっている。"},{"t":"Although public transportation is not always convenient, it is important for people who do not own cars.","why":"正解。便利さの限界を認めながら、車を持たない人にとっての重要性を述べている。"},{"t":"Public transportation is not always convenient for people who think owning a car is important.","why":"重要だと考えられる対象が車の所有になり、日本語の主張を表していない。"},{"t":"Although people without cars are not always important, public transportation is convenient for them.","why":"譲歩する内容が人の重要性になり、便利さと重要性のかかる先を取り違えている。"},{"t":"Public transportation is important because people without cars do not always find it convenient.","why":"便利とは限らないことを重要性の理由にしており、譲歩を因果に変えている。"}],"answer":2,"point":"not always は「常にそうとは限らない」を表し、who 以下は直前の人を説明する。","level":3,"drive":{"ja":"公共交通機関は常に便利とは限らないが、車を持たない人にとっては重要である。","en":"Although public transportation is not always convenient, it is important for people who do not own cars."},"explain":"Although節は譲歩、主節は主張。not alwaysで留保し、提言に使う。別の言い方: Public transport can be inconvenient but is vital to people without cars."},{"id":"g2-ja2en-217","q":"こうした理由から、学校は生徒に本を読むよう勧めるべきだ。","q_ja":"こうした理由から、学校は生徒に本を読むよう勧めるべきだ。","choices":[{"t":"For these reasons, schools should encourage students to read books.","why":"正解。すでに挙げた理由から、学校が取るべき行動を結論として述べている。"},{"t":"Schools should explain these reasons after students encourage others to read.","why":"学校が勧めるという結論が、生徒の行動後に理由を説明する意味に変わっている。"},{"t":"Schools should encourage these reasons so that students read more books.","why":"encourage の目的語が理由になり、生徒に読書を勧める構造になっていない。"},{"t":"Students should read books to explain why schools need encouragement.","why":"生徒が本を読む目的を述べ、学校が読書を勧めるという結論を表していない。"},{"t":"Students should explain these reasons for reading books to their schools.","why":"読書の理由を生徒が学校に説明する主張で、学校が生徒に読書を勧める結論ではない。"},{"t":"Schools should encourage reading only when students give these reasons.","why":"生徒が理由を挙げた場合だけという条件を加えている。"}],"answer":0,"point":"理由を受けた結論は For these reasons の後に主張を置く。","level":1,"drive":{"ja":"こうした理由から、学校は生徒に本を読むよう勧めるべきだ。","en":"For these reasons, schools should encourage students to read books."},"explain":"schoolsが主語、shouldで提言する。encourage＋人＋to不定詞で行動を促し、結論に使う。別の言い方: Therefore, schools should promote reading among students."},{"id":"g2-ja2en-218","q":"図書館は、自宅に静かな場所がない生徒に、勉強できる場所を提供する。","q_ja":"図書館は、自宅に静かな場所がない生徒に、勉強できる場所を提供する。","choices":[{"t":"Libraries offer quiet homes to students who need a place where they can study.","why":"図書館が提供するものを、勉強場所ではなく静かな家にしている。"},{"t":"Students provide libraries with places to study when their homes are not quiet.","why":"勉強場所を提供する側が生徒になり、受け取る側との関係が逆である。"},{"t":"Libraries offer students places where quiet homes need more space for them to study.","why":"場所を説明する節の主語が静かな家になり、自宅で静かな場所を持たない生徒を表していない。"},{"t":"Libraries provide places to study at home for students who need a quiet library.","why":"提供する場所を自宅内に置き、生徒が必要とする場所も図書館に変えている。"},{"t":"Libraries provide places to study for students who have no quiet space at home.","why":"正解。自宅に静かな場所がないという説明を生徒にかけ、図書館の役割を述べている。"},{"t":"Libraries where students have no quiet space at home provide places for them to study.","why":"生徒を限定するはずの説明を where で図書館に結び付け、場所の関係を誤っている。"}],"answer":4,"point":"who 以下が説明する人と、where 以下が説明する場所を区別する。","level":2,"drive":{"ja":"図書館は、自宅に静かな場所がない生徒に、勉強できる場所を提供する。","en":"Libraries provide places to study for students who have no quiet space at home."},"explain":"Librariesが主語で、to studyはplacesを修飾して用途を示す。who have no quiet space at homeはstudentsを限定し、家に静かな場所がない生徒を指す。別の言い方: Libraries offer places to study to students who lack a quiet space at home."},{"id":"g2-ja2en-219","q":"仮に学校が昨年もっと丈夫な机を買っていたら、今年は机の修理に使うお金がもっと少なくて済むだろう。","q_ja":"仮に学校が昨年もっと丈夫な机を買っていたら、今年は机の修理に使うお金がもっと少なくて済むだろう。","choices":[{"t":"If the school bought stronger desks this year, it would have spent less on repairs last year.","why":"今年の購入を条件に昨年の支出を述べ、条件と結果の時を逆転させている。"},{"t":"If the school had bought stronger desks last year, it would spend less on desk repairs this year.","why":"正解。昨年の購入という過去の仮定と、今年の修理費への影響を区別している。"},{"t":"The school would buy stronger desks this year if it had spent less on desk repairs last year.","why":"昨年の修理費を条件に今年の購入を述べ、原因と結果を取り違えている。"},{"t":"If the school has bought stronger desks this year, it will spend less on desk repairs next year.","why":"今年の購入と来年の支出という条件文で、昨年の事実に反する仮定を表していない。"},{"t":"The school would have spent less on desk repairs last year if it bought stronger desks this year.","why":"今年の購入から昨年の節約が生じる構造で、日本語の時間関係を表せていない。"},{"t":"If the school had bought stronger desks last year, it would have spent less on repairs that year.","why":"結果を昨年の支出にしており、今年の修理費が少なくて済むという意味ではない。"}],"answer":1,"point":"過去の事実とは異なる条件が現在に影響する場合、条件節は過去完了、主節は would を使う。","level":3,"drive":{"ja":"仮に学校が昨年もっと丈夫な机を買っていたら、今年は机の修理に使うお金がもっと少なくて済むだろう。","en":"If the school had bought stronger desks last year, it would spend less on desk repairs this year."},"explain":"If節のhad boughtは昨年の事実に反する仮定で、主節のwould spendは今年の結果を示す。Had the school boughtのように倒置しても、昨年と今年の時点を保って混合仮定法を表せる。別の言い方: Had the school bought sturdier desks last year, it would spend less on desk repairs this year."},{"id":"g2-ja2en-220","q":"地域の公園をきれいに保つことは、子どもに安全な遊び場を与える。","q_ja":"地域の公園をきれいに保つことは、子どもに安全な遊び場を与える。","choices":[{"t":"Children give local parks protection by keeping their own playgrounds clean.","why":"自分たちの遊び場をきれいにする子どもの行動が、公園を守るという別の関係を述べている。"},{"t":"Giving parks to local children keeps safe places clean for play.","why":"公園をきれいに保つことではなく、公園を子どもに与えることを主語にしている。"},{"t":"Local parks provide safe places where children learn to keep playgrounds clean.","why":"子どもが清掃を学ぶ場所という説明になり、公園をきれいに保つことによる結果を表していない。"},{"t":"Keeping local parks clean gives children safe places to play.","why":"正解。公園をきれいに保つ行動を主語にし、安全な遊び場という結果を述べている。"},{"t":"Children keep local parks clean because they provide safe playgrounds.","why":"安全な遊び場があることを、公園をきれいにする原因にしている。"},{"t":"Safe places for children to play help keep local parks clean.","why":"安全な遊び場を原因とし、公園がきれいになることを結果にしている。"}],"answer":3,"point":"動名詞句を主語にし、行動がもたらす結果を動詞で続ける。","level":1,"drive":{"ja":"地域の公園をきれいに保つことは、子どもに安全な遊び場を与える。","en":"Keeping local parks clean gives children safe places to play."},"explain":"Keeping以下が主語、givesが動詞。give＋人＋物で受益者と効果を示し、清掃の意義を論じる。別の言い方: Clean local parks provide children with safe places to play."}],"paraphrase":[{"id":"g2-paraphrase-001","q":"Using public transportation can help reduce air pollution in cities.","q_ja":"公共交通機関の利用は都市の大気汚染を減らすのに役立つ可能性がある。","choices":[{"t":"Traveling by bus or train can contribute to cleaner air in cities.","why":"正解。公共交通の利用が都市の空気をきれいにする一助になり得るという意味を保っている。"},{"t":"Traveling by bus or train always removes all air pollution from cities.","why":"可能性を、常に汚染をすべてなくすという断定に変えている。"},{"t":"Using public transportation can increase air pollution in cities.","why":"減らすを増やすに変えており、意味が逆である。"},{"t":"Only people living outside cities can use public transportation.","why":"利用者を都市の外の住民だけに限定しており、原文にない。"},{"t":"Using public transportation can helps reduce air pollution in cities.","why":"助動詞 can の後に helps を置いており、文法上の誤りがある。"},{"t":"Cleaner city air makes public transportation less useful.","why":"公共交通が空気の改善に役立つという関係を別の因果関係に変えている。"}],"answer":0,"point":"can help reduce は can contribute to reducing と言い換えられる。","drive":{"ja":"公共交通機関の利用は都市の大気汚染削減に役立つ可能性がある。同じ意味を別の英語で。","en":"Traveling by bus or train can contribute to cleaner air in cities."},"level":2,"explain":"動名詞句が主語で、canが可能性を表す。contribute to＋名詞で、論述で行動の効果を控えめに示せる。別の言い方: Taking public transport can help clean up city air."},{"id":"g2-paraphrase-002","q":"Students do not have to buy a tablet to join this course.","q_ja":"この講座に参加するために、生徒はタブレットを買う必要はない。","choices":[{"t":"Students are not allowed to buy a tablet for this course.","why":"購入の必要がないことを、購入してはいけないという禁止に変えている。"},{"t":"Every student must buy a tablet before joining this course.","why":"不要な購入を義務に変えており、意味が逆である。"},{"t":"Students do not need to join this course if they own a tablet.","why":"不要なのは端末の購入なのに、講座への参加に変えている。"},{"t":"Buying a tablet is not required for students taking this course.","why":"正解。講座を受ける生徒に購入義務はないという意味を保っている。"},{"t":"Students do not have buying a tablet to join this course.","why":"have to の後は動詞の原形であり、have buying は誤りである。"},{"t":"Students must sell their tablets before taking this course.","why":"タブレットを売る義務は原文にない。"}],"answer":3,"point":"do not have to は「する必要がない」で、禁止を表す must not と異なる。","drive":{"ja":"講座に参加するためにタブレットを買う必要はない。同じ意味を別の英語で。","en":"Buying a tablet is not required for students taking this course."},"level":2,"explain":"動名詞句が主語で、is not requiredが義務の不在を示す。taking以下で生徒を限定し、要約で対象を明確にできる。別の言い方: Students need not buy a tablet for this course."},{"id":"g2-paraphrase-003","q":"More employees work from home now than they did five years ago.","q_ja":"在宅で働く従業員は、5年前より現在のほうが多い。","choices":[{"t":"Fewer employees work from home now than they did five years ago.","why":"増加を減少に変えており、意味が逆である。"},{"t":"All employees have worked from home for the past five years.","why":"人数の増加を、全員が5年間在宅勤務しているという内容に変えている。"},{"t":"Employees now work at home for more hours each day than five years ago.","why":"人数の比較を、1日あたりの勤務時間の比較に変えている。"},{"t":"The number of employees working from home have increased over the past five years.","why":"主語の中心は単数の number なので、have ではなく has が必要である。"},{"t":"Companies began allowing home working exactly five years ago.","why":"5年前との比較を、制度が始まった時点の説明に変えている。"},{"t":"The number of employees working from home has increased over the past five years.","why":"正解。現在の人数が5年前より増えたという比較を保っている。"}],"answer":5,"point":"人数の比較は the number of ... has increased で言い換えられる。","drive":{"ja":"在宅で働く従業員は5年前より増えている。同じ意味を別の英語で。","en":"The number of employees working from home has increased over the past five years."},"level":3,"explain":"主語の中心は単数のnumberなのでhasを使う。現在完了で過去から今への増加を示し、論述で傾向を述べられる。別の言い方: More employees now work from home than five years ago."},{"id":"g2-paraphrase-004","q":"The town postponed the festival because heavy rain was expected.","q_ja":"大雨が予想されたため、町は祭りを延期した。","choices":[{"t":"The town permanently canceled the festival because heavy rain was expected.","why":"延期を永久的な中止に変えている。"},{"t":"The festival was put off by the town due to the forecast of heavy rain.","why":"正解。大雨の予報が理由で祭りを延期したという意味を保っている。"},{"t":"The town postponed the festival although dry weather was expected.","why":"大雨が理由なのに、乾燥した天候なのに延期したという内容に変えている。"},{"t":"The town expected heavy rain because it had postponed the festival.","why":"大雨の予想と延期の因果関係を逆にしている。"},{"t":"The town postponed the festival because of heavy rain was expected.","why":"because of の後に主語と動詞のある節を直接置いている。"},{"t":"The town held the festival earlier to avoid the expected rain.","why":"日程を遅らせる延期を、前倒しで開催することに変えている。"}],"answer":1,"point":"because の理由は due to と名詞句を使って表せる。","drive":{"ja":"大雨が予想されたため、町は祭りを延期した。同じ意味を別の英語で。","en":"The festival was put off by the town due to the forecast of heavy rain."},"level":2,"explain":"The festivalが主語の受動態で、was put offは「延期された」、by the townは行為者を示す。due to the forecast of heavy rainは、大雨の予報が延期の理由であることを表す。別の言い方: The town postponed the festival because heavy rain was forecast."},{"id":"g2-paraphrase-005","q":"The new machines are too expensive for this small factory to buy.","q_ja":"新しい機械は高すぎて、この小さな工場には買えない。","choices":[{"t":"This small factory can easily afford the expensive new machines.","why":"買えないという意味を、簡単に買えるに変えている。"},{"t":"The new machines are cheap enough for this small factory to buy.","why":"高すぎるという意味を、買えるほど安いに変えている。"},{"t":"The new machines are so expensive that this small factory cannot afford they.","why":"afford の目的語は they ではなく them が必要である。"},{"t":"This small factory cannot buy the new machines because they are too large.","why":"購入できない理由を価格から大きさに変えている。"},{"t":"The new machines cost so much that this small factory cannot afford them.","why":"正解。価格が高すぎて工場に購入する余裕がないという意味を保っている。"},{"t":"The machines are too expensive for every factory in the country to buy.","why":"対象をこの工場から国内のすべての工場に広げている。"}],"answer":4,"point":"too ... to は so ... that ... cannot で言い換えられる。","drive":{"ja":"新しい機械は高すぎてこの工場には買えない。同じ意味を別の英語で。","en":"The new machines cost so much that this small factory cannot afford them."},"level":2,"explain":"主節が価格の高さ、that節が結果を示す。so much thatで程度と結果を結び、論述で費用の障壁を示す。別の言い方: These new machines are beyond this small factory’s budget."},{"id":"g2-paraphrase-006","q":"Unless residents separate their waste, the recycling program will not succeed.","q_ja":"住民がごみを分別しなければ、リサイクル事業は成功しない。","choices":[{"t":"The recycling program will succeed even if residents do not sort their waste.","why":"分別しなくても成功するという逆の条件関係に変えている。"},{"t":"The recycling program will fail if residents sort their waste.","why":"失敗の条件を、分別しない場合から分別する場合に変えている。"},{"t":"The recycling program will fail if residents do not sort their waste.","why":"正解。分別しないことが事業の失敗につながるという条件を保っている。"},{"t":"Residents need not sort their waste for the recycling program to succeed.","why":"成功には分別が必要なのに、分別は不要だという意味に変えている。"},{"t":"The recycling program will fail unless residents sorts their waste.","why":"複数主語 residents に三単現の sorts を使っている。"},{"t":"The recycling program will certainly succeed once residents sort their waste.","why":"分別は成功に必要という内容を、分別だけで成功が確実になるという内容に変えている。"}],"answer":2,"point":"Unless A, B は If not A, B と言い換えられる。","drive":{"ja":"住民がごみを分別しなければ事業は成功しない。同じ意味を別の英語で。","en":"The recycling program will fail if residents do not sort their waste."},"level":3,"explain":"主節が失敗の予測、if節が条件を示す。条件節は未来も現在形にし、論述で成功に必要な行動を示せる。別の言い方: Without residents sorting waste, the recycling program will fail."},{"id":"g2-paraphrase-007","q":"Despite the higher price, some consumers choose locally grown vegetables.","q_ja":"価格が高くても、地元で育てられた野菜を選ぶ消費者もいる。","choices":[{"t":"All consumers choose locally grown vegetables because they cost less.","why":"一部を全員に変え、価格が高いことも安いことに変えている。"},{"t":"Some consumers avoid locally grown vegetables because of their higher price.","why":"高くても選ぶという意味を、高いから避けるに変えている。"},{"t":"Some consumers choose locally grown vegetables only when they are cheaper.","why":"高くても選ぶという意味を、安い場合に限って選ぶに変えている。"},{"t":"Despite locally grown vegetables cost more, some consumers choose them.","why":"Despite の後に節を直接置いており、Although などが必要である。"},{"t":"Some farmers charge more because consumers refuse to buy local vegetables.","why":"消費者の選択を、農家の値付けと不買の因果関係に変えている。"},{"t":"Although locally grown vegetables cost more, some consumers prefer to buy them.","why":"正解。価格が高いという条件にもかかわらず、一部の消費者が選ぶ意味を保っている。"}],"answer":5,"point":"Despite と名詞句は Although と節で言い換えられる。","drive":{"ja":"価格が高くても地元産の野菜を選ぶ消費者もいる。同じ意味を別の英語で。","en":"Although locally grown vegetables cost more, some consumers prefer to buy them."},"level":2,"explain":"Although節は譲歩、主節は選択を示す。prefer toは好みを表し、論述で価格と選択を対比する。別の言い方: Some buyers prefer local vegetables despite higher prices."},{"id":"g2-paraphrase-008","q":"The community center has been closed since Monday.","q_ja":"地域センターは月曜日からずっと閉まっている。","choices":[{"t":"The community center closed on Monday and has not reopened yet.","why":"正解。月曜日に閉まり、現在も再開していないという継続を保っている。"},{"t":"The community center was closed only on Monday.","why":"月曜日から続く状態を、月曜日だけの閉館に変えている。"},{"t":"The community center has remained open since Monday.","why":"閉まっている状態を、開いている状態に変えている。"},{"t":"The community center will close next Monday.","why":"過去から現在までの状態を、来週の予定に変えている。"},{"t":"The community center has been closed since three days.","why":"since は起点に使うため、期間の three days には for が必要である。"},{"t":"The community center reopened on Monday after a long closure.","why":"閉館の開始日を、再開した日に変えている。"}],"answer":0,"point":"has been closed since は過去の時点から現在まで続く閉館状態を表す。","drive":{"ja":"地域センターは月曜日から現在まで閉まっている。同じ意味を別の英語で。","en":"The community center closed on Monday and has not reopened yet."},"level":1,"explain":"同じ主語に二つの述語をandで結ぶ。過去形で閉館の時点、現在完了の否定で今の未再開を示し、要約で経過を整理できる。別の言い方: The community center has remained closed since Monday."},{"id":"g2-paraphrase-009","q":"The school encourages students to walk rather than drive short distances.","q_ja":"学校は短い距離なら車を運転するより歩くように生徒に勧めている。","choices":[{"t":"The school requires every student to walk regardless of the distance.","why":"推奨を義務に変え、短距離という条件もなくしている。"},{"t":"The school encourages students to drive instead of walking short distances.","why":"勧める移動方法を徒歩から車に逆転している。"},{"t":"The school urges students to walk instead of driving when traveling short distances.","why":"正解。短距離では車の運転の代わりに徒歩を勧めるという意味を保っている。"},{"t":"Students encourage the school to stop people from walking short distances.","why":"勧める主体と内容を変えている。"},{"t":"The school encourages students walking rather than driving short distances.","why":"encourage 人 to do の形が必要で、students walking は誤りである。"},{"t":"The school encourages walking only for journeys that are very long.","why":"対象を短い距離から非常に長い距離だけに変えている。"}],"answer":2,"point":"rather than は instead of と動名詞を使って言い換えられる。","drive":{"ja":"学校は短距離の移動では車より徒歩を勧めている。同じ意味を別の英語で。","en":"The school urges students to walk instead of driving when traveling short distances."},"level":2,"explain":"The schoolが主語で、urge＋人＋to doは人にある行動を強く勧める形。instead of drivingは運転の代わりに歩くことを示し、when traveling short distancesは短距離を移動する場合という条件を添える。別の言い方: The school strongly encourages students to walk rather than drive when making short trips."},{"id":"g2-paraphrase-010","q":"Online training is not as costly as sending staff to another city.","q_ja":"オンライン研修は、職員を別の都市に派遣するほど費用がかからない。","choices":[{"t":"Online training costs more than sending staff to another city.","why":"費用の大小関係を逆にしている。"},{"t":"Online training and sending staff to another city cost exactly the same.","why":"費用が異なるという比較を、同額に変えている。"},{"t":"Online training is always free for all companies.","why":"比較的安いことを、全企業で常に無料だという内容に変えている。"},{"t":"Online training is less costly as sending staff to another city.","why":"less を使う比較には as ではなく than が必要である。"},{"t":"Training staff online is less expensive than having them travel to another city.","why":"正解。オンライン研修の費用が他都市への派遣より低いという比較を保っている。"},{"t":"Sending staff to another city is less effective than online training.","why":"費用の比較を研修の効果の比較に変えている。"}],"answer":4,"point":"not as costly as は less expensive than と言い換えられる。","drive":{"ja":"オンライン研修は職員を別の都市に派遣するより安い。同じ意味を別の英語で。","en":"Training staff online is less expensive than having them travel to another city."},"level":2,"explain":"動名詞句が主語、than以下が比較対象。have＋人＋原形で派遣を表し、論述で費用を比較する。別の言い方: Online training costs less than sending staff to another city."},{"id":"g2-paraphrase-201","q":"School gardens help children learn about healthy food.","q_ja":"学校の菜園は子どもたちが健康によい食べ物について学ぶ助けになる。","choices":[{"t":"Children learn about healthy food without help from school gardens.","why":"学校の菜園が学習を助けるという意味を否定している。"},{"t":"Children can learn about healthy food through school gardens.","why":"正解。菜園を通して学べるという形に構文を変えている。"},{"t":"School gardens helps children understand which foods are healthy.","why":"主語が複数なので、helps は help にする。"},{"t":"School gardens help children learn about nutritious food.","why":"healthy を nutritious に替えただけで、構文を言い換えていない。"},{"t":"Children teach schools how to grow food in their gardens.","why":"学ぶ子どもたちが学校に教える側に変わっている。"},{"t":"School gardens prevent children from learning about healthy food.","why":"学習を助けるという内容が、学習を妨げる内容に変わっている。"}],"answer":1,"point":"help＋人＋動詞の原形は、人を主語にして can と through で言い換えられる。","level":1,"drive":{"ja":"学校の菜園は子どもたちが健康によい食べ物について学ぶ助けになる。","en":"Children can learn about healthy food through school gardens."},"explain":"Childrenが主語、can learnが述語、through以下が学ぶ手段。手段を添える型で、論述で教育活動の利点を示せる。別の言い方: School gardens teach children about healthy food."},{"id":"g2-paraphrase-202","q":"Many workers choose online meetings because they want to reduce travel costs.","q_ja":"多くの働く人は移動費を減らしたいのでオンライン会議を選ぶ。","choices":[{"t":"Many workers choose online meetings because they want to lower travel costs.","why":"reduce を lower に替えただけで、構文を言い換えていない。"},{"t":"Many workers avoid online meetings in order to spend less money on travel.","why":"費用を減らすためにオンライン会議を避けるという意味に変わっている。"},{"t":"Online meetings become popular because travel costs fall when workers stop using them.","why":"オンライン会議を使わなくなると移動費が下がるという内容に変わっている。"},{"t":"Many workers chooses to meet online so that they can reduce travel costs.","why":"複数主語の workers に対して chooses を使っている。"},{"t":"To spend less on travel, many workers decide to hold their meetings online.","why":"正解。理由を表す節を、目的を表す不定詞に言い換えている。"},{"t":"Workers who choose online meetings no longer need to pay any travel costs.","why":"移動費を減らしたいという希望を、移動費が全く不要になるという断定に変えている。"}],"answer":4,"point":"because 節で述べた目的は、文頭の To＋動詞の原形で表せる。","level":2,"drive":{"ja":"多くの働く人は移動費を減らしたいのでオンライン会議を選ぶ。","en":"To spend less on travel, many workers decide to hold their meetings online."},"explain":"workersが主語、decideが動詞、To句は目的。spend less onで節約対象を示し、論述で選択の狙いを示す。別の言い方: Workers choose online meetings to cut travel costs."},{"id":"g2-paraphrase-203","q":"Unless residents separate their waste properly, the town cannot recycle it efficiently.","q_ja":"住民がごみを適切に分別しなければ、町はそれを効率よくリサイクルできない。","choices":[{"t":"The town can recycle waste efficiently only if residents sort it in the right way.","why":"正解。unless が示す必要条件を only if を使って表している。"},{"t":"Residents can separate waste properly only if the town already recycles all of it efficiently.","why":"住民の分別が町の効率的なリサイクルの条件であるという関係が逆になっている。"},{"t":"Unless residents sort their waste properly, the town cannot recycle it efficiently.","why":"separate を sort に替えただけで、構文を言い換えていない。"},{"t":"If residents separate their waste properly, the town will certainly recycle all of it efficiently.","why":"必要条件を十分条件に変え、さらに全量を確実に処理できると断定している。"},{"t":"The town cannot recycle waste efficiently unless residents separates it into the correct groups.","why":"複数主語の residents に対して separates を使っている。"},{"t":"The town can recycle waste efficiently even when residents fail to separate it properly at home.","why":"適切に分別しなくても効率よく処理できるという意味に変わっている。"}],"answer":0,"point":"unless は「もし〜でなければ」を表し、必要条件は only if でも示せる。","level":3,"drive":{"ja":"住民がごみを適切に分別しなければ、町はそれを効率よくリサイクルできない。","en":"The town can recycle waste efficiently only if residents sort it in the right way."},"explain":"町が主語、can recycleが述語、only if節が条件。必要条件を示し、要約に使える。別の言い方: Without proper waste sorting, the town cannot recycle efficiently."},{"id":"g2-paraphrase-204","q":"Public libraries lend books to local people for free.","q_ja":"公共図書館は地域の人々に無料で本を貸す。","choices":[{"t":"Local people must pay public libraries to borrow their books.","why":"無料で借りられるという内容が、有料で借りる内容に変わっている。"},{"t":"Public libraries lend books to local people for nothing.","why":"for free を for nothing に替えただけで、構文を言い換えていない。"},{"t":"Local people can borrows books from public libraries without paying.","why":"can の後は原形なので、borrows は borrow にする。"},{"t":"Local people can borrow books from public libraries without paying.","why":"正解。貸し手を主語にした lend の文を、借り手を主語にした borrow の文に変えている。"},{"t":"Public libraries borrow free books from people in the area.","why":"図書館が貸す側から借りる側に変わっている。"},{"t":"Local people buy books that public libraries sell at low prices.","why":"無料の貸し出しが、安い価格での販売に変わっている。"}],"answer":3,"point":"lend A to B は、借り手を主語にして B borrows A from と言い換えられる。","level":1,"drive":{"ja":"公共図書館は地域の人々に無料で本を貸す。","en":"Local people can borrow books from public libraries without paying."},"explain":"住民が主語、can borrowが述語、from以下が借り先。without＋動名詞で費用負担のなさを示し、論述で利点を説明する。別の言い方: Local people can borrow library books for free."},{"id":"g2-paraphrase-205","q":"The city opened a new park so that residents could exercise near their homes.","q_ja":"住民が自宅の近くで運動できるように、市は新しい公園を開設した。","choices":[{"t":"The city opened a new park so that residents could exercise close to their homes.","why":"near を close to に替えただけで、構文を言い換えていない。"},{"t":"Residents began exercising near their homes, which caused the city to open a new park.","why":"運動できるように公園を開設したという目的を、開設の原因に変えている。"},{"t":"The city opened a new park to make residents exercise far away from their homes.","why":"自宅の近くで運動できるという内容が、自宅から遠くで運動させる内容に変わっている。"},{"t":"To allow residents exercising near home, the city opened a new park in the area.","why":"allow＋人の後は to exercise にする。"},{"t":"The new park was opened to stop residents from exercising near their homes.","why":"運動を可能にする目的が、運動をやめさせる目的に変わっている。"},{"t":"The city opened a new park to give residents a place to exercise near home.","why":"正解。so that 節の目的を、不定詞を使って言い換えている。"}],"answer":5,"point":"so that＋主語＋could は、目的を表す to 不定詞に言い換えられる。","level":2,"drive":{"ja":"住民が自宅の近くで運動できるように、市は新しい公園を開設した。","en":"The city opened a new park to give residents a place to exercise near home."},"explain":"市が主語、openedが動詞、to give以下が目的。場所＋不定詞で用途を示し、論述で施策の狙いを述べる。別の言い方: The city opened a park to let residents exercise near home."},{"id":"g2-paraphrase-206","q":"Although the new buses run less often, they carry more passengers than the old ones.","q_ja":"新しいバスは運行頻度が低いが、古いバスより多くの乗客を運ぶ。","choices":[{"t":"The new buses make fewer trips because each one carries fewer passengers than the old buses did.","why":"運行頻度と乗客数の逆接が因果関係に変わり、乗客数の比較も逆になっている。"},{"t":"Although the new buses run less frequently, they carry more passengers than the old ones.","why":"often を frequently に替えただけで、構文を言い換えていない。"},{"t":"The new buses carry more passengers than the old buses do, though they make fewer trips.","why":"正解。比較の内容を保ち、運行頻度についての譲歩節を文末に移している。"},{"t":"The new buses carry fewer passengers than the old buses do, even though they make fewer trips.","why":"古いバスより多くの乗客を運ぶという比較が逆になっている。"},{"t":"The new buses carries more passengers than the old buses did despite making fewer trips each day.","why":"複数主語の buses に対して carries を使っている。"},{"t":"The old buses carry more passengers, although the new buses operate less often than the old ones.","why":"運行頻度の比較は同じだが、より多くの乗客を運ぶバスが逆になっている。"}],"answer":2,"point":"although や though の節を移動するときも、二つの比較の向きを保つ。","level":3,"drive":{"ja":"新しいバスは運行頻度が低いが、古いバスより多くの乗客を運ぶ。","en":"The new buses carry more passengers than the old buses do, though they make fewer trips."},"explain":"バスが主語、carryが動詞、though節は譲歩。doはcarryを代用し、論述で反対材料も示せる。別の言い方: New buses carry more people than old ones despite fewer trips."},{"id":"g2-paraphrase-207","q":"Using cloth bags reduces the amount of plastic waste.","q_ja":"布の袋を使うとプラスチックごみの量が減る。","choices":[{"t":"Less plastic waste is produced when people use cloth bags.","why":"正解。ごみが減るという結果を、less と受け身で表している。"},{"t":"Using cloth bags increases the amount of plastic waste.","why":"ごみが減るという内容が、増える内容に変わっている。"},{"t":"Using cloth bags lowers the amount of plastic waste.","why":"reduces を lowers に替えただけで、構文を言い換えていない。"},{"t":"People produces less plastic waste when they use cloth bags.","why":"複数主語の people に対して produces を使っている。"},{"t":"Producing more plastic waste helps people use fewer cloth bags.","why":"布の袋の使用がごみを減らすという因果関係が変わっている。"},{"t":"People create the same amount of plastic waste with cloth bags.","why":"ごみが減るという内容が、ごみの量は変わらないという内容に変わっている。"}],"answer":0,"point":"reduce the amount of は、less を使った結果の文に言い換えられる。","level":1,"drive":{"ja":"布の袋を使うとプラスチックごみの量が減る。","en":"Less plastic waste is produced when people use cloth bags."},"explain":"ごみが主語、is producedが受け身の述語、when節が使用時を示す。量はlessで比べ、要約で削減効果を前面に出す。別の言い方: Cloth bags help people produce less plastic waste."},{"id":"g2-paraphrase-208","q":"The school requires students to turn off their phones during lessons.","q_ja":"その学校は授業中に携帯電話の電源を切ることを生徒に義務づけている。","choices":[{"t":"Students may keep their phones on during lessons if they do not use them.","why":"電源を切る義務が、条件付きで電源を入れておける許可に変わっている。"},{"t":"The school requires students to switch off their phones during lessons.","why":"turn を switch に替えただけで、構文を言い換えていない。"},{"t":"Students must to turn off their phones while they are having lessons.","why":"助動詞 must の後に to を置いている。"},{"t":"Teachers are required to turn off students' phones during every school lesson.","why":"電源を切る義務を負う人が、生徒から教師に変わっている。"},{"t":"Students at the school have to keep their phones off while attending lessons.","why":"正解。学校が課す義務を、生徒を主語にした have to で表している。"},{"t":"The school lets students decide whether to turn off their phones during lessons.","why":"学校による義務が、生徒自身の選択に変わっている。"}],"answer":4,"point":"require＋人＋to は、義務を負う人を主語にして have to で表せる。","level":2,"drive":{"ja":"その学校は授業中に携帯電話の電源を切ることを生徒に義務づけている。","en":"Students at the school have to keep their phones off while attending lessons."},"explain":"生徒が主語、have toが義務、while以下が授業中を示す。keep＋目的語＋offで状態を保ち、論述で校則を説明する。別の言い方: Students must keep their phones off during lessons."},{"id":"g2-paraphrase-209","q":"Students who submit their reports by Friday will receive comments before the next lesson.","q_ja":"金曜日までにレポートを提出する生徒は、次の授業より前にコメントを受け取る。","choices":[{"t":"Only students who submit their reports by Friday can receive any comments before the next lesson.","why":"金曜日までの提出を必要条件にしており、それ以外の生徒にはコメントがないという制限を加えている。"},{"t":"If students hand in their reports by Friday, they will get feedback before the next lesson.","why":"正解。関係代名詞節が示す対象を if 節の条件に変え、締め切りと返却時期を保っている。"},{"t":"Students who submit their reports by Friday will receive feedback before the next lesson.","why":"comments を feedback に替えただけで、構文を言い換えていない。"},{"t":"Students will gets feedback before the next lesson if they submit their reports by Friday.","why":"助動詞 will の後は原形なので、gets は get にする。"},{"t":"Students who get feedback before the next lesson are required to submit their reports by Friday.","why":"提出すればコメントをもらえるという条件を、コメントをもらう生徒の提出義務に変えている。"},{"t":"If students hand in reports by Friday, they will get feedback only after the next lesson ends.","why":"次の授業より前という返却時期が、授業終了後に変わっている。"}],"answer":1,"point":"条件に当てはまる人を示す関係代名詞節は if 節でも表せるが、only を加えると条件が変わる。","level":3,"drive":{"ja":"金曜日までにレポートを提出する生徒は、次の授業より前にコメントを受け取る。","en":"If students hand in their reports by Friday, they will get feedback before the next lesson."},"explain":"If節が提出条件、主節が結果。byは期限、beforeは前を表し、要約で時点を保つ。別の言い方: Submitting reports by Friday ensures feedback before the next lesson."},{"id":"g2-paraphrase-210","q":"It is important for schools to teach children road safety.","q_ja":"学校が子どもたちに交通安全を教えることは重要だ。","choices":[{"t":"Schools do not need to teach children about road safety.","why":"教えることが重要だという内容が、教える必要はないという内容に変わっている。"},{"t":"It is essential for schools to teach children road safety.","why":"important を essential に替えただけで、構文を言い換えていない。"},{"t":"Teaching children about road safety are important for schools.","why":"動名詞句を主語にしているので、are は is にする。"},{"t":"Teaching children about road safety is important for schools.","why":"正解。形式主語 it の文を、動名詞句が主語の文に変えている。"},{"t":"Children should teach schools how to keep roads safe.","why":"教える側と教わる側が逆になっている。"},{"t":"Schools consider road safety less important than other school subjects.","why":"他の教科より重要でないという比較を加えている。"}],"answer":3,"point":"It is important for A to do は、動名詞句を主語にした文に言い換えられる。","level":1,"drive":{"ja":"学校が子どもたちに交通安全を教えることは重要だ。","en":"Teaching children about road safety is important for schools."},"explain":"Teaching以下の動名詞句が主語、isが動詞。行為を単数扱いし、論述で教育の重要性を述べる。別の言い方: It is important for schools to teach children about road safety."},{"id":"g2-paraphrase-211","q":"Using public buses helps cities reduce air pollution.","q_ja":"バスの利用は都市の大気汚染の削減に役立つ。","choices":[{"t":"Cities can reduce bus use by increasing air pollution.","why":"大気汚染を増やしてバス利用を減らすという内容に変わっている。"},{"t":"Using public buses helps cities decrease air pollution.","why":"reduce を同義語の decrease に替えただけで、構文の言い換えになっていない。"},{"t":"Cities can reduce air pollution by using public buses.","why":"正解。バスの利用が大気汚染の削減に役立つという意味を、by を使う構文で表している。"},{"t":"Taking buses help cities keep their air cleaner.","why":"動名詞の主語 Taking buses は単数扱いなので、help ではなく helps が必要。"},{"t":"Air pollution increases when cities use more buses.","why":"バスの利用で大気汚染が増えるという、逆の内容になっている。"},{"t":"Cities must stop using buses to reduce air pollution.","why":"大気汚染を減らすためにバス利用をやめる必要があるという意味に変わっている。"}],"answer":2,"point":"動名詞を主語にした文は、別の主語と by＋動名詞を使って言い換えられる。","level":1,"drive":{"ja":"バスの利用は都市の大気汚染の削減に役立つ。同じ意味を別の構文で英語にしてください。","en":"Cities can reduce air pollution by using public buses."},"explain":"Citiesが主語、can reduceが述語で、by以下は手段を示す。by＋動名詞は、論述で対策と効果を結び付けるのに使える。別の言い方: Bus use helps cities cut air pollution."},{"id":"g2-paraphrase-212","q":"Local libraries lend computers to people who cannot afford their own.","q_ja":"地域の図書館は、自分用のパソコンを買う経済的余裕がない人にパソコンを貸している。","choices":[{"t":"People unable to afford computers can borrow them from local libraries.","why":"正解。図書館が貸すという文を、買う余裕がない人が借りられるという視点で言い換えている。"},{"t":"Local libraries borrow computers from people who cannot afford their own.","why":"図書館が人々から借りるという意味になり、貸す側と借りる側が逆になっている。"},{"t":"People without enough money can borrowing computers from libraries in their area.","why":"助動詞 can の後ろは動詞の原形なので、borrowing ではなく borrow が必要。"},{"t":"Local libraries loan computers to people who cannot afford their own.","why":"lend を同義語の loan に替えただけで、構文は元のまま。"},{"t":"People who can afford computers are the only ones libraries lend them to.","why":"買う余裕がある人だけに貸すという条件に変わっている。"},{"t":"Local libraries give free computers to people unable to buy their own.","why":"貸すのではなく、無料で譲るという意味に変わっている。"}],"answer":0,"point":"lend A to B は貸す側、B can borrow A from ... は借りる側から同じ関係を表す。","level":2,"drive":{"ja":"地域の図書館は、自分用のパソコンを買う余裕がない人にパソコンを貸している。同じ意味を別の構文で英語にしてください。","en":"People unable to afford computers can borrow them from local libraries."},"explain":"Peopleが主語、borrowが動詞で、unable以下が人を限定する。borrowは要約で借り手に焦点を当てられる。別の言い方: Local libraries lend PCs to those unable to buy them."},{"id":"g2-paraphrase-213","q":"Unless schools cause の理由を先に置き、so で電車利用という結果につないでいる。"},{"t":"Many workers takes trains since traveling by car costs more.","why":"複数主語 Many workers に対して takes は使えず、take が必要。"},{"t":"Many workers choose trains even though driving costs less money.","why":"車のほうが安いという内容と、譲歩の関係に変わっている。"}],"answer":3,"point":"結果＋because＋理由は、理由＋so＋結果の順でも表せる。","level":1,"drive":{"ja":"車の運転のほうが費用がかかるため、多くの労働者は電車を利用する。同じ意味を別の構文で英語にしてください。","en":"Driving is more expensive, so many workers travel by train."},"explain":"Drivingが主語の節で理由を述べ、so以下で結果を示す。動名詞主語は行為自体を評価でき、論述の理由付けに使える。別の言い方: Many workers take trains because driving costs more."},{"id":"g2-paraphrase-215","q":"Online classes allow students to study without spending time on travel.","q_ja":"オンライン授業なら、生徒は移動に時間を使わずに勉強できる。","choices":[{"t":"Students must spend time traveling before they can take their classes online.","why":"オンライン授業の前にも移動が必要だという意味になっている。"},{"t":"Students taking online classes do not need to spend time traveling to lessons.","why":"正解。移動時間なしで学べることを、授業のために移動する必要がないという構文で表している。"},{"t":"Online classes enable students to study without spending time on travel.","why":"allow を同義語の enable に替えただけで、構文は元のまま。"},{"t":"Taking online classes lets students to study without traveling to their lessons.","why":"let＋目的語の後ろは動詞の原形なので、to study ではなく study が必要。"},{"t":"Students who spend less time traveling no longer need to take online classes.","why":"移動時間が少ない生徒にはオンライン授業が不要だという、別の主張になっている。"},{"t":"Online lessons give teachers extra travel time while their students study at home.","why":"生徒の移動が不要という利点を、教師の移動時間が増えるという内容に変えている。"}],"answer":1,"point":"allow＋人＋to do の利点を、主語を人に変えて do not need to ... で説明できる。","level":2,"drive":{"ja":"オンライン授業なら、生徒は移動に時間を使わずに勉強できる。同じ意味を別の構文で英語にしてください。","en":"Students taking online classes do not need to spend time traveling to lessons."},"explain":"Studentsが主語で、taking以下が生徒を限定する。spend time＋動名詞は、要約で時間の使途を示せる。別の言い方: Online students need not travel to class."},{"id":"g2-paraphrase-216","q":"Residents do not have to pay for repairs if their d
