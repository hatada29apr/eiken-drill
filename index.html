形 decrease が必要。"},{"t":"Importing less energy would be good for the country.","why":"価格変動への弱さが軽減するという具体的な効果が抜けている。"},{"t":"A reduction in reliance on energy imports would decrease the national economy’s vulnerability to abrupt fluctuations in international fuel prices.","why":"正解。依存の低下と価格変動への弱さの軽減を名詞化して保持している。"},{"t":"Reduced vulnerability to international fuel price changes would cause less dependence on imported energy.","why":"依存低下が弱さを軽減するという因果を逆にしている。"}],"answer":4,"point":"less vulnerable を decrease vulnerability、dependence を reliance で言い換える。","drive":{"ja":"輸入エネルギーへの依存を減らせば、国の経済は国際的な燃料価格の急変の影響を受けにくくなるだろう。を言い換えてください","en":"A reduction in reliance on energy imports would decrease the national economy’s vulnerability to abrupt fluctuations in international fuel prices."}},{"id":"p1-paraphrase-010","q":"Public funding for scientific research should not depend solely on whether a project is likely to generate immediate commercial profits.","q_ja":"科学研究への公的資金の提供は、その事業がすぐに商業的利益を生む見込みだけで決めるべきではない。","choices":[{"t":"Public funding for scientific research should depend entirely on immediate commercial profits.","why":"利益だけで決めるべきではないという主張を逆にしている。"},{"t":"The allocation of public research funds should not be determine exclusively by immediate commercial prospects.","why":"受動態の be の後には過去分詞 determined が必要。"},{"t":"Public funding for scientific research should not depend only on whether a project is likely to generate immediate commercial profits.","why":"solely を only に替えただけで、ほぼ丸写しになっている。"},{"t":"The allocation of public funds to scientific research should not be determined exclusively by a project’s prospects for immediate commercial profit.","why":"正解。資金配分を名詞化し、短期の利益だけで判断しないという限定を保っている。"},{"t":"Giving money to science is good even when business is bad.","why":"資金配分の基準と短期の利益の見込みという論点が失われている。"},{"t":"Scientific research should never receive public funding if it might produce commercial profits.","why":"利益だけで判断しないという限定を、利益の可能性があれば支援しないという禁止に変えている。"}],"answer":3,"point":"not solely を not exclusively、利益を生む見込みを prospects for profit で表す。","drive":{"ja":"科学研究への公的資金の提供は、その事業がすぐに商業的利益を生む見込みだけで決めるべきではない。を言い換えてください","en":"The allocation of public funds to scientific research should not be determined exclusively by a project’s prospects for immediate commercial profit."}}],"reason":[{"id":"p1-reason-001","q":"TOPIC: Should governments expand public transport subsidies?\nPosition: Agree\nPOINT: Equality\nChoose the general reason that supports the position using the specified POINT.","q_ja":"政府は公共交通への補助金を拡大すべきか（賛成）。指定の観点「公平性」を使って、この立場を支える一般的な理由を選んでください。","choices":[{"t":"Transport subsidies undermine equality when benefits mainly reach affluent urban commuters while disadvantaged residents in remote communities receive little financial assistance.","why":"公平性に触れているが、指定された立場と逆の理由になっている。"},{"t":"Expanded transport subsidies reduce vehicle emissions by encouraging commuters to abandon private cars, thereby improving air quality in crowded urban areas.","why":"同じ政策に関する理由だが、指定された公平性とは別の観点を述べている。"},{"t":"By reducing fares, public subsidies promote equality, enabling residents with limited incomes to access employment opportunities beyond their immediate neighborhoods.","why":"正解。公平性の観点から政策の影響を説明し、賛成の立場を支える一般的な理由になっている。"},{"t":"Public transport subsidies appear in municipal budgets, which classify expenditure according to administrative departments and the services receiving direct financial support.","why":"制度や対象の事実を説明しているだけで、指定された立場を支える理由を示していない。"},{"t":"Governments should expand financial assistance for public transport because providing broader public subsidies for these services is a policy that deserves support.","why":"指定された立場を言い換えているだけで、なぜそうすべきかを説明していない。"},{"t":"When my municipality introduced subsidized bus passes last April, I used mine to attend a recruitment event in a neighboring district.","why":"特定の個人的な体験にとどまり、指定された立場を支える一般的な理由になっていない。"}],"answer":2,"point":"「公平性」が政策によってどう変わるかを説明し、賛成の立場につながる因果関係を示す。","drive":{"ja":"政府は公共交通への補助金を拡大すべきか。賛成の立場で、「公平性」を使った一般的な理由を英語で一文述べてください。","en":"By reducing fares, public subsidies promote equality, enabling residents with limited incomes to access employment opportunities beyond their immediate neighborhoods."}},{"id":"p1-reason-002","q":"TOPIC: Should public institutions replace most administrative staff with automated systems?\nPosition: Disagree\nPOINT: Accountability\nChoose the general reason that supports the position using the specified POINT.","q_ja":"公的機関は事務職員の大半を自動化システムで置き換えるべきか（反対）。指定の観点「説明責任」を使って、この立場を支える一般的な理由を選んでください。","choices":[{"t":"Automated systems strengthen accountability by recording administrative decisions consistently, allowing public institutions to investigate errors more thoroughly than conventional paper procedures permit.","why":"説明責任に触れているが、指定された立場と逆の理由になっている。"},{"t":"Replacing administrative staff with automated systems would impose substantial initial costs, diverting limited public resources from essential services for vulnerable local residents.","why":"同じ政策に関する理由だが、指定された説明責任とは別の観点を述べている。"},{"t":"Public institutions maintain administrative records in electronic databases, with separate departments responsible for managing applications relating to various categories of public services.","why":"制度や対象の事実を説明しているだけで、指定された立場を支える理由を示していない。"},{"t":"Public institutions should retain most administrative employees because replacing the majority of these workers with automated systems is an approach they should reject.","why":"指定された立場を言い換えているだけで、なぜそうすべきかを説明していない。"},{"t":"After an automated application system rejected my housing documents last winter, I visited the municipal office and requested clarification from a senior official.","why":"特定の個人的な体験にとどまり、指定された立場を支える一般的な理由になっていない。"},{"t":"Extensive automation may weaken accountability, as citizens affected by incorrect decisions could struggle to identify officials responsible for explaining and correcting them.","why":"正解。説明責任の観点から政策の影響を説明し、反対の立場を支える一般的な理由になっている。"}],"answer":5,"point":"「説明責任」が政策によってどう変わるかを説明し、反対の立場につながる因果関係を示す。","drive":{"ja":"公的機関は事務職員の大半を自動化システムで置き換えるべきか。反対の立場で、「説明責任」を使った一般的な理由を英語で一文述べてください。","en":"Extensive automation may weaken accountability, as citizens affected by incorrect decisions could struggle to identify officials responsible for explaining and correcting them."}},{"id":"p1-reason-003","q":"TOPIC: Should governments provide more funding for basic scientific research?\nPosition: Agree\nPOINT: Innovation\nChoose the general reason that supports the position using the specified POINT.","q_ja":"政府は基礎科学研究への資金提供を増やすべきか（賛成）。指定の観点「技術革新」を使って、この立場を支える一般的な理由を選んでください。","choices":[{"t":"Public investment in basic research fosters innovation by supporting investigations whose uncertain commercial prospects would otherwise discourage private companies from financing them.","why":"正解。技術革新の観点から政策の影響を説明し、賛成の立場を支える一般的な理由になっている。"},{"t":"Increasing public funding could hinder innovation if researchers prioritize administrative requirements over original investigations, reducing their willingness to explore unconventional scientific ideas.","why":"技術革新に触れているが、指定された立場と逆の理由になっている。"},{"t":"Greater funding for basic research would create stable employment for laboratory technicians, helping universities retain qualified personnel despite fluctuations in private sector recruitment.","why":"同じ政策に関する理由だが、指定された技術革新とは別の観点を述べている。"},{"t":"Basic research receives funding from several government agencies, whose annual reports describe the academic institutions and scientific fields included in their grant programs.","why":"制度や対象の事実を説明しているだけで、指定された立場を支える理由を示していない。"},{"t":"Governments should allocate additional resources to basic scientific research because increasing public financial support for this category of research is a desirable policy.","why":"指定された立場を言い換えているだけで、なぜそうすべきかを説明していない。"},{"t":"During my university internship last summer, a government research grant allowed our laboratory to purchase equipment for an experimental project on advanced materials.","why":"特定の個人的な体験にとどまり、指定された立場を支える一般的な理由になっていない。"}],"answer":0,"point":"「技術革新」が政策によってどう変わるかを説明し、賛成の立場につながる因果関係を示す。","drive":{"ja":"政府は基礎科学研究への資金提供を増やすべきか。賛成の立場で、「技術革新」を使った一般的な理由を英語で一文述べてください。","en":"Public investment in basic research fosters innovation by supporting investigations whose uncertain commercial prospects would otherwise discourage private companies from financing them."}},{"id":"p1-reason-004","q":"TOPIC: Should cities prohibit private cars throughout their central districts?\nPosition: Disagree\nPOINT: Accessibility\nChoose the general reason that supports the position using the specified POINT.","q_ja":"都市は中心地区全域で自家用車の利用を禁止すべきか（反対）。指定の観点「アクセスのしやすさ」を使って、この立場を支える一般的な理由を選んでください。","choices":[{"t":"Prohibiting private cars improves accessibility by allowing cities to redesign central streets for reliable bus services and continuous routes for pedestrians using wheelchairs.","why":"アクセスのしやすさに触れているが、指定された立場と逆の理由になっている。"},{"t":"A comprehensive ban could reduce commercial revenue if customers choose suburban shopping centers, placing additional financial pressure on independent retailers in central districts.","why":"同じ政策に関する理由だが、指定されたアクセスのしやすさとは別の観点を述べている。"},{"t":"Central districts contain offices, shops, and public facilities, while municipal transport maps identify roads connecting these locations with surrounding residential and commercial neighborhoods.","why":"制度や対象の事実を説明しているだけで、指定された立場を支える理由を示していない。"},{"t":"A comprehensive ban would restrict accessibility for residents with mobility impairments, who may depend on private vehicles where suitable public transport remains unavailable.","why":"正解。アクセスのしやすさの観点から政策の影響を説明し、反対の立場を支える一般的な理由になっている。"},{"t":"Cities should reject comprehensive prohibitions on private cars in their central districts because banning these vehicles throughout such areas is an undesirable municipal policy.","why":"指定された立場を言い換えているだけで、なぜそうすべきかを説明していない。"},{"t":"When my city closed a central street to private cars last month, I drove my grandfather to a medical appointment via another neighborhood.","why":"特定の個人的な体験にとどまり、指定された立場を支える一般的な理由になっていない。"}],"answer":3,"point":"「アクセスのしやすさ」が政策によってどう変わるかを説明し、反対の立場につながる因果関係を示す。","drive":{"ja":"都市は中心地区全域で自家用車の利用を禁止すべきか。反対の立場で、「アクセスのしやすさ」を使った一般的な理由を英語で一文述べてください。","en":"A comprehensive ban would restrict accessibility for residents with mobility impairments, who may depend on private vehicles where suitable public transport remains unavailable."}},{"id":"p1-reason-005","q":"TOPIC: Should governments require manufacturers to collect used electronic devices?\nPosition: Agree\nPOINT: Resources\nChoose the general reason that supports the position using the specified POINT.","q_ja":"政府は使用済み電子機器の回収を製造業者に義務づけるべきか（賛成）。指定の観点「資源」を使って、この立場を支える一般的な理由を選んでください。","choices":[{"t":"Mandatory collection may waste resources when transporting small quantities of discarded devices over long distances consumes more fuel than existing local recycling arrangements.","why":"資源に触れているが、指定された立場と逆の理由になっている。"},{"t":"Mandatory collection conserves resources by enabling manufacturers to recover valuable metals from discarded devices, reducing their dependence on the extraction of raw materials.","why":"正解。資源の観点から政策の影響を説明し、賛成の立場を支える一般的な理由になっている。"},{"t":"Requiring manufacturers to collect used electronic devices would create employment in regional processing facilities, potentially supporting communities affected by declining demand for traditional manufacturing.","why":"同じ政策に関する理由だが、指定された資源とは別の観点を述べている。"},{"t":"Electronic devices contain several types of metals, and manufacturers publish product specifications that describe the components incorporated into different models of household equipment.","why":"制度や対象の事実を説明しているだけで、指定された立場を支える理由を示していない。"},{"t":"Governments should impose collection requirements on electronics manufacturers because making these companies responsible for collecting used devices is a measure that should be adopted.","why":"指定された立場を言い換えているだけで、なぜそうすべきかを説明していない。"},{"t":"Last spring, I returned an outdated tablet to its manufacturer, and the collection center sent me a receipt describing the recycling service it provided.","why":"特定の個人的な体験にとどまり、指定された立場を支える一般的な理由になっていない。"}],"answer":1,"point":"「資源」が政策によってどう変わるかを説明し、賛成の立場につながる因果関係を示す。","drive":{"ja":"政府は使用済み電子機器の回収を製造業者に義務づけるべきか。賛成の立場で、「資源」を使った一般的な理由を英語で一文述べてください。","en":"Mandatory collection conserves resources by enabling manufacturers to recover valuable metals from discarded devices, reducing their dependence on the extraction of raw materials."}},{"id":"p1-reason-006","q":"TOPIC: Should universities make all lectures available exclusively online?\nPosition: Disagree\nPOINT: Inequality\nChoose the general reason that supports the position using the specified POINT.","q_ja":"大学はすべての講義をオンラインのみで提供すべきか（反対）。指定の観点「格差」を使って、この立場を支える一般的な理由を選んでください。","choices":[{"t":"Moving all lectures online reduces inequality by allowing students living far from campus to participate without bearing the substantial expense of relocation.","why":"格差に触れているが、指定された立場と逆の理由になっている。"},{"t":"Exclusive online lectures may weaken academic interaction, as spontaneous discussions between students and instructors become harder to maintain through scheduled digital sessions.","why":"同じ政策に関する理由だが、指定された格差とは別の観点を述べている。"},{"t":"Online lectures are delivered through digital platforms, which universities incorporate into course catalogs alongside descriptions of assessment methods and required learning materials.","why":"制度や対象の事実を説明しているだけで、指定された立場を支える理由を示していない。"},{"t":"Universities should reject the exclusive online delivery of all lectures because offering every lecture through online platforms is an educational policy worth opposing.","why":"指定された立場を言い換えているだけで、なぜそうすべきかを説明していない。"},{"t":"Exclusive online provision could deepen inequality, since students lacking reliable internet connections or suitable study environments would face additional barriers to participation.","why":"正解。格差の観点から政策の影響を説明し、反対の立場を支える一般的な理由になっている。"},{"t":"When I attended an online economics lecture from my apartment last semester, construction noise interrupted my concentration during the discussion of international trade.","why":"特定の個人的な体験にとどまり、指定された立場を支える一般的な理由になっていない。"}],"answer":4,"point":"「格差」が政策によってどう変わるかを説明し、反対の立場につながる因果関係を示す。","drive":{"ja":"大学はすべての講義をオンラインのみで提供すべきか。反対の立場で、「格差」を使った一般的な理由を英語で一文述べてください。","en":"Exclusive online provision could deepen inequality, since students lacking reliable internet connections or suitable study environments would face additional barriers to participation."}},{"id":"p1-reason-007","q":"TOPIC: Should local governments purchase food for public facilities from nearby producers?\nPosition: Agree\nPOINT: Resilience\nChoose the general reason that supports the position using the specified POINT.","q_ja":"自治体は公共施設向けの食料を近隣の生産者から購入すべきか（賛成）。指定の観点「供給体制の強さ」を使って、この立場を支える一般的な理由を選んでください。","choices":[{"t":"Relying on nearby producers weakens supply resilience when a regional crop failure affects multiple suppliers simultaneously, leaving public facilities with limited alternatives.","why":"供給体制の強さに触れているが、指定された立場と逆の理由になっている。"},{"t":"Purchasing food locally supports agricultural employment by providing nearby producers with predictable demand, helping smaller farms maintain their operations despite competitive market conditions.","why":"同じ政策に関する理由だが、指定された供給体制の強さとは別の観点を述べている。"},{"t":"Public facilities purchase food under procurement contracts, which specify delivery schedules and product categories for suppliers participating in local government purchasing programs.","why":"制度や対象の事実を説明しているだけで、指定された立場を支える理由を示していない。"},{"t":"Local purchasing strengthens supply resilience by reducing dependence on distant distribution networks, which may be disrupted by severe weather or fuel shortages.","why":"正解。供給体制の強さの観点から政策の影響を説明し、賛成の立場を支える一般的な理由になっている。"},{"t":"Local governments should source food for public facilities from nearby producers because adopting this purchasing approach is a municipal policy that deserves implementation.","why":"指定された立場を言い換えているだけで、なぜそうすべきかを説明していない。"},{"t":"After a storm delayed deliveries last autumn, I collected vegetables from a nearby farm for the community center where I was volunteering that week.","why":"特定の個人的な体験にとどまり、指定された立場を支える一般的な理由になっていない。"}],"answer":3,"point":"「供給体制の強さ」が政策によってどう変わるかを説明し、賛成の立場につながる因果関係を示す。","drive":{"ja":"自治体は公共施設向けの食料を近隣の生産者から購入すべきか。賛成の立場で、「供給体制の強さ」を使った一般的な理由を英語で一文述べてください。","en":"Local purchasing strengthens supply resilience by reducing dependence on distant distribution networks, which may be disrupted by severe weather or fuel shortages."}},{"id":"p1-reason-008","q":"TOPIC: Should police be permitted to use facial recognition without independent approval?\nPosition: Disagree\nPOINT: Privacy\nChoose the general reason that supports the position using the specified POINT.","q_ja":"警察による顔認識技術の使用を独立機関の承認なしに認めるべきか（反対）。指定の観点「プライバシー」を使って、この立場を支える一般的な理由を選んでください。","choices":[{"t":"Without independent oversight, facial recognition threatens privacy by enabling authorities to track individuals across public spaces without demonstrating a legitimate investigative need.","why":"正解。プライバシーの観点から政策の影響を説明し、反対の立場を支える一般的な理由になっている。"},{"t":"Allowing police immediate access to facial recognition protects privacy by helping investigators identify relevant suspects without examining extensive personal records belonging to unrelated citizens.","why":"プライバシーに触れているが、指定された立場と逆の理由になっている。"},{"t":"Unrestricted facial recognition may undermine public confidence when inaccurate matches lead to wrongful questioning, damaging cooperation between police departments and the communities they serve.","why":"同じ政策に関する理由だが、指定されたプライバシーとは別の観点を述べている。"},{"t":"Facial recognition systems compare captured images with stored photographs, and police departments describe their technical equipment in documents concerning operational procedures and procurement.","why":"制度や対象の事実を説明しているだけで、指定された立場を支える理由を示していない。"},{"t":"Police should obtain independent approval before using facial recognition because allowing this technology to operate without such authorization is a practice that requires rejection.","why":"指定された立場を言い換えているだけで、なぜそうすべきかを説明していない。"},{"t":"During a visit to a railway station last year, I noticed a facial recognition camera and asked an officer about its stated operational purpose.","why":"特定の個人的な体験にとどまり、指定された立場を支える一般的な理由になっていない。"}],"answer":0,"point":"「プライバシー」が政策によってどう変わるかを説明し、反対の立場につながる因果関係を示す。","drive":{"ja":"警察による顔認識技術の使用を独立機関の承認なしに認めるべきか。反対の立場で、「プライバシー」を使った一般的な理由を英語で一文述べてください。","en":"Without independent oversight, facial recognition threatens privacy by enabling authorities to track individuals across public spaces without demonstrating a legitimate investigative need."}},{"id":"p1-reason-009","q":"TOPIC: Should governments invest more in restoring urban wetlands?\nPosition: Agree\nPOINT: Flooding\nChoose the general reason that supports the position using the specified POINT.","q_ja":"政府は都市部の湿地再生への投資を増やすべきか（賛成）。指定の観点「洪水」を使って、この立場を支える一般的な理由を選んでください。","choices":[{"t":"Restored wetlands could aggravate flooding if poorly planned projects obstruct existing drainage channels, preventing storm water from flowing efficiently away from residential areas.","why":"洪水に触れているが、指定された立場と逆の理由になっている。"},{"t":"Urban wetland restoration supports biodiversity by providing habitats for native species, which often struggle to survive in densely developed areas dominated by concrete surfaces.","why":"同じ政策に関する理由だが、指定された洪水とは別の観点を述べている。"},{"t":"Urban wetlands occupy land within municipal boundaries, and restoration proposals generally include maps showing project locations alongside existing roads, buildings, and drainage infrastructure.","why":"制度や対象の事実を説明しているだけで、指定された立場を支える理由を示していない。"},{"t":"Governments should increase investment in restoring urban wetlands because allocating additional public funds to these restoration projects is an environmental policy that merits support.","why":"指定された立場を言い換えているだけで、なぜそうすべきかを説明していない。"},{"t":"Following heavy rainfall last June, I photographed standing water near a restored wetland and submitted the images to the neighborhood association at its meeting.","why":"特定の個人的な体験にとどまり、指定された立場を支える一般的な理由になっていない。"},{"t":"Wetland restoration alleviates flooding by creating areas that absorb excess rainfall, thereby reducing pressure on drainage systems during periods of intense precipitation.","why":"正解。洪水の観点から政策の影響を説明し、賛成の立場を支える一般的な理由になっている。"}],"answer":5,"point":"「洪水」が政策によってどう変わるかを説明し、賛成の立場につながる因果関係を示す。","drive":{"ja":"政府は都市部の湿地再生への投資を増やすべきか。賛成の立場で、「洪水」を使った一般的な理由を英語で一文述べてください。","en":"Wetland restoration alleviates flooding by creating areas that absorb excess rainfall, thereby reducing pressure on drainage systems during periods of intense precipitation."}},{"id":"p1-reason-010","q":"TOPIC: Should public libraries eliminate their printed collections entirely?\nPosition: Disagree\nPOINT: Inclusion\nChoose the general reason that supports the position using the specified POINT.","q_ja":"公共図書館は印刷資料を全面的に廃止すべきか（反対）。指定の観点「包摂」を使って、この立場を支える一般的な理由を選んでください。","choices":[{"t":"Entirely digital collections promote inclusion by allowing residents with physical disabilities to borrow materials remotely, removing the need to travel to library buildings.","why":"包摂に触れているが、指定された立場と逆の理由になっている。"},{"t":"Eliminating printed collections may weaken cultural preservation because older publications without digital versions could disappear from community institutions that traditionally safeguard local historical records.","why":"同じ政策に関する理由だが、指定された包摂とは別の観点を述べている。"},{"t":"Eliminating printed collections undermines inclusion by excluding residents who lack digital skills, preventing them from independently accessing information through familiar and accessible formats.","why":"正解。包摂の観点から政策の影響を説明し、反対の立場を支える一般的な理由になっている。"},{"t":"Public libraries classify printed collections according to established cataloging systems, while digital materials appear in electronic databases maintained through contracts with publishing companies.","why":"制度や対象の事実を説明しているだけで、指定された立場を支える理由を示していない。"},{"t":"Public libraries should retain printed collections because completely eliminating printed materials from these institutions is an approach to library management that should be rejected.","why":"指定された立場を言い換えているだけで、なぜそうすべきかを説明していない。"},{"t":"When my local library removed several printed reference books last September, I borrowed an older encyclopedia from another branch to complete a family history project.","why":"特定の個人的な体験にとどまり、指定された立場を支える一般的な理由になっていない。"}],"answer":2,"point":"「包摂」が政策によってどう変わるかを説明し、反対の立場につながる因果関係を示す。","drive":{"ja":"公共図書館は印刷資料を全面的に廃止すべきか。反対の立場で、「包摂」を使った一般的な理由を英語で一文述べてください。","en":"Eliminating printed collections undermines inclusion by excluding residents who lack digital skills, preventing them from independently accessing information through familiar and accessible formats."}}],"summary":[{"id":"p1-summary-001","q":"Municipal libraries are expanding their lending services beyond books to include equipment that residents rarely need to own. One district, for instance, lends electric drills for three days at a time. Sharing such goods reduces household expenses and the demand for new products. Nevertheless, maintaining the equipment requires additional staff and funding, which local authorities must secure if these services are to remain dependable.","q_ja":"自治体の図書館は、住民が所有する必要の少ない道具へ貸出対象を広げている。ある地区では電動ドリルを一度に3日間貸している。共有は家計の負担と新品への需要を減らすが、安定したサービスの維持には人員と財源の確保が必要である。","choices":[{"t":"Sharing such goods reduces household expenses and the demand for new products, but maintaining the equipment requires additional staff and funding.","why":"本文の表現をほぼそのままつないでおり、語句を言い換えて要点をまとめていない。"},{"t":"Lending electric drills for three days reduces household spending and demand for new goods, although dependable services require maintenance staff and funding.","why":"電動ドリルと3日間という具体例・数字を残しており、一般化が不十分。"},{"t":"Public lending of household equipment lowers personal costs and resource consumption, but reliable provision depends on sufficient maintenance funding and personnel.","why":"正解。利点と維持条件を両方残し、道具の種類や貸出日数は省く。"},{"t":"Public equipment lending reduces personal expenses and resource use, while membership fees provide the funding needed to maintain dependable services for residents.","why":"維持費を会費で賄うという仕組みは本文にない。"},{"t":"Borrowing equipment enables residents to avoid unnecessary purchases, reducing their household expenses and demand for products that they would otherwise rarely use.","why":"購入抑制の利点だけを述べ、維持に必要な人員と財源を落としている。"},{"t":"Shared equipment services eliminate household purchasing costs and resource waste, requiring only minimal public investment to remain fully dependable for all residents.","why":"費用や資源の無駄をなくす、少額の投資だけで維持できるという断定は本文を超えている。"}],"answer":2,"point":"利点と維持条件を両方残し、道具の種類や貸出日数は省く。","drive":{"ja":"次の段落の要点を英語1文で。道具の公共貸出は家計負担と資源消費を減らすが、安定した運営には維持費と人員が必要である。","en":"Public lending of household equipment lowers personal costs and resource consumption, but reliable provision depends on sufficient maintenance funding and personnel."}},{"id":"p1-summary-002","q":"Some employers now use automated systems to screen job applications, hoping to process large numbers more efficiently. A retailer, for example, used software to assess 800 applicants in a week. However, systems trained on past hiring decisions may reproduce existing inequalities. Independent reviews of their recommendations are therefore necessary to prevent efficiency gains from coming at the expense of fair access to employment.","q_ja":"多数の応募を効率よく処理するため、自動選考システムを導入する雇用主がいる。ある小売企業は1週間で800人を評価した。しかし、過去の採用判断を学習したシステムは既存の不平等を再現する恐れがあり、公平な雇用機会を守るために独立した審査が必要である。","choices":[{"t":"Systems trained on past hiring decisions may reproduce existing inequalities, so independent reviews of their recommendations are necessary to protect access to employment.","why":"本文の語句をほぼそのまま利用し、効率化という利点もまとめていない。"},{"t":"Software assessing 800 retail applicants within a week illustrates faster recruitment, although independent checks remain necessary to prevent unfair treatment of job seekers.","why":"800人、1週間、小売という具体的な情報を残している。"},{"t":"Automated recruitment accelerates application processing, but employers must publish every applicant's personal records so that external specialists can assess the fairness of decisions.","why":"応募者全員の個人記録を公表する義務は本文にない。"},{"t":"Learning from previous hiring decisions exposes recruitment software to inherited inequalities, making independent assessment of its recommendations essential for protecting disadvantaged job seekers.","why":"偏りと審査の必要性だけを扱い、大量の応募を効率よく処理する利点が欠けている。"},{"t":"Automated selection inevitably discriminates against qualified applicants, making external intervention the only possible way to secure equal employment opportunities throughout the entire economy.","why":"必ず差別する、介入が唯一の方法だという断定は本文にない。"},{"t":"Automated recruitment improves processing efficiency, but external oversight is needed to address inherited bias and protect equal opportunities for those seeking work.","why":"正解。効率化の利点と偏りのリスクを、監督の必要性につなげてまとめる。"}],"answer":5,"point":"効率化の利点と偏りのリスクを、監督の必要性につなげてまとめる。","drive":{"ja":"次の段落の要点を英語1文で。採用の自動化は効率を高めるが、過去の偏りを引き継ぐ恐れがあるため、公平性を守る外部の監督が必要である。","en":"Automated recruitment improves processing efficiency, but external oversight is needed to address inherited bias and protect equal opportunities for those seeking work."}},{"id":"p1-summary-003","q":"Coastal communities are restoring wetlands as an alternative to relying entirely on concrete barriers against flooding. In one village, a restored marsh absorbed water during two major storms. Such projects also create habitats for wildlife. Nevertheless, wetlands require considerable space, and their protective effects develop gradually. Consequently, planners should combine restoration with other defenses rather than expect it to provide immediate protection everywhere.","q_ja":"沿岸地域では、洪水対策をコンクリートの防壁だけに頼らず、湿地を再生する動きがある。ある村では再生した湿地が2度の大きな嵐で水を吸収した。生息地も生まれるが、広い土地と時間が必要なため、計画担当者はほかの防御策と組み合わせるべきである。","choices":[{"t":"Wetland restoration supports biodiversity and flood management, but spatial constraints and delayed benefits make its integration with additional protective measures necessary.","why":"正解。効果だけでなく、効果の限界と対策を併用する結論まで残す。"},{"t":"Wetlands require considerable space, and their protective effects develop gradually, so planners should combine restoration with other defenses against flooding in coastal communities.","why":"本文の表現をほぼ写しており、生息地を生む利点も省いている。"},{"t":"A village marsh absorbed floodwater during two major storms and supported wildlife, although restoration requires space, time, and coordination with other coastal defenses.","why":"村と2度の嵐という事例の情報を残している。"},{"t":"Restoring coastal wetlands protects wildlife and reduces flooding, while tourism revenue from the new habitats finances the construction of additional protective coastal barriers.","why":"観光収入で防壁建設の費用を賄うという内容は本文にない。"},{"t":"Restored wetlands provide habitats for wildlife while absorbing excess water, offering coastal communities an alternative to depending entirely on concrete barriers against dangerous flooding.","why":"湿地の利点だけで、土地や時間の制約と対策の併用が抜けている。"},{"t":"Once wetlands are restored, coastal communities receive complete flood protection and permanent wildlife habitats, eliminating the need for concrete defenses or further public investment.","why":"完全な防御が得られ、ほかの対策が不要になるという誇張は本文の結論に反する。"}],"answer":0,"point":"効果だけでなく、効果の限界と対策を併用する結論まで残す。","drive":{"ja":"次の段落の要点を英語1文で。湿地再生は生物多様性と洪水対策に役立つが、土地と時間の制約があり、ほかの防御策との併用が必要である。","en":"Wetland restoration supports biodiversity and flood management, but spatial constraints and delayed benefits make its integration with additional protective measures necessary."}},{"id":"p1-summary-004","q":"Governments sometimes offer subsidies to encourage households to improve the energy efficiency of their homes. For example, a local program covers half the cost of replacing old windows. These measures lower energy consumption, but families with limited savings may still struggle to pay the remaining expense. Unless assistance reflects differences in household income, public spending may primarily benefit residents who could already afford the improvements.","q_ja":"政府は住宅の省エネルギー化を促すために補助金を出すことがある。ある地域では古い窓の交換費用の半分を負担する。省エネには役立つが、貯蓄の少ない世帯は残額を払えない場合がある。所得差を考慮しないと、もともと改修できる住民に公費の恩恵が偏る恐れがある。","choices":[{"t":"These measures lower energy consumption, but families with limited savings may still struggle to pay the remaining expense unless assistance reflects household income.","why":"本文の語句をほぼそのまま使い、十分に言い換えていない。"},{"t":"Covering half the cost of replacing old windows reduces energy use, but households with limited savings may need assistance adjusted to their income levels.","why":"費用の半分と窓の交換という数字・具体例が残っている。"},{"t":"Subsidizing household energy improvements reduces consumption, but assistance should prioritize tenants because property owners recover all renovation costs through higher rents within several years.","why":"借家人の優先や家賃での全額回収は本文にない。"},{"t":"Home efficiency subsidies reduce energy use, yet support must account for financial disparities to avoid disproportionately benefiting households already able to afford renovations.","why":"正解。省エネ効果と受益の偏りをまとめ、所得差を考慮する条件を残す。"},{"t":"Households with limited savings may struggle to cover remaining renovation expenses, even when public subsidies reduce the amount they must pay for home improvements.","why":"支払いの困難だけを扱い、省エネ効果と所得に応じた支援の必要性が欠けている。"},{"t":"Energy renovation subsidies always transfer public funds exclusively to wealthy homeowners, leaving poorer households unable to obtain any benefit regardless of the assistance provided.","why":"必ず富裕層だけが受益し、支援にかかわらず低所得世帯には恩恵がないというのは言い過ぎ。"}],"answer":3,"point":"省エネ効果と受益の偏りをまとめ、所得差を考慮する条件を残す。","drive":{"ja":"次の段落の要点を英語1文で。住宅の省エネ補助金は消費エネルギーを減らすが、改修できる世帯に恩恵が偏らないよう経済格差を考慮した支援が必要である。","en":"Home efficiency subsidies reduce energy use, yet support must account for financial disparities to avoid disproportionately benefiting households already able to afford renovations."}},{"id":"p1-summary-005","q":"Researchers increasingly invite members of the public to collect environmental data. Volunteers in one project recorded bird sightings at 40 locations, extending coverage beyond what professional teams could manage. This participation also strengthens public understanding of science. However, inconsistent recording methods may reduce the reliability of findings. Providing clear instructions and checking submitted observations are therefore essential if broader participation is to produce useful evidence.","q_ja":"研究者は環境データの収集に市民を招くようになっている。ある事業ではボランティアが40か所で鳥の目撃を記録し、専門家だけでは難しい範囲を調べた。科学への理解も深まるが、記録方法が不統一だと信頼性が低下するため、明確な指示と観察記録の確認が必要である。","choices":[{"t":"This participation also strengthens public understanding of science, but inconsistent recording methods may reduce the reliability of findings without clear instructions and observation checks.","why":"本文の語句をほぼそのままつなぎ、調査範囲の拡大もまとめていない。"},{"t":"Public involvement broadens environmental research and scientific understanding, provided that consistent guidance and verification safeguard the quality of information collected by volunteers.","why":"正解。調査と理解の広がりを一般化し、品質を確保する条件を付ける。"},{"t":"Volunteers recording bird sightings at 40 locations expand research coverage and scientific understanding, although clear instructions and checks are necessary to ensure reliable findings.","why":"鳥の目撃と40か所という例・数字を残している。"},{"t":"Citizen involvement extends environmental monitoring and scientific understanding, but reliable findings require volunteers to earn professional qualifications before submitting any observations to research teams.","why":"観察記録を提出する前に専門資格を取得する必要があるとは書かれていない。"},{"t":"Citizen observations extend environmental monitoring beyond the reach of professional teams, allowing researchers to gather evidence from more locations through the participation of volunteers.","why":"調査範囲の拡大だけで、科学への理解と記録の品質管理を落としている。"},{"t":"Public participation guarantees comprehensive environmental evidence and universal scientific understanding, removing the need for professional researchers to inspect observations or provide volunteers with guidance.","why":"網羅的な証拠と全員の理解を保証し、点検も指導も不要だという誇張は本文に反する。"}],"answer":1,"point":"調査と理解の広がりを一般化し、品質を確保する条件を付ける。","drive":{"ja":"次の段落の要点を英語1文で。市民参加は環境研究の範囲と科学への理解を広げるが、一貫した指導と確認によって情報の質を守る必要がある。","en":"Public involvement broadens environmental research and scientific understanding, provided that consistent guidance and verification safeguard the quality of information collected by volunteers."}},{"id":"p1-summary-006","q":"To support struggling rural businesses, a regional authority has moved some administrative offices out of the capital. A new branch employing 60 people has increased spending in nearby shops. Relocation may distribute economic activity more evenly, yet employees sometimes resist moving because their partners cannot find suitable work. Its success therefore depends not only on office investment but also on employment opportunities for accompanying family members.","q_ja":"地方の事業者を支えるため、ある広域行政機関は一部の事務所を中心都市から移した。60人が働く新拠点は近隣商店での支出を増やした。移転は経済活動の分散につながるが、配偶者の仕事が見つからず抵抗する職員もいるため、家族の就業機会も成功に必要である。","choices":[{"t":"Relocation may distribute economic activity more evenly, yet employees sometimes resist moving because their partners cannot find suitable work in areas receiving new offices.","why":"本文の表現をほぼそのまま取り出しており、成功条件の言い換えとして不十分。"},{"t":"Moving a branch with 60 employees increases spending in nearby shops, but accompanying partners need suitable employment if relocation is to achieve its aims.","why":"60人の拠点と近隣商店という具体例を残している。"},{"t":"Administrative relocation distributes economic benefits more widely, but governments must provide permanent wage subsidies to local employers before employees' families will agree to move.","why":"地元企業への恒久的な賃金補助が必要だという条件は本文にない。"},{"t":"Moving administrative workplaces away from the capital increases spending in surrounding businesses, supporting struggling rural economies through the purchases made by newly arrived public employees.","why":"地域への経済効果だけを扱い、配偶者の雇用と移転への抵抗を落としている。"},{"t":"Relocating government offices may spread economic benefits geographically, but effective implementation requires employment prospects for employees' families alongside investment in the offices themselves.","why":"正解。経済活動の分散という目的と、家族の就業機会という成功条件を結ぶ。"},{"t":"Moving public offices invariably revitalizes every rural economy, and creating jobs for accompanying partners completely removes employee resistance to relocation regardless of other personal circumstances.","why":"すべての地域が必ず再生し、家族の雇用だけで抵抗が完全になくなるという断定は過剰。"}],"answer":4,"point":"経済活動の分散という目的と、家族の就業機会という成功条件を結ぶ。","drive":{"ja":"次の段落の要点を英語1文で。行政機関の移転は経済的恩恵を地域に分散させ得るが、施設投資とともに職員の家族の就業機会を確保する必要がある。","en":"Relocating government offices may spread economic benefits geographically, but effective implementation requires employment prospects for employees' families alongside investment in the offices themselves."}},{"id":"p1-summary-007","q":"Some cities publish transport data so that private developers can create services for passengers. One application combines information from 12 bus routes to suggest convenient connections. Opening these records encourages innovation without requiring authorities to design every service themselves. Nevertheless, detailed travel records could reveal individuals' movements. Authorities must therefore remove identifying information before release, balancing the usefulness of shared data against passengers' privacy.","q_ja":"民間開発者が利用者向けサービスを作れるよう、交通データを公開する都市がある。あるアプリは12のバス路線の情報から乗り継ぎを提案する。公開は行政自身がすべてを開発しなくても革新を促すが、詳細な移動記録は個人の行動を明らかにし得るため、公開前に個人を識別できる情報を除く必要がある。","choices":[{"t":"Opening these records encourages innovation without requiring authorities to design every service themselves, but detailed travel records could reveal individuals' movements without privacy safeguards.","why":"本文の語句をほぼ写しており、識別情報を除くという対応もまとめていない。"},{"t":"An application using information from 12 bus routes improves connections, illustrating innovation through shared data that must exclude identifying details to protect passenger privacy.","why":"12路線と乗り継ぎアプリという数字・具体例が残っている。"},{"t":"Publishing transport data promotes private innovation, although authorities must charge developers licensing fees to compensate passengers whose personal travel records are included in shared datasets.","why":"開発者への料金請求と利用者への補償という仕組みは本文にない。"},{"t":"Public transport records enable private developers to suggest convenient connections, encouraging new passenger services without requiring public authorities to design each application with their own staff.","why":"民間のサービス開発という利点だけで、プライバシーへの危険と対処が欠けている。"},{"t":"Publishing transport records inevitably exposes every passenger's movements, making complete secrecy the only effective policy despite the potential advantages of private innovation in passenger services.","why":"全員の移動が必ず露見し、全面非公開しかないという断定は本文の方針に反する。"},{"t":"Sharing transport information stimulates private service development, but authorities must protect individual privacy by removing personal identifiers while preserving the data's practical value.","why":"正解。データ公開の利点とプライバシー保護を両立させる対応を残す。"}],"answer":5,"point":"データ公開の利点とプライバシー保護を両立させる対応を残す。","drive":{"ja":"次の段落の要点を英語1文で。交通情報の共有は民間のサービス開発を促すが、実用性を保ちつつ個人を識別する情報を除き、プライバシーを守る必要がある。","en":"Sharing transport information stimulates private service development, but authorities must protect individual privacy by removing personal identifiers while preserving the data's practical value."}},{"id":"p1-summary-008","q":"International partnerships allow universities with limited resources to share expensive research facilities. Under one agreement, scientists from four institutions use the same advanced microscope. Such cooperation expands access to equipment and encourages the exchange of expertise. However, disputes may arise over ownership of discoveries. Establishing clear rules before research begins is therefore crucial to maintaining trust and ensuring that the benefits of collaboration are fairly distributed.","q_ja":"国際連携によって、資源の限られた大学も高価な研究設備を共同利用できる。ある協定では4機関の研究者が高度な顕微鏡を共有する。設備へのアクセスと専門知識の交流が広がる一方、発見の権利を巡る争いもあり得るため、開始前の明確なルールが信頼と利益の公平な配分に重要である。","choices":[{"t":"Such cooperation expands access to equipment and encourages the exchange of expertise, but disputes may arise over ownership of discoveries without clear rules before research begins.","why":"本文の表現をほぼそのまま組み合わせており、要点を自分の表現に置き換えていない。"},{"t":"Scientists from four institutions share an advanced microscope and expertise through international cooperation, but clear ownership rules are needed beforehand to distribute research benefits fairly.","why":"4機関と顕微鏡という数字・具体例が残っている。"},{"t":"International academic cooperation broadens access to research resources and expertise, but prior agreements on discovery ownership are essential for trust and equitable sharing of benefits.","why":"正解。資源・知識の共有という利点と、権利の事前合意という条件をまとめる。"},{"t":"International university partnerships expand access to equipment and knowledge, but participating institutions must transfer ownership of all discoveries to an independent global agency before research begins.","why":"発見の権利を国際機関へすべて移すという条件は本文にない。"},{"t":"Universities with limited resources gain access to expensive research facilities through international agreements, while scientists exchange expertise by using equipment that their institutions could not otherwise afford.","why":"設備と知識の共有という利点だけで、権利を巡る問題と事前のルールが抜けている。"},{"t":"International research partnerships guarantee equal scientific opportunities for all universities, while advance ownership agreements permanently eliminate every dispute and ensure complete trust among all participating scientific institutions.","why":"すべての大学の平等や、あらゆる争いの永久的な解消を保証するのは言い過ぎ。"}],"answer":2,"point":"資源・知識の共有という利点と、権利の事前合意という条件をまとめる。","drive":{"ja":"次の段落の要点を英語1文で。大学の国際協力は研究資源と専門知識へのアクセスを広げるが、信頼と公平な利益配分には発見の権利に関する事前合意が必要である。","en":"International academic cooperation broadens access to research resources and expertise, but prior agreements on discovery ownership are essential for trust and equitable sharing of benefits."}},{"id":"p1-summary-009","q":"Public agencies increasingly offer essential services through digital platforms, reducing paperwork and travel for many residents. A town, for instance, now accepts housing applications through a website rather than requiring visits to its offices. Nevertheless, people without reliable internet access or sufficient digital skills may find these services harder to use. Retaining personal assistance is therefore necessary to prevent administrative efficiency from widening inequalities in access.","q_ja":"行政機関は重要なサービスをデジタル化し、多くの住民の書類作業や移動を減らしている。ある町では窓口訪問の代わりに住宅の申請をウェブで受け付ける。しかし、安定した通信環境や十分な操作技能のない人には利用が難しくなるため、利用格差を広げないよう対人支援を残す必要がある。","choices":[{"t":"People without reliable internet access or sufficient digital skills may find these services harder to use, so retaining personal assistance is therefore necessary for access.","why":"本文の表現をほぼ写しており、効率化の利点も要約していない。"},{"t":"Online housing applications reduce paperwork and office visits, but residents lacking reliable internet or digital skills still need personal assistance to access these services.","why":"住宅申請と窓口訪問という具体例を残したままで、行政サービス全体に一般化していない。"},{"t":"Digital public services improve administrative efficiency, but agencies must distribute free computers to every resident before replacing office procedures with applications through online platforms.","why":"全住民への無料のコンピューター配布という要件は本文にない。"},{"t":"Residents with reliable internet access avoid office visits and paperwork through digital platforms, making essential administrative procedures more convenient for people with sufficient digital skills.","why":"利用できる人の利便性だけで、利用が難しい人への支援が欠けている。"},{"t":"Digitizing public services streamlines administration for many users, but continued human support is essential to preserve access for residents facing technological barriers.","why":"正解。効率化を認めつつ、技術面で困難を抱える人への支援を残す。"},{"t":"Digital administration inevitably denies essential services to all residents lacking advanced technical expertise, making the complete abandonment of online platforms necessary to secure equal access.","why":"高度な技能がない人は全員利用できず、オンラインを全面廃止すべきだという断定は過剰。"}],"answer":4,"point":"効率化を認めつつ、技術面で困難を抱える人への支援を残す。","drive":{"ja":"次の段落の要点を英語1文で。行政サービスのデジタル化は多くの利用者の手続きを効率化するが、技術的な障壁のある住民の利用を守るため対人支援が必要である。","en":"Digitizing public services streamlines administration for many users, but continued human support is essential to preserve access for residents facing technological barriers."}},{"id":"p1-summary-010","q":"Some governments require producers to take responsibility for products after consumers discard them. Under one scheme, electronics companies pay for collecting used televisions and recovering valuable materials. Shifting disposal costs to manufacturers encourages designs that are easier to repair or recycle. However, compliance may place a heavier burden on smaller firms. Flexible payment arrangements could preserve this environmental incentive while reducing pressure on businesses with fewer resources.","q_ja":"消費者が捨てた製品への責任を生産者に求める政府がある。ある制度では電子機器メーカーが使用済みテレビの回収と有用な素材の再生に費用を払う。処分費用の移転は修理・再資源化しやすい設計を促すが、小規模企業の負担が重くなり得るため、柔軟な支払い方法が環境面の誘因と負担軽減の両立に役立つ。","choices":[{"t":"Producer responsibility encourages sustainable product design, but adaptable payment terms may ease the disproportionate financial strain on smaller firms without weakening environmental incentives.","why":"正解。環境面の誘因と企業規模による負担差を残し、柔軟な支払いで結ぶ。"},{"t":"Shifting disposal costs to manufacturers encourages designs that are easier to repair or recycle, but compliance may place a heavier burden on smaller firms.","why":"本文の語句をほぼそのままつなぎ、柔軟な支払いという対応策も落としている。"},{"t":"Electronics companies funding used television collection and material recovery face incentives to improve designs, while flexible payments could reduce the burden on smaller producers.","why":"電子機器メーカーとテレビ回収という具体例が残っている。"},{"t":"Making producers responsible for discarded goods promotes sustainable design, but governments must exempt smaller firms entirely and recover their unpaid costs through higher consumer taxes.","why":"小規模企業の全面免除や消費者への増税は本文にない。"},{"t":"Manufacturers paying disposal costs have an incentive to design products that are easier to repair or recycle, supporting material recovery after consumers discard unwanted goods.","why":"設計改善の誘因だけを述べ、小規模企業の負担と支払い方法の調整が抜けている。"},{"t":"Producer responsibility completely eliminates waste and guarantees affordable compliance for every company, making additional financial flexibility unnecessary regardless of differences in business size or resources.","why":"廃棄物の全廃と全企業の負担可能性を保証し、柔軟性も不要とするのは本文に反する。"}],"answer":0,"point":"環境面の誘因と企業規模による負担差を残し、柔軟な支払いで結ぶ。","drive":{"ja":"次の段落の要点を英語1文で。生産者責任は持続可能な製品設計を促すが、小規模企業の過重な負担は環境面の誘因を保つ柔軟な支払い条件で軽減し得る。","en":"Producer responsibility encourages sustainable product design, but adaptable payment terms may ease the disproportionate financial strain on smaller firms without weakening environmental incentives."}}],"template":[{"id":"p1-template-001","q":"I am firmly ___ that governments should establish ethical guidelines for technologies capable of influencing public opinion.","q_ja":"私は、世論に影響を及ぼし得る技術に対して、政府が倫理指針を定めるべきだと固く確信している。","choices":[{"t":"committed","why":"「尽力している」という意味で、取り組む対象は通常、前置詞を使って示す。この形では確信を表せない。"},{"t":"convinced","why":"正解。確信していることを表す定型表現で、後ろの節に自分の立場を示せる。"},{"t":"dedicated","why":"「専念している」という意味で、専念する対象を示す前置詞が必要。この形では確信を表せない。"},{"t":"devoted","why":"「献身的な」という意味で、献身の対象を示す前置詞が必要。この形では確信を表せない。"}],"answer":1,"point":"序論では、固く確信していることを表す定型文の後ろに主張を置き、続く二つの本論で根拠を示す。","drive":{"ja":"序論で、政府は世論に影響する技術の倫理指針を定めるべきだと、固い確信を示してください。","en":"I am firmly convinced that governments should establish ethical guidelines for technologies capable of influencing public opinion."}},{"id":"p1-template-002","q":"There are two main ___ why I support allocating more public funding to scientific research that addresses environmental challenges.","q_ja":"環境問題に取り組む科学研究への公的資金の配分増加を私が支持するのには、主に二つの理由がある。","choices":[{"t":"causes","why":"出来事を引き起こす原因を指す。自分の支持理由を後ろの節で示す定型表現には合わない。"},{"t":"factors","why":"結果に影響する要因を指す。自分が支持する理由を示すこの定型表現には合わない。"},{"t":"points","why":"論点や要点を指す。支持する理由を後ろの節で説明するこの形には合わない。"},{"t":"reasons","why":"正解。自分が支持する理由を示す定型表現になり、二つの本論段落を予告できる。"}],"answer":3,"point":"序論の末尾で主な理由が二つあると予告し、本論の第1段落と第2段落で一つずつ説明する。","drive":{"ja":"序論の末尾で、環境問題に取り組む科学研究への公的資金の増加を支持する理由が二つあると予告してください。","en":"There are two main reasons why I support allocating more public funding to scientific research that addresses environmental challenges."}},{"id":"p1-template-003","q":"In ___ of these points, I believe that international cooperation is essential to ensuring equitable access to essential medicines.","q_ja":"これらの論点を踏まえると、必要不可欠な医薬品への公平なアクセスを確保するには国際協力が不可欠だと私は考える。","choices":[{"t":"light","why":"正解。前後の前置詞と組み合わせると「～を踏まえて」という定型表現になり、本論を受けて結論を導ける。"},{"t":"sight","why":"視界を表す名詞。前後の前置詞と組み合わせても、論点を考慮するという意味にはならない。"},{"t":"perspective","why":"視点を表す名詞。この前置詞の組み合わせでは「～を踏まえて」という定型表現にならない。"},{"t":"focus","why":"焦点を表す名詞。この前置詞の組み合わせでは、論点を踏まえて結論を導く表現にならない。"}],"answer":0,"point":"結論では「これらの論点を踏まえて」という定型表現で本論を受け、序論で示した立場を再提示する。","drive":{"ja":"結論で、これらの論点を踏まえると、医薬品への公平なアクセスには国際協力が不可欠だと述べてください。","en":"In light of these points, I believe that international cooperation is essential to ensuring equitable access to essential medicines."}},{"id":"p1-template-004","q":"Taking these arguments into ___, I conclude that public transport should receive sustained investment to reduce dependence on private vehicles.","q_ja":"これらの議論を考慮すると、自家用車への依存を減らすため、公共交通機関に継続的な投資を行うべきだと私は結論づける。","choices":[{"t":"attention","why":"注意を表す名詞。この動詞と前置詞の組み合わせでは「考慮に入れる」という表現にならない。"},{"t":"concern","why":"懸念や関心を表す名詞。この位置では「考慮に入れる」という定型表現を作れない。"},{"t":"account","why":"正解。前の動詞と前置詞に続けると「～を考慮に入れる」という定型表現になる。"},{"t":"regard","why":"配慮を表す名詞だが、この動詞と前置詞の組み合わせでは使わない。"}],"answer":2,"point":"結論の冒頭を「これらの議論を考慮すると」という分詞構文にすると、本論から主張の再提示へつなげられる。","drive":{"ja":"結論で、これらの議論を考慮すると、車への依存を減らすために公共交通への継続的な投資が必要だと述べてください。","en":"Taking these arguments into account, I conclude that public transport should receive sustained investment to reduce dependence on private vehicles."}},{"id":"p1-template-005","q":"On ___, I believe that stricter regulation of personal data is necessary to protect citizens from commercial exploitation.","q_ja":"総合的に判断すると、商業的な搾取から市民を守るには、個人データに関する規制の強化が必要だと私は考える。","choices":[{"t":"equilibrium","why":"均衡を表す名詞だが、この前置詞の後ろでは「総合的に判断すると」という定型表現にならない。"},{"t":"balance","why":"正解。直前の前置詞と組み合わせると、複数の点を比較して下す総合的な判断を示せる。"},{"t":"stability","why":"安定を表す名詞。この位置では、議論を総合して判断するという意味にならない。"},{"t":"proportion","why":"比率や釣り合いを表す名詞。この位置では、総合的な判断を示す定型表現にならない。"}],"answer":1,"point":"結論で総合的な判断を示す定型表現を使うと、検討した論点を受けて自分の立場を再確認できる。","drive":{"ja":"結論で、総合的に判断すると、市民を商業的な搾取から守るために個人データの規制強化が必要だと述べてください。","en":"On balance, I believe that stricter regulation of personal data is necessary to protect citizens from commercial exploitation."}},{"id":"p1-template-006","q":"To ___ up, governments should expand access to vocational education, which enables workers to adapt to technological change.","q_ja":"要約すると、労働者が技術の変化に適応できるよう、政府は職業教育を受ける機会を拡大すべきである。","choices":[{"t":"count","why":"数を数えるという意味。この組み合わせでは、議論を要約して結論を示す表現にならない。"},{"t":"total","why":"合計するという意味。この組み合わせでは、議論を要約する定型表現にならない。"},{"t":"add","why":"足し合わせるという意味。この組み合わせでは、後ろの主張を議論の要約として導入できない。"},{"t":"sum","why":"正解。後ろの語と組み合わせると「要約すると」という定型表現になり、結論の主張を導ける。"}],"answer":3,"point":"結論の冒頭で議論を要約すると示し、主張を再提示する。関係詞の非制限用法で主張の意味を補足できる。","drive":{"ja":"結論で、要約すると、技術の変化に労働者が適応できるよう政府は職業教育の機会を拡大すべきだと述べてください。","en":"To sum up, governments should expand access to vocational education, which enables workers to adapt to technological change."}},{"id":"p1-template-007","q":"In ___, I remain convinced that reducing economic inequality requires not only financial assistance but also investment in education.","q_ja":"結論として、経済格差を縮小するには金銭的な支援だけでなく教育への投資も必要だと、私は引き続き確信している。","choices":[{"t":"conclusion","why":"正解。直前の前置詞と組み合わせると「結論として」という定型表現になり、立場の再提示を導ける。"},{"t":"closure","why":"終結を表す名詞だが、この位置では論述の結論を導く定型表現にならない。"},{"t":"completion","why":"完了を表す名詞。この位置では「結論として」という意味の定型表現にならない。"},{"t":"ending","why":"終わりを表す名詞。この前置詞と組み合わせても、結論を導入する定型表現にはならない。"}],"answer":0,"point":"結論では序論の立場を再提示し、「～だけでなく～も」という構文で本論の二つの観点を簡潔にまとめられる。","drive":{"ja":"結論として、経済格差の縮小には金銭的支援だけでなく教育への投資も必要だと、確信を改めて示してください。","en":"In conclusion, I remain convinced that reducing economic inequality requires not only financial assistance but also investment in education."}},{"id":"p1-template-008","q":"I support greater transparency in public spending on the ___ that citizens are entitled to scrutinize how their taxes are used.","q_ja":"市民には税金の使途を精査する権利があることを根拠に、私は公的支出の透明性を高めることを支持する。","choices":[{"t":"motives","why":"行動の動機を指す名詞。この形では、後ろの節を主張の根拠として導入する定型表現にならない。"},{"t":"causes","why":"出来事の原因を指す名詞。この形では、後ろの節を支持の根拠として導入できない。"},{"t":"grounds","why":"正解。前の前置詞と冠詞、後ろの接続詞を合わせると「～という根拠で」という定型表現になる。"},{"t":"origins","why":"物事の起源を指す名詞。この形では、主張の根拠を示す定型表現にならない。"}],"answer":2,"point":"序論では「～という根拠で」という定型表現により、立場とその基本的な根拠を示せる。本論で根拠を詳しく展開する。","drive":{"ja":"序論で、市民には税金の使途を精査する権利があることを根拠に、公的支出の透明性向上を支持してください。","en":"I support greater transparency in public spending on the grounds that citizens are entitled to scrutinize how their taxes are used."}},{"id":"p1-template-009","q":"Having considered these arguments, I have ___ to the conclusion that international institutions should strengthen their efforts to resolve regional conflicts.","q_ja":"これらの議論を検討した結果、国際機関は地域紛争の解決に向けた取り組みを強化すべきだという結論に私は至った。","choices":[{"t":"arrived","why":"結論に至ることを表す場合、後ろには別の前置詞を用いる。ここにある前置詞とは組み合わせない。"},{"t":"come","why":"正解。後ろの前置詞と名詞句を合わせると「～という結論に至る」という定型表現になる。"},{"t":"reached","why":"結論に達することを表せるが、結論を表す名詞句を直接続けるため、ここにある前置詞が余分になる。"},{"t":"approached","why":"近づくという意味で、対象の名詞句を直接続ける。この形では「結論に至った」を表せない。"}],"answer":1,"point":"結論では、議論を検討済みであることを完了形の分詞構文で示し、「結論に至る」という定型表現につなげられる。","drive":{"ja":"結論で、これらの議論を検討した結果、国際機関は地域紛争の解決に向けた取り組みを強化すべきだという結論に至ったと述べてください。","en":"Having considered these arguments, I have come to the conclusion that international institutions should strengthen their efforts to resolve regional conflicts."}},{"id":"p1-template-010","q":"I firmly believe that maintaining the independence of scientific research is ___ the utmost importance when governments allocate public funds.","q_ja":"政府が公的資金を配分する際、科学研究の独立性を維持することが極めて重要だと、私は固く信じている。","choices":[{"t":"with","why":"付随や手段などを示す前置詞。この位置では、後ろの名詞句と合わせて「極めて重要な」を表せない。"},{"t":"at","why":"地点や水準などを示す前置詞。この名詞句とは組み合わせず、「極めて重要な」という表現にはならない。"},{"t":"by","why":"手段や行為者などを示す前置詞。この位置では、後ろの名詞句と合わせて重要性を表せない。"},{"t":"of","why":"正解。後ろの名詞句と組み合わせると「極めて重要な」という意味になり、重要性を強調できる。"}],"answer":3,"point":"序論では固い信念を示す定型文に、重要性を表す前置詞と抽象名詞の表現を組み合わせ、主張を明確にできる。","drive":{"ja":"序論で、公的資金の配分に際して科学研究の独立性を維持することが極めて重要だと、固い信念を示してください。","en":"I firmly believe that maintaining the independence of scientific research is of the utmost importance when governments allocate public funds."}}]}};

  const g = store.grade;
  addStat(((store.stat[g] ||= {})[it.type] ||= { n: 0, ok: 0, ms: 0 }), correct, ms);
  r.box = correct ? Math.min(r.box + 1, BOX_DAYS.length - 1) : 0;
  r.due = Date.now() + (correct ? BOX_DAYS[r.box] * 864e5 : 10 * 60e3); // 間違えたら10分後から再出題
  r.last = correct ? 1 : 0;
  addStat((store.daily[today()] ||= { n: 0, ok: 0, ms: 0 }), correct, ms);
  save();
}

// ---------- 出題 ----------
function itemsOf(g, type) { return ((DATA[g] || {})[type] || []).map((it) => ({ ...it, type })); }
function allItems(g, types = TYPES) { return types.flatMap((t) => itemsOf(g, t)); }
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function pick(pool, n) {
  const now = Date.now();
  const due = shuffle(pool.filter((it) => store.rec[it.id] && store.rec[it.id].due <= now))
    .sort((a, b) => rec(a.id).box - rec(b.id).box);
  const fresh = shuffle(pool.filter((it) => !store.rec[it.id]));
  const rest = shuffle(pool.filter((it) => store.rec[it.id] && store.rec[it.id].due > now));
  return [...due, ...fresh, ...rest].slice(0, n);
}
function wrongPool(g) { return allItems(g).filter((it) => store.rec[it.id] && store.rec[it.id].last === 0); }

// ---------- 集計 ----------
const pct = (o) => (o && o.n ? Math.round((o.ok / o.n) * 100) + '%' : '—');
const secAvg = (o) => (o && o.n ? (o.ms / o.n / 1000).toFixed(1) + '秒' : '—');
const minutes = (ms) => (ms < 60e3 ? Math.round(ms / 1000) + '秒' : Math.round(ms / 60e3) + '分');
function gradeTotal(g) {
  return Object.values(store.stat[g] || {}).reduce((a, o) => ({ n: a.n + o.n, ok: a.ok + o.ok, ms: a.ms + o.ms }), { n: 0, ok: 0, ms: 0 });
}

// ---------- 画面 ----------
const app = document.getElementById('app');
const h = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let session = null;

function home() {
  stopDrive();
  if (session) clearInterval(session.tick);
  const g = store.grade;
  const pool = allItems(g);
  const seen = pool.filter((it) => store.rec[it.id]).length;
  const wrong = wrongPool(g).length;
  const dueN = pool.filter((it) => store.rec[it.id] && store.rec[it.id].due <= Date.now()).length;
  app.innerHTML = `
    <h1>英検用脳筋ドリル</h1>
    <div class="seg">${Object.entries(GRADES).map(([k, v]) =>
      `<button data-g="${k}" class="${k === g ? 'on' : ''}">${v}</button>`).join('')}</div>
    <div class="stats">
      <div><small>今日</small><b>${(store.daily[today()] || {}).n || 0}問</b><small>正解率 ${pct(store.daily[today()])}<br>${minutes((store.daily[today()] || {}).ms || 0)}</small></div>
      <div><small>${GRADES[g]} 累計</small><b>${pct(gradeTotal(g))}</b><small>${gradeTotal(g).n}回解答<br>平均 ${secAvg(gradeTotal(g))}</small></div>
      <div><small>問題</small><b>${seen}/${pool.length}</b><small>解いた数<br>復習待ち ${dueN}</small></div>
    </div>
    <button class="big" id="mix">おまかせ 10問</button>
    <div class="grid">
      <button class="big sub" id="wrong" ${wrong ? '' : 'disabled'}>間違えた問題 ${wrong}</button>
      <button class="big sub" id="drive">運転中モード</button>
    </div>
    <h2>種類を選んで解く</h2>
    <div class="grid">${TYPES.map((t) => {
      const its = itemsOf(g, t);
      const done = its.filter((it) => store.rec[it.id]);
      const ok = done.filter((it) => store.rec[it.id].last === 1).length;
      const bar = its.length ? Math.round((ok / its.length) * 100) : 0;
      const st = (store.stat[g] || {})[t];
      return `<button class="tile" data-t="${t}" ${its.length ? '' : 'disabled'}>
        <b>${TYPE_INFO[t].name}</b><small>${its.length ? `${done.length}/${its.length}問 ・ 正解率 ${pct(st)}<br>平均 ${secAvg(st)}（目標 ${targetSec(t, g)}秒）` : '準備中'}</small>
        <div class="bar"><i style="width:${bar}%"></i></div></button>`;
    }).join('')}</div>
    <h2>設定</h2>
    <div class="card">
      <div class="row"><span>運転中モード：答える時間</span>
        <select id="pause">${[3, 4, 6, 8, 10, 15].map((s) => `<option ${s == store.set.pause ? 'selected' : ''}>${s}</option>`).join('')}</select> 秒</div>
      <div class="row"><span>読み上げの速さ</span>
        <select id="rate">${[0.8, 0.9, 0.95, 1, 1.1].map((s) => `<option ${s == store.set.rate ? 'selected' : ''}>${s}</option>`).join('')}</select></div>
      <div class="row"><span>英文を読む回数</span>
        <select id="repeat">${[1, 2, 3].map((s) => `<option ${s == store.set.repeat ? 'selected' : ''}>${s}</option>`).join('')}</select></div>
    </div>
    <p class="muted">版 ${h(BUILD)}</p>`;
  app.querySelectorAll('[data-g]').forEach((b) => b.onclick = () => { store.grade = b.dataset.g; save(); home(); });
  app.querySelector('#mix').onclick = () => start(pick(pool, 10), 'おまかせ');
  app.querySelector('#wrong').onclick = () => start(shuffle(wrongPool(g)).slice(0, 10), '間違えた問題');
  app.querySelector('#drive').onclick = () => driveMenu();
  app.querySelectorAll('[data-t]').forEach((b) => b.onclick = () => start(pick(itemsOf(g, b.dataset.t), 10), TYPE_INFO[b.dataset.t].name));
  for (const k of ['pause', 'rate', 'repeat']) app.querySelector('#' + k).onchange = (e) => { store.set[k] = Number(e.target.value); save(); };
}

function start(items, title) {
  if (!items.length) return;
  session = { items, i: 0, ok: 0, title, wrong: [], ms: 0, inTime: 0 };
  question();
  scrollTo(0, 0);
}

function question() {
  const s = session, it = s.items[s.i];
  const order = shuffle(it.choices.map((c, idx) => idx));
  const qHtml = h(it.q).replace(/___/g, '<b style="color:var(--accent)">＿＿＿</b>');
  app.innerHTML = `
    <div class="top"><button id="quit">‹ やめる</button><span class="grow">${h(s.title)} ${s.i + 1}/${s.items.length}</span><span class="timer" id="timer">0秒</span></div>
    <div class="card">
      <div class="label">${TYPE_INFO[it.type].name} — ${TYPE_INFO[it.type].hint}</div>
      <div class="q">${qHtml}</div>
      ${it.q_ja ? `<div class="qja" id="qja" style="display:none">${h(it.q_ja)}</div>` : ''}
    </div>
    <div id="choices">${order.map((idx) => `<button class="choice" data-i="${idx}">${h(it.choices[idx].t)}<div class="why">${h(it.choices[idx].why)}</div></button>`).join('')}</div>
    <div id="after"></div>`;
  const goal = targetSec(it.type, store.grade), t0 = Date.now();
  const timerEl = app.querySelector('#timer');
  const tick = () => {
    const sec = Math.floor((Date.now() - t0) / 1000);
    timerEl.textContent = `${sec}秒 / ${goal}`;
    timerEl.classList.toggle('over', sec > goal);
  };
  tick(); clearInterval(s.tick); s.tick = setInterval(tick, 250);
  app.querySelector('#quit').onclick = home;
  const box = app.querySelector('#choices');
  box.querySelectorAll('.choice').forEach((b) => b.onclick = () => {
    if (box.classList.contains('answered')) return;
    const pickI = Number(b.dataset.i), correct = pickI === it.answer;
    box.classList.add('answered');
    box.querySelector(`[data-i="${it.answer}"]`).classList.add('ok');
    if (!correct) b.classList.add('ng');
    const qja = app.querySelector('#qja'); if (qja) qja.style.display = 'block';
    clearInterval(s.tick);
    const ms = Math.min(Date.now() - t0, MAX_MS), inTime = ms <= goal * 1000;
    s.ms += ms; if (inTime) s.inTime++;
    timerEl.textContent = `${(ms / 1000).toFixed(1)}秒` + (inTime ? ' ✓' : ' 超過');
    timerEl.classList.toggle('over', !inTime);
    grade(it, correct, ms);
    if (correct) s.ok++; else s.wrong.push(it);
    const last = s.i === s.items.length - 1;
    app.querySelector('#after').innerHTML = `
      <div class="point"><b>${correct ? '正解' : '不正解'}</b>　${h(it.point)}</div>
      <div class="footer"><button class="big" id="next">${last ? '結果を見る' : '次へ'}</button></div>`;
    app.querySelector('#next').onclick = () => { if (last) result(); else { s.i++; question(); scrollTo(0, 0); } };
  });
}

function result() {
  const s = session;
  app.innerHTML = `
    <div class="top"><button id="back">‹ ホーム</button><span class="grow">${h(s.title)}</span><span></span></div>
    <div class="result">${s.ok} / ${s.items.length}</div>
    <div class="stats">
      <div><small>正解率</small><b>${Math.round((s.ok / s.items.length) * 100)}%</b></div>
      <div><small>合計時間</small><b>${minutes(s.ms)}</b></div>
      <div><small>1問平均</small><b>${(s.ms / s.items.length / 1000).toFixed(1)}秒</b></div>
      <div><small>目標内</small><b>${s.inTime}/${s.items.length}</b></div>
    </div>
    <p class="muted" style="text-align:center">間違えた問題は、10分後から優先して出ます</p>
    ${s.wrong.length ? `<button class="big" id="retry">間違えた ${s.wrong.length} 問をもう一度</button>` : ''}
    <button class="big sub" id="more">続けて 10問</button>`;
  app.querySelector('#back').onclick = home;
  const r = app.querySelector('#retry'); if (r) r.onclick = () => start(shuffle(s.wrong), 'やり直し');
  app.querySelector('#more').onclick = () => start(pick(allItems(store.grade), 10), 'おまかせ');
}

// ---------- 運転中モード ----------
let drive = null;
const hasTTS = 'speechSynthesis' in window;
const live = new Set(); // 読み上げ中のデータを持ち続ける（iPhone で途中で音が切れるのを防ぐ）
function pickVoice(lang) {
  const v = speechSynthesis.getVoices();
  return v.find((x) => x.lang.replace('_', '-') === lang && x.localService) ||
    v.find((x) => x.lang.replace('_', '-') === lang) || v.find((x) => x.lang.startsWith(lang.slice(0, 2))) || null;
}
function say(text, lang) {
  return new Promise((resolve) => {
    if (!hasTTS || !drive) return resolve(false);
    // 前の読み上げが残っているときだけ取り消す。取り消した直後に話すと iPhone では捨てられることがあるので少し待つ
    const busy = speechSynthesis.speaking || speechSynthesis.pending;
    if (busy) speechSynthesis.cancel();
    if (speechSynthesis.paused) speechSynthesis.resume();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = lang; const v = pickVoice(lang); if (v) u.voice = v;
    u.rate = store.set.rate; u.volume = 1;
    live.add(u);
    let done = false;
    const finish = (ok) => { if (done) return; done = true; live.delete(u); clearTimeout(guard); resolve(ok); };
    u.onstart = () => sayStatus('読み上げ中');
    u.onend = () => { sayStatus('待機'); finish(true); };
    u.onerror = (e) => { sayStatus('エラー: ' + e.error); finish(false); };
    const guard = setTimeout(() => finish(false), text.length * 160 / store.set.rate + 5000); // 終了の合図が来ないときの打ち切り
    // 最初の1回はボタンを押した処理の中で同期的に呼ぶ必要がある（iPhone は、押した直後でないと音を出さない）
    if (busy) setTimeout(() => speechSynthesis.speak(u), 120); else speechSynthesis.speak(u);
  });
}
function sayStatus(t) { const el = document.getElementById('sst'); if (el) el.textContent = '音声: ' + t; }
const wait = (ms) => new Promise((r) => { drive && (drive.timer = setTimeout(r, ms)); if (!drive) r(); });

function driveMenu() {
  const g = store.grade;
  const sel = new Set(store.set.driveTypes || ['reason', 'ja2en', 'template', 'connector', 'collocation']);
  app.innerHTML = `
    <div class="top"><button id="back">‹ ホーム</button><span class="grow">運転中モード（${GRADES[g]}）</span><span></span></div>
    <div class="card">
      <p style="margin-top:0"><b>走り出す前に「スタート」を押してください。</b>あとは画面に触れずに続きます。</p>
      <p class="muted">日本語の問い → ${store.set.pause}秒の間（口に出して答える）→ 英語の模範文 ×${store.set.repeat}。<br>
      画面は点けたままになります。ロックすると止まることがあります。止めるのは停車してから。</p>
    </div>
    <h2>出す種類</h2>
    <div class="card">${TYPES.map((t) => `<label class="row"><span>${TYPE_INFO[t].name}（${itemsOf(g, t).length}）</span>
      <input type="checkbox" data-t="${t}" ${sel.has(t) ? 'checked' : ''}></label>`).join('')}</div>
    <div class="footer"><button class="big" id="go">スタート</button></div>`;
  app.querySelector('#back').onclick = home;
  app.querySelector('#go').onclick = () => {
    const types = [...app.querySelectorAll('[data-t]')].filter((c) => c.checked).map((c) => c.dataset.t);
    store.set.driveTypes = types; save();
    const items = pick(allItems(g, types), 9999);
    if (items.length) runDrive(items); // runDrive は最初の await より前に読み上げを始める
  };
}

async function runDrive(items) {
  drive = { items, i: 0, timer: null, lock: null };
  app.innerHTML = `<div class="drive"><div class="phase" id="ph"></div><div class="text" id="tx"></div>
    <div class="count" id="ct"></div><button class="stop" id="stop">停止</button><div class="sst" id="sst">音声: 準備中</div></div>`;
  document.getElementById('stop').onclick = home;
  // ここまで await を挟まない。ボタンを押した処理の中で最初の読み上げを始めて、iPhone の音声を有効にする
  const first = say('スタートします。', 'ja-JP');
  keepAwake(); // 画面を消さない設定は待たずに進める
  await first;
  const ph = document.getElementById('ph'), tx = document.getElementById('tx'), ct = document.getElementById('ct');
  while (drive && drive.i < drive.items.length) {
    const it = drive.items[drive.i];
    ct.textContent = `${drive.i + 1} 問目 ／ ${TYPE_INFO[it.type].name}`;
    ph.textContent = '問い'; tx.textContent = it.drive.ja;
    await say(it.drive.ja, 'ja-JP'); if (!drive) break;
    ph.textContent = '答えてください'; await wait(store.set.pause * 1000); if (!drive) break;
    ph.textContent = '模範文'; tx.textContent = it.drive.en;
    for (let k = 0; k < store.set.repeat && drive; k++) { await say(it.drive.en, 'en-US'); await wait(900); }
    if (!drive) break;
    drive.i++;
    await wait(800);
  }
  if (drive) { await say('おつかれさまでした。', 'ja-JP'); home(); }
}
async function keepAwake() {
  try { if ('wakeLock' in navigator && drive) drive.lock = await navigator.wakeLock.request('screen'); } catch {}
}
document.addEventListener('visibilitychange', () => { if (drive && document.visibilityState === 'visible') keepAwake(); });
function stopDrive() {
  if (!drive) return;
  clearTimeout(drive.timer);
  try { drive.lock && drive.lock.release(); } catch {}
  drive = null;
  if (hasTTS) speechSynthesis.cancel();
}

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
home();
</script>
</body>
</html>
