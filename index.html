{"t":"offset","why":"「相殺する」という意味で、費用を埋め合わせることは表すが、上回ることまでは表さない。"},{"t":"outnumber","why":"「数で上回る」という意味で、利益と費用の価値を比較するこの文には合わない。"},{"t":"overestimate","why":"「過大評価する」という意味で、利益自体が費用を評価するという不自然な内容になる。"}],"answer":0,"point":"利益が費用や不利益を上回る比較には outweigh を使う。offset は相殺することを表す。","level":3,"accept":["exceed","more than compensate for"],"drive":{"ja":"予防医療の長期的な利益は、最初の数年間は節約額を測定しにくい場合でも、初期費用を上回る可能性がある。","en":"The long-term benefits of preventive healthcare may outweigh its initial costs, even when the savings are difficult to measure during the first few years."},"explain":"主語は長期的利益で、may outweighが費用を上回る可能性、even when節が譲歩を示す。outweighで価値を比較し、短期の負担を認めつつ政策を支持できる。別の言い方: more than compensate for。"},{"id":"p1-vocab_je-004","q":"Stricter regulations would ___（抑制する） industrial pollution, which places a heavy burden on public health systems.","q_ja":"より厳しい規制は、公的医療制度に重い負担をかけている産業公害を抑制するだろう。","choices":[{"t":"detect","why":"「検出する」という意味で、公害の発生や規模を抑えることを表さない。"},{"t":"assess","why":"「評価する」という意味で、公害を抑制することを表さない。"},{"t":"curb","why":"正解。curb は、好ましくない活動や増加を抑制することを表す。"},{"t":"monitor","why":"「監視する」という意味で、公害を継続的に調べることと抑制することは異なる。"}],"answer":2,"point":"curb は公害・排出・過剰な消費などを抑制する政策について使える。","level":2,"accept":["limit","reduce","restrain"],"drive":{"ja":"より厳しい規制は、公的医療制度に重い負担をかけている産業公害を抑制するだろう。","en":"Stricter regulations would curb industrial pollution, which places a heavy burden on public health systems."},"explain":"主語は規制で、would curbが予想される効果、which節が公害の負担を補足する。curbは増大を抑える語で、政策の効果と必要性を併せて論じられる。別の言い方: limit。"},{"id":"p1-vocab_je-005","q":"The decline in rural employment should not ___（～に起因するとされる） automation alone, since changes in consumer demand have also reduced local production.","q_ja":"消費者需要の変化も地域の生産を減少させているため、地方の雇用減少の原因を自動化だけに求めるべきではない。","choices":[{"t":"be assigned to","why":"「～に割り当てられる」という意味で、雇用減少の原因を説明する表現にはならない。"},{"t":"be attributed to","why":"正解。be attributed to は、ある結果が特定の原因によるものとされることを表す。"},{"t":"be committed to","why":"「～に専念する」という意味で、雇用減少を原因に結び付ける表現にはならない。"},{"t":"be converted into","why":"「～に変換される」という意味で、原因についての判断を表さない。"}],"answer":1,"point":"結果を主語にした be attributed to の後ろに、その原因と考えられるものを置く。","level":2,"accept":["be ascribed to","be explained by"],"drive":{"ja":"消費者需要の変化も地域の生産を減少させているため、地方の雇用減少の原因を自動化だけに求めるべきではない。","en":"The decline in rural employment should not be attributed to automation alone, since changes in consumer demand have also reduced local production."},"explain":"主語は雇用減少で、受動態が原因の判断を表し、since節が理由を示す。notとaloneで単一原因への限定を否定し、複数の要因を論じられる。別の言い方: be ascribed to。"},{"id":"p1-vocab_je-006","q":"Access to the research grant is ___（～を条件としている） independent ethical approval, meaning that even highly promising projects cannot receive funding before their review is complete.","q_ja":"その研究助成金の受給は独立した倫理審査での承認を条件としており、非常に有望な計画であっても審査が完了するまでは資金を受け取れない。","choices":[{"t":"consistent with","why":"「～と矛盾しない」という意味で、承認が受給の必須条件であることまでは表さない。"},{"t":"conducive to","why":"「～を促進する」という意味で、承認を条件とする関係を逆に捉えている。"},{"t":"concurrent with","why":"「～と同時に起こる」という意味で、承認が受給の条件であることを表さない。"},{"t":"contingent on","why":"正解。contingent on は、ある事柄の実現が別の条件の成立にかかっていることを表す。"}],"answer":3,"point":"be contingent on は条件への依存を表す。整合性を表す be consistent with と区別する。","level":3,"accept":["conditional on","dependent on","subject to"],"drive":{"ja":"その研究助成金の受給は独立した倫理審査での承認を条件としており、非常に有望な計画であっても審査が完了するまでは資金を受け取れない。","en":"Access to the research grant is contingent on independent ethical approval, meaning that even highly promising projects cannot receive funding before their review is complete."},"explain":"主語は助成金の受給で、isが条件を結び、meaning that以下がその含意を説明する。be contingent onで必須条件を示し、制度の制約を要約できる。別の言い方: be conditional on。"},{"id":"p1-vocab_je-007","q":"A ___（持続可能な） energy policy must meet current demand without exhausting resources needed by future generations.","q_ja":"持続可能なエネルギー政策は、将来の世代が必要とする資源を使い果たすことなく、現在の需要を満たさなければならない。","choices":[{"t":"sustainable","why":"正解。sustainable は、資源などを維持しながら長期的に続けられることを表す。"},{"t":"substantial","why":"「相当な・大規模な」という意味で、将来も維持できることを表さない。"},{"t":"profitable","why":"「利益を生む」という意味で、資源を使い果たさず継続できることを表さない。"},{"t":"renewable","why":"「再生可能な」。a renewable energy policy（再生可能エネルギーの政策）とは言えるが、（持続可能な）の意味にはならない。"}],"answer":0,"point":"sustainable は政策や開発の持続可能性を表す。renewable は資源などが再生可能であることを表す。","level":2,"accept":["environmentally sustainable","ecologically sustainable"],"drive":{"ja":"持続可能なエネルギー政策は、将来の世代が必要とする資源を使い果たすことなく、現在の需要を満たさなければならない。","en":"A sustainable energy policy must meet current demand without exhausting resources needed by future generations."},"explain":"主語は政策で、must meetが義務、without＋動名詞が資源を枯渇させない条件を示す。sustainableで将来も続く性質を表し、世代間の公平を論じられる。別の言い方: capable of being sustained。"},{"id":"p1-vocab_je-008","q":"Healthcare costs ___（～を占める） a growing share of public spending, leaving less money available for infrastructure unless tax revenue also increases.","q_ja":"医療費が公的支出に占める割合は増大しており、税収も増加しない限り、インフラに使える資金は少なくなる。","choices":[{"t":"allow for","why":"「～を考慮に入れる」という意味で、公的支出の中の割合を表さない。"},{"t":"account to","why":"割合を占める意味では account for を使う。account to は前置詞が違う。"},{"t":"account for","why":"正解。account for は、全体のうち特定の割合を占めることを表す。"},{"t":"result from","why":"「～に起因する」という意味で、支出の構成比を表さない。"}],"answer":2,"point":"account for a share of で「～の一部を占める」。account for には「説明する」という意味もある。","level":2,"accept":["represent","constitute","make up"],"drive":{"ja":"医療費が公的支出に占める割合は増大しており、税収も増加しない限り、インフラに使える資金は少なくなる。","en":"Healthcare costs account for a growing share of public spending, leaving less money available for infrastructure unless tax revenue also increases."},"explain":"主語は医療費で、account forが割合、leaving以下が結果、unless節が例外条件を示す。a growing shareで構成比の上昇を表し、予算の圧迫を説明できる。別の言い方: make up。"},{"id":"p1-vocab_je-009","q":"Policymakers must ___（両立させる） economic growth with environmental protection, ensuring that measures to increase national income do not deplete the natural resources on which future prosperity depends.","q_ja":"政策立案者は、国民所得を増やす施策が将来の繁栄を支える天然資源を枯渇させないようにしながら、経済成長と環境保護を両立させなければならない。","choices":[{"t":"associate","why":"「関連付ける」という意味で、二つの目標の対立を調整して両立させることまでは表さない。"},{"t":"reconcile","why":"正解。reconcile A with B は、対立し得る二つの目標などを両立させることを表す。"},{"t":"equate","why":"「同一視する」という意味で、異なる目標を両立させることとは異なる。"},{"t":"replace","why":"「置き換える」という意味で、経済成長を環境保護に替えることになり、両方を実現する意味にならない。"}],"answer":1,"point":"reconcile A with B は対立の調整を含む。「関連付ける」だけの associate A with B と区別する。","level":3,"accept":["balance","harmonize","harmonise"],"drive":{"ja":"政策立案者は、国民所得を増やす施策が将来の繁栄を支える天然資源を枯渇させないようにしながら、経済成長と環境保護を両立させなければならない。","en":"Policymakers must reconcile economic growth with environmental protection, ensuring that measures to increase national income do not deplete the natural resources on which future prosperity depends."},"explain":"主語は政策立案者で、mustが必要性、ensuring以下が資源を守る配慮を補足する。reconcile A with Bで対立する目標の調整を示し、両立策を論じられる。別の言い方: harmonize A with B。"},{"id":"p1-vocab_je-010","q":"Tax relief provides an ___（動機付けとなるもの） for companies to invest in equipment that reduces carbon emissions.","q_ja":"税負担の軽減は、企業が炭素排出量を削減する設備に投資する動機付けとなる。","choices":[{"t":"obligation","why":"「義務」という意味で、投資を促す動機付けとは異なる。"},{"t":"indication","why":"「兆候・指標」という意味で、企業の投資を促すものを表さない。"},{"t":"innovation","why":"「革新」という意味で、投資する理由となる誘因を表さない。"},{"t":"incentive","why":"正解。incentive は、利益などによって行動を促す動機付けや誘因を表す。"}],"answer":3,"point":"provide an incentive for A to do で「Aが～する動機付けを与える」。税制の効果を説明できる。","level":1,"accept":["inducement","economic incentive"],"drive":{"ja":"税負担の軽減は、企業が炭素排出量を削減する設備に投資する動機付けとなる。","en":"Tax relief provides an incentive for companies to invest in equipment that reduces carbon emissions."},"explain":"主語は減税で、providesが誘因を与え、for companiesが投資する主体を示す。incentive for A to doで行動を促す仕組みを説明し、税制の効果を論じられる。別の言い方: inducement。"},{"id":"p1-vocab_je-011","q":"For regions with limited public funds, shared transport services may offer a ___（実行可能な） alternative to maintaining bus routes with very few passengers.","q_ja":"公的資金が限られている地域では、共同利用型の交通サービスが、乗客の非常に少ないバス路線を維持することに代わる実行可能な選択肢となる可能性がある。","choices":[{"t":"viable","why":"正解。viable は、計画や選択肢が実際に機能し、実行できる見込みがあることを表す。"},{"t":"visible","why":"「目に見える」という意味で、選択肢を実行できるかどうかを表さない。"},{"t":"variable","why":"「変わりやすい」という意味で、実行可能性を表さない。"},{"t":"vulnerable","why":"「影響や被害を受けやすい」という意味で、実行可能な選択肢という意味にならない。"}],"answer":0,"point":"viable alternative は「実行可能な代替案」。政策を現実に運用できるか論じる際に使える。","level":2,"accept":["feasible","workable","practical"],"drive":{"ja":"公的資金が限られている地域では、共同利用型の交通サービスが、乗客の非常に少ないバス路線を維持することに代わる実行可能な選択肢となる可能性がある。","en":"For regions with limited public funds, shared transport services may offer a viable alternative to maintaining bus routes with very few passengers."},"explain":"主語は共同交通サービスで、may offerが可能性、冒頭のFor句が対象地域を示す。alternative toのtoは前置詞なので動名詞を続け、現実的な代案を提示できる。別の言い方: workable。"},{"id":"p1-vocab_je-012","q":"Repeated failures to explain how personal data are used may ___（損なう） public trust in digital health services, even if those services improve access to treatment.","q_ja":"個人データの利用方法について説明を怠ることが繰り返されれば、デジタル医療サービスが治療を受けやすくしていても、そのサービスに対する国民の信頼を損なう可能性がある。","choices":[{"t":"underestimate","why":"「過小評価する」という意味で、信頼そのものを弱めることを表さない。"},{"t":"underlie","why":"「根底にある」という意味で、信頼の基盤を崩すことを表さない。"},{"t":"undermine","why":"正解。undermine は、信頼や権威などの基盤を弱めて損なうことを表す。"},{"t":"undervalue","why":"「価値を低く見積もる」という意味で、信頼を失わせる作用を表さない。"}],"answer":2,"point":"undermine trust は「信頼を損なう」。underestimate は程度、undervalue は価値を低く評価することを表す。","level":3,"accept":["erode","weaken","damage"],"drive":{"ja":"個人データの利用方法について説明を怠ることが繰り返されれば、デジタル医療サービスが治療を受けやすくしていても、そのサービスに対する国民の信頼を損なう可能性がある。","en":"Repeated failures to explain how personal data are used may undermine public trust in digital health services, even if those services improve access to treatment."},"explain":"主語は説明の度重なる不履行で、may undermineが影響、even if節が譲歩を示す。undermineで信頼の基盤を弱めることを表し、利点を認めつつリスクを論じられる。別の言い方: erode。"},{"id":"p1-vocab_je-201","q":"Public investment should ___（促進する） economic growth while ensuring that its benefits reach disadvantaged communities.","q_ja":"公共投資は、その恩恵が恵まれない地域にも届くようにしつつ、経済成長を促進すべきだ。","choices":[{"t":"postpone","why":"「延期する」という意味で、経済成長を促進するという指定に合わない。"},{"t":"promote","why":"正解。promote economic growth で「経済成長を促進する」を表す。"},{"t":"prescribe","why":"「処方する・規定する」という意味で、成長を促進することは表さない。"},{"t":"inhibit","why":"「抑制する」という意味で、成長を促進するという指定とは逆になる。"}],"answer":1,"point":"promote は「促進する」。経済成長や国際協力など、望ましい変化を進めるときに使う。","level":1,"accept":["encourage","stimulate"],"drive":{"ja":"公共投資は、その恩恵が恵まれない地域にも届くようにしつつ、経済成長を促進すべきだ。","en":"Public investment should promote economic growth while ensuring that its benefits reach disadvantaged communities."},"explain":"主語は公共投資、動詞はshould promoteで、while以下は並行する配慮を示す。promote＋名詞で望ましい変化を表し、政策の効果を論じられる。別の言い方: stimulate economic growth"},{"id":"p1-vocab_je-202","q":"Governments should ___（禁止する） the sale of products containing chemicals that threaten public health.","q_ja":"政府は、公衆衛生を脅かす化学物質を含む製品の販売を禁止すべきだ。","choices":[{"t":"permit","why":"「許可する」という意味で、禁止するという指定とは逆になる。"},{"t":"prolong","why":"「長引かせる」という意味で、販売を禁止することは表さない。"},{"t":"propose","why":"「提案する」という意味で、販売そのものを禁止することは表さない。"},{"t":"prohibit","why":"正解。prohibit the sale of で「〜の販売を禁止する」を表す。"}],"answer":3,"point":"prohibit は行為を「禁止する」。prohibit the sale of の形で販売禁止を表せる。","level":1,"accept":["ban","forbid"],"drive":{"ja":"政府は、公衆衛生を脅かす化学物質を含む製品の販売を禁止すべきだ。","en":"Governments should prohibit the sale of products containing chemicals that threaten public health."},"explain":"主語は政府、動詞はshould prohibitで、後ろは販売を禁止する対象を示す。prohibit＋名詞は規制の提案に使え、分詞句と関係節で製品を絞る。別の言い方: ban the sale of"},{"id":"p1-vocab_je-204","q":"Investment in ___（再生可能な） energy sources reduces dependence on fossil fuels and strengthens energy security.","q_ja":"再生可能なエネルギー源への投資は、化石燃料への依存を減らし、エネルギー安全保障を強化する。","choices":[{"t":"replaceable","why":"「交換可能な」という意味で、自然に補充されるエネルギー源という意味ではない。"},{"t":"recoverable","why":"「回収可能な」という意味で、資源が自然に再生することは表さない。"},{"t":"renewable","why":"正解。renewable energy sources は太陽光や風力などの「再生可能なエネルギー源」。"},{"t":"refundable","why":"「払い戻し可能な」という意味で、エネルギー源の再生可能性は表さない。"}],"answer":2,"point":"renewable energy は「再生可能エネルギー」。replaceable（交換可能な）と区別する。","level":1,"accept":["naturally replenished"],"drive":{"ja":"再生可能なエネルギー源への投資は、化石燃料への依存を減らし、エネルギー安全保障を強化する。","en":"Investment in renewable energy sources reduces dependence on fossil fuels and strengthens energy security."},"explain":"主語は投資で、reducesとstrengthensをandで並べて二つの効果を述べる。renewableは資源が自然に補充される性質を示し、環境政策の説明に使える。別の言い方: naturally replenished"},{"id":"p1-vocab_je-205","q":"A shared digital platform would ___（円滑にする） coordination among public agencies, allowing them to exchange information without repeated requests.","q_ja":"共通のデジタル基盤があれば、公的機関同士の連携が円滑になり、依頼を繰り返さずに情報を交換できるようになるだろう。","choices":[{"t":"accelerate","why":"「加速させる」という速度の意味で、連携をしやすくするという指定とは異なる。"},{"t":"initiate","why":"「開始する」という意味で、連携を円滑にすることは表さない。"},{"t":"regulate","why":"「規制する・統制する」という意味で、連携をしやすくすることは表さない。"},{"t":"facilitate","why":"正解。facilitate coordination で「連携を円滑にする」を表す。"}],"answer":3,"point":"facilitate は手続きや協力を「容易にする・円滑にする」。単に速度を上げる accelerate と区別する。","level":2,"accept":["ease","smooth"],"drive":{"ja":"共通のデジタル基盤があれば、公的機関同士の連携が円滑になり、依頼を繰り返さずに情報を交換できるようになるだろう。","en":"A shared digital platform would facilitate coordination among public agencies, allowing them to exchange information without repeated requests."},"explain":"主語は共通基盤で、wouldは導入時の見込み、allowing以下は結果を示す。facilitate＋名詞で連携を容易にする効果を述べ、施策の利点を論じられる。別の言い方: make coordination easier"},{"id":"p1-vocab_je-207","q":"When evaluating a proposed railway, policymakers should ___（考慮に入れる） its effects on rural communities as well as its expected financial returns.","q_ja":"計画中の鉄道を評価する際、政策担当者は、予想される経済的な収益だけでなく、地方の地域社会への影響も考慮に入れるべきだ。","choices":[{"t":"take into account","why":"正解。take into account の後ろに、判断の際に考慮する要素を置く。"},{"t":"take advantage of","why":"「利用する」という意味で、影響を考慮に入れることは表さない。"},{"t":"take issue with","why":"「異議を唱える」という意味で、影響を判断材料に含めることとは異なる。"},{"t":"take pride in","why":"「誇りに思う」という意味で、影響を考慮することは表さない。"}],"answer":0,"point":"take into account は「考慮に入れる」。費用以外の社会的影響も評価するときに使える。","level":2,"accept":["consider","take into consideration"],"drive":{"ja":"計画中の鉄道を評価する際、政策担当者は、予想される経済的な収益だけでなく、地方の地域社会への影響も考慮に入れるべきだ。","en":"When evaluating a proposed railway, policymakers should take into account its effects on rural communities as well as its expected financial returns."},"explain":"主語は政策担当者で、When以下は評価時、should以下は提言を示す。take into accountで判断材料を示し、as well asで収益以外の影響も加えて評価を広げられる。別の言い方: consider"},{"id":"p1-vocab_je-208","q":"Without independent verification, even widely trusted news platforms remain ___（影響を受けやすい） coordinated misinformation campaigns that exploit public anxiety during national emergencies.","q_ja":"独立した検証がなければ、広く信頼されているニュース配信基盤でさえ、国家的な緊急事態の際に国民の不安につけ込む組織的な偽情報活動の影響を受けやすいままだ。","choices":[{"t":"compatible with","why":"「両立できる・適合する」という意味で、偽情報の影響を受けやすいことは表さない。"},{"t":"dependent on","why":"「依存している」という意味で、外部からの悪影響への弱さとは異なる。"},{"t":"susceptible to","why":"正解。susceptible to は、働きかけや悪影響を「受けやすい」という意味。"},{"t":"resistant to","why":"「抵抗力がある」という意味で、影響を受けやすいという指定とは逆になる。"}],"answer":2,"point":"susceptible to は「〜の影響を受けやすい」。to の後ろに影響の原因となる名詞を置く。","level":3,"accept":["vulnerable to","easily affected by"],"drive":{"ja":"独立した検証がなければ、広く信頼されているニュース配信基盤でさえ、国家的な緊急事態の際に国民の不安につけ込む組織的な偽情報活動の影響を受けやすいままだ。","en":"Without independent verification, even widely trusted news platforms remain susceptible to coordinated misinformation campaigns that exploit public anxiety during national emergencies."},"explain":"主語は報道基盤、動詞はremainで、Without句が検証を欠く条件を示す。remain＋形容詞で弱さの持続を述べ、susceptible toで情報対策の必要性を論じられる。別の言い方: vulnerable to"},{"id":"p1-vocab_je-210","q":"Before approving a new treatment, regulators require manufacturers to ___（裏付ける） their claims about its safety with evidence from independently reviewed clinical trials.","q_ja":"新たな治療法を承認する前に、規制当局は製造業者に対し、独立した審査を受けた臨床試験の証拠によって、その安全性に関する主張を裏付けるよう求める。","choices":[{"t":"ascertain","why":"「確かめる」という意味で、主張を証拠によって裏付ける行為そのものは表さない。"},{"t":"formulate","why":"主張などを「まとめる・明確に述べる」という意味で、証拠で支えることとは異なる。"},{"t":"extrapolate","why":"既知の情報から未知のことを「推定する」という意味で、主張を証拠で裏付けることとは異なる。"},{"t":"substantiate","why":"正解。substantiate a claim with evidence で「証拠によって主張を裏付ける」を表す。"}],"answer":3,"point":"substantiate は証拠を示して「裏付ける」。主張を述べる段階と、その根拠を示す段階を区別する。","level":3,"accept":["support","back up"],"drive":{"ja":"新たな治療法を承認する前に、規制当局は製造業者に対し、独立した審査を受けた臨床試験の証拠によって、その安全性に関する主張を裏付けるよう求める。","en":"Before approving a new treatment, regulators require manufacturers to substantiate their claims about its safety with evidence from independently reviewed clinical trials."},"explain":"主語は規制当局、動詞はrequireで、Before以下は承認前という時を示す。require A to Vで業者への要求を述べ、with以下で裏付けの証拠を示せる。別の言い方: back up their claims"},{"id":"p1-vocab_je-211","q":"Water pricing should encourage factories to ___（節約する） water without reducing essential industrial production.","q_ja":"水道料金の設定は、不可欠な工業生産を減らすことなく、工場に節水を促すものであるべきだ。","choices":[{"t":"consume","why":"「消費する」という意味で、水の使用量を抑えるという指定の意味にはならない。"},{"t":"conserve","why":"正解。資源を無駄にせず節約するという意味で、節水を促す文に合う。"},{"t":"reserve","why":"「取っておく・確保する」という意味で、日々の使用量を節約することとは異なる。"},{"t":"circulate","why":"「循環させる」という意味で、節約すること自体を表す語ではない。"}],"answer":1,"point":"conserve は水やエネルギーなどの資源を無駄にせず使うことを表す。","level":1,"accept":["save","use less"],"drive":{"ja":"水道料金の設定は、不可欠な工業生産を減らすことなく、工場に節水を促すものであるべきだ。","en":"Water pricing should encourage factories to conserve water without reducing essential industrial production."},"explain":"主語は料金設定で、should encourageが提言、without以下が生産を減らさない条件を示す。encourage＋人＋to doで施策が促す行動を述べられる。別の言い方: save water"},{"id":"p1-vocab_je-212","q":"Public spending decisions should be ___（透明性のある） so that citizens understand how taxes are used.","q_ja":"市民が税金の使途を理解できるように、公的支出の決定には透明性があるべきだ。","choices":[{"t":"confidential","why":"「機密の」という意味で、情報を市民に明らかにするという文意に反する。"},{"t":"transitional","why":"「移行期の」という意味で、形は似ているが透明性を表さない。"},{"t":"transferable","why":"「移転・譲渡できる」という意味で、形は似ているが意思決定の透明性とは異なる。"},{"t":"transparent","why":"正解。意思決定や手続きについて、情報が明らかで透明性があることを表す。"}],"answer":3,"point":"transparent は物の「透明な」だけでなく、政策や手続きの「透明性のある」にも使う。","level":1,"accept":["open and clear","open to public scrutiny"],"drive":{"ja":"市民が税金の使途を理解できるように、公的支出の決定には透明性があるべきだ。","en":"Public spending decisions should be transparent so that citizens understand how taxes are used."},"explain":"支出の決定を主語に性質を述べ、so that節が目的、how節が理解の内容を示す。be transparentは政策に必要な透明性を論じるのに使える。別の言い方: be open to public scrutiny"},{"id":"p1-vocab_je-213","q":"Regular training helps employees ___（適応する） technological changes that affect the skills required in their industries.","q_ja":"定期的な研修は、従業員が、自分たちの業界で必要とされる技能に影響を及ぼす技術の変化に適応する助けとなる。","choices":[{"t":"adapt to","why":"正解。adapt to は変化や新しい環境に適応することを表す。"},{"t":"adapt for","why":"adapt for は特定の用途向けに何かを改変する場合に使い、ここでは変化に適応する意味にならない。"},{"t":"respond to","why":"「〜に対応する・反応する」という意味で、変化に合わせて自らを適応させることを直接表す語ではない。"},{"t":"adopt new","why":"adopt は「採用する」であり、new を添えても既存の変化に適応するという意味にはならない。"}],"answer":0,"point":"adapt to の to は前置詞で、後ろに変化や環境を表す名詞を置く。","level":1,"accept":["adjust to","become accustomed to"],"drive":{"ja":"定期的な研修は、従業員が、自分たちの業界で必要とされる技能に影響を及ぼす技術の変化に適応する助けとなる。","en":"Regular training helps employees adapt to technological changes that affect the skills required in their industries."},"explain":"研修が主語で、helps以下が従業員への効果、that節が変化を修飾する。help＋人＋動詞の原形で支援の効果を示し、adapt toで変化への適応を述べる。別の言い方: adjust to"},{"id":"p1-vocab_je-214","q":"A ___（不足） of affordable housing forces many essential workers to live far from their workplaces.","q_ja":"手頃な価格の住宅の不足により、多くの社会に不可欠な仕事を担う人々が職場から遠く離れて暮らさざるを得なくなっている。","choices":[{"t":"surplus","why":"「余剰」という意味で、住宅が足りないという指定の意味と逆になる。"},{"t":"shortcoming","why":"「欠点・短所」という意味で、住宅の供給量が足りないことは表さない。"},{"t":"shortage","why":"正解。a shortage of で、必要な物や人の不足を表す。"},{"t":"reduction","why":"「減少・削減」という意味で、必要量に足りない状態を直接表す語ではない。"}],"answer":2,"point":"a shortage of の後ろに不足している物や人を置く。減少と不足は区別する。","level":1,"accept":["lack","scarcity"],"drive":{"ja":"手頃な価格の住宅の不足により、多くの社会に不可欠な仕事を担う人々が職場から遠く離れて暮らさざるを得なくなっている。","en":"A shortage of affordable housing forces many essential workers to live far from their workplaces."},"explain":"住宅不足が主語で、forces以下が労働者への影響を示す。a shortage ofで問題の原因を名詞句にまとめ、force＋人＋to doで不本意な結果を論じられる。別の言い方: a lack of affordable housing"},{"id":"p1-vocab_je-215","q":"Independent reviews strengthen ___（説明責任） by requiring public officials to explain their decisions and answer for the consequences.","q_ja":"独立した審査は、公務員に決定の理由を説明し、その結果について責任を負うことを求めることで、説明責任を強化する。","choices":[{"t":"credibility","why":"「信頼性」という意味で、判断の説明や結果に対する責任という仕組み自体は表さない。"},{"t":"accountability","why":"正解。決定や行為について説明し、その結果に責任を負う義務を表す。"},{"t":"transparency","why":"「透明性」という意味で、情報の公開に焦点があり、結果への責任まで表す語ではない。"},{"t":"responsibility","why":"一般的な「責任・職務」を表し、ここで指定された、説明して責任を問われることを特に表す語とは異なる。"}],"answer":1,"point":"accountability は単なる担当責任にとどまらず、判断を説明し結果に責任を負うことを表す。","level":2,"accept":["public accountability","official accountability"],"drive":{"ja":"独立した審査は、公務員に決定の理由を説明し、その結果について責任を負うことを求めることで、説明責任を強化する。","en":"Independent reviews strengthen accountability by requiring public officials to explain their decisions and answer for the consequences."},"explain":"審査が主語、strengthenが動詞で、by以下が手段を示す。require＋人＋to doで要求を示し、説明責任を強める仕組みを論じられる。別の言い方: answerability"},{"id":"p1-vocab_je-216","q":"Households without savings are particularly ___（影響を受けやすい） to sudden increases in energy prices, which absorb a large share of their income.","q_ja":"貯蓄のない世帯は、所得の大きな割合を占めるエネルギー価格の急上昇の影響を、特に受けやすい。","choices":[{"t":"resilient","why":"「回復力がある」という意味で、悪影響を受けやすいという指定の意味にはならない。"},{"t":"sensitive about","why":"sensitive about は気にしている事柄に使い、さらに後ろの to ともつながらない。"},{"t":"vulnerable","why":"正解。vulnerable to は外部の変化などによって害や悪影響を受けやすいことを表す。"},{"t":"dependent","why":"「依存している」という意味で通常 on を伴い、悪影響を受けやすいことは表さない。"}],"answer":2,"point":"vulnerable to は危険や経済的変化に対する弱さを述べる際に使える。","level":2,"accept":["exposed","sensitive"],"drive":{"ja":"貯蓄のない世帯は、所得の大きな割合を占めるエネルギー価格の急上昇の影響を、特に受けやすい。","en":"Households without savings are particularly vulnerable to sudden increases in energy prices, which absorb a large share of their income."},"explain":"世帯が主語で、are以下が弱さを述べ、which節が値上がりの影響を補足する。vulnerable toで悪影響の原因を示せるため、支援が必要な層の説明に使える。別の言い方: susceptible to harm from"},{"id":"p1-vocab_je-217","q":"Before entering clinical use, new medical devices must ___（受ける） independent safety testing to identify risks that manufacturers may have overlooked.","q_ja":"新しい医療機器は、製造業者が見落とした可能性のあるリスクを特定するため、臨床で使用される前に独立した安全性試験を受けなければならない。","choices":[{"t":"undertake","why":"「引き受けて実施する」という意味で、機器が試験を実施する側になってしまう。"},{"t":"undertake to","why":"「〜すると約束する」の後ろには動詞の原形が必要で、ここで名詞の testing にはつながらない。"},{"t":"oversee","why":"「監督する」という意味で、医療機器が試験を受けるという関係を表せない。"},{"t":"undergo","why":"正解。undergo は検査や変化などを受けることで、医療機器が試験の対象となる文に合う。"}],"answer":3,"point":"undergo testing は「試験を受ける」。undertake は実施する側を主語にする。","level":2,"accept":["be subjected to","go through"],"drive":{"ja":"新しい医療機器は、製造業者が見落とした可能性のあるリスクを特定するため、臨床で使用される前に独立した安全性試験を受けなければならない。","en":"Before entering clinical use, new medical devices must undergo independent safety testing to identify risks that manufacturers may have overlooked."},"explain":"機器が主語で、mustが義務、Before以下が時期、to identify以下が目的を示す。undergo testingは試験対象を主語にでき、安全対策の論述に使える。別の言い方: go through testing"},{"id":"p1-vocab_je-218","q":"Economic growth achieved ___（〜を犠牲にして） environmental protection may create immediate profits while leaving future generations with substantial costs for restoring damaged ecosystems.","q_ja":"環境保護を犠牲にして達成される経済成長は、当面の利益を生む一方で、損なわれた生態系の回復にかかる多額の費用を将来世代に残す可能性がある。","choices":[{"t":"at the expense of","why":"正解。利益を得る代わりに別の大切なものを損なう関係を表す。"},{"t":"in the absence of","why":"「〜がない状態で」という意味で、不在を表すだけでは、成長のために保護を犠牲にする関係を示せない。"},{"t":"in the light of","why":"「〜を踏まえて」という意味で、環境保護を損なうという指定の意味にはならない。"},{"t":"on the basis of","why":"「〜に基づいて」という意味で、環境保護を犠牲にする関係とは異なる。"}],"answer":0,"point":"at the expense of は、一方の利益のために他方を犠牲にする場合に使う。","level":3,"accept":["at the cost of","by sacrificing"],"drive":{"ja":"環境保護を犠牲にして達成される経済成長は、当面の利益を生む一方で、損なわれた生態系の回復にかかる多額の費用を将来世代に残す可能性がある。","en":"Economic growth achieved at the expense of environmental protection may create immediate profits while leaving future generations with substantial costs for restoring damaged ecosystems."},"explain":"経済成長が主語で、achieved以下が成長を修飾し、while以下が利益と将来負担を対比する。at the expense ofで利益に伴う犠牲を示し、政策の代償を論じられる。別の言い方: at the cost of"},{"id":"p1-vocab_je-219","q":"Stable research funding may ___（〜を促すのに役立つ） scientific innovation by allowing teams to pursue uncertain projects whose practical benefits might take years to emerge.","q_ja":"安定した研究資金は、実用的な利益が現れるまで何年もかかるかもしれない不確実な研究にチームが取り組めるようにすることで、科学的な革新を促すのに役立つ可能性がある。","choices":[{"t":"be conditional on","why":"「〜を条件としている」という意味で、革新が資金の条件になる関係を述べてしまう。"},{"t":"be conducive to","why":"正解。ある結果を生みやすくする、または促すのに役立つことを表す。"},{"t":"be consistent with","why":"「〜と矛盾しない」という意味で、革新の促進に役立つという因果関係は示さない。"},{"t":"be dependent on","why":"「〜に依存している」という意味で、資金が革新を促すという文の因果の向きに合わない。"}],"answer":1,"point":"be conducive to の後ろには名詞や動名詞を置き、望ましい結果を促す条件を述べる。","level":3,"accept":["contribute to","help stimulate"],"drive":{"ja":"安定した研究資金は、実用的な利益が現れるまで何年もかかるかもしれない不確実な研究にチームが取り組めるようにすることで、科学的な革新を促すのに役立つ可能性がある。","en":"Stable research funding may be conducive to scientific innovation by allowing teams to pursue uncertain projects whose practical benefits might take years to emerge."},"explain":"研究資金が主語で、mayが可能性、by以下が手段、whose節が研究を修飾する。be conducive toは成果を促す条件を表し、資金の効果を慎重に論じられる。別の言い方: help foster"},{"id":"p1-vocab_je-220","q":"The proposal was rejected ___（〜という理由で） its projected savings depended on staffing cuts that would substantially weaken emergency services in remote communities.","q_ja":"その提案は、見込まれる経費削減が、遠隔地の地域社会の救急サービスを大幅に弱体化させる人員削減に依存しているという理由で、却下された。","choices":[{"t":"on the condition that","why":"「〜という条件で」という意味で、すでに却下した理由の説明にはならない。"},{"t":"in the event that","why":"「万一〜の場合には」という意味で、仮定の事態を示し、却下した理由とは異なる。"},{"t":"to the extent that","why":"「〜する範囲で・程度まで」という意味で、程度や範囲を示す表現である。"},{"t":"on the grounds that","why":"正解。後ろに節を置き、決定や判断の根拠となった理由を示す。"}],"answer":3,"point":"on the grounds that は判断の理由を節で示す。条件や仮定を示す表現と区別する。","level":3,"accept":["because","on the basis that"],"drive":{"ja":"その提案は、見込まれる経費削減が、遠隔地の地域社会の救急サービスを大幅に弱体化させる人員削減に依存しているという理由で、却下された。","en":"The proposal was rejected on the grounds that its projected savings depended on staffing cuts that would substantially weaken emergency services in remote communities."},"explain":"提案が主語の受動態で却下を述べ、最初のthat節が理由、次のthat節が人員削減を修飾する。on the grounds thatは判断の根拠を示し、決定理由の要約に使える。別の言い方: because"}]}};

function streakInfo() {

  const d = new Date();
  const todayDone = done(dkey(d));
  let n = todayDone ? 1 : 0;
  d.setDate(d.getDate() - 1);
  for (let guard = 0; guard < 3650; guard++) {
    const k = dkey(d);
    if (done(k)) { n++; }
    else if (store.freeze.includes(k)) { /* お休み券で守った日 */ }
    else {
      // 前の日に記録があり、この月の券が残っていれば、ここで1枚使う
      const prev = new Date(d); prev.setDate(prev.getDate() - 1);
      const month = d.getFullYear() + '-' + (d.getMonth() + 1);
      const used = store.freeze.filter((x) => x.startsWith(month + '-')).length;
      if (n > 0 && done(dkey(prev)) && used < FREEZE_PER_MONTH) { store.freeze.push(k); save(); }

function calendar(weeks = 15) {
  const goal = store.set.goal, d = new Date();
  d.setDate(d.getDate() - (weeks * 7 - 1) - ((d.getDay() + 6) % 7) + 6); // 月曜はじまりで今週の終わりまで
  const start = new Date(); start.setDate(start.getDate() - ((start.getDay() + 6) % 7) - (weeks - 1) * 7);
  let cells = '';
  for (let i = 0; i < weeks * 7; i++) {
    const x = new Date(start); x.setDate(start.getDate() + i);
    const k = dkey(x), n = (store.daily[k] || {}).n || 0;
    const lv = x > new Date() ? '' : n >= goal * 2 ? 'l3' : n >= goal ? 'l2' : n > 0 ? 'l1' : '';
    cells += `<i class="${lv} ${k === today() ? 'today' : ''}" title="${k}: ${n}問"></i>`;
  }
  return `<div class="cal">${cells}</div>`;
}
function trend(days = 14) {
  const W = 320, H = 120, pad = 20, bw = (W - pad * 2) / days;
  const xs = [...Array(days)].map((_, i) => { const d = new Date(); d.setDate(d.getDate() - (days - 1 - i)); return { k: dkey(d), o: store.daily[dkey(d)] || { n: 0, ok: 0, ms: 0 }, lab: `${d.getMonth() + 1}/${d.getDate()}` }; });
  const maxN = Math.max(store.set.goal, ...xs.map((x) => x.o.n));
  let bars = '', pts = [];
  xs.forEach((x, i) => {
    const bh = ((H - pad * 2) * x.o.n) / maxN, X = pad + i * bw;
    bars += `<rect x="${X + 2}" y="${H - pad - bh}" width="${bw - 4}" height="${bh}" rx="2" fill="#bfdbfe"/>`;
    if (x.o.n) pts.push(`${X + bw / 2},${H - pad - (H - pad * 2) * (x.o.ok / x.o.n)}`);
    if (i % 3 === 0 || i === days - 1) bars += `<text x="${X + bw / 2}" y="${H - 5}" font-size="9" text-anchor="middle" fill="#555">${x.lab}</text>`;
  });
  const gy = H - pad - ((H - pad * 2) * store.set.goal) / maxN;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%">
    <line x1="${pad}" x2="${W - pad}" y1="${gy}" y2="${gy}" stroke="#f97316" stroke-dasharray="4 3"/>
    ${bars}${pts.length > 1 ? `<polyline points="${pts.join(' ')}" fill="none" stroke="#15803d" stroke-width="2.5"/>` : ''}
    ${pts.map((p) => `<circle cx="${p.split(',')[0]}" cy="${p.split(',')[1]}" r="3" fill="#15803d"/>`).join('')}</svg>
    <p class="muted" style="margin:4px 0 0">青い棒: 解いた数（橙の点線が目標） ・ 緑の線: 正解率</p>`;
}

function start(items, title) {
  if (!items.length) return;
  session = { items, i: 0, ok: 0, title, wrong: [], ms: 0, inTime: 0 };
  document.body.classList.add('quiz');

// 入力式の判定: 大文字小文字・前後の空白・句読点の違いは無視する。日本語は空白と「〜」・句読点を無視する
const normEn = (x) => String(x).toLowerCase().replace(/[’‘]/g, "'").replace(/[.,!?;:"]/g, '').replace(/\s+/g, ' ').trim();
const normJa = (x) => String(x).replace(/[\s　〜～~、。・「」（）()]/g, '');
function judgeInput(it, text) {
  const norm = TYPE_INFO[it.type].ja ? normJa : normEn;
  const v = norm(text);
  if (!v) return false;
  return [it.choices[it.answer].t, ...(it.accept || [])].some((a) => norm(a) === v);
}
// 問題文を読み上げ用の英語にする: 空所は blank、[[ ]] は外す、（日本語）は読まない、TOPIC: などの見出しは区切りに
function speakableQ(it) {
  return it.q.replace(/___/g, ' blank ').replace(/\[\[|\]\]/g, '').replace(/[（(][^）)]*[）)]/g, '')
    .replace(/^(TOPIC|Position|POINT)S?:\s*/gim, '$1. ').replace(/\n+/g, '. ');
}
// 🔊 ボタン（data-say に読む英文を入れる）
const spk = (text) => `<button class="spk" data-say="${h(text)}" aria-label="英語を読み上げる">${icon('speaker')}</button>`;
function bindSpeakers(root) {
  root.querySelectorAll('.spk[data-say]').forEach((b) => b.onclick = (e) => {
    e.stopPropagation(); e.preventDefault();
    root.querySelectorAll('.spk.playing').forEach((x) => x.classList.remove('playing'));
    b.classList.add('playing');
    say(b.dataset.say, 'en-US', true).then(() => b.classList.remove('playing'));
  });
}
const isEnglish = (t) => /[A-Za-z]/.test(t) && !/[ぁ-んァ-ン一-龥]/.test(t);
function qToHtml(it) { return h(it.q).replace(/___/g, '<b class="blank">＿＿＿</b>').replace(/\[\[(.+?)\]\]/g, '<b class="mark">$1</b>'); }
const react = (correct) => `<span class="react">${charaImg(stageOf(levelOf(store.xp)), correct ? 'jump' : 'shake')}</span>`;
function explainBox(it) {
  // 回答例のあとに「なぜこの英文になるのか」を出す
  const alt = /別の言い方[:：]\s*(.+)$/.exec(it.explain || '');
  return `<div class="explain"><div class="eh">${icon('bulb', 'style="width:16px;height:16px"')}この英文の組み立て</div><div class="en">${h(it.drive.en)}${spk(it.drive.en)}</div>${h(it.explain || it.choices[it.answer].why)}${alt ? spk(alt[1]) : ''}</div>`;
}

function question() {
  const s = session, it = s.items[s.i];
  const info = TYPE_INFO[it.type];
  const input = store.set.mode === 'input';
  const order = shuffle(it.choices.map((c, idx) => idx));
  app.innerHTML = `
    <div class="top"><button id="quit">やめる</button><span class="grow">${h(s.title)} ${s.i + 1}/${s.items.length}</span><span class="timer" id="timer">0秒</span></div>

const hasTTS = 'speechSynthesis' in window;
const live = new Set(); // 読み上げ中のデータを持ち続ける（iPhone で途中で音が切れるのを防ぐ）
let voiceUnlocked = false;
// 20〜40代の大人らしく聞こえる声だけに絞る（iPhone・Mac の声の名前。前ほど優先）
// おもちゃのような声（Grandma・Bubbles・Zarvox など）や子どもっぽい声は出さない
const CURATED = {
  en: { female: ['Ava', 'Zoe', 'Allison', 'Samantha', 'Susan', 'Serena', 'Kate', 'Karen', 'Moira', 'Tessa', 'Joelle', 'Nicky', 'Aria', 'Jenny'],
        male: ['Evan', 'Nathan', 'Tom', 'Alex', 'Aaron', 'Daniel', 'Oliver', 'Arthur', 'Gordon', 'Lee', 'Rishi', 'Guy', 'Davis'] },
  ja: { female: ['Kyoko', 'O-ren', 'Nanami', 'Ayumi', 'Haruka'], male: ['Otoya', 'Hattori', 'Keita', 'Ichiro'] },
};
const MAX_PER_GENDER = 5;
const baseName = (v) => v.name.replace(/\s*[（(].*$/, '').replace(/^Microsoft\s+|\s+(Online|Desktop).*$/gi, '').trim();
function describeVoice(v) {
  const s = v.name + ' ' + v.voiceURI, b = baseName(v).toLowerCase();
  const lang2 = v.lang.slice(0, 2).toLowerCase(), c = CURATED[lang2] || { female: [], male: [] };
  const fi = c.female.findIndex((x) => x.toLowerCase() === b), mi = c.male.findIndex((x) => x.toLowerCase() === b);
  const score = /premium|プレミアム|neural|natural/i.test(s) ? 3 : /enhanced|拡張|siri/i.test(s) ? 2 : 1;
  return { g: fi >= 0 ? '女性' : mi >= 0 ? '男性' : '不明', order: fi >= 0 ? fi : mi >= 0 ? mi : 99, curated: fi >= 0 || mi >= 0,
    q: score === 3 ? '最高品質' : score === 2 ? '高品質' : '標準', score };
}
// その言語で選べる声（性別ごとに品質の高い順に最大5人）
function voicesFor(lang2, gender) {
  if (!hasTTS) return [];
  const want = gender === 'male' ? '男性' : '女性';
  const seen = new Set();
  return speechSynthesis.getVoices().filter((v) => v.lang.toLowerCase().startsWith(lang2))
    .map((v) => ({ v, d: describeVoice(v) })).filter((x) => x.d.curated && x.d.g === want)
    .sort((a, b) => (b.d.score - a.d.score) || (a.d.order - b.d.order) || ((b.v.lang === 'en-US') - (a.v.lang === 'en-US')))
    .filter((x) => { const k = x.v.name; if (seen.has(k)) return false; seen.add(k); return true; })
    .slice(0, MAX_PER_GENDER).map((x) => x.v);
}
function pickVoice(lang) {
  if (!hasTTS) return null;
  const lang2 = lang.slice(0, 2), chosen = lang2 === 'en' ? store.set.voiceEn : store.set.voiceJa;
  const all = speechSynthesis.getVoices().filter((v) => v.lang.toLowerCase().startsWith(lang2));
  if (chosen) { const v = all.find((x) => x.name === chosen); if (v) return v; }
  // 選んだ性別の中で一番品質の高い声。なければ反対の性別、それもなければ何でも
  return voicesFor(lang2, store.set.gender)[0] || voicesFor(lang2, store.set.gender === 'male' ? 'female' : 'male')[0]
    || all.find((v) => v.lang.replace('_', '-') === lang) || all[0] || null;
}
function say(text, lang, force = false) {
  return new Promise((resolve) => {
    if (!hasTTS || (!drive && !force)) return resolve(false);
    // 前の読み上げが残っているときだけ取り消す。取り消した直後に話すと iPhone では捨てられることがあるので少し待つ
    const busy = speechSynthesis.speaking || speechSynthesis.pending;
    if (busy) speechSynthesis.cancel();
    if (speechSynthesis.paused) speechSynthesis.resume();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = lang; const v = pickVoice(lang); if (v) u.voice = v;
    u.rate = store.set.rate; u.volume = 1;
    live.add(u);
    let done = false;
    const finish = (ok) => { if (done) return; done = true; live.delete(u); clearTimeout(guard); resolve(ok); };
    u.onstart = () => sayStatus('読み上げ中');
    u.onend = () => { sayStatus('待機'); finish(true); };
    u.onerror = (e) => { sayStatus('エラー: ' + e.error); finish(false); };
    const guard = setTimeout(() => finish(false), text.length * 160 / store.set.rate + 5000); // 終了の合図が来ないときの打ち切り
    // 最初の1回はボタンを押した処理の中で同期的に呼ぶ必要がある（iPhone は、押した直後でないと音を出さない）
    if (busy) setTimeout(() => speechSynthesis.speak(u), 120); else speechSynthesis.speak(u);

function sayStatus(t) { const el = document.getElementById('sst'); if (el) el.textContent = '音声: ' + t; }

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
// iPhone では、音声入力を作り直したり止めて再開したりすると、2回目からマイクが無音になる（2026-11-11 実機）。
// 一度だけ始めて聞き続ける方式（continuous）だけが使えたので、モードの間ずっと開いたままにし、
// 答えを待つ間に聞こえた声だけを受け取る。読み上げ中に聞こえた声は捨てる。
function startMic() {
  if (!SR || !drive || !drive.voice) return;
  const r = new SR();
  r.lang = 'en-US'; r.interimResults = true; r.continuous = true; r.maxAlternatives = 1;
  drive.rec = r; drive.accept = false; drive.buf = ''; drive.part = ''; drive.lastHeard = 0; drive.micDead = false;
  r.onresult = (e) => {
    if (!drive || drive.rec !== r || !drive.accept) return;
    let part = '';
    for (let k = e.resultIndex; k < e.results.length; k++) {
      const t = e.results[k][0].transcript;
      if (e.results[k].isFinal) drive.buf = (drive.buf + ' ' + t).trim(); else part += t;
    }
    drive.part = part; drive.lastHeard = Date.now();
    const el = document.getElementById('heard'); if (el) el.textContent = '🎙️ ' + (drive.buf + ' ' + part).trim();
  };
  r.onerror = (e) => { if (drive && drive.rec === r && /not-allowed|service-not-allowed|audio-capture/.test(e.error)) drive.micDead = e.error; };
  r.onend = () => { if (drive && drive.rec === r) { drive.micDead ||= 'ended'; drive.rec = null; } };
  try { r.start(); } catch (e) { drive.micDead = 'start-failed'; drive.rec = null; }
}
// ms のあいだ（話し終えて1.6秒たったらそこで）答えを受け取る
async function listen(ms) {
  if (!drive || !drive.rec || drive.micDead) return { ok: false, why: drive && drive.micDead || 'no-api' };
  await new Promise((r) => setTimeout(r, 350)); // 読み上げの残響を拾わないよう少し待つ
  if (!drive) return { ok: false, why: 'stopped' };
  drive.buf = ''; drive.part = ''; drive.lastHeard = 0; drive.accept = true;
  sayStatus('聞いています');
  const t0 = Date.now();
  while (drive && !drive.micDead && Date.now() - t0 < ms) {
    if (drive.lastHeard && Date.now() - drive.lastHeard > 1600) break;
    await new Promise((r) => setTimeout(r, 150));
  }
  if (!drive) return { ok: false, why: 'stopped' };
  drive.accept = false;
  const text = (drive.buf + ' ' + drive.part).trim();
  return { ok: !!text, text, why: drive.micDead || (text ? '' : 'silence') };
}
// 模範文の大事な語（短い機能語を除く）をどれだけ言えたか
const STOP = new Set('a an the to of in on at for and or but is are was were be been it this that these those i we you they he she its their our my your with as by from can will would should could do does did not no so if than then there'.split(' '));
const words = (s) => normEn(s).split(' ').filter((w) => w && !STOP.has(w));
function matchScore(model, heard) {
  const m = words(model), hs = new Set(words(heard));
  if (!m.length) return 0;
  return m.filter((w) => hs.has(w) || hs.has(w.replace(/s$/, '')) || hs.has(w + 's')).length / m.length;
}

      }
    }
    if (!drive.voice) { ph.textContent = '口に出して答えてください'; await wait(store.set.pause * 1000); if (!drive) break; store.cnt.voice = (store.cnt.voice || 0) + 1; save(); checkBadges(); }
    ph.textContent = '模範文'; tx.textContent = it.drive.en;
    for (let k = 0; k < store.set.repeat && drive; k++) { await say(it.drive.en, 'en-US'); await wait(900); }
    if (!drive) break;
    if (store.set.readExplain && it.explain) { ph.textContent = '解説'; tx.textContent = it.explain; await say(it.explain.replace(/別の言い方[:：].*$/, ''), 'ja-JP'); if (!drive) break; }
    drive.i++;
    await wait(800);
  }
  if (drive) { await say('おつかれさまでした。', 'ja-JP'); show('home'); }
}
async function keepAwake() {
  try { if ('wakeLock' in navigator && drive) drive.lock = await navigator.wakeLock.request('screen'); } catch {}
}
document.addEventListener('visibilitychange', () => { if (drive && document.visibilityState === 'visible') keepAwake(); });
function stopDrive() {
  if (!drive) return;
  clearTimeout(drive.timer);
  try { const r = drive.rec; drive.rec = null; r && r.stop(); } catch {} // abort はしない（マイクが無音になる）
  try { drive.lock && drive.lock.release(); } catch {}
  drive = null;
  if (hasTTS) speechSynthesis.cancel();
}

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
checkBadges();
// 確認用: index.html#problems のように開くと、そのタブから始まる。#question は出題画面の見本
{
  const hsh = location.hash.slice(1);
  if (hsh === 'question' || hsh === 'answered') {
    show('problems'); start(pick(allItems(store.grade, ['reason']), 10), '理由の選択');
    if (hsh === 'answered') { const it = session.items[0]; app.querySelector(`.choice[data-i="${it.answer}"]`).click(); }
  }
  else show(TABS.some(([k]) => k === hsh) ? hsh : 'home');
}
</script>
