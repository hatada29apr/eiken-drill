現金廃止に反対する理由にしている。"},{"t":"Removing cash payments improves inclusion when faster boarding makes crowded buses easier for vulnerable passengers.","why":"現金廃止が利用しやすさを高めるという利点で、反対とは逆の立場を支えている。"},{"t":"Transport operators mention inclusion in payment policies distributed to passengers at stations and information centers.","why":"方針の記載内容という事実だけで、現金を残すべき理由になっていない。"},{"t":"Handling cash requires transport operators to maintain secure storage and arrange regular collections of money.","why":"現金の管理費用という別の観点であり、包摂の観点から反対する理由ではない。"},{"t":"Electronic payment systems support inclusion by offering accessible audio guidance that cash ticket machines lack.","why":"電子決済への移行の利点を述べており、現金廃止に反対する立場を支えていない。"},{"t":"Cash payment instructions appear beside inclusion guidelines in the printed handbook issued to transport staff.","why":"手引きの構成という事実のみで、現金支払いの必要性を説明していない。"}],"answer":0,"point":"包摂の観点では、制度の変更で利用から取り残される人がいないかを考える。","drive":{"ja":"公共交通の現金支払い廃止に反対する理由を、誰も取り残さない包摂の観点から英語で述べてください。","en":"Retaining cash payments promotes inclusion by allowing passengers without bank accounts to use public transport."},"explain":"動名詞句が主語、promotesが動詞で、by以下が手段を示す。allow＋人＋toで可能になる行動を述べ、制度の意義を論じる。別の言い方: Cash keeps transit open to unbanked users."},{"id":"p1-reason-218","q":"TOPIC: Should cities allocate more street space to trees?\nPosition: Agree\nPOINT: Heat","q_ja":"都市は街路樹のために道路の空間をより多く割り当てるべきか。立場：賛成。指定観点：暑さ。","level":2,"choices":[{"t":"Urban planting maps include measurements of summer heat, together with records showing the locations and species of trees along major city streets.","why":"地図に含まれる情報という事実だけで、街路樹を増やす利点を説明していない。"},{"t":"Allocating street space to trees enhances neighborhood appearance, potentially attracting new businesses and encouraging residents to spend more time in commercial districts.","why":"景観や商業という別の観点であり、暑さを使った理由ではない。"},{"t":"Dense roadside planting may trap heat where tree branches restrict airflow, making narrow streets less comfortable during periods of high summer temperatures.","why":"植樹によって暑さが悪化する可能性を示しており、賛成とは逆の理由である。"},{"t":"City maintenance teams record heat damage to street trees during summer inspections, noting which species require additional watering or replacement the following season.","why":"点検で記録する事実のみで、道路空間を木に割り当てる理由にはなっていない。"},{"t":"Street trees reduce exposure to extreme heat by shading pavements, which helps protect pedestrians who must travel outdoors during the hottest hours.","why":"正解。木陰が歩行者を強い暑さから守るという一般的な効果で、賛成を支えている。"},{"t":"Trees that provide little shade may offer limited protection from heat while displacing shelters that previously shielded passengers waiting for public transport.","why":"植樹による暑さ対策の弱点を指摘しており、賛成の立場を支えていない。"}],"answer":4,"point":"指定観点の暑さと、木陰による歩行者の保護を因果関係で結ぶ。","drive":{"ja":"都市が街路樹の空間を増やすことに賛成する理由を、暑さの観点から英語で述べてください。","en":"Street trees reduce exposure to extreme heat by shading pavements, which helps protect pedestrians who must travel outdoors during the hottest hours."},"explain":"樹木が主語、reduceが動詞で、which節が主節の効果を補足する。by＋動名詞で方法を示し、要約でも原因と効果を結べる。別の言い方: Trees shade pavements and protect pedestrians."},{"id":"p1-reason-219","q":"TOPIC: Should protected wildlife reserves remove limits on daily visitor numbers?\nPosition: Disagree\nPOINT: Biodiversity","q_ja":"野生生物保護区は一日当たりの入場者数の制限を撤廃すべきか。立場：反対。指定観点：生物多様性。","level":3,"choices":[{"t":"Removing visitor limits supports biodiversity when additional entrance revenue finances habitat restoration, enabling reserve managers to protect species whose survival depends on sustained investment in conservation.","why":"入場収入が種の保護につながるという撤廃の利点であり、反対とは逆の理由である。"},{"t":"Visitor limits appear in reserve management plans alongside biodiversity targets, which specify the habitats and species that staff monitor throughout each annual cycle of conservation activities.","why":"管理計画の記載事項という事実だけで、入場制限を残す必要性を説明していない。"},{"t":"Unrestricted visitor numbers threaten biodiversity because repeated disturbance can disrupt breeding patterns, placing vulnerable species at a disadvantage even where trails leave their habitats physically intact.","why":"正解。生息地が壊されなくても訪問者の干渉が繁殖を妨げるという、生物多様性への害を反対の理由にしている。"},{"t":"Removing daily entry restrictions would increase tourism revenue in neighboring communities, allowing local businesses to expand employment and recover investments in accommodation and transport infrastructure.","why":"地域の観光収入という別の観点であり、生物多様性を使って反対する理由ではない。"},{"t":"Greater visitor access benefits biodiversity by broadening public support for habitat protection, increasing the political pressure on authorities to maintain reserves rather than permit commercial development.","why":"保全への支持が増すという撤廃の利点であり、指定された反対の立場とは逆である。"},{"t":"Biodiversity surveys in popular reserves record breeding activity near visitor routes, while separate attendance reports document how many tourists enter through each gate during different seasons.","why":"調査対象と来場記録の説明だけで、訪問者数の増加が生態系に与える害を述べていない。"}],"answer":2,"point":"生息地の物理的な破壊だけでなく、繁殖への干渉も生物多様性を損なう理由になる。","drive":{"ja":"野生生物保護区の入場者数制限の撤廃に反対する理由を、生物多様性の観点から英語で述べてください。","en":"Unrestricted visitor numbers threaten biodiversity because repeated disturbance can disrupt breeding patterns, placing vulnerable species at a disadvantage even where trails leave their habitats physically intact."},"explain":"訪問者数が主語で、because節が理由、placing以下が結果を示す。even whereは条件がよくても残る害を示し、反論に使える。別の言い方: Too many visitors can disrupt breeding."},{"id":"p1-reason-220","q":"TOPIC: Should governments fund more international research partnerships?\nPosition: Agree\nPOINT: Cooperation","q_ja":"政府は国際的な研究連携への資金援助を増やすべきか。立場：賛成。指定観点：協力。","level":1,"choices":[{"t":"International research cooperation involves universities whose representatives attend planning meetings hosted in different partner countries.","why":"参加機関と会議の説明という事実だけで、資金援助を増やす理由にはなっていない。"},{"t":"International research partnerships require complex agreements, which may hinder cooperation between teams with different priorities.","why":"協力が妨げられる可能性を述べており、賛成の立場とは逆の理由である。"},{"t":"Public research funding creates employment for laboratory staff and supports businesses supplying specialist scientific equipment.","why":"雇用や産業という別の観点であり、国際協力を使った理由ではない。"},{"t":"Research cooperation agreements list participating institutions and describe the responsibilities assigned to each international partner.","why":"協定に書かれる内容という事実のみで、連携の利点を説明していない。"},{"t":"Competition over research credit may undermine cooperation when international partners disagree about ownership of shared discoveries.","why":"研究成果をめぐる対立という協力上の欠点であり、賛成を支えていない。"},{"t":"International cooperation enables researchers to share expertise, helping teams tackle problems beyond one country's resources.","why":"正解。専門知識の共有により一国では難しい課題に取り組めるため、協力の観点から賛成を支えている。"}],"answer":5,"point":"協力を理由にするなら、知識や資源を持ち寄ることで実現する効果まで述べる。","drive":{"ja":"国際的な研究連携への資金援助の増額に賛成する理由を、協力の観点から英語で述べてください。","en":"International cooperation enables researchers to share expertise, helping teams tackle problems beyond one country's resources."},"explain":"International cooperationが主語で、enable A toは研究者による専門知識の共有を可能にすることを示す。helping以下は一国の資源を超える問題に取り組めるという結果を表す。別の言い方: International collaboration lets researchers combine their expertise and helps teams address problems that exceed the resources of any one country."},{"id":"p1-reason-101","q":"TOPIC: Should governments provide more funding for public transport?\nPosition: Agree\nPOINT: Costs","q_ja":"政府は公共交通への資金援助を増やすべきか。立場は賛成。費用の観点から理由を選ぶ。","choices":[{"t":"Public transport services require expensive repairs, placing an additional financial burden on the government each year.","why":"公共交通への支出が政府の負担になるという内容で、資金援助を増やすことに反対する理由。"},{"t":"Public funding for transport reduces travel costs, leaving households with more money for other basic needs.","why":"正解。公的資金で交通費が下がり、家計に余裕が生まれるという一般的な利点が賛成を支える。"},{"t":"The use of public transport reduces air pollution by keeping more private cars off busy roads.","why":"環境面では賛成を支えるが、指定された費用の観点を使っていない。"},{"t":"Public transport budgets include money for vehicles, station buildings, staff salaries, and regular repairs to equipment.","why":"予算の使い道を挙げているだけで、資金援助を増やす利点を説明していない。"},{"t":"Public transport services allow older residents to visit hospitals even after they stop driving their cars.","why":"高齢者の移動を支える利点だが、指定された費用の観点を使っていない。"},{"t":"Local governments discuss public transport costs when they prepare their budgets for the next financial year.","why":"予算を作る際の事実を述べているだけで、資金援助を増やす理由になっていない。"}],"answer":1,"point":"費用の観点では、公的支援によって家計の負担がどう変わるかを理由にする。","level":1,"drive":{"ja":"政府は公共交通への資金援助を増やすべきか。賛成の立場で、費用の観点から理由を英語で述べる。","en":"Public funding for transport reduces travel costs, leaving households with more money for other basic needs."},"explain":"は対象英文がないため確定できない。"},{"id":"p1-reason-102","q":"TOPIC: Should cities use facial recognition cameras in public places?\nPosition: Disagree\nPOINT: Privacy","q_ja":"都市は公共の場所で顔認証カメラを使うべきか。立場は反対。プライバシーの観点から理由を選ぶ。","choices":[{"t":"Facial recognition cameras allow police officers to identify suspects quickly and improve safety in crowded areas.","why":"安全性の向上という賛成の理由で、反対の立場もプライバシーの観点も満たしていない。"},{"t":"The installation of facial recognition cameras requires public money that cities could spend on other services.","why":"費用の面では反対を支えるが、指定されたプライバシーの観点を使っていない。"},{"t":"City officials discuss privacy rules before they decide where to install new facial recognition camera systems.","why":"導入前の手続きの事実だけで、カメラの使用に反対する理由になっていない。"},{"t":"Images from facial recognition cameras are stored in computer systems managed by local public safety departments.","why":"画像の保存先を述べているだけで、プライバシーへの悪影響を説明していない。"},{"t":"The collection of facial images threatens privacy by allowing authorities to track people without their permission.","why":"正解。本人の許可なく行動を追跡できることがプライバシーを脅かすため、反対の理由になる。"},{"t":"Facial recognition systems sometimes fail to identify people correctly, leading police officers to question innocent citizens.","why":"認証の精度の面では反対を支えるが、指定されたプライバシーの観点を使っていない。"}],"answer":4,"point":"プライバシーの観点では、本人の許可のない情報収集や追跡がもたらす問題を示す。","level":1,"drive":{"ja":"都市は公共の場所で顔認証カメラを使うべきか。反対の立場で、プライバシーの観点から理由を英語で述べる。","en":"The collection of facial images threatens privacy by allowing authorities to track people without their permission."},"explain":"は対象英文がないため確定できない。"},{"id":"p1-reason-103","q":"TOPIC: Should governments invest more in renewable energy?\nPosition: Agree\nPOINT: Employment","q_ja":"政府は再生可能エネルギーへの投資を増やすべきか。立場は賛成。雇用の観点から理由を選ぶ。","choices":[{"t":"Investment in renewable energy creates employment by increasing demand for workers who build and maintain facilities.","why":"正解。施設の建設や保守を担う働き手への需要が増え、雇用が生まれるという利点が賛成を支える。"},{"t":"Renewable energy projects require large initial payments, increasing pressure on governments with limited budgets for public services.","why":"初期費用の負担を述べた反対の理由で、賛成の立場も雇用の観点も満たしていない。"},{"t":"The expansion of renewable energy reduces air pollution by replacing power plants that burn coal and oil.","why":"環境面では賛成を支えるが、指定された雇用の観点を使っていない。"},{"t":"Employment reports list the number of workers currently working at solar and wind power facilities across regions.","why":"雇用に関する報告書の内容だけで、投資を増やすことの利点を説明していない。"},{"t":"Renewable energy production reduces dependence on imported fuel, protecting countries from sudden changes in foreign fuel supplies.","why":"エネルギーの安定供給の面では賛成を支えるが、指定された雇用の観点を使っていない。"},{"t":"Workers at renewable energy facilities have several roles, including equipment inspection, office administration, and daily site management.","why":"現在ある仕事の種類を挙げただけで、投資の増加が雇用に与える利点を説明していない。"}],"answer":0,"point":"雇用の観点では、投資が働き手への需要や仕事の数を増やすことを理由にする。","level":1,"drive":{"ja":"政府は再生可能エネルギーへの投資を増やすべきか。賛成の立場で、雇用の観点から理由を英語で述べる。","en":"Investment in renewable energy creates employment by increasing demand for workers who build and maintain facilities."},"explain":"は対象英文がないため確定できない。"},{"id":"p1-reason-104","q":"TOPIC: Should local governments provide public services only online?\nPosition: Disagree\nPOINT: Access","q_ja":"地方自治体は行政サービスをオンラインだけで提供すべきか。立場は反対。利用のしやすさの観点から理由を選ぶ。","choices":[{"t":"The use of online public services reduces office expenses by removing the need for large service counters.","why":"経費削減という賛成の理由で、反対の立場も利用のしやすさの観点も満たしていない。"},{"t":"Local government websites provide access to forms for residents who need to apply for various public services.","why":"ウェブサイトの機能を述べているだけで、オンラインだけにすることに反対する理由になっていない。"},{"t":"Online public services require personal information, raising concerns about the safety of data stored in government systems.","why":"個人情報の安全性の面では反対を支えるが、指定された利用のしやすさの観点を使っていない。"},{"t":"Providing services only online limits access for residents who lack internet connections or basic computer skills.","why":"正解。ネット環境や基本的な操作の技能がない住民は利用しにくくなるため、反対の理由になる。"},{"t":"Public service websites have separate pages for different procedures, such as tax payments and applications for financial support.","why":"サイト内のページ構成を述べているだけで、利用しにくくなる住民がいることを説明していない。"},{"t":"Moving public services online reduces personal contact, making it harder for staff to build trust with local residents.","why":"職員と住民の信頼関係の面では反対を支えるが、指定された利用のしやすさの観点を使っていない。"}],"answer":3,"point":"利用のしやすさの観点では、サービスを使うための環境や技能がない人への影響を考える。","level":1,"drive":{"ja":"地方自治体は行政サービスをオンラインだけで提供すべきか。反対の立場で、利用のしやすさの観点から理由を英語で述べる。","en":"Providing services only online limits access for residents who lack internet connections or basic computer skills."},"explain":"は対象英文がないため確定できない。"}],"summary":[{"id":"p1-summary-001","q":"Municipal libraries are expanding their lending services beyond books to include equipment that residents rarely need to own. One district, for instance, lends electric drills for three days at a time. Sharing such goods reduces household expenses and the demand for new products. Nevertheless, maintaining the equipment requires additional staff and funding, which local authorities must secure if these services are to remain dependable.","q_ja":"自治体の図書館は、住民が所有する必要の少ない道具へ貸出対象を広げている。ある地区では電動ドリルを一度に3日間貸している。共有は家計の負担と新品への需要を減らすが、安定したサービスの維持には人員と財源の確保が必要である。","choices":[{"t":"Sharing such goods reduces household expenses and the demand for new products, but maintaining the equipment requires additional staff and funding.","why":"本文の表現をほぼそのままつないでおり、語句を言い換えて要点をまとめていない。"},{"t":"Lending electric drills for three days reduces household spending and demand for new goods, although dependable services require maintenance staff and funding.","why":"電動ドリルと3日間という具体例・数字を残しており、一般化が不十分。"},{"t":"Public lending of household equipment lowers personal costs and resource consumption, but reliable provision depends on sufficient maintenance funding and personnel.","why":"正解。利点と維持条件を両方残し、道具の種類や貸出日数は省く。"},{"t":"Public equipment lending reduces personal expenses and resource use, while membership fees provide the funding needed to maintain dependable services for residents.","why":"維持費を会費で賄うという仕組みは本文にない。"},{"t":"Borrowing equipment enables residents to avoid unnecessary purchases, reducing their household expenses and demand for products that they would otherwise rarely use.","why":"購入抑制の利点だけを述べ、維持に必要な人員と財源を落としている。"},{"t":"Shared equipment services eliminate household purchasing costs and resource waste, requiring only minimal public investment to remain fully dependable for all residents.","why":"費用や資源の無駄をなくす、少額の投資だけで維持できるという断定は本文を超えている。"}],"answer":2,"point":"利点と維持条件を両方残し、道具の種類や貸出日数は省く。","drive":{"ja":"次の段落の要点を英語1文で。道具の公共貸出は家計負担と資源消費を減らすが、安定した運営には維持費と人員が必要である。","en":"Public lending of household equipment lowers personal costs and resource consumption, but reliable provision depends on sufficient maintenance funding and personnel."},"level":2,"explain":"貸出が費用などを減らす主節に、butで提供の条件を対置する。depend on＋名詞は、要約で運営に必要な条件を示せる。別の言い方: Reliable services require funding and staff."},{"id":"p1-summary-002","q":"Some employers now use automated systems to screen job applications, hoping to process large numbers more efficiently. A retailer, for example, used software to assess 800 applicants in a week. However, systems trained on past hiring decisions may reproduce existing inequalities. Independent reviews of their recommendations are therefore necessary to prevent efficiency gains from coming at the expense of fair access to employment.","q_ja":"多数の応募を効率よく処理するため、自動選考システムを導入する雇用主がいる。ある小売企業は1週間で800人を評価した。しかし、過去の採用判断を学習したシステムは既存の不平等を再現する恐れがあり、公平な雇用機会を守るために独立した審査が必要である。","choices":[{"t":"Systems trained on past hiring decisions may reproduce existing inequalities, so independent reviews of their recommendations are necessary to protect access to employment.","why":"本文の語句をほぼそのまま利用し、効率化という利点もまとめていない。"},{"t":"Software assessing 800 retail applicants within a week illustrates faster recruitment, although independent checks remain necessary to prevent unfair treatment of job seekers.","why":"800人、1週間、小売という具体的な情報を残している。"},{"t":"Automated recruitment accelerates application processing, but employers must publish every applicant's personal records so that external specialists can assess the fairness of decisions.","why":"応募者全員の個人記録を公表する義務は本文にない。"},{"t":"Learning from previous hiring decisions exposes recruitment software to inherited inequalities, making independent assessment of its recommendations essential for protecting disadvantaged job seekers.","why":"偏りと審査の必要性だけを扱い、大量の応募を効率よく処理する利点が欠けている。"},{"t":"Automated selection inevitably discriminates against qualified applicants, making external intervention the only possible way to secure equal employment opportunities throughout the entire economy.","why":"必ず差別する、介入が唯一の方法だという断定は本文にない。"},{"t":"Automated recruitment improves processing efficiency, but external oversight is needed to address inherited bias and protect equal opportunities for those seeking work.","why":"正解。効率化の利点と偏りのリスクを、監督の必要性につなげてまとめる。"}],"answer":5,"point":"効率化の利点と偏りのリスクを、監督の必要性につなげてまとめる。","drive":{"ja":"次の段落の要点を英語1文で。採用の自動化は効率を高めるが、過去の偏りを引き継ぐ恐れがあるため、公平性を守る外部の監督が必要である。","en":"Automated recruitment improves processing efficiency, but external oversight is needed to address inherited bias and protect equal opportunities for those seeking work."},"level":3,"explain":"自動採用が効率を高める節と、監督が必要だという受動態をbutで結ぶ。to以下は監督の目的を並列し、対策の意義を説明する。別の言い方: External checks help ensure fairness."},{"id":"p1-summary-003","q":"Coastal communities are restoring wetlands as an alternative to relying entirely on concrete barriers against flooding. In one village, a restored marsh absorbed water during two major storms. Such projects also create habitats for wildlife. Nevertheless, wetlands require considerable space, and their protective effects develop gradually. Consequently, planners should combine restoration with other defenses rather than expect it to provide immediate protection everywhere.","q_ja":"沿岸地域では、洪水対策をコンクリートの防壁だけに頼らず、湿地を再生する動きがある。ある村では再生した湿地が2度の大きな嵐で水を吸収した。生息地も生まれるが、広い土地と時間が必要なため、計画担当者はほかの防御策と組み合わせるべきである。","choices":[{"t":"Wetland restoration supports biodiversity and flood management, but spatial constraints and delayed benefits make its integration with additional protective measures necessary.","why":"正解。効果だけでなく、効果の限界と対策を併用する結論まで残す。"},{"t":"Wetlands require considerable space, and their protective effects develop gradually, so planners should combine restoration with other defenses against flooding in coastal communities.","why":"本文の表現をほぼ写しており、生息地を生む利点も省いている。"},{"t":"A village marsh absorbed floodwater during two major storms and supported wildlife, although restoration requires space, time, and coordination with other coastal defenses.","why":"村と2度の嵐という事例の情報を残している。"},{"t":"Restoring coastal wetlands protects wildlife and reduces flooding, while tourism revenue from the new habitats finances the construction of additional protective coastal barriers.","why":"観光収入で防壁建設の費用を賄うという内容は本文にない。"},{"t":"Restored wetlands provide habitats for wildlife while absorbing excess water, offering coastal communities an alternative to depending entirely on concrete barriers against dangerous flooding.","why":"湿地の利点だけで、土地や時間の制約と対策の併用が抜けている。"},{"t":"Once wetlands are restored, coastal communities receive complete flood protection and permanent wildlife habitats, eliminating the need for concrete defenses or further public investment.","why":"完全な防御が得られ、ほかの対策が不要になるという誇張は本文の結論に反する。"}],"answer":0,"point":"効果だけでなく、効果の限界と対策を併用する結論まで残す。","drive":{"ja":"次の段落の要点を英語1文で。湿地再生は生物多様性と洪水対策に役立つが、土地と時間の制約があり、ほかの防御策との併用が必要である。","en":"Wetland restoration supports biodiversity and flood management, but spatial constraints and delayed benefits make its integration with additional protective measures necessary."},"level":3,"explain":"湿地再生が役立つ節に、butで制約が併用を必要にする節を続ける。make＋目的語＋形容詞は、要約で制約から導く結論を示せる。別の言い方: Other defenses are also needed."},{"id":"p1-summary-004","q":"Governments sometimes offer subsidies to encourage households to improve the energy efficiency of their homes. For example, a local program covers half the cost of replacing old windows. These measures lower energy consumption, but families with limited savings may still struggle to pay the remaining expense. Unless assistance reflects differences in household income, public spending may primarily benefit residents who could already afford the improvements.","q_ja":"政府は住宅の省エネルギー化を促すために補助金を出すことがある。ある地域では古い窓の交換費用の半分を負担する。省エネには役立つが、貯蓄の少ない世帯は残額を払えない場合がある。所得差を考慮しないと、もともと改修できる住民に公費の恩恵が偏る恐れがある。","choices":[{"t":"These measures lower energy consumption, but families with limited savings may still struggle to pay the remaining expense unless assistance reflects household income.","why":"本文の語句をほぼそのまま使い、十分に言い換えていない。"},{"t":"Covering half the cost of replacing old windows reduces energy use, but households with limited savings may need assistance adjusted to their income levels.","why":"費用の半分と窓の交換という数字・具体例が残っている。"},{"t":"Subsidizing household energy improvements reduces consumption, but assistance should prioritize tenants because property owners recover all renovation costs through higher rents within several years.","why":"借家人の優先や家賃での全額回収は本文にない。"},{"t":"Home efficiency subsidies reduce energy use, yet support must account for financial disparities to avoid disproportionately benefiting households already able to afford renovations.","why":"正解。省エネ効果と受益の偏りをまとめ、所得差を考慮する条件を残す。"},{"t":"Households with limited savings may struggle to cover remaining renovation expenses, even when public subsidies reduce the amount they must pay for home improvements.","why":"支払いの困難だけを扱い、省エネ効果と所得に応じた支援の必要性が欠けている。"},{"t":"Energy renovation subsidies always transfer public funds exclusively to wealthy homeowners, leaving poorer households unable to obtain any benefit regardless of the assistance provided.","why":"必ず富裕層だけが受益し、支援にかかわらず低所得世帯には恩恵がないというのは言い過ぎ。"}],"answer":3,"point":"省エネ効果と受益の偏りをまとめ、所得差を考慮する条件を残す。","drive":{"ja":"次の段落の要点を英語1文で。住宅の省エネ補助金は消費エネルギーを減らすが、改修できる世帯に恩恵が偏らないよう経済格差を考慮した支援が必要である。","en":"Home efficiency subsidies reduce energy use, yet support must account for financial disparities to avoid disproportionately benefiting households already able to afford renovations."},"level":3,"explain":"補助金が消費を減らす節と、支援が格差を考慮すべきだという節をyetで対比する。to avoid＋動名詞で、政策が防ぐべき事態を示す。別の言い方: Support must reflect income differences."},{"id":"p1-summary-005","q":"Researchers increasingly invite members of the public to collect environmental data. Volunteers in one project recorded bird sightings at 40 locations, extending coverage beyond what professional teams could manage. This participation also strengthens public understanding of science. However, inconsistent recording methods may reduce the reliability of findings. Providing clear instructions and checking submitted observations are therefore essential if broader participation is to produce useful evidence.","q_ja":"研究者は環境データの収集に市民を招くようになっている。ある事業ではボランティアが40か所で鳥の目撃を記録し、専門家だけでは難しい範囲を調べた。科学への理解も深まるが、記録方法が不統一だと信頼性が低下するため、明確な指示と観察記録の確認が必要である。","choices":[{"t":"This participation also strengthens public understanding of science, but inconsistent recording methods may reduce the reliability of findings without clear instructions and observation checks.","why":"本文の語句をほぼそのままつなぎ、調査範囲の拡大もまとめていない。"},{"t":"Public involvement broadens environmental research and scientific understanding, provided that consistent guidance and verification safeguard the quality of information collected by volunteers.","why":"正解。調査と理解の広がりを一般化し、品質を確保する条件を付ける。"},{"t":"Volunteers recording bird sightings at 40 locations expand research coverage and scientific understanding, although clear instructions and checks are necessary to ensure reliable findings.","why":"鳥の目撃と40か所という例・数字を残している。"},{"t":"Citizen involvement extends environmental monitoring and scientific understanding, but reliable findings require volunteers to earn professional qualifications before submitting any observations to research teams.","why":"観察記録を提出する前に専門資格を取得する必要があるとは書かれていない。"},{"t":"Citizen observations extend environmental monitoring beyond the reach of professional teams, allowing researchers to gather evidence from more locations through the participation of volunteers.","why":"調査範囲の拡大だけで、科学への理解と記録の品質管理を落としている。"},{"t":"Public participation guarantees comprehensive environmental evidence and universal scientific understanding, removing the need for professional researchers to inspect observations or provide volunteers with guidance.","why":"網羅的な証拠と全員の理解を保証し、点検も指導も不要だという誇張は本文に反する。"}],"answer":1,"point":"調査と理解の広がりを一般化し、品質を確保する条件を付ける。","drive":{"ja":"次の段落の要点を英語1文で。市民参加は環境研究の範囲と科学への理解を広げるが、一貫した指導と確認によって情報の質を守る必要がある。","en":"Public involvement broadens environmental research and scientific understanding, provided that consistent guidance and verification safeguard the quality of information collected by volunteers."},"level":3,"explain":"市民参加が研究と理解を広げる主節に、provided thatで条件節を付ける。この型は、要約で効果の前提を明示するのに使える。別の言い方: This works if data quality is maintained."},{"id":"p1-summary-006","q":"To support struggling rural businesses, a regional authority has moved some administrative offices out of the capital. A new branch employing 60 people has increased spending in nearby shops. Relocation may distribute economic activity more evenly, yet employees sometimes resist moving because their partners cannot find suitable work. Its success therefore depends not only on office investment but also on employment opportunities for accompanying family members.","q_ja":"地方の事業者を支えるため、ある広域行政機関は一部の事務所を中心都市から移した。60人が働く新拠点は近隣商店での支出を増やした。移転は経済活動の分散につながるが、配偶者の仕事が見つからず抵抗する職員もいるため、家族の就業機会も成功に必要である。","choices":[{"t":"Relocation may distribute economic activity more evenly, yet employees sometimes resist moving because their partners cannot find suitable work in areas receiving new offices.","why":"本文の表現をほぼそのまま取り出しており、成功条件の言い換えとして不十分。"},{"t":"Moving a branch with 60 employees increases spending in nearby shops, but accompanying partners need suitable employment if relocation is to achieve its aims.","why":"60人の拠点と近隣商店という具体例を残している。"},{"t":"Administrative relocation distributes economic benefits more widely, but governments must provide permanent wage subsidies to local employers before employees' families will agree to move.","why":"地元企業への恒久的な賃金補助が必要だという条件は本文にない。"},{"t":"Moving administrative workplaces away from the capital increases spending in surrounding businesses, supporting struggling rural economies through the purchases made by newly arrived public employees.","why":"地域への経済効果だけを扱い、配偶者の雇用と移転への抵抗を落としている。"},{"t":"Relocating government offices may spread economic benefits geographically, but effective implementation requires employment prospects for employees' families alongside investment in the offices themselves.","why":"正解。経済活動の分散という目的と、家族の就業機会という成功条件を結ぶ。"},{"t":"Moving public offices invariably revitalizes every rural economy, and creating jobs for accompanying partners completely removes employee resistance to relocation regardless of other personal circumstances.","why":"すべての地域が必ず再生し、家族の雇用だけで抵抗が完全になくなるという断定は過剰。"}],"answer":4,"point":"経済活動の分散という目的と、家族の就業機会という成功条件を結ぶ。","drive":{"ja":"次の段落の要点を英語1文で。行政機関の移転は経済的恩恵を地域に分散させ得るが、施設投資とともに職員の家族の就業機会を確保する必要がある。","en":"Relocating government offices may spread economic benefits geographically, but effective implementation requires employment prospects for employees' families alongside investment in the offices themselves."},"level":2,"explain":"移転を主語にmay spreadで可能性を述べ、butで実施に必要な条件へ移る。alongside＋名詞は、論述で設備以外の条件も追加できる。別の言い方: Families also need job opportunities."},{"id":"p1-summary-007","q":"Some cities publish transport data so that private developers can create services for passengers. One application combines information from 12 bus routes to suggest convenient connections. Opening these records encourages innovation without requiring authorities to design every service themselves. Nevertheless, detailed travel records could reveal individuals' movements. Authorities must therefore remove identifying information before release, balancing the usefulness of shared data against passengers' privacy.","q_ja":"民間開発者が利用者向けサービスを作れるよう、交通データを公開する都市がある。あるアプリは12のバス路線の情報から乗り継ぎを提案する。公開は行政自身がすべてを開発しなくても革新を促すが、詳細な移動記録は個人の行動を明らかにし得るため、公開前に個人を識別できる情報を除く必要がある。","choices":[{"t":"Opening these records encourages innovation without requiring authorities to design every service themselves, but detailed travel records could reveal individuals' movements without privacy safeguards.","why":"本文の語句をほぼ写しており、識別情報を除くという対応もまとめていない。"},{"t":"An application using information from 12 bus routes improves connections, illustrating innovation through shared data that must exclude identifying details to protect passenger privacy.","why":"12路線と乗り継ぎアプリという数字・具体例が残っている。"},{"t":"Publishing transport data promotes private innovation, although authorities must charge developers licensing fees to compensate passengers whose personal travel records are included in shared datasets.","why":"開発者への料金請求と利用者への補償という仕組みは本文にない。"},{"t":"Public transport records enable private developers to suggest convenient connections, encouraging new passenger services without requiring public authorities to design each application with their own staff.","why":"民間のサービス開発という利点だけで、プライバシーへの危険と対処が欠けている。"},{"t":"Publishing transport records inevitably exposes every passenger's movements, making complete secrecy the only effective policy despite the potential advantages of private innovation in passenger services.","why":"全員の移動が必ず露見し、全面非公開しかないという断定は本文の方針に反する。"},{"t":"Sharing transport information stimulates private service development, but authorities must protect individual privacy by removing personal identifiers while preserving the data's practical value.","why":"正解。データ公開の利点とプライバシー保護を両立させる対応を残す。"}],"answer":5,"point":"データ公開の利点とプライバシー保護を両立させる対応を残す。","drive":{"ja":"次の段落の要点を英語1文で。交通情報の共有は民間のサービス開発を促すが、実用性を保ちつつ個人を識別する情報を除き、プライバシーを守る必要がある。","en":"Sharing transport information stimulates private service development, but authorities must protect individual privacy by removing personal identifiers while preserving the data's practical value."},"level":2,"explain":"情報共有が開発を促す節に、butで当局の義務を続ける。by＋動名詞で手段、whileで両立条件を示し、対策を具体化する。別の言い方: Remove identifiers but keep data useful."},{"id":"p1-summary-008","q":"International partnerships allow universities with limited resources to share expensive research facilities. Under one agreement, scientists from four institutions use the same advanced microscope. Such cooperation expands access to equipment and encourages the exchange of expertise. However, disputes may arise over ownership of discoveries. Establishing clear rules before research begins is therefore crucial to maintaining trust and ensuring that the benefits of collaboration are fairly distributed.","q_ja":"国際連携によって、資源の限られた大学も高価な研究設備を共同利用できる。ある協定では4機関の研究者が高度な顕微鏡を共有する。設備へのアクセスと専門知識の交流が広がる一方、発見の権利を巡る争いもあり得るため、開始前の明確なルールが信頼と利益の公平な配分に重要である。","choices":[{"t":"Such cooperation expands access to equipment and encourages the exchange of expertise, but disputes may arise over ownership of discoveries without clear rules before research begins.","why":"本文の表現をほぼそのまま組み合わせており、要点を自分の表現に置き換えていない。"},{"t":"Scientists from four institutions share an advanced microscope and expertise through international cooperation, but clear ownership rules are needed beforehand to distribute research benefits fairly.","why":"4機関と顕微鏡という数字・具体例が残っている。"},{"t":"International academic cooperation broadens access to research resources and expertise, but prior agreements on discovery ownership are essential for trust and equitable sharing of benefits.","why":"正解。資源・知識の共有という利点と、権利の事前合意という条件をまとめる。"},{"t":"International university partnerships expand access to equipment and knowledge, but participating institutions must transfer ownership of all discoveries to an independent global agency before research begins.","why":"発見の権利を国際機関へすべて移すという条件は本文にない。"},{"t":"Universities with limited resources gain access to expensive research facilities through international agreements, while scientists exchange expertise by using equipment that their institutions could not otherwise afford.","why":"設備と知識の共有という利点だけで、権利を巡る問題と事前のルールが抜けている。"},{"t":"International research partnerships guarantee equal scientific opportunities for all universities, while advance ownership agreements permanently eliminate every dispute and ensure complete trust among all participating scientific institutions.","why":"すべての大学の平等や、あらゆる争いの永久的な解消を保証するのは言い過ぎ。"}],"answer":2,"point":"資源・知識の共有という利点と、権利の事前合意という条件をまとめる。","drive":{"ja":"次の段落の要点を英語1文で。大学の国際協力は研究資源と専門知識へのアクセスを広げるが、信頼と公平な利益配分には発見の権利に関する事前合意が必要である。","en":"International academic cooperation broadens access to research resources and expertise, but prior agreements on discovery ownership are essential for trust and equitable sharing of benefits."},"level":3,"explain":"国際協力が利用機会を広げる節と、事前合意が不可欠だという節をbutで結ぶ。agreements on＋名詞で合意の対象を絞り、要約を簡潔にする。別の言い方: Agree on ownership in advance."},{"id":"p1-summary-009","q":"Public agencies increasingly offer essential services through digital platforms, reducing paperwork and travel for many residents. A town, for instance, now accepts housing applications through a website rather than requiring visits to its offices. Nevertheless, people without reliable internet access or sufficient digital skills may find these services harder to use. Retaining personal assistance is therefore necessary to prevent administrative efficiency from widening inequalities in access.","q_ja":"行政機関は重要なサービスをデジタル化し、多くの住民の書類作業や移動を減らしている。ある町では窓口訪問の代わりに住宅の申請をウェブで受け付ける。しかし、安定した通信環境や十分な操作技能のない人には利用が難しくなるため、利用格差を広げないよう対人支援を残す必要がある。","choices":[{"t":"People without reliable internet access or sufficient digital skills may find these services harder to use, so retaining personal assistance is therefore necessary for access.","why":"本文の表現をほぼ写しており、効率化の利点も要約していない。"},{"t":"Online housing applications reduce paperwork and office visits, but residents lacking reliable internet or digital skills still need personal assistance to access these services.","why":"住宅申請と窓口訪問という具体例を残したままで、行政サービス全体に一般化していない。"},{"t":"Digital public services improve administrative efficiency, but agencies must distribute free computers to every resident before replacing office procedures with applications through online platforms.","why":"全住民への無料のコンピューター配布という要件は本文にない。"},{"t":"Residents with reliable internet access avoid office visits and paperwork through digital platforms, making essential administrative procedures more convenient for people with sufficient digital skills.","why":"利用できる人の利便性だけで、利用が難しい人への支援が欠けている。"},{"t":"Digitizing public services streamlines administration for many users, but continued human support is essential to preserve access for residents facing technological barriers.","why":"正解。効率化を認めつつ、技術面で困難を抱える人への支援を残す。"},{"t":"Digital administration inevitably denies essential services to all residents lacking advanced technical expertise, making the complete abandonment of online platforms necessary to secure equal access.","why":"高度な技能がない人は全員利用できず、オンラインを全面廃止すべきだという断定は過剰。"}],"answer":4,"point":"効率化を認めつつ、技術面で困難を抱える人への支援を残す。","drive":{"ja":"次の段落の要点を英語1文で。行政サービスのデジタル化は多くの利用者の手続きを効率化するが、技術的な障壁のある住民の利用を守るため対人支援が必要である。","en":"Digitizing public services streamlines administration for many users, but continued human support is essential to preserve access for residents facing technological barriers."},"level":2,"explain":"デジタル化が効率化する節に、butで対人支援が不可欠だという節を対置する。facing以下は住民を修飾し、論述で支援対象を絞れる。別の言い方: Help residents who face digital barriers."},{"id":"p1-summary-010","q":"Some governments require producers to take responsibility for products after consumers discard them. Under one scheme, electronics companies pay for collecting used televisions and recovering valuable materials. Shifting disposal costs to manufacturers encourages designs that are easier to repair or recycle. However, compliance may place a heavier burden on smaller firms. Flexible payment arrangements could preserve this environmental incentive while reducing pressure on businesses with fewer resources.","q_ja":"消費者が捨てた製品への責任を生産者に求める政府がある。ある制度では電子機器メーカーが使用済みテレビの回収と有用な素材の再生に費用を払う。処分費用の移転は修理・再資源化しやすい設計を促すが、小規模企業の負担が重くなり得るため、柔軟な支払い方法が環境面の誘因と負担軽減の両立に役立つ。","choices":[{"t":"Producer responsibility encourages sustainable product design, but adaptable payment terms may ease the disproportionate financial strain on smaller firms without weakening environmental incentives.","why":"正解。環境面の誘因と企業規模による負担差を残し、柔軟な支払いで結ぶ。"},{"t":"Shifting disposal costs to manufacturers encourages designs that are easier to repair or recycle, but compliance may place a heavier burden on smaller firms.","why":"本文の語句をほぼそのままつなぎ、柔軟な支払いという対応策も落としている。"},{"t":"Electronics companies funding used television collection and material recovery face incentives to improve designs, while flexible payments could reduce the burden on smaller producers.","why":"電子機器メーカーとテレビ回収という具体例が残っている。"},{"t":"Making producers responsible for discarded goods promotes sustainable design, but governments must exempt smaller firms entirely and recover their unpaid costs through higher consumer taxes.","why":"小規模企業の全面免除や消費者への増税は本文にない。"},{"t":"Manufacturers paying disposal costs have an incentive to design products that are easier to repair or recycle, supporting material recovery after consumers discard unwanted goods.","why":"設計改善の誘因だけを述べ、小規模企業の負担と支払い方法の調整が抜けている。"},{"t":"Producer responsibility completely eliminates waste and guarantees affordable compliance for every company, making additional financial flexibility unnecessary regardless of differences in business size or resources.","why":"廃棄物の全廃と全企業の負担可能性を保証し、柔軟性も不要とするのは本文に反する。"}],"answer":0,"point":"環境面の誘因と企業規模による負担差を残し、柔軟な支払いで結ぶ。","drive":{"ja":"次の段落の要点を英語1文で。生産者責任は持続可能な製品設計を促すが、小規模企業の過重な負担は環境面の誘因を保つ柔軟な支払い条件で軽減し得る。","en":"Producer responsibility encourages sustainable product design, but adaptable payment terms may ease the disproportionate financial strain on smaller firms without weakening environmental incentives."},"level":3,"explain":"生産者責任が設計を促す節と、支払い条件が負担を和らげ得る節をbutで結ぶ。without＋動名詞で、対策が損なわずに保つ効果を示す。別の言い方: Keep environmental incentives intact."},{"id":"p1-summary-201","level":1,"q":"Public libraries are lending tools to residents who rarely need to use them. For example, a drill may be borrowed for three days. Sharing equipment reduces household spending and waste. However, damaged tools require repairs, which cost money. Libraries therefore need a maintenance budget if they want to keep this service available to the community.","q_ja":"公共図書館は使用頻度の低い工具を住民に貸している。例えばドリルは3日間借りられる。共有は家計の支出と廃棄物を減らす。しかし破損した工具の修理には費用がかかるため、地域でこのサービスを続けるには維持管理の予算が必要である。","choices":[{"t":"Sharing equipment reduces household spending and waste, but damaged tools require repairs, which cost money.","why":"本文の節や語句をほぼそのままつないでおり、言い換えが不十分である。"},{"t":"Lending drills for three days saves residents money, although libraries need funds to maintain equipment.","why":"ドリルと3日間という具体例・数字が残っている。"},{"t":"Equipment lending lowers expenses and waste, but maintaining the service requires funding for upkeep.","why":"正解。利点と維持費を言い換えている。"},{"t":"Tool lending reduces household costs and waste because national grants cover all library maintenance expenses.","why":"国の補助金で維持費を全額賄うという情報は本文にない。"},{"t":"Libraries lend equipment to occasional users, allowing residents to borrow tools without purchasing their own.","why":"貸出の利用方法だけに注目し、段落全体の要点を含めていない。"},{"t":"Library equipment sharing eliminates household waste while providing sufficient savings to finance every necessary repair.","why":"廃棄物の解消と全修理費の確保と断定しており、本文の範囲を超えている。"}],"answer":2,"point":"具体例を省き、利点と維持費を要約に残す。","drive":{"ja":"次の段落の要点を英語1文で。道具の貸出は支出と廃棄物を減らすが、継続には維持費の確保が必要である。","en":"Equipment lending lowers expenses and waste, but maintaining the service requires funding for upkeep."},"explain":"Equipment lendingが主語で、lowersは支出と廃棄物の削減を表す。but以下ではmaintaining the serviceを主語にして維持資金の必要性を対比する。別の言い方: Lending equipment reduces costs and waste, but money for maintenance is needed to sustain the service."},{"id":"p1-summary-202","level":2,"q":"Some municipalities offer reduced bus fares during quiet periods to attract passengers who would otherwise drive. In one trial, tickets purchased after ten in the morning cost half the usual price. The scheme increased use of existing vehicles without requiring additional services. Nevertheless, employees with fixed starting times gained little, prompting officials to consider whether separate measures were needed to make public transport affordable for them.","q_ja":"一部の自治体は通常なら車を使う人を呼び込むため、閑散時のバス運賃を下げている。ある試行では午前10時以降の切符を半額にした。増便なしで既存車両の利用が増えたが、始業時刻が固定された労働者の恩恵は小さかった。当局は彼らにも利用しやすい価格にする別の対策が必要か検討している。","choices":[{"t":"The scheme increased use of existing vehicles without requiring additional services, but employees with fixed starting times gained little from it.","why":"本文の節や語句をほぼそのままつないでおり、言い換えが不十分である。"},{"t":"Half price tickets after ten increased bus use without extra services, although workers with fixed starting times received little benefit from discounts.","why":"午前10時と半額という具体例・数字が残っている。"},{"t":"Lower fares during quiet periods encourage bus travel, while employers compensate workers whose fixed schedules prevent them from receiving the same discounts.","why":"雇用主が労働者に補償するという情報は本文にない。"},{"t":"Municipalities attract drivers by lowering fares during quiet periods, increasing passenger numbers on existing buses without the expense of providing additional services.","why":"既存車両の利用促進だけに注目し、段落全体の要点を含めていない。"},{"t":"Reducing fares outside busy periods makes existing buses more efficient and ensures affordable public transport for workers regardless of their fixed starting times.","why":"勤務時間を問わず手頃な交通を保証すると断定しており、本文の範囲を超えている。"},{"t":"Discounted travel outside busy hours improves existing transport use, although workers with inflexible schedules may require other forms of financial support.","why":"正解。利用促進と恩恵が届きにくい労働者への対応を言い換えている。"}],"answer":5,"point":"具体例を省き、利用促進と恩恵が届きにくい労働者への対応を要約に残す。","drive":{"ja":"次の段落の要点を英語1文で。閑散時の割引は既存交通の利用を増やすが、勤務時間が固定された人には別の経済的支援が必要になる可能性がある。","en":"Discounted travel outside busy hours improves existing transport use, although workers with inflexible schedules may require other forms of financial support."},"explain":"Discounted travel outside busy hoursが主語で、improvesは既存交通の活用改善を示す。although節は勤務時間が固定された労働者には別の経済的支援が必要かもしれないと補う。別の言い方: Off-peak fare discounts improve the use of existing transport, although workers with fixed schedules may need different financial assistance."},{"id":"p1-summary-203","level":3,"q":"To accelerate scientific discovery, a funding agency requires researchers to release their underlying data when publishing results. Shared records, including measurements from coastal monitoring stations, enable independent teams to test conclusions and avoid duplicating work. Yet data stripped of context may be misinterpreted. Consequently, the agency permits a limited delay when researchers need time to prepare explanatory material, balancing prompt access against the risk that apparently transparent information could generate misleading findings.","q_ja":"ある助成機関は科学的発見を早めるため、成果発表時に基礎データの公開を求めている。沿岸観測所の測定値などを共有すれば、独立した研究班が結論を検証し、作業の重複を避けられる。しかし背景情報がなければ誤解され得る。そこで説明資料の準備が必要な場合には短い延期を認め、迅速な利用と誤った知見が生じる危険の釣り合いを図っている。","choices":[{"t":"Requiring research data disclosure facilitates verification and reduces redundant effort, while allowing brief postponements for contextual explanations helps prevent incorrect interpretations of the evidence being shared.","why":"正解。公開の利点と誤解を防ぐための限定的延期を言い換えている。"},{"t":"Shared records enable independent teams to test conclusions and avoid duplicating work, yet data stripped of context may be misinterpreted when researchers publish their underlying results.","why":"本文の節や語句をほぼそのままつないでおり、言い換えが不十分である。"},{"t":"Opening measurements from coastal monitoring stations supports independent verification and reduces repeated research, although accompanying explanations may require a short delay to prevent misleading interpretations of findings.","why":"沿岸観測所の測定値という具体例・数字が残っている。"},{"t":"Mandatory disclosure supports scientific verification and limits duplicated research, while an independent review board certifies every dataset before publication to prevent misunderstandings arising from missing contextual information.","why":"独立審査委員会が全データを認証するという情報は本文にない。"},{"t":"Access to underlying research records allows independent teams to examine published conclusions and identify work already completed, thereby improving the efficiency of projects supported by the funding agency.","why":"公開による検証と作業効率化だけに注目し、段落全体の要点を含めていない。"},{"t":"Combining compulsory data release with brief delays for explanatory material guarantees reliable secondary research, since adequate context removes the possibility of misinterpretation by independent teams examining published findings.","why":"説明資料があれば誤解の可能性がなくなると断定しており、本文の範囲を超えている。"}],"answer":0,"point":"具体例を省き、公開の利点と誤解を防ぐための限定的延期を要約に残す。","drive":{"ja":"次の段落の要点を英語1文で。研究データの公開は検証と重複削減に役立ち、背景説明の準備に限った短い延期は誤解の防止につながる。","en":"Requiring research data disclosure facilitates verification and reduces redundant effort, while allowing brief postponements for contextual explanations helps prevent incorrect interpretations of the evidence being shared."},"explain":"Requiring以下が主語で、facilitatesとreducesが検証促進と重複作業削減を並べる。while節は背景説明のための短い延期が誤解の防止に役立つことを示す。別の言い方: Mandatory research data sharing aids verification and avoids duplicated work, while brief delays to supply context help prevent misinterpretation."},{"id":"p1-summary-204","level":1,"q":"Cities are planting trees near busy roads to provide shade during hot weather. One neighborhood added twenty trees beside a bus stop. Such planting makes outdoor travel more comfortable. However, trees need regular watering to survive dry summers. Local authorities must therefore arrange continued care rather than assume that planting alone will deliver lasting benefits.","q_ja":"都市は暑い時期に日陰を作るため交通量の多い道路沿いに植樹している。ある地区はバス停のそばに20本を追加した。屋外の移動は快適になるが、乾燥する夏を越すには定期的な水やりが必要である。自治体は植えるだけで効果が続くと考えず、継続的な世話を手配する必要がある。","choices":[{"t":"Such planting makes outdoor travel more comfortable, but trees need regular watering to survive dry summers.","why":"本文の節や語句をほぼそのままつないでおり、言い換えが不十分である。"},{"t":"Adding twenty trees beside bus stops improves comfort, provided cities maintain them throughout dry summer months.","why":"バス停と20本という具体例・数字が残っている。"},{"t":"Roadside planting improves summer travel while residents receive tax reductions for watering trees near their homes.","why":"水やりをする住民への減税という情報は本文にない。"},{"t":"Trees beside busy roads offer shade, making journeys outdoors more pleasant for people during hot weather.","why":"日陰による移動の快適さだけに注目し、段落全体の要点を含めていない。"},{"t":"Urban planting improves comfort in hot weather, but its lasting value depends on ongoing maintenance.","why":"正解。植樹の効果と継続的な管理を言い換えている。"},{"t":"Planting roadside trees permanently protects urban travelers from heat without requiring further spending on tree care.","why":"追加管理費なしで恒久的な保護が得られると断定しており、本文の範囲を超えている。"}],"answer":4,"point":"具体例を省き、植樹の効果と継続的な管理を要約に残す。","drive":{"ja":"次の段落の要点を英語1文で。都市の植樹は暑い日の快適さを高めるが、効果の持続には管理が必要である。","en":"Urban planting improves comfort in hot weather, but its lasting value depends on ongoing maintenance."},"explain":"Urban plantingが主語で、improvesは暑い時期の快適性向上を表す。but以下のdepend onは、その効果の持続には継続的管理が必要だと示す。別の言い方: Planting trees in cities makes hot weather more comfortable, but sustained benefits depend on continued care."},{"id":"p1-summary-205","level":2,"q":"Manufacturers increasingly offer appliances through monthly subscriptions, retaining ownership while customers pay for their use. A washing machine, for instance, may be supplied with repairs included. Because firms remain responsible for the equipment, they have an incentive to build durable products. However, subscribers who continue paying for many years may spend more than buyers, making clear information about total costs essential before households commit to such arrangements.","q_ja":"家電メーカーは所有権を保持したまま月額料金で利用させる方式を増やしている。例えば洗濯機に修理を付けて提供する。企業は機器への責任を負い続けるため丈夫な製品を作る動機を持つ。しかし長年の利用者の支出は購入者を上回る可能性があり、契約前に総費用を明示する必要がある。","choices":[{"t":"Firms remain responsible for the equipment and have an incentive to build durable products, but subscribers may spend more than buyers over many years.","why":"本文の節や語句をほぼそのままつないでおり、言い換えが不十分である。"},{"t":"Subscription models encourage manufacturers to improve product durability, but consumers need transparent lifetime charges because extended use may prove more expensive than ownership.","why":"正解。耐久性向上の動機と長期費用の開示を言い換えている。"},{"t":"Washing machine subscriptions including repairs encourage durable production, but households paying monthly for many years may face greater total costs than those purchasing appliances.","why":"修理付き洗濯機という具体例・数字が残っている。"},{"t":"Retaining appliance ownership encourages durable manufacturing, while a legal cap on subscription periods protects customers from paying more than the original purchase price over time.","why":"契約期間の法的上限という情報は本文にない。"},{"t":"Manufacturers retaining ownership have a financial reason to supply durable appliances, since responsibility for equipment continues throughout the period in which customers use their products.","why":"メーカーの耐久性向上への動機だけに注目し、段落全体の要点を含めていない。"},{"t":"Appliance subscriptions lead manufacturers to produce durable equipment and ultimately provide every household with lower lifetime costs than purchasing the same products through ordinary retail channels.","why":"どの家庭でも総費用が購入より低くなると断定しており、本文の範囲を超えている。"}],"answer":1,"point":"具体例を省き、耐久性向上の動機と長期費用の開示を要約に残す。","drive":{"ja":"次の段落の要点を英語1文で。定額利用はメーカーに耐久性向上を促すが、長期には購入より高くなり得るため総費用の明示が必要である。","en":"Subscription models encourage manufacturers to improve product durability, but consumers need transparent lifetime charges because extended use may prove more expensive than ownership."},"explain":"Subscription modelsが主語で、encourage A to doは製造業者に耐久性向上を促すことを示す。but以下は、長期利用が購入より高くつく可能性を理由に総費用の明示を求める。別の言い方: Subscriptions encourage more durable products, but consumers need clear total charges because prolonged subscription use may cost more than buying."},{"id":"p1-summary-206","level":3,"q":"A regional government links business tax relief to the creation of local jobs, hoping to attract investment without simply rewarding firms for relocating. Applicants must demonstrate that the positions would not exist without assistance. However, this claim is difficult to verify, particularly when companies have already planned expansion. Officials therefore compare applications with wider employment trends, recognizing that an increase in reported hiring does not necessarily reveal how much the subsidy actually contributed.","q_ja":"ある地方政府は単なる企業移転への報酬を避けながら投資を呼び込むため、事業税減免を地元雇用の創出に結び付けている。申請者は支援なしではその雇用が生まれなかったことを示す必要があるが、すでに拡大を計画していた企業では検証が難しい。当局は採用増だけでは補助金の寄与を判断できないと考え、申請を全体の雇用動向と比較している。","choices":[{"t":"Applicants must demonstrate that the positions would not exist without assistance, although this claim is difficult to verify, particularly when companies have already planned expansion in the region.","why":"本文の節や語句をほぼそのままつないでおり、言い換えが不十分である。"},{"t":"Business tax relief tied to local jobs attracts investment, but companies already planning expansion complicate verification, leading officials to compare their applications with wider employment trends across the region.","why":"事業税減免という具体的手段と拡大計画のある企業の事例という具体例・数字が残っている。"},{"t":"Job incentives aim to generate additional employment, but uncertainty about their impact has led officials to require firms to repay assistance whenever recruitment falls below regional employment growth.","why":"地域の雇用増を下回る場合の返還義務という情報は本文にない。"},{"t":"Employment incentives seek genuinely additional hiring, but assessing their contribution requires broader comparisons because reported recruitment alone cannot establish whether public assistance caused the jobs to emerge.","why":"正解。追加的雇用という狙いと因果関係の検証の難しさを言い換えている。"},{"t":"By requiring applicants to demonstrate that assistance is necessary for new positions, regional authorities seek to attract investment while avoiding financial rewards for businesses that merely move existing operations.","why":"制度の狙いと申請条件だけに注目し、段落全体の要点を含めていない。"},{"t":"Comparison with regional employment trends enables officials to determine precisely which jobs subsidies created, ensuring that tax relief rewards only firms whose recruitment depends on receiving financial assistance.","why":"比較すれば創出雇用を正確に特定できると断定しており、本文の範囲を超えている。"}],"answer":3,"point":"具体例を省き、追加的雇用という狙いと因果関係の検証の難しさを要約に残す。","drive":{"ja":"次の段落の要点を英語1文で。雇用支援は追加的な採用を狙うが、採用数だけでは効果を特定できず広い比較が必要である。","en":"Employment incentives seek genuinely additional hiring, but assessing their contribution requires broader comparisons because reported recruitment alone cannot establish whether public assistance caused the jobs to emerge."},"explain":"Employment incentivesが主語で、seekは追加的な雇用の創出という目的を示す。because節は採用報告だけで支援の因果的貢献を確定できないため広い比較が必要だと説明する。別の言い方: Employment incentives aim to create additional jobs, but their impact needs wider comparisons because hiring figures alone cannot show that assistance caused those jobs."},{"id":"p1-summary-207","level":1,"q":"Local councils publish spending reports online so residents can see how public money is used. One report lists the cost of repairing five bridges. However, technical language often makes these documents difficult to understand. Adding plain explanations would help citizens judge spending decisions and take a more informed part in discussions about future public services.","q_ja":"自治体は公金の使途を住民が確認できるよう支出報告書をオンライン公開している。ある報告書には橋5本の修繕費が載っている。しかし専門用語で理解しづらい場合が多い。平易な説明を加えれば市民は支出判断を評価し、今後の公共サービスについて理解に基づいた議論に参加しやすくなる。","choices":[{"t":"Accessible explanations of public expenditure help residents evaluate government choices and participate meaningfully in policy discussions.","why":"正解。分かりやすい説明と住民参加への効果を言い換えている。"},{"t":"Adding plain explanations would help citizens judge spending decisions and take a more informed part in discussions.","why":"本文の節や語句をほぼそのままつないでおり、言い換えが不十分である。"},{"t":"Explaining the cost of repairing five bridges helps citizens evaluate spending and discuss future public services more effectively.","why":"橋5本の修繕費という具体例・数字が残っている。"},{"t":"Clear spending reports improve public participation by allowing residents to vote directly on every proposed council purchase.","why":"自治体の購入への住民の直接投票という情報は本文にない。"},{"t":"Councils place spending documents online, giving residents access to information about how officials use money for public services.","why":"支出情報のオンライン公開だけに注目し、段落全体の要点を含めていない。"},{"t":"Publishing spending reports ensures that residents understand financial decisions and reach agreement on priorities for future public services.","why":"公開すれば理解と合意が保証されると断定しており、本文の範囲を超えている。"}],"answer":0,"point":"具体例を省き、分かりやすい説明と住民参加への効果を要約に残す。","drive":{"ja":"次の段落の要点を英語1文で。公金支出の分かりやすい説明は、住民による判断の評価と政策議論への参加を助ける。","en":"Accessible explanations of public expenditure help residents evaluate government choices and participate meaningfully in policy discussions."},"explain":"Accessible explanationsが主語で、helpに続くevaluateとparticipateが住民の二つの行動を並べる。分かりやすい公的支出の説明による評価と参加への効果を表す。別の言い方: Clear explanations of public spending help residents assess government decisions and contribute meaningfully to policy debates."},{"id":"p1-summary-208","level":2,"q":"Coastal communities are restoring wetlands as a defense against flooding. Unlike concrete barriers, these areas absorb water while providing habitats for wildlife. For example, reeds planted near a harbor can slow incoming waves. Restoration nevertheless requires land that might otherwise support housing or farming. Decisions about expansion must therefore weigh environmental protection against competing local needs, rather than treating the availability of natural defenses as a reason to ignore land use conflicts.","q_ja":"沿岸地域は洪水対策として湿地を再生している。湿地は水を吸収し野生生物の生息地も提供する。例えば港のそばのアシは波を弱める。しかし再生には住宅や農業に使える土地が必要である。拡大に当たっては自然の防御機能があるからと土地利用の対立を無視せず、環境保護と地元の他の需要を比較する必要がある。","choices":[{"t":"These areas absorb water while providing habitats for wildlife, but restoration requires land that might otherwise support housing or farming in the local community.","why":"本文の節や語句をほぼそのままつないでおり、言い換えが不十分である。"},{"t":"Reeds planted near a harbor slow waves and shelter wildlife, but expanding restored wetlands requires balancing environmental benefits against local housing and agricultural land needs.","why":"港のアシという具体例・数字が残っている。"},{"t":"Restoring wetlands reduces flood risks and protects wildlife, while compensation from national authorities enables communities to resolve competition for residential and agricultural land.","why":"国による補償という情報は本文にない。"},{"t":"Natural coastal defenses absorb floodwater and provide wildlife habitats, supporting environmental protection through wetland restoration that reduces the force of waves approaching vulnerable communities.","why":"自然の防御機能と生息地の提供だけに注目し、段落全体の要点を含めていない。"},{"t":"Wetland recovery offers flood protection and ecological benefits, but its demand for space requires balancing conservation with other community priorities for land use.","why":"正解。防災と生態系の利点、土地利用の調整を言い換えている。"},{"t":"The flood protection and wildlife benefits of restoring wetlands outweigh competing housing and farming needs, making their expansion the preferred land use in every coastal community.","why":"どの地域でも他の土地利用より湿地が優先されると断定しており、本文の範囲を超えている。"}],"answer":4,"point":"具体例を省き、防災と生態系の利点、土地利用の調整を要約に残す。","drive":{"ja":"次の段落の要点を英語1文で。湿地再生は防災と生態系に役立つが、必要な土地を地域の他の用途と調整する必要がある。","en":"Wetland recovery offers flood protection and ecological benefits, but its demand for space requires balancing conservation with other community priorities for land use."},"explain":"Wetland recoveryが主語で、offersは洪水防御と生態系への便益を並べる。but以下は必要な土地を確保するため保全と地域の他の土地需要を調整すべきだと示す。別の言い方: Restoring wetlands protects against floods and benefits ecosystems, but the space required must be balanced against other local land-use priorities."},{"id":"p1-summary-209","level":3,"q":"Universities increasingly recognize short professional courses as credit toward full degrees, allowing employed adults to accumulate qualifications gradually. Courses in areas such as digital security may reflect workplace needs more quickly than conventional programs. Nevertheless, accepting each course independently risks producing a collection of skills without a coherent academic foundation. Institutions are therefore developing common assessment standards, so that flexible routes broaden access while preserving the depth expected of a university qualification.","q_ja":"大学は短期の職業講座を学位の単位として認めるようになり、働く成人が段階的に資格を得られるようにしている。デジタルセキュリティーなどの講座は従来の課程より素早く職場の需要を反映し得る。しかし個別に認めると一貫した学問的基盤のない技能の寄せ集めになりかねない。大学は機会拡大と学問的な深さを両立させる共通評価基準を整備している。","choices":[{"t":"Accepting each course independently risks producing a collection of skills without a coherent academic foundation, so institutions are developing common assessment standards while preserving the depth expected of a university qualification.","why":"本文の節や語句をほぼそのままつないでおり、言い換えが不十分である。"},{"t":"Counting digital security courses toward degrees allows employed adults to study gradually and respond to workplace needs, provided common assessment standards preserve a coherent academic foundation across the courses they complete.","why":"デジタルセキュリティー講座という具体例・数字が残っている。"},{"t":"Recognizing brief vocational study expands flexible access to relevant qualifications, while shared evaluation criteria help prevent fragmented learning from undermining the academic substance of degrees awarded through this route.","why":"正解。柔軟な学習と学問的な深さを守る共通基準を言い換えている。"},{"t":"Flexible recognition of vocational study broadens access to relevant degrees, with employers designing compulsory final examinations to ensure that accumulated course credits demonstrate the academic depth required for graduation from participating universities.","why":"雇用主が必須の最終試験を設計するという情報は本文にない。"},{"t":"Allowing employed adults to accumulate degree credits through short professional courses creates flexible opportunities to gain qualifications while enabling universities to respond more promptly to the changing skill requirements of modern workplaces.","why":"成人の学習機会拡大と職場の需要への対応だけに注目し、段落全体の要点を含めていない。"},{"t":"Common assessment standards ensure that degrees assembled from short vocational courses match conventional programs in academic depth, giving working adults equally comprehensive qualifications regardless of how their individual courses are combined.","why":"講座の組合せを問わず同等の学問的な深さが保証されると断定しており、本文の範囲を超えている。"}],"answer":2,"point":"具体例を省き、柔軟な学習と学問的な深さを守る共通基準を要約に残す。","drive":{"ja":"次の段落の要点を英語1文で。短期職業講座の認定は柔軟な学習機会を広げるが、学位の学問的な深さを守る共通評価基準が必要である。","en":"Recognizing brief vocational study expands flexible access to relevant qualifications, while shared evaluation criteria help prevent fragmented learning from undermining the academic substance of degrees awarded through this route."},"explain":"Recognizing以下が主語で、expandsは柔軟な資格取得機会の拡大を表す。while節は共通評価基準が断片的学習による学位の学術的内容の低下を防ぐ助けになると示す。別の言い方: Recognizing short vocational courses broadens flexible access to relevant qualifications, while common assessment standards help keep fragmented learning from weakening the academic substance of degrees."},{"id":"p1-summary-210","level":1,"q":"Public museums offer evening admission to reach people whose jobs prevent daytime visits. One museum now stays open until nine on Fridays. Longer hours make cultural activities more accessible. However, extra staffing raises operating costs. Managers need to compare attendance with these expenses before deciding whether the extended schedule is financially sustainable over the longer term.","q_ja":"公立博物館は仕事で昼間に来られない人のため夜間入館を実施している。ある館は金曜日に午後9時まで開くようになった。時間延長は文化へのアクセスを広げるが、人員の追加は運営費を増やす。管理者は長期的に延長を続けられるか判断する前に来館状況と費用を比較する必要がある。","choices":[{"t":"Longer hours make cultural activities more accessible, but extra staffing raises operating costs for museums offering evening admission.","why":"本文の節や語句をほぼそのままつないでおり、言い換えが不十分である。"},{"t":"Opening museums until nine on Fridays improves access, although managers must compare attendance with the cost of additional staff.","why":"金曜日の午後9時という具体例・数字が残っている。"},{"t":"Evening museum admission expands cultural participation while increased ticket prices cover the additional expense of employing staff after hours.","why":"入場料の値上げで費用を賄うという情報は本文にない。"},{"t":"Museums extend opening times to welcome workers who miss daytime admission, giving employed residents more opportunities to enjoy cultural activities.","why":"働く人の利用機会の拡大だけに注目し、段落全体の要点を含めていない。"},{"t":"Extending museum hours generates enough additional visitors to cover staffing expenses, making evening admission financially sustainable for institutions over time.","why":"追加来館者で人件費を賄えると断定しており、本文の範囲を超えている。"},{"t":"Extended museum hours widen cultural access, but their financial viability requires weighing visitor demand against staffing expenses.","why":"正解。アクセス拡大と需要に対する人件費の検討を言い換えている。"}],"answer":5,"point":"具体例を省き、アクセス拡大と需要に対する人件費の検討を要約に残す。","drive":{"ja":"次の段落の要点を英語1文で。博物館の時間延長は文化へのアクセスを広げるが、需要と人件費を比べて採算を判断する必要がある。","en":"Extended museum hours widen cultural access, but their financial viability requires weighing visitor demand against staffing expenses."},"explain":"Extended museum hoursが主語で、widenは文化へのアクセス拡大を示す。but以下のweigh A against Bは採算性を判断するため来館需要と人件費を比較することを表す。別の言い方: Longer museum hours improve cultural access, but financial sustainability depends on assessing visitor demand against staffing costs."},{"id":"p1-summary-211","level":1,"q":"Public libraries are lending tools so residents can share equipment instead of buying items they rarely use. One branch offers drills and garden tools. This service reduces household spending and waste. However, keeping the equipment safe requires regular checks. Libraries therefore need money for maintenance if they want the service to continue benefiting the community.","q_ja":"公共図書館は、住民がめったに使わない道具を買わずに共同利用できるよう、貸し出しを行っている。ある分館ではドリルや園芸道具を提供している。このサービスは家計の支出と廃棄物を減らす。ただし、安全性を保つには定期点検が必要である。そのため、地域に役立つサービスを続けるには維持管理の資金が必要だ。","choices":[{"t":"Public libraries are lending tools so residents can share equipment instead of buying items they rarely use.","why":"冒頭の文をそのまま写しており、利点と維持管理の必要性をまとめ直していない。"},{"t":"Lending drills and garden tools reduces household costs and waste, but libraries need funding for equipment maintenance.","why":"全体の流れは捉えているが、削るべき具体例のドリルと園芸道具が残っている。"},{"t":"Library equipment sharing lowers expenses and waste, but continued operation depends on funding to maintain safe equipment.","why":"正解。道具の共同利用の利点と、安全に続けるための維持費という条件を具体例なしで言い換えている。"},{"t":"Equipment loans reduce household spending and waste, while national grants cover the maintenance costs of participating public libraries.","why":"国の補助金が維持費を負担するという、本文にない制度を加えている。"},{"t":"Library tool collections help residents avoid unnecessary purchases by giving local households convenient access to occasionally needed equipment.","why":"購入を減らせるという側面を詳しく述べるだけで、廃棄物削減と維持管理の条件を落としている。"},{"t":"Library equipment sharing removes household waste and pays for its own maintenance through the savings made by residents.","why":"廃棄物をなくし、住民の節約で維持費も賄えるとするのは、本文の利点を超えた言い過ぎである。"}],"answer":2,"point":"利点と継続の条件を残し、道具の具体名は上位概念にまとめる。","drive":{"ja":"次の段落の要点を英語1文で。図書館の道具の共同利用は支出とごみを減らすが、安全な継続には維持費が必要である。","en":"Library equipment sharing lowers expenses and waste, but continued operation depends on funding to maintain safe equipment."},"explain":"Library equipment sharingが主語で、lowersは支出と廃棄物の削減を示す。but以下では安全な機器を維持する資金がサービス継続の条件になる。別の言い方: Sharing library equipment cuts costs and waste, but sustaining the service requires money to keep the equipment safe."},{"id":"p1-summary-213","level":3,"q":"Research agencies increasingly require publicly funded studies to make their data available for independent analysis. Shared records allow other researchers to test conclusions and investigate questions beyond the original project. In a coastal survey, observations were reused to examine changes in fishing activity. However, removing names does not necessarily prevent individuals from being identified through combined datasets. Access conditions should therefore reflect the sensitivity of the information rather than treating unrestricted release as the sole measure of openness.","q_ja":"研究助成機関は、公的資金による研究のデータを第三者が分析できるよう公開することを、以前にも増して求めている。記録を共有すれば、他の研究者が結論を検証し、元の研究とは別の問いを調べられる。ある沿岸調査では、観測記録が漁業活動の変化の分析に再利用された。しかし、名前を削除しても、データを組み合わせることで個人が特定される可能性は残る。したがって、無制限の公開だけを開放性の尺度とせず、情報の機微性に応じて利用条件を定めるべきである。","choices":[{"t":"Sharing research records supports verification and further inquiry, but disclosure rules should account for privacy risks instead of equating openness with unrestricted availability of potentially sensitive information.","why":"正解。共有による検証と研究の発展を示しつつ、個人特定の危険に応じた公開条件が必要という主張を捉えている。"},{"t":"Shared records allow other researchers to test conclusions and investigate questions beyond the original project, although removing names does not necessarily prevent individuals from being identified through combined datasets.","why":"本文の文や節をほぼそのままつないでおり、情報の性質に応じて公開条件を定めるという結論を言い換えていない。"},{"t":"Making research data available encourages independent analysis, as illustrated by a coastal survey reused to study fishing activity, but access restrictions should reflect the risk of identifying individuals.","why":"重要な対比は含むが、沿岸調査と漁業活動という削るべき具体例を残している。"},{"t":"Public research records strengthen scientific scrutiny, but restricting access to licensed university researchers provides the privacy protection needed to preserve the benefits of sharing sensitive information for subsequent analysis.","why":"大学研究者への資格制限でプライバシーを保護できるという、本文にない対象と効果を加えている。"},{"t":"The reuse of publicly financed research data enables independent teams to challenge earlier findings and explore additional questions, extending the scientific value of information collected for an initial investigation.","why":"共有の研究上の利点だけを詳しく述べ、個人特定の危険と公開条件を調整する必要性を落としている。"},{"t":"Any combination of shared research datasets exposes identifiable individuals, so agencies must impose strict access conditions on all publicly financed studies to preserve responsible openness and enable further scientific investigation.","why":"データを組み合わせれば必ず個人が特定され、すべての研究に厳しい条件が必要だと一般化しすぎている。"}],"answer":0,"point":"公開の価値と、情報の性質に応じて公開範囲を調整する必要性を両立させる。","drive":{"ja":"次の段落の要点を英語1文で。研究データの共有は検証と新たな研究に役立つが、無制限な公開を目指すのではなく、個人特定の危険に応じた利用条件が必要である。","en":"Sharing research records supports verification and further inquiry, but disclosure rules should account for privacy risks instead of equating openness with unrestricted availability of potentially sensitive information."},"explain":"Sharing以下が主語で、supportsは検証と追加研究への貢献を示す。but以下はプライバシーリスクを考慮し、公開性を無制限の利用可能性と同一視しない規則を求める。別の言い方: Research data sharing aids verification and further investigation, but release policies should consider privacy risks rather than define openness as unrestricted access to sensitive information."},{"id":"p1-summary-214","level":1,"q":"Many cities plant street trees to reduce summer heat and make public spaces more pleasant for local residents. One district added trees beside three bus stops. Yet young trees need water and care, especially during dry weather. Setting aside funds for this work helps cities protect their investment and maintain the benefits as the trees grow.","q_ja":"多くの都市は、夏の暑さを和らげ、住民にとって公共空間を快適にするために街路樹を植えている。ある地区は三つのバス停のそばに木を植えた。しかし、若木には、特に乾燥した時期に水やりや手入れが必要である。その作業のために予算を確保すれば、植樹への投資を守り、木の成長に伴う恩恵を保てる。","choices":[{"t":"Many cities plant street trees to reduce summer heat and make public spaces more pleasant for local residents.","why":"冒頭の文をそのまま写しており、効果の継続に必要な手入れの予算をまとめていない。"},{"t":"Trees beside three bus stops improve urban comfort, but their benefits depend on funds for regular care.","why":"要点の対比は含むが、三つのバス停という具体例と数字を残している。"},{"t":"Urban planting reduces heat, while local businesses cover tree maintenance costs through compulsory contributions to city funds.","why":"地元企業からの義務的な拠出が維持費を賄うという、本文にない仕組みを加えている。"},{"t":"Urban trees moderate heat and improve shared spaces, but lasting benefits require financial support for their upkeep.","why":"正解。街路樹の効果と、その効果を維持するための手入れの費用を具体例なしで言い換えている。"},{"t":"Newly planted urban trees require watering during dry periods to support their growth along local city streets.","why":"若木の世話という一部分だけを詳しく述べ、都市への利点と費用の確保を落としている。"},{"t":"Planting street trees prevents dangerous summer temperatures across cities once regular maintenance receives the necessary public funding.","why":"維持費があれば都市全体の危険な暑さを防げるという効果は、暑さを和らげるという本文を超えている。"}],"answer":3,"point":"植樹の効果と、その維持に必要な費用を組み合わせて要約する。","drive":{"ja":"次の段落の要点を英語1文で。街路樹は暑さを和らげ公共空間を快適にするが、効果を維持するには手入れの費用が必要である。","en":"Urban trees moderate heat and improve shared spaces, but lasting benefits require financial support for their upkeep."},"explain":"Urban treesが主語で、moderateとimproveが暑さの緩和と公共空間の改善を並べる。but以下は便益を持続させるため維持管理への資金が必要だと示す。別の言い方: Trees in cities ease heat and enhance public spaces, but continued benefits depend on financial support for maintenance."},{"id":"p1-summary-215","level":2,"q":"Governments sometimes offer training grants to workers whose jobs are threatened by automation. Courses in areas such as equipment repair may help participants move into expanding industries. However, training alone has limited value when suitable vacancies are located far from where participants live. Coordinating these grants with regional employment policies would make the support more effective by connecting newly acquired skills with realistic opportunities to use them.","q_ja":"政府は、自動化によって仕事を失うおそれのある労働者に、職業訓練の助成金を出すことがある。機器修理などの講座は、成長分野への転職に役立つ可能性がある。しかし、適した求人が居住地から遠い場所にある場合、訓練だけでは効果が限られる。助成金を地域の雇用政策と連動させれば、身につけた技能を実際に使える機会につなげられ、支援の効果が高まるだろう。","choices":[{"t":"Training alone has limited value when suitable vacancies are located far from where participants live, so governments should coordinate these grants with regional employment policies.","why":"本文の表現をほぼそのまま使っており、自動化への対応として技能と就業機会を結びつけるという要旨をまとめ直していない。"},{"t":"Retraining subsidies may ease employment transitions caused by automation, but their effectiveness depends on linking workers' new abilities with accessible jobs through coordinated regional policies.","why":"正解。自動化に伴う転職支援の意義と、技能を地域の就業機会に結びつける政策上の条件を言い換えている。"},{"t":"Subsidized equipment repair courses help workers facing automation enter growing industries, but regional employment measures must connect the skills they acquire with accessible job vacancies.","why":"論旨は捉えているが、職業訓練の具体例である機器修理の講座を残している。"},{"t":"Public retraining programs support workers displaced by automation, while compulsory relocation payments ensure that participants take suitable vacancies in regions where expanding industries need employees.","why":"転居費の支給を伴う移住の義務化によって就職を確保するという、本文にない施策と結果を加えている。"},{"t":"Grants for vocational courses allow employees threatened by automation to develop practical abilities for growing sectors, helping them prepare for changes in future skill requirements.","why":"訓練の利点だけを詳しく説明し、求人の地理的な制約と雇用政策との連携を落としている。"},{"t":"Combining regional employment policies with training subsidies guarantees successful career changes for workers affected by automation, since relevant skills will secure employment wherever participants live.","why":"政策を連携させれば居住地にかかわらず転職が成功すると保証しており、支援の効果が高まるという本文より強すぎる。"}],"answer":1,"point":"職業訓練の効果を述べる際は、技能を実際の就業機会につなげる条件も残す。","drive":{"ja":"次の段落の要点を英語1文で。自動化に対応する職業訓練の助成は、身につけた技能を通える範囲の仕事に結びつける地域政策と連携してこそ効果を高められる。","en":"Retraining subsidies may ease employment transitions caused by automation, but their effectiveness depends on linking workers' new abilities with accessible jobs through coordinated regional policies."},"explain":"Retraining subsidiesが主語で、may easeは自動化に伴う就業移行を助ける可能性を示す。but以下は地域政策を連携させて新技能を利用可能な仕事に結びつけることが効果の条件だと述べる。別の言い方: Retraining grants may help workers change jobs as automation advances, but success depends on coordinated regional policies connecting new skills with accessible employment."},{"id":"p1-summary-216","level":3,"q":"Environmental labels increasingly report the emissions generated while products are manufactured. Although this information helps consumers compare goods, it may overlook differences in durability. A jacket requiring relatively high production emissions might be worn for ten years, whereas a cheaper alternative may need frequent replacement. Consequently, judging environmental performance solely at the factory gate could favor products that create more waste over time. Meaningful comparisons require consideration of both production impacts and the length of useful service.","q_ja":"環境ラベルには、製品の製造時に生じる排出量が表示されることが増えている。この情報は消費者の比較に役立つが、耐久性の違いを見落とすおそれがある。製造時の排出量が比較的多い上着でも十年間着られる一方、安価な代替品は頻繁な買い替えを要するかもしれない。そのため、製造段階だけで環境性能を判断すると、長期的にはより多くの廃棄物を生む製品を高く評価しかねない。有意義な比較には、製造時の影響と使用できる期間の両方を考慮する必要がある。","choices":[{"t":"Judging environmental performance solely at the factory gate could favor products that create more waste over time, so meaningful comparisons require consideration of production impacts and useful service.","why":"本文の語句や節をほぼそのままつないでおり、耐久性を含めた評価という要旨を十分に言い換えていない。"},{"t":"Environmental comparisons should include manufacturing emissions and durability, since a jacket worn for ten years may have advantages over alternatives that require frequent replacement despite lower initial production impacts.","why":"比較の論理は含むが、上着と十年間という具体例や数字を残している。"},{"t":"Assessing products through manufacturing emissions and durability improves environmental comparisons, while standardized repair guarantees ensure that consumers achieve the expected reductions in waste throughout each product's useful service life.","why":"統一された修理保証が廃棄物削減を確実にするという、本文にない制度と効果を加えている。"},{"t":"Manufacturing emissions labels help buyers distinguish between goods by revealing environmental pressures associated with production, giving consumers information that may guide their choices among competing products in retail markets.","why":"製造時の排出量表示の役割だけを詳しく述べ、耐久性を無視した比較の問題と評価方法の改善を落としている。"},{"t":"Environmental assessments should weigh manufacturing impacts alongside product longevity, because focusing on initial emissions alone may misleadingly reward goods whose repeated replacement increases waste over their useful lives.","why":"正解。製造時の排出量だけの評価が買い替えによる廃棄物を見落とす点と、耐久性も考慮すべきという結論を一般化している。"},{"t":"Products with greater durability impose smaller environmental burdens than competing alternatives, making service life the decisive measure of sustainability regardless of differences in emissions generated during the manufacturing process.","why":"耐久性が高ければ製造時の排出量にかかわらず環境負荷が小さいと断定し、両方を考慮するという本文の結論を超えている。"}],"answer":4,"point":"製造時だけの評価の限界を捉え、耐久性を加えた比較へ一般化する。","drive":{"ja":"次の段落の要点を英語1文で。製造時の排出量だけでは買い替えによる廃棄物を見落とすため、環境評価には製品の耐久性も含める必要がある。","en":"Environmental assessments should weigh manufacturing impacts alongside product longevity, because focusing on initial emissions alone may misleadingly reward goods whose repeated replacement increases waste over their useful lives."},"explain":"should weighは製造時の負荷と製品寿命を併せて評価すべきだという提案を示す。because節は初期排出量だけの評価が買い替えによる廃棄物増加を見逃す理由を述べる。別の言い方: Environmental evaluations should consider manufacturing impacts and durability together, since judging initial emissions alone may wrongly favor products whose repeated replacement creates more waste."},{"id":"p1-summary-217","level":1,"q":"Some towns invite residents to help decide how a small share of public money should be spent. People discuss proposals, including new playgrounds. Taking part helps them understand local needs and gives them a stronger voice. However, meetings held only in the evening exclude some workers. Offering different ways to participate would make these decisions more representative.","q_ja":"一部の町では、公的資金の一部の使い道を決める際に住民の参加を求めている。住民は新しい遊び場などの案を話し合う。参加は地域の必要への理解を深め、住民の発言力を高める。しかし、会合を夜だけに開くと、参加できない労働者もいる。参加方法を増やせば、より幅広い住民の意見を反映した決定にできるだろう。","choices":[{"t":"Taking part helps them understand local needs and gives them a stronger voice in public spending decisions.","why":"本文の一文をほぼそのまま使っており、参加方法を広げる必要性を要約していない。"},{"t":"Residents discuss new playgrounds when allocating public funds, but wider participation methods would help include more workers.","why":"参加方法の課題は含むが、新しい遊び場という個別の提案を残している。"},{"t":"Community budgeting strengthens public involvement, but broader access to participation is needed to reflect more residents' views.","why":"正解。予算決定への住民参加の意義と、幅広い意見を反映するための参加方法の改善をまとめている。"},{"t":"Resident involvement improves local budget decisions, while employers must provide paid leave for workers attending public meetings.","why":"雇用主が会合参加のための有給休暇を認める義務があるという、本文にない制度を加えている。"},{"t":"Discussing budget proposals develops residents' knowledge of local needs and gives communities opportunities to debate public spending.","why":"話し合いによる理解と発言の機会だけを詳しく述べ、参加できない人への対応を落としている。"},{"t":"Expanding participation in community budgeting ensures that final spending decisions satisfy every resident's preferences about local priorities.","why":"参加方法を広げれば全住民の希望を満たせると断定しており、意見の反映が広がるという本文より強すぎる。"}],"answer":2,"point":"住民参加の意義と、参加しにくい人にも機会を広げる必要性をまとめる。","drive":{"ja":"次の段落の要点を英語1文で。予算への住民参加は住民の関与を強めるが、より幅広い意見を反映するには参加方法を広げる必要がある。","en":"Community budgeting strengthens public involvement, but broader access to participation is needed to reflect more residents' views."},"explain":"Community budgetingが主語で、strengthensは公共参加の強化を示す。but以下はより多くの
