would not have been exposed during last year's floods.","why":"来年の計画更新を昨年の被害を防ぐ条件にしており、条件と結果の時間関係が成立していない。"},{"t":"Had local authorities updated their evacuation plans beforehand, so many residents would not now be exposed to danger during the current floods.","why":"帰結を現在の洪水での危険に変えており、昨年の洪水についての過去の帰結を表していない。"},{"t":"Local authorities would have updated their evacuation plans beforehand if last year's floods had exposed so many residents to danger in the region.","why":"昨年の洪水による危険を事前の計画更新の条件にしており、原因と結果の時間的な順序が逆になっている。"}],"answer":2,"point":"Had 主語 過去分詞はIf 主語 had 過去分詞の倒置形で、過去の事実に反する条件を表す。","drive":{"ja":"もし自治体が事前に避難計画を更新していたなら、昨年の洪水でこれほど多くの住民が危険にさらされることはなかっただろう。","en":"Had local authorities updated their evacuation plans beforehand, so many residents would not have been exposed to danger during last year's floods."},"level":3,"explain":"Hadの倒置で過去の条件、主節で帰結を示す。仮定法過去完了は対策の不備の検証に使える。別の言い方: If plans had been updated, fewer residents would have been at risk."},{"id":"p1-ja2en-008","q":"独立機関が評価したその政策は、低所得世帯の医療サービスへのアクセスを改善すると期待されている。","q_ja":"独立機関による評価が政策を修飾し、アクセス改善への期待もその政策に向けられている文を選ぶ。","choices":[{"t":"The policy, which was evaluated by an independent agency, is expected to improve access to healthcare services for households with low incomes.","why":"正解。非制限用法の関係詞節が政策を説明し、低所得世帯の医療へのアクセスを改善するのも政策となっている。"},{"t":"The independent agency, which was evaluated under the policy, is expected to improve access to healthcare services for households with low incomes.","why":"評価された対象を政策から独立機関へ変え、アクセス改善が期待される対象も独立機関にしている。"},{"t":"The policy is expected to improve access to healthcare services for households with low incomes, which were evaluated by an independent agency.","why":"関係詞節が低所得世帯を修飾しており、独立機関が評価した対象が政策ではなく世帯になっている。"},{"t":"The policy is expected to improve access for households with low incomes to healthcare services that were evaluated by an independent agency.","why":"独立機関による評価が医療サービスを修飾しており、政策を評価したという意味になっていない。"},{"t":"An independent agency is expected to evaluate the policy that has improved access to healthcare services for households with low incomes.","why":"政策の評価を将来の期待にし、アクセスの改善をすでに生じた事実にして、二つの出来事の時制を変えている。"},{"t":"The policy, which evaluated an independent agency, is expected to improve access to healthcare services for households with low incomes in the region.","why":"関係詞節を能動態にし、評価を受けた政策ではなく独立機関を評価した政策という意味にしている。"}],"answer":0,"point":"非制限用法のwhich節では、先行詞と、節内でその先行詞が果たす役割を確認する。","drive":{"ja":"独立機関が評価したその政策は、低所得世帯の医療サービスへのアクセスを改善すると期待されている。","en":"The policy, which was evaluated by an independent agency, is expected to improve access to healthcare services for households with low incomes."},"level":2,"explain":"政策が主語で、which節は評価の補足。is expected toは見通しを示し、要約で事実と区別する。別の言い方: The evaluated policy should improve their access to care."},{"id":"p1-ja2en-009","q":"確かに自動化は生産性を高めるが、そのことは職を失う労働者への支援を怠る理由にはならない。","q_ja":"生産性向上を認めても、失職する労働者への支援を怠ることは正当化されないという論理を選ぶ。","choices":[{"t":"Admittedly, neglecting support for displaced workers increases productivity, but this does not justify the introduction of automation throughout the economy.","why":"譲歩する内容を支援の放置による生産性向上に変え、正当化されない対象も自動化の導入に変えている。"},{"t":"Although automation increases productivity, neglecting support for displaced workers is necessary to justify the economic benefits that automation brings to society.","why":"支援を怠ることを正当化できないのではなく、自動化の利益を正当化するために支援の放置が必要だとしている。"},{"t":"Admittedly, automation increases productivity because support for displaced workers is neglected, although such support remains a major concern for policymakers.","why":"支援の放置を生産性向上の原因にしており、その向上では放置を正当化できないという関係を示していない。"},{"t":"Admittedly, automation increases productivity, but providing support for displaced workers does not justify neglecting the economic benefits of automation itself.","why":"労働者支援によって自動化の利益を無視することは正当化できないという、逆向きの正当化関係に変えている。"},{"t":"Admittedly, automation increases productivity, provided that support for workers who lose their jobs is neglected during the transition to automated production.","why":"生産性向上を認める譲歩と支援放置への反論を、支援の放置が生産性向上の条件だという内容に変えている。"},{"t":"Admittedly, automation increases productivity, but this does not justify neglecting support for workers who lose their jobs as a result.","why":"正解。自動化の利点を認めつつ、それを理由に自動化で失職する労働者への支援を怠ることは正当化できないと述べている。"}],"answer":5,"point":"Admittedly A, but this does not justify Bで、Aを認めてもBの正当化にはならないと述べる。","drive":{"ja":"確かに自動化は生産性を高めるが、そのことは職を失う労働者への支援を怠る理由にはならない。","en":"Admittedly, automation increases productivity, but this does not justify neglecting support for workers who lose their jobs as a result."},"level":3,"explain":"butで利点と責任を対比し、thisは自動化による生産性向上を指す。justify＋動名詞は、そのことが支援を怠る正当な理由になるかを表す。別の言い方: Admittedly, automation raises productivity, but that does not excuse failing to support workers who lose their jobs as a result."},{"id":"p1-ja2en-010","q":"デジタル技術へのアクセスの拡大は、行政サービスを利用しやすくするだけでなく、政治参加も促す。","q_ja":"アクセスの拡大を共通の主語として、行政サービスの利用と政治参加への二つの効果を並べる。","choices":[{"t":"The expansion of access to digital technology results not only from easier access to public services but also from increased political participation.","why":"アクセスの拡大を二つの効果の原因ではなく結果にし、因果の向きを逆にしている。"},{"t":"Not only public services but also political participation encourage the expansion of access to digital technology among citizens across the country.","why":"行政サービスと政治参加を主語にして、両者が技術へのアクセス拡大を促すという逆の因果を述べている。"},{"t":"The expansion of access to digital technology not only facilitates use of public services but also the encouragement of wider political participation.","why":"not onlyの後ろの動詞facilitatesに対し、but alsoの後ろが名詞句になり、二つの述語が並列になっていない。"},{"t":"The expansion of access to digital technology not only facilitates the use of public services but also encourages political participation.","why":"正解。名詞化した主語に対し、行政サービスの利用促進と政治参加の促進を二つの動詞句で並列している。"},{"t":"Expanding public services not only facilitates access to digital technology but also encourages political participation among citizens who use those services.","why":"主語をデジタル技術へのアクセス拡大から行政サービスの拡大へ変え、何が二つの効果を生むのかを取り違えている。"},{"t":"The expansion of access to digital technology encourages political participation only when citizens find it easier to make use of public services.","why":"二つの効果の並列を条件関係に変え、行政サービスを利用しやすい場合だけ政治参加を促すとしている。"}],"answer":3,"point":"not only A but also Bでは、同じ主語にかかるAとBの文法上の形をそろえる。","drive":{"ja":"デジタル技術へのアクセスの拡大は、行政サービスを利用しやすくするだけでなく、政治参加も促す。","en":"The expansion of access to digital technology not only facilitates the use of public services but also encourages political participation."},"level":2,"explain":"アクセス拡大が主語で、動詞句を並べる。not onlyで効果を追加・強調し、利点をまとめる。別の言い方: Wider digital access aids service use and political participation."},{"id":"p1-ja2en-201","q":"公共交通への補助金には費用がかかるものの、それは低所得世帯の経済的負担を軽減する。","q_ja":"公共交通への補助金には費用がかかるものの、それは低所得世帯の経済的負担を軽減する。","choices":[{"t":"Because public transport subsidies are costly, they ease the financial burden on households with low incomes.","why":"費用がかかることを負担軽減の原因にしており、日本語の譲歩関係を表していない。"},{"t":"Although public transport subsidies are costly, they ease the financial burden on households with low incomes.","why":"正解。費用という難点を認めたうえで、低所得世帯の負担を軽減する利点を述べている。"},{"t":"Public transport subsidies are costly because they ease the financial burden on households with low incomes.","why":"負担の軽減を補助金に費用がかかる原因として述べており、譲歩の意味にならない。"},{"t":"If public transport subsidies were costly, they would ease the financial burden on low-income households.","why":"補助金に費用がかかることを仮定の条件に変えており、現実の難点を認める文ではない。"},{"t":"Public transport subsidies ease the financial burden on low-income households, which makes these subsidies costly.","why":"関係節で負担軽減が費用の原因だと付け加えており、日本語にない因果関係を作っている。"},{"t":"Despite easing the financial burden on low-income households, public transport subsidies remain a costly policy.","why":"負担軽減を譲歩部分に置き、費用を主張の中心にしているため、日本語と重点が逆になる。"}],"answer":1,"point":"『ＡではあるもののＢ』は、Ａを譲歩節、主張したいＢを主節に置く。","level":1,"drive":{"ja":"公共交通への補助金には費用がかかるものの、それは低所得世帯の経済的負担を軽減する。","en":"Although public transport subsidies are costly, they ease the financial burden on households with low incomes."},"explain":"Although節は補助金に費用がかかることを認め、主節のtheyは公共交通への補助金を指す。ease the financial burden onは低所得世帯の経済的負担を軽減することを表す。別の言い方: Despite their cost, public transport subsidies relieve financial pressure on low-income households."},{"id":"p1-ja2en-202","q":"職業訓練へのアクセスを拡大することは、単に失業者数を減らすだけでなく、労働者が技術の変化に適応する力を高める。","q_ja":"職業訓練へのアクセスを拡大することは、単に失業者数を減らすだけでなく、労働者が技術の変化に適応する力を高める。","choices":[{"t":"Reducing unemployment not only broadens access to vocational training but also strengthens workers' ability to adapt to technological change.","why":"失業者数の減少を主語にし、訓練へのアクセス拡大を結果にしているため、因果の向きが違う。"},{"t":"Workers' adaptation to technological change not only broadens access to vocational training but also contributes to a reduction in unemployment.","why":"技術変化への適応を原因に置き換えており、アクセス拡大による二つの効果を述べていない。"},{"t":"Broader access to vocational training strengthens workers' adaptability only after technological change has already brought about a reduction in unemployment.","why":"技術変化による失業者数の減少を先行条件に加えており、日本語にない時間的制約がある。"},{"t":"Broadening access to vocational training not only reduces unemployment but also strengthens workers' ability to adapt to technological change.","why":"正解。動名詞句を主語にし、失業者数の減少と適応力の向上を並列の効果として述べている。"},{"t":"The broaden of access to vocational training not only reduces unemployment but also strengthens workers' ability to adapt to technological change.","why":"冠詞の後に動詞の原形を置いており、主語を正しく名詞化できていない。"},{"t":"Broadening access to vocational training reduces unemployment by relying on workers' existing ability to adapt to ongoing technological change.","why":"適応力を高める効果ではなく、既存の適応力を失業者数削減の手段にしている。"}],"answer":3,"point":"動名詞句を主語にし、『〜だけでなく…も』の二つの効果を同じ文法形式で並べる。","level":2,"drive":{"ja":"職業訓練へのアクセスを拡大することは、単に失業者数を減らすだけでなく、労働者が技術の変化に適応する力を高める。","en":"Broadening access to vocational training not only reduces unemployment but also strengthens workers' ability to adapt to technological change."},"explain":"Broadening以下の動名詞句が主語で、reducesとstrengthensが二つの効果を並べる。not only A but also Bは失業減少に加えて技術変化への適応力向上を強調する。別の言い方: Expanding access to vocational training both lowers unemployment and improves workers' capacity to adjust to technological change."},{"id":"p1-ja2en-203","q":"もし政府が十年前に沿岸の防災設備を強化していたなら、脆弱な地域社会は今、深刻な洪水被害の危険にこれほどさらされてはいないだろう。","q_ja":"もし政府が十年前に沿岸の防災設備を強化していたなら、脆弱な地域社会は今、深刻な洪水被害の危険にこれほどさらされてはいないだろう。","choices":[{"t":"Had the government reinforced coastal defenses a decade ago, vulnerable communities would not now be so exposed to the risk of severe flood damage.","why":"正解。過去の反実仮想を倒置した条件節と、現在の帰結を表す主節を組み合わせている。"},{"t":"If the government were reinforcing coastal defenses now, vulnerable communities would not have been so exposed to severe flood damage a decade ago.","why":"現在の対策を過去の被害リスクの条件にしており、条件と帰結の時間関係が逆になっている。"},{"t":"Had vulnerable communities been less exposed to severe flood damage a decade ago, the government would now be reinforcing coastal defenses across those regions.","why":"地域の被害リスクを条件、政府の整備を帰結にしており、日本語の条件と結果を入れ替えている。"},{"t":"If the government reinforced coastal defenses a decade from now, vulnerable communities would be less exposed to severe flood damage than they are today.","why":"十年前の対策という過去の仮定を、十年後の対策という将来の仮定に変えている。"},{"t":"Had the government reinforced coastal defenses a decade ago, vulnerable communities would not have been so exposed to severe flood damage at that time.","why":"帰結を当時の危険についての仮定にしており、今の危険を述べる日本語と時点が違う。"},{"t":"Were the government to reinforce coastal defenses today, vulnerable communities would not now be so exposed to the risk of severe flood damage.","why":"現在の整備を条件に置いており、十年前に整備しなかった事実への反実仮想を表していない。"}],"answer":0,"point":"過去の条件が現在に及ぼす仮定は、条件節を過去完了、帰結を現在の状態を表す形にする。","level":3,"drive":{"ja":"もし政府が十年前に沿岸の防災設備を強化していたなら、脆弱な地域社会は今、深刻な洪水被害の危険にこれほどさらされてはいないだろう。","en":"Had the government reinforced coastal defenses a decade ago, vulnerable communities would not now be so exposed to the risk of severe flood damage."},"explain":"Had＋主語＋過去分詞はifを省略した倒置で、十年前の未実現の条件を示す。主節はwould not now beによって現在の帰結を表す。別の言い方: If the government had strengthened coastal defenses ten years ago, vulnerable communities would not now face such a high risk of severe flood damage."},{"id":"p1-ja2en-204","q":"高齢者の割合が上昇しており、その結果、公的医療への需要が高まっている。","q_ja":"高齢者の割合が上昇しており、その結果、公的医療への需要が高まっている。","choices":[{"t":"Rising demand for public healthcare has consequently increased the proportion of elderly people in the population.","why":"医療需要の増加が高齢者の割合を高めたとしており、因果の向きが逆になっている。"},{"t":"The proportion of elderly people is rising because demand for public healthcare continues to grow.","why":"医療需要の増加を高齢者の割合の上昇の原因にしており、原因と結果を取り違えている。"},{"t":"Demand for public healthcare is growing despite the rising proportion of elderly people in society.","why":"高齢者の割合の上昇を需要増加に逆らう事情としており、因果関係を譲歩に変えている。"},{"t":"The proportion of elderly people is rising to bring about greater demand for public healthcare.","why":"割合の上昇に需要を高める目的があるように述べており、結果を表す日本語と違う。"},{"t":"The proportion of elderly people is rising, consequently increasing demand for public healthcare services.","why":"正解。分詞句で、高齢者の割合の上昇が医療需要の増加をもたらすことを表している。"},{"t":"A rising proportion of elderly people depends on an increase in demand for public healthcare.","why":"医療需要の増加を高齢者の割合が上昇するための条件にしており、因果関係が違う。"}],"answer":4,"point":"結果を表す分詞句では、主節の出来事が引き起こす変化を続けて述べる。","level":1,"drive":{"ja":"高齢者の割合が上昇しており、その結果、公的医療への需要が高まっている。","en":"The proportion of elderly people is rising, consequently increasing demand for public healthcare services."},"explain":"主語の中心は単数のproportionで、is risingが高齢者割合の上昇を示す。consequently increasing以下はその結果として公的医療への需要が増えることを表す。別の言い方: The share of elderly people is increasing, and as a result, demand for public healthcare is growing."},{"id":"p1-ja2en-205","q":"仮に企業に製品の環境負荷を開示する義務があれば、消費者は購入時に、より十分な情報に基づいて選択できるだろう。","q_ja":"仮に企業に製品の環境負荷を開示する義務があれば、消費者は購入時に、より十分な情報に基づいて選択できるだろう。","choices":[{"t":"If consumers made more informed purchasing decisions, companies would be required to disclose the environmental impact of the products they sell.","why":"消費者の判断を条件、企業の開示義務を帰結にしており、条件と結果が逆になっている。"},{"t":"Had companies been required to disclose their products' environmental impact, consumers could have made more informed purchasing decisions at that time.","why":"過去の義務と過去の選択への反実仮想であり、現在の制度を仮定する日本語とは時制が違う。"},{"t":"Companies would be required to disclose their products' environmental impact so that consumers had made more informed purchasing decisions in the past.","why":"将来または現在の義務の目的を過去の選択に置いており、時間関係が成り立たない。"},{"t":"If companies were required to disclose their products' environmental impact, consumers could have made more informed purchasing decisions several years ago.","why":"現在の義務を仮定する条件に対し、帰結を数年前の選択にしており、日本語の時点と異なる。"},{"t":"Consumers would be able to make more informed purchasing decisions even if companies were exempt from disclosing the environmental impact of their products.","why":"開示義務を選択改善の条件にせず、開示が免除されても成り立つという譲歩に変えている。"},{"t":"If companies were required to disclose their products' environmental impact, consumers would be able to make more informed purchasing decisions.","why":"正解。現在の制度について仮定し、情報開示によって消費者の選択が改善する帰結を述べている。"}],"answer":5,"point":"現在の仮定は、条件節に過去形、帰結に助動詞の過去形を用いて表す。","level":2,"drive":{"ja":"仮に企業に製品の環境負荷を開示する義務があれば、消費者は購入時に、より十分な情報に基づいて選択できるだろう。","en":"If companies were required to disclose their products' environmental impact, consumers would be able to make more informed purchasing decisions."},"explain":"If節のwere requiredは企業が開示を義務付けられるという受動態の仮定を示す。主節はその結果として消費者がより十分な情報に基づく判断をできることを表す。別の言い方: If companies had to reveal their products' environmental impact, consumers could make better-informed buying decisions."},{"id":"p1-ja2en-206","q":"公的研究への助成金を削減するという提案は、当面の財政負担を軽減する一方で、持続的な資金に依存する技術革新を損なうおそれがある。","q_ja":"公的研究への助成金を削減するという提案は、当面の財政負担を軽減する一方で、持続的な資金に依存する技術革新を損なうおそれがある。","choices":[{"t":"The proposal to cut public research grants, which depend on immediate fiscal relief, may undermine innovation while providing sustained funding for future technological development.","why":"関係節が助成金にかかり、資金の継続ではなく財政負担軽減への依存を述べており、修飾関係が違う。"},{"t":"By undermining innovation dependent on sustained funding, the proposal to cut public research grants may alleviate immediate fiscal pressure on the government's limited budget.","why":"技術革新を損なうこと自体を財政負担軽減の手段にしており、二つの効果の対比を因果関係に変えている。"},{"t":"The proposal to cut public research grants, while alleviating immediate fiscal pressure, may undermine technological innovation that depends on sustained funding over the long term.","why":"正解。財政面の利点を譲歩的に挟み、継続的資金に依存する技術革新への悪影響を主節で述べている。"},{"t":"The proposal to cut public research grants may undermine technological innovation while alleviating immediate fiscal pressure that depends on sustained funding over the long term.","why":"継続的資金に依存するという関係節が財政圧力を修飾しており、技術革新を修飾する日本語と違う。"},{"t":"The proposal to cut public research grants may undermine innovation if sustained funding alleviates immediate fiscal pressure, rather than through the proposed reduction in grants.","why":"継続的資金による財政負担軽減を条件に加えており、助成金削減の利点と危険を述べる構造になっていない。"},{"t":"The proposal to cut public research grants depends on sustained funding for technological innovation, which may alleviate immediate fiscal pressure while undermining the proposed cuts.","why":"継続的資金への依存を提案そのものの性質にしており、依存する対象と悪影響を受ける対象が変わっている。"}],"answer":2,"point":"挿入した譲歩節と主節を区別し、関係節が修飾する名詞まで正確に読む。","level":3,"drive":{"ja":"公的研究への助成金を削減するという提案は、当面の財政負担を軽減する一方で、持続的な資金に依存する技術革新を損なうおそれがある。","en":"The proposal to cut public research grants, while alleviating immediate fiscal pressure, may undermine technological innovation that depends on sustained funding over the long term."},"explain":"主語はproposalで、while alleviating以下が当面の財政負担軽減という利点を挟む。may undermineは継続的資金に依存する技術革新を損なう可能性を示す。別の言い方: Although the proposed reduction in public research grants would ease immediate fiscal pressure, it could harm technological innovation that relies on sustained long-term funding."},{"id":"p1-ja2en-207","q":"大企業は海外からの投資の恩恵を受ける一方、小規模な地元企業は増大する競争圧力に直面することが多い。","q_ja":"大企業は海外からの投資の恩恵を受ける一方、小規模な地元企業は増大する競争圧力に直面することが多い。","choices":[{"t":"Whereas large corporations benefit from overseas investment, small local firms often face increasing competitive pressure.","why":"正解。二つの企業集団を対比し、大企業の利益と小規模な地元企業の圧力を述べている。"},{"t":"Large corporations benefit from overseas investment because small local firms often face increasing competitive pressure.","why":"地元企業の競争圧力を大企業が利益を得る原因にしており、対比の関係を変えている。"},{"t":"Small local firms often face increasing competitive pressure to help large corporations benefit from overseas investment.","why":"競争圧力に直面する目的が大企業の利益だとしており、日本語にない目的関係を加えている。"},{"t":"Overseas investment benefits large corporations only when small local firms face increasing competitive pressure in the market.","why":"地元企業の圧力を大企業の利益の必要条件にしており、単なる対比ではなくなっている。"},{"t":"Large corporations facing increasing competitive pressure often benefit from overseas investment in small local firms.","why":"競争圧力に直面するという修飾を大企業にかけ、海外投資の対象を地元企業に変えている。"},{"t":"By facing increasing competitive pressure, small local firms enable large corporations to benefit from overseas investment.","why":"地元企業が圧力を受けることを大企業の利益を可能にする手段としており、対比になっていない。"}],"answer":0,"point":"二つの集団の異なる状況を対比するときは、接続詞でそれぞれの主語と述語を結ぶ。","level":1,"drive":{"ja":"大企業は海外からの投資の恩恵を受ける一方、小規模な地元企業は増大する競争圧力に直面することが多い。","en":"Whereas large corporations benefit from overseas investment, small local firms often face increasing competitive pressure."},"explain":"Whereas節と主節は、大企業の利益と小規模な地元企業の競争圧力を対比する。benefit fromは海外投資が利益の源であることを示す。別の言い方: Large corporations gain from foreign investment, while small local businesses often confront growing competitive pressure."},{"id":"p1-ja2en-208","q":"これらの点を総合すると、刑罰を厳しくするよりも、再犯の防止に公的資金を優先して配分すべきである。","q_ja":"これらの点を総合すると、刑罰を厳しくするよりも、再犯の防止に公的資金を優先して配分すべきである。","choices":[{"t":"Taken together, these considerations suggest that harsher penalties should be given priority when public funds are allocated to prevent reoffending.","why":"再犯防止のための資金配分で厳罰化を優先しており、日本語が示す二つの方針の優先順位が逆である。"},{"t":"To bring these considerations together, public funds should support harsher penalties before being allocated to measures aimed at preventing reoffending.","why":"点を総合することを資金配分の目的にし、さらに厳罰化を先行させる順序を付け加えている。"},{"t":"Taken together, these considerations suggest that preventing reoffending should receive public funding only after penalties have already been made harsher.","why":"厳罰化を再犯防止への資金配分の前提にしており、再犯防止を優先する結論になっていない。"},{"t":"Taking these considerations together should receive priority in public funding rather than either preventing reoffending or imposing increasingly harsh penalties.","why":"論点を総合する行為そのものを資金配分の対象にしており、結論を導く表現の役割を取り違えている。"},{"t":"Taken together, these considerations suggest that public funds should prioritize preventing reoffending rather than imposing harsher penalties on those convicted.","why":"正解。論点を総合して結論を導き、資金配分では厳罰化より再犯防止を優先すべきだと述べている。"},{"t":"These considerations should be taken together because allocating public funds to preventing reoffending necessarily leads to the imposition of harsher penalties.","why":"再犯防止への配分が厳罰化を招くという因果関係を加え、それを論点を総合する理由にしている。"}],"answer":4,"point":"論点を総合する分詞句で結論を導き、優先する行為と比較対象の行為を並列に置く。","level":2,"drive":{"ja":"これらの点を総合すると、刑罰を厳しくするよりも、再犯の防止に公的資金を優先して配分すべきである。","en":"Taken together, these considerations suggest that public funds should prioritize preventing reoffending rather than imposing harsher penalties on those convicted."},"explain":"Taken togetherは複数の論点を総合して判断することを示す。that節は公的資金の配分で厳罰化より再犯防止を優先すべきだという結論を表す。別の言い方: Considered together, these points indicate that public funding should give priority to preventing reoffending over imposing harsher penalties."},{"id":"p1-ja2en-209","q":"たとえ顔認証が治安の向上に役立つとしても、それによって、独立した監督なしに当局が生体情報を保管することが正当化されるわけではない。","q_ja":"たとえ顔認証が治安の向上に役立つとしても、それによって、独立した監督なしに当局が生体情報を保管することが正当化されるわけではない。","choices":[{"t":"Even if facial recognition improves public safety, independent oversight does not justify allowing authorities to retain biometric data for that particular purpose.","why":"正当化しないものを治安向上から独立した監督に変え、監督なしという保管の条件も落としている。"},{"t":"Even if facial recognition improves public safety, this does not justify allowing authorities to retain biometric data without independent oversight of their activities.","why":"正解。治安面の効果を仮に認めても、それを根拠に監督のない保管は正当化できないと述べている。"},{"t":"Even without independent oversight, authorities' retention of biometric data does not justify using facial recognition to improve public safety throughout the wider community.","why":"情報保管を根拠、顔認証の利用を正当化の対象にしており、日本語の論証の向きが逆になっている。"},{"t":"Even if facial recognition improves public safety without independent oversight, this does not justify allowing authorities to retain biometric data for future use.","why":"監督なしという修飾を治安向上にかけ、正当化できない対象を情報保管全般に広げている。"},{"t":"The failure of facial recognition to improve public safety would justify preventing authorities from retaining biometric data without independent oversight of their activities.","why":"効果を仮に認める譲歩を効果がない場合の条件に変え、保管の禁止を正当化する主張にしている。"},{"t":"If authorities retain biometric data without independent oversight, facial recognition must improve public safety to justify that retention under the proposed security policy.","why":"治安向上を保管の正当化に必要な条件としており、効果があっても正当化できないという否定の範囲を表していない。"}],"answer":1,"point":"『たとえＡでもＢを正当化しない』では、譲歩の範囲と、否定される正当化の対象を区別する。","level":3,"drive":{"ja":"たとえ顔認証が治安の向上に役立つとしても、それによって、独立した監督なしに当局が生体情報を保管することが正当化されるわけではない。","en":"Even if facial recognition improves public safety, this does not justify allowing authorities to retain biometric data without independent oversight of their activities."},"explain":"Even if節は顔認証の治安改善効果を仮に認め、thisがその効果を受ける。does not justifyは独立した監督のない生体情報保管を正当化できないことを示す。別の言い方: Even if facial recognition helps improve public safety, that benefit does not justify letting authorities keep biometric data without independent oversight."},{"id":"p1-ja2en-210","q":"これらの懸念を踏まえ、政府は人工知能の利用を拡大する前に、明確な基準を設けるべきである。","q_ja":"これらの懸念を踏まえ、政府は人工知能の利用を拡大する前に、明確な基準を設けるべきである。","choices":[{"t":"By expanding AI use, governments should establish clear standards before giving serious consideration to these public concerns.","why":"人工知能の利用拡大を基準策定の手段にし、懸念を検討する時点も基準策定の後にしている。"},{"t":"Governments should expand AI use before establishing clear standards, thereby taking these concerns into account when setting policy.","why":"利用拡大を基準策定より先に行うとしており、日本語の行動の順序と逆である。"},{"t":"To create these concerns, governments should establish clear standards before expanding the use of AI in public services.","why":"懸念を結論の根拠ではなく政策の目的にしており、論理関係が異なる。"},{"t":"In light of these concerns, governments should establish clear standards before expanding the use of AI.","why":"正解。懸念を判断の根拠にし、基準策定を利用拡大に先立って行うべきだと述べている。"},{"t":"Governments should establish clear standards only if expanding AI use first gives rise to these concerns among the public.","why":"利用拡大後に懸念が生じることを基準策定の条件にしており、予防的な順序を変えている。"},{"t":"These concerns should be addressed by expanding AI use, which would enable governments to establish clear standards later.","why":"利用拡大を懸念への対処法にし、基準策定をその後に置いているため、手段も順序も違う。"}],"answer":3,"point":"『〜を踏まえ』で判断の根拠を示し、『〜する前に』で提言する行動の順序を明確にする。","level":1,"drive":{"ja":"これらの懸念を踏まえ、政府は人工知能の利用を拡大する前に、明確な基準を設けるべきである。","en":"In light of these concerns, governments should establish clear standards before expanding the use of AI."},"explain":"In light of these concernsは提言の根拠となる懸念を示す。before expanding以下の動作主も政府で、利用拡大に先立つ基準策定を求める。別の言い方: Given these concerns, governments should set clear standards before extending the use of AI."},{"id":"p1-ja2en-211","q":"公共交通への投資は費用がかかるものの、地域経済を支える。","q_ja":"公共交通への投資は費用がかかるものの、地域経済を支える。","choices":[{"t":"Because public transport investment supports local economies, it requires substantial financial resources.","why":"費用がかかることを経済支援の結果としており、譲歩ではなく因果に変えている。"},{"t":"Although investment in public transport is costly, it supports the local economy.","why":"正解。費用を認めたうえで経済への効果を述べる譲歩の構文になっている。"},{"t":"Investment in local economies is costly, although it supports public transport services.","why":"投資の対象と支援される対象が入れ替わっている。"},{"t":"Despite supporting local economies, public transport investment is a costly public undertaking.","why":"譲歩の主節が費用の問題になり、日本語と主張の重点が逆になっている。"},{"t":"Public transport investment supports local economies that require substantial funding from the government.","why":"費用の説明が投資ではなく地域経済を修飾している。"},{"t":"The cost of public transport investment depends on its support for local economies.","why":"費用が経済支援に左右されるという依存関係を加えている。"}],"answer":1,"point":"譲歩は although の節で認める点を示し、主節に中心となる主張を置く。","level":1,"drive":{"ja":"公共交通への投資は費用がかかるものの、地域経済を支える。","en":"Although investment in public transport is costly, it supports the local economy."},"explain":"Although節が譲歩、主節のitは投資を指す。is costlyで費用を認め、論述で効果を主張する。別の言い方: Such investment is costly but aids the local economy."},{"id":"p1-ja2en-212","q":"公的資金の不足により、多くの自治体は老朽化した水道設備の更新を延期せざるを得なくなっている。","q_ja":"公的資金の不足により、多くの自治体は老朽化した水道設備の更新を延期せざるを得なくなっている。","choices":[{"t":"Many local authorities lack public funding because they have been forced to postpone replacing aging water infrastructure.","why":"更新延期を資金不足の原因としており、因果の向きが逆になっている。"},{"t":"Public funding shortages have forced aging local authorities to postpone replacing much of their existing water infrastructure.","why":"老朽化を表す aging が水道設備ではなく自治体を修飾している。"},{"t":"The postponement of public funding has forced many local authorities to replace their aging water infrastructure.","why":"延期される対象を資金に変え、設備更新を余儀なくされる意味にしている。"},{"t":"Many local authorities have postponed public funding to address the shortage of replacements for aging water infrastructure.","why":"自治体が資金を延期する構造になり、資金不足が原因という関係を表していない。"},{"t":"A shortage of public funding has forced many local authorities to postpone the replacement of aging water infrastructure.","why":"正解。資金不足を原因とする主語と、更新延期という結果を正しく結び付けている。"},{"t":"Despite a shortage of public funding, many local authorities have been forced to postpone replacing aging water infrastructure.","why":"資金不足を延期の原因ではなく、延期に反する事情として扱っている。"}],"answer":4,"point":"原因を名詞句の主語にし、force A to do で余儀なくされる行動を示す。","level":2,"drive":{"ja":"公的資金の不足により、多くの自治体は老朽化した水道設備の更新を延期せざるを得なくなっている。","en":"A shortage of public funding has forced many local authorities to postpone the replacement of aging water infrastructure."},"explain":"資金不足が主語、has forcedは現在完了形。force A to doで要約の因果を結ぶ。別の言い方: Funding shortages have made councils delay replacing old pipes."},{"id":"p1-ja2en-213","q":"政府が当時その制度を導入していたなら、今ではより多くの低所得世帯が安定した住居を確保できているだろう。","q_ja":"政府が当時その制度を導入していたなら、今ではより多くの低所得世帯が安定した住居を確保できているだろう。","choices":[{"t":"If the government had introduced the scheme at that particular point in time, more low-income households would now have access to stable housing.","why":"正解。過去の未実現の条件を過去完了で、現在の帰結を would と原形で表している。"},{"t":"If the government introduced the scheme now, more low-income households would have had access to stable housing at that time.","why":"導入を現在の仮定に、住居確保を過去の帰結にしており、時間関係が逆になっている。"},{"t":"If more low-income households had secured stable housing at that time, the government would now be able to introduce the scheme.","why":"世帯の住居確保を条件、政府の制度導入を帰結とし、条件と結果を逆転している。"},{"t":"Had the government introduced the scheme at that time, more low-income households would have secured stable housing before its introduction.","why":"帰結を導入前の住居確保にしており、現在の状態を述べる日本語と合わない。"},{"t":"If the government had introduced the scheme at that time, more households that now have stable housing would have had low incomes.","why":"現在の住居確保が世帯を修飾し、帰結が過去の低所得という別の内容になっている。"},{"t":"Were the government to introduce the scheme now, more low-income households would gain access to stable housing in the coming years.","why":"将来の導入と将来の効果の仮定で、過去の条件と現在の帰結を表していない。"}],"answer":0,"point":"過去の条件と現在の帰結を結ぶ混合仮定法は、had＋過去分詞と would＋原形を組み合わせる。","level":3,"drive":{"ja":"政府が当時その制度を導入していたなら、今ではより多くの低所得世帯が安定した住居を確保できているだろう。","en":"If the government had introduced the scheme at that particular point in time, more low-income households would now have access to stable housing."},"explain":"If節は過去の未実現条件、主節は今の帰結。混合仮定法で政策の現在への影響を論じる。別の言い方: Had it acted then, more low-income families would have stable homes now."},{"id":"p1-ja2en-214","q":"住宅費の上昇は、低所得世帯の負担を増大させる。","q_ja":"住宅費の上昇は、低所得世帯の負担を増大させる。","choices":[{"t":"The burden on low-income households contributes to a steady rise in housing costs.","why":"世帯の負担を住宅費上昇の原因にしており、因果が逆になっている。"},{"t":"Housing costs rise as a consequence of the increasing burden on low-income households.","why":"住宅費上昇を負担増の結果としており、原因と結果を取り違えている。"},{"t":"The increase of low-income households places a greater burden on the housing budget.","why":"increase の対象が住宅費ではなく世帯数に変わっている。"},{"t":"Housing costs place a growing burden on households whose incomes are steadily rising.","why":"上昇しているものが住宅費ではなく世帯の所得になっている。"},{"t":"The rise in housing costs results from greater financial pressure on low-income households.","why":"results from の後ろが原因となり、日本語の因果を逆転させている。"},{"t":"Rising housing costs impose a greater financial burden on households with low incomes.","why":"正解。住宅費上昇を主語にし、低所得世帯に負担を課す関係を示している。"}],"answer":5,"point":"impose a burden on で負担を課す対象を示し、原因を主語に置く。","level":1,"drive":{"ja":"住宅費の上昇は、低所得世帯の負担を増大させる。","en":"Rising housing costs impose a greater financial burden on households with low incomes."},"explain":"住宅費が主語、imposeが動詞。burden onで論述の負担を受ける側を示す。別の言い方: Higher housing costs burden low-income households more."},{"id":"p1-ja2en-215","q":"民間企業が利益を優先するのに対し、公的機関にはサービスへの公平なアクセスを確保する責任がある。","q_ja":"民間企業が利益を優先するのに対し、公的機関にはサービスへの公平なアクセスを確保する責任がある。","choices":[{"t":"Private companies prioritize profits because public institutions are responsible for ensuring equitable access to the services they provide.","why":"民間と公的機関の対比を、公的機関の責任が利益優先を生むという因果に変えている。"},{"t":"Public institutions prioritize profits, whereas private companies are responsible for ensuring that people have equitable access to services.","why":"利益を優先する主体と公平なアクセスを確保する主体が逆になっている。"},{"t":"Whereas private companies prioritize profits, public institutions are responsible for ensuring equitable access to services.","why":"正解。whereas で主体を対比し、公的機関の責任を自然に表している。"},{"t":"Private companies prioritize profits from public institutions that are responsible for ensuring equitable access to services.","why":"公的機関が利益の出所となり、二つの主体の対比が失われている。"},{"t":"Public institutions ensure equitable access to services so that private companies are able to prioritize their profits.","why":"公平なアクセスが利益優先のための手段という目的関係を加えている。"},{"t":"The responsibility of public institutions depends on whether private companies prioritize profits over equitable access to services.","why":"公的機関の責任が民間企業の姿勢次第であるという条件関係に変えている。"}],"answer":2,"point":"whereas は異なる主体や制度の特徴を対比するときに使う。","level":2,"drive":{"ja":"民間企業が利益を優先するのに対し、公的機関にはサービスへの公平なアクセスを確保する責任がある。","en":"Whereas private companies prioritize profits, public institutions are responsible for ensuring equitable access to services."},"explain":"Whereas節と主節で二者を対比する。responsible for＋動名詞で論述の責任を示す。別の言い方: Firms seek profit, while public bodies must ensure fair access."},{"id":"p1-ja2en-216","q":"支援の対象を、すでに資金を確保した研究者ではなく、資金の確保が困難な研究者に限定することが不可欠だ。","q_ja":"支援の対象を、すでに資金を確保した研究者ではなく、資金の確保が困難な研究者に限定することが不可欠だ。","choices":[{"t":"It is essential to restrict support to researchers whose funding has already been secured rather than those struggling to obtain it.","why":"支援対象の二つの集団が逆転し、資金を確保済みの研究者を対象にしている。"},{"t":"It is essential for researchers struggling to secure funding to restrict their support to those who have already obtained it.","why":"支援を限定する主体を研究者に変え、資金確保済みの人を支える意味になっている。"},{"t":"Restricting researchers to essential support makes securing funding difficult for those who have already obtained it rather than for others.","why":"支援対象の限定ではなく、研究者への制約が資金確保を難しくするという因果を述べている。"},{"t":"Restricting the provision of financial support to researchers who struggle to secure funding, rather than those who have already obtained it, is essential.","why":"正解。二つの関係節が研究者の集団を区別し、動名詞句全体が不可欠な行動を表している。"},{"t":"Supporting the imposition of restrictions on researchers who struggle to secure funding, rather than those who have already obtained it, is essential.","why":"支援を限定することではなく、研究者への制限を支持することが不可欠という意味になっている。"},{"t":"It is essential to restrict funding to support already obtained by researchers rather than to researchers who struggle to secure it.","why":"already obtained が支援を修飾し、限定する対象も研究者への支援から資金へと変わっている。"}],"answer":3,"point":"restrict A to B はＡをＢに限定する意味で、rather than 以下が比較する対象を確認する。","level":3,"drive":{"ja":"支援の対象を、すでに資金を確保した研究者ではなく、資金の確保が困難な研究者に限定することが不可欠だ。","en":"Restricting the provision of financial support to researchers who struggle to secure funding, rather than those who have already obtained it, is essential."},"explain":"Restricting以下の動名詞句が主語で、is essentialが支援対象を限定する必要性を述べる。rather than以下は資金確保済みの研究者を対象から外し、thoseでresearchersの反復を避ける。別の言い方: Financial aid must be limited to researchers who struggle to obtain funding, excluding those who have already secured it."},{"id":"p1-ja2en-217","q":"以上の理由から、政府は予防医療により多くの資源を配分すべきだ。","q_ja":"以上の理由から、政府は予防医療により多くの資源を配分すべきだ。","choices":[{"t":"For these reasons, the government should allocate more resources to preventive healthcare.","why":"正解。理由を受けた結論と、予防医療への資源配分という提言を表している。"},{"t":"The government should provide reasons for allocating more of its resources to preventive healthcare.","why":"理由を受けた結論ではなく、配分の理由を説明すべきという提言になっている。"},{"t":"Preventive healthcare should allocate more resources to the government for the reasons discussed above.","why":"資源を配分する主体と配分先が逆になっている。"},{"t":"The government should allocate more reasons to the resources provided for preventive healthcare.","why":"allocate の目的語に理由を置いており、資源を配分する意味にならない。"},{"t":"These reasons result from the government's allocation of more resources to preventive healthcare.","why":"理由が配分の根拠ではなく、配分の結果として生じる構造になっている。"},{"t":"The government should allocate resources to preventive healthcare that provides more reasons for action.","why":"more が資源ではなく理由にかかり、予防医療を修飾する内容も追加している。"}],"answer":0,"point":"allocate resources to で配分先を示し、For these reasons で論述の結論につなげる。","level":1,"drive":{"ja":"以上の理由から、政府は予防医療により多くの資源を配分すべきだ。","en":"For these reasons, the government should allocate more resources to preventive healthcare."},"explain":"政府が主語、shouldは提言。allocate A to Bで資源と配分先を示し、論述を結ぶ。別の言い方: Governments should thus devote more resources to preventive care."},{"id":"p1-ja2en-218","q":"政府が企業に排出量の開示を義務付ければ、消費者はより十分な情報に基づいて選択できるだろう。","q_ja":"政府が企業に排出量の開示を義務付ければ、消費者はより十分な情報に基づいて選択できるだろう。","choices":[{"t":"If consumers made more informed choices, the government would require companies to disclose the emissions resulting from their activities.","why":"消費者の選択を条件、政府の義務付けを帰結とし、条件と結果を逆転している。"},{"t":"Had the government required companies to disclose their emissions, consumers would have made more informed choices in the past.","why":"過去に実現しなかった条件と過去の結果で、これからの制度導入の仮定になっていない。"},{"t":"If companies required the government to disclose its emissions, consumers would be able to make more informed choices.","why":"義務を課す主体と開示を求められる主体が入れ替わっている。"},{"t":"The government would require consumers making more informed choices to disclose the emissions produced by companies.","why":"条件節が消費者を修飾する句に変わり、開示を義務付けられる対象も異なる。"},{"t":"Companies would disclose their emissions so that the government could require consumers to make more informed choices.","why":"企業の開示を手段とし、政府が消費者に選択を義務付けるという目的関係に変えている。"},{"t":"If the government required companies to disclose their emissions, consumers would be able to make more informed choices.","why":"正解。制度導入を仮定法過去の条件に置き、消費者の選択への効果を帰結として示している。"}],"answer":5,"point":"仮定の政策と予想される効果は、If＋過去形と would＋原形で結ぶ。","level":2,"drive":{"ja":"政府が企業に排出量の開示を義務付ければ、消費者はより十分な情報に基づいて選択できるだろう。","en":"If the government required companies to disclose their emissions, consumers would be able to make more informed choices."},"explain":"If節は仮定、主節は効果。require A to doで論述の義務の対象と内容を示す。別の言い方: If firms had to report emissions, consumers could choose more wisely."},{"id":"p1-ja2en-219","q":"地方自治体が運営する図書館は、住民に信頼できる情報を提供する。","q_ja":"地方自治体が運営する図書館は、住民に信頼できる情報を提供する。","choices":[{"t":"Libraries provide local authorities with reliable information about the residents who operate them.","why":"図書館の運営者が住民となり、情報の提供先も自治体に変わっている。"},{"t":"Local authorities operating libraries provide information about residents who are considered reliable.","why":"信頼できるのは情報ではなく住民となり、情報の対象も変わっている。"},{"t":"Libraries operated by local authorities provide residents with access to reliable information.","why":"正解。過去分詞句が図書館の運営主体を示し、情報の受け手も日本語と一致する。"},{"t":"Local authorities operated by libraries provide their residents with access to reliable information.","why":"operated by が自治体にかかり、図書館が自治体を運営する意味になっている。"},{"t":"Libraries operate local authorities that provide residents with access to reliable information.","why":"図書館が自治体を運営し、自治体が情報を提供する構造になっている。"},{"t":"Residents operating local libraries provide reliable information to the authorities in their communities.","why":"住民が図書館の運営者かつ情報の提供者となり、日本語の役割分担と異なる。"}],"answer":2,"point":"名詞の後ろの operated by は、その名詞を運営する主体を示す。","level":1,"drive":{"ja":"地方自治体が運営する図書館は、住民に信頼できる情報を提供する。","en":"Libraries operated by local authorities provide residents with access to reliable information."},"explain":"Librariesが主語、過去分詞句が運営者を示す。provide A with Bで要約の受益者を示す。別の言い方: Council-run libraries offer residents reliable information."},{"id":"p1-ja2en-220","q":"経済成長が望ましいことは認めるが、それを理由に、将来世代に長期的な環境負担を負わせる政策を正当化すべきではない。","q_ja":"経済成長が望ましいことは認めるが、それを理由に、将来世代に長期的な環境負担を負わせる政策を正当化すべきではない。","choices":[{"t":"Although economic growth is desirable, policies imposing long-term environmental burdens on future generations should not be used to justify that growth.","why":"正当化の対象が政策ではなく経済成長となり、手段と対象が逆になっている。"},{"t":"Admittedly, economic growth is desirable, but this should not be used to justify public policies that impose long-term environmental burdens on future generations.","why":"正解。成長の価値を認めつつ、それを政策正当化の根拠にすべきでないと主張している。"},{"t":"The desirability of economic growth should be acknowledged because policies imposing long-term environmental burdens on future generations cannot otherwise be justified.","why":"譲歩を因果に変え、政策を正当化するために成長を認めるという理由を加えている。"},{"t":"While policies imposing long-term environmental burdens on future generations are desirable, economic growth should not be used to justify them.","why":"望ましいと認める対象が経済成長ではなく、環境負担を課す政策になっている。"},{"t":"Admittedly, economic growth is desirable, but future generations should not justify the long-term environmental burdens that policies impose on economic growth.","why":"将来世代が正当化の主体となり、負担を課される対象も経済成長に変わっている。"},{"t":"Economic growth should not justify acknowledging desirable policies that impose long-term environmental burdens on future generations, despite the desirability of growth.","why":"正当化の対象が政策そのものではなく、政策を望ましいと認める行為に変わっている。"}],"answer":1,"point":"Admittedly で譲歩を示し、but 以下で正当化の根拠と対象の関係を明確にする。","level":3,"drive":{"ja":"経済成長が望ましいことは認めるが、それを理由に、将来世代に長期的な環境負担を負わせる政策を正当化すべきではない。","en":"Admittedly, economic growth is desirable, but this should not be used to justify public policies that impose long-term environmental burdens on future generations."},"explain":"butで譲歩から主張へ移り、that節が政策を修飾する。thisは成長の望ましさを指し、be used to justifyで論述の正当化の根拠を示す。別の言い方: Growth cannot justify such policies."},{"id":"p1-ja2en-101","q":"その政策には費用がかかることは認めるが、公共サービスの改善につながる。","q_ja":"その政策には費用がかかることは認めるが、公共サービスの改善につながる。","choices":[{"t":"Because the policy improves public services, we should accept the cost of introducing it.","why":"改善を理由に費用を受け入れるべきだという主張で、費用を認めた上で利点を述べる譲歩ではない。"},{"t":"Admittedly, the policy is costly, but it leads to an improvement in public services.","why":"正解。費用という欠点を認めた上で、公共サービスを改善するという利点を述べている。"},{"t":"Although public services are costly, improving them will lead to the introduction of the policy.","why":"費用がかかる対象が公共サービスに変わり、サービスの改善が政策の導入につながるという関係になっている。"},{"t":"The policy leads to better public services because the cost of introducing it is high.","why":"高い費用がサービス改善の原因になっており、日本語の譲歩の関係を因果関係に変えている。"},{"t":"Whereas the policy is costly, other policies lead to an improvement in public services.","why":"別の政策との対比になっており、同じ政策の欠点と利点を述べる日本語とは異なる。"},{"t":"Despite the improvement in public services, introducing the policy will lead to higher costs.","why":"認める内容がサービスの改善、主に述べる内容が費用の増加となり、譲歩の範囲が逆になっている。"}],"answer":1,"point":"Admittedly で欠点を認め、but の後で主に伝えたい利点を述べる。","level":1,"drive":{"ja":"その政策には費用がかかることは認めるが、公共サービスの改善につながる。","en":"Admittedly, the policy is costly, but it leads to an improvement in public services."},"explain":"は対象英文がないため確定できない。"},{"id":"p1-ja2en-102","q":"公共交通への投資は、人々に車の利用を減らすよう促すことで大気汚染を減らす。","q_ja":"公共交通への投資は、人々に車の利用を減らすよう促すことで大気汚染を減らす。","choices":[{"t":"A reduction in air pollution encourages people to use cars less and invest in public transport.","why":"大気汚染の減少が車の利用減少と投資を促すという、逆向きの因果関係になっている。"},{"t":"People reduce investment in public transport by using cars less to improve local air quality.","why":"減らす対象が大気汚染ではなく投資となり、車の利用減少が投資を減らす手段になっている。"},{"t":"Invest in public transport reduces air pollution by encouraging people to use cars less.","why":"主語の位置に動詞の原形 Invest を置いている。「投資」を主語にするには名詞 Investment などが必要。"},{"t":"Public transport attracts investment because people use cars less as a result of lower air pollution.","why":"大気汚染の減少が車の利用減少を生み、その結果として投資が集まるという順序に変わっている。"},{"t":"Investment in public transport reduces air pollution by encouraging people to use cars less.","why":"正解。投資を名詞の主語にし、車の利用を減らすよう促すことを汚染削減の手段としている。"},{"t":"Investment in public transport encourages people to reduce air pollution by using cars for shorter trips.","why":"by 以下が人々の汚染削減の方法を説明し、短距離の移動に車を使うという別の内容になっている。"}],"answer":4,"point":"Investment in ～ を主語にし、by doing で結果を生む手段を示す。","level":1,"drive":{"ja":"公共交通への投資は、人々に車の利用を減らすよう促すことで大気汚染を減らす。","en":"Investment in public transport reduces air pollution by encouraging people to use cars less."},"explain":"は対象英文がないため確定できない。"},{"id":"p1-ja2en-103","q":"もし今、政府の支援がもっとあれば、小規模企業はより多くの労働者を雇えるだろう。","q_ja":"もし今、政府の支援がもっとあれば、小規模企業はより多くの労働者を雇えるだろう。","choices":[{"t":"If more government support were available now, small businesses could employ more workers.","why":"正解。現在の仮定を if 節の were と主節の could で表している。"},{"t":"If more government support had been available then, small businesses could have employed more workers.","why":"過去に支援があった場合の仮定で、今の支援について述べる日本語とは時点が異なる。"},{"t":"Small businesses would receive more government support now if they employed more workers.","why":"雇用を増やすことが支援を受ける条件となり、支援と雇用の関係が逆になっている。"},{"t":"More government support is available now because small businesses have employed more workers.","why":"実際に雇用が増えたことを支援の原因として述べており、現在の仮定になっていない。"},{"t":"If more government support were available now, small businesses could have employed more workers last year.","why":"結果が昨年の雇用についての仮定となり、これから雇用を増やせるという日本語の意味からずれる。"},{"t":"Small businesses currently supported by the government would employ more workers if demand increased.","why":"政府の支援は企業を修飾する説明で、雇用を増やす条件が需要の増加に変わっている。"}],"answer":0,"point":"現在の仮定は If ～ were ..., ～ could ... で表せる。","level":1,"drive":{"ja":"もし今、政府の支援がもっとあれば、小規模企業はより多くの労働者を雇えるだろう。","en":"If more government support were available now, small businesses could employ more workers."},"explain":"は対象英文がないため確定できない。"},{"id":"p1-ja2en-104","q":"したがって、政府は道路を増やすよりも、既存の公共交通の改善を優先すべきだ。","q_ja":"したがって、政府は道路を増やすよりも、既存の公共交通の改善を優先すべきだ。","choices":[{"t":"Consequently, the government should build more roads before giving priority to improvements in existing public transport.","why":"公共交通の改善より先に道路を増やすとしており、優先順位が逆になっている。"},{"t":"Although the government should improve existing public transport, it should give priority to building more roads.","why":"交通改善を譲歩として扱い、道路を増やすことを主張しているため、結論の内容が逆になる。"},{"t":"Consequently, the government should prioritize improving existing public transport rather than building more roads.","why":"正解。Consequently で結論を導き、道路建設より既存の公共交通の改善を優先すると述べている。"},{"t":"The government should improve existing public transport because giving priority to road construction will reduce traffic.","why":"道路建設の効果を交通改善の理由にしており、二つの施策の優先順位を示していない。"},{"t":"Consequently, improving existing public transport should take priority only after the government has built more roads.","why":"道路を増やし終えてから交通改善を優先するという条件を加え、道路建設を先にしている。"},{"t":"The government should therefore prioritize building more roads that improve access to existing public transport services.","why":"公共交通に関する部分が道路を修飾し、優先する対象が交通改善ではなく道路建設になっている。"}],"answer":2,"point":"Consequently で結論を示し、prioritize A rather than B で A を優先すると述べる。","level":1,"drive":{"ja":"したがって、政府は道路を増やすよりも、既存の公共交通の改善を優先すべきだ。","en":"Consequently, the government should prioritize improving existing public transport rather than building more roads."},"explain":"は対象英文がないため確定できない。計18件（🔴7件、🟡11件）。"}],"paraphrase":[{"id":"p1-paraphrase-001","q":"When governments disclose how public funds are spent, citizens are more likely to trust public institutions.","q_ja":"政府が公的資金の使途を公開すると、市民は公的機関を信頼しやすくなる。","choices":[{"t":"The disclosure of public spending by governments increases the likelihood that citizens will trust public institutions.","why":"正解。公開を名詞化し、信頼が高まる可能性も保っている。"},{"t":"Government disclosure of public spending makes citizens less likely to trust public institutions.","why":"less likely により信頼の変化が逆になる。"},{"t":"Public trust causes governments to disclose their spending.","why":"公開が信頼を高めるという因果の向きを逆にしている。"},{"t":"The disclosure of public spending increase public trust.","why":"単数の disclosure に対応する動詞は increases。"},{"t":"When governments reveal how public funds are spent, citizens are more likely to trust public institutions.","why":"disclose を reveal に替えただけで、ほぼ丸写しになっている。"},{"t":"It is good for citizens when governments talk about public money.","why":"good では使途の公開と信頼の関係が伝わらない。"}],"answer":0,"point":"disclose を disclosure に、be more likely to を increase the likelihood that に変える。","drive":{"ja":"政府が公的資金の使途を公開すると、市民は公的機関を信頼しやすくなる。を言い換えてください","en":"The disclosure of public spending by governments increases the likelihood that citizens will trust public institutions."},"level":2,"explain":"主語は公開、動詞はincreasesで、that節が可能性の内容を示す。出来事の名詞化は要約の焦点を絞れる。別の言い方: Disclosure can build public trust."},{"id":"p1-paraphrase-002","q":"Although international trade stimulates economic growth, it can leave some domestic industries vulnerable to competition from overseas producers.","q_ja":"国際貿易は経済成長を促すものの、一部の国内産業を海外の生産者との競争に対して弱い立場に置くことがある。","choices":[{"t":"International trade always protects domestic industries from foreign competition.","why":"競争に弱くなる可能性を、必ず保護するという意味に変えている。"},{"t":"Although international trade encourages economic growth, it can leave some domestic industries vulnerable to competition from overseas producers.","why":"stimulates を encourages に替えただけで、ほぼ丸写しになっている。"},{"t":"International trade, which promote economic growth, may expose industries to foreign competition.","why":"単数扱いの international trade を受けるので promotes が必要。"},{"t":"International trade, which promotes economic growth, may nevertheless expose certain domestic industries to competition from foreign producers.","why":"正解。成長への貢献と競争に弱くなる可能性の両方を保っている。"},{"t":"International trade benefits every domestic industry.","why":"一部への不利益を、すべての国内産業の利益に変えている。"},{"t":"International trade is good for the economy but bad for some businesses.","why":"good と bad では成長と海外との競争という具体的な内容がぼやける。"}],"answer":3,"point":"譲歩を非制限用法の which と nevertheless で表す。","drive":{"ja":"国際貿易は経済成長を促すものの、一部の国内産業を海外の生産者との競争に対して弱い立場に置くことがある。を言い換えてください","en":"International trade, which promotes economic growth, may nevertheless expose certain domestic industries to competition from foreign producers."},"level":2,"explain":"主語は貿易、which節は補足。neverthelessは利点に続けて難点を論じる語。別の言い方: Trade may still expose some local industries to foreign competition."},{"id":"p1-paraphrase-003","q":"Providing affordable public transport enables residents with limited incomes to gain better access to employment opportunities across the city.","q_ja":"手頃な料金の公共交通を提供すると、所得の限られた住民が市内各地の雇用機会によりアクセスしやすくなる。","choices":[{"t":"Affordable public transport prevents residents on limited incomes from accessing employment opportunities.","why":"アクセスの改善を妨害に変えている。"},{"t":"The provision of affordable public transport improves access to employment opportunities throughout the city for residents on limited incomes.","why":"正解。提供を名詞化し、対象者と雇用機会へのアクセス改善を保っている。"},{"t":"The provision of affordable public transport improve access to employment.","why":"単数の provision に対応する動詞は improves。"},{"t":"Providing affordable public transportation enables residents with limited incomes to gain better access to employment opportunities across the city.","why":"transport を transportation に替えただけで、原文をほぼ写している。"},{"t":"Affordable public transport is good for people with little money.","why":"雇用機会へのアクセス改善という具体的な効果が抜けている。"},{"t":"Better access to employment makes public transport affordable for residents on limited incomes.","why":"低料金の交通がアクセスを改善するという因果を逆にしている。"}],"answer":1,"point":"Providing を the provision of に、enable を improve access to に言い換える。","drive":{"ja":"手頃な料金の公共交通を提供すると、所得の限られた住民が市内各地の雇用機会によりアクセスしやすくなる。を言い換えてください","en":"The provision of affordable public transport improves access to employment opportunities throughout the city for residents on limited incomes."},"level":2,"explain":"主語は提供、動詞はimproves。access toで利用しやすさを表し、政策の効果を具体化する。別の言い方: It improves citywide job access for low-income residents."},{"id":"p1-paraphrase-004","q":"If companies were required to explain their automated decisions, individuals would find it easier to challenge unfair treatment.","q_ja":"企業が自動化された意思決定の説明を義務づけられれば、個人は不公平な扱いに異議を申し立てやすくなるだろう。","choices":[{"t":"Requiring companies to explain automated decisions would make challenges to unfair treatment harder.","why":"容易になるという結果を難しくなるに変えている。"},{"t":"Individuals should explain automated decisions to companies before challenging unfair treatment.","why":"説明する主体を企業から個人に変えている。"},{"t":"A requirement for companies to explain automated decisions would facilitates challenges to unfair treatment.","why":"would の後には原形 facilitate が必要。"},{"t":"If companies were required to explain their automated decisions, people would find it easier to challenge unfair treatment.","why":"individuals を people に替えただけで、ほぼ丸写しになっている。"},{"t":"It would be good if companies explained their computer systems.","why":"説明義務と不公平な扱いへの異議申し立ての関係が抜けている。"},{"t":"A requirement for companies to explain automated decisions would facilitate individuals’ challenges to unfair treatment.","why":"正解。仮定の義務化を名詞化し、異議申し立てが容易になるという結果を保っている。"}],"answer":5,"point":"仮定の条件を a requirement で表し、would facilitate で結果を示す。","drive":{"ja":"企業が自動化された意思決定の説明を義務づけられれば、個人は不公平な扱いに異議を申し立てやすくなるだろう。を言い換えてください","en":"A requirement for companies to explain automated decisions would facilitate individuals’ challenges to unfair treatment."},"level":2,"explain":"主語は義務、to節はその内容。wouldは未実施の政策の効果を論じる際に使える。別の言い方: Such a rule would help individuals contest unfair treatment."},{"id":"p1-paraphrase-005","q":"Because natural resources are limited, governments need to encourage industries to use materials more efficiently and reduce unnecessary waste.","q_ja":"天然資源は限られているため、政府は産業界に資材の利用効率を高め、不要な廃棄物を減らすよう促す必要がある。","choices":[{"t":"Natural resources are unlimited, so governments need not encourage efficient material use.","why":"資源の制約と政府の働きかけの必要性を否定している。"},{"t":"Given limited natural resources, governments must encouraging industries to reduce waste.","why":"must の後には原形 encourage が必要。"},{"t":"Given the limited availability of natural resources, governments must promote more efficient material use and reductions in unnecessary waste among industries.","why":"正解。資源の制約を理由として示し、産業界に促す二つの行動を保っている。"},{"t":"Because natural resources are limited, governments need to encourage industries to use materials more efficiently and decrease unnecessary waste.","why":"reduce を decrease に替えただけで、ほぼ丸写しになっている。"},{"t":"Using materials well is good, and throwing things away is bad.","why":"資源の制約と政府による産業界への働きかけが失われている。"},{"t":"Natural resources become limited because governments encourage efficient material use and waste reduction.","why":"資源の制約を政策の理由ではなく結果にしている。"}],"answer":2,"point":"理由節を Given と名詞句に変え、行為を material use や reductions で名詞化する。","drive":{"ja":"天然資源は限られているため、政府は産業界に資材の利用効率を高め、不要な廃棄物を減らすよう促す必要がある。を言い換えてください","en":"Given the limited availability of natural resources, governments must promote more efficient material use and reductions in unnecessary waste among industries."},"level":2,"explain":"Given句は天然資源の制約を前提として示し、主節のmust promoteは政府が促進すべきことを述べる。目的語には資材利用の効率化と不要な廃棄物の削減が並び、効率化は必ずしも使用量自体の削減を意味しない。別の言い方: Because natural resources are limited, governments must encourage industries to use materials more efficiently and reduce unnecessary waste."},{"id":"p1-paraphrase-006","q":"By supporting independent journalism, public institutions can help citizens distinguish reliable information from misleading claims during national elections.","q_ja":"独立した報道を支援することで、公的機関は国政選挙の期間中、市民が信頼できる情報と誤解を招く主張を区別するのを助けられる。","choices":[{"t":"Public support for independent journalism guarantees that citizens reject every misleading claim during national elections.","why":"支援できるという可能性を、すべて退ける保証に強めている。"},{"t":"Independent journalists help public institutions distinguish reliable information from misleading claims during national elections.","why":"支援する主体と情報を区別する主体を変えている。"},{"t":"Public institutions can assist citizens in distinguish reliable information from misleading claims.","why":"前置詞 in の後は動名詞 distinguishing が必要。"},{"t":"By supporting independent journalism, public institutions can help citizens separate reliable information from misleading claims during national elections.","why":"distinguish を separate に替えただけで、ほぼ丸写しになっている。"},{"t":"Support for independent journalism by public institutions can assist citizens in distinguishing reliable information from misleading claims during national elections.","why":"正解。支援を名詞化し、主体、情報の区別、選挙という場面を保っている。"},{"t":"Independent journalism is good for people when they vote.","why":"支援する主体と情報判断への効果が具体的に示されていない。"}],"answer":4,"point":"help someone distinguish を assist someone in distinguishing に変えられる。","drive":{"ja":"独立した報道を支援することで、公的機関は国政選挙の期間中、市民が信頼できる情報と誤解を招く主張を区別するのを助けられる。を言い換えてください","en":"Support for independent journalism by public institutions can assist citizens in distinguishing reliable information from misleading claims during national elections."},"level":2,"explain":"主語はSupport for independent journalismで、by public institutionsは支援する主体を示す。can assist citizens in doingは、国政選挙の期間中に市民が信頼できる情報と誤解を招く主張を区別するのを助けられるという意味である。別の言い方: By supporting independent journalism, public institutions can help citizens distinguish reliable information from misleading claims during national elections."},{"id":"p1-paraphrase-007","q":"Unless governments invest in preventive healthcare, the financial burden of treating avoidable diseases is likely to increase over time.","q_ja":"政府が予防医療に投資しなければ、予防可能な病気を治療する経済的負担は時間とともに増す可能性が高い。","choices":[{"t":"Government investment in preventive healthcare will probably increase the financial burden of treating preventable diseases.","why":"投資がない場合の負担増を、投資による負担増に変えている。"},{"t":"Without government investment in preventive healthcare, treating preventable diseases will probably impose an increasing financial burden over time.","why":"正解。投資がない条件と治療による負担増の見込みを保っている。"},{"t":"Without government investment in preventive healthcare, the financial burden of treating diseases are likely to increase.","why":"主語の中心は単数の burden なので is が必要。"},{"t":"Unless governments invest in preventive healthcare, the financial burden of treating avoidable illnesses is likely to increase over time.","why":"diseases を illnesses に替えただけで、ほぼ丸写しになっている。"},{"t":"Preventive healthcare is good because getting sick is bad.","why":"政府の投資不足と将来の経済的負担の関係が抜けている。"},{"t":"Without government investment in preventive healthcare, treatment costs will certainly disappear over time.","why":"負担が増す見込みを確実に消滅するという逆の結果にしている。"}],"answer":1,"point":"Unless の条件節を without と名詞句に変え、負担を impose a burden で表す。","drive":{"ja":"政府が予防医療に投資しなければ、予防可能な病気を治療する経済的負担は時間とともに増す可能性が高い。を言い換えてください","en":"Without government investment in preventive healthcare, treating preventable diseases will probably impose an increasing financial burden over time."},"level":2,"explain":"Without句は条件、主語は治療。probablyは断定を避ける語。別の言い方: Without such investment, preventable diseases will likely cost more to treat."},{"id":"p1-paraphrase-008","q":"Although digital services improve convenience, requiring everyone to use them may exclude citizens who lack adequate internet access.","q_ja":"デジタルサービスは利便性を高めるものの、全員に利用を義務づけると、十分なインターネット接続環境がない市民を排除するおそれがある。","choices":[{"t":"Although digital services enhance convenience, making their use compulsory may exclude citizens whose internet access is inadequate.","why":"正解。although を残して対比を保ちつつ、requiring everyone to use them を making their use compulsory、who lack adequate internet access を whose internet access is inadequate と構文ごと言い換えている。"},{"t":"Compulsory use of digital services always includes citizens whose internet access is inadequate.","why":"排除のおそれを必ず包摂するという意味に変えている。"},{"t":"Although digital services increase convenience, requiring everyone to use them may exclude citizens who lack adequate internet access.","why":"improve を increase に替えただけで、ほぼ丸写しになっている。"},{"t":"Despite enhance convenience, compulsory use of digital services may exclude some citizens.","why":"despite の後には動名詞 enhancing が必要。"},{"t":"Digital services are good, but they are bad for some people.","why":"義務化と接続環境の不足という条件が抜けている。"},{"t":"Citizens without adequate internet access require everyone to use digital services.","why":"排除されるおそれのある市民を、利用を義務づける主体に変えている。"}],"answer":0,"point":"譲歩は despite と動名詞で、所有の関係は whose で表せる。","drive":{"ja":"デジタルサービスは利便性を高めるものの、全員に利用を義務づけると、十分なインターネット接続環境がない市民を排除するおそれがある。を言い換えてください","en":"Although digital services enhance convenience, making their use compulsory may exclude citizens whose internet access is inadequate."},"level":2,"explain":"Although節は譲歩、主語は利用の義務化。whose節で対象者を特定し、政策の難点を論じる。別の言い方: Mandatory use may exclude people with poor internet access."},{"id":"p1-paraphrase-009","q":"Reducing dependence on imported energy would make the national economy less vulnerable to sudden changes in international fuel prices.","q_ja":"輸入エネルギーへの依存を減らせば、国の経済は国際的な燃料価格の急変の影響を受けにくくなるだろう。","choices":[{"t":"Reduced reliance on energy imports would increase the national economy’s vulnerability to international fuel price changes.","why":"影響を受けにくくなるという結果を逆にしている。"},{"t":"Reducing dependence on imported energy would make the national economy less vulnerable to sudden shifts in international fuel prices.","why":"changes を shifts に替えただけで、ほぼ丸写しになっている。"},{"t":"Reduced reliance on energy imports would decreases vulnerability to international fuel price changes.","why":"would の後には原形 decrease が必要。"},{"t":"Importing less energy would be good for the country.","why":"価格変動への弱さが軽減するという具体的な効果が抜けている。"},{"t":"A reduction in reliance on energy imports would decrease the national economy’s vulnerability to abrupt fluctuations in international fuel prices.","why":"正解。依存の低下と価格変動への弱さの軽減を名詞化して保持している。"},{"t":"Reduced vulnerability to international fuel price changes would cause less dependence on imported energy.","why":"依存低下が弱さを軽減するという因果を逆にしている。"}],"answer":4,"point":"less vulnerable を decrease vulnerability、dependence を reliance で言い換える。","drive":{"ja":"輸入エネルギーへの依存を減らせば、国の経済は国際的な燃料価格の急変の影響を受けにくくなるだろう。を言い換えてください","en":"A reduction in reliance on energy imports would decrease the national economy’s vulnerability to abrupt fluctuations in international fuel prices."},"level":3,"explain":"主語は依存の低下。would decreaseで提案の効果を仮定する。別の言い方: Lower reliance on energy imports would soften the impact of fuel price swings."},{"id":"p1-paraphrase-010","q":"Public funding for scientific research should not depend solely on whether a project is likely to generate immediate commercial profits.","q_ja":"科学研究への公的資金の提供は、その事業がすぐに商業的利益を生む見込みだけで決めるべきではない。","choices":[{"t":"Public funding for scientific research should depend entirely on immediate commercial profits.","why":"利益だけで決めるべきではないという主張を逆にしている。"},{"t":"The allocation of public research funds should not be determine exclusively by immediate commercial prospects.","why":"受動態の be の後には過去分詞 determined が必要。"},{"t":"Public funding for scientific research should not depend only on whether a project is likely to generate immediate commercial profits.","why":"solely を only に替えただけで、ほぼ丸写しになっている。"},{"t":"The allocation of public funds to scientific research should not be determined exclusively by a project’s prospects for immediate commercial profit.","why":"正解。資金配分を名詞化し、短期の利益だけで判断しないという限定を保っている。"},{"t":"Giving money to science is good even when business is bad.","why":"資金配分の基準と短期の利益の見込みという論点が失われている。"},{"t":"Scientific research should never receive public funding if it might produce commercial profits.","why":"利益だけで判断しないという限定を、利益の可能性があれば支援しないという禁止に変えている。"}],"answer":3,"point":"not solely を not exclusively、利益を生む見込みを prospects for profit で表す。","drive":{"ja":"科学研究への公的資金の提供は、その事業がすぐに商業的利益を生む見込みだけで決めるべきではない。を言い換えてください","en":"The allocation of public funds to scientific research should not be determined exclusively by a project’s prospects for immediate commercial profit."},"level":3,"explain":"主語は資金配分、述語は受動態。not exclusivelyで単一基準を退け、他の価値も論じる。別の言い方: Public research funding should consider more than quick profits."},{"id":"p1-paraphrase-201","q":"Public investment in libraries enables residents to access reliable information without paying membership fees.","q_ja":"図書館への公的投資により、住民は会費を払わずに信頼できる情報を利用できる。","choices":[{"t":"Residents must pay membership fees before using reliable information services supported by public library investment.","why":"会費を払わずに利用できるという内容を、支払いが必要という内容に変えている。"},{"t":"By funding libraries, public authorities give residents free access to reliable information without membership charges.","why":"正解。公的投資を当局による資金提供と言い換え、住民の無料の情報利用という意味を保っている。"},{"t":"Public investment in libraries enables residents to access dependable information without paying membership fees.","why":"意味は同じだが、reliableをdependableに替えただけで、構文を言い換えていない。"},{"t":"Public funding for libraries allow residents to obtain reliable information without paying any membership fees.","why":"主語の中心は不可算名詞fundingなので、動詞はallowではなくallowsにする。"},{"t":"Residents provide public libraries with reliable information in exchange for exemption from annual membership fees.","why":"情報を利用する住民を、図書館に情報を提供する側に変えている。"},{"t":"Free access to reliable library information removes the need for public investment in local libraries.","why":"公的投資が無料利用を可能にするという関係を、無料利用が投資を不要にするという関係に変えている。"}],"answer":1,"point":"enable A to doは、手段を示すByとgive A access toを使って構文ごと言い換えられる。","level":1,"drive":{"ja":"図書館への公的投資により、住民は会費を払わずに信頼できる情報を利用できる。同じ意味を別の構文で述べてください。","en":"By funding libraries, public authorities give residents free access to reliable information without membership charges."},"explain":"By句が手段、当局が主語、giveが動詞。give＋人＋物で恩恵を論じる。別の言い方: Public funding gives residents free access to reliable library information."},{"id":"p1-paraphrase-202","q":"Although subsidies reduce the initial cost of renewable energy systems, they do not necessarily make such systems affordable for every household.","q_ja":"補助金は再生可能エネルギー設備の初期費用を下げるが、必ずしもすべての世帯が購入できるようになるわけではない。","choices":[{"t":"Since subsidies lower the initial cost of renewable energy systems, every household is consequently able to afford the installation of these systems.","why":"すべての世帯が購入できるとは限らないという留保を、全世帯が購入できるという断定に変えている。"},{"t":"Despite subsidies reduce initial costs, renewable energy systems may still be beyond the financial reach of some households seeking to install them.","why":"Despiteの直後に主語と動詞のある節は置けないので、Althoughを使うか名詞句にする。"},{"t":"Although subsidies lower the initial cost of renewable energy systems, they do not necessarily make such systems affordable for every household.","why":"reduceをlowerに替えただけで、元の構文をそのまま使っている。"},{"t":"Households unable to afford renewable energy systems cause subsidies to reduce the initial installation costs associated with these systems for other households.","why":"購入できない世帯の存在が補助金の効果を生むという、原文にない因果関係を加えている。"},{"t":"Despite the reduction in upfront costs provided by subsidies, renewable energy systems may remain beyond the financial reach of some households.","why":"正解。Although節をDespiteと名詞句に変え、初期費用が下がっても一部の世帯には高額という意味を保っている。"},{"t":"Subsidies for renewable energy systems lower ongoing maintenance expenses, although the initial installation costs may remain unaffordable for some households considering adoption.","why":"補助金が下げる対象を、初期費用から継続的な維持費へ変えている。"}],"answer":4,"point":"not necessarily everyは全体への断定を避ける表現で、may remain beyond the reach of someと対応する。","level":2,"drive":{"ja":"補助金は再生可能エネルギー設備の初期費用を下げるが、すべての世帯が購入できるとは限らない。同じ意味を別の構文で述べてください。","en":"Despite the reduction in upfront costs provided by subsidies, renewable energy systems may remain beyond the financial reach of some households."},"explain":"Despite句が譲歩、設備が主語、may remainが述語。mayで断定を避け、政策の限界を論じる。別の言い方: Subsidized systems may still be too costly for some families."},{"id":"p1-paraphrase-203","q":"Had the government consulted local communities before allocating disaster relief funds, the assistance would have reflected regional needs more accurately than it did.","q_ja":"政府が災害救援資金を配分する前に地域社会の意見を聞いていたなら、援助は実際よりも正確に地域のニーズを反映していただろう。","choices":[{"t":"The assistance would have matched regional needs more closely if local communities had been consulted by the government before disaster relief funds were allocated.","why":"正解。倒置された仮定法過去完了をif節と受動態に変え、過去の実現しなかった条件と結果を保っている。"},{"t":"If the government consults local communities before allocating disaster relief funds, the assistance will reflect regional needs more accurately than it did last time.","why":"過去に実現しなかった条件を、今後実現する可能性がある条件に変えている。"},{"t":"Had the government consulted local communities before allocating disaster relief funds, the assistance would have reflected regional needs more precisely than it did.","why":"accuratelyをpreciselyに替えただけで、構文を変えていない。"},{"t":"Regional needs would have been reflected more accurately in the assistance if the government had consulted local communities after allocating the disaster relief funds.","why":"意見を聞く時点を、資金配分の前から後へ変えている。"},{"t":"If local communities had been consulted before disaster relief funds were allocated, the assistance would have reflect regional needs more accurately than it did.","why":"would haveの後には過去分詞が必要なので、reflectではなくreflectedにする。"},{"t":"The government consulted local communities before allocating disaster relief funds, thereby ensuring that the assistance reflected regional needs more accurately than otherwise possible.","why":"実際には行われなかった事前の意見聴取を、行われた事実として述べている。"}],"answer":0,"point":"Had＋主語＋過去分詞はIf＋主語＋had＋過去分詞と同じ過去の反実仮想を表す。","level":3,"drive":{"ja":"政府が資金配分の前に地域社会の意見を聞いていたなら、災害援助は実際より地域のニーズに合っていただろう。同じ意味を別の構文で述べてください。","en":"The assistance would have matched regional needs more closely if local communities had been consulted by the government before disaster relief funds were allocated."},"explain":"援助が主語、if節が過去の反実仮想。受動態で地域に焦点を当て、政策を検証する。別の言い方: Prior consultation would have made aid better suited to local needs."},{"id":"p1-paraphrase-204","q":"Expanding public transport reduces urban residents' dependence on private cars for their daily journeys.","q_ja":"公共交通の拡充は、都市住民が日々の移動で自家用車に頼る度合いを下げる。","choices":[{"t":"Urban residents rely more heavily on private cars as public transport services expand across cities.","why":"公共交通の拡充によって車への依存が下がるという内容を、依存が増すという内容に変えている。"},{"t":"The expansion of public transport services reduce urban residents' reliance on private cars for everyday travel.","why":"主語の中心は単数のexpansionなので、reduceではなくreducesにする。"},{"t":"Expanding public transport decreases urban residents' dependence on private cars for their daily journeys.","why":"reducesをdecreasesに替えただけで、構文を言い換えていない。"},{"t":"With expanded public transport, people living in cities become less reliant on cars for everyday travel.","why":"正解。動名詞の主語をWithの句に変え、都市住民の車への依存が下がるという結果を保っている。"},{"t":"Urban residents' declining dependence on private cars leads to the expansion of public transport services.","why":"公共交通の拡充が車への依存を下げるという因果の向きを逆にしている。"},{"t":"Expanding public transport eliminates urban residents' dependence on private cars for all their daily journeys.","why":"依存を下げるという程度を、すべての移動で依存をなくすという程度に強めている。"}],"answer":3,"point":"reduce dependence onはbecome less reliant onと対応し、原因をWithの句で示せる。","level":1,"drive":{"ja":"公共交通の拡充は、都市住民が日々の移動で自家用車に頼る度合いを下げる。同じ意味を別の構文で述べてください。","en":"With expanded public transport, people living in cities become less reliant on cars for everyday travel."},"explain":"With句が背景、人々が主語、becomeが動詞。less＋形容詞で依存低下を述べ、効果を論じる。別の言い方: Better public transit makes city residents less reliant on cars."},{"id":"p1-paraphrase-205","q":"Without stricter limits on industrial emissions, the city is unlikely to achieve its air quality targets within the next decade.","q_ja":"産業排出物への規制を強めなければ、その都市が今後10年以内に大気の質の目標を達成する見込みは低い。","choices":[{"t":"The city is likely to meet its air quality targets within ten years even if restrictions on industrial emissions remain unchanged.","why":"規制を強めなければ達成の見込みが低いという内容を、現状の規制でも達成の見込みが高いという内容に変えている。"},{"t":"Unless tighter restrictions on industrial emissions are introduced, the city is unlikely achieving its air quality goals within the coming decade.","why":"unlikelyの後はto不定詞なので、achievingではなくto achieveにする。"},{"t":"Without tighter limits on industrial emissions, the city is unlikely to achieve its air quality targets within the next decade.","why":"stricterをtighterに替えただけで、構文を言い換えていない。"},{"t":"If tighter limits on industrial emissions are introduced, the city is certain to attain its air quality targets within ten years.","why":"規制強化がない場合の低い見込みから、規制強化があれば必ず達成できるとは言えない。"},{"t":"The city's failure to meet its air quality targets during the coming decade will prevent stricter controls on industrial emissions.","why":"規制強化がないことを原因とする予測を、目標未達が規制強化を妨げるという別の因果関係に変えている。"},{"t":"The city has little prospect of meeting its air quality goals within ten years unless tighter controls on industrial emissions are imposed.","why":"正解。Withoutをunless節に、is unlikely toをhas little prospect ofに変え、条件と達成の見込みを保っている。"}],"answer":5,"point":"Without Aをunless節に変えるとき、条件がない場合の見込みと、条件がある場合の保証を区別する。","level":2,"drive":{"ja":"産業排出物への規制を強めなければ、その都市が10年以内に大気の質の目標を達成する見込みは低い。同じ意味を別の構文で述べてください。","en":"The city has little prospect of meeting its air quality goals within ten years unless tighter controls on industrial emissions are imposed."},"explain":"都市が主語、hasが動詞、unless節が条件。little prospect ofで低い見込みを示し政策を評価。別の言い方: Without tight controls, the city is unlikely to succeed."},{"id":"p1-paraphrase-206","q":"Only when independent researchers are granted access to the underlying data can the reliability of an automated decision system be assessed adequately.","q_ja":"独立した研究者が基礎データにアクセスできるようになって初めて、自動意思決定システムの信頼性を十分に評価できる。","choices":[{"t":"Granting independent researchers access to the underlying data is sufficient to ensure an adequate assessment of the reliability of an automated decision system.","why":"データへのアクセスという必要条件を、それだけで十分な評価が確実に行われるという十分条件に変えている。"},{"t":"Only when independent researchers are granted access to the underlying data can the reliability of an automated decision system be evaluated adequately.","why":"assessedをevaluatedに替えただけで、構文を変えていない。"},{"t":"An adequate assessment of an automated decision system's reliability is possible only if independent researchers are allowed to examine the data on which it relies.","why":"正解。Only whenによる倒置をonly ifの条件節に変え、独立した研究者のデータへのアクセスという必要条件を保っている。"},{"t":"An adequate assessment of an automated decision system's reliability is possible only if independent researchers are allowed examining the underlying data on which it relies.","why":"受動態のare allowedの後はto不定詞なので、examiningではなくto examineにする。"},{"t":"Independent researchers may obtain access to the underlying data only after the reliability of an automated decision system has already been assessed adequately by others.","why":"データへのアクセスが評価に先立つという関係を、評価が済んだ後でしかアクセスできないという関係に変えている。"},{"t":"An adequate assessment of an automated decision system's reliability requires its developers to examine the underlying data, regardless of whether independent researchers receive access to it.","why":"必要なアクセスの主体を独立した研究者から開発者に変え、研究者のアクセスは不要としている。"}],"answer":2,"point":"Only when A can BはAがBの必要条件であることを示し、AだけでBが保証されるとは限らない。","level":3,"drive":{"ja":"独立した研究者が基礎データにアクセスできるようになって初めて、自動意思決定システムの信頼性を十分に評価できる。同じ意味を別の構文で述べてください。","en":"An adequate assessment of an automated decision system's reliability is possible only if independent researchers are allowed to examine the data on which it relies."},"explain":"評価が主語、isが動詞、only if節が必要条件。on whichでデータを特定し、要約を明確にする。別の言い方: Proper evaluation requires independent access to the data."},{"id":"p1-paraphrase-207","q":"Rising tuition fees discourage some students from pursuing higher education despite their academic ability.","q_ja":"授業料の上昇により、学力があっても高等教育への進学をためらう学生がいる。","choices":[{"t":"Students with academic ability are more willing to pursue higher education because tuition fees are rising.","why":"授業料の上昇が進学意欲を弱めるという内容を、進学意欲を高めるという内容に変えている。"},{"t":"Rising tuition fees deter some students from pursuing higher education despite their academic ability.","why":"discourageをdeterに替えただけで、構文を言い換えていない。"},{"t":"Despite their academic ability, some students are discouraged from pursue higher education by rising tuition fees.","why":"前置詞fromの後は動名詞なので、pursueではなくpursuingにする。"},{"t":"Some students' limited academic ability discourages universities from raising tuition fees for their higher education programs.","why":"進学をためらう学生の話を、授業料の引き上げをためらう大学の話に変えている。"},{"t":"Although academically capable, some students become reluctant to enter higher education because tuition fees are increasing.","why":"正解。despiteの句をAlthoughの省略節に変え、授業料の上昇が進学をためらわせるという意味を保っている。"},{"t":"Increasing tuition fees prevent every academically capable student from enrolling in any form of higher education.","why":"一部の学生がためらうという内容を、学力のある全学生が一切進学できないという内容に強めている。"}],"answer":4,"point":"discourage A from doingをA become reluctant to doに変えると、行動をためらう意味を保てる。","level":1,"drive":{"ja":"授業料の上昇により、学力があっても高等教育への進学をためらう学生がいる。同じ意味を別の構文で述べてください。","en":"Although academically capable, some students become reluctant to enter higher education because tuition fees are increasing."},"explain":"学生が主語、Although節が譲歩、because節が理由。reluctant toで躊躇を示し、障壁を論じる。別の言い方: Higher fees deter some able students from further study."},{"id":"p1-paraphrase-208","q":"The expansion of remote medical consultations has not only improved access to specialists but also reduced the burden on rural hospitals.","q_ja":"遠隔診療の拡大は、専門医へのアクセスを改善しただけでなく、地方の病院の負担も軽減した。","choices":[{"t":"Although remote medical consultations have expanded, access to specialists has improved at the cost of an increased burden on hospitals in rural areas.","why":"地方の病院の負担が減ったという内容を、負担が増えたという内容に変えている。"},{"t":"The expansion of remote medical consultations has made specialist care more accessible while easing the pressure on hospitals serving rural communities.","why":"正解。not only A but also Bの二つの効果を主節とwhileの句に分け、遠隔診療の拡大による改善と負担軽減を保っている。"},{"t":"The expansion of remote medical consultations has not only improved access to specialists but also decreased the burden on rural hospitals.","why":"reducedをdecreasedに替えただけで、構文を言い換えていない。"},{"t":"The wider availability of remote medical consultations has improved access to specialists while the pressure on rural hospitals have also been reduced.","why":"後半の主語の中心は単数のpressureなので、haveではなくhasにする。"},{"t":"Improved access to specialists and a reduction in the burden on rural hospitals have together brought about the expansion of remote medical consultations.","why":"遠隔診療の拡大による二つの結果を、遠隔診療の拡大を生んだ原因としている。"},{"t":"The growth of remote medical consultations has reduced the burden on rural hospitals without bringing any improvement in patients' access to specialist care.","why":"二つの効果のうち、専門医へのアクセスの改善を否定している。"}],"answer":1,"point":"not only A but also Bを言い換えるときは、AとBの両方と共通の原因を保つ。","level":2,"drive":{"ja":"遠隔診療の拡大は、専門医へのアクセスを改善しただけでなく、地方の病院の負担も軽減した。同じ意味を別の構文で述べてください。","en":"The expansion of remote medical consultations has made specialist care more accessible while easing the pressure on hospitals serving rural communities."},"explain":"拡大が主語、has madeが述語、while句が並行する効果。make＋目的語＋形容詞で成果を要約する。別の言い方: Remote care has improved access and eased rural workloads."},{"id":"p1-paraphrase-209","q":"The extent to which international aid alleviates poverty depends less on the amount provided than on whether recipient institutions distribute resources transparently.","q_ja":"国際援助が貧困をどの程度軽減するかは、提供額よりも、受け入れ側の機関が資源を透明な形で分配するかどうかに左右される。","choices":[{"t":"The amount of international aid provided matters more for poverty reduction than whether resources are allocated transparently by institutions in the countries receiving assistance.","why":"援助額より分配の透明性が重要という比較の優先順位を逆にしている。"},{"t":"The extent to which international aid alleviates poverty depends less on the amount supplied than on whether recipient institutions distribute resources transparently.","why":"providedをsuppliedに替えただけで、構文を変えていない。"},{"t":"How effectively international aid reduces poverty depend more on transparent resource allocation by recipient institutions than on the total amount of assistance provided.","why":"Howで始まる節全体が主語なので、dependではなくdependsにする。"},{"t":"Transparent resource allocation by recipient institutions matters more for the effectiveness of international aid in reducing poverty than does the amount of assistance supplied.","why":"正解。depends less on A than on BをB matters more than Aに変え、貧困軽減効果を左右する要因の比較を保っている。"},{"t":"The effectiveness of international aid in reducing poverty depends on transparent resource allocation by recipient institutions, whereas the amount supplied has no influence at all.","why":"援助額の影響が相対的に小さいという内容を、影響がまったくないという内容に強めている。"},{"t":"International aid reduces poverty more effectively when donor institutions distribute resources transparently than when recipient institutions disclose how much financial assistance they have received.","why":"受け入れ側による資源分配の透明性を、援助する側の分配の透明性と受領額の公開の比較に変えている。"}],"answer":3,"point":"less on A than on BはBの影響がより大きいという比較であり、Aの影響がないとは言っていない。","level":3,"drive":{"ja":"国際援助による貧困軽減の程度は
