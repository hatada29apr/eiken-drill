: Agree","q_ja":"会社は勤務中に短い運動休憩を取るよう従業員に勧めるべきか。立場：賛成。","choices":[{"t":"Short exercise breaks help employees reduce stress and return to work feeling refreshed.","why":"正解。ストレスが減り、気分を切り替えて仕事に戻れるという利点が賛成を支える。"},{"t":"Taking exercise breaks may interrupt important tasks and make it harder to finish work.","why":"仕事が中断するという欠点で、運動休憩に反対する理由になる。"},{"t":"Some employees take short exercise breaks near their desks during the working day.","why":"休憩の様子を述べるだけで、運動休憩を勧める理由にはなっていない。"},{"t":"Companies should encourage exercise breaks because taking these breaks is a good practice.","why":"よい習慣だと評価して主張を繰り返すだけで、効果を説明していない。"},{"t":"Yesterday, I stretched beside my desk for five minutes before the afternoon meeting.","why":"昨日の個人的な行動だけで、従業員全体への利点を説明していない。"},{"t":"Companies should choose brighter colors when they order new signs for their buildings.","why":"建物の看板の色についての提案で、運動休憩の理由から外れている。"}],"answer":0,"point":"行動の説明だけでなく、その行動がもたらす効果を理由として述べる。","drive":{"ja":"勤務中の短い運動休憩に賛成です。心身への効果を理由に、英語で一文述べてください。","en":"Short exercise breaks help employees reduce stress and return to work feeling refreshed."},"level":2},{"id":"g2-reason-004","q":"TOPIC: Should supermarkets stop selling vegetables that have unusual shapes?\nPosition: Disagree","q_ja":"スーパーは形が不ぞろいな野菜の販売をやめるべきか。立場：反対。","choices":[{"t":"Supermarkets should stay open later so that customers can shop after finishing work.","why":"営業時間についての提案で、野菜の形による販売の判断とは関係がない。"},{"t":"Vegetables with unusual shapes are sometimes placed in separate boxes near store entrances.","why":"売り場の配置という事実だけで、販売を続ける理由を述べていない。"},{"t":"Selling only vegetables with regular shapes makes it easier to arrange attractive displays.","why":"形のそろった野菜だけを売る利点で、販売中止に賛成する理由になる。"},{"t":"Rejecting vegetables only because of their shape increases the amount of food wasted.","why":"正解。形だけで売らないと食品廃棄が増えるため、販売中止に反対する理由になる。"},{"t":"I bought two unusually shaped carrots at the supermarket near my house yesterday.","why":"個人の買い物の体験だけで、販売を続ける一般的な理由がない。"},{"t":"Supermarkets should continue selling these vegetables because stopping their sale is a bad idea.","why":"販売中止に反対する主張を繰り返しており、なぜ悪いのかを説明していない。"}],"answer":3,"point":"反対の理由には、提案を実行した場合に増える問題を使える。","drive":{"ja":"形が不ぞろいな野菜の販売中止に反対です。食品廃棄への影響を英語で一文述べてください。","en":"Rejecting vegetables only because of their shape increases the amount of food wasted."},"level":2},{"id":"g2-reason-005","q":"TOPIC: Should schools offer students basic cooking lessons?\nPosition: Agree","q_ja":"学校は生徒に基本的な料理の授業を行うべきか。立場：賛成。","choices":[{"t":"Cooking lessons require equipment that some schools may find too expensive to buy.","why":"道具を買う費用という負担で、料理の授業に反対する理由になる。"},{"t":"My classmates and I cooked vegetable soup in our school kitchen last Thursday.","why":"一度の授業の体験だけで、料理を学ぶ一般的な利点を示していない。"},{"t":"Schools should offer cooking lessons because learning to cook at school is worthwhile.","why":"料理を学ぶ価値があるという主張の繰り返しで、具体的な理由がない。"},{"t":"Some schools have special rooms where students cook meals during their afternoon lessons.","why":"授業の場所や時間という事実だけで、授業を行う理由を述べていない。"},{"t":"Schools should invite local musicians to perform at more events during the year.","why":"音楽家を学校行事に招く提案で、料理の授業の理由から外れている。"},{"t":"Basic cooking skills help students prepare healthy meals when they start living alone.","why":"正解。将来一人暮らしで健康的な食事を作れるという利点が、賛成の理由になる。"}],"answer":5,"point":"学校で学ぶ内容は、将来の生活にどう役立つかを示すと理由になる。","drive":{"ja":"学校での基本的な料理の授業に賛成です。将来の生活への利点を英語で一文述べてください。","en":"Basic cooking skills help students prepare healthy meals when they start living alone."},"level":1},{"id":"g2-reason-006","q":"TOPIC: Should apartment buildings ban residents from keeping any pets?\nPosition: Disagree","q_ja":"集合住宅は住民があらゆるペットを飼うことを禁止すべきか。立場：反対。","choices":[{"t":"A complete ban prevents noise from animals from disturbing other people in the building.","why":"動物の騒音を防ぐという禁止の利点で、賛成の立場を支える。"},{"t":"Apartment buildings should put larger signs beside the doors of their meeting rooms.","why":"集会室の案内表示についての提案で、ペットの禁止とは関係がない。"},{"t":"Keeping pets gives residents a chance to enjoy company and feel less lonely.","why":"正解。ペットと過ごすことで孤独感が和らぐという利点が、全面禁止への反対を支える。"},{"t":"Last night, I played with my small cat in my apartment after dinner.","why":"昨夜の個人的な体験だけで、住民に共通する利点を説明していない。"},{"t":"Residents should be allowed to keep pets because a complete ban is wrong.","why":"禁止はよくないという主張だけで、その判断を支える理由がない。"},{"t":"Some apartment buildings have rules about the kinds of pets residents may keep.","why":"飼育規則があるという事実だけで、全面禁止に反対する理由を示していない。"}],"answer":2,"point":"全面禁止への反対では、禁止によって失われる利点を理由として示せる。","drive":{"ja":"集合住宅でのペットの全面禁止に反対です。孤独感への効果を理由に、英語で一文述べてください。","en":"Keeping pets gives residents a chance to enjoy company and feel less lonely."},"level":1},{"id":"g2-reason-007","q":"TOPIC: Should towns provide places where people can refill their water bottles?\nPosition: Agree","q_ja":"町は水筒に水を補給できる場所を設けるべきか。立場：賛成。","choices":[{"t":"Refill stations encourage people to reuse bottles and reduce the plastic they throw away.","why":"正解。水筒の再利用を促し、プラスチックごみを減らせるという利点が賛成を支える。"},{"t":"Towns must spend money on cleaning refill stations and checking their water regularly.","why":"維持管理の費用という負担で、設置に反対する理由になる。"},{"t":"Towns should create refill stations because providing places to refill bottles is helpful.","why":"役立つという評価だけで、具体的にどのような利点があるかを述べていない。"},{"t":"I filled my blue water bottle at the station near our park this morning.","why":"今朝の個人的な体験だけで、町全体への利点を説明していない。"},{"t":"Some refill stations have two taps and stand beside the entrances to parks.","why":"設備の形や場所という事実だけで、設置すべき理由になっていない。"},{"t":"Towns should use local photographs on the covers of their monthly community magazines.","why":"広報誌の表紙についての提案で、給水場所を設ける理由から外れている。"}],"answer":0,"point":"環境の理由では、提案によって何が減るのかを具体的に述べる。","drive":{"ja":"町に水筒への給水場所を設けることに賛成です。ごみへの影響を英語で一文述べてください。","en":"Refill stations encourage people to reuse bottles and reduce the plastic they throw away."},"level":2},{"id":"g2-reason-008","q":"TOPIC: Should schools make all homework available only through smartphone apps?\nPosition: Disagree","q_ja":"学校はすべての宿題をスマートフォンのアプリだけで配信すべきか。立場：反対。","choices":[{"t":"Homework apps allow teachers to send new tasks quickly without printing any paper.","why":"紙を印刷せず素早く配信できるという利点で、アプリだけの配信に賛成する理由になる。"},{"t":"Schools should keep other ways of giving homework because using only apps is wrong.","why":"アプリだけにするのはよくないという主張を繰り返し、理由を示していない。"},{"t":"Some teachers put homework on apps before students leave school in the afternoon.","why":"宿題の配信方法や時間という事実だけで、反対の理由を述べていない。"},{"t":"I opened our homework app on my phone while riding the bus yesterday.","why":"個人がアプリを使った出来事だけで、配信方法を限定する問題を示していない。"},{"t":"Students without smartphones may be unable to complete tasks that require these apps.","why":"正解。スマートフォンを持たない生徒が課題に取り組めなくなるおそれが、反対の理由になる。"},{"t":"Schools should choose a different song for students to sing at graduation ceremonies.","why":"卒業式の歌についての提案で、宿題の配信方法とは関係がない。"}],"answer":4,"point":"利用手段を一つに限定する提案では、それを使えない人への影響を考える。","drive":{"ja":"宿題をスマートフォンのアプリだけで配信することに反対です。端末を持たない生徒への影響を英語で一文述べてください。","en":"Students without smartphones may be unable to complete tasks that require these apps."},"level":2},{"id":"g2-reason-009","q":"TOPIC: Should neighborhoods hold events where residents repair broken household items together?\nPosition: Agree","q_ja":"地域は住民が壊れた日用品を一緒に修理する催しを開くべきか。立場：賛成。","choices":[{"t":"Repair events require skilled volunteers who may be difficult to find in some neighborhoods.","why":"技能のある協力者を探す難しさで、開催に反対する理由になる。"},{"t":"Repair events help residents save money by using household items for a longer time.","why":"正解。日用品を長く使って出費を抑えられるという一般的な利点が、賛成の理由になる。"},{"t":"My neighbor fixed my kitchen clock at an event in our community hall yesterday.","why":"一度の個人的な出来事だけで、住民全体にとっての利点を説明していない。"},{"t":"Neighborhoods should hold repair events because these events are worth having in the community.","why":"開催する価値があるという主張を繰り返すだけで、その理由がない。"},{"t":"Some repair events take place on Sunday mornings in rooms at local community centers.","why":"開催日時や場所という事実だけで、催しを開くべき理由になっていない。"},{"t":"Neighborhoods should ask residents to suggest new names for streets near the community center.","why":"通りの名前についての提案で、修理の催しを開く理由から外れている。"}],"answer":1,"point":"費用を理由にするときは、何をすることで出費が減るかを示す。","drive":{"ja":"住民が日用品を一緒に修理する催しに賛成です。家計への利点を英語で一文述べてください。","en":"Repair events help residents save money by using household items for a longer time."},"level":2},{"id":"g2-reason-010","q":"TOPIC: Should families keep the television on throughout every evening meal?\nPosition: Disagree","q_ja":"家庭では毎日の夕食中ずっとテレビをつけておくべきか。立場：反対。","choices":[{"t":"Evening television programs give family members interesting topics to discuss while eating together.","why":"会話の話題を得られるという利点で、テレビをつけることに賛成する理由になる。"},{"t":"Some families have a television on a small table beside their dining room window.","why":"テレビの置き場所という事実だけで、夕食中の視聴に反対する理由がない。"},{"t":"Families should buy larger plates when they replace the dishes in their kitchens.","why":"食器の大きさについての提案で、夕食中にテレビをつけることとは関係がない。"},{"t":"Watching television during meals reduces the attention family members give to each other.","why":"正解。家族が互いに注意を向けにくくなるという欠点が、反対の理由になる。"},{"t":"I watched a quiz show with my sister while eating dinner at home yesterday.","why":"昨日の個人的な体験だけで、夕食中の視聴の一般的な問題を示していない。"},{"t":"Families should turn off the television because keeping it on during dinner is undesirable.","why":"望ましくないという評価で主張を繰り返すだけで、その理由を説明していない。"}],"answer":3,"point":"反対の理由では、身近な習慣が人間関係に与える悪い影響も使える。","drive":{"ja":"夕食中ずっとテレビをつけておくことに反対です。家族への注意に与える影響を英語で一文述べてください。","en":"Watching television during meals reduces the attention family members give to each other."},"level":2}],"summary":[{"id":"g2-summary-001","q":"A town library has started lending tools that people rarely need, such as electric drills. Residents can borrow them instead of buying their own. This helps families spend less money and keeps fewer unused products in their homes. Borrowers must return each tool in good condition so others can use it.","q_ja":"ある町の図書館は、電動ドリルなど、めったに必要としない工具の貸し出しを始めた。住民は自分で買う代わりに借りられる。これにより家計の支出が減り、家に使わない製品がたまるのを防げる。ほかの人も使えるよう、借りた人は工具を良い状態で返す必要がある。","choices":[{"t":"Residents can borrow them instead of buying their own, and borrowers must return each tool in good condition.","why":"本文の表現をほぼそのままつないでおり、費用と不要な物を減らす効果を言い換えてまとめていない。"},{"t":"Lending electric drills helps families save money and space, provided that residents return the tools in good condition.","why":"電動ドリルという具体例を残しており、貸し出す道具全体の利点としてまとめていない。"},{"t":"Sharing equipment through libraries reduces household costs and clutter, while users are responsible for keeping borrowed items usable.","why":"正解。図書館で道具を共有すると出費や不要な物が減り、利用者には道具を良い状態で保つ責任がある。"},{"t":"Libraries lend equipment to save residents money and space, while paid workers visit homes to check borrowed items.","why":"有料の作業員が家を訪ねて道具を点検するという、本文にない仕組みを加えている。"},{"t":"Library users must bring tools back in good condition so other residents can borrow the same equipment later.","why":"返却時の状態と次の利用者への配慮だけで、家計や収納への利点が抜けている。"},{"t":"Borrowing library equipment removes all household expenses and storage problems, while every resident always returns tools without damage.","why":"費用や収納の問題がすべてなくなることや、全員が必ず無傷で返すことまでは述べていない。"}],"answer":2,"point":"貸し出しの利点と利用者の責任を残し、道具の具体例は省いて一般化する。","drive":{"ja":"次の段落の要点を英語1文で。図書館で道具を共有すると出費や不要な物が減り、利用者には道具を良い状態で保つ責任がある。","en":"Sharing equipment through libraries reduces household costs and clutter, while users are responsible for keeping borrowed items usable."},"level":3},{"id":"g2-summary-002","q":"Students at a high school grow vegetables behind their classrooms. By watering plants and checking the soil, they learn where food comes from. They also work in groups and decide how to divide the jobs. Teachers say the garden gives students useful knowledge about food and practice in working with others.","q_ja":"ある高校の生徒たちは教室の裏で野菜を育てている。水やりや土の確認を通して、食べ物がどこから来るかを学ぶ。また、グループで作業し、仕事の分担を決める。教師たちは、菜園は食べ物に関する役立つ知識と、ほかの人と協力する練習の機会を与えると話している。","choices":[{"t":"They learn where food comes from and work in groups and decide how to divide the jobs.","why":"本文の語句をほぼそのまま並べており、食の学習と協力する力の育成を言い換えていない。"},{"t":"Watering vegetables and checking the soil teach students about food, while dividing garden jobs helps them work together.","why":"水やりや土の確認という具体例を残しており、活動全体から得る学びにまとめていない。"},{"t":"Growing food at school builds knowledge and teamwork, and selling the vegetables pays for all the students' textbooks.","why":"野菜を売って生徒の教科書代をすべて払うという、本文にない内容を加えている。"},{"t":"Students learn about food by growing vegetables behind their classrooms and observing the soil as their plants develop.","why":"栽培から食について学ぶ点だけを扱い、分担して協力する力を育てる点が抜けている。"},{"t":"School gardens give every student complete knowledge of food production and prevent any disagreements during group activities.","why":"全員が食料生産を完全に理解し、意見の対立が一切なくなるという断定は本文を超えている。"},{"t":"School gardening helps students understand food production and develop the skills they need to cooperate with other people.","why":"正解。学校での栽培活動は、食料生産への理解と、ほかの人と協力する力を育てる。"}],"answer":5,"point":"複数の学習効果を拾い、作業の具体例を知識と協力する力にまとめる。","drive":{"ja":"次の段落の要点を英語1文で。学校での栽培活動は、食料生産への理解と、ほかの人と協力する力を育てる。","en":"School gardening helps students understand food production and develop the skills they need to cooperate with other people."},"level":2},{"id":"g2-summary-003","q":"Some office workers take short breaks to move around during the day. For example, they walk along a hallway for five minutes after finishing a task. Moving helps them feel less tired. However, workers need to plan these breaks carefully so that they can still complete their work on time.","q_ja":"一部の会社員は日中、体を動かすために短い休憩を取る。例えば、仕事を一つ終えた後、廊下を5分間歩く。体を動かすと疲れを感じにくくなる。ただし、時間どおりに仕事を終えられるよう、休憩を注意深く計画する必要がある。","choices":[{"t":"Brief activity breaks help employees feel refreshed, but they must manage their time to meet their work deadlines.","why":"正解。体を動かす短い休憩は気分を回復させるが、仕事の期限を守るための時間管理が必要である。"},{"t":"Moving helps them feel less tired, but workers need to plan these breaks carefully to complete their work.","why":"本文の語句をほぼそのまま使っており、休憩の効果と時間管理の必要性を言い換えていない。"},{"t":"Walking along a hallway for five minutes refreshes office workers, but their breaks require planning to avoid delays.","why":"廊下を5分間歩くという例と数字が残っており、体を動かす休憩全般にまとめていない。"},{"t":"Active breaks reduce tiredness, but employees must record their walking distance so their managers can calculate their pay.","why":"歩いた距離を記録し、上司が給与計算に使うという、本文にない内容を加えている。"},{"t":"Office workers feel less tired after moving around, and they sometimes take these breaks after completing a task.","why":"疲労を軽くする効果と休憩のタイミングだけで、仕事に遅れないための時間管理が抜けている。"},{"t":"Taking active breaks always removes tiredness completely and enables all employees to finish every task ahead of schedule.","why":"疲れが必ず完全に消え、全員がすべての仕事を早く終えるという誇張で、注意点も失われている。"}],"answer":0,"point":"However の前の利点と後の注意点を、どちらも残して要約する。","drive":{"ja":"次の段落の要点を英語1文で。体を動かす短い休憩は気分を回復させるが、仕事の期限を守るための時間管理が必要である。","en":"Brief activity breaks help employees feel refreshed, but they must manage their time to meet their work deadlines."},"level":2},{"id":"g2-summary-004","q":"A supermarket lowers the prices of food that must be eaten soon. For instance, bread is cheaper near closing time. Customers can save money by choosing these products, and the store throws away less food. However, shoppers should buy only what they can finish before it becomes unsafe to eat.","q_ja":"あるスーパーは、早く食べる必要のある食品を値下げする。例えば、閉店時刻が近づくとパンが安くなる。客はこうした商品を選んで節約でき、店も捨てる食品を減らせる。ただし、安全に食べられなくなる前に食べ切れる量だけ買うべきである。","choices":[{"t":"Customers can save money by choosing these products, and the store throws away less food, but shoppers should be careful.","why":"本文の表現をほぼ写し、注意点も曖昧にしているため、食べ切れる量という要点を適切にまとめていない。"},{"t":"Cheaper bread near closing time saves shoppers money and reduces waste, but customers should purchase only manageable amounts.","why":"閉店間際のパンという具体例を残しており、値引き食品全体の利点と注意点にまとめていない。"},{"t":"Discounted food saves money and limits waste, but stores require customers to show proof that they own refrigerators.","why":"冷蔵庫を持つ証明を店が求めるという、本文にない購入条件を加えている。"},{"t":"Lower prices help shoppers spend less, and customers can find these cheaper food products as closing time approaches.","why":"節約と値引きのタイミングだけで、食品廃棄の削減と食べ切れる量への注意が抜けている。"},{"t":"Discounting food reduces waste and shopping costs, but buyers must choose amounts they can eat before it spoils.","why":"正解。食品の値引きは廃棄と買い物費用を減らすが、安全なうちに食べ切れる量を選ぶ必要がある。"},{"t":"Reducing food prices ends all waste and lets customers buy unlimited amounts without worrying about food becoming unsafe.","why":"廃棄が完全になくなり、量や安全性を気にせず買えるという内容は、本文の注意点に反する誇張である。"}],"answer":4,"point":"値引きの二つの利点と、買い過ぎを避ける条件を一文にまとめる。","drive":{"ja":"次の段落の要点を英語1文で。食品の値引きは廃棄と買い物費用を減らすが、安全なうちに食べ切れる量を選ぶ必要がある。","en":"Discounting food reduces waste and shopping costs, but buyers must choose amounts they can eat before it spoils."},"level":3},{"id":"g2-summary-005","q":"A neighborhood group invites residents to walk in a local park each weekend. Last month, twelve people joined the walks. Participants get exercise without paying for a gym. They also have chances to talk with neighbors they did not know before, which helps people feel more connected to their community.","q_ja":"ある地域の団体は、毎週末に地元の公園を歩く活動に住民を招いている。先月は12人が参加した。参加者はジムの料金を払わずに運動できる。また、それまで知らなかった近所の人と話す機会もあり、地域とのつながりをより強く感じられる。","choices":[{"t":"Participants get exercise without paying for a gym and have chances to talk with neighbors they did not know before.","why":"本文の表現をほぼそのままつないでおり、運動と地域の人間関係という要点を言い換えていない。"},{"t":"Community walking groups offer inexpensive exercise and help residents build relationships with people who live in their area.","why":"正解。地域の歩く活動は、安く運動する機会を提供し、近所の人との関係づくりを助ける。"},{"t":"Twelve residents walked in a park last month, getting free exercise and opportunities to make friends with nearby people.","why":"参加者12人や先月の公園での活動という数字・具体例を残しており、活動の利点に絞れていない。"},{"t":"Neighborhood walks provide affordable exercise and social contact, while local doctors give each participant a free health check afterward.","why":"活動後に医師が参加者全員を無料で診察するという、本文にない内容を加えている。"},{"t":"Residents exercise without gym fees by walking together in a local park during activities organized by a neighborhood group.","why":"費用をかけずに運動できる点と活動場所だけで、近所の人とのつながりを深める点が抜けている。"},{"t":"Community walking groups make every resident physically fit and ensure that nobody in the neighborhood ever feels lonely again.","why":"住民全員が健康になり、誰も二度と孤独を感じないという効果は本文を超える断定である。"}],"answer":1,"point":"参加人数や場所の例を省き、運動面と人間関係の両方の利点を残す。","drive":{"ja":"次の段落の要点を英語1文で。地域の歩く活動は、安く運動する機会を提供し、近所の人との関係づくりを助ける。","en":"Community walking groups offer inexpensive exercise and help residents build relationships with people who live in their area."},"level":2},{"id":"g2-summary-006","q":"A community center teaches people to repair clothes rather than throw them away. In one lesson, visitors learn to replace buttons on shirts. These skills allow people to use clothes longer and spend less on new ones. The classes also help reduce the amount of clothing that ends up in the rubbish.","q_ja":"ある公民館では、服を捨てずに修理する方法を教えている。ある授業では、参加者はシャツのボタンを付け替える方法を学ぶ。こうした技能があれば服を長く使え、新しい服への支出も減らせる。講座は、ごみになる衣服の量を減らすことにも役立つ。","choices":[{"t":"These skills allow people to use clothes longer and spend less on new ones, and the classes also reduce rubbish.","why":"本文の語句をほぼそのままつないでおり、修理の効果を自分の表現でまとめていない。"},{"t":"Replacing buttons on shirts helps people wear clothing longer, spend less on replacements, and throw fewer clothes away.","why":"シャツのボタンの付け替えという具体例を残しており、衣服の修理全体の効果にまとめていない。"},{"t":"Repair lessons reduce clothing costs and waste, and participants receive free sewing machines to continue their work at home.","why":"自宅で使うミシンを参加者が無料でもらえるという、本文にない内容を加えている。"},{"t":"Learning to mend clothing extends its use, lowers replacement costs, and decreases the amount of material thrown away.","why":"正解。衣服の修理を学ぶと、服を長く使え、買い替え費用と捨てる量を減らせる。"},{"t":"People learn to mend clothing at a community center and keep wearing their old clothes for a longer period.","why":"学ぶ場所と長く着られる点だけで、購入費用と衣服のごみを減らす点が抜けている。"},{"t":"Clothing repair classes remove the need to buy any new clothes and completely stop clothing waste throughout the community.","why":"新しい服が一切不要になり、地域の衣服のごみが完全になくなるという誇張である。"}],"answer":3,"point":"具体的な修理方法を省き、長期使用・節約・廃棄削減という効果を残す。","drive":{"ja":"次の段落の要点を英語1文で。衣服の修理を学ぶと、服を長く使え、買い替え費用と捨てる量を減らせる。","en":"Learning to mend clothing extends its use, lowers replacement costs, and decreases the amount of material thrown away."},"level":3},{"id":"g2-summary-007","q":"Online lessons let students study without traveling to a school. One student who lives far away can attend an evening class from home. However, some learners find it difficult to ask questions through a screen. Teachers may need to set aside extra time to check whether everyone understands the lesson.","q_ja":"オンライン授業なら、生徒は学校に通わずに学べる。遠くに住むある生徒も、自宅から夜の授業に参加できる。ただし、画面越しに質問するのは難しいと感じる学習者もいる。教師は全員が授業を理解しているか確かめるため、追加の時間を設ける必要があるかもしれない。","choices":[{"t":"Students study without traveling to a school, but teachers may need to set aside extra time to check understanding.","why":"本文の表現をほぼ写しており、質問の難しさと理解確認の関係を言い換えてまとめていない。"},{"t":"An evening class lets a distant student learn at home, but asking questions online may require extra teacher support.","why":"遠方の生徒が自宅で夜の授業を受けるという具体例を残しており、授業全体の特徴にまとめていない。"},{"t":"Online classes save travel time, but teachers must visit students' homes every week to check their progress in person.","why":"教師が毎週家庭訪問をして対面で学習状況を確認するという、本文にない対応を加えている。"},{"t":"Students attend classes without traveling to school and can join evening lessons while staying in their own homes.","why":"通学せずに受講できる点と自宅での受講だけで、質問の難しさと教師の対応が抜けている。"},{"t":"Online learning makes questions impossible for every student and forces teachers to explain every lesson again to everyone.","why":"全員が質問できず、すべての授業の説明をやり直す必要があるという断定は本文を超えている。"},{"t":"Remote classes avoid travel, but communication difficulties may require teachers to spend more time checking their students' understanding.","why":"正解。オンライン授業は通学を不要にするが、意思疎通の難しさから理解の確認に追加の時間が必要な場合がある。"}],"answer":5,"point":"便利さだけで終えず、意思疎通の難しさと必要になり得る対応も残す。","drive":{"ja":"次の段落の要点を英語1文で。オンライン授業は通学を不要にするが、意思疎通の難しさから理解の確認に追加の時間が必要な場合がある。","en":"Remote classes avoid travel, but communication difficulties may require teachers to spend more time checking their students' understanding."},"level":3},{"id":"g2-summary-008","q":"A bus company has placed screens at busy stops to show when buses will arrive. For example, a passenger can see that the next bus is eight minutes away. This makes waiting less stressful. However, the information depends on an internet connection, so the screens may stop updating when the connection fails.","q_ja":"あるバス会社は、到着時刻を表示する画面を利用者の多い停留所に設置した。例えば、次のバスがあと8分で来ると確認できる。これにより待つときの不安が軽くなる。ただし、情報の表示にはインターネット接続が必要なため、接続に不具合があると更新が止まることがある。","choices":[{"t":"This makes waiting less stressful, but the screens may stop updating when the connection fails at busy bus stops.","why":"本文の表現をほぼそのままつないでおり、表示の効果と情報更新の弱点を言い換えていない。"},{"t":"A screen showing an eight minute wait reduces passenger stress, but an internet failure can stop its information updates.","why":"8分待ちという数字と表示例が残っており、到着案内の効果と弱点にまとめていない。"},{"t":"Arrival displays ease passengers' worries while waiting, but connection problems can prevent them from receiving current bus information.","why":"正解。到着案内の表示は待つ不安を和らげるが、通信の問題で最新のバス情報を得られなくなる場合がある。"},{"t":"Bus arrival screens reduce waiting worries, but passengers must pay a small charge whenever they check the displayed times.","why":"到着時刻を確認するたびに利用者が料金を払うという、本文にない条件を加えている。"},{"t":"Passengers feel less worried because screens at busy stops show them when the buses they need will arrive.","why":"到着情報による安心だけで、通信障害によって更新が止まる可能性が抜けている。"},{"t":"Arrival screens completely remove waiting stress and always provide correct bus times even when their internet connection stops working.","why":"不安が完全になくなり、接続が止まっても常に正確な時刻を示すという内容は本文に反する。"}],"answer":2,"point":"機器の利点と、動作に必要な条件が失われた場合の問題をまとめる。","drive":{"ja":"次の段落の要点を英語1文で。到着案内の表示は待つ不安を和らげるが、通信の問題で最新のバス情報を得られなくなる場合がある。","en":"Arrival displays ease passengers' worries while waiting, but connection problems can prevent them from receiving current bus information."},"level":3},{"id":"g2-summary-009","q":"An apartment building has a shelf where residents leave books they have finished reading. Last week, someone added three travel books. Other residents can take books without paying and return them when they finish. By passing books around, people enjoy different stories without buying new copies, and fewer books are thrown away.","q_ja":"ある集合住宅には、読み終えた本を住民が置く棚がある。先週は誰かが旅行の本を3冊置いた。ほかの住民は無料で本を持っていき、読み終えたら返せる。本を回し読みすることで、新しく買わずにさまざまな物語を楽しめ、捨てられる本も減る。","choices":[{"t":"Sharing books among neighbors provides reading variety at no cost and reduces the number of books people discard.","why":"正解。住民同士で本を共有すると、無料でさまざまな本を読め、捨てる本の数も減らせる。"},{"t":"People enjoy different stories without buying new copies, and fewer books are thrown away by residents passing books around.","why":"本文の表現をほぼそのまま使っており、本の共有による読書と廃棄削減の利点を言い換えていない。"},{"t":"Sharing three travel books on an apartment shelf lets residents read for free and keeps books out of rubbish.","why":"旅行の本3冊という具体例と数字を残しており、本の共有全体の効果にまとめていない。"},{"t":"Book sharing offers free reading and cuts waste, while publishers send new books to the building each month.","why":"出版社が毎月新しい本を住宅に送るという、本文にない仕組みを加えている。"},{"t":"Residents borrow books without paying from a shelf in their building and put them back after they finish reading.","why":"無料で借りて返す仕組みだけで、さまざまな本を読める点と廃棄を減らす点が抜けている。"},{"t":"Sharing books means residents never need to purchase any books again and prevents every book from being thrown away.","why":"今後一切本を買う必要がなくなり、すべての本の廃棄を防げるという誇張である。"}],"answer":0,"point":"冊数や本の種類を省き、多様な読書・費用・廃棄量への効果をまとめる。","drive":{"ja":"次の段落の要点を英語1文で。住民同士で本を共有すると、無料でさまざまな本を読め、捨てる本の数も減らせる。","en":"Sharing books among neighbors provides reading variety at no cost and reduces the number of books people discard."},"level":2},{"id":"g2-summary-010","q":"A youth center offers cooking lessons for teenagers. In one class, students make vegetable soup using simple ingredients. They learn to prepare meals instead of depending on ready meals from shops. They also practice choosing different kinds of food, which helps them plan meals that support their health when they live on their own.","q_ja":"ある青少年センターは10代の若者に料理教室を開いている。ある授業では、簡単な材料で野菜スープを作る。生徒は店の調理済み食品に頼らず食事を作ることを学ぶ。また、さまざまな種類の食品を選ぶ練習をし、将来一人で暮らすときに健康を支える献立を考えるのに役立てる。","choices":[{"t":"They learn to prepare meals instead of depending on ready meals from shops and practice choosing different kinds of food.","why":"本文の語句をほぼそのままつないでおり、自立後の食生活に役立つという要旨を言い換えていない。"},{"t":"Making vegetable soup with simple ingredients helps teenagers cook for themselves and select healthy meals when living on their own.","why":"野菜スープと簡単な材料という具体例が残っており、料理教室で身につける力全体にまとめていない。"},{"t":"Cooking lessons teach teenagers independent meal preparation and healthy choices, while the center delivers free ingredients to their homes weekly.","why":"センターが毎週材料を無料で自宅に届けるという、本文にないサービスを加えている。"},{"t":"Teenagers practice preparing their own meals at a youth center so they can depend less on food bought from shops.","why":"自分で調理して市販食品への依存を減らす点だけで、健康に配慮して食品を選ぶ力が抜けている。"},{"t":"Cooking classes prepare teenagers to feed themselves and make healthy food choices when they begin living independently.","why":"正解。料理教室は、若者が自立して暮らす際に、自分で食事を作り健康的な食品を選ぶ力を育てる。"},{"t":"Cooking lessons ensure that all teenagers always eat perfectly healthy meals and never need to buy any prepared food again.","why":"全員が常に完全に健康的な食事をし、調理済み食品を一切買わなくなるという断定は本文を超えている。"}],"answer":4,"point":"料理の具体例を省き、自分で作る力と健康的に選ぶ力を残す。","drive":{"ja":"次の段落の要点を英語1文で。料理教室は、若者が自立して暮らす際に、自分で食事を作り健康的な食品を選ぶ力を育てる。","en":"Cooking classes prepare teenagers to feed themselves and make healthy food choices when they begin living independently."},"level":2},{"id":"g2-summary-101","q":"Some schools have small gardens. Children learn how plants grow and how to work with other students. For example, twenty children may grow carrots together. They take turns watering the plants and checking their leaves. These activities give children useful lessons outside the classroom.","q_ja":"小さな菜園がある学校もあります。子どもたちは植物がどう育つかや、ほかの生徒とどう協力するかを学びます。例えば、20人で一緒にニンジンを育てることがあります。交代で水をやり、葉を観察します。こうした活動から、教室の外で役立つことを学べます。","choices":[{"t":"Children learn how plants grow and how to work with other students.","why":"本文の文をそのまま写しており、要点を自分の言葉で言い換えていない。"},{"t":"Twenty students grow carrots together and learn how to care for plants.","why":"20人やニンジンという具体例が残り、協力することを学ぶという要点も十分に表していない。"},{"t":"School gardens teach children about nature and help them work together.","why":"正解。自然についての学びと協力する力という二つの要点を、具体例を省いて言い換えている。"},{"t":"School gardens teach children about plants and provide free meals for families.","why":"家族に無料の食事を提供するという、本文にない内容を加えている。"},{"t":"Children discover how plants grow by watering them and checking their leaves.","why":"植物についての学びだけを述べ、水やりと葉の観察を足しているが、協力する力に触れていない。"},{"t":"School gardens teach every child all the skills needed to become farmers.","why":"全員が農家になるためのすべての技能を学ぶとは書かれておらず、効果を大きく言い過ぎている。"}],"answer":2,"point":"植物の育ち方と協力する力を残し、人数や野菜の名前は省いて言い換える。","level":1,"drive":{"ja":"次の段落の要点を英語1文で。学校の菜園で、子どもたちは自然について学び、協力する力を身に付ける。","en":"School gardens teach children about nature and help them work together."}},{"id":"g2-summary-102","q":"Some libraries lend tools that people only use sometimes. People spend less money and need less space for things at home. For example, they can borrow a drill for three days. They return it after finishing their work, so they do not have to buy or store one.","q_ja":"時々しか使わない道具を貸し出す図書館もあります。人々は出費を減らせて、家で物を置く場所も少なくて済みます。例えば、ドリルを3日間借りられます。作業が終わったら返すので、購入したり保管したりする必要がありません。","choices":[{"t":"Libraries lend drills for three days, helping people avoid buying these tools.","why":"ドリルや3日間という具体例が残り、保管場所を節約できるという要点も抜けている。"},{"t":"People spend less money and need less space for things at home.","why":"本文の文をそのまま写しており、道具の貸し出しによる利点を言い換えていない。"},{"t":"Library staff visit homes to repair things and reduce costs for families.","why":"図書館の職員が家を訪ねて修理するという、本文にない内容を加えている。"},{"t":"Library users save money because they can return tools after finishing work.","why":"費用の節約だけを述べ、返却の細部を足しているが、家の保管場所について触れていない。"},{"t":"Borrowing tools from libraries helps people spend less and save space.","why":"正解。道具を借りることで費用と保管場所を節約できるという要点を、具体例を省いてまとめている。"},{"t":"Borrowing library tools removes the need to buy any equipment for life.","why":"一生どんな道具も買わずに済むとは書かれておらず、貸し出しの効果を言い過ぎている。"}],"answer":4,"point":"道具を借りる二つの利点である費用と保管場所の節約を残し、道具名や日数は省く。","level":1,"drive":{"ja":"次の段落の要点を英語1文で。図書館で道具を借りると、購入費用と家の保管場所を節約できる。","en":"Borrowing tools from libraries helps people spend less and save space."}},{"id":"g2-summary-103","q":"Some adults take classes on the internet. Students can choose where to learn and when to open each lesson. For example, they may watch a lesson at home at nine in the evening. This freedom makes it easier to fit learning into a busy day.","q_ja":"インターネットで授業を受ける大人もいます。受講者は学ぶ場所や、各授業を開く時間を選べます。例えば、夜9時に自宅で授業を見ることができます。この自由さのおかげで、忙しい一日の中でも学習の時間を取りやすくなります。","choices":[{"t":"Online lessons let people study wherever and whenever it suits them.","why":"正解。自分に合った場所と時間で学べるという要点を、時刻や場所の例を省いて言い換えている。"},{"t":"Students can choose where to learn and when to open each lesson.","why":"本文の文をそのまま写しており、学ぶ場所と時間の自由さを言い換えていない。"},{"t":"Adults can watch lessons at home at nine in the evening.","why":"自宅や夜9時という具体例が残り、場所と時間を選べるという要点をまとめていない。"},{"t":"Internet classes help busy adults find better jobs after completing their lessons.","why":"受講後によりよい仕事が見つかるという、本文にない内容を加えている。"},{"t":"Adults can learn at home by watching their classes on the internet.","why":"自宅で学ぶという場所の面だけを述べ、授業を見る方法を足しているが、時間の自由さに触れていない。"},{"t":"Internet classes make studying easy for everyone, whatever their daily schedule is.","why":"どんな生活時間の人でも学習が簡単になるとは書かれておらず、便利さを言い過ぎている。"}],"answer":0,"point":"学ぶ場所と時間を選べるという共通の要点を残し、自宅や具体的な時刻は省く。","level":1,"drive":{"ja":"次の段落の要点を英語1文で。オンライン授業なら、自分に合った場所と時間で学べる。","en":"Online lessons let people study wherever and whenever it suits them."}},{"id":"g2-summary-104","q":"Planning meals before shopping has two benefits. Families throw away less food and spend less money at the supermarket. For example, they can check whether they already have apples or carrots. Then they buy only what they need for their meals, instead of buying extra food.","q_ja":"買い物の前に献立を考えることには二つの利点があります。家庭で捨てる食べ物が減り、スーパーで使うお金も少なくなります。例えば、リンゴやニンジンがすでにあるかを確認できます。そのうえで、余分に買わず、食事に必要な物だけを買います。","choices":[{"t":"Families throw away less food and spend less money at the supermarket.","why":"本文の文をそのまま写しており、献立を考える利点を言い換えていない。"},{"t":"Families check for apples and carrots before buying food for their meals.","why":"リンゴやニンジンという具体例が残り、食品の無駄と出費が減るという要点をまとめていない。"},{"t":"Meal plans keep families healthy and help them avoid expensive hospital visits.","why":"健康を保ち、高額な通院を避けられるという、本文にない内容を加えている。"},{"t":"Planning meals helps families waste less food and lower their costs.","why":"正解。献立を考えることで食品の無駄と出費を減らせるという要点を、具体例を省いて言い換えている。"},{"t":"Families save money by checking their food before visiting the supermarket.","why":"出費の節約だけを述べ、買い物前の確認を足しているが、捨てる食べ物が減ることに触れていない。"},{"t":"Meal plans stop families from wasting food or making unnecessary purchases again.","why":"食品の無駄や不要な買い物がなくなると断定しており、減らせるという本文の内容を言い過ぎている。"}],"answer":3,"point":"食品の無駄と出費が減るという二つの利点を残し、食品名や買い物の手順は省く。","level":1,"drive":{"ja":"次の段落の要点を英語1文で。買い物前に献立を考えると、食品の無駄と出費を減らせる。","en":"Planning meals helps families waste less food and lower their costs."}}],"template":[{"id":"g2-template-001","q":"I ___ that schools should provide more chances to learn about nature.","q_ja":"私は、学校は自然について学ぶ機会をもっと提供すべきだという意見に賛成です。","choices":[{"t":"agree to","why":"that 節を続けるこの形では、agree の後に to を置かない。"},{"t":"agreement","why":"agreement は名詞で、ここに必要な動詞ではない。"},{"t":"agree","why":"正解。I agree that ... で、続く意見への賛成を示す。"},{"t":"agree with","why":"agree with の後には通常、人や意見を表す名詞を置き、ここでは that 節を直接続けない。"}],"answer":2,"point":"I agree that＋主語＋動詞で賛成する内容を述べる。","drive":{"ja":"私は、学校は自然について学ぶ機会をもっと提供すべきだという意見に賛成です。","en":"I agree that schools should provide more chances to learn about nature."},"level":1},{"id":"g2-template-002","q":"I ___ that children should spend all their free time studying.","q_ja":"私は、子どもは自由な時間をすべて勉強に使うべきだという意見に反対です。","choices":[{"t":"disagreement","why":"disagreement は名詞で、主語 I に続く動詞ではない。"},{"t":"disagree to","why":"that 節を続けるときは disagree の後に to を置かない。"},{"t":"disagree with","why":"disagree with の後には通常、人や意見を表す名詞を置く。"},{"t":"disagree","why":"正解。I disagree that ... で、勉強にすべての自由時間を使うことへの反対を示す。"}],"answer":3,"point":"I disagree that ... で、続く意見への反対を示す。","drive":{"ja":"私は、子どもは自由な時間をすべて勉強に使うべきだという意見に反対です。","en":"I disagree that children should spend all their free time studying."},"level":1},{"id":"g2-template-003","q":"For these two ___, I believe that towns should protect their old buildings.","q_ja":"これらの二つの理由から、私は町が古い建物を守るべきだと考えます。","choices":[{"t":"reasons","why":"正解。two の後に複数形 reasons を置き、二つの理由から結論を導く。"},{"t":"reason","why":"two の後の可算名詞は複数形 reasons にする。"},{"t":"reasoning","why":"reasoning は推論という意味で、ここで two に続けて理由を数える形にはできない。"},{"t":"reasonable","why":"reasonable は形容詞で、two の後に必要な名詞ではない。"}],"answer":0,"point":"For these two reasons, ... で二つの理由をまとめて結論を述べる。","drive":{"ja":"これらの二つの理由から、私は町が古い建物を守るべきだと考えます。","en":"For these two reasons, I believe that towns should protect their old buildings."},"level":1},{"id":"g2-template-004","q":"In ___, I think that students should have time to relax after school.","q_ja":"結論として、私は生徒には放課後にくつろぐ時間が必要だと考えます。","choices":[{"t":"conclude","why":"conclude は動詞で、In の後に必要な名詞ではない。"},{"t":"conclusion","why":"正解。In conclusion は「結論として」を表す。"},{"t":"conclusive","why":"conclusive は形容詞で、In conclusion の形にならない。"},{"t":"concluding","why":"In concluding では、ここで必要な「結論として」という定型表現にならない。"}],"answer":1,"point":"結論を導く定型表現は In conclusion, ...。","drive":{"ja":"結論として、私は生徒には放課後にくつろぐ時間が必要だと考えます。","en":"In conclusion, I think that students should have time to relax after school."},"level":1},{"id":"g2-template-005","q":"In my ___, cities should make sidewalks safer for older people.","q_ja":"私の意見では、都市は高齢者にとって歩道をもっと安全にすべきです。","choices":[{"t":"opinionated","why":"opinionated は自分の意見を曲げないという意味の形容詞。"},{"t":"opinions","why":"この定型表現では複数形ではなく、単数形 opinion を使う。"},{"t":"opine","why":"opine は動詞で、my の後に必要な名詞ではない。"},{"t":"opinion","why":"正解。In my opinion は「私の意見では」を表す。"}],"answer":3,"point":"In my opinion, ... で、自分の立場を文頭に示す。","drive":{"ja":"私の意見では、都市は高齢者にとって歩道をもっと安全にすべきです。","en":"In my opinion, cities should make sidewalks safer for older people."},"level":1},{"id":"g2-template-006","q":"I would ___ to explain why schools should teach basic cooking skills.","q_ja":"私は、学校が基本的な調理の技術を教えるべき理由を説明したいと思います。","choices":[{"t":"like","why":"正解。would like to do は「〜したいと思う」を表す。"},{"t":"liking","why":"would の直後には動詞の原形を置く。"},{"t":"liked","why":"would の直後には過去形ではなく原形を置く。"},{"t":"likes","why":"would の後には三人称単数現在形ではなく原形を置く。"}],"answer":0,"point":"I would like to explain why ... で、理由の説明を始められる。","drive":{"ja":"私は、学校が基本的な調理の技術を教えるべき理由を説明したいと思います。","en":"I would like to explain why schools should teach basic cooking skills."},"level":1},{"id":"g2-template-007","q":"I am ___ that learning about other cultures is important for students.","q_ja":"私は、異文化について学ぶことは生徒にとって重要だと確信しています。","choices":[{"t":"convince","why":"am の後に原形 convince をそのまま置けない。"},{"t":"conviction","why":"conviction は名詞で、I am conviction とは言わない。"},{"t":"convinced","why":"正解。I am convinced that ... で、確信している内容を示す。"},{"t":"convincingly","why":"convincingly は副詞で、ここで必要な状態を表せない。"}],"answer":2,"point":"I am convinced that ... は強い確信を示す序論や結論の表現。","drive":{"ja":"私は、異文化について学ぶことは生徒にとって重要だと確信しています。","en":"I am convinced that learning about other cultures is important for students."},"level":2},{"id":"g2-template-008","q":"There ___ two main reasons why local libraries should stay open longer.","q_ja":"地域の図書館が開館時間を延ばすべき主な理由は二つあります。","choices":[{"t":"is","why":"後ろの two main reasons が複数なので is は使わない。"},{"t":"are","why":"正解。複数の理由を導くので There are を使う。"},{"t":"be","why":"現在形の文を作るには原形 be ではなく are が必要。"},{"t":"being","why":"being だけではこの文の述語を作れない。"}],"answer":1,"point":"There are two main reasons why ... で二つの理由を予告する。","drive":{"ja":"地域の図書館が開館時間を延ばすべき主な理由は二つあります。","en":"There are two main reasons why local libraries should stay open longer."},"level":1},{"id":"g2-template-009","q":"___ up, I believe that schools should give students more time for exercise.","q_ja":"要するに、私は学校が生徒にもっと運動する時間を与えるべきだと考えます。","choices":[{"t":"To summed","why":"to の後に過去形 summed は置かない。"},{"t":"To summary","why":"summary は名詞で、ここで必要な不定詞にならない。"},{"t":"To summing","why":"不定詞の to の後に動名詞 summing は置かない。"},{"t":"To sum","why":"正解。To sum up は「要するに」を表し、結論を導く。"}],"answer":3,"point":"To sum up, ... で、それまでの議論をまとめる。","drive":{"ja":"要するに、私は学校が生徒にもっと運動する時間を与えるべきだと考えます。","en":"To sum up, I believe that schools should give students more time for exercise."},"level":1},{"id":"g2-template-010","q":"I ___ the view that children should learn how to manage money.","q_ja":"私は、子どもはお金の管理方法を学ぶべきだという意見を支持します。","choices":[{"t":"support","why":"正解。support the view that ... で、続く意見を支持する。"},{"t":"support to","why":"support は他動詞なので、目的語 the view の前に to は不要。"},{"t":"support for","why":"動詞 support の目的語の前に for は置かない。"},{"t":"support with","why":"support the view という組み合わせに with は入れない。"}],"answer":0,"point":"I support the view that ... で、支持する立場を述べる。","drive":{"ja":"私は、子どもはお金の管理方法を学ぶべきだという意見を支持します。","en":"I support the view that children should learn how to manage money."},"level":2}],"vocab_ej":[{"id":"g2-vocab_ej-001","q":"Using both sides of paper helps schools [[save]] money.","q_ja":"紙の両面を使うことは、学校がお金を節約するのに役立つ。","choices":[{"t":"〜を借りる","why":"借りることではなく、紙に使うお金を少なくすることを表している。"},{"t":"〜を節約する","why":"正解。save money は、使うお金を少なくするという意味。"},{"t":"〜を寄付する","why":"寄付する相手は示されておらず、紙の使用による支出の話である。"},{"t":"〜を使い切る","why":"使い切るという意味ではなく、支出を抑えるという意味である。"}],"answer":1,"point":"save money は「お金を節約する」。save は文脈によって「救う」とも訳す。","level":1,"accept":["節約する","お金を節約する","支出を抑える","〜を節約する"],"drive":{"ja":"紙の両面を使うことは、学校がお金を節約するのに役立つ。","en":"Using both sides of paper helps schools save money."}},{"id":"g2-vocab_ej-002","q":"Schools should [[encourage]] students to discuss local environmental problems and suggest possible solutions.","q_ja":"学校は、生徒が地域の環境問題について話し合い、考えられる解決策を提案するよう促すべきだ。","choices":[{"t":"〜に説明する","why":"encourage は、情報を説明することではなく、行動を促すことを表す。"},{"t":"〜に許可する","why":"単に行動を許す意味ではなく、積極的に行動を促す意味である。"},{"t":"〜に命令する","why":"encourage は、命令によって従わせるという意味ではない。"},{"t":"〜に勧める","why":"正解。encourage 人 to do は、人にある行動をするよう促すという意味。"}],"answer":3,"point":"encourage 人 to do は「人に〜するよう促す・勧める」。","level":2,"accept":["奨励する","促す","勧める","〜するよう促す","〜に勧める"],"drive":{"ja":"学校は、生徒が地域の環境問題について話し合い、考えられる解決策を提案するよう促すべきだ。","en":"Schools should encourage students to discuss local environmental problems and suggest possible solutions."}},{"id":"g2-vocab_ej-003","q":"Long working hours [[account for]] much of the difference in sleep time between these two groups.","q_ja":"長時間労働が、この2つの集団の睡眠時間の差の大きな原因となっている。","choices":[{"t":"〜の原因となる","why":"正解。睡眠時間の差が生じる理由を述べており、原因となるという意味である。"},{"t":"〜の割合を占める","why":"account for の別の意味だが、この文は全体に対する構成比を述べていない。"},{"t":"〜を考慮に入れる","why":"これは take into account の意味で、account for のこの用法とは異なる。"},{"t":"〜の責任を負う","why":"この文は責任の所在ではなく、睡眠時間の差が生じる原因を説明している。"}],"answer":0,"point":"account for は、差や変化の理由を述べるとき「〜の原因となる・〜を説明する」。","level":3,"accept":["原因となる","〜の原因になる","原因になる","〜を説明する","説明する"],"drive":{"ja":"長時間労働が、この2つの集団の睡眠時間の差の大きな原因となっている。","en":"Long working hours account for much of the difference in sleep time between these two groups."}},{"id":"g2-vocab_ej-004","q":"Regular exercise can [[improve]] the health of office workers.","q_ja":"定期的な運動は、オフィスで働く人たちの健康状態を改善できる。","choices":[{"t":"〜を調査する","why":"運動で健康を調べるという意味ではなく、健康状態をよくするという意味である。"},{"t":"〜を維持する","why":"維持するは同じ状態を保つことで、improve が表す改善とは異なる。"},{"t":"〜を改善する","why":"正解。improve は、状態や質を今よりよくするという意味。"},{"t":"〜を悪化させる","why":"悪化させるは、状態をよくする improve とは反対の意味である。"}],"answer":2,"point":"improve は「〜を改善する」。健康・技術・サービスなどをよくするときに使う。","level":1,"accept":["改善する","よくする","良くする","向上させる","〜をよくする"],"drive":{"ja":"定期的な運動は、オフィスで働く人たちの健康状態を改善できる。","en":"Regular exercise can improve the health of office workers."}},{"id":"g2-vocab_ej-005","q":"Online courses are [[available]] to people who cannot travel to a college every day.","q_ja":"オンライン講座は、毎日大学に通えない人も利用できる。","choices":[{"t":"利用できる","why":"正解。available は、ここでは講座を利用できることを表す。"},{"t":"費用がかかる","why":"受講費用の有無は述べられておらず、利用できるかどうかを表している。"},{"t":"人気がある","why":"人気の高さではなく、対象の人が講座を利用できることを表している。"},{"t":"受講が必要な","why":"利用できることと、受講する必要があることは異なる。"}],"answer":0,"point":"available to 人 は「人が利用できる」。available には「手が空いている」という意味もある。","level":2,"accept":["利用可能な","利用可能","受講できる","利用することができる"],"drive":{"ja":"オンライン講座は、毎日大学に通えない人も利用できる。","en":"Online courses are available to people who cannot travel to a college every day."}},{"id":"g2-vocab_ej-006","q":"Small businesses cannot [[afford]] to close for a week while workers attend training courses in another city.","q_ja":"小規模な企業には、従業員が別の都市で研修を受ける間、1週間休業する余裕はない。","choices":[{"t":"〜する義務がある","why":"afford は義務を表さず、時間や費用などの余裕があることを表す。"},{"t":"〜する予定がある","why":"休業の予定ではなく、休業による負担に耐える余裕の有無を述べている。"},{"t":"〜する権利がある","why":"休業する権利についてではなく、事業上の余裕について述べている。"},{"t":"〜する余裕がある","why":"正解。cannot afford to do は、費用や時間などの面で〜する余裕がないという意味。"}],"answer":3,"point":"afford to do は「〜する余裕がある」。金銭だけでなく、時間や事業への影響にも使う。","level":2,"accept":["余裕がある","〜するだけの余裕がある","する余裕がある","経済的な余裕がある"],"drive":{"ja":"小規模な企業には、従業員が別の都市で研修を受ける間、1週間休業する余裕はない。","en":"Small businesses cannot afford to close for a week while workers attend training courses in another city."}},{"id":"g2-vocab_ej-007","q":"Local shops [[support]] the community by creating jobs nearby.","q_ja":"地元の店は、近くに雇用を生み出すことで地域社会を支えている。","choices":[{"t":"〜を調べる","why":"雇用を生み出すことが地域の調査になるという意味ではない。"},{"t":"〜を支える","why":"正解。support は、ここでは雇用を通じて地域社会を支えるという意味。"},{"t":"〜を訪れる","why":"地域に足を運ぶことではなく、地域の役に立つことを表している。"},{"t":"〜を管理する","why":"店が地域社会を管理しているとは述べていない。"}],"answer":1,"point":"support は「〜を支える・援助する」。地域や人への助けを述べるときに使う。","level":1,"accept":["支える","支援する","〜を支援する","援助する","〜を援助する"],"drive":{"ja":"地元の店は、近くに雇用を生み出すことで地域社会を支えている。","en":"Local shops support the community by creating jobs nearby."}},{"id":"g2-vocab_ej-008","q":"Some schools plan to [[replace]] printed textbooks with digital versions to lighten students' bags.","q_ja":"一部の学校は、生徒のかばんを軽くするため、紙の教科書をデジタル版に置き換える計画を立てている。","choices":[{"t":"〜を配布する","why":"教科書を配ることではなく、紙のものからデジタル版へ切り替えることを表している。"},{"t":"〜を比較する","why":"紙とデジタルを比較するという意味ではなく、一方を他方に替えるという意味。"},{"t":"〜を置き換える","why":"正解。replace A with B は、AをBに置き換えるという意味。"},{"t":"〜を元に戻す","why":"re が付いていても、replace はここでは元の状態に戻すという意味ではない。"}],"answer":2,"point":"replace A with B は「AをBに置き換える」。AとBの順番に注意する。","level":2,"accept":["置き換える","取り替える","〜を取り替える","交換する","〜を交換する"],"drive":{"ja":"一部の学校は、生徒のかばんを軽くするため、紙の教科書をデジタル版に置き換える計画を立てている。","en":"Some schools plan to replace printed textbooks with digital versions to lighten students' bags."}},{"id":"g2-vocab_ej-009","q":"Before changing bus routes, local officials should [[carry out]] a survey of residents who use public transportation regularly.","q_ja":"バスの路線を変更する前に、自治体の職員は公共交通機関を定期的に利用する住民を対象に調査を実施すべきだ。","choices":[{"t":"〜を計画する","why":"調査を計画する段階ではなく、実際に行うことを表している。"},{"t":"〜を実施する","why":"正解。carry out a survey は、調査を実際に行うという意味。"},{"t":"〜を延期する","why":"調査を後に延ばすという意味ではなく、路線変更の前に行うという意味である。"},{"t":"〜を引き継ぐ","why":"調査を他者から引き継ぐとは述べておらず、carry out は実施するという意味。"}],"answer":1,"point":"carry out は「〜を実施する・遂行する」。調査や計画などを実行に移すときに使う。","level":2,"accept":["実施する","行う","〜を行う","実行する","〜を実行する","遂行する"],"drive":{"ja":"バスの路線を変更する前に、自治体の職員は公共交通機関を定期的に利用する住民を対象に調査を実施すべきだ。","en":"Before changing bus routes, local officials should carry out a survey of residents who use public transportation regularly."}},{"id":"g2-vocab_ej-010","q":"Leaving lights on in empty classrooms can [[waste]] electricity.","q_ja":"誰もいない教室で照明をつけたままにすると、電気を無駄にすることがある。","choices":[{"t":"〜を蓄える","why":"照明をつけたままにしても、電気を蓄えることにはならない。"},{"t":"〜を生み出す","why":"照明は電気を使うものであり、ここでは電気を生み出すという意味ではない。"},{"t":"〜を無駄にする","why":"正解。waste は、必要のないことに資源などを使ってしまうという意味。"},{"t":"〜を有効に使う","why":"誰もいない教室の照明について述べており、有効に使うとは反対の意味である。"}],"answer":2,"point":"動詞の waste は「〜を無駄にする」。電気・水・時間・お金などに使う。","level":1,"accept":["無駄にする","むだにする","浪費する","〜を浪費する","〜をむだにする"],"drive":{"ja":"誰もいない教室で照明をつけたままにすると、電気を無駄にすることがある。","en":"Leaving lights on in empty classrooms can waste electricity."}},{"id":"g2-vocab_ej-011","q":"Clear instructions help workers [[avoid]] mistakes when they use a new machine for the first time.","q_ja":"明確な説明は、従業員が新しい機械を初めて使う際に間違いを避けるのに役立つ。","choices":[{"t":"〜を見つける","why":"間違いを見つけることではなく、間違いが起きないようにすることを表している。"},{"t":"〜を訂正する","why":"すでに起きた間違いを直すのではなく、間違いを避けるという意味である。"},{"t":"〜を受け入れる","why":"間違いを認めることではなく、間違いをしないようにすることを表している。"},{"t":"〜を避ける","why":"正解。avoid mistakes は、間違いをしないようにするという意味。"}],"answer":3,"point":"avoid は「〜を避ける」。後ろには名詞か動名詞を置く。","level":2,"accept":["避ける","回避する","〜を回避する","〜をしないようにする","しないようにする"],"drive":{"ja":"明確な説明は、従業員が新しい機械を初めて使う際に間違いを避けるのに役立つ。","en":"Clear instructions help workers avoid mistakes when they use a new machine for the first time."}},{"id":"g2-vocab_ej-012","q":"People [[tend to]] walk more when shops and public facilities are within walking distance of their homes.","q_ja":"店や公共施設が自宅から歩いて行ける距離にあると、人々はより多く歩く傾向がある。","choices":[{"t":"〜する傾向がある","why":"正解。tend to do は、ある行動や状態になりやすいという一般的な傾向を表す。"},{"t":"〜する予定である","why":"個々の人の予定ではなく、周囲の環境による一般的な傾向を述べている。"},{"t":"〜する必要がある","why":"歩く必要性や義務ではなく、歩く量が増えやすいという傾向を表している。"},{"t":"〜するつもりである","why":"これは intend to に近い意味であり、tend to は意図を表さない。"}],"answer":0,"point":"tend to do は「〜する傾向がある」。意図を表す intend to do と区別する。","level":2,"accept":["傾向がある","〜しがちである","しがちである","〜することが多い","する傾向がある"],"drive":{"ja":"店や公共施設が自宅から歩いて行ける距離にあると、人々はより多く歩く傾向がある。","en":"People tend to walk more when shops and public facilities are within walking distance of their homes."}}],"vocab_je":[{"id":"g2-vocab_je-001","q":"Using buses can ___（減らす） the number of cars on roads.","q_ja":"バスを利用すると、道路を走る車の数を減らせる。","choices":[{"t":"increase","why":"「増やす」という意味で、車の数を減らすという指定に合わない。"},{"t":"reduce","why":"正解。「減らす」という意味で、車の数を少なくすることを表す。"},{"t":"remove","why":"「取り除く」という意味で、数を減らすという意味の動詞とは異なる。"},{"t":"reuse","why":"「再利用する」という意味で、数を減らすことは表さない。"}],"answer":1,"point":"数や量を減らすときは reduce を使う。","level":1,"accept":["reduces","reduced","reducing","decrease"],"drive":{"ja":"バスを利用すると、道路を走る車の数を減らせる。","en":"Using buses can reduce the number of cars on roads."}},{"id":"g2-vocab_je-002","q":"Schools need trained staff who can ___（対処する） problems such as bullying among students.","q_ja":"学校には、生徒間のいじめなどの問題に対処できる、訓練を受けた職員が必要だ。","choices":[{"t":"care for","why":"「世話をする」という意味で、問題に対処するという指定に合わない。"},{"t":"search for","why":"「探す」という意味で、問題への対処を表さない。"},{"t":"agree with","why":"「賛成する」という意味で、いじめなどの問題に対処することは表さない。"},{"t":"deal with","why":"正解。問題などに「対処する」という意味で使う熟語。"}],"answer":3,"point":"deal with problems で「問題に対処する」を表す。","level":2,"accept":["deals with","dealt with","dealing with","handle","cope with"],"drive":{"ja":"学校には、生徒間のいじめなどの問題に対処できる、訓練を受けた職員が必要だ。","en":"Schools need trained staff who can deal with problems such as bullying among students."}},{"id":"g2-vocab_je-003","q":"Small changes in daily habits can ___（〜に貢献する） efforts to save energy at home and at school.","q_ja":"日々の習慣の小さな変化は、家庭や学校でエネルギーを節約する取り組みに貢献できる。","choices":[{"t":"contribute to","why":"正解。取り組みなどに「貢献する」は contribute to で表す。"},{"t":"contribute for","why":"貢献する対象を続けるときの前置詞は for ではなく to。"},{"t":"result from","why":"「〜の結果として生じる」という意味で、取り組みに貢献するという指定と異なる。"},{"t":"depend upon","why":"「〜に頼る」という意味で、取り組みへの貢献を表さない。"}],"answer":0,"point":"contribute to の to は前置詞で、後ろに貢献する対象の名詞を置く。","level":3,"accept":["contributes to","contributed to","contributing to","make a contribution to"],"drive":{"ja":"日々の習慣の小さな変化は、家庭や学校でエネルギーを節約する取り組みに貢献できる。","en":"Small changes in daily habits can contribute to efforts to save energy at home and at school."}},{"id":"g2-vocab_je-004","q":"Students can ___（参加する） volunteer activities in their local communities.","q_ja":"生徒は地元の地域でボランティア活動に参加できる。","choices":[{"t":"take care of","why":"「世話をする」という意味で、活動への参加を表さない。"},{"t":"keep up with","why":"「〜に遅れずについていく」という意味で、参加するという指定とは異なる。"},{"t":"take part in","why":"正解。活動や行事に「参加する」という意味の熟語。"},{"t":"look forward to","why":"「〜を楽しみに待つ」という意味で、参加すること自体は表さない。"}],"answer":2,"point":"take part in の後ろには、参加する活動や行事を置く。","level":1,"accept":["takes part in","took part in","taking part in","participate in"],"drive":{"ja":"生徒は地元の地域でボランティア活動に参加できる。","en":"Students can take part in volunteer activities in their local communities."}},{"id":"g2-vocab_je-005","q":"Signs near schools can ___（防ぐ） accidents by reminding drivers to slow down when children cross the road.","q_ja":"学校の近くの標識は、子どもが道路を横断するときに減速するよう運転手に注意を促すことで、事故を防げる。","choices":[{"t":"avoid","why":"「避ける」という意味で、標識が事故の発生を未然に防ぐという因果関係には prevent が合う。"},{"t":"forbid","why":"「禁止する」という意味で、事故の発生を防ぐこととは異なる。"},{"t":"refuse","why":"「拒否する」という意味で、事故を未然に防ぐことは表さない。"},{"t":"prevent","why":"正解。「防ぐ」という意味で、標識によって事故が起こらないようにすることを表す。"}],"answer":3,"point":"prevent accidents は「事故を防ぐ」。avoid は主語自身が危険などを避けるときに使う。","level":3,"accept":["prevents","prevented","preventing","help prevent"],"drive":{"ja":"学校の近くの標識は、子どもが道路を横断するときに減速するよう運転手に注意を促すことで、事故を防げる。","en":"Signs near schools can prevent accidents by reminding drivers to slow down when children cross the road."}},{"id":"g2-vocab_je-006","q":"Online lessons can ___（利益をもたらす） students who live too far away to attend classes in person.","q_ja":"オンライン授業は、遠くに住んでいて対面授業に出席できない生徒に利益をもたらすことができる。","choices":[{"t":"benefit","why":"正解。人に「利益をもたらす」という意味で、直後に対象となる人を置ける。"},{"t":"support","why":"「支える」という意味で、利益をもたらすという指定の動詞とは異なる。"},{"t":"improve","why":"「改善する」という意味で、生徒に利益をもたらすという指定と異なる。"},{"t":"develop","why":"「発達させる」という意味で、利益をもたらすこと自体は表さない。"}],"answer":0,"point":"benefit を他動詞として使うと「〜に利益をもたらす」になる。","level":2,"accept":["benefits","benefited","benefiting","be beneficial to"],"drive":{"ja":"オンライン授業は、遠くに住んでいて対面授業に出席できない生徒に利益をもたらすことができる。","en":"Online lessons can benefit students who live too far away to attend classes in person."}},{"id":"g2-vocab_je-007","q":"Public libraries ___（提供する） useful information for people of all ages.","q_ja":"公共図書館は、あらゆる年齢の人に役立つ情報を提供する。","choices":[{"t":"produce","why":"「生み出す」という意味で、情報を提供するという指定と異なる。"},{"t":"receive","why":"「受け取る」という意味で、提供する側と受け取る側が逆になる。"},{"t":"provide","why":"正解。「提供する」という意味で、図書館が情報を人々に届けることを表す。"},{"t":"prepare","why":"「準備する」という意味で、人々に情報を提供することとは異なる。"}],"answer":2,"point":"provide information for people で「人々に情報を提供する」を表す。","level":1,"accept":["provides","provided","providing","offer"],"drive":{"ja":"公共図書館は、あらゆる年齢の人に役立つ情報を提供する。","en":"Public libraries provide useful information for people of all ages."}},{"id":"g2-vocab_je-008","q":"Companies should ___（〜に責任を負う） the safety of the products they sell to customers.","q_ja":"企業は、顧客に販売する製品の安全性に責任を負うべきだ。","choices":[{"t":"be concerned about","why":"「〜を心配している」という意味で、責任を負うという指定とは異なる。"},{"t":"be responsible for","why":"正解。「〜に責任を負う」という意味で、製品の安全性への責任を表す。"},{"t":"be suitable for","why":"「〜に適している」という意味で、企業の責任を表さない。"},{"t":"be satisfied with","why":"「〜に満足している」という意味で、責任を負うこととは異なる。"}],"answer":1,"point":"be responsible for の後ろには、責任を負う対象を置く。","level":2,"accept":["are responsible for","were responsible for","being responsible for","take responsibility for"],"drive":{"ja":"企業は、顧客に販売する製品の安全性に責任を負うべきだ。","en":"Companies should be responsible for the safety of the products they sell to customers."}},{"id":"g2-vocab_je-009","q":"Young users must ___（〜を認識している） risks when sharing personal information with strangers on the internet.","q_ja":"若い利用者は、インターネット上で知らない人と個人情報を共有するときの危険性を認識していなければならない。","choices":[{"t":"be familiar to","why":"「〜によく知られている」という意味で、利用者が危険性を認識していることにはならない。"},{"t":"be worried about","why":"「〜を心配している」という意味で、危険性の存在を認識しているという指定とは異なる。"},{"t":"be certain of","why":"「〜を確信している」という意味で、危険性を認識しているという意味よりも確信を強調する。"},{"t":"be aware of","why":"正解。「〜を認識している」という意味で、危険性の存在を知っていることを表す。"}],"answer":3,"point":"be aware of は、事実や危険性などを認識している状態を表す。","level":3,"accept":["are aware of","were aware of","being aware of","recognize"],"drive":{"ja":"若い利用者は、インターネット上で知らない人と個人情報を共有するときの危険性を認識していなければならない。","en":"Young users must be aware of risks when sharing personal information with strangers on the internet."}},{"id":"g2-vocab_je-010","q":"Many rural workers ___（〜に頼る） local buses because they cannot afford to buy a car.","q_ja":"地方で働く多くの人は、車を買う経済的な余裕がないため、地域のバスに頼っている。","choices":[{"t":"depend on","why":"正解。「〜に頼る」という意味で、移動手段としてバスを必要としていることを表す。"},{"t":"result in","why":"「〜という結果になる」という意味で、人がバスに頼る関係を表さない。"},{"t":"belong to","why":"「〜に所属する」という意味で、バスを頼りにすることとは異なる。"},{"t":"consist of","why":"「〜から成る」という意味で、人と交通手段の関係には合わない。"}],"answer":0,"point":"depend on は、人や物を頼りにする関係を表すときにも使う。","level":2,"accept":["depends on","depended on","depending on","rely on"],"drive":{"ja":"地方で働く多くの人は、車を買う経済的な余裕がないため、地域のバスに頼っている。","en":"Many rural workers depend on local buses because they cannot afford to buy a car."}},{"id":"g2-vocab_je-011","q":"Local rules can ___（守る） wild animals from harm.","q_ja":"地域の規則は、野生動物を危害から守ることができる。","choices":[{"t":"restore","why":"「元の状態に戻す」という意味で、危害から守るという指定とは異なる。"},{"t":"protect","why":"正解。protect A from B で「AをBから守る」を表す。"},{"t":"promote","why":"「促進する」という意味で、危害から守ることは表さない。"},{"t":"protest","why":"「抗議する」という意味で、動物を守るという指定とは異なる。"}],"answer":1,"point":"protect animals from harm で「動物を危害から守る」を表す。","level":1,"accept":["protects","protected","protecting","keep"],"drive":{"ja":"地域の規則は、野生動物を危害から守ることができる。","en":"Local rules can protect wild animals from harm."}},{"id":"g2-vocab_je-012","q":"Media lessons should teach students to ___（区別する） facts from opinions before they share news with other people online.","q_ja":"メディアに関する授業では、生徒がインターネット上で他の人とニュースを共有する前に、事実と意見を区別するよう教えるべきだ。","choices":[{"t":"determine","why":"「特定する・決定する」という意味で、AとBを区別するという from を伴う形には合わない。"},{"t":"distribute","why":"「配る」という意味で、事実と意見を区別することは表さない。"},{"t":"distinguish","why":"正解。distinguish A from B で「AとBを区別する」を表す。"},{"t":"demonstrate","why":"「示す・実証する」という意味で、事実と意見の違いを見分けるという指定には合わない。"}],"answer":2,"point":"distinguish A from B では、区別する二つの対象を from でつなぐ。","level":3,"accept":["distinguishes","distinguished","distinguishing","tell"],"drive":{"ja":"メディアに関する授業では、生徒がインターネット上で他の人とニュースを共有する前に、事実と意見を区別するよう教えるべきだ。","en":"Media lessons should teach students to distinguish facts from opinions before they share news with other people online."}}]},"p1":{"collocation":[{"id":"p1-collocation-001","q":"Unregulated use of facial recognition could ___ a threat to civil liberties by allowing authorities to track individuals without their consent.","q_ja":"顔認証を規制なく利用すると、当局が本人の同意なく個人を追跡できるようになり、市民的自由を脅かすおそれがある。","choices":[{"t":"impose","why":"impose は義務や制限を課す場合に使い、a threat を目的語にして脅威となるとは言わない。"},{"t":"pose","why":"正解。pose a threat to は「〜への脅威となる」という組み合わせ。"},{"t":"compose","why":"compose は文章や曲を作る意味で、a threat と組み合わせて脅威となるとは言わない。"},{"t":"dispose","why":"dispose は不要物の処分などに用い、dispose a threat to という形にはならない。"}],"answer":1,"point":"pose a threat to ～ は「〜への脅威となる」。脅かされる対象を to の後に置く。","drive":{"ja":"規制のない顔認証の利用は、市民的自由への脅威となるおそれがある。「脅威となる」を英語で表しましょう。","en":"Unregulated use of facial recognition could pose a threat to civil liberties by allowing authorities to track individuals without their consent."},"level":2},{"id":"p1-collocation-002","q":"Public campaigns should ___ awareness of misleading health claims so that consumers evaluate online advertisements more critically before purchasing expensive treatments.","q_ja":"消費者が高額な治療を購入する前にネット広告をより批判的に評価するよう、公共キャンペーンは誤解を招く健康上の宣伝への認識を高めるべきだ。","choices":[{"t":"rise","why":"rise は自動詞で、awareness を直接目的語に取って高めるという意味にはできない。"},{"t":"arise","why":"arise は問題などが生じるという自動詞で、awareness を目的語に取れない。"},{"t":"erect","why":"erect は建物などを建てる意味で、awareness と組み合わせて認識を高めるとは言わない。"},{"t":"raise","why":"正解。raise awareness of は「〜への認識を高める」という組み合わせ。"}],"answer":3,"point":"raise awareness of ～ は「〜への認識を高める」。他動詞 raise と自動詞 rise を区別する。","drive":{"ja":"公共キャンペーンは、誤解を招く健康上の宣伝への認識を高めるべきだ。「認識を高める」を英語で表しましょう。","en":"Public campaigns should raise awareness of misleading health claims so that consumers evaluate online advertisements more critically before purchasing expensive treatments."},"level":1},{"id":"p1-collocation-003","q":"Subsidized childcare would ___ the financial burden on working parents, enabling more households to maintain stable employment despite rising living costs.","q_ja":"保育への補助金は働く親の経済的負担を軽減し、生活費が上昇しても、より多くの世帯が安定した雇用を維持できるようにするだろう。","choices":[{"t":"alleviate","why":"正解。alleviate the burden は「負担を軽減する」という組み合わせで、保育への補助金の効果に合う。"},{"t":"levitate","why":"levitate は空中に浮く・浮かせる意味で、経済的負担を軽減する意味にはならない。"},{"t":"allocate","why":"allocate は資金などを割り当てる意味で、負担を軽減するという文意にならない。"},{"t":"elevate","why":"elevate は高める意味で、保育への補助金が経済的負担を軽くするという文意に合わない。"}],"answer":0,"point":"alleviate the burden on ～ は「〜の負担を軽減する」。負担を受ける人を on の後に置く。","drive":{"ja":"保育への補助金は働く親の経済的負担を軽減するだろう。「負担を軽減する」を英語で表しましょう。","en":"Subsidized childcare would alleviate the financial burden on working parents, enabling more households to maintain stable employment despite rising living costs."},"level":2},{"id":"p1-collocation-004","q":"Affordable internet access could ___ the gap between urban and rural communities by expanding access to remote education and specialized medical advice.","q_ja":"手頃な料金のインターネット接続は、遠隔教育や専門的な医療助言を利用しやすくすることで、都市と農村の格差を埋める可能性がある。","choices":[{"t":"construct","why":"construct は建物や仕組みを作る意味で、the gap を目的語にして格差を埋めるとは言わない。"},{"t":"connect","why":"connect は二つの対象を結ぶ動詞で、connect the gap では格差を埋めるという自然な表現にならない。"},{"t":"bridge","why":"正解。bridge the gap between は「〜の間の隔たりを埋める」という組み合わせ。"},{"t":"establish","why":"establish は制度などを設立する意味で、格差を埋めることを表せない。"}],"answer":2,"point":"bridge the gap between A and B は「AとBの間の隔たり・格差を埋める」。","drive":{"ja":"手頃な料金のネット接続は、都市と農村の格差を埋める可能性がある。「格差を埋める」を英語で表しましょう。","en":"Affordable internet access could bridge the gap between urban and rural communities by expanding access to remote education and specialized medical advice."},"level":1},{"id":"p1-collocation-005","q":"Consumer organizations may ___ pressure on manufacturers to disclose environmental risks associated with products that contain substances harmful to local ecosystems.","q_ja":"消費者団体は、地域の生態系に有害な物質を含む製品の環境上のリスクを公表するよう、製造業者に圧力をかけることがある。","choices":[{"t":"execute","why":"execute は計画などを実行する意味で、pressure を目的語にして圧力をかけるとは言わない。"},{"t":"exert","why":"正解。exert pressure on は「〜に圧力をかける」という組み合わせ。"},{"t":"perform","why":"perform は仕事や行為を実行する意味で、pressure を目的語にして圧力をかけるとは言わない。"},{"t":"conduct","why":"conduct は調査などを実施する意味で、pressure とはこの意味で組み合わせない。"}],"answer":1,"point":"exert pressure on A to do は「Aに〜するよう圧力をかける」。","drive":{"ja":"消費者団体は、環境上のリスクを公表するよう製造業者に圧力をかけることがある。「圧力をかける」を英語で表しましょう。","en":"Consumer organizations may exert pressure on manufacturers to disclose environmental risks associated with products that contain substances harmful to local ecosystems."},"level":2},{"id":"p1-collocation-006","q":"Local authorities should ___ sufficient funds to preventive maintenance, which helps avoid costly failures in aging water systems serving vulnerable communities.","q_ja":"地方自治体は、社会的に弱い立場にある人々の地域に水を供給する老朽設備の高額な故障を防ぐため、予防保全に十分な資金を配分すべきだ。","choices":[{"t":"borrow","why":"borrow は借りる意味で、borrow funds to maintenance という形で維持管理への資金配分は表せない。"},{"t":"consume","why":"consume は消費する意味で、consume funds to maintenance という配分の形にはならない。"},{"t":"accommodate","why":"accommodate は人を収容したり要求に対応したりする意味で、資金を配分する意味にはならない。"},{"t":"allocate","why":"正解。allocate funds to は「〜に資金を配分する」という組み合わせ。"}],"answer":3,"point":"allocate funds to ～ は「〜に資金を配分する」。予算の使途を説明するときに使う。","drive":{"ja":"地方自治体は、水道設備の予防保全に十分な資金を配分すべきだ。「資金を配分する」を英語で表しましょう。","en":"Local authorities should allocate sufficient funds to preventive maintenance, which helps avoid costly failures in aging water systems serving vulnerable communities."},"level":2},{"id":"p1-collocation-007","q":"Publishing clear explanations of policy decisions helps ___ public trust in institutions, particularly when officials acknowledge uncertainty and respond openly to criticism.","q_ja":"政策決定の明確な説明を公表することは、とりわけ当局者が不確実性を認め、批判に率直に応じる場合、制度への国民の信頼を育む助けになる。","choices":[{"t":"foster","why":"正解。foster trust は「信頼を育む」という組み合わせで、説明や率直な対応の効果に合う。"},{"t":"harvest","why":"harvest は作物などを収穫する意味で、public trust を育むという自然な表現にはならない。"},{"t":"administer","why":"administer は制度を運営したり薬を投与したりする意味で、信頼を育む意味では使わない。"},{"t":"manufacture","why":"manufacture は製品を製造する意味で、この文で国民の信頼を育むという自然な組み合わせにはならない。"}],"answer":0,"point":"foster trust は「信頼を育む」。foster は協力や理解など抽象的なものの発展にも使う。","drive":{"ja":"政策決定を明確に説明することは、制度への国民の信頼を育む助けになる。「信頼を育む」を英語で表しましょう。","en":"Publishing clear explanations of policy decisions helps foster public trust in institutions, particularly when officials acknowledge uncertainty and respond openly to criticism."},"level":2},{"id":"p1-collocation-008","q":"To ___ the root causes of unemployment, policymakers must examine whether existing education systems equip graduates with skills required in emerging industries.","q_ja":"失業の根本原因に対処するには、政策担当者は既存の教育制度が新興産業で必要とされる技能を卒業生に身につけさせているか検討しなければならない。","choices":[{"t":"reply","why":"reply は返答する意味で、the root causes を直接目的語に取って対処するとは言わない。"},{"t":"react","why":"react は自動詞であり、対象を示すには to が必要なので、この空所には入らない。"},{"t":"address","why":"正解。address the root causes は「根本原因に対処する」という組み合わせ。"},{"t":"cope","why":"cope は対象の前に with が必要で、the root causes を直接目的語に取れない。"}],"answer":2,"point":"address the root causes of ～ は「〜の根本原因に対処する」。address は対象を直接目的語に取る。","drive":{"ja":"失業の根本原因に対処するには、教育制度と産業で必要な技能の関係を検討しなければならない。「根本原因に対処する」を英語で表しましょう。","en":"To address the root causes of unemployment, policymakers must examine whether existing education systems equip graduates with skills required in emerging industries."},"level":2},{"id":"p1-collocation-009","q":"Regulatory agencies must ___ safety standards consistently so that companies cannot gain an unfair competitive advantage by exposing workers to avoidable risks.","q_ja":"企業が労働者を回避可能な危険にさらして不当な競争上の優位を得ることがないよう、規制当局は安全基準を一貫して順守させなければならない。","choices":[{"t":"obey","why":"obey は主体自身が規則に従う意味で、規制当局が企業に順守させるという役割を表せない。"},{"t":"enforce","why":"正解。enforce safety standards は「安全基準を順守させる」という組み合わせ。"},{"t":"comply","why":"comply は with を伴って順守するという意味になり、standards を直接目的語に取れない。"},{"t":"abide","why":"abide は規則に従う意味では by を伴うため、この形では使えない。"}],"answer":1,"point":"enforce standards は「基準を順守させる」。順守する側と順守させる側の役割を区別する。","drive":{"ja":"規制当局は、企業に安全基準を一貫して順守させなければならない。「安全基準を順守させる」を英語で表しましょう。","en":"Regulatory agencies must enforce safety standards consistently so that companies cannot gain an unfair competitive advantage by exposing workers to avoidable risks."},"level":2},{"id":"p1-collocation-010","q":"International negotiators must ___ a consensus on emissions targets before they can establish a reliable framework for monitoring progress across participating countries.","q_ja":"国際交渉の担当者は、参加国全体の進捗を監視する信頼性の高い枠組みを設ける前に、排出量目標について合意に達しなければならない。","choices":[{"t":"arrive","why":"arrive は合意に達する意味では at が必要で、a consensus を直接目的語に取れない。"},{"t":"conclude","why":"conclude は交渉を終えたり協定を結んだりする意味では使うが、conclude a consensus とは通常言わない。"},{"t":"attend","why":"attend は会議などに出席する意味で、a consensus と組み合わせて合意に達するとは言わない。"},{"t":"reach","why":"正解。reach a consensus on は「〜について合意に達する」という組み合わせ。"}],"answer":3,"point":"reach a consensus on ～ は「〜について合意に達する」。reach の直後に a consensus を置く。","drive":{"ja":"国際交渉の担当者は、排出量目標について合意に達しなければならない。「合意に達する」を英語で表しましょう。","en":"International negotiators must reach a consensus on emissions targets before they can establish a reliable framework for monitoring progress across participating countries."},"level":2},{"id":"p1-collocation-101","q":"Public campaigns help ___ awareness of the need to protect personal data online.","q_ja":"啓発活動は、オンラインで個人情報を守る必要性への意識を高めるのに役立つ。","choices":[{"t":"reduce","why":"reduce は「減らす」。個人情報を守るための啓発活動が意識を低下させるという意味になり、文脈に合わない。"},{"t":"raise","why":"正解。raise awareness of で「〜への意識を高める」という自然な組み合わせになる。"},{"t":"solve","why":"solve は問題などを「解決する」ときに使い、awareness（意識）とは組み合わせない。"},{"t":"protect","why":"protect は情報や権利などを「守る」ときに使い、意識を高める意味では awareness と組み合わせない。"}],"answer":1,"point":"raise awareness of で「〜への意識を高める」。啓発活動の目的を述べるときに使える。","level":1,"drive":{"ja":"啓発活動は、オンラインで個人情報を守る必要性への意識を高めるのに役立つ。","en":"Public campaigns help raise awareness of the need to protect personal data online."}},{"id":"p1-collocation-102","q":"The spread of false information can ___ a threat to public health during emergencies.","q_ja":"誤った情報の拡散は、緊急時に公衆衛生への脅威となることがある。","choices":[{"t":"solve","why":"solve は問題を「解決する」ときに使い、a threat とは組み合わせない。"},{"t":"gain","why":"gain は利益や支持などを「得る」ときに使い、脅威をもたらす意味では使わない。"},{"t":"draw","why":"draw は注意や関心などを「引く」ときに使い、a threat を目的語にして脅威となる意味では使わない。"},{"t":"pose","why":"正解。pose a threat to で「〜への脅威となる」という自然な組み合わせになる。"}],"answer":3,"point":"pose a threat to で「〜への脅威となる」。社会的な危険や悪影響を説明するときに使える。","level":1,"drive":{"ja":"誤った情報の拡散は、緊急時に公衆衛生への脅威となることがある。","en":"The spread of false information can pose a threat to public health during emergencies."}}],"connector":[{"id":"p1-connector-001","q":"The independent review found that the proposed surveillance system would seriously threaten citizens' privacy. ___, the government approved its installation without introducing any additional safeguards against potential abuse.","q_ja":"独立した審査は、提案された監視システムが市民のプライバシーを深刻に脅かすと判断した。それにもかかわらず、政府は悪用を防ぐ追加措置を一切導入せずに設置を承認した。","choices":[{"t":"Nevertheless","why":"正解。プライバシーへの深刻な脅威が判明したのに承認したという、予想に反する展開を示す。"},{"t":"Consequently","why":"「その結果」では、脅威の指摘が保護措置なしの承認につながるという不自然な因果関係になる。"},{"t":"For instance","why":"後文は監視がプライバシーを脅かす具体例ではなく、政府の決定を述べている。"},{"t":"Similarly","why":"「同様に」は共通する傾向を示すが、後文は審査結果に反する対応を述べている。"}],"answer":0,"point":"Nevertheless は、前文から予想される展開に反する事実を「それにもかかわらず」と導く。","drive":{"ja":"監視によるプライバシーへの脅威が判明した。それにもかかわらず政府は承認した。この逆接を英語で表しましょう。","en":"The independent review found that the proposed surveillance system would seriously threaten citizens' privacy. Nevertheless, the government approved its installation without introducing any additional safeguards against potential abuse."},"level":2},{"id":"p1-connector-002","q":"Repeated droughts have reduced agricultural production across the region, leaving many farmers unable to repay their loans. ___, the government has introduced emergency financial assistance to prevent widespread bankruptcies in rural communities.","q_ja":"度重なる干ばつで地域全体の農業生産が減り、多くの農家が融資を返済できなくなった。その結果、政府は農村地域での相次ぐ破産を防ぐため、緊急の資金援助を導入した。","choices":[{"t":"Conversely","why":"「逆に」は反対の関係を示すが、後文は農家の窮状を受けた対応である。"},{"t":"For example","why":"政府の資金援助は、生産減少や返済困難そのものの具体例ではない。"},{"t":"Consequently","why":"正解。干ばつによる経済的な困難を原因として、政府が支援を導入した結果を示す。"},{"t":"Nevertheless","why":"農家の窮状に対する緊急援助は自然な対応であり、予想に反する展開ではない。"}],"answer":2,"point":"Consequently は、前文の状況が原因となって生じた結果や対応を導く。","drive":{"ja":"干ばつで農家が返済困難になった。その結果、政府は緊急援助を導入した。この因果関係を英語で表しましょう。","en":"Repeated droughts have reduced agricultural production across the region, leaving many farmers unable to repay their loans. Consequently, the government has introduced emergency financial assistance to prevent widespread bankruptcies in rural communities."},"level":2},{"id":"p1-connector-003","q":"When demand for rental housing rises while supply remains unchanged, rents generally increase throughout the affected area. ___, when demand falls while supply remains unchanged, landlords often lower rents to attract potential tenants.","q_ja":"賃貸住宅の供給が変わらないまま需要が増えると、通常、その地域全体で家賃が上がる。逆に、供給が変わらないまま需要が減ると、家主は入居希望者を引きつけるために家賃を下げることが多い。","choices":[{"t":"Consequently","why":"需要減少時の値下げは、需要増加時の値上げが引き起こす結果ではない。"},{"t":"Conversely","why":"正解。需要の増加と減少という逆の条件で、家賃も逆方向に動く関係を示す。"},{"t":"For instance","why":"需要減少時の値下げは、需要増加時の値上げの具体例ではない。"},{"t":"In other words","why":"後文は前文の言い換えではなく、逆の条件で起こることを述べている。"}],"answer":1,"point":"Conversely は、条件や関係を逆にした場合に成り立つ対照的な内容を導く。","drive":{"ja":"需要が増えると家賃は上がる。逆に、需要が減ると家賃は下がる。この逆の関係を英語で表しましょう。","en":"When demand for rental housing rises while supply remains unchanged, rents generally increase throughout the affected area. Conversely, when demand falls while supply remains unchanged, landlords often lower rents to attract potential tenants."},"level":2},{"id":"p1-connector-004","q":"Investing in public libraries gives residents free access to reliable information, regardless of their financial circumstances. ___, these institutions provide meeting spaces that encourage cooperation among local organizations working on social issues.","q_ja":"公共図書館への投資により、住民は経済状況にかかわらず信頼できる情報を無料で利用できる。さらに、図書館は社会問題に取り組む地域団体の協力を促す会合の場も提供する。","choices":[{"t":"Nevertheless","why":"会合の場の提供は、情報を無料で利用できることと対立する内容ではない。"},{"t":"In other words","why":"情報へのアクセスと団体間の協力は異なる利点であり、同じ内容の言い換えではない。"},{"t":"Conversely","why":"会合の場の提供は、情報へのアクセスという関係を逆にしたものではない。"},{"t":"Furthermore","why":"正解。情報へのアクセスに加えて、地域団体の協力という別の利点を追加している。"}],"answer":3,"point":"Furthermore は、同じ主張を支える別の理由や利点を「さらに」と追加する。","drive":{"ja":"公共図書館は情報を無料で提供する。さらに、地域団体の協力も促す。この利点の追加を英語で表しましょう。","en":"Investing in public libraries gives residents free access to reliable information, regardless of their financial circumstances. Furthermore, these institutions provide meeting spaces that encourage cooperation among local organizations working on social issues."},"level":1},{"id":"p1-connector-005","q":"The first proposal would finance the entire transport project through higher taxes on local businesses. ___, the second proposal would rely exclusively on payments from passengers using the new service.","q_ja":"第1案は、地元企業への増税で交通事業の費用全額を賄うというものだ。対照的に、第2案は新サービスを利用する乗客からの支払いのみに頼るというものだ。","choices":[{"t":"For example","why":"乗客の支払いによる財源確保は、企業への増税の具体例ではない。"},{"t":"Consequently","why":"第2案の財源は、第1案の増税が引き起こす結果として述べられていない。"},{"t":"In contrast","why":"正解。企業への課税と利用者からの徴収という、二つの案の財源の違いを示す。"},{"t":"Similarly","why":"二つの案は負担する主体が異なり、同じ方式を採るという説明にはならない。"}],"answer":2,"point":"In contrast は、比較する二つの対象の明確な違いを示す。","drive":{"ja":"第1案の財源は企業への課税だ。対照的に、第2案は乗客の支払いに頼る。この比較を英語で表しましょう。","en":"The first proposal would finance the entire transport project through higher taxes on local businesses. In contrast, the second proposal would rely exclusively on payments from passengers using the new service."},"level":1},{"id":"p1-connector-006","q":"The government should retain the national research program because its discoveries could improve future energy security. ___, its immediate costs are substantial, and taxpayers have legitimate concerns about the allocation of public funds. These concerns deserve careful scrutiny, but they do not outweigh the potential benefits of sustained scientific investment.","q_ja":"研究成果が将来のエネルギー安全保障を改善する可能性があるため、政府は国の研究計画を維持すべきだ。確かに当面の費用は多額で、納税者が公的資金の配分を懸念するのももっともだ。こうした懸念は慎重に検討すべきだが、継続的な科学への投資がもたらす潜在的な利益を上回るものではない。","choices":[{"t":"Admittedly","why":"正解。研究計画を支持する立場を保ちながら、反対側にも費用面で妥当な指摘があると認める。"},{"t":"Consequently","why":"将来の安全保障を改善し得ることが、多額の当面の費用を生む原因だとは述べられていない。"},{"t":"For instance","why":"多額の費用は、エネルギー安全保障を改善する研究成果の具体例ではない。"},{"t":"Similarly","why":"費用への懸念は、研究計画を維持すべき理由と同じ方向の内容ではない。"}],"answer":0,"point":"Admittedly は、自分の主張に不利でも認めるべき点を「確かに」と示す。","drive":{"ja":"研究計画は維持すべきだ。確かに費用への懸念はもっともだが、利益の方が大きい。この譲歩を英語で表しましょう。","en":"The government should retain the national research program because its discoveries could improve future energy security. Admittedly, its immediate costs are substantial, and taxpayers have legitimate concerns about the allocation of public funds. These concerns deserve careful scrutiny, but they do not outweigh the potential benefits of sustained scientific investment."},"level":3},{"id":"p1-connector-007","q":"Automated systems process routine benefit applications quickly, allowing public agencies to reduce delays for most applicants. ___, human officials must review unusual cases to prevent rigid rules from unfairly excluding eligible residents.","q_ja":"自動化システムは定型的な給付申請を迅速に処理し、行政機関は大半の申請者の待ち時間を短縮できる。とはいえ、硬直的な規則によって受給資格のある住民が不当に排除されないよう、例外的な事例は職員が審査しなければならない。","choices":[{"t":"For example","why":"職員による例外的な事例の審査は、自動処理が迅速であることの具体例ではない。"},{"t":"Consequently","why":"人による審査が必要なのは規則の硬直性を補うためであり、処理が速いことの結果ではない。"},{"t":"In other words","why":"自動化の効率と人による審査の必要性は、同じ内容の言い換えではない。"},{"t":"That said","why":"正解。自動化の利点を認めたうえで、人による審査が必要だという留保を加える。"}],"answer":3,"point":"That said は、直前の内容を受け入れながら「とはいえ」と留保や注意点を加える。","drive":{"ja":"自動化は給付申請の処理を速める。とはいえ、例外的な事例には職員の審査が必要だ。この留保を英語で表しましょう。","en":"Automated systems process routine benefit applications quickly, allowing public agencies to reduce delays for most applicants. That said, human officials must review unusual cases to prevent rigid rules from unfairly excluding eligible residents."},"level":3},{"id":"p1-connector-008","q":"The new trade agreement removed import duties on essential medical equipment previously subject to substantial taxes. ___, hospitals now pay less for these imports and have more funds available for patient care.","q_ja":"新たな貿易協定により、それまで高額の税が課されていた不可欠な医療機器の輸入関税が撤廃された。その結果、病院の輸入費用は下がり、患者のケアに使える資金が増えた。","choices":[{"t":"Conversely","why":"病院の費用減少は、関税撤廃と逆の関係ではなく、その効果である。"},{"t":"Consequently","why":"正解。関税の撤廃によって輸入費用が下がり、利用可能な資金が増えたという結果を示す。"},{"t":"Nevertheless","why":"関税撤廃後の費用減少は予想される効果であり、逆接にはならない。"},{"t":"For instance","why":"病院の資金増加は、撤廃された輸入関税の具体例ではなく、撤廃の結果である。"}],"answer":1,"point":"Consequently は、制度の変更が費用や資金に及ぼした結果を説明するときにも使う。","drive":{"ja":"医療機器の輸入関税が撤廃された。その結果、病院は患者のケアに回せる資金が増えた。この結果を英語で表しましょう。","en":"The new trade agreement removed import duties on essential medical equipment previously subject to substantial taxes. Consequently, hospitals now pay less for these imports and have more funds available for patient care."},"level":2},{"id":"p1-connector-009","q":"The coastal protection project exceeded its original budget, and independent engineers warned that its benefits had been overstated. ___, the council extended the project without revising its design or explaining how further spending would be justified.","q_ja":"海岸保護事業は当初の予算を超過し、独立した技術者たちは効果が過大評価されていると警告した。それにもかかわらず、議会は設計を見直さず、追加支出の正当性も説明しないまま事業を延長した。","choices":[{"t":"Nevertheless","why":"正解。費用超過と効果への警告にもかかわらず、見直さずに延長したという逆接を示す。"},{"t":"For example","why":"議会による事業延長は、効果が過大評価されていることの具体例として示されていない。"},{"t":"Similarly","why":"議会の対応は技術者の警告と同じ方向ではなく、警告を受けても方針を変えない対応である。"},{"t":"Consequently","why":"効果への警告が、設計を見直さない延長を合理的に引き起こすという因果関係にはならない。"}],"answer":0,"point":"Nevertheless は、問題点が示されても方針や行動が変わらない展開にも使える。","drive":{"ja":"海岸保護事業には費用と効果の問題が指摘された。それにもかかわらず、議会は見直さず延長した。この逆接を英語で表しましょう。","en":"The coastal protection project exceeded its original budget, and independent engineers warned that its benefits had been overstated. Nevertheless, the council extended the project without revising its design or explaining how further spending would be justified."},"level":2},{"id":"p1-connector-010","q":"Protecting wetlands preserves habitats for species whose survival depends on stable conditions within these increasingly threatened ecosystems. ___, wetlands absorb excess rainfall, reducing the risk of severe flooding in nearby residential areas.","q_ja":"湿地を保護することは、ますます脅かされる生態系の安定した環境に生存を依存する種の生息地を守ることになる。さらに、湿地は余分な雨水を吸収し、近隣の住宅地で深刻な洪水が起こる危険を減らす。","choices":[{"t":"In contrast","why":"雨水の吸収は生息地保全と対立する性質ではなく、湿地の別の有益な機能である。"},{"t":"In other words","why":"生息地の保全と洪水リスクの軽減は異なる効果であり、言い換えではない。"},{"t":"Furthermore","why":"正解。生物の保護という利点に、洪水リスクの軽減という追加の利点を重ねている。"},{"t":"Nevertheless","why":"雨水を吸収する機能は、種の生息地を保全するという説明に反する内容ではない。"}],"answer":2,"point":"Furthermore で別の利点を追加すると、政策を支持する理由を重ねて説明できる。","drive":{"ja":"湿地の保護は生物の生息地を守る。さらに、湿地は洪水の危険も減らす。この利点の追加を英語で表しましょう。","en":"Protecting wetlands preserves habitats for species whose survival depends on stable conditions within these increasingly threatened ecosystems. Furthermore, wetlands absorb excess rainfall, reducing the risk of severe flooding in nearby residential areas."},"level":2},{"id":"p1-connector-101","q":"The government reduced funding for public libraries, which rely heavily on this financial support. ___, several libraries had to shorten their opening hours to reduce their costs.","q_ja":"政府は公立図書館への資金を削減したが、図書館はこの財政支援に大きく依存している。その結果、いくつかの図書館は費用を削減するために開館時間を短縮せざるを得なかった。","choices":[{"t":"Furthermore","why":"「さらに」は情報を追加する語。ここでは資金削減によって生じた結果を示す。"},{"t":"Consequently","why":"正解。「その結果」という意味で、資金削減が原因となって開館時間が短縮されたことを示す。"},{"t":"In contrast","why":"「対照的に」は違いを示す語。ここでは二つの事柄を対比せず、原因と結果をつなぐ。"},{"t":"For instance","why":"「例えば」は具体例を示す語。開館時間の短縮は資金削減の例ではなく、その結果である。"}],"answer":1,"point":"Consequently は「その結果」。原因を述べた文の後で、それによって起きたことを示す。","level":1,"drive":{"ja":"政府は公立図書館への資金を削減したが、図書館はこの財政支援に大きく依存している。その結果、いくつかの図書館は費用を削減するために開館時間を短縮せざるを得なかった。","en":"The government reduced funding for public libraries, which rely heavily on this financial support. Consequently, several libraries had to shorten their opening hours to reduce their costs."}},{"id":"p1-connector-102","q":"Expanding public transport would require substantial funding at a time when budgets are tight. ___, the government should support the plan because it would improve access to jobs.","q_ja":"予算が厳しい時期に公共交通を拡充するには、多額の資金が必要となる。それでも、仕事に通いやすくなるため、政府はその計画を支援すべきだ。","choices":[{"t":"For instance","why":"「例えば」は具体例を示す語。後の文は資金が必要になる例ではなく、計画への賛成意見である。"},{"t":"Furthermore","why":"「さらに」は同じ方向の情報を追加する語。ここでは資金面の難点を認めたうえで、賛成意見を述べる。"},{"t":"Nevertheless","why":"正解。「それでも」という意味で、資金面の難点があっても計画を支援すべきだと述べる。"},{"t":"Consequently","why":"「その結果」は因果関係を示す語。資金が必要なことが、政府が支援すべき理由になっているわけではない。"}],"answer":2,"point":"Nevertheless は「それでも」。前の文で難点を認めた後に、それでも成り立つ主張を続ける。","level":1,"drive":{"ja":"予算が厳しい時期に公共交通を拡充するには、多額の資金が必要となる。それでも、仕事に通いやすくなるため、政府はその計画を支援すべきだ。","en":"Expanding public transport would require substantial funding at a time when budgets are tight. Nevertheless, the government should support the plan because it would improve access to jobs."}}],"error":[{"id":"p1-error-001","q":"再生可能エネルギー事業への公的投資は、輸入燃料への国の依存を徐々に減らしている。","q_ja":"日本語の意味に合う、文法・語法に誤りのない英文を選ぶ。","choices":[{"t":"Public investment in renewable energy projects are gradually reducing the country’s dependence on imported fuels.","why":"主語の中心は単数扱いの investment なので are を is にする。"},{"t":"Public funding for renewable energy projects is gradually reducing the country’s dependent on imported fuels.","why":"所有格の後には形容詞 dependent ではなく名詞 dependence が必要。"},{"t":"Public investment in renewable energy projects is gradually reducing the country’s dependence on imported fuels.","why":"正解。主語 investment に is が対応し、dependence on の語法も正しい。"},{"t":"Public funding for renewable energy projects is gradually reducing the country’s dependence of imported fuels.","why":"依存の対象には dependence on を使うため of を on にする。"},{"t":"Publ
