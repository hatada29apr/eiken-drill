:"結論を短くまとめるときは To sum up, の後に自分の意見を置く。","level":1,"drive":{"ja":"要するに、都市はバスのサービスを改善すべきだと私は考えます。結論をまとめる文です。","en":"To sum up, I believe cities should improve their bus services."},"explain":"I believeの目的語は、都市への提案を述べる節。To sum upは文全体をまとめる合図で、本論を受けて主張を再提示する結論に使える。別の言い方: In summary"},{"id":"g2-template-204","q":"Taking these reasons into ___, I believe local schools should give students more chances to learn outdoors.","q_ja":"これらの理由を考慮に入れると、地域の学校は生徒に屋外で学ぶ機会をもっと与えるべきだと私は考えます。","choices":[{"t":"attention","why":"注意を表す名詞だが、take ... into attention という組み合わせにはしない。"},{"t":"notice","why":"気づくことに関係する名詞だが、「考慮に入れる」は take ... into notice ではない。"},{"t":"account","why":"正解。take ... into account で「〜を考慮に入れる」となり、理由を踏まえた結論を示せる。"},{"t":"concern","why":"関心や心配を表す名詞だが、take ... into concern はこの意味の定型表現ではない。"}],"answer":2,"point":"Taking these reasons into account, ... は、挙げた理由を考慮して結論を述べる型。","level":3,"drive":{"ja":"これらの理由を考慮に入れると、地域の学校は生徒に屋外で学ぶ機会をもっと与えるべきだと私は考えます。理由を踏まえた結論の文です。","en":"Taking these reasons into account, I believe local schools should give students more chances to learn outdoors."},"explain":"冒頭の分詞句は、主語Iが理由を考慮することを示す。take A into accountで判断の根拠を示し、結論を本論につなげる。別の言い方: consider these reasons"},{"id":"g2-template-205","q":"I am in ___ of allowing more employees to work from home.","q_ja":"私は、より多くの従業員に在宅勤務を認めることに賛成です。","choices":[{"t":"preference","why":"好みを表す名詞。in preference to という形はあるが、in preference of で賛成は表せない。"},{"t":"agreement","why":"同意を表す名詞だが、in agreement with の形で使い、ここでは of と結びつかない。"},{"t":"choice","why":"選択を表す名詞。in choice of は、提案への賛成を示す表現ではない。"},{"t":"favor","why":"正解。be in favor of の後に動名詞を置くと、その行動への賛成を表せる。"}],"answer":3,"point":"序論で賛成を示す型は I am in favor of ...。of の後には名詞や動名詞を置く。","level":2,"drive":{"ja":"私は、より多くの従業員に在宅勤務を認めることに賛成です。序論で賛成の立場を示す文です。","en":"I am in favor of allowing more employees to work from home."},"explain":"主語Iにamが続き、ofの後の動名詞句が賛成の対象を表す。allow＋人＋to不定詞で認める行動を具体化し、提案への立場を明確にできる。別の言い方: support"},{"id":"g2-template-206","q":"In ___, I believe schools should give students more time for exercise.","q_ja":"結論として、学校は生徒に運動する時間をもっと与えるべきだと私は考えます。","choices":[{"t":"decision","why":"決定を表す名詞だが、in decision で「結論として」という書き出しにはならない。"},{"t":"conclusion","why":"正解。in conclusion は、結論の段落を始める定型表現。"},{"t":"comparison","why":"in comparison は比較を示す表現で、結論を述べるという指定に合わない。"},{"t":"discussion","why":"議論を表す名詞だが、in discussion は結論の開始を示す表現ではない。"}],"answer":1,"point":"結論の段落は In conclusion, I believe ... と始められる。","level":1,"drive":{"ja":"結論として、学校は生徒に運動する時間をもっと与えるべきだと私は考えます。結論の段落の書き出しです。","en":"In conclusion, I believe schools should give students more time for exercise."},"explain":"I believeに続く節で、schoolsを主語に提案を述べる。In conclusionは議論の終わりを示し、理由を述べ終えた後の主張の確認に使える。別の言い方: To conclude"},{"id":"g2-template-207","q":"I have ___ to the conclusion that schools should offer more practical lessons on managing money.","q_ja":"私は、学校はお金の管理について実用的な授業をもっと行うべきだという結論に至りました。","choices":[{"t":"come","why":"正解。have come to the conclusion that ... で「〜という結論に至った」と言える。"},{"t":"gone","why":"移動を表す過去分詞だが、結論に至ることを表す come to the conclusion の come とは置き換えない。"},{"t":"arrived","why":"結論に至る意味で arrive を使う場合は arrive at a conclusion とし、to は使わない。"},{"t":"reached","why":"reach a conclusion は使えるが、reach はこの意味では直後に目的語を取り、to を置かない。"}],"answer":0,"point":"結論に至ったと述べる型は have come to the conclusion that ...。come to・arrive at・reach の形を区別する。","level":3,"drive":{"ja":"私は、学校はお金の管理について実用的な授業をもっと行うべきだという結論に至りました。考えをまとめた結論の文です。","en":"I have come to the conclusion that schools should offer more practical lessons on managing money."},"explain":"主語Iに現在完了が続き、that節が結論の内容を示す。have comeで検討を経た今の判断を表し、論述を締めくくれる。別の言い方: have reached the conclusion that"},{"id":"g2-template-208","q":"For the reasons mentioned ___, I firmly believe towns should create more safe places for cycling.","q_ja":"以上に述べた理由から、町は自転車で安全に走れる場所をもっと整備すべきだと私は強く考えます。","choices":[{"t":"below","why":"「下に」という副詞。これから下に書く内容を指すため、既に述べた理由を振り返る結論に合わない。"},{"t":"ahead","why":"「前方に、先に」という副詞だが、mentioned ahead で文章の上で述べた理由は指せない。"},{"t":"above","why":"正解。the reasons mentioned above は「以上に述べた理由」で、本文を受けた結論に使える。"},{"t":"abroad","why":"「海外で」という副詞。場所を示す語で、文章内で先に述べた理由を指す働きはない。"}],"answer":2,"point":"For the reasons mentioned above, ... は、本論で述べた理由を受けて結論を導く型。","level":2,"drive":{"ja":"以上に述べた理由から、町は自転車で安全に走れる場所をもっと整備すべきだと私は強く考えます。本論の理由を振り返る結論です。","en":"For the reasons mentioned above, I firmly believe towns should create more safe places for cycling."},"explain":"冒頭のFor句が判断の理由を示し、I believeの後の節が主張を表す。mentioned aboveがreasonsを後ろから修飾し、本論の根拠を結論で受け直せる。別の言い方: stated earlier"},{"id":"g2-template-209","q":"As ___ as I am concerned, schools should teach children about recycling.","q_ja":"私の考えでは、学校は子どもたちにリサイクルについて教えるべきです。","choices":[{"t":"long","why":"as long as は条件などを示す表現で、自分の意見を導くこの型には合わない。"},{"t":"far","why":"正解。as far as I am concerned は「私の考えでは」という意見表明の定型表現。"},{"t":"soon","why":"as soon as は「〜するとすぐに」と時を示し、自分の立場を導く表現ではない。"},{"t":"much","why":"程度を表す副詞だが、as much as I am concerned はこの意見表明の定型表現ではない。"}],"answer":1,"point":"序論で自分の意見を示す As far as I am concerned, ... をひとまとまりで覚える。","level":1,"drive":{"ja":"私の考えでは、学校は子どもたちにリサイクルについて教えるべきです。自分の意見を示す序論の文です。","en":"As far as I am concerned, schools should teach children about recycling."},"explain":"冒頭の節が意見の範囲を示し、主節はschoolsが主語でshould teachが提案を表す。As far as I am concernedで自分の見解だと明示できる。別の言い方: In my view"},{"id":"g2-template-210","q":"In ___ of these points, I firmly believe schools should provide more opportunities for outdoor learning.","q_ja":"これらの点を踏まえ、学校は屋外で学ぶ機会をもっと提供すべきだと私は強く考えます。","choices":[{"t":"sight","why":"視覚に関係する名詞だが、in sight of は見える範囲を示し、論点を踏まえるという意味にはならない。"},{"t":"picture","why":"状況や全体像を表すこともある名詞だが、in picture of という形で理由を踏まえた結論は導けない。"},{"t":"vision","why":"見通しや構想を表す名詞だが、in vision of は「〜を踏まえて」という定型表現にはならない。"},{"t":"light","why":"正解。in light of は「〜を踏まえて」という意味で、述べた点から結論を導ける。"}],"answer":3,"point":"In light of these points, ... は、挙げた論点を踏まえて最終的な意見を述べる型。","level":3,"drive":{"ja":"これらの点を踏まえ、学校は屋外で学ぶ機会をもっと提供すべきだと私は強く考えます。論点を踏まえた結論の文です。","en":"In light of these points, I firmly believe schools should provide more opportunities for outdoor learning."},"explain":"冒頭の前置詞句が判断の根拠を示し、I believeに続く節が主張を表す。in light ofで本論の論点を結論につなぎ、firmlyで確信を強める。別の言い方: considering these points"},{"id":"g2-template-211","q":"There are two main reasons ___ this view.","q_ja":"この意見には主な理由が二つあります。","choices":[{"t":"with","why":"一緒にという意味で、この意見を支える理由を示す形にはならない。"},{"t":"for","why":"正解。reasons for this view で、この意見を支持する理由を表す。"},{"t":"from","why":"理由の出所ではなく、どの意見を支える理由かを示すので使わない。"},{"t":"at","why":"場所や時点を示す語で、この意見を支持する理由という意味にならない。"}],"answer":1,"point":"序論で理由を予告するときは There are two main reasons for this view. を使う。","level":1,"drive":{"ja":"この意見には主な理由が二つあります。","en":"There are two main reasons for this view."},"explain":"There are＋複数名詞で理由の存在を述べ、for以下で対象の意見を示します。two main reasonsで論述の柱を予告し、本文の構成を伝えます。別の言い方: two key reasons"},{"id":"g2-template-212","q":"I ___ believe that communities should provide more places for children to play.","q_ja":"私は、地域は子どもが遊べる場所をもっと提供すべきだと固く信じています。","choices":[{"t":"tightly","why":"物をきつく結ぶ場合などに使い、信念の強さを表す believe とは組み合わせない。"},{"t":"firmly","why":"正解。firmly believe that で「〜だと固く信じる」を表す。"},{"t":"securely","why":"安全に固定する様子などを表し、固く信じるという定型表現には使わない。"},{"t":"steadily","why":"着実に進む様子を表し、ここで述べる信念の強さを表す語ではない。"}],"answer":1,"point":"序論で立場を明確にする表現は I firmly believe that ...。","level":2,"drive":{"ja":"私は、地域は子どもが遊べる場所をもっと提供すべきだと固く信じています。","en":"I firmly believe that communities should provide more places for children to play."},"explain":"主語I＋動詞believeに、信じる内容を表すthat節が続きます。firmlyで確信を強調し、shouldで地域への提言を示すため、序論の立場表明に使えます。別の言い方: strongly believe"},{"id":"g2-template-213","q":"To ___ up, schools should teach children about recycling.","q_ja":"要するに、学校は子どもにリサイクルについて教えるべきです。","choices":[{"t":"sum","why":"正解。To sum up は結論をまとめる「要するに」という定型表現。"},{"t":"count","why":"数を数える動詞で、count up は意見の結論を導く定型表現ではない。"},{"t":"add","why":"add up は数値を合計する場合などに使い、この結論を導く表現にはならない。"},{"t":"total","why":"合計するという動詞だが、この位置で結論をまとめる定型表現にはならない。"}],"answer":0,"point":"結論の冒頭で全体をまとめるときは To sum up, ... を使う。","level":1,"drive":{"ja":"要するに、学校は子どもにリサイクルについて教えるべきです。","en":"To sum up, schools should teach children about recycling."},"explain":"To sum upが全体をまとめ、主節はschools＋should teachで提言します。teach＋人＋about＋話題で教える内容を示し、論述の結論を具体化できます。別の言い方: In summary"},{"id":"g2-template-214","q":"In ___ of these points, I believe that schools should limit students' smartphone use during the school day.","q_ja":"これらの点を踏まえ、私は学校が授業日の校内で生徒のスマートフォン使用を制限すべきだと考えます。","choices":[{"t":"sight","why":"sight は視界を表す名詞で、in sight of は論点を踏まえるという定型表現ではない。"},{"t":"focus","why":"focus は焦点を表す名詞だが、in focus of という形で判断の根拠を示すことはできない。"},{"t":"light","why":"正解。in light of で「〜を踏まえて」を表し、述べた論点から結論を導く。"},{"t":"shade","why":"shade は日陰などを表す名詞で、論点を踏まえるという意味にはならない。"}],"answer":2,"point":"結論で論点を踏まえて判断するときは In light of these points, ... を使う。","level":3,"drive":{"ja":"これらの点を踏まえ、私は学校が授業日の校内で生徒のスマートフォン使用を制限すべきだと考えます。","en":"In light of these points, I believe that schools should limit students' smartphone use during the school day."},"explain":"冒頭の前置詞句が判断の根拠を示し、I believeのthat節で主張します。in light ofで本文の論点と結論を結び、制限すべきだという提言に説得力を持たせます。別の言い方: considering these points"},{"id":"g2-template-215","q":"For the reasons ___ above, I believe towns should protect local parks.","q_ja":"上で述べた理由から、私は町が地域の公園を守るべきだと考えます。","choices":[{"t":"spoken","why":"speak はここで reasons を直接目的語に取る形にはならず、spoken above では不自然。"},{"t":"referred","why":"refer は refer to の形が必要で、referred above だけでは理由を修飾できない。"},{"t":"told","why":"tell はこの形で理由を述べることを表さず、the reasons told above は不自然。"},{"t":"mentioned","why":"正解。the reasons mentioned above で「上で述べた理由」を表す。"}],"answer":3,"point":"For the reasons mentioned above, ... で、本文の理由を受けて結論を述べる。","level":2,"drive":{"ja":"上で述べた理由から、私は町が地域の公園を守るべきだと考えます。","en":"For the reasons mentioned above, I believe towns should protect local parks."},"explain":"For以下が根拠を示し、I believeの後にthatを省いた内容節が続きます。mentioned aboveはreasonsを後ろから修飾し、既述の理由を結論で受け直せます。別の言い方: for these reasons"},{"id":"g2-template-216","q":"In ___, local libraries should stay open on weekends.","q_ja":"結論として、地域の図書館は週末も開館すべきです。","choices":[{"t":"decision","why":"意思決定を表す名詞だが、in decision は結論を導く定型表現ではない。"},{"t":"discussion","why":"議論を表す名詞だが、in discussion は文章を締めくくる表現ではない。"},{"t":"solution","why":"解決策を表す名詞だが、in solution は結論を導く定型表現ではない。"},{"t":"conclusion","why":"正解。In conclusion は「結論として」という意味で、結論の冒頭に使う。"}],"answer":3,"point":"結論を示す基本の表現は In conclusion, ...。","level":1,"drive":{"ja":"結論として、地域の図書館は週末も開館すべきです。","en":"In conclusion, local libraries should stay open on weekends."},"explain":"In conclusionが結論を導き、主節はlocal libraries＋should stayです。stay＋形容詞で状態の継続を表し、openにより開館継続の提言を明確にします。別の言い方: remain open"},{"id":"g2-template-217","q":"Taking these points into ___, I believe that companies should offer employees more flexible working hours.","q_ja":"これらの点を考慮すると、私は企業が従業員により柔軟な勤務時間を提供すべきだと考えます。","choices":[{"t":"account","why":"正解。take ... into account で「〜を考慮する」を表す。"},{"t":"record","why":"record は記録を表す名詞だが、take ... into record は考慮するという定型表現ではない。"},{"t":"report","why":"report は報告を表す名詞だが、take ... into report という形で考慮するとは言わない。"},{"t":"detail","why":"detail は詳細を表す名詞だが、take ... into detail は考慮するという意味にはならない。"}],"answer":0,"point":"Taking these points into account, ... で、論点を考慮した結論を導く。","level":3,"drive":{"ja":"これらの点を考慮すると、私は企業が従業員により柔軟な勤務時間を提供すべきだと考えます。","en":"Taking these points into account, I believe that companies should offer employees more flexible working hours."},"explain":"冒頭は主語Iの行為を表す分詞構文で、that節が信じる内容です。take A into accountで論点の考慮を示し、本文を踏まえた提言につなげます。別の言い方: consider these points"},{"id":"g2-template-218","q":"I would like to ___ two reasons why schools should serve healthier lunches.","q_ja":"私は、学校がより健康的な給食を出すべき理由を二つ挙げたいと思います。","choices":[{"t":"send","why":"送るという動詞で、この序論で理由を挙げるという言い方にはならない。"},{"t":"hand","why":"手渡すという動詞で、この形では理由を挙げることを表せない。"},{"t":"give","why":"正解。give two reasons で「理由を二つ挙げる」を表す。"},{"t":"pass","why":"渡すという動詞だが、pass two reasons は理由を挙げるという定型表現ではない。"}],"answer":2,"point":"序論で理由を予告するときは I would like to give two reasons why ... を使う。","level":2,"drive":{"ja":"私は、学校がより健康的な給食を出すべき理由を二つ挙げたいと思います。","en":"I would like to give two reasons why schools should serve healthier lunches."},"explain":"Iが主語で、why節がreasonsの内容を説明します。would like to giveで丁寧に提示を予告し、two reasonsで論述の構成を示します。別の言い方: present two reasons"},{"id":"g2-template-219","q":"I ___ with the idea that towns should plant more trees.","q_ja":"私は、町がもっと木を植えるべきだという考えに賛成です。","choices":[{"t":"approve","why":"賛成する意味では approve of とし、approve with the idea とは言わない。"},{"t":"agree","why":"正解。agree with the idea that ... で「〜という考えに賛成する」を表す。"},{"t":"accept","why":"考えを受け入れるなら accept the idea とし、with は付けない。"},{"t":"support","why":"考えを支持するなら support the idea とし、with は付けない。"}],"answer":1,"point":"序論で賛成を表すときは I agree with the idea that ... を使う。","level":1,"drive":{"ja":"私は、町がもっと木を植えるべきだという考えに賛成です。","en":"I agree with the idea that towns should plant more trees."},"explain":"主語I＋動詞agreeにwithが続き、that節がideaの内容を示します。agree with＋考えで賛成の対象を明示し、序論で自分の立場を伝えられます。別の言い方: support the idea"},{"id":"g2-template-220","q":"On the ___ of these points, I believe schools should encourage students to use public transportation more often.","q_ja":"これらの点に基づき、私は学校が生徒に公共交通機関をもっと利用するよう促すべきだと考えます。","choices":[{"t":"cause","why":"原因を表す名詞だが、on the cause of は判断の根拠を示す定型表現ではない。"},{"t":"purpose","why":"目的を表す名詞だが、on the purpose of は論点を根拠にするという意味にならない。"},{"t":"source","why":"出所を表す名詞だが、on the source of は判断の根拠を示す定型表現ではない。"},{"t":"basis","why":"正解。on the basis of で「〜に基づいて」を表し、結論の根拠を示す。"}],"answer":3,"point":"On the basis of these points, ... で、述べた論点を根拠に結論を示す。","level":3,"drive":{"ja":"これらの点に基づき、私は学校が生徒に公共交通機関をもっと利用するよう促すべきだと考えます。","en":"On the basis of these points, I believe schools should encourage students to use public transportation more often."},"explain":"冒頭の前置詞句が根拠を示し、I believeの後の節が主張です。encourage＋人＋to不定詞で促す行動を示し、結論の提言を具体化できます。別の言い方: based on these points"}],"vocab_ej":[{"id":"g2-vocab_ej-001","q":"Using both sides of paper helps schools [[save]] money.","q_ja":"紙の両面を使うことは、学校がお金を節約するのに役立つ。","choices":[{"t":"〜を借りる","why":"借りることではなく、紙に使うお金を少なくすることを表している。"},{"t":"〜を節約する","why":"正解。save money は、使うお金を少なくするという意味。"},{"t":"〜を寄付する","why":"寄付する相手は示されておらず、紙の使用による支出の話である。"},{"t":"〜を使い切る","why":"使い切るという意味ではなく、支出を抑えるという意味である。"}],"answer":1,"point":"save money は「お金を節約する」。save は文脈によって「救う」とも訳す。","level":1,"accept":["節約する","お金を節約する","支出を抑える","〜を節約する"],"drive":{"ja":"紙の両面を使うことは、学校がお金を節約するのに役立つ。","en":"Using both sides of paper helps schools save money."},"explain":"Using both sides of paperという動名詞句が主語で、helpsが動詞となる。help＋人＋動詞の原形の形で、紙の両面利用が学校の節約に役立つことを表す。別の言い方: Using both sides of paper helps schools reduce their spending."},{"id":"g2-vocab_ej-002","q":"Schools should [[encourage]] students to discuss local environmental problems and suggest possible solutions.","q_ja":"学校は、生徒が地域の環境問題について話し合い、考えられる解決策を提案するよう促すべきだ。","choices":[{"t":"〜に説明する","why":"encourage は、情報を説明することではなく、行動を促すことを表す。"},{"t":"〜に許可する","why":"単に行動を許す意味ではなく、積極的に行動を促す意味である。"},{"t":"〜に命令する","why":"encourage は、命令によって従わせるという意味ではない。"},{"t":"〜に勧める","why":"正解。encourage 人 to do は、人にある行動をするよう促すという意味。"}],"answer":3,"point":"encourage 人 to do は「人に〜するよう促す・勧める」。","level":2,"accept":["奨励する","促す","勧める","〜するよう促す","〜に勧める"],"drive":{"ja":"学校は、生徒が地域の環境問題について話し合い、考えられる解決策を提案するよう促すべきだ。","en":"Schools should encourage students to discuss local environmental problems and suggest possible solutions."},"explain":"Schoolsが主語で、should encourage students to doは学校が生徒の行動を促すべきだという提言を表す。to以下ではdiscussとsuggestをandで結び、話し合いと解決策の提案を並べる。別の言い方: Schools should encourage students to talk about local environmental problems and propose possible solutions."},{"id":"g2-vocab_ej-003","q":"Long working hours [[account for]] much of the difference in sleep time between these two groups.","q_ja":"長時間労働が、この2つの集団の睡眠時間の差の大きな原因となっている。","choices":[{"t":"〜の原因となる","why":"正解。睡眠時間の差が生じる理由を述べており、原因となるという意味である。"},{"t":"〜の割合を占める","why":"account for の別の意味だが、この文は全体に対する構成比を述べていない。"},{"t":"〜を考慮に入れる","why":"これは take into account の意味で、account for のこの用法とは異なる。"},{"t":"〜の責任を負う","why":"この文は責任の所在ではなく、睡眠時間の差が生じる原因を説明している。"}],"answer":0,"point":"account for は、差や変化の理由を述べるとき「〜の原因となる・〜を説明する」。","level":3,"accept":["原因となる","〜の原因になる","原因になる","〜を説明する","説明する"],"drive":{"ja":"長時間労働が、この2つの集団の睡眠時間の差の大きな原因となっている。","en":"Long working hours account for much of the difference in sleep time between these two groups."},"explain":"Long working hoursが主語で、account forは原因となる、または説明するという意味。much of the difference in sleep time between these two groupsが目的語となり、二集団の睡眠時間差の大きな部分を指す。別の言い方: Long working hours explain much of the difference in sleep time between these two groups."},{"id":"g2-vocab_ej-004","q":"Regular exercise can [[improve]] the health of office workers.","q_ja":"定期的な運動は、オフィスで働く人たちの健康状態を改善できる。","choices":[{"t":"〜を調査する","why":"運動で健康を調べるという意味ではなく、健康状態をよくするという意味である。"},{"t":"〜を維持する","why":"維持するは同じ状態を保つことで、improve が表す改善とは異なる。"},{"t":"〜を改善する","why":"正解。improve は、状態や質を今よりよくするという意味。"},{"t":"〜を悪化させる","why":"悪化させるは、状態をよくする improve とは反対の意味である。"}],"answer":2,"point":"improve は「〜を改善する」。健康・技術・サービスなどをよくするときに使う。","level":1,"accept":["改善する","よくする","良くする","向上させる","〜をよくする"],"drive":{"ja":"定期的な運動は、オフィスで働く人たちの健康状態を改善できる。","en":"Regular exercise can improve the health of office workers."},"explain":"Regular exerciseが主語で、can improveは改善できるという可能な効果を表す。the health of office workersが改善の対象となる。別の言い方: Regular exercise can make office workers healthier."},{"id":"g2-vocab_ej-005","q":"Online courses are [[available]] to people who cannot travel to a college every day.","q_ja":"オンライン講座は、毎日大学に通えない人も利用できる。","choices":[{"t":"利用できる","why":"正解。available は、ここでは講座を利用できることを表す。"},{"t":"費用がかかる","why":"受講費用の有無は述べられておらず、利用できるかどうかを表している。"},{"t":"人気がある","why":"人気の高さではなく、対象の人が講座を利用できることを表している。"},{"t":"受講が必要な","why":"利用できることと、受講する必要があることは異なる。"}],"answer":0,"point":"available to 人 は「人が利用できる」。available には「手が空いている」という意味もある。","level":2,"accept":["利用可能な","利用可能","受講できる","利用することができる"],"drive":{"ja":"オンライン講座は、毎日大学に通えない人も利用できる。","en":"Online courses are available to people who cannot travel to a college every day."},"explain":"Online coursesが主語で、are available toは人が利用できるという状態を表す。who cannot travel to a college every dayがpeopleを修飾し、利用者を毎日大学に通えない人に限定する。別の言い方: Online courses can be used by people who cannot travel to a college every day."},{"id":"g2-vocab_ej-006","q":"Small businesses cannot [[afford]] to close for a week while workers attend training courses in another city.","q_ja":"小規模な企業には、従業員が別の都市で研修を受ける間、1週間休業する余裕はない。","choices":[{"t":"〜する義務がある","why":"afford は義務を表さず、時間や費用などの余裕があることを表す。"},{"t":"〜する予定がある","why":"休業の予定ではなく、休業による負担に耐える余裕の有無を述べている。"},{"t":"〜する権利がある","why":"休業する権利についてではなく、事業上の余裕について述べている。"},{"t":"〜する余裕がある","why":"正解。cannot afford to do は、費用や時間などの面で〜する余裕がないという意味。"}],"answer":3,"point":"afford to do は「〜する余裕がある」。金銭だけでなく、時間や事業への影響にも使う。","level":2,"accept":["余裕がある","〜するだけの余裕がある","する余裕がある","経済的な余裕がある"],"drive":{"ja":"小規模な企業には、従業員が別の都市で研修を受ける間、1週間休業する余裕はない。","en":"Small businesses cannot afford to close for a week while workers attend training courses in another city."},"explain":"Small businessesが主語で、cannot afford to close for a weekは1週間休業する余裕がないことを表す。while節は従業員が別の都市で研修を受ける期間を示す。別の言い方: Small businesses do not have the resources to close for a week while workers attend training courses in another city."},{"id":"g2-vocab_ej-007","q":"Local shops [[support]] the community by creating jobs nearby.","q_ja":"地元の店は、近くに雇用を生み出すことで地域社会を支えている。","choices":[{"t":"〜を調べる","why":"雇用を生み出すことが地域の調査になるという意味ではない。"},{"t":"〜を支える","why":"正解。support は、ここでは雇用を通じて地域社会を支えるという意味。"},{"t":"〜を訪れる","why":"地域に足を運ぶことではなく、地域の役に立つことを表している。"},{"t":"〜を管理する","why":"店が地域社会を管理しているとは述べていない。"}],"answer":1,"point":"support は「〜を支える・援助する」。地域や人への助けを述べるときに使う。","level":1,"accept":["支える","支援する","〜を支援する","援助する","〜を援助する"],"drive":{"ja":"地元の店は、近くに雇用を生み出すことで地域社会を支えている。","en":"Local shops support the community by creating jobs nearby."},"explain":"Local shopsが主語、supportが動詞、the communityが目的語となる。by creating jobs nearbyは、近くに雇用を生み出すことが地域を支える手段であると示す。別の言い方: Local shops help the community by creating jobs nearby."},{"id":"g2-vocab_ej-008","q":"Some schools plan to [[replace]] printed textbooks with digital versions to lighten students' bags.","q_ja":"一部の学校は、生徒のかばんを軽くするため、紙の教科書をデジタル版に置き換える計画を立てている。","choices":[{"t":"〜を配布する","why":"教科書を配ることではなく、紙のものからデジタル版へ切り替えることを表している。"},{"t":"〜を比較する","why":"紙とデジタルを比較するという意味ではなく、一方を他方に替えるという意味。"},{"t":"〜を置き換える","why":"正解。replace A with B は、AをBに置き換えるという意味。"},{"t":"〜を元に戻す","why":"re が付いていても、replace はここでは元の状態に戻すという意味ではない。"}],"answer":2,"point":"replace A with B は「AをBに置き換える」。AとBの順番に注意する。","level":2,"accept":["置き換える","取り替える","〜を取り替える","交換する","〜を交換する"],"drive":{"ja":"一部の学校は、生徒のかばんを軽くするため、紙の教科書をデジタル版に置き換える計画を立てている。","en":"Some schools plan to replace printed textbooks with digital versions to lighten students' bags."},"explain":"Some schoolsが主語で、plan to replaceは置き換える計画を表す。replace A with BはAをBに替える形で、最後のto lighten students' bagsがその目的を示す。別の言い方: Some schools plan to swap printed textbooks for digital versions to make students' bags lighter."},{"id":"g2-vocab_ej-009","q":"Before changing bus routes, local officials should [[carry out]] a survey of residents who use public transportation regularly.","q_ja":"バスの路線を変更する前に、自治体の職員は公共交通機関を定期的に利用する住民を対象に調査を実施すべきだ。","choices":[{"t":"〜を計画する","why":"調査を計画する段階ではなく、実際に行うことを表している。"},{"t":"〜を実施する","why":"正解。carry out a survey は、調査を実際に行うという意味。"},{"t":"〜を延期する","why":"調査を後に延ばすという意味ではなく、路線変更の前に行うという意味である。"},{"t":"〜を引き継ぐ","why":"調査を他者から引き継ぐとは述べておらず、carry out は実施するという意味。"}],"answer":1,"point":"carry out は「〜を実施する・遂行する」。調査や計画などを実行に移すときに使う。","level":2,"accept":["実施する","行う","〜を行う","実行する","〜を実行する","遂行する"],"drive":{"ja":"バスの路線を変更する前に、自治体の職員は公共交通機関を定期的に利用する住民を対象に調査を実施すべきだ。","en":"Before changing bus routes, local officials should carry out a survey of residents who use public transportation regularly."},"explain":"Before changing bus routesが調査を行う時期を示し、local officials should carry outが自治体職員への提言を表す。who use public transportation regularlyはresidentsを修飾し、調査対象を限定する。別の言い方: Before changing bus routes, local officials should conduct a survey of residents who use public transportation regularly."},{"id":"g2-vocab_ej-010","q":"Leaving lights on in empty classrooms can [[waste]] electricity.","q_ja":"誰もいない教室で照明をつけたままにすると、電気を無駄にすることがある。","choices":[{"t":"〜を蓄える","why":"照明をつけたままにしても、電気を蓄えることにはならない。"},{"t":"〜を生み出す","why":"照明は電気を使うものであり、ここでは電気を生み出すという意味ではない。"},{"t":"〜を無駄にする","why":"正解。waste は、必要のないことに資源などを使ってしまうという意味。"},{"t":"〜を有効に使う","why":"誰もいない教室の照明について述べており、有効に使うとは反対の意味である。"}],"answer":2,"point":"動詞の waste は「〜を無駄にする」。電気・水・時間・お金などに使う。","level":1,"accept":["無駄にする","むだにする","浪費する","〜を浪費する","〜をむだにする"],"drive":{"ja":"誰もいない教室で照明をつけたままにすると、電気を無駄にすることがある。","en":"Leaving lights on in empty classrooms can waste electricity."},"explain":"Leaving lights on in empty classroomsという動名詞句が主語で、leave＋物＋onは電源が入ったままにすることを表す。can waste electricityは、その行為が電気の浪費につながり得ることを示す。別の言い方: Electricity can be wasted by leaving lights on in empty classrooms."},{"id":"g2-vocab_ej-011","q":"Clear instructions help workers [[avoid]] mistakes when they use a new machine for the first time.","q_ja":"明確な説明は、従業員が新しい機械を初めて使う際に間違いを避けるのに役立つ。","choices":[{"t":"〜を見つける","why":"間違いを見つけることではなく、間違いが起きないようにすることを表している。"},{"t":"〜を訂正する","why":"すでに起きた間違いを直すのではなく、間違いを避けるという意味である。"},{"t":"〜を受け入れる","why":"間違いを認めることではなく、間違いをしないようにすることを表している。"},{"t":"〜を避ける","why":"正解。avoid mistakes は、間違いをしないようにするという意味。"}],"answer":3,"point":"avoid は「〜を避ける」。後ろには名詞か動名詞を置く。","level":2,"accept":["避ける","回避する","〜を回避する","〜をしないようにする","しないようにする"],"drive":{"ja":"明確な説明は、従業員が新しい機械を初めて使う際に間違いを避けるのに役立つ。","en":"Clear instructions help workers avoid mistakes when they use a new machine for the first time."},"explain":"Clear instructionsが主語で、help workers avoid mistakesは従業員が間違いを避けるのに役立つことを表す。when節は、新しい機械を初めて使う場面を示す。別の言い方: Clear instructions help workers avoid making mistakes when they use a new machine for the first time."},{"id":"g2-vocab_ej-012","q":"People [[tend to]] walk more when shops and public facilities are within walking distance of their homes.","q_ja":"店や公共施設が自宅から歩いて行ける距離にあると、人々はより多く歩く傾向がある。","choices":[{"t":"〜する傾向がある","why":"正解。tend to do は、ある行動や状態になりやすいという一般的な傾向を表す。"},{"t":"〜する予定である","why":"個々の人の予定ではなく、周囲の環境による一般的な傾向を述べている。"},{"t":"〜する必要がある","why":"歩く必要性や義務ではなく、歩く量が増えやすいという傾向を表している。"},{"t":"〜するつもりである","why":"これは intend to に近い意味であり、tend to は意図を表さない。"}],"answer":0,"point":"tend to do は「〜する傾向がある」。意図を表す intend to do と区別する。","level":2,"accept":["傾向がある","〜しがちである","しがちである","〜することが多い","する傾向がある"],"drive":{"ja":"店や公共施設が自宅から歩いて行ける距離にあると、人々はより多く歩く傾向がある。","en":"People tend to walk more when shops and public facilities are within walking distance of their homes."},"explain":"Peopleが主語で、tend to walk moreはより多く歩く傾向を表す。when節は、店や公共施設が自宅から歩ける距離にあるという条件を示す。別の言い方: People generally walk more when shops and public facilities are within walking distance of their homes."},{"id":"g2-vocab_ej-201","q":"Buying [[local]] food helps farmers in the same area.","q_ja":"地元の食べ物を買うことは、同じ地域の農家の助けになる。","choices":[{"t":"全国の","why":"全国という広い範囲ではなく、同じ地域を指す。"},{"t":"地元の","why":"正解。local は、その土地や地域に関係することを表す。"},{"t":"個人の","why":"個人に属するという意味ではなく、食べ物の産地を説明している。"},{"t":"外国の","why":"外国産ではなく、同じ地域で作られた食べ物を指す。"}],"answer":1,"level":1,"accept":["地域の","地元で作られた","その土地の","地元産の"],"point":"local は「地元の・地域の」。local food で地元の食べ物を表す。","drive":{"ja":"地元の食べ物を買うことは、同じ地域の農家の助けになる。","en":"Buying local food helps farmers in the same area."},"explain":"動名詞句Buying local foodが主語で、単数扱いのため動詞はhelps。localで産地を絞り、意見論述で購入が地域に与える利点を示す。別の言い方: locally produced food"},{"id":"g2-vocab_ej-202","q":"Online shopping is [[convenient]] for people who work late.","q_ja":"ネットショッピングは、遅くまで働く人々にとって便利だ。","choices":[{"t":"安全である","why":"便利さを表す語であり、買い物の安全性までは述べていない。"},{"t":"必要である","why":"必要不可欠という意味ではなく、利用しやすいことを表す。"},{"t":"安価である","why":"価格の安さではなく、買い物のしやすさを表す。"},{"t":"便利である","why":"正解。convenient は、時間や手間の面で都合がよいことを表す。"}],"answer":3,"level":1,"accept":["便利な","便利だ","便利","都合がよい","都合のよい"],"point":"convenient は「便利な」。人にとって便利だと言うときは for を使う。","drive":{"ja":"ネットショッピングは、遅くまで働く人々にとって便利だ。","en":"Online shopping is convenient for people who work late."},"explain":"主語Online shoppingの性質をisで述べ、who以下がpeopleを修飾する。convenient forで恩恵を受ける人を示し、意見の根拠を具体化する。別の言い方: handy"},{"id":"g2-vocab_ej-203","q":"Schools should offer students more [[opportunities]] to learn about different cultures.","q_ja":"学校は生徒に、異なる文化について学ぶ機会をもっと与えるべきだ。","choices":[{"t":"機会","why":"正解。opportunities は、何かを行える機会を表す opportunity の複数形。"},{"t":"意見","why":"意見は opinions。形は少し似ているが、学ぶ機会という意味にはならない。"},{"t":"義務","why":"学ぶ義務ではなく、学ぶことのできる機会を表している。"},{"t":"能力","why":"学ぶ能力ではなく、学習に取り組める機会を指している。"}],"answer":0,"level":2,"accept":["好機","チャンス","学ぶ機会","機会を"],"point":"opportunity to do は「〜する機会」。複数形は opportunities。","drive":{"ja":"学校は生徒に、異なる文化について学ぶ機会をもっと与えるべきだ。","en":"Schools should offer students more opportunities to learn about different cultures."},"explain":"Schoolsが主語、should offerが述語で、studentsと機会が目的語。opportunities to learnは学ぶ機会を表し、教育への提案を具体化する。別の言い方: chances to learn"},{"id":"g2-vocab_ej-204","q":"The school must [[address]] concerns about online safety before introducing tablets into every classroom next year.","q_ja":"学校は来年すべての教室にタブレットを導入する前に、インターネット上の安全性に関する懸念に対処しなければならない。","choices":[{"t":"に演説する","why":"address には人々に演説する意味もあるが、ここでは concerns が目的語なので合わない。"},{"t":"の住所を書く","why":"address には宛名や住所を書く意味もあるが、懸念について述べるこの文には合わない。"},{"t":"に対処する","why":"正解。address concerns は、懸念を取り上げて対処することを表す。"},{"t":"を配送する","why":"配送するという意味はなく、安全性への懸念に取り組む必要性を述べている。"}],"answer":2,"level":3,"accept":["対処する","〜に対処する","に取り組む","取り組む","対応する","に対応する"],"point":"動詞の address は、問題や懸念を目的語に取ると「〜に対処する」。","drive":{"ja":"学校は来年すべての教室にタブレットを導入する前に、インターネット上の安全性に関する懸念に対処しなければならない。","en":"The school must address concerns about online safety before introducing tablets into every classroom next year."},"explain":"主語はThe school、述語はmust addressで、before以下が導入前という順序を示す。address concernsで懸念への対処を求め、提案の前提条件を述べる。別の言い方: deal with concerns"},{"id":"g2-vocab_ej-205","q":"Public libraries let people [[borrow]] books without buying them.","q_ja":"公共図書館では、人々は本を買わずに借りることができる。","choices":[{"t":"借りる","why":"正解。borrow は、後で返すつもりで一時的に借りることを表す。"},{"t":"貸す","why":"貸すのは lend。ここでは図書館を利用する人々の行動を述べている。"},{"t":"買う","why":"買うという意味ではなく、without buying them とも合わない。"},{"t":"売る","why":"売るという意味ではなく、図書館の本を一時的に利用することを表す。"}],"answer":0,"level":1,"accept":["借り受ける","を借りる","〜を借りる","一時的に借りる"],"point":"borrow は「借りる」、lend は「貸す」。借りる側か貸す側かを区別する。","drive":{"ja":"公共図書館では、人々は本を買わずに借りることができる。","en":"Public libraries let people borrow books without buying them."},"explain":"Public librariesが主語で、let＋人＋動詞の原形が利用者に可能な行動を示す。without＋動名詞で購入不要という利点を添え、公共施設を支持する根拠にする。別の言い方: take books out on loan"},{"id":"g2-vocab_ej-206","q":"Some jobs [[require]] special training, so schools should explain these career paths to students.","q_ja":"特別な訓練を必要とする仕事もあるため、学校はこうした進路について生徒に説明するべきだ。","choices":[{"t":"を勧める","why":"訓練を勧めるという意味ではなく、仕事に就くために必要であることを表す。"},{"t":"を含んでいる","why":"訓練が仕事の一部に含まれるという説明ではなく、訓練の必要性を示している。"},{"t":"を申し込む","why":"仕事自体が訓練を申し込むわけではなく、その仕事には訓練が必要だと述べている。"},{"t":"を必要とする","why":"正解。require は、ある物事のために何かが必要であることを表す。"}],"answer":3,"level":2,"accept":["必要とする","〜を必要とする","が必要である","が必要だ","を要する"],"point":"require は「〜を必要とする」。仕事や活動に必要な条件を説明するときに使える。","drive":{"ja":"特別な訓練を必要とする仕事もあるため、学校はこうした進路について生徒に説明するべきだ。","en":"Some jobs require special training, so schools should explain these career paths to students."},"explain":"Some jobsが主語、requireが動詞で、soが結果となる提案の節をつなぐ。require＋名詞で必要条件を示し、事実から学校への提言を導く。別の言い方: need special training"},{"id":"g2-vocab_ej-207","q":"The town may [[turn down]] the offer because the new sports center would cost too much.","q_ja":"新しいスポーツセンターに費用がかかりすぎるため、町はその申し出を断るかもしれない。","choices":[{"t":"音量を下げる","why":"turn down には音量を下げる意味もあるが、目的語が申し出なので合わない。"},{"t":"申し出を断る","why":"正解。turn down an offer は、申し出を受け入れずに断ることを表す。"},{"t":"折り返す","why":"紙などを折り返す意味もあるが、申し出を目的語に取るこの文には合わない。"},{"t":"向きを変える","why":"向きを変える意味と混同している。ここでは費用を理由に申し出を断る。"}],"answer":1,"level":3,"accept":["拒否する","拒む","断る","を断る","〜を断る","辞退する"],"point":"turn down は、申し出や提案を目的語に取ると「断る」。目的語から意味を判断する。","drive":{"ja":"新しいスポーツセンターに費用がかかりすぎるため、町はその申し出を断るかもしれない。","en":"The town may turn down the offer because the new sports center would cost too much."},"explain":"The townが主語、may turn downが述語で、because節が理由を示す。mayで拒否の可能性を述べ、wouldで建設した場合の費用を示すため、判断を慎重に説明できる。別の言い方: reject the offer"},{"id":"g2-vocab_ej-208","q":"Quiet study areas help students [[concentrate on]] their work even when the library is busy.","q_ja":"静かな学習スペースは、図書館が混雑しているときでも、生徒が自分の課題に集中する助けになる。","choices":[{"t":"を分担する","why":"課題を分けて受け持つ意味ではなく、一つのことに注意を向けることを表す。"},{"t":"を終わらせる","why":"課題を終えることまで表しているわけではなく、取り組む際の集中を表す。"},{"t":"に集中する","why":"正解。concentrate on は、ある物事に注意を集中させることを表す。"},{"t":"を比較する","why":"compare と混同している。ここでは複数の課題を比べる話ではない。"}],"answer":2,"level":2,"accept":["集中する","〜に集中する","に専念する","専念する","に注意を集中する"],"point":"concentrate on は「〜に集中する」。集中する対象の前に on を置く。","drive":{"ja":"静かな学習スペースは、図書館が混雑しているときでも、生徒が自分の課題に集中する助けになる。","en":"Quiet study areas help students concentrate on their work even when the library is busy."},"explain":"Quiet study areasが主語で、help＋人＋動詞の原形が効果を示す。even when節で混雑時にも成り立つ利点を強調し、学習環境への意見を支える。別の言い方: focus on their work"},{"id":"g2-vocab_ej-209","q":"School lunch menus should [[reflect]] students' needs while remaining healthy and affordable for all families.","q_ja":"学校給食の献立は、健康的で、すべての家庭にとって無理のない価格を保ちながら、生徒のニーズを反映するべきだ。","choices":[{"t":"熟考する","why":"reflect on で熟考する意味になるが、ここでは献立が生徒のニーズを反映するという意味。"},{"t":"反射する","why":"光などを反射する意味もあるが、ニーズを目的語に取るこの文には合わない。"},{"t":"反省する","why":"自分の行動を振り返る意味ではなく、献立にニーズが表れることを述べている。"},{"t":"反映する","why":"正解。reflect はここでは、内容や特徴を何かに表すことを意味する。"}],"answer":3,"level":3,"accept":["を反映する","〜を反映する","取り入れる","を取り入れる","に応える内容にする"],"point":"reflect は「反映する」。reflect needs で、ニーズが内容に表れることを示す。","drive":{"ja":"学校給食の献立は、健康的で、すべての家庭にとって無理のない価格を保ちながら、生徒のニーズを反映するべきだ。","en":"School lunch menus should reflect students' needs while remaining healthy and affordable for all families."},"explain":"献立が主語、should reflectが述語で、while以下も献立の状態を述べる。while＋動詞のing形で条件を添え、要望と制約の両立を提案する。別の言い方: represent students' needs"},{"id":"g2-vocab_ej-210","q":"Online classes are now [[common]] in many schools across the country.","q_ja":"オンライン授業は今では、全国の多くの学校でよく見られる。","choices":[{"t":"よく見られる","why":"正解。common はここでは、珍しくなく広く見られることを表す。"},{"t":"共同で所有する","why":"common には共有の意味もあるが、ここでは授業が広まっていることを述べている。"},{"t":"特別に選ばれる","why":"特別で珍しいことではなく、多くの学校で一般的に見られることを表す。"},{"t":"法律で定められる","why":"普及しているという意味であり、法律で義務づけられているとは述べていない。"}],"answer":0,"level":1,"accept":["一般的な","一般的である","一般的だ","よくある","広く見られる","普及している"],"point":"common は「よくある・一般的な」。文脈によっては「共通の・共有の」にもなる。","drive":{"ja":"オンライン授業は今では、全国の多くの学校でよく見られる。","en":"Online classes are now common in many schools across the country."},"explain":"Online classesが主語、areが動詞、commonが補語で、場所の句が普及範囲を示す。now commonで現在の広まりを述べ、意見論述の背景を提示する。別の言い方: widespread"},{"id":"g2-vocab_ej-211","q":"School lunches help children develop [[healthy]] eating habits from childhood.","q_ja":"学校給食は、子どもたちが幼い頃から健康的な食習慣を身につけるのに役立つ。","choices":[{"t":"経済的な","why":"費用が少なくて済むという意味で、healthy の意味とは異なる。"},{"t":"健康的な","why":"正解。食習慣について述べており、体の健康に良いという意味。"},{"t":"伝統的な","why":"昔から受け継がれているという意味で、健康に良いことは表さない。"},{"t":"規則的な","why":"一定の間隔や決まりに従うという意味で、healthy の訳にはならない。"}],"answer":1,"point":"healthy eating habits で「健康的な食習慣」。","level":1,"accept":["健康によい","健康に良い","体によい","体に良い","健康的"],"drive":{"ja":"学校給食は、子どもたちが幼い頃から健康的な食習慣を身につけるのに役立つ。","en":"School lunches help children develop healthy eating habits from childhood."},"explain":"主語はSchool lunches、動詞はhelpで、子どもの習慣形成を支える構造。help＋人＋動詞の原形で施策の効果を論じ、healthyで健康面の利点を示す。別の言い方: good for health。"},{"id":"g2-vocab_ej-212","q":"Schools should inform parents [[in advance]] when they plan to change the school bus schedule.","q_ja":"学校は、スクールバスの運行時刻を変更する予定がある場合、保護者に事前に知らせるべきだ。","choices":[{"t":"順番どおりに","why":"決められた順序を表す訳で、予定より前に知らせるという意味にはならない。"},{"t":"その場ですぐに","why":"その時点で即座に行うという意味で、変更前に知らせることを表さない。"},{"t":"予定の時刻に","why":"予定された時刻ちょうどという意味で、事前にという意味とは異なる。"},{"t":"あらかじめ","why":"正解。時刻変更を実施する前に保護者へ知らせるという意味。"}],"answer":3,"point":"in advance は「事前に、あらかじめ」。予定の変更を知らせる文で使える。","level":2,"accept":["事前に","前もって","先に"],"drive":{"ja":"学校は、スクールバスの運行時刻を変更する予定がある場合、保護者に事前に知らせるべきだ。","en":"Schools should inform parents in advance when they plan to change the school bus schedule."},"explain":"Schoolsが主語、should informが述語で、when節が通知すべき状況を示す。in advanceは実施前の準備を可能にする時期を表し、提言に具体性を加える。別の言い方: ahead of time。"},{"id":"g2-vocab_ej-213","q":"Some residents [[decline]] offers of free exercise classes because the sessions conflict with their working hours.","q_ja":"住民の中には、開催時間が勤務時間と重なるため、無料の運動教室への誘いを断る人もいる。","choices":[{"t":"断る","why":"正解。目的語が教室への誘いなので、誘いを受け入れないという意味。"},{"t":"減少する","why":"decline の別の意味だが、ここでは誘いを目的語に取る動詞なので合わない。"},{"t":"延期する","why":"都合が悪い理由は述べられているが、開催を後日に延ばすという意味ではない。"},{"t":"取り消す","why":"すでに決めた参加などを撤回する意味で、誘いを断ることとは異なる。"}],"answer":0,"point":"decline an offer は「申し出を断る」。decline には「減少する」という意味もある。","level":3,"accept":["誘いを断る","申し出を断る","辞退する","受けるのを断る"],"drive":{"ja":"住民の中には、開催時間が勤務時間と重なるため、無料の運動教室への誘いを断る人もいる。","en":"Some residents decline offers of free exercise classes because the sessions conflict with their working hours."},"explain":"Some residentsが主語、declineが動詞で、because節が断る理由を示す。decline＋申し出で不参加の選択を表し、要約で参加が進まない事情を説明できる。別の言い方: turn down。"},{"id":"g2-vocab_ej-214","q":"Public libraries remain [[necessary]] for people without internet connections at home.","q_ja":"公共図書館は、自宅にインターネット接続がない人々にとって、引き続き必要だ。","choices":[{"t":"人気がある","why":"多くの人に好まれるという意味で、必要であることとは異なる。"},{"t":"利用できる","why":"利用が可能だという意味で、必要性を表す necessary の訳にはならない。"},{"t":"必要である","why":"正解。自宅でネットを使えない人々に図書館が必要だと述べている。"},{"t":"無料である","why":"料金がかからないという意味で、necessary は費用について述べる語ではない。"}],"answer":2,"point":"necessary for ～ は「～にとって必要な」。","level":1,"accept":["必要な","必要だ","必要","必要とされる"],"drive":{"ja":"公共図書館は、自宅にインターネット接続がない人々にとって、引き続き必要だ。","en":"Public libraries remain necessary for people without internet connections at home."},"explain":"Public librariesが主語、remainが動詞、necessaryが補語。remain＋形容詞で必要性の継続を示し、for以下で受益者を絞ると施設の意義を論じやすい。別の言い方: needed。"},{"id":"g2-vocab_ej-215","q":"The [[demand]] for evening buses is growing as more people work late in the city.","q_ja":"市内で夜遅くまで働く人が増えるにつれて、夜間のバスへの需要が高まっている。","choices":[{"t":"需要","why":"正解。夜間のバスを利用したいという人々の必要や希望を表している。"},{"t":"供給","why":"サービスを提供する側の量を表す語で、利用したい側の需要とは異なる。"},{"t":"命令","why":"demand が強い要求を表す場合もあるが、この文は利用者の需要の増加を述べている。"},{"t":"費用","why":"サービスにかかる金額という意味で、demand は費用を表さない。"}],"answer":0,"point":"the demand for ～ は「～への需要」。サービスを必要とする人の多さを述べられる。","level":2,"accept":["利用の需要","利用したいという需要","必要とすること","求めること","ニーズ"],"drive":{"ja":"市内で夜遅くまで働く人が増えるにつれて、夜間のバスへの需要が高まっている。","en":"The demand for evening buses is growing as more people work late in the city."},"explain":"主語はThe demand for evening buses、述語はis growingで、as節が変化の背景を示す。demand for＋名詞で利用者の需要を示すと、サービス拡充の根拠になる。別の言い方: need。"},{"id":"g2-vocab_ej-216","q":"Despite having fewer workers, factories must [[maintain]] product quality to compete with companies that sell cheaper goods.","q_ja":"工場は、従業員が減っても、より安い商品を売る企業と競争するために製品の品質を維持しなければならない。","choices":[{"t":"確認する","why":"品質を検査することを表すが、maintain は品質を一定の状態に保つこと。"},{"t":"向上させる","why":"今より良くするという意味で、現在の品質を保つという意味とは異なる。"},{"t":"維持する","why":"正解。人手が減っても製品の品質を落とさずに保つという意味。"},{"t":"主張する","why":"maintain の別の意味だが、この文では意見を述べるのでなく品質を保つことを表す。"}],"answer":2,"point":"maintain quality は「品質を維持する」。向上させることと区別する。","level":3,"accept":["保つ","品質を保つ","維持","一定に保つ","維持していく"],"drive":{"ja":"工場は、従業員が減っても、より安い商品を売る企業と競争するために製品の品質を維持しなければならない。","en":"Despite having fewer workers, factories must maintain product quality to compete with companies that sell cheaper goods."},"explain":"Despite句が譲歩、factoriesが主語、must maintainが述語で、to以下が目的。maintain＋品質で水準を保つ責務を述べ、企業の課題を論じられる。別の言い方: keep up。"},{"id":"g2-vocab_ej-217","q":"Schools can use digital notices [[instead of]] printed letters to parents.","q_ja":"学校は、保護者向けの印刷した手紙の代わりに、電子的な通知を使うことができる。","choices":[{"t":"～に加えて","why":"印刷した手紙も使いながら通知を追加する意味になり、置き換えを表さない。"},{"t":"～のために","why":"目的や受益者を表す訳で、手紙の代用という意味にはならない。"},{"t":"～と同じく","why":"共通点を示す訳で、一方を他方に置き換える意味とは異なる。"},{"t":"～の代わりに","why":"正解。印刷した手紙を電子的な通知に置き換えることを表す。"}],"answer":3,"point":"instead of ～ は「～の代わりに」。後ろには名詞や動名詞を置く。","level":1,"accept":["の代わりに","代わりに","～に代えて","に代えて","～のかわりに"],"drive":{"ja":"学校は、保護者向けの印刷した手紙の代わりに、電子的な通知を使うことができる。","en":"Schools can use digital notices instead of printed letters to parents."},"explain":"Schoolsが主語、can useが述語で、instead of以下が置き換えられる対象。use A instead of Bで代替案を示せるため、施策を提案する際に使える。別の言い方: in place of。"},{"id":"g2-vocab_ej-218","q":"A smaller [[population]] may leave rural towns with fewer customers for shops and fewer students for schools.","q_ja":"人口が減ると、地方の町では店の客や学校の生徒が少なくなる可能性がある。","choices":[{"t":"人気","why":"形が似た popularity の意味で、population は地域に住む人の数を表す。"},{"t":"人口","why":"正解。町に住む人が少なくなることで、客や生徒も減るという文脈。"},{"t":"面積","why":"土地の広さを表す語で、population は広さを表さない。"},{"t":"収入","why":"得られるお金を表す語で、地域に住む人の数とは異なる。"}],"answer":1,"point":"population は「人口」。形の似た popularity「人気」と区別する。","level":2,"accept":["住民の数","住民数","住んでいる人の数","居住者数"],"drive":{"ja":"人口が減ると、地方の町では店の客や学校の生徒が少なくなる可能性がある。","en":"A smaller population may leave rural towns with fewer customers for shops and fewer students for schools."},"explain":"A smaller populationが主語、may leaveが述語で、with以下が町に生じる状態。人口を原因に置くことで、要約で人口減少と地域への影響を結び付けられる。別の言い方: number of residents。"},{"id":"g2-vocab_ej-219","q":"The city will [[reserve]] funds for school repairs, even if other projects need more money this year.","q_ja":"市は、今年ほかの事業がより多くの資金を必要としても、学校の修繕用の資金を確保する予定だ。","choices":[{"t":"予約する","why":"reserve の別の意味だが、ここでの目的語は座席や部屋ではなく資金。"},{"t":"支出する","why":"実際にお金を使う意味で、特定の目的のために資金を確保することとは異なる。"},{"t":"借り入れる","why":"外部から資金を借りる意味で、資金を取り置くことを表さない。"},{"t":"確保する","why":"正解。学校の修繕に使えるよう、資金を取っておくという意味。"}],"answer":3,"point":"reserve A for B は「BのためにAを確保する」。資金や時間にも使える。","level":3,"accept":["取っておく","取り置く","取り分けておく","確保しておく","～を確保する"],"drive":{"ja":"市は、今年ほかの事業がより多くの資金を必要としても、学校の修繕用の資金を確保する予定だ。","en":"The city will reserve funds for school repairs, even if other projects need more money this year."},"explain":"The cityが主語、will reserveが述語で、even if節が譲歩的な条件を示す。reserve A for Bで用途別の資金確保を表し、予算の優先順位を論じられる。別の言い方: set aside。"},{"id":"g2-vocab_ej-220","q":"Free school meals can lower the [[cost]] of raising children.","q_ja":"学校給食の無償化は、子育てにかかる費用を下げることができる。","choices":[{"t":"費用","why":"正解。子育てに必要なお金を指している。"},{"t":"収入","why":"入ってくるお金を表す語で、子育てにかかるお金とは異なる。"},{"t":"利益","why":"得られるもうけを表す語で、支払う必要があるお金を表さない。"},{"t":"手間","why":"労力や面倒を表す訳で、この文の cost は金銭的な負担を指す。"}],"answer":0,"point":"the cost of ～ は「～にかかる費用」。of の後ろに動名詞も置ける。","level":1,"accept":["経費","かかる費用","必要な費用","コスト","金銭的な負担"],"drive":{"ja":"学校給食の無償化は、子育てにかかる費用を下げることができる。","en":"Free school meals can lower the cost of raising children."},"explain":"Free school mealsが主語、can lowerが述語で、the cost以下が目的語。cost of＋動名詞で活動に伴う費用を表すと、支援策による負担軽減を論じられる。別の言い方: expense。"}],"vocab_je":[{"id":"g2-vocab_je-001","q":"Using buses can ___（減らす） the number of cars on roads.","q_ja":"バスを利用すると、道路を走る車の数を減らせる。","choices":[{"t":"increase","why":"「増やす」という意味で、車の数を減らすという指定に合わない。"},{"t":"reduce","why":"正解。「減らす」という意味で、車の数を少なくすることを表す。"},{"t":"remove","why":"「取り除く」という意味で、数を減らすという意味の動詞とは異なる。"},{"t":"reuse","why":"「再利用する」という意味で、数を減らすことは表さない。"}],"answer":1,"point":"数や量を減らすときは reduce を使う。","level":1,"accept":["decrease"],"drive":{"ja":"バスを利用すると、道路を走る車の数を減らせる。","en":"Using buses can reduce the number of cars on roads."},"explain":"動名詞句Using busesが主語で、can reduceが可能な効果を表す。reduce＋数量で減少を示し、意見論述で交通対策の利点を述べられる。別の言い方: decrease"},{"id":"g2-vocab_je-002","q":"Schools need trained staff who can ___（対処する） problems such as bullying among students.","q_ja":"学校には、生徒間のいじめなどの問題に対処できる、訓練を受けた職員が必要だ。","choices":[{"t":"care for","why":"「世話をする」という意味で、問題に対処するという指定に合わない。"},{"t":"search for","why":"「探す」という意味で、問題への対処を表さない。"},{"t":"agree with","why":"「賛成する」という意味で、いじめなどの問題に対処することは表さない。"},{"t":"deal with","why":"正解。問題などに「対処する」という意味で使う熟語。"}],"answer":3,"point":"deal with problems で「問題に対処する」を表す。","level":2,"accept":["dealt with","handle","cope with"],"drive":{"ja":"学校には、生徒間のいじめなどの問題に対処できる、訓練を受けた職員が必要だ。","en":"Schools need trained staff who can deal with problems such as bullying among students."},"explain":"主語Schoolsにneedを続け、who節で必要な職員の能力を説明する。deal withは問題への対応を表し、論述で人材の必要性を示せる。別の言い方: handle"},{"id":"g2-vocab_je-003","q":"Small changes in daily habits can ___（〜に貢献する） efforts to save energy at home and at school.","q_ja":"日々の習慣の小さな変化は、家庭や学校でエネルギーを節約する取り組みに貢献できる。","choices":[{"t":"contribute to","why":"正解。取り組みなどに「貢献する」は contribute to で表す。"},{"t":"contribute for","why":"貢献する対象を続けるときの前置詞は for ではなく to。"},{"t":"result from","why":"「〜の結果として生じる」という意味で、取り組みに貢献するという指定と異なる。"},{"t":"depend upon","why":"「〜に頼る」という意味で、取り組みへの貢献を表さない。"}],"answer":0,"point":"contribute to の to は前置詞で、後ろに貢献する対象の名詞を置く。","level":3,"accept":["make a contribution to"],"drive":{"ja":"日々の習慣の小さな変化は、家庭や学校でエネルギーを節約する取り組みに貢献できる。","en":"Small changes in daily habits can contribute to efforts to save energy at home and at school."},"explain":"主語はSmall changesで、can contributeが効果を示し、to save以下が取り組みの目的を補う。contribute toは行動の意義を論じるのに使える。別の言い方: make a contribution to"},{"id":"g2-vocab_je-004","q":"Students can ___（参加する） volunteer activities in their local communities.","q_ja":"生徒は地元の地域でボランティア活動に参加できる。","choices":[{"t":"take care of","why":"「世話をする」という意味で、活動への参加を表さない。"},{"t":"keep up with","why":"「〜に遅れずについていく」という意味で、参加するという指定とは異なる。"},{"t":"take part in","why":"正解。活動や行事に「参加する」という意味の熟語。"},{"t":"look forward to","why":"「〜を楽しみに待つ」という意味で、参加すること自体は表さない。"}],"answer":2,"point":"take part in の後ろには、参加する活動や行事を置く。","level":1,"accept":["participate in"],"drive":{"ja":"生徒は地元の地域でボランティア活動に参加できる。","en":"Students can take part in volunteer activities in their local communities."},"explain":"主語Studentsにcan＋動詞の原形を続け、参加の可能性を示す。take part in＋活動で実際の参加を表し、論述で地域貢献の方法を提案できる。別の言い方: participate in"},{"id":"g2-vocab_je-005","q":"Signs near schools can ___（防ぐ） accidents by reminding drivers to slow down when children cross the road.","q_ja":"学校の近くの標識は、子どもが道路を横断するときに減速するよう運転手に注意を促すことで、事故を防げる。","choices":[{"t":"avoid","why":"「避ける」という意味で、標識が事故の発生を未然に防ぐという因果関係には prevent が合う。"},{"t":"forbid","why":"「禁止する」という意味で、事故の発生を防ぐこととは異なる。"},{"t":"refuse","why":"「拒否する」という意味で、事故を未然に防ぐことは表さない。"},{"t":"prevent","why":"正解。「防ぐ」という意味で、標識によって事故が起こらないようにすることを表す。"}],"answer":3,"point":"prevent accidents は「事故を防ぐ」。avoid は主語自身が危険などを避けるときに使う。","level":3,"accept":["help prevent"],"drive":{"ja":"学校の近くの標識は、子どもが道路を横断するときに減速するよう運転手に注意を促すことで、事故を防げる。","en":"Signs near schools can prevent accidents by reminding drivers to slow down when children cross the road."},"explain":"主語は標識で、can preventが効果、by以下が手段、when節が横断時を示す。prevent＋事故で発生の防止を表し、安全対策の有効性を論じられる。別の言い方: stop accidents from happening"},{"id":"g2-vocab_je-006","q":"Online lessons can ___（利益をもたらす） students who live too far away to attend classes in person.","q_ja":"オンライン授業は、遠くに住んでいて対面授業に出席できない生徒に利益をもたらすことができる。","choices":[{"t":"benefit","why":"正解。人に「利益をもたらす」という意味で、直後に対象となる人を置ける。"},{"t":"support","why":"「支える」という意味で、利益をもたらすという指定の動詞とは異なる。"},{"t":"improve","why":"「改善する」という意味で、生徒に利益をもたらすという指定と異なる。"},{"t":"develop","why":"「発達させる」という意味で、利益をもたらすこと自体は表さない。"}],"answer":0,"point":"benefit を他動詞として使うと「〜に利益をもたらす」になる。","level":2,"accept":["be beneficial to"],"drive":{"ja":"オンライン授業は、遠くに住んでいて対面授業に出席できない生徒に利益をもたらすことができる。","en":"Online lessons can benefit students who live too far away to attend classes in person."},"explain":"主語はオンライン授業で、can benefitが利点を述べ、who節が生徒を限定する。too…toで通学できない事情を示し、論述で恩恵を受ける層を明確にできる。別の言い方: be beneficial to"},{"id":"g2-vocab_je-007","q":"Public libraries ___（提供する） useful information for people of all ages.","q_ja":"公共図書館は、あらゆる年齢の人に役立つ情報を提供する。","choices":[{"t":"produce","why":"「生み出す」という意味で、情報を提供するという指定と異なる。"},{"t":"receive","why":"「受け取る」という意味で、提供する側と受け取る側が逆になる。"},{"t":"provide","why":"正解。「提供する」という意味で、図書館が情報を人々に届けることを表す。"},{"t":"prepare","why":"「準備する」という意味で、人々に情報を提供することとは異なる。"}],"answer":2,"point":"provide information for people で「人々に情報を提供する」を表す。","level":1,"accept":["provides","provided","providing","offer"],"drive":{"ja":"公共図書館は、あらゆる年齢の人に役立つ情報を提供する。","en":"Public libraries provide useful information for people of all ages."},"explain":"主語Public librariesにprovide＋情報を続け、for以下で提供先を示す。provideはサービスの内容を具体化でき、論述で公共施設の役割を説明するのに適する。別の言い方: offer"},{"id":"g2-vocab_je-008","q":"Companies should ___（〜に責任を負う） the safety of the products they sell to customers.","q_ja":"企業は、顧客に販売する製品の安全性に責任を負うべきだ。","choices":[{"t":"be concerned about","why":"「〜を心配している」という意味で、責任を負うという指定とは異なる。"},{"t":"be responsible for","why":"正解。「〜に責任を負う」という意味で、製品の安全性への責任を表す。"},{"t":"be suitable for","why":"「〜に適している」という意味で、企業の責任を表さない。"},{"t":"be satisfied with","why":"「〜に満足している」という意味で、責任を負うこととは異なる。"}],"answer":1,"point":"be responsible for の後ろには、責任を負う対象を置く。","level":2,"accept":["are responsible for","were responsible for","take responsibility for"],"drive":{"ja":"企業は、顧客に販売する製品の安全性に責任を負うべきだ。","en":"Companies should be responsible for the safety of the products they sell to customers."},"explain":"主語は企業で、should beが提言、they sell以下が製品を修飾する。be responsible forで責任の対象を示し、論述で企業の義務を述べられる。別の言い方: take responsibility for"},{"id":"g2-vocab_je-009","q":"Young users must ___（〜を認識している） risks when sharing personal information with strangers on the internet.","q_ja":"若い利用者は、インターネット上で知らない人と個人情報を共有するときの危険性を認識していなければならない。","choices":[{"t":"be familiar to","why":"「〜によく知られている」という意味で、利用者が危険性を認識していることにはならない。"},{"t":"be worried about","why":"「〜を心配している」という意味で、危険性の存在を認識しているという指定とは異なる。"},{"t":"be certain of","why":"「〜を確信している」という意味で、危険性を認識しているという意味よりも確信を強調する。"},{"t":"be aware of","why":"正解。「〜を認識している」という意味で、危険性の存在を知っていることを表す。"}],"answer":3,"point":"be aware of は、事実や危険性などを認識している状態を表す。","level":3,"accept":["are aware of","were aware of","recognize"],"drive":{"ja":"若い利用者は、インターネット上で知らない人と個人情報を共有するときの危険性を認識していなければならない。","en":"Young users must be aware of risks when sharing personal information with strangers on the internet."},"explain":"主語は若い利用者で、must beが義務、when以下が情報共有時を示す。be aware ofは危険を知る状態を表し、論述で利用者に必要な意識を述べられる。別の言い方: recognize"},{"id":"g2-vocab_je-010","q":"Many rural workers ___（〜に頼る） local buses because they cannot afford to buy a car.","q_ja":"地方で働く多くの人は、車を買う経済的な余裕がないため、地域のバスに頼っている。","choices":[{"t":"depend on","why":"正解。「〜に頼る」という意味で、移動手段としてバスを必要としていることを表す。"},{"t":"result in","why":"「〜という結果になる」という意味で、人がバスに頼る関係を表さない。"},{"t":"belong to","why":"「〜に所属する」という意味で、バスを頼りにすることとは異なる。"},{"t":"consist of","why":"「〜から成る」という意味で、人と交通手段の関係には合わない。"}],"answer":0,"point":"depend on は、人や物を頼りにする関係を表すときにも使う。","level":2,"accept":["depends on","depended on","depending on","rely on"],"drive":{"ja":"地方で働く多くの人は、車を買う経済的な余裕がないため、地域のバスに頼っている。","en":"Many rural workers depend on local buses because they cannot afford to buy a car."},"explain":"主語は地方の労働者で、dependが依存を示し、because節が理由を説明する。cannot afford toで経済的制約を示し、論述で公共交通の必要性を裏付けられる。別の言い方: rely on"},{"id":"g2-vocab_je-011","q":"Local rules can ___（守る） wild animals from harm.","q_ja":"地域の規則は、野生動物を危害から守ることができる。","choices":[{"t":"restore","why":"「元の状態に戻す」という意味で、危害から守るという指定とは異なる。"},{"t":"protect","why":"正解。protect A from B で「AをBから守る」を表す。"},{"t":"promote","why":"「促進する」という意味で、危害から守ることは表さない。"},{"t":"protest","why":"「抗議する」という意味で、動物を守るという指定とは異なる。"}],"answer":1,"point":"protect animals from harm で「動物を危害から守る」を表す。","level":1,"accept":["keep"],"drive":{"ja":"地域の規則は、野生動物を危害から守ることができる。","en":"Local rules can protect wild animals from harm."},"explain":"主語Local rulesにcan protectを続け、動物を目的語に置く。protect A from Bは守る対象と危険を明示でき、論述で規則の効果を説明するのに使える。別の言い方: shield A from B"},{"id":"g2-vocab_je-012","q":"Media lessons should teach students to ___（区別する） facts from opinions before they share news with other people online.","q_ja":"メディアに関する授業では、生徒がインターネット上で他の人とニュースを共有する前に、事実と意見を区別するよう教えるべきだ。","choices":[{"t":"determine","why":"「特定する・決定する」という意味で、AとBを区別するという from を伴う形には合わない。"},{"t":"distribute","why":"「配る」という意味で、事実と意見を区別することは表さない。"},{"t":"distinguish","why":"正解。distinguish A from B で「AとBを区別する」を表す。"},{"t":"demonstrate","why":"「示す・実証する」という意味で、事実と意見の違いを見分けるという指定には合わない。"}],"answer":2,"point":"distinguish A from B では、区別する二つの対象を from でつなぐ。","level":3,"accept":["tell"],"drive":{"ja":"メディアに関する授業では、生徒がインターネット上で他の人とニュースを共有する前に、事実と意見を区別するよう教えるべきだ。","en":"Media lessons should teach students to distinguish facts from opinions before they share news with other people online."},"explain":"主語は授業で、should teachが提言、before節が共有前という時を示す。teach＋人＋toで身に付けさせる技能を示し、論述で教育内容を具体化できる。別の言い方: tell facts from opinions"},{"id":"g2-vocab_je-201","q":"Schools should ___（許可する） students to use computers during lessons.","q_ja":"学校は生徒が授業中にコンピューターを使うことを許可するべきだ。","choices":[{"t":"advise","why":"「助言する」という意味で、使用を許可することとは異なる。"},{"t":"allow","why":"正解。「allow＋人＋to do」で「人が〜することを許可する」を表す。"},{"t":"announce","why":"「発表する」という意味で、この形で生徒に使用を許可するとは言えない。"},{"t":"agree","why":"「同意する」という意味で、直後に人と不定詞を並べて許可を表すことはできない。"}],"answer":1,"point":"「allow＋人＋to do」は「人が〜することを許可する」。","level":1,"accept":["permit"],"drive":{"ja":"学校は生徒が授業中にコンピューターを使うことを許可するべきだ。","en":"Schools should allow students to use computers during lessons."},"explain":"Schoolsが主語、should allowが述語で、to以下は生徒に許す行動を示す。allow＋人＋to doは、意見論述で許可すべき行動を提案できる。別の言い方: permit students to use computers"},{"id":"g2-vocab_je-202","q":"Trees can ___（増やす） the amount of shade in cities.","q_ja":"樹木は都市の日陰の量を増やすことができる。","choices":[{"t":"include","why":"「含む」という意味で、日陰の量を増やすことは表さない。"},{"t":"influence","why":"「影響を与える」という意味で、量が増えるという方向までは表さない。"},{"t":"introduce","why":"「導入する・紹介する」という意味で、日陰の量を増やすとは言えない。"},{"t":"increase","why":"正解。量や数を「増やす」という意味で、樹木と日陰の関係に合う。"}],"answer":3,"point":"increase は数や量を「増やす」と述べるときに使える。","level":1,"accept":["boost"],"drive":{"ja":"樹木は都市の日陰の量を増やすことができる。","en":"Trees can increase the amount of shade in cities."},"explain":"Treesが主語、can increaseが述語で、増やす対象は日陰の量。canは効果の可能性を示すので、意見論述で植樹の利点を断定しすぎずに述べられる。別の言い方: provide more shade"},{"id":"g2-vocab_je-203","q":"Schools should ___（共有する） unused sports equipment with nearby community centers.","q_ja":"学校は使っていないスポーツ用品を近くの地域センターと共有するべきだ。","choices":[{"t":"share","why":"正解。「share A with B」で「ＡをＢと共有する」を表す。"},{"t":"divide","why":"「分割する」という意味で、用品を地域センターと共同で使う意味とは異なる。"},{"t":"spread","why":"「広げる」という意味で、この形では用品を共同で使うことを表せない。"},{"t":"separate","why":"「分ける・引き離す」という意味で、用品を共有する意味ではない。"}],"answer":0,"point":"「share A with B」で物や情報を他者と共有することを表す。","level":1,"accept":[],"drive":{"ja":"学校は使っていないスポーツ用品を近くの地域センターと共有するべきだ。","en":"Schools should share unused sports equipment with nearby community centers."},"explain":"Schoolsが主語、should shareが述語で、with以下は共有相手を示す。share A with Bは、意見論述で余剰資源の共同利用を提案するのに適する。別の言い方: use A jointly with B"},{"id":"g2-vocab_je-204","q":"People should ___（再利用する） shopping bags to cut plastic waste.","q_ja":"人々はプラスチックごみを減らすために買い物袋を再利用するべきだ。","choices":[{"t":"review","why":"「見直す・再検討する」という意味で、袋を再び使うことは表さない。"},{"t":"remove","why":"「取り除く」という意味で、袋を再利用する意味ではない。"},{"t":"reuse","why":"正解。「再利用する」という意味で、袋を繰り返し使うことを表す。"},{"t":"refuse","why":"「拒む」という意味で、袋を再び使うという指定の意味とは異なる。"}],"answer":2,"point":"reuse は、物を捨てずにもう一度使うことを表す。","level":1,"accept":[],"drive":{"ja":"人々はプラスチックごみを減らすために買い物袋を再利用するべきだ。","en":"People should reuse shopping bags to cut plastic waste."},"explain":"Peopleが主語、should reuseが述語で、to cut以下は再利用の目的を示す。行動＋目的の不定詞で、意見論述の提案と狙いを一文で結べる。別の言い方: use shopping bags again"},{"id":"g2-vocab_je-205","q":"Free internet gives rural students ___（利用する機会） to online courses that are unavailable at their schools.","q_ja":"無料のインターネットは、地方の生徒に、自分たちの学校では受けられないオンライン講座を利用する機会を与える。","choices":[{"t":"entrance","why":"「入り口・入場」という意味で、講座を利用できることを表すこの表現には使わない。"},{"t":"approach","why":"「接近・取り組み方」という意味で、講座を利用する機会とは異なる。"},{"t":"admission","why":"「入学許可・入場許可」という意味で、通信環境によって講座を利用できることとは異なる。"},{"t":"access","why":"正解。「access to」で、サービスなどを利用できることを表す。"}],"answer":3,"point":"「give 人 access to〜」で「人に〜を利用する機会を与える」を表す。","level":2,"accept":["the opportunity to gain access"],"drive":{"ja":"無料のインターネットは、地方の生徒に、自分たちの学校では受けられないオンライン講座を利用する機会を与える。","en":"Free internet gives rural students access to online courses that are unavailable at their schools."},"explain":"主語はFree internet、動詞はgivesで、that節が講座を限定する。give＋人＋access toは、要約で教育機会の拡大を表せる。別の言い方: enable students to take online courses"},{"id":"g2-vocab_je-206","q":"Teachers should ___（意思を伝え合う） parents regularly so that small problems can be discussed early.","q_ja":"小さな問題を早い段階で話し合えるように、教師は保護者と定期的に意思を伝え合うべきだ。","choices":[{"t":"communicate to","why":"communicate to では、伝える内容を目的語に置く必要があり、この文の形で相手とのやり取りを表せない。"},{"t":"communicate with","why":"正解。「communicate with 人」で「人と意思を伝え合う」を表す。"},{"t":"listen for","why":"「聞こえてくるのを待つ」という意味で、相手と意思を伝え合うことではない。"},{"t":"hear from","why":"「〜から連絡をもらう」という意味で、双方向で意思を伝え合うこととは異なる。"}],"answer":1,"point":"相手と意思を伝え合う場合は「communicate with 人」とする。","level":2,"accept":["exchange information with"],"drive":{"ja":"小さな問題を早い段階で話し合えるように、教師は保護者と定期的に意思を伝え合うべきだ。","en":"Teachers should communicate with parents regularly so that small problems can be discussed early."},"explain":"Teachersが主語で、so that節は連絡の目的を示す。communicate withは双方向のやり取りを表し、意見論述で連携の必要性を述べられる。別の言い方: exchange information with parents"},{"id":"g2-vocab_je-207","q":"A lack of exercise can ___（〜につながる） health problems, even among young people.","q_ja":"運動不足は、若い人々の間でも健康上の問題につながることがある。","choices":[{"t":"result from","why":"「〜から生じる」という意味で、健康上の問題が運動不足の原因となり、因果の向きが逆になる。"},{"t":"come from","why":"「〜に由来する」という意味で、健康上の問題が原因となるため、指定の意味と逆になる。"},{"t":"lead to","why":"正解。「〜につながる」という意味で、運動不足が健康上の問題を引き起こす関係を表す。"},{"t":"turn into","why":"「〜に変わる」という意味で、別のものへの変化を表し、因果関係を述べる指定の意味とは異なる。"}],"answer":2,"point":"「lead to＋結果」と「result from＋原因」は因果の向きが逆になる。","level":2,"accept":["result in","cause"],"drive":{"ja":"運動不足は、若い人々の間でも健康上の問題につながることがある。","en":"A lack of exercise can lead to health problems, even among young people."},"explain":"主語はA lack of exercise、述語はcan lead toで、even以下が若者も含むと強調する。lead to＋結果は、要約で原因と影響を結ぶのに適する。別の言い方: result in health problems"},{"id":"g2-vocab_je-208","q":"Small shops must ___（適応する） changes in shopping habits as more customers begin buying everyday goods online.","q_ja":"オンラインで日用品を買い始める客が増えるにつれて、小さな店は買い物習慣の変化に適応しなければならない。","choices":[{"t":"adapt to","why":"正解。「adapt to＋変化・環境」で、それに合わせて適応することを表す。"},{"t":"adopt from","why":"adopt は「採用する」という意味で、「adopt from 変化」で変化に適応するとは言えない。"},{"t":"apply to","why":"「〜に当てはまる・〜に申し込む」という意味で、店が習慣の変化に適応することは表さない。"},{"t":"adjust with","why":"adjust で変化に適応することを表すなら、with ではなく to を使う。"}],"answer":0,"point":"adapt は「適応する」、adopt は「採用する」。変化に適応する場合は adapt to を使う。","level":3,"accept":["adjust to"],"drive":{"ja":"オンラインで日用品を買い始める客が増えるにつれて、小さな店は買い物習慣の変化に適応しなければならない。","en":"Small shops must adapt to changes in shopping habits as more customers begin buying everyday goods online."},"explain":"Small shopsが主語、must adaptが述語で、as節が変化の進行を示す。adapt to＋変化は、意見論述で変化への対応を求める際に使える。別の言い方: adjust to changes in shopping habits"},{"id":"g2-vocab_je-209","q":"Local campaigns can ___（説得する） residents who usually drive short distances to walk to nearby shops instead.","q_ja":"地域の啓発活動は、普段は短い距離でも車を使う住民を説得して、代わりに近くの店へ歩いて行くよう促すことができる。","choices":[{"t":"suggest","why":"「提案する」という意味だが、「suggest＋人＋to do」という形で人を説得することはできない。"},{"t":"persuade","why":"正解。「persuade＋人＋to do」で、人を説得してある行動をするよう促すことを表す。"},{"t":"propose","why":"「提案する」という意味だが、このように人を目的語にして不定詞を続ける形にはできない。"},{"t":"explain","why":"「説明する」という意味で、この形では住民を説得して歩かせることを表せない。"}],"answer":1,"point":"「persuade＋人＋to do」は、人を説得して行動を促す表現。suggest は同じ構文では使えない。","level":3,"accept":["convince"],"drive":{"ja":"地域の啓発活動は、普段は短い距離でも車を使う住民を説得して、代わりに近くの店へ歩いて行くよう促すことができる。","en":"Local campaigns can persuade residents who usually drive short distances to walk to nearby shops instead."},"explain":"主語はLocal campaigns、動詞はpersuadeで、who節が住民を限定する。persuade＋人＋to doは、意見論述で行動を変える効果を述べられる。別の言い方: convince residents to walk"},{"id":"g2-vocab_je-210","q":"Students who practice speaking regularly ___（〜する可能性が高い） become confident when they discuss social issues in class.","q_ja":"定期的に話す練習をする生徒は、授業で社会問題について話し合うときに自信を持つようになる可能性が高い。","choices":[{"t":"are willing to","why":"「進んで〜する」という意欲を表し、自信を持つようになる可能性の高さではない。"},{"t":"are ready to","why":"「〜する準備ができている」という意味で、結果が起こる可能性の高さとは異なる。"},{"t":"are supposed to","why":"「〜することになっている」という予定や期待を表し、可能性が高いという意味ではない。"},{"t":"are likely to","why":"正解。「be likely to do」で「〜する可能性が高い」を表し、練習によって期待される変化を述べている。"}],"answer":3,"point":"be likely to は可能性の高さを表す。意欲を表す be willing to と区別する。","level":3,"accept":["will probably","are expected to"],"drive":{"ja":"定期的に話す練習をする生徒は、授業で社会問題について話し合うときに自信を持つようになる可能性が高い。","en":"Students who practice speaking regularly are likely to become confident when they discuss social issues in class."},"explain":"主語はStudentsでwho節が生徒を限定し、when節が自信を持つ場面を示す。be likely toは、要約で練習の効果を確実とは言い切らずに述べられる。別の言い方: will probably become confident"},{"id":"g2-vocab_je-211","q":"Schools should ___（選ぶ） books that teach children about different cultures.","q_ja":"学校は、子どもたちに異なる文化について教える本を選ぶべきだ。","choices":[{"t":"check","why":"「確認する」という意味で、本を選ぶことは表さない。"},{"t":"choose","why":"正解。「選ぶ」という意味で、学校で使う本を選ぶ文に合う。"},{"t":"change","why":"「変更する」という意味で、本を選ぶこととは異なる。"},{"t":"collect","why":"「集める」という意味で、目的に合う本を選ぶことは表さない。"}],"answer":1,"point":"「選ぶ」は choose。過去形は chose、過去分詞は chosen。","level":1,"accept":["select"],"drive":{"ja":"学校は、子どもたちに異なる文化について教える本を選ぶべきだ。","en":"Schools should choose books that teach children about different cultures."},"explain":"主語はSchools、動詞はchooseで、that節がbooksを説明する。should＋動詞の原形で、意見論述で学校が取るべき行動を提案できる。別の言い方: select"},{"id":"g2-vocab_je-212","q":"Local shops can ___（修理する） broken bicycles for nearby residents.","q_ja":"地元の店は、近隣住民の壊れた自転車を修理できる。","choices":[{"t":"prepare","why":"「準備する」という意味で、壊れた物を直すことは表さない。"},{"t":"remove","why":"「取り除く」という意味で、修理することとは異なる。"},{"t":"return","why":"「返す」という意味で、壊れた自転車を直すことは表さない。"},{"t":"repair","why":"正解。壊れた物を「修理する」という意味で文に合う。"}],"answer":3,"point":"壊れた機械や道具を修理するときは repair を使う。","level":1,"accept":["fix"],"drive":{"ja":"地元の店は、近隣住民の壊れた自転車を修理できる。","en":"Local shops can repair broken bicycles for nearby residents."},"explain":"主語はLocal shops、動詞はrepairで、for以下が受益者を示す。can＋動詞の原形で実行可能なことを述べ、地域の店の利点を示せる。別の言い方: fix"},{"id":"g2-vocab_je-213","q":"Communities should ___（再生利用する） empty bottles to limit household waste.","q_ja":"地域社会は、家庭ごみを抑えるために空き瓶を再生利用するべきだ。","choices":[{"t":"recycle","why":"正解。使用済みの物を資源として「再生利用する」という意味。"},{"t":"recover","why":"「回収する・取り戻す」という意味で、資源として加工することまでは表さない。"},{"t":"receive","why":"「受け取る」という意味で、再生利用することとは異なる。"},{"t":"refill","why":"「再び満たす」という意味で、中身を入れ直すことである。"}],"answer":0,"point":"recycle は使用済みの物を資源として再生利用すること。","level":1,"accept":["reprocess"],"drive":{"ja":"地域社会は、家庭ごみを抑えるために空き瓶を再生利用するべきだ。","en":"Communities should recycle empty bottles to limit household waste."},"explain":"主語はCommunities、動詞はrecycleで、to以下は目的を示す。should＋動詞の原形で対策を提案し、ごみ削減という狙いを添えられる。別の言い方: reprocess used bottles"},{"id":"g2-vocab_je-214","q":"Students can ___（借りる） computers from libraries for online lessons.","q_ja":"生徒はオンライン授業のために図書館からコンピューターを借りられる。","choices":[{"t":"lend","why":"「貸す」という意味で、借りる側である生徒の動作に合わない。"},{"t":"buy","why":"「買う」という意味で、借りることとは異なる。"},{"t":"borrow","why":"正解。borrow A from B で「ＢからＡを借りる」という意味。"},{"t":"bring","why":"「持ってくる」という意味で、借りることは表さない。"}],"answer":2,"point":"借りる側は borrow、貸す側は lend を使う。","level":1,"accept":["check out"],"drive":{"ja":"生徒はオンライン授業のために図書館からコンピューターを借りられる。","en":"Students can borrow computers from libraries for online lessons."},"explain":"主語はStudents、動詞はborrowで、from以下は借りる先を示す。canで利用可能な支援を述べ、for以下で授業という用途も示せる。別の言い方: check out computers"},{"id":"g2-vocab_je-215","q":"Quiet study areas help students ___（集中する） their homework without being disturbed by conversations.","q_ja":"静かな自習スペースは、生徒が会話に邪魔されずに宿題に集中するのに役立つ。","choices":[{"t":"concentrate in","why":"集中する対象を続けるときの前置詞は in ではなく on。"},{"t":"comment on","why":"「〜について意見を述べる」という意味で、集中することは表さない。"},{"t":"concentrate on","why":"正解。concentrate on で「〜に集中する」という意味。"},{"t":"compete for","why":"「〜を求めて競争する」という意味で、宿題に集中する文には合わない。"}],"answer":2,"point":"concentrate on の後ろに、注意を向ける対象を置く。","level":2,"accept":["focus on"],"drive":{"ja":"静かな自習スペースは、生徒が会話に邪魔されずに宿題に集中するのに役立つ。","en":"Quiet study areas help students concentrate on their homework without being disturbed by conversations."},"explain":"主語はQuiet study areas、動詞はhelpで、studentsが集中する。help＋人＋動詞の原形で環境の効果を示し、without以下で妨害のなさを添える。別の言い方: focus on"},{"id":"g2-vocab_je-216","q":"Before choosing an electricity company, families should ___（比較する） the prices of several different plans.","q_ja":"電力会社を選ぶ前に、家庭は複数の異なるプランの料金を比較するべきだ。","choices":[{"t":"compare","why":"正解。複数の料金を「比較する」という意味で文に合う。"},{"t":"calculate","why":"「計算する」という意味で、複数の料金の違いを比べることとは異なる。"},{"t":"compete","why":"「競争する」という意味で、料金を目的語にして比較する意味では使えない。"},{"t":"combine","why":"「組み合わせる」という意味で、料金の違いを比べることは表さない。"}],"answer":0,"point":"compare は、複数の物を比べて共通点や違いを調べるときに使う。","level":2,"accept":["look at the differences in"],"drive":{"ja":"電力会社を選ぶ前に、家庭は複数の異なるプランの料金を比較するべきだ。","en":"Before choosing an electricity company, families should compare the prices of several different plans."},"explain":"Before＋動名詞で時を示し、主節はfamiliesが主語、compareが動詞。shouldで比較を勧め、判断前に必要な行動を意見論述で示せる。別の言い方: examine price differences"},{"id":"g2-vocab_je-217","q":"Students from low-income families can ___（申し込む） financial aid to continue their education after high school.","q_ja":"低所得家庭の生徒は、高校卒業後も教育を受け続けるために経済的支援を申し込める。","choices":[{"t":"apply to","why":"学校や組織への出願には使えるが、求める支援を続ける場合は for を使う。"},{"t":"approve of","why":"「〜に賛成する」という意味で、支援を申し込むことは表さない。"},{"t":"appeal to","why":"「〜に訴える」という意味で、求める経済的支援を直接続ける形には合わない。"},{"t":"apply for","why":"正解。apply for で、支援や仕事などを「申し込む」という意味。"}],"answer":3,"point":"求める物には apply for、申し込む先の組織には apply to を使う。","level":2,"accept":["submit an application for"],"drive":{"ja":"低所得家庭の生徒は、高校卒業後も教育を受け続けるために経済的支援を申し込める。","en":"Students from low-income families can apply for financial aid to continue their education after high school."},"explain":"主語はStudents、動詞はapplyで、to以下は進学継続の目的を示す。apply forで求める支援を続け、教育機会を支える制度を説明できる。別の言い方: submit an application for"},{"id":"g2-vocab_je-218","q":"Fewer evening buses may ___（もたらす） longer waiting times for workers who cannot leave their offices early.","q_ja":"夜間のバスが減ると、職場を早く出られない労働者の待ち時間が長くなる可能性がある。","choices":[{"t":"result from","why":"「〜から生じる」という意味で、バスの減少と待ち時間の増加の因果関係が逆になる。"},{"t":"result in","why":"正解。「〜という結果をもたらす」という意味で、待ち時間の増加を結果として続けられる。"},{"t":"arise from","why":"「〜から生じる」という意味で、後ろに原因を置くため文の因果関係に合わない。"},{"t":"respond to","why":"「〜に対応する」という意味で、待ち時間の増加を引き起こすことは表さない。"}],"answer":1,"point":"result in の後ろは結果、result from の後ろは原因。","level":3,"accept":["cause","bring about"],"drive":{"ja":"夜間のバスが減ると、職場を早く出られない労働者の待ち時間が長くなる可能性がある。","en":"Fewer evening buses may result in longer waiting times for workers who cannot leave their offices early."},"explain":"主語はFewer evening buses、動詞はresultで、who節がworkersを説明する。mayで断定を避け、result inで施策の影響を論じられる。別の言い方: lead to"},{"id":"g2-vocab_je-219","q":"Residents should not be expected to ___（我慢する） construction noise at night just because repairs are necessary.","q_ja":"修理が必要だからといって、住民が夜間の工事の騒音を我慢することを求められるべきではない。","choices":[{"t":"put up with","why":"正解。不快な騒音などを「我慢する」という意味で文に合う。"},{"t":"catch up with","why":"「〜に追いつく」という意味で、不快な状況に耐えることは表さない。"},{"t":"come up with","why":"「〜を思いつく」という意味で、騒音を我慢する文には合わない。"},{"t":"get along with","why":"「〜とうまくやっていく」という意味で、工事の騒音を我慢する意味にはならない。"}],"answer":0,"point":"put up with は、不快なことや困難な状況を我慢するときの表現。","level":3,"accept":["tolerate","endure"],"drive":{"ja":"修理が必要だからといって、住民が夜間の工事の騒音を我慢することを求められるべきではない。","en":"Residents should not be expected to put up with construction noise at night just because repairs are necessary."},"explain":"主語はResidentsで、should not be expectedが期待されることを否定する。just becauseで理由を示し、それだけで負担を求めるべきでないと論じる。別の言い方: tolerate"},{"id":"g2-vocab_je-220","q":"After basic training, older workers may ___（〜する能力がある） using new equipment without assistance from younger colleagues.","q_ja":"基礎研修を受けた後、年配の労働者は若い同僚の助けを借りずに新しい機器を使えるかもしれない。","choices":[{"t":"be familiar with","why":"「〜に詳しい・慣れている」という意味で、自力で行う能力があることとは異なる。"},{"t":"be suitable for","why":"「〜に適している」という意味で、機器を使う能力があることは表さない。"},{"t":"be capable of","why":"正解。be capable of の後ろに動名詞を置き、「〜する能力がある」という意味を表す。"},{"t":"be concerned about","why":"「〜を心配している」という意味で、能力があることは表さない。"}],"answer":2,"point":"be capable of の of は前置詞なので、動詞を続けるときは動名詞にする。","level":3,"accept":["be skilled at","be able to handle","have been capable of"],"drive":{"ja":"基礎研修を受けた後、年配の労働者は若い同僚の助けを借りずに新しい機器を使えるかもしれない。","en":"After basic training, older workers may be capable of using new equipment without assistance from younger colleagues."},"explain":"After以下が時を示し、主語はolder workers、動詞はbe。mayで可能性を述べ、capable of＋動名詞で研修後の能力を示せる。別の言い方: be able to use new equipment"}]},"p1":{"collocation":[{"id":"p1-collocation-001","q":"Unregulated use of facial recognition could ___ a threat to civil liberties by allowing authorities to track individuals without their consent.","q_ja":"顔認証を規制なく利用すると、当局が本人の同意なく個人を追跡できるようになり、市民的自由を脅かすおそれがある。","choices":[{"t":"impose","why":"impose は義務や制限を課す場合に使い、a threat を目的語にして脅威となるとは言わない。"},{"t":"pose","why":"正解。pose a threat to は「〜への脅威となる」という組み合わせ。"},{"t":"compose","why":"compose は文章や曲を作る意味で、a threat と組み合わせて脅威となるとは言わない。"},{"t":"dispose","why":"dispose は不要物の処分などに用い、dispose a threat to という形にはならない。"}],"answer":1,"point":"pose a threat to ～ は「〜への脅威となる」。脅かされる対象を to の後に置く。","drive":{"ja":"規制のない顔認証の利用は、市民的自由への脅威となるおそれがある。「脅威となる」を英語で表しましょう。","en":"Unregulated use of facial recognition could pose a threat to civil liberties by allowing authorities to track individuals without their consent."},"level":2,"explain":"主語は顔認証の無規制利用で、couldは可能性、by以下は脅威が生じる仕組みを示す。pose a threatで、論述の懸念を具体化する。別の言い方: endanger civil liberties"},{"id":"p1-collocation-002","q":"Public campaigns should ___ awareness of misleading health claims so that consumers evaluate online advertisements more critically before purchasing expensive treatments.","q_ja":"消費者が高額な治療を購入する前にネット広告をより批判的に評価するよう、公共キャンペーンは誤解を招く健康上の宣伝への認識を高めるべきだ。","choices":[{"t":"rise","why":"rise は自動詞で、awareness を直接目的語に取って高めるという意味にはできない。"},{"t":"arise","why":"arise は問題などが生じるという自動詞で、awareness を目的語に取れない。"},{"t":"erect","why":"erect は建物などを建てる意味で、awareness と組み合わせて認識を高めるとは言わない。"},{"t":"raise","why":"正解。raise awareness of は「〜への認識を高める」という組み合わせ。"}],"answer":3,"point":"raise awareness of ～ は「〜への認識を高める」。他動詞 raise と自動詞 rise を区別する。","drive":{"ja":"公共キャンペーンは、誤解を招く健康上の宣伝への認識を高めるべきだ。「認識を高める」を英語で表しましょう。","en":"Public campaigns should raise awareness of misleading health claims so that consumers evaluate online advertisements more critically before purchasing expensive treatments."},"level":1,"explain":"主語は公共キャンペーンで、shouldで提言し、so that節で目的を示す。raise awarenessは、啓発による問題対策を論じる型。別の言い方: increase awareness"},{"id":"p1-collocation-003","q":"Subsidized childcare would ___ the financial burden on working parents, enabling more households to maintain stable employment despite rising living costs.","q_ja":"保育への補助金は働く親の経済的負担を軽減し、生活費が上昇しても、より多くの世帯が安定した雇用を維持できるようにするだろう。","choices":[{"t":"alleviate","why":"正解。alleviate the burden は「負担を軽減する」という組み合わせで、保育への補助金の効果に合う。"},{"t":"levitate","why":"levitate は空中に浮く・浮かせる意味で、経済的負担を軽減する意味にはならない。"},{"t":"allocate","why":"allocate は資金などを割り当てる意味で、負担を軽減するという文意にならない。"},{"t":"elevate","why":"elevate は高める意味で、保育への補助金が経済的負担を軽くするという文意に合わない。"}],"answer":0,"point":"alleviate the burden on ～ は「〜の負担を軽減する」。負担を受ける人を on の後に置く。","drive":{"ja":"保育への補助金は働く親の経済的負担を軽減するだろう。「負担を軽減する」を英語で表しましょう。","en":"Subsidized childcare would alleviate the financial burden on working parents, enabling more households to maintain stable employment despite rising living costs."},"level":2,"explain":"主語は補助付き保育で、wouldは予想、enabling以下はその結果を示す。alleviate the burdenで、政策が負担を軽減する利点を述べる。別の言い方: ease the burden"},{"id":"p1-collocation-004","q":"Affordable internet access could ___ the gap between urban and rural communities by expanding access to remote education and specialized medical advice.","q_ja":"手頃な料金のインターネット接続は、遠隔教育や専門的な医療助言を利用しやすくすることで、都市と農村の格差を埋める可能性がある。","choices":[{"t":"construct","why":"construct は建物や仕組みを作る意味で、the gap を目的語にして格差を埋めるとは言わない。"},{"t":"connect","why":"connect は二つの対象を結ぶ動詞で、connect the gap では格差を埋めるという自然な表現にならない。"},{"t":"bridge","why":"正解。bridge the gap between は「〜の間の隔たりを埋める」という組み合わせ。"},{"t":"establish","why":"establish は制度などを設立する意味で、格差を埋めることを表せない。"}],"answer":2,"point":"bridge the gap between A and B は「AとBの間の隔たり・格差を埋める」。","drive":{"ja":"手頃な料金のネット接続は、都市と農村の格差を埋める可能性がある。「格差を埋める」を英語で表しましょう。","en":"Affordable internet access could bridge the gap between urban and rural communities by expanding access to remote education and specialized medical advice."},"level":1,"explain":"主語は安価なネット接続で、couldは可能性、by以下は格差を埋める手段を示す。bridge the gapで、政策の格差是正効果を論じる。別の言い方: narrow the gap"},{"id":"p1-collocation-005","q":"Consumer organizations may ___ pressure on manufacturers to disclose environmental risks associated with products that contain substances harmful to local ecosystems.","q_ja":"消費者団体は、地域の生態系に有害な物質を含む製品の環境上のリスクを公表するよう、製造業者に圧力をかけることがある。","choices":[{"t":"execute","why":"execute は計画などを実行する意味で、pressure を目的語にして圧力をかけるとは言わない。"},{"t":"exert","why":"正解。exert pressure on は「〜に圧力をかける」という組み合わせ。"},{"t":"perform","why":"perform は仕事や行為を実行する意味で、pressure を目的語にして圧力をかけるとは言わない。"},{"t":"conduct","why":"conduct は調査などを実施する意味で、pressure とはこの意味で組み合わせない。"}],"answer":1,"point":"exert pressure on A to do は「Aに〜するよう圧力をかける」。","drive":{"ja":"消費者団体は、環境上のリスクを公表するよう製造業者に圧力をかけることがある。「圧力をかける」を英語で表しましょう。","en":"Consumer organizations may exert pressure on manufacturers to disclose environmental risks associated with products that contain substances harmful to local ecosystems."},"level":2,"explain":"主語は消費者団体で、mayは可能性、to以下はメーカーに求める行動を示す。exert pressureは、要約で団体の働きかけを表せる。別の言い方: put pressure on manufacturers"},{"id":"p1-collocation-006","q":"Local authorities should ___ sufficient funds to preventive maintenance, which helps avoid costly failures in aging water systems serving vulnerable communities.","q_ja":"地方自治体は、社会的に弱い立場にある人々の地域に水を供給する老朽設備の高額な故障を防ぐため、予防保全に十分な資金を配分すべきだ。","choices":[{"t":"borrow","why":"borrow は借りる意味で、borrow funds to maintenance という形で維持管理への資金配分は表せない。"},{"t":"consume","why":"consume は消費する意味で、consume funds to maintenance という配分の形にはならない。"},{"t":"accommodate","why":"accommodate は人を収容したり要求に対応したりする意味で、資金を配分する意味にはならない。"},{"t":"allocate","why":"正解。allocate funds to は「〜に資金を配分する」という組み合わせ。"}],"answer":3,"point":"allocate funds to ～ は「〜に資金を配分する」。予算の使途を説明するときに使う。","drive":{"ja":"地方自治体は、水道設備の予防保全に十分な資金を配分すべきだ。「資金を配分する」を英語で表しましょう。","en":"Local authorities should allocate sufficient funds to preventive maintenance, which helps avoid costly failures in aging water systems serving vulnerable communities."},"level":2,"explain":"主語は自治体で、shouldで提言し、which節で予防保全の効果を補足する。allocate fundsは、予算の優先配分を論じる型。別の言い方: earmark funds for maintenance"},{"id":"p1-collocation-007","q":"Publishing clear explanations of policy decisions helps ___ public trust in institutions, particularly when officials acknowledge uncertainty and respond openly to criticism.","q_ja":"政策決定の明確な説明を公表することは、とりわけ当局者が不確実性を認め、批判に率直に応じる場合、制度への国民の信頼を育む助けになる。","choices":[{"t":"foster","why":"正解。foster trust は「信頼を育む」という組み合わせで、説明や率直な対応の効果に合う。"},{"t":"harvest","why":"harvest は作物などを収穫する意味で、public trust を育むという自然な表現にはならない。"},{"t":"administer","why":"administer は制度を運営したり薬を投与したりする意味で、信頼を育む意味では使わない。"},{"t":"manufacture","why":"manufacture は製品を製造する意味で、この文で国民の信頼を育むという自然な組み合わせにはならない。"}],"answer":0,"point":"foster trust は「信頼を育む」。foster は協力や理解など抽象的なものの発展にも使う。","drive":{"ja":"政策決定を明確に説明することは、制度への国民の信頼を育む助けになる。「信頼を育む」を英語で表しましょう。","en":"Publishing clear explanations of policy decisions helps foster public trust in institutions, particularly when officials acknowledge uncertainty and respond openly to criticism."},"level":2,"explain":"説明を公表する行為が主語で、helpsが効果、when節が特に有効な状況を示す。foster trustで、透明性の利点を論じられる。別の言い方: build public trust"},{"id":"p1-collocation-008","q":"To ___ the root causes of unemployment, policymakers must examine whether existing education systems equip graduates with skills required in emerging industries.","q_ja":"失業の根本原因に対処するには、政策担当者は既存の教育制度が新興産業で必要とされる技能を卒業生に身につけさせているか検討しなければならない。","choices":[{"t":"reply","why":"reply は返答する意味で、the root causes を直接目的語に取って対処するとは言わない。"},{"t":"react","why":"react は自動詞であり、対象を示すには to が必要なので、この空所には入らない。"},{"t":"address","why":"正解。address the root causes は「根本原因に対処する」という組み合わせ。"},{"t":"cope","why":"cope は対象の前に with が必要で、the root causes を直接目的語に取れない。"}],"answer":2,"point":"address the root causes of ～ は「〜の根本原因に対処する」。address は対象を直接目的語に取る。","drive":{"ja":"失業の根本原因に対処するには、教育制度と産業で必要な技能の関係を検討しなければならない。「根本原因に対処する」を英語で表しましょう。","en":"To address the root causes of unemployment, policymakers must examine whether existing education systems equip graduates with skills required in emerging industries."},"level":2,"explain":"冒頭のTo句は目的で、政策担当者が主語、whether節は検討する内容を示す。address the root causesで、対策を原因に結びつける。別の言い方: tackle the underlying causes"},{"id":"p1-collocation-009","q":"Regulatory agencies must ___ safety standards consistently so that companies cannot gain an unfair competitive advantage by exposing workers to avoidable risks.","q_ja":"企業が労働者を回避可能な危険にさらして不当な競争上の優位を得ることがないよう、規制当局は安全基準を一貫して順守させなければならない。","choices":[{"t":"obey","why":"obey は主体自身が規則に従う意味で、規制当局が企業に順守させるという役割を表せない。"},{"t":"enforce","why":"正解。enforce safety standards は「安全基準を順守させる」という組み合わせ。"},{"t":"comply","why":"comply は with を伴って順守するという意味になり、standards を直接目的語に取れない。"},{"t":"abide","why":"abide は規則に従う意味では by を伴うため、この形では使えない。"}],"answer":1,"point":"enforce standards は「基準を順守させる」。順守する側と順守させる側の役割を区別する。","drive":{"ja":"規制当局は、企業に安全基準を一貫して順守させなければならない。「安全基準を順守させる」を英語で表しましょう。","en":"Regulatory agencies must enforce safety standards consistently so that companies cannot gain an unfair competitive advantage by exposing workers to avoidable risks."},"level":2,"explain":"主語は規制当局で、mustは義務、so that節は防ぎたい事態を示す。enforce standardsで、監督する側の役割を論じる。別の言い方: ensure compliance with safety standards"},{"id":"p1-collocation-010","q":"International negotiators must ___ a consensus on emissions targets before they can establish a reliable framework for monitoring progress across participating countries.","q_ja":"国際交渉の担当者は、参加国全体の進捗を監視する信頼性の高い枠組みを設ける前に、排出量目標について合意に達しなければならない。","choices":[{"t":"arrive","why":"arrive は合意に達する意味では at が必要で、a consensus を直接目的語に取れない。"},{"t":"conclude","why":"conclude は交渉を終えたり協定を結んだりする意味では使うが、conclude a consensus とは通常言わない。"},{"t":"attend","why":"attend は会議などに出席する意味で、a consensus と組み合わせて合意に達するとは言わない。"},{"t":"reach","why":"正解。reach a consensus on は「〜について合意に達する」という組み合わせ。"}],"answer":3,"point":"reach a consensus on ～ は「〜について合意に達する」。reach の直後に a consensus を置く。","drive":{"ja":"国際交渉の担当者は、排出量目標について合意に達しなければならない。「合意に達する」を英語で表しましょう。","en":"International negotiators must reach a consensus on emissions targets before they can establish a reliable framework for monitoring progress across participating countries."},"level":2,"explain":"主語は国際交渉の担当者で、mustは義務、before節は合意が先に必要だと示す。reach a consensusで、協力の前提を論じる。別の言い方: come to an agreement"},{"id":"p1-collocation-201","q":"By testing new materials, university teams ___ research into cheaper batteries for public transport.","q_ja":"大学の研究チームは、新素材を試験することで、公共交通向けのより安価な電池の研究を行っている。","choices":[{"t":"formulate","why":"formulateは計画や理論を練り上げるときに使い、実験によって研究を行うという組み合わせにはしない。"},{"t":"conduct","why":"正解。conduct research intoで「〜について研究を行う」となり、新素材を試験する活動に合う。"},{"t":"compile","why":"compileは資料などを集めてまとめることで、新素材を試験して研究を行うことを表さない。"},{"t":"convene","why":"conveneは会議などを招集する動詞で、研究を実施するという意味では使わない。"}],"answer":1,"point":"conduct research into＋研究対象で「〜について研究を行う」。researchはここでは不可算名詞。","level":1,"drive":{"ja":"大学の研究チームは、新素材を試験することで、公共交通向けのより安価な電池の研究を行っている。","en":"By testing new materials, university teams conduct research into cheaper batteries for public transport."},"explain":"主語はuniversity teams、動詞はconductで、By＋動名詞が手段を示す。conduct research intoは研究対象を明示でき、要約で研究活動を述べられる。別の言い方: carry out research on。"},{"id":"p1-collocation-202","q":"During severe droughts, local authorities may ___ restrictions on water use to protect essential supplies.","q_ja":"深刻な干ばつの際、地方自治体は必要不可欠な水の供給を守るため、水の使用に制限を課すことがある。","choices":[{"t":"delegate","why":"delegateは権限や仕事を委任する動詞で、住民の水使用に制限を課すとは言わない。"},{"t":"entrust","why":"entrustは仕事などを人に任せる動詞で、restrictions on water useとは組み合わせない。"},{"t":"confer","why":"conferは権利や称号などを与える動詞で、制限を課す場合には使わない。"},{"t":"impose","why":"正解。impose restrictions onで「〜に制限を課す」となり、水使用の規制を表す。"}],"answer":3,"point":"impose restrictions on＋対象で「〜に制限を課す」。imposeは税や罰を課す場合にも使う。","level":1,"drive":{"ja":"深刻な干ばつの際、地方自治体は必要不可欠な水の供給を守るため、水の使用に制限を課すことがある。","en":"During severe droughts, local authorities may impose restrictions on water use to protect essential supplies."},"explain":"主語はlocal authorities、mayが可能性、to protectが目的を示す。impose restrictions onは行政による規制を表し、論述で資源保護策を提案できる。別の言い方: place limits on。"},{"id":"p1-collocation-203","q":"Health authorities plan to ___ a nationwide campaign encouraging vaccination among older adults this winter.","q_ja":"保健当局は、この冬、高齢者に予防接種を勧める全国的なキャンペーンを開始する予定だ。","choices":[{"t":"launch","why":"正解。launch a campaignで「キャンペーンを開始する」となり、全国的な取り組みの開始を表す。"},{"t":"dispatch","why":"dispatchは人や物を派遣・発送する動詞で、キャンペーンを開始するとは言わない。"},{"t":"embark","why":"embarkは取り組みに着手する意味ではonを伴い、a campaignを直接目的語にできない。"},{"t":"enlist","why":"enlistは人の協力などを得る動詞で、キャンペーン自体を開始する意味にはならない。"}],"answer":0,"point":"launch a campaignで「キャンペーンを開始する」。政策や事業の開始にもlaunchを使える。","level":1,"drive":{"ja":"保健当局は、この冬、高齢者に予防接種を勧める全国的なキャンペーンを開始する予定だ。","en":"Health authorities plan to launch a nationwide campaign encouraging vaccination among older adults this winter."},"explain":"主語は当局、plan toが予定を示し、encouraging以下がcampaignを修飾する。launch a campaignは施策の開始を表し、要約で当局の対応を述べられる。別の言い方: start a campaign。"},{"id":"p1-collocation-204","q":"Governments need to ___ youth unemployment through training programs linked to local industries.","q_ja":"政府は、地域産業と結び付いた職業訓練プログラムを通じて、若者の失業問題に取り組む必要がある。","choices":[{"t":"mediate","why":"mediateは当事者間の争いなどを仲裁する動詞で、失業問題そのものへの対処には使わない。"},{"t":"negotiate","why":"negotiateは条件などを交渉する動詞で、失業を目的語にして対策を講じる意味にはならない。"},{"t":"tackle","why":"正解。tackle unemploymentで「失業問題に取り組む」となり、職業訓練による対策に合う。"},{"t":"intervene","why":"interveneは介入する意味の自動詞で、この形でunemploymentを直接目的語に取れない。"}],"answer":2,"point":"tackle＋問題で「問題に取り組む」。tackle unemploymentは雇用政策の論述に使える。","level":1,"drive":{"ja":"政府は、地域産業と結び付いた職業訓練プログラムを通じて、若者の失業問題に取り組む必要がある。","en":"Governments need to tackle youth unemployment through training programs linked to local industries."},"explain":"主語はGovernments、need toが必要性、linked以下が訓練の特徴を示す。tackleは解決に向けた行動を表し、論述で失業対策を求められる。別の言い方: address youth unemployment。"},{"id":"p1-collocation-205","q":"When evaluating employment policies, analysts must ___ a clear distinction between temporary job losses and lasting changes in the labor market.","q_ja":"雇用政策を評価する際、分析担当者は、一時的な雇用の喪失と労働市場の長期的な変化を明確に区別しなければならない。","choices":[{"t":"draft","why":"draftは文書などの草案を作る動詞で、二つの事柄を区別するという組み合わせにはならない。"},{"t":"draw","wh
