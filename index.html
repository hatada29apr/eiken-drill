す。孤独感への効果を理由に、英語で一文述べてください。","en":"Keeping pets gives residents a chance to enjoy company and feel less lonely."}},{"id":"g2-reason-007","q":"TOPIC: Should towns provide places where people can refill their water bottles?\nPosition: Agree","q_ja":"町は水筒に水を補給できる場所を設けるべきか。立場：賛成。","choices":[{"t":"Refill stations encourage people to reuse bottles and reduce the plastic they throw away.","why":"正解。水筒の再利用を促し、プラスチックごみを減らせるという利点が賛成を支える。"},{"t":"Towns must spend money on cleaning refill stations and checking their water regularly.","why":"維持管理の費用という負担で、設置に反対する理由になる。"},{"t":"Towns should create refill stations because providing places to refill bottles is helpful.","why":"役立つという評価だけで、具体的にどのような利点があるかを述べていない。"},{"t":"I filled my blue water bottle at the station near our park this morning.","why":"今朝の個人的な体験だけで、町全体への利点を説明していない。"},{"t":"Some refill stations have two taps and stand beside the entrances to parks.","why":"設備の形や場所という事実だけで、設置すべき理由になっていない。"},{"t":"Towns should use local photographs on the covers of their monthly community magazines.","why":"広報誌の表紙についての提案で、給水場所を設ける理由から外れている。"}],"answer":0,"point":"環境の理由では、提案によって何が減るのかを具体的に述べる。","drive":{"ja":"町に水筒への給水場所を設けることに賛成です。ごみへの影響を英語で一文述べてください。","en":"Refill stations encourage people to reuse bottles and reduce the plastic they throw away."}},{"id":"g2-reason-008","q":"TOPIC: Should schools make all homework available only through smartphone apps?\nPosition: Disagree","q_ja":"学校はすべての宿題をスマートフォンのアプリだけで配信すべきか。立場：反対。","choices":[{"t":"Homework apps allow teachers to send new tasks quickly without printing any paper.","why":"紙を印刷せず素早く配信できるという利点で、アプリだけの配信に賛成する理由になる。"},{"t":"Schools should keep other ways of giving homework because using only apps is wrong.","why":"アプリだけにするのはよくないという主張を繰り返し、理由を示していない。"},{"t":"Some teachers put homework on apps before students leave school in the afternoon.","why":"宿題の配信方法や時間という事実だけで、反対の理由を述べていない。"},{"t":"I opened our homework app on my phone while riding the bus yesterday.","why":"個人がアプリを使った出来事だけで、配信方法を限定する問題を示していない。"},{"t":"Students without smartphones may be unable to complete tasks that require these apps.","why":"正解。スマートフォンを持たない生徒が課題に取り組めなくなるおそれが、反対の理由になる。"},{"t":"Schools should choose a different song for students to sing at graduation ceremonies.","why":"卒業式の歌についての提案で、宿題の配信方法とは関係がない。"}],"answer":4,"point":"利用手段を一つに限定する提案では、それを使えない人への影響を考える。","drive":{"ja":"宿題をスマートフォンのアプリだけで配信することに反対です。端末を持たない生徒への影響を英語で一文述べてください。","en":"Students without smartphones may be unable to complete tasks that require these apps."}},{"id":"g2-reason-009","q":"TOPIC: Should neighborhoods hold events where residents repair broken household items together?\nPosition: Agree","q_ja":"地域は住民が壊れた日用品を一緒に修理する催しを開くべきか。立場：賛成。","choices":[{"t":"Repair events require skilled volunteers who may be difficult to find in some neighborhoods.","why":"技能のある協力者を探す難しさで、開催に反対する理由になる。"},{"t":"Repair events help residents save money by using household items for a longer time.","why":"正解。日用品を長く使って出費を抑えられるという一般的な利点が、賛成の理由になる。"},{"t":"My neighbor fixed my kitchen clock at an event in our community hall yesterday.","why":"一度の個人的な出来事だけで、住民全体にとっての利点を説明していない。"},{"t":"Neighborhoods should hold repair events because these events are worth having in the community.","why":"開催する価値があるという主張を繰り返すだけで、その理由がない。"},{"t":"Some repair events take place on Sunday mornings in rooms at local community centers.","why":"開催日時や場所という事実だけで、催しを開くべき理由になっていない。"},{"t":"Neighborhoods should ask residents to suggest new names for streets near the community center.","why":"通りの名前についての提案で、修理の催しを開く理由から外れている。"}],"answer":1,"point":"費用を理由にするときは、何をすることで出費が減るかを示す。","drive":{"ja":"住民が日用品を一緒に修理する催しに賛成です。家計への利点を英語で一文述べてください。","en":"Repair events help residents save money by using household items for a longer time."}},{"id":"g2-reason-010","q":"TOPIC: Should families keep the television on throughout every evening meal?\nPosition: Disagree","q_ja":"家庭では毎日の夕食中ずっとテレビをつけておくべきか。立場：反対。","choices":[{"t":"Evening television programs give family members interesting topics to discuss while eating together.","why":"会話の話題を得られるという利点で、テレビをつけることに賛成する理由になる。"},{"t":"Some families have a television on a small table beside their dining room window.","why":"テレビの置き場所という事実だけで、夕食中の視聴に反対する理由がない。"},{"t":"Families should buy larger plates when they replace the dishes in their kitchens.","why":"食器の大きさについての提案で、夕食中にテレビをつけることとは関係がない。"},{"t":"Watching television during meals reduces the attention family members give to each other.","why":"正解。家族が互いに注意を向けにくくなるという欠点が、反対の理由になる。"},{"t":"I watched a quiz show with my sister while eating dinner at home yesterday.","why":"昨日の個人的な体験だけで、夕食中の視聴の一般的な問題を示していない。"},{"t":"Families should turn off the television because keeping it on during dinner is undesirable.","why":"望ましくないという評価で主張を繰り返すだけで、その理由を説明していない。"}],"answer":3,"point":"反対の理由では、身近な習慣が人間関係に与える悪い影響も使える。","drive":{"ja":"夕食中ずっとテレビをつけておくことに反対です。家族への注意に与える影響を英語で一文述べてください。","en":"Watching television during meals reduces the attention family members give to each other."}}],"summary":[{"id":"g2-summary-001","q":"A town library has started lending tools that people rarely need, such as electric drills. Residents can borrow them instead of buying their own. This helps families spend less money and keeps fewer unused products in their homes. Borrowers must return each tool in good condition so others can use it.","q_ja":"ある町の図書館は、電動ドリルなど、めったに必要としない工具の貸し出しを始めた。住民は自分で買う代わりに借りられる。これにより家計の支出が減り、家に使わない製品がたまるのを防げる。ほかの人も使えるよう、借りた人は工具を良い状態で返す必要がある。","choices":[{"t":"Residents can borrow them instead of buying their own, and borrowers must return each tool in good condition.","why":"本文の表現をほぼそのままつないでおり、費用と不要な物を減らす効果を言い換えてまとめていない。"},{"t":"Lending electric drills helps families save money and space, provided that residents return the tools in good condition.","why":"電動ドリルという具体例を残しており、貸し出す道具全体の利点としてまとめていない。"},{"t":"Sharing equipment through libraries reduces household costs and clutter, while users are responsible for keeping borrowed items usable.","why":"正解。図書館で道具を共有すると出費や不要な物が減り、利用者には道具を良い状態で保つ責任がある。"},{"t":"Libraries lend equipment to save residents money and space, while paid workers visit homes to check borrowed items.","why":"有料の作業員が家を訪ねて道具を点検するという、本文にない仕組みを加えている。"},{"t":"Library users must bring tools back in good condition so other residents can borrow the same equipment later.","why":"返却時の状態と次の利用者への配慮だけで、家計や収納への利点が抜けている。"},{"t":"Borrowing library equipment removes all household expenses and storage problems, while every resident always returns tools without damage.","why":"費用や収納の問題がすべてなくなることや、全員が必ず無傷で返すことまでは述べていない。"}],"answer":2,"point":"貸し出しの利点と利用者の責任を残し、道具の具体例は省いて一般化する。","drive":{"ja":"次の段落の要点を英語1文で。図書館で道具を共有すると出費や不要な物が減り、利用者には道具を良い状態で保つ責任がある。","en":"Sharing equipment through libraries reduces household costs and clutter, while users are responsible for keeping borrowed items usable."}},{"id":"g2-summary-002","q":"Students at a high school grow vegetables behind their classrooms. By watering plants and checking the soil, they learn where food comes from. They also work in groups and decide how to divide the jobs. Teachers say the garden gives students useful knowledge about food and practice in working with others.","q_ja":"ある高校の生徒たちは教室の裏で野菜を育てている。水やりや土の確認を通して、食べ物がどこから来るかを学ぶ。また、グループで作業し、仕事の分担を決める。教師たちは、菜園は食べ物に関する役立つ知識と、ほかの人と協力する練習の機会を与えると話している。","choices":[{"t":"They learn where food comes from and work in groups and decide how to divide the jobs.","why":"本文の語句をほぼそのまま並べており、食の学習と協力する力の育成を言い換えていない。"},{"t":"Watering vegetables and checking the soil teach students about food, while dividing garden jobs helps them work together.","why":"水やりや土の確認という具体例を残しており、活動全体から得る学びにまとめていない。"},{"t":"Growing food at school builds knowledge and teamwork, and selling the vegetables pays for all the students' textbooks.","why":"野菜を売って生徒の教科書代をすべて払うという、本文にない内容を加えている。"},{"t":"Students learn about food by growing vegetables behind their classrooms and observing the soil as their plants develop.","why":"栽培から食について学ぶ点だけを扱い、分担して協力する力を育てる点が抜けている。"},{"t":"School gardens give every student complete knowledge of food production and prevent any disagreements during group activities.","why":"全員が食料生産を完全に理解し、意見の対立が一切なくなるという断定は本文を超えている。"},{"t":"School gardening helps students understand food production and develop the skills they need to cooperate with other people.","why":"正解。学校での栽培活動は、食料生産への理解と、ほかの人と協力する力を育てる。"}],"answer":5,"point":"複数の学習効果を拾い、作業の具体例を知識と協力する力にまとめる。","drive":{"ja":"次の段落の要点を英語1文で。学校での栽培活動は、食料生産への理解と、ほかの人と協力する力を育てる。","en":"School gardening helps students understand food production and develop the skills they need to cooperate with other people."}},{"id":"g2-summary-003","q":"Some office workers take short breaks to move around during the day. For example, they walk along a hallway for five minutes after finishing a task. Moving helps them feel less tired. However, workers need to plan these breaks carefully so that they can still complete their work on time.","q_ja":"一部の会社員は日中、体を動かすために短い休憩を取る。例えば、仕事を一つ終えた後、廊下を5分間歩く。体を動かすと疲れを感じにくくなる。ただし、時間どおりに仕事を終えられるよう、休憩を注意深く計画する必要がある。","choices":[{"t":"Brief activity breaks help employees feel refreshed, but they must manage their time to meet their work deadlines.","why":"正解。体を動かす短い休憩は気分を回復させるが、仕事の期限を守るための時間管理が必要である。"},{"t":"Moving helps them feel less tired, but workers need to plan these breaks carefully to complete their work.","why":"本文の語句をほぼそのまま使っており、休憩の効果と時間管理の必要性を言い換えていない。"},{"t":"Walking along a hallway for five minutes refreshes office workers, but their breaks require planning to avoid delays.","why":"廊下を5分間歩くという例と数字が残っており、体を動かす休憩全般にまとめていない。"},{"t":"Active breaks reduce tiredness, but employees must record their walking distance so their managers can calculate their pay.","why":"歩いた距離を記録し、上司が給与計算に使うという、本文にない内容を加えている。"},{"t":"Office workers feel less tired after moving around, and they sometimes take these breaks after completing a task.","why":"疲労を軽くする効果と休憩のタイミングだけで、仕事に遅れないための時間管理が抜けている。"},{"t":"Taking active breaks always removes tiredness completely and enables all employees to finish every task ahead of schedule.","why":"疲れが必ず完全に消え、全員がすべての仕事を早く終えるという誇張で、注意点も失われている。"}],"answer":0,"point":"However の前の利点と後の注意点を、どちらも残して要約する。","drive":{"ja":"次の段落の要点を英語1文で。体を動かす短い休憩は気分を回復させるが、仕事の期限を守るための時間管理が必要である。","en":"Brief activity breaks help employees feel refreshed, but they must manage their time to meet their work deadlines."}},{"id":"g2-summary-004","q":"A supermarket lowers the prices of food that must be eaten soon. For instance, bread is cheaper near closing time. Customers can save money by choosing these products, and the store throws away less food. However, shoppers should buy only what they can finish before it becomes unsafe to eat.","q_ja":"あるスーパーは、早く食べる必要のある食品を値下げする。例えば、閉店時刻が近づくとパンが安くなる。客はこうした商品を選んで節約でき、店も捨てる食品を減らせる。ただし、安全に食べられなくなる前に食べ切れる量だけ買うべきである。","choices":[{"t":"Customers can save money by choosing these products, and the store throws away less food, but shoppers should be careful.","why":"本文の表現をほぼ写し、注意点も曖昧にしているため、食べ切れる量という要点を適切にまとめていない。"},{"t":"Cheaper bread near closing time saves shoppers money and reduces waste, but customers should purchase only manageable amounts.","why":"閉店間際のパンという具体例を残しており、値引き食品全体の利点と注意点にまとめていない。"},{"t":"Discounted food saves money and limits waste, but stores require customers to show proof that they own refrigerators.","why":"冷蔵庫を持つ証明を店が求めるという、本文にない購入条件を加えている。"},{"t":"Lower prices help shoppers spend less, and customers can find these cheaper food products as closing time approaches.","why":"節約と値引きのタイミングだけで、食品廃棄の削減と食べ切れる量への注意が抜けている。"},{"t":"Discounting food reduces waste and shopping costs, but buyers must choose amounts they can eat before it spoils.","why":"正解。食品の値引きは廃棄と買い物費用を減らすが、安全なうちに食べ切れる量を選ぶ必要がある。"},{"t":"Reducing food prices ends all waste and lets customers buy unlimited amounts without worrying about food becoming unsafe.","why":"廃棄が完全になくなり、量や安全性を気にせず買えるという内容は、本文の注意点に反する誇張である。"}],"answer":4,"point":"値引きの二つの利点と、買い過ぎを避ける条件を一文にまとめる。","drive":{"ja":"次の段落の要点を英語1文で。食品の値引きは廃棄と買い物費用を減らすが、安全なうちに食べ切れる量を選ぶ必要がある。","en":"Discounting food reduces waste and shopping costs, but buyers must choose amounts they can eat before it spoils."}},{"id":"g2-summary-005","q":"A neighborhood group invites residents to walk in a local park each weekend. Last month, twelve people joined the walks. Participants get exercise without paying for a gym. They also have chances to talk with neighbors they did not know before, which helps people feel more connected to their community.","q_ja":"ある地域の団体は、毎週末に地元の公園を歩く活動に住民を招いている。先月は12人が参加した。参加者はジムの料金を払わずに運動できる。また、それまで知らなかった近所の人と話す機会もあり、地域とのつながりをより強く感じられる。","choices":[{"t":"Participants get exercise without paying for a gym and have chances to talk with neighbors they did not know before.","why":"本文の表現をほぼそのままつないでおり、運動と地域の人間関係という要点を言い換えていない。"},{"t":"Community walking groups offer inexpensive exercise and help residents build relationships with people who live in their area.","why":"正解。地域の歩く活動は、安く運動する機会を提供し、近所の人との関係づくりを助ける。"},{"t":"Twelve residents walked in a park last month, getting free exercise and opportunities to make friends with nearby people.","why":"参加者12人や先月の公園での活動という数字・具体例を残しており、活動の利点に絞れていない。"},{"t":"Neighborhood walks provide affordable exercise and social contact, while local doctors give each participant a free health check afterward.","why":"活動後に医師が参加者全員を無料で診察するという、本文にない内容を加えている。"},{"t":"Residents exercise without gym fees by walking together in a local park during activities organized by a neighborhood group.","why":"費用をかけずに運動できる点と活動場所だけで、近所の人とのつながりを深める点が抜けている。"},{"t":"Community walking groups make every resident physically fit and ensure that nobody in the neighborhood ever feels lonely again.","why":"住民全員が健康になり、誰も二度と孤独を感じないという効果は本文を超える断定である。"}],"answer":1,"point":"参加人数や場所の例を省き、運動面と人間関係の両方の利点を残す。","drive":{"ja":"次の段落の要点を英語1文で。地域の歩く活動は、安く運動する機会を提供し、近所の人との関係づくりを助ける。","en":"Community walking groups offer inexpensive exercise and help residents build relationships with people who live in their area."}},{"id":"g2-summary-006","q":"A community center teaches people to repair clothes rather than throw them away. In one lesson, visitors learn to replace buttons on shirts. These skills allow people to use clothes longer and spend less on new ones. The classes also help reduce the amount of clothing that ends up in the rubbish.","q_ja":"ある公民館では、服を捨てずに修理する方法を教えている。ある授業では、参加者はシャツのボタンを付け替える方法を学ぶ。こうした技能があれば服を長く使え、新しい服への支出も減らせる。講座は、ごみになる衣服の量を減らすことにも役立つ。","choices":[{"t":"These skills allow people to use clothes longer and spend less on new ones, and the classes also reduce rubbish.","why":"本文の語句をほぼそのままつないでおり、修理の効果を自分の表現でまとめていない。"},{"t":"Replacing buttons on shirts helps people wear clothing longer, spend less on replacements, and throw fewer clothes away.","why":"シャツのボタンの付け替えという具体例を残しており、衣服の修理全体の効果にまとめていない。"},{"t":"Repair lessons reduce clothing costs and waste, and participants receive free sewing machines to continue their work at home.","why":"自宅で使うミシンを参加者が無料でもらえるという、本文にない内容を加えている。"},{"t":"Learning to mend clothing extends its use, lowers replacement costs, and decreases the amount of material thrown away.","why":"正解。衣服の修理を学ぶと、服を長く使え、買い替え費用と捨てる量を減らせる。"},{"t":"People learn to mend clothing at a community center and keep wearing their old clothes for a longer period.","why":"学ぶ場所と長く着られる点だけで、購入費用と衣服のごみを減らす点が抜けている。"},{"t":"Clothing repair classes remove the need to buy any new clothes and completely stop clothing waste throughout the community.","why":"新しい服が一切不要になり、地域の衣服のごみが完全になくなるという誇張である。"}],"answer":3,"point":"具体的な修理方法を省き、長期使用・節約・廃棄削減という効果を残す。","drive":{"ja":"次の段落の要点を英語1文で。衣服の修理を学ぶと、服を長く使え、買い替え費用と捨てる量を減らせる。","en":"Learning to mend clothing extends its use, lowers replacement costs, and decreases the amount of material thrown away."}},{"id":"g2-summary-007","q":"Online lessons let students study without traveling to a school. One student who lives far away can attend an evening class from home. However, some learners find it difficult to ask questions through a screen. Teachers may need to set aside extra time to check whether everyone understands the lesson.","q_ja":"オンライン授業なら、生徒は学校に通わずに学べる。遠くに住むある生徒も、自宅から夜の授業に参加できる。ただし、画面越しに質問するのは難しいと感じる学習者もいる。教師は全員が授業を理解しているか確かめるため、追加の時間を設ける必要があるかもしれない。","choices":[{"t":"Students study without traveling to a school, but teachers may need to set aside extra time to check understanding.","why":"本文の表現をほぼ写しており、質問の難しさと理解確認の関係を言い換えてまとめていない。"},{"t":"An evening class lets a distant student learn at home, but asking questions online may require extra teacher support.","why":"遠方の生徒が自宅で夜の授業を受けるという具体例を残しており、授業全体の特徴にまとめていない。"},{"t":"Online classes save travel time, but teachers must visit students' homes every week to check their progress in person.","why":"教師が毎週家庭訪問をして対面で学習状況を確認するという、本文にない対応を加えている。"},{"t":"Students attend classes without traveling to school and can join evening lessons while staying in their own homes.","why":"通学せずに受講できる点と自宅での受講だけで、質問の難しさと教師の対応が抜けている。"},{"t":"Online learning makes questions impossible for every student and forces teachers to explain every lesson again to everyone.","why":"全員が質問できず、すべての授業の説明をやり直す必要があるという断定は本文を超えている。"},{"t":"Remote classes avoid travel, but communication difficulties may require teachers to spend more time checking their students' understanding.","why":"正解。オンライン授業は通学を不要にするが、意思疎通の難しさから理解の確認に追加の時間が必要な場合がある。"}],"answer":5,"point":"便利さだけで終えず、意思疎通の難しさと必要になり得る対応も残す。","drive":{"ja":"次の段落の要点を英語1文で。オンライン授業は通学を不要にするが、意思疎通の難しさから理解の確認に追加の時間が必要な場合がある。","en":"Remote classes avoid travel, but communication difficulties may require teachers to spend more time checking their students' understanding."}},{"id":"g2-summary-008","q":"A bus company has placed screens at busy stops to show when buses will arrive. For example, a passenger can see that the next bus is eight minutes away. This makes waiting less stressful. However, the information depends on an internet connection, so the screens may stop updating when the connection fails.","q_ja":"あるバス会社は、到着時刻を表示する画面を利用者の多い停留所に設置した。例えば、次のバスがあと8分で来ると確認できる。これにより待つときの不安が軽くなる。ただし、情報の表示にはインターネット接続が必要なため、接続に不具合があると更新が止まることがある。","choices":[{"t":"This makes waiting less stressful, but the screens may stop updating when the connection fails at busy bus stops.","why":"本文の表現をほぼそのままつないでおり、表示の効果と情報更新の弱点を言い換えていない。"},{"t":"A screen showing an eight minute wait reduces passenger stress, but an internet failure can stop its information updates.","why":"8分待ちという数字と表示例が残っており、到着案内の効果と弱点にまとめていない。"},{"t":"Arrival displays ease passengers' worries while waiting, but connection problems can prevent them from receiving current bus information.","why":"正解。到着案内の表示は待つ不安を和らげるが、通信の問題で最新のバス情報を得られなくなる場合がある。"},{"t":"Bus arrival screens reduce waiting worries, but passengers must pay a small charge whenever they check the displayed times.","why":"到着時刻を確認するたびに利用者が料金を払うという、本文にない条件を加えている。"},{"t":"Passengers feel less worried because screens at busy stops show them when the buses they need will arrive.","why":"到着情報による安心だけで、通信障害によって更新が止まる可能性が抜けている。"},{"t":"Arrival screens completely remove waiting stress and always provide correct bus times even when their internet connection stops working.","why":"不安が完全になくなり、接続が止まっても常に正確な時刻を示すという内容は本文に反する。"}],"answer":2,"point":"機器の利点と、動作に必要な条件が失われた場合の問題をまとめる。","drive":{"ja":"次の段落の要点を英語1文で。到着案内の表示は待つ不安を和らげるが、通信の問題で最新のバス情報を得られなくなる場合がある。","en":"Arrival displays ease passengers' worries while waiting, but connection problems can prevent them from receiving current bus information."}},{"id":"g2-summary-009","q":"An apartment building has a shelf where residents leave books they have finished reading. Last week, someone added three travel books. Other residents can take books without paying and return them when they finish. By passing books around, people enjoy different stories without buying new copies, and fewer books are thrown away.","q_ja":"ある集合住宅には、読み終えた本を住民が置く棚がある。先週は誰かが旅行の本を3冊置いた。ほかの住民は無料で本を持っていき、読み終えたら返せる。本を回し読みすることで、新しく買わずにさまざまな物語を楽しめ、捨てられる本も減る。","choices":[{"t":"Sharing books among neighbors provides reading variety at no cost and reduces the number of books people discard.","why":"正解。住民同士で本を共有すると、無料でさまざまな本を読め、捨てる本の数も減らせる。"},{"t":"People enjoy different stories without buying new copies, and fewer books are thrown away by residents passing books around.","why":"本文の表現をほぼそのまま使っており、本の共有による読書と廃棄削減の利点を言い換えていない。"},{"t":"Sharing three travel books on an apartment shelf lets residents read for free and keeps books out of rubbish.","why":"旅行の本3冊という具体例と数字を残しており、本の共有全体の効果にまとめていない。"},{"t":"Book sharing offers free reading and cuts waste, while publishers send new books to the building each month.","why":"出版社が毎月新しい本を住宅に送るという、本文にない仕組みを加えている。"},{"t":"Residents borrow books without paying from a shelf in their building and put them back after they finish reading.","why":"無料で借りて返す仕組みだけで、さまざまな本を読める点と廃棄を減らす点が抜けている。"},{"t":"Sharing books means residents never need to purchase any books again and prevents every book from being thrown away.","why":"今後一切本を買う必要がなくなり、すべての本の廃棄を防げるという誇張である。"}],"answer":0,"point":"冊数や本の種類を省き、多様な読書・費用・廃棄量への効果をまとめる。","drive":{"ja":"次の段落の要点を英語1文で。住民同士で本を共有すると、無料でさまざまな本を読め、捨てる本の数も減らせる。","en":"Sharing books among neighbors provides reading variety at no cost and reduces the number of books people discard."}},{"id":"g2-summary-010","q":"A youth center offers cooking lessons for teenagers. In one class, students make vegetable soup using simple ingredients. They learn to prepare meals instead of depending on ready meals from shops. They also practice choosing different kinds of food, which helps them plan meals that support their health when they live on their own.","q_ja":"ある青少年センターは10代の若者に料理教室を開いている。ある授業では、簡単な材料で野菜スープを作る。生徒は店の調理済み食品に頼らず食事を作ることを学ぶ。また、さまざまな種類の食品を選ぶ練習をし、将来一人で暮らすときに健康を支える献立を考えるのに役立てる。","choices":[{"t":"They learn to prepare meals instead of depending on ready meals from shops and practice choosing different kinds of food.","why":"本文の語句をほぼそのままつないでおり、自立後の食生活に役立つという要旨を言い換えていない。"},{"t":"Making vegetable soup with simple ingredients helps teenagers cook for themselves and select healthy meals when living on their own.","why":"野菜スープと簡単な材料という具体例が残っており、料理教室で身につける力全体にまとめていない。"},{"t":"Cooking lessons teach teenagers independent meal preparation and healthy choices, while the center delivers free ingredients to their homes weekly.","why":"センターが毎週材料を無料で自宅に届けるという、本文にないサービスを加えている。"},{"t":"Teenagers practice preparing their own meals at a youth center so they can depend less on food bought from shops.","why":"自分で調理して市販食品への依存を減らす点だけで、健康に配慮して食品を選ぶ力が抜けている。"},{"t":"Cooking classes prepare teenagers to feed themselves and make healthy food choices when they begin living independently.","why":"正解。料理教室は、若者が自立して暮らす際に、自分で食事を作り健康的な食品を選ぶ力を育てる。"},{"t":"Cooking lessons ensure that all teenagers always eat perfectly healthy meals and never need to buy any prepared food again.","why":"全員が常に完全に健康的な食事をし、調理済み食品を一切買わなくなるという断定は本文を超えている。"}],"answer":4,"point":"料理の具体例を省き、自分で作る力と健康的に選ぶ力を残す。","drive":{"ja":"次の段落の要点を英語1文で。料理教室は、若者が自立して暮らす際に、自分で食事を作り健康的な食品を選ぶ力を育てる。","en":"Cooking classes prepare teenagers to feed themselves and make healthy food choices when they begin living independently."}}],"template":[{"id":"g2-template-001","q":"I ___ that schools should provide more chances to learn about nature.","q_ja":"私は、学校は自然について学ぶ機会をもっと提供すべきだという意見に賛成です。","choices":[{"t":"agree to","why":"that 節を続けるこの形では、agree の後に to を置かない。"},{"t":"agreement","why":"agreement は名詞で、ここに必要な動詞ではない。"},{"t":"agree","why":"正解。I agree that ... で、続く意見への賛成を示す。"},{"t":"agree with","why":"agree with の後には通常、人や意見を表す名詞を置き、ここでは that 節を直接続けない。"}],"answer":2,"point":"I agree that＋主語＋動詞で賛成する内容を述べる。","drive":{"ja":"私は、学校は自然について学ぶ機会をもっと提供すべきだという意見に賛成です。","en":"I agree that schools should provide more chances to learn about nature."}},{"id":"g2-template-002","q":"I ___ that children should spend all their free time studying.","q_ja":"私は、子どもは自由な時間をすべて勉強に使うべきだという意見に反対です。","choices":[{"t":"disagreement","why":"disagreement は名詞で、主語 I に続く動詞ではない。"},{"t":"disagree to","why":"that 節を続けるときは disagree の後に to を置かない。"},{"t":"disagree with","why":"disagree with の後には通常、人や意見を表す名詞を置く。"},{"t":"disagree","why":"正解。I disagree that ... で、勉強にすべての自由時間を使うことへの反対を示す。"}],"answer":3,"point":"I disagree that ... で、続く意見への反対を示す。","drive":{"ja":"私は、子どもは自由な時間をすべて勉強に使うべきだという意見に反対です。","en":"I disagree that children should spend all their free time studying."}},{"id":"g2-template-003","q":"For these two ___, I believe that towns should protect their old buildings.","q_ja":"これらの二つの理由から、私は町が古い建物を守るべきだと考えます。","choices":[{"t":"reasons","why":"正解。two の後に複数形 reasons を置き、二つの理由から結論を導く。"},{"t":"reason","why":"two の後の可算名詞は複数形 reasons にする。"},{"t":"reasoning","why":"reasoning は推論という意味で、ここで two に続けて理由を数える形にはできない。"},{"t":"reasonable","why":"reasonable は形容詞で、two の後に必要な名詞ではない。"}],"answer":0,"point":"For these two reasons, ... で二つの理由をまとめて結論を述べる。","drive":{"ja":"これらの二つの理由から、私は町が古い建物を守るべきだと考えます。","en":"For these two reasons, I believe that towns should protect their old buildings."}},{"id":"g2-template-004","q":"In ___, I think that students should have time to relax after school.","q_ja":"結論として、私は生徒には放課後にくつろぐ時間が必要だと考えます。","choices":[{"t":"conclude","why":"conclude は動詞で、In の後に必要な名詞ではない。"},{"t":"conclusion","why":"正解。In conclusion は「結論として」を表す。"},{"t":"conclusive","why":"conclusive は形容詞で、In conclusion の形にならない。"},{"t":"concluding","why":"In concluding では、ここで必要な「結論として」という定型表現にならない。"}],"answer":1,"point":"結論を導く定型表現は In conclusion, ...。","drive":{"ja":"結論として、私は生徒には放課後にくつろぐ時間が必要だと考えます。","en":"In conclusion, I think that students should have time to relax after school."}},{"id":"g2-template-005","q":"In my ___, cities should make sidewalks safer for older people.","q_ja":"私の意見では、都市は高齢者にとって歩道をもっと安全にすべきです。","choices":[{"t":"opinionated","why":"opinionated は自分の意見を曲げないという意味の形容詞。"},{"t":"opinions","why":"この定型表現では複数形ではなく、単数形 opinion を使う。"},{"t":"opine","why":"opine は動詞で、my の後に必要な名詞ではない。"},{"t":"opinion","why":"正解。In my opinion は「私の意見では」を表す。"}],"answer":3,"point":"In my opinion, ... で、自分の立場を文頭に示す。","drive":{"ja":"私の意見では、都市は高齢者にとって歩道をもっと安全にすべきです。","en":"In my opinion, cities should make sidewalks safer for older people."}},{"id":"g2-template-006","q":"I would ___ to explain why schools should teach basic cooking skills.","q_ja":"私は、学校が基本的な調理の技術を教えるべき理由を説明したいと思います。","choices":[{"t":"like","why":"正解。would like to do は「〜したいと思う」を表す。"},{"t":"liking","why":"would の直後には動詞の原形を置く。"},{"t":"liked","why":"would の直後には過去形ではなく原形を置く。"},{"t":"likes","why":"would の後には三人称単数現在形ではなく原形を置く。"}],"answer":0,"point":"I would like to explain why ... で、理由の説明を始められる。","drive":{"ja":"私は、学校が基本的な調理の技術を教えるべき理由を説明したいと思います。","en":"I would like to explain why schools should teach basic cooking skills."}},{"id":"g2-template-007","q":"I am ___ that learning about other cultures is important for students.","q_ja":"私は、異文化について学ぶことは生徒にとって重要だと確信しています。","choices":[{"t":"convince","why":"am の後に原形 convince をそのまま置けない。"},{"t":"conviction","why":"conviction は名詞で、I am conviction とは言わない。"},{"t":"convinced","why":"正解。I am convinced that ... で、確信している内容を示す。"},{"t":"convincingly","why":"convincingly は副詞で、ここで必要な状態を表せない。"}],"answer":2,"point":"I am convinced that ... は強い確信を示す序論や結論の表現。","drive":{"ja":"私は、異文化について学ぶことは生徒にとって重要だと確信しています。","en":"I am convinced that learning about other cultures is important for students."}},{"id":"g2-template-008","q":"There ___ two main reasons why local libraries should stay open longer.","q_ja":"地域の図書館が開館時間を延ばすべき主な理由は二つあります。","choices":[{"t":"is","why":"後ろの two main reasons が複数なので is は使わない。"},{"t":"are","why":"正解。複数の理由を導くので There are を使う。"},{"t":"be","why":"現在形の文を作るには原形 be ではなく are が必要。"},{"t":"being","why":"being だけではこの文の述語を作れない。"}],"answer":1,"point":"There are two main reasons why ... で二つの理由を予告する。","drive":{"ja":"地域の図書館が開館時間を延ばすべき主な理由は二つあります。","en":"There are two main reasons why local libraries should stay open longer."}},{"id":"g2-template-009","q":"___ up, I believe that schools should give students more time for exercise.","q_ja":"要するに、私は学校が生徒にもっと運動する時間を与えるべきだと考えます。","choices":[{"t":"To summed","why":"to の後に過去形 summed は置かない。"},{"t":"To summary","why":"summary は名詞で、ここで必要な不定詞にならない。"},{"t":"To summing","why":"不定詞の to の後に動名詞 summing は置かない。"},{"t":"To sum","why":"正解。To sum up は「要するに」を表し、結論を導く。"}],"answer":3,"point":"To sum up, ... で、それまでの議論をまとめる。","drive":{"ja":"要するに、私は学校が生徒にもっと運動する時間を与えるべきだと考えます。","en":"To sum up, I believe that schools should give students more time for exercise."}},{"id":"g2-template-010","q":"I ___ the view that children should learn how to manage money.","q_ja":"私は、子どもはお金の管理方法を学ぶべきだという意見を支持します。","choices":[{"t":"support","why":"正解。support the view that ... で、続く意見を支持する。"},{"t":"support to","why":"support は他動詞なので、目的語 the view の前に to は不要。"},{"t":"support for","why":"動詞 support の目的語の前に for は置かない。"},{"t":"support with","why":"support the view という組み合わせに with は入れない。"}],"answer":0,"point":"I support the view that ... で、支持する立場を述べる。","drive":{"ja":"私は、子どもはお金の管理方法を学ぶべきだという意見を支持します。","en":"I support the view that children should learn how to manage money."}}]},"p1":{"collocation":[{"id":"p1-collocation-001","q":"Unregulated use of facial recognition could ___ a threat to civil liberties by allowing authorities to track individuals without their consent.","q_ja":"顔認証を規制なく利用すると、当局が本人の同意なく個人を追跡できるようになり、市民的自由を脅かすおそれがある。","choices":[{"t":"impose","why":"impose は義務や制限を課す場合に使い、a threat を目的語にして脅威となるとは言わない。"},{"t":"pose","why":"正解。pose a threat to は「〜への脅威となる」という組み合わせ。"},{"t":"compose","why":"compose は文章や曲を作る意味で、a threat と組み合わせて脅威となるとは言わない。"},{"t":"dispose","why":"dispose は不要物の処分などに用い、dispose a threat to という形にはならない。"}],"answer":1,"point":"pose a threat to ～ は「〜への脅威となる」。脅かされる対象を to の後に置く。","drive":{"ja":"規制のない顔認証の利用は、市民的自由への脅威となるおそれがある。「脅威となる」を英語で表しましょう。","en":"Unregulated use of facial recognition could pose a threat to civil liberties by allowing authorities to track individuals without their consent."}},{"id":"p1-collocation-002","q":"Public campaigns should ___ awareness of misleading health claims so that consumers evaluate online advertisements more critically before purchasing expensive treatments.","q_ja":"消費者が高額な治療を購入する前にネット広告をより批判的に評価するよう、公共キャンペーンは誤解を招く健康上の宣伝への認識を高めるべきだ。","choices":[{"t":"rise","why":"rise は自動詞で、awareness を直接目的語に取って高めるという意味にはできない。"},{"t":"arise","why":"arise は問題などが生じるという自動詞で、awareness を目的語に取れない。"},{"t":"erect","why":"erect は建物などを建てる意味で、awareness と組み合わせて認識を高めるとは言わない。"},{"t":"raise","why":"正解。raise awareness of は「〜への認識を高める」という組み合わせ。"}],"answer":3,"point":"raise awareness of ～ は「〜への認識を高める」。他動詞 raise と自動詞 rise を区別する。","drive":{"ja":"公共キャンペーンは、誤解を招く健康上の宣伝への認識を高めるべきだ。「認識を高める」を英語で表しましょう。","en":"Public campaigns should raise awareness of misleading health claims so that consumers evaluate online advertisements more critically before purchasing expensive treatments."}},{"id":"p1-collocation-003","q":"Subsidized childcare would ___ the financial burden on working parents, enabling more households to maintain stable employment despite rising living costs.","q_ja":"保育への補助金は働く親の経済的負担を軽減し、生活費が上昇しても、より多くの世帯が安定した雇用を維持できるようにするだろう。","choices":[{"t":"alleviate","why":"正解。alleviate the burden は「負担を軽減する」という組み合わせで、保育への補助金の効果に合う。"},{"t":"levitate","why":"levitate は空中に浮く・浮かせる意味で、経済的負担を軽減する意味にはならない。"},{"t":"allocate","why":"allocate は資金などを割り当てる意味で、負担を軽減するという文意にならない。"},{"t":"elevate","why":"elevate は高める意味で、保育への補助金が経済的負担を軽くするという文意に合わない。"}],"answer":0,"point":"alleviate the burden on ～ は「〜の負担を軽減する」。負担を受ける人を on の後に置く。","drive":{"ja":"保育への補助金は働く親の経済的負担を軽減するだろう。「負担を軽減する」を英語で表しましょう。","en":"Subsidized childcare would alleviate the financial burden on working parents, enabling more households to maintain stable employment despite rising living costs."}},{"id":"p1-collocation-004","q":"Affordable internet access could ___ the gap between urban and rural communities by expanding access to remote education and specialized medical advice.","q_ja":"手頃な料金のインターネット接続は、遠隔教育や専門的な医療助言を利用しやすくすることで、都市と農村の格差を埋める可能性がある。","choices":[{"t":"construct","why":"construct は建物や仕組みを作る意味で、the gap を目的語にして格差を埋めるとは言わない。"},{"t":"connect","why":"connect は二つの対象を結ぶ動詞で、connect the gap では格差を埋めるという自然な表現にならない。"},{"t":"bridge","why":"正解。bridge the gap between は「〜の間の隔たりを埋める」という組み合わせ。"},{"t":"establish","why":"establish は制度などを設立する意味で、格差を埋めることを表せない。"}],"answer":2,"point":"bridge the gap between A and B は「AとBの間の隔たり・格差を埋める」。","drive":{"ja":"手頃な料金のネット接続は、都市と農村の格差を埋める可能性がある。「格差を埋める」を英語で表しましょう。","en":"Affordable internet access could bridge the gap between urban and rural communities by expanding access to remote education and specialized medical advice."}},{"id":"p1-collocation-005","q":"Consumer organizations may ___ pressure on manufacturers to disclose environmental risks associated with products that contain substances harmful to local ecosystems.","q_ja":"消費者団体は、地域の生態系に有害な物質を含む製品の環境上のリスクを公表するよう、製造業者に圧力をかけることがある。","choices":[{"t":"execute","why":"execute は計画などを実行する意味で、pressure を目的語にして圧力をかけるとは言わない。"},{"t":"exert","why":"正解。exert pressure on は「〜に圧力をかける」という組み合わせ。"},{"t":"perform","why":"perform は仕事や行為を実行する意味で、pressure を目的語にして圧力をかけるとは言わない。"},{"t":"conduct","why":"conduct は調査などを実施する意味で、pressure とはこの意味で組み合わせない。"}],"answer":1,"point":"exert pressure on A to do は「Aに〜するよう圧力をかける」。","drive":{"ja":"消費者団体は、環境上のリスクを公表するよう製造業者に圧力をかけることがある。「圧力をかける」を英語で表しましょう。","en":"Consumer organizations may exert pressure on manufacturers to disclose environmental risks associated with products that contain substances harmful to local ecosystems."}},{"id":"p1-collocation-006","q":"Local authorities should ___ sufficient funds to preventive maintenance, which helps avoid costly failures in aging water systems serving vulnerable communities.","q_ja":"地方自治体は、社会的に弱い立場にある人々の地域に水を供給する老朽設備の高額な故障を防ぐため、予防保全に十分な資金を配分すべきだ。","choices":[{"t":"borrow","why":"borrow は借りる意味で、borrow funds to maintenance という形で維持管理への資金配分は表せない。"},{"t":"consume","why":"consume は消費する意味で、consume funds to maintenance という配分の形にはならない。"},{"t":"accommodate","why":"accommodate は人を収容したり要求に対応したりする意味で、資金を配分する意味にはならない。"},{"t":"allocate","why":"正解。allocate funds to は「〜に資金を配分する」という組み合わせ。"}],"answer":3,"point":"allocate funds to ～ は「〜に資金を配分する」。予算の使途を説明するときに使う。","drive":{"ja":"地方自治体は、水道設備の予防保全に十分な資金を配分すべきだ。「資金を配分する」を英語で表しましょう。","en":"Local authorities should allocate sufficient funds to preventive maintenance, which helps avoid costly failures in aging water systems serving vulnerable communities."}},{"id":"p1-collocation-007","q":"Publishing clear explanations of policy decisions helps ___ public trust in institutions, particularly when officials acknowledge uncertainty and respond openly to criticism.","q_ja":"政策決定の明確な説明を公表することは、とりわけ当局者が不確実性を認め、批判に率直に応じる場合、制度への国民の信頼を育む助けになる。","choices":[{"t":"foster","why":"正解。foster trust は「信頼を育む」という組み合わせで、説明や率直な対応の効果に合う。"},{"t":"harvest","why":"harvest は作物などを収穫する意味で、public trust を育むという自然な表現にはならない。"},{"t":"administer","why":"administer は制度を運営したり薬を投与したりする意味で、信頼を育む意味では使わない。"},{"t":"manufacture","why":"manufacture は製品を製造する意味で、この文で国民の信頼を育むという自然な組み合わせにはならない。"}],"answer":0,"point":"foster trust は「信頼を育む」。foster は協力や理解など抽象的なものの発展にも使う。","drive":{"ja":"政策決定を明確に説明することは、制度への国民の信頼を育む助けになる。「信頼を育む」を英語で表しましょう。","en":"Publishing clear explanations of policy decisions helps foster public trust in institutions, particularly when officials acknowledge uncertainty and respond openly to criticism."}},{"id":"p1-collocation-008","q":"To ___ the root causes of unemployment, policymakers must examine whether existing education systems equip graduates with skills required in emerging industries.","q_ja":"失業の根本原因に対処するには、政策担当者は既存の教育制度が新興産業で必要とされる技能を卒業生に身につけさせているか検討しなければならない。","choices":[{"t":"reply","why":"reply は返答する意味で、the root causes を直接目的語に取って対処するとは言わない。"},{"t":"react","why":"react は自動詞であり、対象を示すには to が必要なので、この空所には入らない。"},{"t":"address","why":"正解。address the root causes は「根本原因に対処する」という組み合わせ。"},{"t":"cope","why":"cope は対象の前に with が必要で、the root causes を直接目的語に取れない。"}],"answer":2,"point":"address the root causes of ～ は「〜の根本原因に対処する」。address は対象を直接目的語に取る。","drive":{"ja":"失業の根本原因に対処するには、教育制度と産業で必要な技能の関係を検討しなければならない。「根本原因に対処する」を英語で表しましょう。","en":"To address the root causes of unemployment, policymakers must examine whether existing education systems equip graduates with skills required in emerging industries."}},{"id":"p1-collocation-009","q":"Regulatory agencies must ___ safety standards consistently so that companies cannot gain an unfair competitive advantage by exposing workers to avoidable risks.","q_ja":"企業が労働者を回避可能な危険にさらして不当な競争上の優位を得ることがないよう、規制当局は安全基準を一貫して順守させなければならない。","choices":[{"t":"obey","why":"obey は主体自身が規則に従う意味で、規制当局が企業に順守させるという役割を表せない。"},{"t":"enforce","why":"正解。enforce safety standards は「安全基準を順守させる」という組み合わせ。"},{"t":"comply","why":"comply は with を伴って順守するという意味になり、standards を直接目的語に取れない。"},{"t":"abide","why":"abide は規則に従う意味では by を伴うため、この形では使えない。"}],"answer":1,"point":"enforce standards は「基準を順守させる」。順守する側と順守させる側の役割を区別する。","drive":{"ja":"規制当局は、企業に安全基準を一貫して順守させなければならない。「安全基準を順守させる」を英語で表しましょう。","en":"Regulatory agencies must enforce safety standards consistently so that companies cannot gain an unfair competitive advantage by exposing workers to avoidable risks."}},{"id":"p1-collocation-010","q":"International negotiators must ___ a consensus on emissions targets before they can establish a reliable framework for monitoring progress across participating countries.","q_ja":"国際交渉の担当者は、参加国全体の進捗を監視する信頼性の高い枠組みを設ける前に、排出量目標について合意に達しなければならない。","choices":[{"t":"arrive","why":"arrive は合意に達する意味では at が必要で、a consensus を直接目的語に取れない。"},{"t":"conclude","why":"conclude は交渉を終えたり協定を結んだりする意味では使うが、conclude a consensus とは通常言わない。"},{"t":"attend","why":"attend は会議などに出席する意味で、a consensus と組み合わせて合意に達するとは言わない。"},{"t":"reach","why":"正解。reach a consensus on は「〜について合意に達する」という組み合わせ。"}],"answer":3,"point":"reach a consensus on ～ は「〜について合意に達する」。reach の直後に a consensus を置く。","drive":{"ja":"国際交渉の担当者は、排出量目標について合意に達しなければならない。「合意に達する」を英語で表しましょう。","en":"International negotiators must reach a consensus on emissions targets before they can establish a reliable framework for monitoring progress across participating countries."}}],"connector":[{"id":"p1-connector-001","q":"The independent review found that the proposed surveillance system would seriously threaten citizens' privacy. ___, the government approved its installation without introducing any additional safeguards against potential abuse.","q_ja":"独立した審査は、提案された監視システムが市民のプライバシーを深刻に脅かすと判断した。それにもかかわらず、政府は悪用を防ぐ追加措置を一切導入せずに設置を承認した。","choices":[{"t":"Nevertheless","why":"正解。プライバシーへの深刻な脅威が判明したのに承認したという、予想に反する展開を示す。"},{"t":"Consequently","why":"「その結果」では、脅威の指摘が保護措置なしの承認につながるという不自然な因果関係になる。"},{"t":"For instance","why":"後文は監視がプライバシーを脅かす具体例ではなく、政府の決定を述べている。"},{"t":"Similarly","why":"「同様に」は共通する傾向を示すが、後文は審査結果に反する対応を述べている。"}],"answer":0,"point":"Nevertheless は、前文から予想される展開に反する事実を「それにもかかわらず」と導く。","drive":{"ja":"監視によるプライバシーへの脅威が判明した。それにもかかわらず政府は承認した。この逆接を英語で表しましょう。","en":"The independent review found that the proposed surveillance system would seriously threaten citizens' privacy. Nevertheless, the government approved its installation without introducing any additional safeguards against potential abuse."}},{"id":"p1-connector-002","q":"Repeated droughts have reduced agricultural production across the region, leaving many farmers unable to repay their loans. ___, the government has introduced emergency financial assistance to prevent widespread bankruptcies in rural communities.","q_ja":"度重なる干ばつで地域全体の農業生産が減り、多くの農家が融資を返済できなくなった。その結果、政府は農村地域での相次ぐ破産を防ぐため、緊急の資金援助を導入した。","choices":[{"t":"Conversely","why":"「逆に」は反対の関係を示すが、後文は農家の窮状を受けた対応である。"},{"t":"For example","why":"政府の資金援助は、生産減少や返済困難そのものの具体例ではない。"},{"t":"Consequently","why":"正解。干ばつによる経済的な困難を原因として、政府が支援を導入した結果を示す。"},{"t":"Nevertheless","why":"農家の窮状に対する緊急援助は自然な対応であり、予想に反する展開ではない。"}],"answer":2,"point":"Consequently は、前文の状況が原因となって生じた結果や対応を導く。","drive":{"ja":"干ばつで農家が返済困難になった。その結果、政府は緊急援助を導入した。この因果関係を英語で表しましょう。","en":"Repeated droughts have reduced agricultural production across the region, leaving many farmers unable to repay their loans. Consequently, the government has introduced emergency financial assistance to prevent widespread bankruptcies in rural communities."}},{"id":"p1-connector-003","q":"When demand for rental housing rises while supply remains unchanged, rents generally increase throughout the affected area. ___, when demand falls while supply remains unchanged, landlords often lower rents to attract potential tenants.","q_ja":"賃貸住宅の供給が変わらないまま需要が増えると、通常、その地域全体で家賃が上がる。逆に、供給が変わらないまま需要が減ると、家主は入居希望者を引きつけるために家賃を下げることが多い。","choices":[{"t":"Consequently","why":"需要減少時の値下げは、需要増加時の値上げが引き起こす結果ではない。"},{"t":"Conversely","why":"正解。需要の増加と減少という逆の条件で、家賃も逆方向に動く関係を示す。"},{"t":"For instance","why":"需要減少時の値下げは、需要増加時の値上げの具体例ではない。"},{"t":"In other words","why":"後文は前文の言い換えではなく、逆の条件で起こることを述べている。"}],"answer":1,"point":"Conversely は、条件や関係を逆にした場合に成り立つ対照的な内容を導く。","drive":{"ja":"需要が増えると家賃は上がる。逆に、需要が減ると家賃は下がる。この逆の関係を英語で表しましょう。","en":"When demand for rental housing rises while supply remains unchanged, rents generally increase throughout the affected area. Conversely, when demand falls while supply remains unchanged, landlords often lower rents to attract potential tenants."}},{"id":"p1-connector-004","q":"Investing in public libraries gives residents free access to reliable information, regardless of their financial circumstances. ___, these institutions provide meeting spaces that encourage cooperation among local organizations working on social issues.","q_ja":"公共図書館への投資により、住民は経済状況にかかわらず信頼できる情報を無料で利用できる。さらに、図書館は社会問題に取り組む地域団体の協力を促す会合の場も提供する。","choices":[{"t":"Nevertheless","why":"会合の場の提供は、情報を無料で利用できることと対立する内容ではない。"},{"t":"In other words","why":"情報へのアクセスと団体間の協力は異なる利点であり、同じ内容の言い換えではない。"},{"t":"Conversely","why":"会合の場の提供は、情報へのアクセスという関係を逆にしたものではない。"},{"t":"Furthermore","why":"正解。情報へのアクセスに加えて、地域団体の協力という別の利点を追加している。"}],"answer":3,"point":"Furthermore は、同じ主張を支える別の理由や利点を「さらに」と追加する。","drive":{"ja":"公共図書館は情報を無料で提供する。さらに、地域団体の協力も促す。この利点の追加を英語で表しましょう。","en":"Investing in public libraries gives residents free access to reliable information, regardless of their financial circumstances. Furthermore, these institutions provide meeting spaces that encourage cooperation among local organizations working on social issues."}},{"id":"p1-connector-005","q":"The first proposal would finance the entire transport project through higher taxes on local businesses. ___, the second proposal would rely exclusively on payments from passengers using the new service.","q_ja":"第1案は、地元企業への増税で交通事業の費用全額を賄うというものだ。対照的に、第2案は新サービスを利用する乗客からの支払いのみに頼るというものだ。","choices":[{"t":"For example","why":"乗客の支払いによる財源確保は、企業への増税の具体例ではない。"},{"t":"Consequently","why":"第2案の財源は、第1案の増税が引き起こす結果として述べられていない。"},{"t":"In contrast","why":"正解。企業への課税と利用者からの徴収という、二つの案の財源の違いを示す。"},{"t":"Similarly","why":"二つの案は負担する主体が異なり、同じ方式を採るという説明にはならない。"}],"answer":2,"point":"In contrast は、比較する二つの対象の明確な違いを示す。","drive":{"ja":"第1案の財源は企業への課税だ。対照的に、第2案は乗客の支払いに頼る。この比較を英語で表しましょう。","en":"The first proposal would finance the entire transport project through higher taxes on local businesses. In contrast, the second proposal would rely exclusively on payments from passengers using the new service."}},{"id":"p1-connector-006","q":"The government should retain the national research program because its discoveries could improve future energy security. ___, its immediate costs are substantial, and taxpayers have legitimate concerns about the allocation of public funds. These concerns deserve careful scrutiny, but they do not outweigh the potential benefits of sustained scientific investment.","q_ja":"研究成果が将来のエネルギー安全保障を改善する可能性があるため、政府は国の研究計画を維持すべきだ。確かに当面の費用は多額で、納税者が公的資金の配分を懸念するのももっともだ。こうした懸念は慎重に検討すべきだが、継続的な科学への投資がもたらす潜在的な利益を上回るものではない。","choices":[{"t":"Admittedly","why":"正解。研究計画を支持する立場を保ちながら、反対側にも費用面で妥当な指摘があると認める。"},{"t":"Consequently","why":"将来の安全保障を改善し得ることが、多額の当面の費用を生む原因だとは述べられていない。"},{"t":"For instance","why":"多額の費用は、エネルギー安全保障を改善する研究成果の具体例ではない。"},{"t":"Similarly","why":"費用への懸念は、研究計画を維持すべき理由と同じ方向の内容ではない。"}],"answer":0,"point":"Admittedly は、自分の主張に不利でも認めるべき点を「確かに」と示す。","drive":{"ja":"研究計画は維持すべきだ。確かに費用への懸念はもっともだが、利益の方が大きい。この譲歩を英語で表しましょう。","en":"The government should retain the national research program because its discoveries could improve future energy security. Admittedly, its immediate costs are substantial, and taxpayers have legitimate concerns about the allocation of public funds. These concerns deserve careful scrutiny, but they do not outweigh the potential benefits of sustained scientific investment."}},{"id":"p1-connector-007","q":"Automated systems process routine benefit applications quickly, allowing public agencies to reduce delays for most applicants. ___, human officials must review unusual cases to prevent rigid rules from unfairly excluding eligible residents.","q_ja":"自動化システムは定型的な給付申請を迅速に処理し、行政機関は大半の申請者の待ち時間を短縮できる。とはいえ、硬直的な規則によって受給資格のある住民が不当に排除されないよう、例外的な事例は職員が審査しなければならない。","choices":[{"t":"For example","why":"職員による例外的な事例の審査は、自動処理が迅速であることの具体例ではない。"},{"t":"Consequently","why":"人による審査が必要なのは規則の硬直性を補うためであり、処理が速いことの結果ではない。"},{"t":"In other words","why":"自動化の効率と人による審査の必要性は、同じ内容の言い換えではない。"},{"t":"That said","why":"正解。自動化の利点を認めたうえで、人による審査が必要だという留保を加える。"}],"answer":3,"point":"That said は、直前の内容を受け入れながら「とはいえ」と留保や注意点を加える。","drive":{"ja":"自動化は給付申請の処理を速める。とはいえ、例外的な事例には職員の審査が必要だ。この留保を英語で表しましょう。","en":"Automated systems process routine benefit applications quickly, allowing public agencies to reduce delays for most applicants. That said, human officials must review unusual cases to prevent rigid rules from unfairly excluding eligible residents."}},{"id":"p1-connector-008","q":"The new trade agreement removed import duties on essential medical equipment previously subject to substantial taxes. ___, hospitals now pay less for these imports and have more funds available for patient care.","q_ja":"新たな貿易協定により、それまで高額の税が課されていた不可欠な医療機器の輸入関税が撤廃された。その結果、病院の輸入費用は下がり、患者のケアに使える資金が増えた。","choices":[{"t":"Conversely","why":"病院の費用減少は、関税撤廃と逆の関係ではなく、その効果である。"},{"t":"Consequently","why":"正解。関税の撤廃によって輸入費用が下がり、利用可能な資金が増えたという結果を示す。"},{"t":"Nevertheless","why":"関税撤廃後の費用減少は予想される効果であり、逆接にはならない。"},{"t":"For instance","why":"病院の資金増加は、撤廃された輸入関税の具体例ではなく、撤廃の結果である。"}],"answer":1,"point":"Consequently は、制度の変更が費用や資金に及ぼした結果を説明するときにも使う。","drive":{"ja":"医療機器の輸入関税が撤廃された。その結果、病院は患者のケアに回せる資金が増えた。この結果を英語で表しましょう。","en":"The new trade agreement removed import duties on essential medical equipment previously subject to substantial taxes. Consequently, hospitals now pay less for these imports and have more funds available for patient care."}},{"id":"p1-connector-009","q":"The coastal protection project exceeded its original budget, and independent engineers warned that its benefits had been overstated. ___, the council extended the project without revising its design or explaining how further spending would be justified.","q_ja":"海岸保護事業は当初の予算を超過し、独立した技術者たちは効果が過大評価されていると警告した。それにもかかわらず、議会は設計を見直さず、追加支出の正当性も説明しないまま事業を延長した。","choices":[{"t":"Nevertheless","why":"正解。費用超過と効果への警告にもかかわらず、見直さずに延長したという逆接を示す。"},{"t":"For example","why":"議会による事業延長は、効果が過大評価されていることの具体例として示されていない。"},{"t":"Similarly","why":"議会の対応は技術者の警告と同じ方向ではなく、警告を受けても方針を変えない対応である。"},{"t":"Consequently","why":"効果への警告が、設計を見直さない延長を合理的に引き起こすという因果関係にはならない。"}],"answer":0,"point":"Nevertheless は、問題点が示されても方針や行動が変わらない展開にも使える。","drive":{"ja":"海岸保護事業には費用と効果の問題が指摘された。それにもかかわらず、議会は見直さず延長した。この逆接を英語で表しましょう。","en":"The coastal protection project exceeded its original budget, and independent engineers warned that its benefits had been overstated. Nevertheless, the council extended the project without revising its design or explaining how further spending would be justified."}},{"id":"p1-connector-010","q":"Protecting wetlands preserves habitats for species whose survival depends on stable conditions within these increasingly threatened ecosystems. ___, wetlands absorb excess rainfall, reducing the risk of severe flooding in nearby residential areas.","q_ja":"湿地を保護することは、ますます脅かされる生態系の安定した環境に生存を依存する種の生息地を守ることになる。さらに、湿地は余分な雨水を吸収し、近隣の住宅地で深刻な洪水が起こる危険を減らす。","choices":[{"t":"In contrast","why":"雨水の吸収は生息地保全と対立する性質ではなく、湿地の別の有益な機能である。"},{"t":"In other words","why":"生息地の保全と洪水リスクの軽減は異なる効果であり、言い換えではない。"},{"t":"Furthermore","why":"正解。生物の保護という利点に、洪水リスクの軽減という追加の利点を重ねている。"},{"t":"Nevertheless","why":"雨水を吸収する機能は、種の生息地を保全するという説明に反する内容ではない。"}],"answer":2,"point":"Furthermore で別の利点を追加すると、政策を支持する理由を重ねて説明できる。","drive":{"ja":"湿地の保護は生物の生息地を守る。さらに、湿地は洪水の危険も減らす。この利点の追加を英語で表しましょう。","en":"Protecting wetlands preserves habitats for species whose survival depends on stable conditions within these increasingly threatened ecosystems. Furthermore, wetlands absorb excess rainfall, reducing the risk of severe flooding in nearby residential areas."}}],"error":[{"id":"p1-error-001","q":"再生可能エネルギー事業への公的投資は、輸入燃料への国の依存を徐々に減らしている。","q_ja":"日本語の意味に合う、文法・語法に誤りのない英文を選ぶ。","choices":[{"t":"Public investment in renewable energy projects are gradually reducing the country’s dependence on imported fuels.","why":"主語の中心は単数扱いの investment なので are を is にする。"},{"t":"Public funding for renewable energy projects is gradually reducing the country’s dependent on imported fuels.","why":"所有格の後には形容詞 dependent ではなく名詞 dependence が必要。"},{"t":"Public investment in renewable energy projects is gradually reducing the country’s dependence on imported fuels.","why":"正解。主語 investment に is が対応し、dependence on の語法も正しい。"},{"t":"Public funding for renewable energy projects is gradually reducing the country’s dependence of imported fuels.","why":"依存の対象には dependence on を使うため of を on にする。"},{"t":"Public investment supports renewable energy projects, what gradually reduce the country’s dependence on imported fuels.","why":"先行詞 projects を受ける非制限用法では what ではなく which を使う。"},{"t":"Public investment in renewable energy projects reduces dependence on imported fuels by financing new power generation equipments.","why":"equipment は不可算名詞なので equipments とはしない。"}],"answer":2,"point":"長い主語では中心となる名詞を見極めて動詞の数を合わせる。","drive":{"ja":"再生可能エネルギー事業への公的投資は、輸入燃料への国の依存を徐々に減らしている。","en":"Public investment in renewable energy projects is gradually reducing the country’s dependence on imported fuels."}},{"id":"p1-error-002","q":"独立した専門家が提供する助言は、政府が人工知能をより効果的に規制するのに役立つ。","q_ja":"日本語の意味に合う、文法・語法に誤りのない英文を選ぶ。"," する。"}],"answer":4,"point":"関係代名詞が目的語を兼ねるときは、目的語の代名詞を重ねない。","drive":{"ja":"職業訓練プログラムの実施は、失業者が労働市場で求められる技能を身につけるのに役立つ。","en":"The implementation of vocational training programs helps unemployed people acquire skills that are required in the labor market."}}],"ja2en":[{"id":"p1-ja2en-001","q":"再生可能エネルギーへの移行には多額の初期費用がかかるとはいえ、政府はその長期的な環境上の利益を優先すべきだ。","q_ja":"初期費用の大きさを認めたうえで、長期的な環境上の利益を優先するという主張を選ぶ。","choices":[{"t":"Governments should prioritize the transition to renewable energy despite its environmental benefits, which require substantial initial expenditure over the long term.","why":"環境上の利益を譲歩の対象にし、その利益に初期費用がかかるという修飾関係に変えている。"},{"t":"Although governments prioritize the environmental benefits of renewable energy, the transition should depend primarily on its substantial initial costs in the long term.","why":"利益の優先を譲歩節に移し、主張を初期費用に左右されるべきだという内容に変えている。"},{"t":"Although the transition to renewable energy involves substantial initial costs, governments should prioritize its long-term environmental benefits.","why":"正解。although で譲歩（初期費用）を示し、主節で long-term environmental benefits（長期的な環境上の利益）を優先すべきだと述べている。"},{"t":"Governments should prioritize substantial initial expenditure on renewable energy, although the transition depends on environmental benefits achieved over the long term.","why":"優先する対象を利益から支出へ変え、移行が利益に依存するという別の関係を述べている。"},{"t":"Although renewable energy offers environmental benefits in the long term, governments should give priority to the substantial initial costs of the transition.","why":"譲歩節と主節の内容を入れ替え、環境上の利益より初期費用を優先すべきだとしている。"},{"t":"The transition to renewable energy involves substantial initial costs because governments should prioritize the environmental benefits it offers in the long term.","why":"譲歩を因果に変え、利益を優先すべきことが初期費用の原因だとしている。"}],"answer":2,"point":"Although節には認める事情を置き、主節にはそれでも維持する主張を置く。","drive":{"ja":"再生可能エネルギーへの移行には多額の初期費用がかかるとはいえ、政府はその長期的な環境上の利益を優先すべきだ。","en":"Although the transition to renewable energy involves substantial initial costs, governments should prioritize its long-term environmental benefits."}},{"id":"p1-ja2en-002","q":"独立した監督が欠けているため、公的資金が不適切に使われ、その結果、政府への信頼が損なわれている。","q_ja":"監督の欠如、公的資金の不適切な使用、政府への信頼の低下という因果の順序を確認する。","choices":[{"t":"The misuse of public funds has weakened independent oversight, consequently leading to a decline in the level of public trust in government.","why":"公的資金の不適切な使用が監督を弱めたとしており、最初の原因と結果が逆になっている。"},{"t":"Declining public trust in government has encouraged the misuse of public funds, which has consequently resulted in a lack of independent oversight.","why":"信頼の低下を出発点にし、監督の欠如を最終的な結果にして因果の順序を逆転させている。"},{"t":"Public funds have been misused despite independent oversight, consequently weakening public trust in the government responsible for providing supervision to public institutions.","why":"監督が欠けているという原因を、監督があるにもかかわらずという譲歩に変えている。"},{"t":"The lack of independent oversight results from the misuse of public funds, while declining public trust in government is responsible for both.","why":"監督の欠如を不適切な使用の結果とし、さらに信頼の低下を両方の原因にしている。"},{"t":"Independent oversight is lacking because public trust in government has weakened, consequently causing public funds to be misused by the institutions concerned.","why":"信頼の低下を監督の欠如の原因にしており、日本語の因果の順序と異なる。"},{"t":"The lack of independent oversight has led to the misuse of public funds, consequently undermining public trust in government.","why":"正解。監督の欠如を原因、不適切な使用を中間の結果、信頼の低下をその帰結として示している。"}],"answer":5,"point":"A has led to B, consequently doing Cで、原因から結果、さらにその帰結へとつなぐ。","drive":{"ja":"独立した監督が欠けているため、公的資金が不適切に使われ、その結果、政府への信頼が損なわれている。","en":"The lack of independent oversight has led to the misuse of public funds, consequently undermining public trust in government."}},{"id":"p1-ja2en-003","q":"政府が国家の安全保障を重視するのに対し、人権団体は市民のプライバシーを守る必要性を強調している。","q_ja":"政府と人権団体がそれぞれ重視する対象を対比する。","choices":[{"t":"Whereas the government places emphasis on national security, human rights organizations stress the need to protect citizens' privacy.","why":"正解。政府の安全保障重視と、人権団体のプライバシー保護重視を対比している。"},{"t":"The government emphasizes national security because human rights organizations insist that citizens' privacy needs protection from threats to the nation.","why":"二者の対比を、プライバシー保護の主張が政府の姿勢の原因になるという因果関係に変えている。"},{"t":"Whereas human rights organizations prioritize national security, the government stresses the need to protect the privacy of individual citizens.","why":"対比する二者の主張を入れ替え、人権団体が安全保障を、政府がプライバシーを重視するとしている。"},{"t":"The government stresses the need for national security, thereby prompting human rights organizations to prioritize the protection of citizens' privacy.","why":"対照的な立場を述べるだけでなく、政府の姿勢が人権団体を動かしたという因果を加えている。"},{"t":"While emphasizing national security, the government urges human rights organizations to stress the need to protect the privacy of individual citizens.","why":"分詞構文の主語を政府にし、人権団体が独自に強調している内容を政府からの要請に変えている。"},{"t":"Human rights organizations emphasize privacy protection on condition that the government places sufficient emphasis on national security in its public policies.","why":"対比を条件に変え、政府が安全保障を重視することを人権団体の主張の条件にしている。"}],"answer":0,"point":"Whereas A, Bは二つの立場を対比する形であり、原因や条件を表す形ではない。","drive":{"ja":"政府が国家の安全保障を重視するのに対し、人権団体は市民のプライバシーを守る必要性を強調している。","en":"Whereas the government places emphasis on national security, human rights organizations stress the need to protect citizens' privacy."}},{"id":"p1-ja2en-004","q":"以上の理由から、政府は地域間の格差を縮めるために公共交通への投資を優先すべきだと結論づけられる。","q_ja":"提示済みの理由から結論を導き、投資の目的を地域間格差の縮小として示す。","choices":[{"t":"In conclusion, regional disparities should be reduced so that the government has reasons to prioritize investment in public transport across the country.","why":"格差の縮小を投資の目的ではなく、政府が投資を優先する理由を得るための手段に変えている。"},{"t":"For these reasons, prioritizing investment in public transport should enable the government to conclude that regional disparities have already been substantially reduced.","why":"政策提言ではなく、投資を優先すれば格差がすでに縮小したと結論づけられるという内容に変えている。"},{"t":"It follows from reducing regional disparities that the government should provide reasons for prioritizing further investment in public transport across the country.","why":"結論の根拠を提示済みの理由から格差の縮小へ変え、政府に理由の提示を求めている。"},{"t":"For these reasons, it can be concluded that the government should prioritize investment in public transport to reduce regional disparities.","why":"正解。理由に基づく結論を示し、格差を縮めるという目的に向けた投資の優先を提言している。"},{"t":"For these reasons, the government should conclude its investment in public transport so that regional disparities can be reduced throughout the country.","why":"concludeの目的語を投資にしているため、結論を出すのではなく投資を終えるという意味になっている。"},{"t":"In conclusion, the government should prioritize reducing regional disparities in order to establish sufficient reasons for investing further in public transport systems.","why":"投資によって格差を縮める関係を逆にし、投資の理由を作るために格差を縮めるとしている。"}],"answer":3,"point":"For these reasonsで結論を導き、to不定詞で提言する施策の目的を示す。","drive":{"ja":"以上の理由から、政府は地域間の格差を縮めるために公共交通への投資を優先すべきだと結論づけられる。","en":"For these reasons, it can be concluded that the government should prioritize investment in public transport to reduce regional disparities."}},{"id":"p1-ja2en-005","q":"温室効果ガスの排出量の削減は、将来の世代が負う経済的負担の軽減につながる。","q_ja":"排出量の削減を名詞句の主語とし、将来世代の経済的負担への効果を述べる。","choices":[{"t":"The reduction of greenhouse gas emissions results from the alleviation of the economic burden that future generations will have to bear.","why":"results fromにより、負担の軽減が排出量削減の原因となり、日本語と因果の向きが逆になっている。"},{"t":"The reduction of greenhouse gas emissions contributes to the alleviation of the economic burden that future generations will have to bear.","why":"正解。削減と軽減を名詞化し、排出量削減が将来世代の負担軽減につながる関係を表している。"},{"t":"The reduction of greenhouse gas emissions contributes to alleviate the economic burden that future generations will be required to bear.","why":"contribute toのtoは前置詞なので、後ろにはalleviationやalleviatingが必要であり、alleviateは置けない。"},{"t":"The reducing of greenhouse gas emissions contributes to the alleviate of the economic burden that future generations will have to bear.","why":"the alleviateという名詞句は作れず、動詞alleviateを名詞alleviationにする必要がある。"},{"t":"The alleviation of greenhouse gas emissions contributes to the reduction of future generations that will bear an increasingly substantial economic burden.","why":"削減の対象を排出量から将来の世代へ移し、負担を軽減するという名詞句の関係を崩している。"},{"t":"The economic burden of reducing greenhouse gas emissions contributes to the alleviation of the responsibilities that future generations will have to bear.","why":"主語を排出量の削減から削減に伴う経済的負担へ変え、軽減する対象も経済的負担から責任へ変えている。"}],"answer":1,"point":"The reduction of A contributes to the alleviation of Bのように、動作を名詞化して因果を述べる。","drive":{"ja":"温室効果ガスの排出量の削減は、将来の世代が負う経済的負担の軽減につながる。","en":"The reduction of greenhouse gas emissions contributes to the alleviation of the economic burden that future generations will have to bear."}},{"id":"p1-ja2en-006","q":"もし政府の補助金がなければ、多くの小規模企業は今、環境に優しい技術を導入する余裕がないだろう。","q_ja":"現在の補助金が存在しないと仮定した場合の、現在の企業の資金面への影響を表す。","choices":[{"t":"If government subsidies had been unavailable, many small businesses would have been unable to afford the adoption of environmentally friendly technology.","why":"仮定法過去完了で過去の補助金と過去の導入可能性を述べており、現在の仮定になっていない。"},{"t":"If government subsidies were unavailable now, many small businesses would have been unable to afford environmentally friendly technology in the past.","why":"現在の条件に対して過去の結果を述べており、現在の導入余力についての仮定になっていない。"},{"t":"If many small businesses could not afford environmentally friendly technology, government subsidies would be unavailable to support their adoption of it.","why":"導入する余裕がないことを条件、補助金がないことを結果にし、仮定の条件と帰結を逆転させている。"},{"t":"If government subsidies had been unavailable, many small businesses would now have sufficient resources to adopt environmentally friendly technology without assistance.","why":"条件を過去に移したうえで、現在は導入資金が十分にあるという帰結に変えている。"},{"t":"If it were not for government subsidies, many small businesses would now be unable to afford the adoption of environmentally friendly technology.","why":"正解。If it were not forで現在の補助金がない状況を仮定し、wouldで現在の帰結を述べている。"},{"t":"If government subsidies are withdrawn next year, many small businesses will be unable to afford environmentally friendly technology in the following years.","why":"現在の事実に反する仮定を、来年の補助金廃止を条件とする将来の予測に変えている。"}],"answer":4,"point":"If it were not for A, 主語 would ...で、現在のAがなければどうなるかを仮定する。","drive":{"ja":"もし政府の補助金がなければ、多くの小規模企業は今、環境に優しい技術を導入する余裕がないだろう。","en":"If it were not for government subsidies, many small businesses would now be unable to afford the adoption of environmentally friendly technology."}},{"id":"p1-ja2en-007","q":"もし自治体が事前に避難計画を更新していたなら、昨年の洪水でこれほど多くの住民が危険にさらされることはなかっただろう。","q_ja":"過去に実行されなかった対策と、過去に生じた被害についての仮定を表す。","choices":[{"t":"If local authorities updated their evacuation plans now, fewer residents would be exposed to danger during floods occurring in the coming years.","why":"昨年の出来事への反実仮想を、現在の更新と将来の洪水についての仮定に変えている。"},{"t":"If fewer residents had been exposed to danger during last year's floods, local authorities would have updated their evacuation plans in advance.","why":"住民が危険にさらされなかったことを条件、計画の事前更新を帰結にして、条件と結果を逆転させている。"},{"t":"Had local authorities updated their evacuation plans beforehand, so many residents would not have been exposed to danger during last year's floods.","why":"正解。Hadで始まる仮定法過去完了とwould not have beenで、昨年の出来事に反する仮定を表している。"},{"t":"Were local authorities to update their evacuation plans next year, so many residents would not have been exposed during last year's floods.","why":"来年の計画更新を昨年の被害を防ぐ条件にしており、条件と結果の時間関係が成立していない。"},{"t":"Had local authorities updated their evacuation plans beforehand, so many residents would not now be exposed to danger during the current floods.","why":"帰結を現在の洪水での危険に変えており、昨年の洪水についての過去の帰結を表していない。"},{"t":"Local authorities would have updated their evacuation plans beforehand if last year's floods had exposed so many residents to danger in the region.","why":"昨年の洪水による危険を事前の計画更新の条件にしており、原因と結果の時間的な順序が逆になっている。"}],"answer":2,"point":"Had 主語 過去分詞はIf 主語 had 過去分詞の倒置形で、過去の事実に反する条件を表す。","drive":{"ja":"もし自治体が事前に避難計画を更新していたなら、昨年の洪水でこれほど多くの住民が危険にさらされることはなかっただろう。","en":"Had local authorities updated their evacuation plans beforehand, so many residents would not have been exposed to danger during last year's floods."}},{"id":"p1-ja2en-008","q":"独立機関が評価したその政策は、低所得世帯の医療サービスへのアクセスを改善すると期待されている。","q_ja":"独立機関による評価が政策を修飾し、アクセス改善への期待もその政策に向けられている文を選ぶ。","choices":[{"t":"The policy, which was evaluated by an independent agency, is expected to improve access to healthcare services for households with low incomes.","why":"正解。非制限用法の関係詞節が政策を説明し、低所得世帯の医療へのアクセスを改善するのも政策となっている。"},{"t":"The independent agency, which was evaluated under the policy, is expected to improve access to healthcare services for households with low incomes.","why":"評価された対象を政策から独立機関へ変え、アクセス改善が期待される対象も独立機関にしている。"},{"t":"The policy is expected to improve access to healthcare services for households with low incomes, which were evaluated by an independent agency.","why":"関係詞節が低所得世帯を修飾しており、独立機関が評価した対象が政策ではなく世帯になっている。"},{"t":"The policy is expected to improve access for households with low incomes to healthcare services that were evaluated by an independent agency.","why":"独立機関による評価が医療サービスを修飾しており、政策を評価したという意味になっていない。"},{"t":"An independent agency is expected to evaluate the policy that has improved access to healthcare services for households with low incomes.","why":"政策の評価を将来の期待にし、アクセスの改善をすでに生じた事実にして、二つの出来事の時制を変えている。"},{"t":"The policy, which evaluated an independent agency, is expected to improve access to healthcare services for households with low incomes in the region.","why":"関係詞節を能動態にし、評価を受けた政策ではなく独立機関を評価した政策という意味にしている。"}],"answer":0,"point":"非制限用法のwhich節では、先行詞と、節内でその先行詞が果たす役割を確認する。","drive":{"ja":"独立機関が評価したその政策は、低所得世帯の医療サービスへのアクセスを改善すると期待されている。","en":"The policy, which was evaluated by an independent agency, is expected to improve access to healthcare services for households with low incomes."}},{"id":"p1-ja2en-009","q":"確かに自動化は生産性を高めるが、そのことは職を失う労働者への支援を怠る理由にはならない。","q_ja":"生産性向上を認めても、失職する労働者への支援を怠ることは正当化されないという論理を選ぶ。","choices":[{"t":"Admittedly, neglecting support for displaced workers increases productivity, but this does not justify the introduction of automation throughout the economy.","why":"譲歩する内容を支援の放置による生産性向上に変え、正当化されない対象も自動化の導入に変えている。"},{"t":"Although automation increases productivity, neglecting support for displaced workers is necessary to justify the economic benefits that automation brings to society.","why":"支援を怠ることを正当化できないのではなく、自動化の利益を正当化するために支援の放置が必要だとしている。"},{"t":"Admittedly, automation increases productivity because support for displaced workers is neglected, although such support remains a major concern for policymakers.","why":"支援の放置を生産性向上の原因にしており、その向上では放置を正当化できないという関係を示していない。"},{"t":"Admittedly, automation increases productivity, but providing support for displaced workers does not justify neglecting the economic benefits of automation itself.","why":"労働者支援によって自動化の利益を無視することは正当化できないという、逆向きの正当化関係に変えている。"},{"t":"Admittedly, automation increases productivity, provided that support for workers who lose their jobs is neglected during the transition to automated production.","why":"生産性向上を認める譲歩と支援放置への反論を、支援の放置が生産性向上の条件だという内容に変えている。"},{"t":"Admittedly, automation increases productivity, but this does not justify neglecting support for workers who lose their jobs as a result.","why":"正解。自動化の利点を認めつつ、それを理由に自動化で失職する労働者への支援を怠ることは正当化できないと述べている。"}],"answer":5,"point":"Admittedly A, but this does not justify Bで、Aを認めてもBの正当化にはならないと述べる。","drive":{"ja":"確かに自動化は生産性を高めるが、そのことは職を失う労働者への支援を怠る理由にはならない。","en":"Admittedly, automation increases productivity, but this does not justify neglecting support for workers who lose their jobs as a result."}},{"id":"p1-ja2en-010","q":"デジタル技術へのアクセスの拡大は、行政サービスを利用しやすくするだけでなく、政治参加も促す。","q_ja":"アクセスの拡大を共通の主語として、行政サービスの利用と政治参加への二つの効果を並べる。","choices":[{"t":"The expansion of access to digital technology results not only from easier access to public services but also from increased political participation.","why":"アクセスの拡大を二つの効果の原因ではなく結果にし、因果の向きを逆にしている。"},{"t":"Not only public services but also political participation encourage the expansion of access to digital technology among citizens across the country.","why":"行政サービスと政治参加を主語にして、両者が技術へのアクセス拡大を促すという逆の因果を述べている。"},{"t":"The expansion of access to digital technology not only facilitates use of public services but also the encouragement of wider political participation.","why":"not onlyの後ろの動詞facilitatesに対し、but alsoの後ろが名詞句になり、二つの述語が並列になっていない。"},{"t":"The expansion of access to digital technology not only facilitates the use of public services but also encourages political participation.","why":"正解。名詞化した主語に対し、行政サービスの利用促進と政治参加の促進を二つの動詞句で並列している。"},{"t":"Expanding public services not only facilitates access to digital technology but also encourages political participation among citizens who use those services.","why":"主語をデジタル技術へのアクセス拡大から行政サービスの拡大へ変え、何が二つの効果を生むのかを取り違えている。"},{"t":"The expansion of access to digital technology encourages political participation only when citizens find it easier to make use of public services.","why":"二つの効果の並列を条件関係に変え、行政サービスを利用しやすい場合だけ政治参加を促すとしている。"}],"answer":3,"point":"not only A but also Bでは、同じ主語にかかるAとBの文法上の形をそろえる。","drive":{"ja":"デジタル技術へのアクセスの拡大は、行政サービスを利用しやすくするだけでなく、政治参加も促す。","en":"The expansion of access to digital technology not only facilitates the use of public services but also encourages political participation."}}],"paraphrase":[{"id":"p1-paraphrase-001","q":"When governments disclose how public funds are spent, citizens are more likely to trust public institutions.","q_ja":"政府が公的資金の使途を公開すると、市民は公的機関を信頼しやすくなる。","choices":[{"t":"The disclosure of public spending by governments increases the likelihood that citizens will trust public institutions.","why":"正解。公開を名詞化し、信頼が高まる可能性も保っている。"},{"t":"Government disclosure of public spending makes citizens less likely to trust public institutions.","why":"less likely により信頼の変化が逆になる。"},{"t":"Public trust causes governments to disclose their spending.","why":"公開が信頼を高めるという因果の向きを逆にしている。"},{"t":"The disclosure of public spending increase public trust.","why":"単数の disclosure に対応する動詞は increases。"},{"t":"When governments reveal how public funds are spent, citizens are more likely to trust public institutions.","why":"disclose を reveal に替えただけで、ほぼ丸写しになっている。"},{"t":"It is good for citizens when governments talk about public money.","why":"good では使途の公開と信頼の関係が伝わらない。"}],"answer":0,"point":"disclose を disclosure に、be more likely to を increase the likelihood that に変える。","drive":{"ja":"政府が公的資金の使途を公開すると、市民は公的機関を信頼しやすくなる。を言い換えてください","en":"The disclosure of public spending by governments increases the likelihood that citizens will trust public institutions."}},{"id":"p1-paraphrase-002","q":"Although international trade stimulates economic growth, it can leave some domestic industries vulnerable to competition from overseas producers.","q_ja":"国際貿易は経済成長を促すものの、一部の国内産業を海外の生産者との競争に対して弱い立場に置くことがある。","choices":[{"t":"International trade always protects domestic industries from foreign competition.","why":"競争に弱くなる可能性を、必ず保護するという意味に変えている。"},{"t":"Although international trade encourages economic growth, it can leave some domestic industries vulnerable to competition from overseas producers.","why":"stimulates を encourages に替えただけで、ほぼ丸写しになっている。"},{"t":"International trade, which promote economic growth, may expose industries to foreign competition.","why":"単数扱いの international trade を受けるので promotes が必要。"},{"t":"International trade, which promotes economic growth, may nevertheless expose certain domestic industries to competition from foreign producers.","why":"正解。成長への貢献と競争に弱くなる可能性の両方を保っている。"},{"t":"International trade benefits every domestic industry.","why":"一部への不利益を、すべての国内産業の利益に変えている。"},{"t":"International trade is good for the economy but bad for some businesses.","why":"good と bad では成長と海外との競争という具体的な内容がぼやける。"}],"answer":3,"point":"譲歩を非制限用法の which と nevertheless で表す。","drive":{"ja":"国際貿易は経済成長を促すものの、一部の国内産業を海外の生産者との競争に対して弱い立場に置くことがある。を言い換えてください","en":"International trade, which promotes economic growth, may nevertheless expose certain domestic industries to competition from foreign producers."}},{"id":"p1-paraphrase-003","q":"Providing affordable public transport enables residents with limited incomes to gain better access to employment opportunities across the city.","q_ja":"手頃な料金の公共交通を提供すると、所得の限られた住民が市内各地の雇用機会によりアクセスしやすくなる。","choices":[{"t":"Affordable public transport prevents residents on limited incomes from accessing employment opportunities.","why":"アクセスの改善を妨害に変えている。"},{"t":"The provision of affordable public transport improves access to employment opportunities throughout the city for residents on limited incomes.","why":"正解。提供を名詞化し、対象者と雇用機会へのアクセス改善を保っている。"},{"t":"The provision of affordable public transport improve access to employment.","why":"単数の provision に対応する動詞は improves。"},{"t":"Providing affordable public transportation enables residents with limited incomes to gain better access to employment opportunities across the city.","why":"transport を transportation に替えただけで、原文をほぼ写している。"},{"t":"Affordable public transport is good for people with little money.","why":"雇用機会へのアクセス改善という具体的な効果が抜けている。"},{"t":"Better access to employment makes public transport affordable for residents on limited incomes.","why":"低料金の交通がアクセスを改善するという因果を逆にしている。"}],"answer":1,"point":"Providing を the provision of に、enable を improve access to に言い換える。","drive":{"ja":"手頃な料金の公共交通を提供すると、所得の限られた住民が市内各地の雇用機会によりアクセスしやすくなる。を言い換えてください","en":"The provision of affordable public transport improves access to employment opportunities throughout the city for residents on limited incomes."}},{"id":"p1-paraphrase-004","q":"If companies were required to explain their automated decisions, individuals would find it easier to challenge unfair treatment.","q_ja":"企業が自動化された意思決定の説明を義務づけられれば、個人は不公平な扱いに異議を申し立てやすくなるだろう。","choices":[{"t":"Requiring companies to explain automated decisions would make challenges to unfair treatment harder.","why":"容易になるという結果を難しくなるに変えている。"},{"t":"Individuals should explain automated decisions to companies before challenging unfair treatment.","why":"説明する主体を企業から個人に変えている。"},{"t":"A requirement for companies to explain automated decisions would facilitates challenges to unfair treatment.","why":"would の後には原形 facilitate が必要。"},{"t":"If companies were required to explain their automated decisions, people would find it easier to challenge unfair treatment.","why":"individuals を people に替えただけで、ほぼ丸写しになっている。"},{"t":"It would be good if companies explained their computer systems.","why":"説明義務と不公平な扱いへの異議申し立ての関係が抜けている。"},{"t":"A requirement for companies to explain automated decisions would facilitate individuals’ challenges to unfair treatment.","why":"正解。仮定の義務化を名詞化し、異議申し立てが容易になるという結果を保っている。"}],"answer":5,"point":"仮定の条件を a requirement で表し、would facilitate で結果を示す。","drive":{"ja":"企業が自動化された意思決定の説明を義務づけられれば、個人は不公平な扱いに異議を申し立てやすくなるだろう。を言い換えてください","en":"A requirement for companies to explain automated decisions would facilitate individuals’ challenges to unfair treatment."}},{"id":"p1-paraphrase-005","q":"Because natural resources are limited, governments need to encourage industries to use materials more efficiently and reduce unnecessary waste.","q_ja":"天然資源は限られているため、政府は産業界に資材の利用効率を高め、不要な廃棄物を減らすよう促す必要がある。","choices":[{"t":"Natural resources are unlimited, so governments need not encourage efficient material use.","why":"資源の制約と政府の働きかけの必要性を否定している。"},{"t":"Given limited natural resources, governments must encouraging industries to reduce waste.","why":"must の後には原形 encourage が必要。"},{"t":"Given the limited availability of natural resources, governments must promote more efficient material use and reductions in unnecessary waste among industries.","why":"正解。資源の制約を理由として示し、産業界に促す二つの行動を保っている。"},{"t":"Because natural resources are limited, governments need to encourage industries to use materials more efficiently and decrease unnecessary waste.","why":"reduce を decrease に替えただけで、ほぼ丸写しになっている。"},{"t":"Using materials well is good, and throwing things away is bad.","why":"資源の制約と政府による産業界への働きかけが失われている。"},{"t":"Natural resources become limited because governments encourage efficient material use and waste reduction.","why":"資源の制約を政策の理由ではなく結果にしている。"}],"answer":2,"point":"理由節を Given と名詞句に変え、行為を material use や reductions で名詞化する。","drive":{"ja":"天然資源は限られているため、政府は産業界に資材の利用効率を高め、不要な廃棄物を減らすよう促す必要がある。を言い換えてください","en":"Given the limited availability of natural resources, governments must promote more efficient material use and reductions in unnecessary waste among industries."}},{"id":"p1-paraphrase-006","q":"By supporting independent journalism, public institutions can help citizens distinguish reliable information from misleading claims during national elections.","q_ja":"独立した報道を支援することで、公的機関は国政選挙の期間中、市民が信頼できる情報と誤解を招く主張を区別するのを助けられる。","choices":[{"t":"Public support for independent journalism guarantees that citizens reject every misleading claim during national elections.","why":"支援できるという可能性を、すべて退ける保証に強めている。"},{"t":"Independent journalists help public institutions distinguish reliable information from misleading claims during national elections.","why":"支援する主体と情報を区別する主体を変えている。"},{"t":"Public institutions can assist citizens in distinguish reliable information from misleading claims.","why":"前置詞 in の後は動名詞 distinguishing が必要。"},{"t":"By supporting independent journalism, public institutions can help citizens separate reliable information from misleading claims during national elections.","why":"distinguish を separate に替えただけで、ほぼ丸写しになっている。"},{"t":"Support for independent journalism by public institutions can assist citizens in distinguishing reliable information from misleading claims during national elections.","why":"正解。支援を名詞化し、主体、情報の区別、選挙という場面を保っている。"},{"t":"Independent journalism is good for people when they vote.","why":"支援する主体と情報判断への効果が具体的に示されていない。"}],"answer":4,"point":"help someone distinguish を assist someone in distinguishing に変えられる。","drive":{"ja":"独立した報道を支援することで、公的機関は国政選挙の期間中、市民が信頼できる情報と誤解を招く主張を区別するのを助けられる。を言い換えてください","en":"Support for independent journalism by public institutions can assist citizens in distinguishing reliable information from misleading claims during national elections."}},{"id":"p1-paraphrase-007","q":"Unless governments invest in preventive healthcare, the financial burden of treating avoidable diseases is likely to increase over time.","q_ja":"政府が予防医療に投資しなければ、予防可能な病気を治療する経済的負担は時間とともに増す可能性が高い。","choices":[{"t":"Government investment in preventive healthcare will probably increase the financial burden of treating preventable diseases.","why":"投資がない場合の負担増を、投資による負担増に変えている。"},{"t":"Without government investment in preventive healthcare, treating preventable diseases will probably impose an increasing financial burden over time.","why":"正解。投資がない条件と治療による負担増の見込みを保っている。"},{"t":"Without government investment in preventive healthcare, the financial burden of treating diseases are likely to increase.","why":"主語の中心は単数の burden なので is が必要。"},{"t":"Unless governments invest in preventive healthcare, the financial burden of treating avoidable illnesses is likely to increase over time.","why":"diseases を illnesses に替えただけで、ほぼ丸写しになっている。"},{"t":"Preventive healthcare is good because getting sick is bad.","why":"政府の投資不足と将来の経済的負担の関係が抜けている。"},{"t":"Without government investment in preventive healthcare, treatment costs will certainly disappear over time.","why":"負担が増す見込みを確実に消滅するという逆の結果にしている。"}],"answer":1,"point":"Unless の条件節を without と名詞句に変え、負担を impose a burden で表す。","drive":{"ja":"政府が予防医療に投資しなければ、予防可能な病気を治療する経済的負担は時間とともに増す可能性が高い。を言い換えてください","en":"Without government investment in preventive healthcare, treating preventable diseases will probably impose an increasing financial burden over time."}},{"id":"p1-paraphrase-008","q":"Although digital services improve convenience, requiring everyone to use them may exclude citizens who lack adequate internet access.","q_ja":"デジタルサービスは利便性を高めるものの、全員に利用を義務づけると、十分なインターネット接続環境がない市民を排除するおそれがある。","choices":[{"t":"Although digital services enhance convenience, making their use compulsory may exclude citizens whose internet access is inadequate.","why":"正解。although を残して対比を保ちつつ、requiring everyone to use them を making their use compulsory、who lack adequate internet access を whose internet access is inadequate と構文ごと言い換えている。"},{"t":"Compulsory use of digital services always includes citizens whose internet access is inadequate.","why":"排除のおそれを必ず包摂するという意味に変えている。"},{"t":"Although digital services increase convenience, requiring everyone to use them may exclude citizens who lack adequate internet access.","why":"improve を increase に替えただけで、ほぼ丸写しになっている。"},{"t":"Despite enhance convenience, compulsory use of digital services may exclude some citizens.","why":"despite の後には動名詞 enhancing が必要。"},{"t":"Digital services are good, but they are bad for some people.","why":"義務化と接続環境の不足という条件が抜けている。"},{"t":"Citizens without adequate internet access require everyone to use digital services.","why":"排除されるおそれのある市民を、利用を義務づける主体に変えている。"}],"answer":0,"point":"譲歩は despite と動名詞で、所有の関係は whose で表せる。","drive":{"ja":"デジタルサービスは利便性を高めるものの、全員に利用を義務づけると、十分なインターネット接続環境がない市民を排除するおそれがある。を言い換えてください","en":"Although digital services enhance convenience, making their use compulsory may exclude citizens whose internet access is inadequate."}},{"id":"p1-paraphrase-009","q":"Reducing dependence on imported energy would make the national economy less vulnerable to sudden changes in international fuel prices.","q_ja":"輸入エネルギーへの依存を減らせば、国の経済は国際的な燃料価格の急変の影響を受けにくくなるだろう。","choices":[{"t":"Reduced reliance on energy imports would increase the national economy’s vulnerability to international fuel price changes.","why":"影響を受けにくくなるという結果を逆にしている。"},{"t":"Reducing dependence on imported energy would make the national economy less vulnerable to sudden shifts in international fuel prices.","why":"changes を shifts に替えただけで、ほぼ丸写しになっている。"},{"t":"Reduced reliance on energy imports would decreases vulnerability to international fuel price changes.","why":"would の後には原
