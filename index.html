<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>英検ドリル</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="英検ドリル">
<meta name="theme-color" content="#ffffff">
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --ink: #1d2330; --sub: #5b6475; --line: #dde1e8;
    --accent: #2f6fde; --ok: #1f9d55; --okbg: #e3f6ea; --ng: #d64545; --ngbg: #fbe6e6;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111418; --card: #1b2027; --ink: #e8ebf0; --sub: #9aa3b2; --line: #2c333d;
      --accent: #6c9cff; --ok: #4cc27f; --okbg: #17301f; --ng: #ff7a7a; --ngbg: #3a1b1b; }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", system-ui, sans-serif; }
  body { padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
  main { max-width: 640px; margin: 0 auto; padding: 12px 14px 96px; }
  h1 { font-size: 20px; margin: 8px 0 12px; }
  h2 { font-size: 16px; margin: 18px 0 8px; color: var(--sub); font-weight: 600; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin: 10px 0; }
  .seg { display: flex; gap: 6px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 4px; }
  .seg button { flex: 1; border: 0; background: transparent; color: var(--ink); font-size: 16px; padding: 10px; border-radius: 9px; }
  .seg button.on { background: var(--accent); color: #fff; font-weight: 600; }
  .big { display: block; width: 100%; border: 0; border-radius: 14px; padding: 16px; font-size: 18px; font-weight: 600;
    background: var(--accent); color: #fff; margin: 10px 0; }
  .big.sub { background: var(--card); color: var(--accent); border: 1px solid var(--line); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .tile { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px; text-align: left;
    color: var(--ink); font-size: 15px; }
  .tile b { display: block; font-size: 16px; margin-bottom: 4px; }
  .tile small { color: var(--sub); }
  .bar { height: 6px; border-radius: 3px; background: var(--line); margin-top: 6px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--ok); }
  .top { display: flex; align-items: center; gap: 10px; margin: 4px 0 8px; color: var(--sub); font-size: 14px; }
  .top button { border: 0; background: transparent; color: var(--accent); font-size: 16px; padding: 6px 0; }
  .top .grow { flex: 1; text-align: center; }
  .q { white-space: pre-wrap; font-size: 18px; line-height: 1.55; }
  .qja { color: var(--sub); font-size: 14px; margin-top: 8px; }
  .label { font-size: 13px; color: var(--sub); margin-bottom: 6px; }
  .choice { display: block; width: 100%; text-align: left; border: 1px solid var(--line); background: var(--card);
    color: var(--ink); border-radius: 12px; padding: 13px 14px; margin: 8px 0; font-size: 16px; line-height: 1.45; }
  .choice.ok { border-color: var(--ok); background: var(--okbg); }
  .choice.ng { border-color: var(--ng); background: var(--ngbg); }
  .choice .why { display: none; font-size: 13.5px; color: var(--sub); margin-top: 6px; }
  .answered .choice .why { display: block; }
  .answered .choice { opacity: .92; }
  .point { border-left: 4px solid var(--accent); padding: 10px 12px; background: var(--card); border-radius: 8px; margin: 12px 0; }
  .result { font-size: 40px; font-weight: 700; text-align: center; margin: 18px 0 4px; }
  .muted { color: var(--sub); font-size: 14px; }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: 0; }
  select, input[type=range] { font-size: 16px; }
  .footer { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
    background: linear-gradient(transparent, var(--bg) 30%); }
  .footer .big { max-width: 612px; margin: 0 auto; }
  /* 運転中モード */
  .drive { position: fixed; inset: 0; background: #000; color: #fff; display: flex; flex-direction: column;
    padding: calc(20px + env(safe-area-inset-top)) 20px calc(20px + env(safe-area-inset-bottom)); }
  .drive .phase { font-size: 18px; color: #9ab; }
  .drive .text { flex: 1; display: flex; align-items: center; font-size: 26px; line-height: 1.5; }
  .drive .stop { border: 0; border-radius: 18px; font-size: 26px; font-weight: 700; padding: 26px; background: #c33; color: #fff; }
  .drive .count { text-align: center; color: #9ab; margin-bottom: 10px; }
</style>
</head>
<body>
<main id="app"></main>
<script>
const DATA = {"2":{"collocation":[{"id":"g2-collocation-001","q":"Too much noise can ___ a negative effect on students who are trying to study.","q_ja":"大きすぎる騒音は、勉強しようとしている生徒に悪い影響を与えることがあります。","choices":[{"t":"do","why":"影響を与えるという意味では do an effect ではなく have an effect を使う。"},{"t":"make","why":"この表現では make a negative effect on ではなく have a negative effect on を使う。"},{"t":"have","why":"正解。have a negative effect on ... で、悪い影響を与える対象を示す。"},{"t":"take","why":"take an effect on という組み合わせでは、影響を与える意味を表せない。"}],"answer":2,"point":"have a negative effect on ... で「〜に悪い影響を与える」。","drive":{"ja":"大きすぎる騒音は、勉強しようとしている生徒に悪い影響を与えることがあります。","en":"Too much noise can have a negative effect on students who are trying to study."}},{"id":"g2-collocation-002","q":"The town needs a new plan to ___ the problem of illegal parking.","q_ja":"その町には、違法駐車の問題を解決するための新しい計画が必要です。","choices":[{"t":"solve","why":"正解。solve the problem で、その問題を解決することを表す。"},{"t":"reply","why":"reply は返答するという意味で、reply the problem とは言わない。"},{"t":"arrive","why":"arrive は到着するという意味で、問題を目的語に取れない。"},{"t":"spend","why":"spend は時間やお金を使うときの動詞で、問題を解決する意味にはならない。"}],"answer":0,"point":"solve a problem で「問題を解決する」。","drive":{"ja":"その町には、違法駐車の問題を解決するための新しい計画が必要です。","en":"The town needs a new plan to solve the problem of illegal parking."}},{"id":"g2-collocation-003","q":"Taking short breaks can ___ stress during a busy school day.","q_ja":"忙しい学校生活の中で短い休憩を取ることは、ストレスを減らすのに役立ちます。","choices":[{"t":"attend","why":"attend は会議などに出席するという意味で、ストレスとは組み合わせない。"},{"t":"borrow","why":"borrow は物などを借りるという意味で、ストレスを減らすことを表さない。"},{"t":"repair","why":"repair は壊れた物などを修理する動詞で、ストレスを減らす意味には使わない。"},{"t":"reduce","why":"正解。reduce stress で、ストレスを減らすことを表す。"}],"answer":3,"point":"reduce stress は、健康や生活習慣の利点を説明するときに使える。","drive":{"ja":"忙しい学校生活の中で短い休憩を取ることは、ストレスを減らすのに役立ちます。","en":"Taking short breaks can reduce stress during a busy school day."}},{"id":"g2-collocation-004","q":"Students should ___ attention to the sources of information they find online.","q_ja":"生徒は、インターネットで見つけた情報の出所に注意を払うべきです。","choices":[{"t":"spend","why":"注意を払うという表現では spend attention to は使わない。"},{"t":"pay","why":"正解。pay attention to ... で、注意すべき対象を示す。"},{"t":"cost","why":"cost は費用などがかかるという意味で、この組み合わせには使わない。"},{"t":"buy","why":"buy は買うという意味で、注意を払うという表現には使わない。"}],"answer":1,"point":"pay attention to ... で「〜に注意を払う」。","drive":{"ja":"生徒は、インターネットで見つけた情報の出所に注意を払うべきです。","en":"Students should pay attention to the sources of information they find online."}},{"id":"g2-collocation-005","q":"Students should ___ a decision about their future based on reliable information.","q_ja":"生徒は、信頼できる情報に基づいて自分の将来について決定を下すべきだ。","choices":[{"t":"do","why":"do a decision とは言わず、決定を下すときは make を使う。"},{"t":"perform","why":"perform は演技や作業などに使い、a decision とは組み合わせない。"},{"t":"make","why":"正解。make a decision で、決定を下すことを表す。"},{"t":"build","why":"build は建物などを造るときに使い、この文では決定を下す意味にならない。"}],"answer":2,"point":"make a decision based on ... で「〜に基づいて決定を下す」。","drive":{"ja":"生徒は、信頼できる情報に基づいて自分の将来について決定を下すべきだ。","en":"Students should make a decision about their future based on reliable information."}},{"id":"g2-collocation-006","q":"Using both sides of each sheet can help schools ___ the amount of paper they throw away.","q_ja":"紙の両面を使うことは、学校が捨てる紙の量を減らすのに役立ちます。","choices":[{"t":"invite","why":"invite は人などを招く動詞で、紙の量を目的語にして使わない。"},{"t":"attend","why":"attend は行事などに出席する意味で、量を減らす意味にはならない。"},{"t":"lend","why":"lend は貸すという意味で、捨てる紙の量とは組み合わせない。"},{"t":"reduce","why":"正解。reduce the amount of ... で、量を減らすことを表す。"}],"answer":3,"point":"reduce the amount of ... は、ごみや資源の量を減らす話で使える。","drive":{"ja":"紙の両面を使うことは、学校が捨てる紙の量を減らすのに役立ちます。","en":"Using both sides of each sheet can help schools reduce the amount of paper they throw away."}},{"id":"g2-collocation-007","q":"Local volunteers can ___ an important role in keeping parks clean.","q_ja":"地域のボランティアは、公園をきれいに保つ上で重要な役割を果たせます。","choices":[{"t":"play","why":"正解。play an important role in ... で、重要な役割を果たす場面を示す。"},{"t":"do","why":"役割を果たすという表現では do a role ではなく play a role を使う。"},{"t":"make","why":"make a role では、この文の「役割を果たす」を表せない。"},{"t":"carry","why":"carry a role という組み合わせでは、役割を果たす意味にならない。"}],"answer":0,"point":"play an important role in ... の in の後には名詞や動名詞を置く。","drive":{"ja":"地域のボランティアは、公園をきれいに保つ上で重要な役割を果たせます。","en":"Local volunteers can play an important role in keeping parks clean."}},{"id":"g2-collocation-008","q":"Students who volunteer regularly can gain valuable ___ outside the classroom.","q_ja":"定期的にボランティア活動をする生徒は、教室の外で貴重な経験を積めます。","choices":[{"t":"experienced","why":"experienced は形容詞で、valuable の後に必要な名詞ではない。"},{"t":"experience","why":"正解。gain valuable experience で、貴重な経験を積むことを表す。"},{"t":"experiencing","why":"experiencing は、ここでは経験の蓄積を表す名詞として使えない。"},{"t":"experiential","why":"experiential は経験に基づくという意味の形容詞で、目的語の名詞にならない。"}],"answer":1,"point":"gain experience で「経験を積む」。経験の蓄積を表す experience は通常数えない。","drive":{"ja":"定期的にボランティア活動をする生徒は、教室の外で貴重な経験を積めます。","en":"Students who volunteer regularly can gain valuable experience outside the classroom."}},{"id":"g2-collocation-009","q":"Community events can help residents build strong ___ with their neighbors.","q_ja":"地域の行事は、住民が近所の人々と強いつながりを築くのに役立ちます。","choices":[{"t":"relate","why":"relate は動詞で、strong の後に必要な名詞ではない。"},{"t":"related","why":"related は形容詞や過去分詞で、築くものを表す名詞にならない。"},{"t":"relationships","why":"正解。build strong relationships with ... で、相手と強いつながりを築くことを表す。"},{"t":"relational","why":"relational は形容詞で、build の目的語になる名詞ではない。"}],"answer":2,"point":"build relationships with ... で、人との関係を築くことを表す。","drive":{"ja":"地域の行事は、住民が近所の人々と強いつながりを築くのに役立ちます。","en":"Community events can help residents build strong relationships with their neighbors."}},{"id":"g2-collocation-010","q":"Schools can ___ awareness of food waste by showing students how much food is left after lunch.","q_ja":"学校は、昼食後にどれだけ食べ物が残るかを生徒に示すことで、食品の無駄への意識を高められます。","choices":[{"t":"rise","why":"rise は自動詞なので、awareness を目的語に取れない。"},{"t":"grow up","why":"grow up は成長するという意味で、awareness を目的語に取れない。"},{"t":"stand","why":"stand awareness という組み合わせでは、意識を高める意味にならない。"},{"t":"raise","why":"正解。raise awareness of ... で、意識を高める対象を示す。"}],"answer":3,"point":"raise awareness of ... で「〜への意識を高める」。","drive":{"ja":"学校は、昼食後にどれだけ食べ物が残るかを生徒に示すことで、食品の無駄への意識を高められます。","en":"Schools can raise awareness of food waste by showing students how much food is left after lunch."}}],"connector":[{"id":"g2-connector-001","q":"The new sports center has modern equipment. ___, its membership fee is too high for many students.","q_ja":"新しいスポーツセンターには最新の設備があります。しかし、多くの生徒にとって会費が高すぎます。","choices":[{"t":"Therefore","why":"設備が最新であることから、会費が高すぎるとは直接結論づけられない。"},{"t":"However","why":"正解。設備の良さという利点から、会費の高さという欠点に転じている。"},{"t":"For example","why":"会費の高さは、設備が最新であることの具体例ではない。"},{"t":"In addition","why":"利点の追加ではなく、利用の障害となる欠点を示している。"}],"answer":1,"point":"利点に続けて欠点を示すときは However, ...。","drive":{"ja":"新しいスポーツセンターには最新の設備があります。しかし、多くの生徒にとって会費が高すぎます。","en":"The new sports center has modern equipment. However, its membership fee is too high for many students."}},{"id":"g2-connector-002","q":"The only bridge to the island is closed, and there are no boats today. ___, visitors cannot reach the island.","q_ja":"島に通じる唯一の橋が閉鎖されており、今日は船もありません。そのため、訪問者は島に行けません。","choices":[{"t":"However","why":"島に行けないことは、前の内容に反する話ではなく結果。"},{"t":"For example","why":"島に行けないことは、橋の閉鎖などの具体例ではなく結果。"},{"t":"In addition","why":"独立した情報の追加ではなく、交通手段がないことから導かれる結論。"},{"t":"Therefore","why":"正解。交通手段がないことを根拠に、島に行けないと結論づけている。"}],"answer":3,"point":"根拠から論理的な結論を導くときは Therefore, ...。","drive":{"ja":"島に通じる唯一の橋が閉鎖されており、今日は船もありません。そのため、訪問者は島に行けません。","en":"The only bridge to the island is closed, and there are no boats today. Therefore, visitors cannot reach the island."}},{"id":"g2-connector-003","q":"Students can help the environment in simple ways. ___, they can bring reusable bags when they go shopping.","q_ja":"生徒は簡単な方法で環境を守る手助けができます。例えば、買い物に行くときに繰り返し使える袋を持参できます。","choices":[{"t":"For example","why":"正解。環境を守る簡単な方法の具体例として、袋の持参を挙げている。"},{"t":"However","why":"袋を持参することは、前の内容に反する話ではない。"},{"t":"As a result","why":"袋を持参できることは、前の一般的な説明によって起きた },{"t":"This website supplies parents with informations about a school that opened last year.","why":"語法の誤り。information は不可算名詞なので、informations の複数形の s を取り除く。"}],"answer":4,"point":"information は不可算名詞なので、複数形の s を付けない。","drive":{"ja":"このウェブサイトは、昨年開校した学校についての情報を保護者に提供している。","en":"This website supplies parents with information about a school that opened last year."}},{"id":"g2-error-009","q":"私たちの上司は、会社が先月導入した研修制度を支持している。","choices":[{"t":"Our manager support a training program that the company introduced last month.","why":"三単現のsの誤り。主語 Our manager は三人称単数なので、support を supports にする。"},{"t":"Our manager supports a training program that the company introduced last month.","why":"正解。単数主語に supports が対応し、support の直後に目的語があり、a training program と last month に対応する過去形 introduced も正しい。"},{"t":"Our manager supports a training program that the company introduces last month.","why":"時制の誤り。last month は過去の時を示すので、introduces を introduced にする。"},{"t":"Our manager supports an training program that the company introduced last month.","why":"冠詞の誤り。training は子音で始まる音なので、an を a にする。"},{"t":"Our managre supports a training program that the company introduced last month.","why":"スペルの誤り。「上司」を表す managre は manager とつづる。"},{"t":"Our manager supports for a training program that the company introduced last month.","why":"語法の誤り。動詞 support は目的語を直接続けるので、for を取り除く。"}],"answer":1,"point":"「〜を支持する」は support 〜で表し、目的語の前に for を置かない。","drive":{"ja":"私たちの上司は、会社が先月導入した研修制度を支持している。","en":"Our manager supports a training program that the company introduced last month."}},{"id":"g2-error-010","q":"先月、この図書館は学生にタブレット端末を貸し出すサービスを始めた。","choices":[{"t":"Last month, this library started a service that lend tablets to students.","why":"三単現の誤り。that の先行詞 a service は単数なので lend を lends にする。"},{"t":"Last month, this library starts a service that lends tablets to students.","why":"時制の誤り。Last month は過去なので starts を過去形 started にする。"},{"t":"Last month, this library started an service that lends tablets to students.","why":"冠詞の誤り。service は子音で始まる音なので an を a にする。"},{"t":"Last month, this libary started a service that lends tablets to students.","why":"スペルの誤り。libary は library とつづる。"},{"t":"Last month, this library started a service that lends tablets to students.","why":"正解。Last month に過去形 started、a service に合う三単現の lends、「貸す」は lend 物 to 人。"},{"t":"Last month, this library started a service that borrows tablets to students.","why":"語法の誤り。borrow は「借りる」。「貸す」は lend 物 to 人。"}],"answer":4,"point":"「人に物を貸す」は lend 物 to 人。「借りる」の borrow と区別する。","drive":{"ja":"先月、この図書館は学生にタブレット端末を貸し出すサービスを始めた。","en":"Last month, this library started a service that lends tablets to students."},"q_ja":""}],"ja2en":[{"id":"g2-ja2en-001","q":"私は、学校は生徒にもっと読書を勧めるべきだという意見に賛成です。","q_ja":"日本語の意味に合う英文を選ぶ。","choices":[{"t":"I agree that schools should encourage students to read more.","why":"正解。agree that で、学校が読書を勧めることへの賛成を表している。"},{"t":"I disagree that schools should encourage students to read more.","why":"disagree は反対するという意味で、賛否が逆。"},{"t":"I agree that students should encourage schools to read more.","why":"勧める側と勧められる側が逆。"},{"t":"I agree that schools should encourage students to read less.","why":"less は「より少なく」で、読む量の増減が逆。"},{"t":"I agree that schools should discourage students from reading more.","why":"discourage は思いとどまらせるという意味で、勧めることにならない。"},{"t":"I agree that schools should encourage students read more.","why":"encourage 人 to do の to が抜けている。"}],"answer":0,"point":"I agree that ... で賛成、encourage 人 to do で行動を勧める。","drive":{"ja":"私は、学校は生徒にもっと読書を勧めるべきだという意見に賛成です。","en":"I agree that schools should encourage students to read more."}},{"id":"g2-ja2en-002","q":"私は、すべての宿題をなくすべきだとは思いません。","q_ja":"日本語の意味に合う英文を選ぶ。","choices":[{"t":"I think that all homework should be removed.","why":"否定がなく、すべての宿題をなくすことに賛成している。"},{"t":"I do not think that all homework has already been removed.","why":"すでになくされたかどうかの話で、なくすべきかという判断ではない。"},{"t":"I do not think that all homework should be removed.","why":"正解。I do not think that ... と should で、宿題をすべてなくすべきだという意見への否定を表す。"},{"t":"I do not think that all homework should be increased.","why":"increased は増やされるという意味で、なくすという意味ではない。"},{"t":"I do not think that only some homework should be removed.","why":"only some は一部だけという意味で、すべてという範囲が変わっている。"},{"t":"I do not think that all homework should removed.","why":"受け身の should be removed に必要な be がない。"}],"answer":2,"point":"「〜だとは思わない」は I do not think that ...。","drive":{"ja":"私は、すべての宿題をなくすべきだとは思いません。","en":"I do not think that all homework should be removed."}},{"id":"g2-ja2en-003","q":"オンライン授業は便利ですが、すべての生徒に適しているわけではありません。","q_ja":"日本語の意味に合う英文を選ぶ。","choices":[{"t":"Although online classes are convenient, they suit every student.","why":"すべての生徒に適しているという意味になり、否定が抜けている。"},{"t":"Because online classes are convenient, they do not suit every student.","why":"Because は理由を表し、「便利ですが」という譲歩を示さない。"},{"t":"Although online classes are convenient, no students can attend them.","why":"誰も受講できないという、日本語にない内容になっている。"},{"t":"Although online classes are convenient, they do not suits every student.","why":"do not の後は原形 suit を使う。"},{"t":"Although online classes are inconvenient, they do not suit every student.","why":"inconvenient は不便なという意味で、前半の意味が逆。"},{"t":"Although online classes are convenient, they do not suit every student.","why":"正解。便利さを認めた上で、すべての生徒に合うわけではないと述べている。"}],"answer":5,"point":"Although ... で譲歩を表し、not ... every で部分否定を表す。","drive":{"ja":"オンライン授業は便利ですが、すべての生徒に適しているわけではありません。","en":"Although online classes are convenient, they do not suit every student."}},{"id":"g2-ja2en-004","q":"この方法には費用がかかることは確かですが、時間を節約できます。","q_ja":"日本語の意味に合う英文を選ぶ。","choices":[{"t":"It is true that this method saves money, but it takes time.","why":"費用を節約するが時間がかかるという意味で、利点と欠点が逆。"},{"t":"It is true that this method costs money, but it can save time.","why":"正解。費用がかかることを認め、時間を節約できるという利点を続けている。"},{"t":"It is true that this method costs time, but it can save money.","why":"時間がかかるが費用を節約できるという意味で、内容が逆。"},{"t":"It is true that this method costs money, but it cannot save time.","why":"cannot によって、時間を節約できないという意味になっている。"},{"t":"It is true that this method cost money, but it can save time.","why":"単数主語 this method に対する現在形は costs。"},{"t":"It is true that this method costs money because it can save time.","why":"because は理由を表し、「ですが」という対比を示さない。"}],"answer":1,"point":"It is true that ..., but ... で事実を認めた上で別の論点を述べる。","drive":{"ja":"この方法には費用がかかることは確かですが、時間を節約できます。","en":"It is true that this method costs money, but it can save time."}},{"id":"g2-ja2en-005","q":"公共交通機関が安くなれば、より多くの人がそれを利用するでしょう。","q_ja":"日本語の意味に合う英文を選ぶ。","choices":[{"t":"If public transportation becomes cheaper, fewer people will use it.","why":"fewer people はより少ない人という意味で、増減が逆。"},{"t":"If public transportation becomes more expensive, more people will use it.","why":"more expensive はより高くという意味で、条件が逆。"},{"t":"If public transportation becomes cheaper, more people will avoid it.","why":"avoid は避けるという意味で、利用するという意味ではない。"},{"t":"If public transportation will become cheaper, more people will use it.","why":"この未来の条件を表す if 節では、will become ではなく becomes を使う。"},{"t":"If public transportation becomes cheaper, more people will use it.","why":"正解。料金が下がるという条件と、利用者が増えるという予想を示している。"},{"t":"If public transportation becomes cheaper, more people used it.","why":"used は過去形で、将来の予想を示していない。"}],"answer":4,"point":"未来の条件は If＋現在形、予想する結果は will＋動詞の原形。","drive":{"ja":"公共交通機関が安くなれば、より多くの人がそれを利用するでしょう。","en":"If public transportation becomes cheaper, more people will use it."}},{"id":"g2-ja2en-006","q":"運動は健康を保つのに役立つので、学校は生徒に運動を勧めるべきです。","q_ja":"日本語の意味に合う英文を選ぶ。","choices":[{"t":"Schools should encourage students to exercise although it helps them stay healthy.","why":"although は譲歩で、健康に役立つことを理由として示していない。"},{"t":"Students should encourage schools to exercise because it helps them stay healthy.","why":"勧める側と勧められる側が逆。"},{"t":"Schools should discourage students from exercising because it helps them stay healthy.","why":"discourage は思いとどまらせるという意味で、勧めるという意味ではない。"},{"t":"Schools should encourage students to exercise because it helps them stay healthy.","why":"正解。because の後に、運動を勧める理由を示している。"},{"t":"Schools should encourage students to exercise because it prevents them from staying healthy.","why":"prevents them from staying healthy は健康を保つのを妨げるという意味で、理由が逆。"},{"t":"Schools should encourage students to exercise because it help them stay healthy.","why":"主語 it に対する現在形は helps。"}],"answer":3,"point":"主張の後に because＋理由を置くと、主張の根拠を示せる。","drive":{"ja":"運動は健康を保つのに役立つので、学校は生徒に運動を勧めるべきです。","en":"Schools should encourage students to exercise because it helps them stay healthy."}},{"id":"g2-ja2en-007","q":"例えば、生徒は昼休みに図書館で本を借りることができます。","q_ja":"日本語の意味に合う英文を選ぶ。","choices":[{"t":"For example, students can borrow books from the library during their lunch break.","why":"正解。例示、図書館から借りる行為、昼休みという時を正しく表している。"},{"t":"For example, students can lend books to the library during their lunch break.","why":"lend ... to ... は貸すという意味で、図書館から借りるという意味ではない。"},{"t":"For example, students cannot borrow books from the library during their lunch break.","why":"cannot によって借りられないという意味になっている。"},{"t":"In conclusion, students can borrow books from the library during their lunch break.","why":"In conclusion は結論を示す表現で、「例えば」ではない。"},{"t":"For example, students can buy books from the library during their lunch break.","why":"buy は買うという意味で、借りるという意味ではない。"},{"t":"For example, students can borrowed books from the library during their lunch break.","why":"can の後は原形 borrow を使う。"}],"answer":0,"point":"For example, ... で例を示し、borrow ... from ... で借りる相手や場所を示す。","drive":{"ja":"例えば、生徒は昼休みに図書館で本を借りることができます。","en":"For example, students can borrow books from the library during their lunch break."}},{"id":"g2-ja2en-008","q":"このような活動を通して、若者は地域社会について学ぶことができます。","q_ja":"日本語の意味に合う英文を選ぶ。","choices":[{"t":"Without such activities, young people can learn about their local communities.","why":"Without は「〜なしで」で、「〜を通して」ではない。"},{"t":"Through such activities, young people can teach their local communities about young people.","why":"地域社会に若者について教えるという意味で、学ぶ主体と内容が変わっている。"},{"t":"Through such activities, young people can learn about their local communities.","why":"正解。活動を通して、地域社会について学べることを表している。"},{"t":"Through such activities, young people cannot learn about their local communities.","why":"cannot によって学べないという意味になっている。"},{"t":"Through such activities, young people can learn their local communities.","why":"地域社会について学ぶという意味には learn about の about が必要。"},{"t":"Before such activities, young people can learn about their local communities.","why":"Before は「〜の前に」で、活動を通して学ぶという意味ではない。"}],"answer":2,"point":"Through＋名詞で「〜を通して」、learn about ... で「〜について学ぶ」。","drive":{"ja":"このような活動を通して、若者は地域社会について学ぶことができます。","en":"Through such activities, young people can learn about their local communities."}},{"id":"g2-ja2en-009","q":"これらの二つの理由から、私は都市にはもっと公園が必要だと考えます。","q_ja":"日本語の意味に合う英文を選ぶ。","choices":[{"t":"For these two reasons, I believe that cities need fewer parks.","why":"fewer parks はより少ない公園という意味で、増やす必要性を示していない。"},{"t":"For these two reasons, I do not believe that cities need more parks.","why":"do not believe によって結論の賛否が逆になっている。"},{"t":"For these two reasons, I believe that parks need more cities.","why":"都市と公園の関係が逆。"},{"t":"For these two reasons, I believe that cities needs more parks.","why":"複数主語 cities に対する現在形は need。"},{"t":"Despite these two reasons, I believe that cities need more parks.","why":"Despite は「〜にもかかわらず」で、理由に基づく結論を示さない。"},{"t":"For these two reasons, I believe that cities need more parks.","why":"正解。二つの理由を受け、都市にもっと公園が必要だという結論を述べている。"}],"answer":5,"point":"For these two reasons, ... は二つの理由を受けて結論を示す型。","drive":{"ja":"これらの二つの理由から、私は都市にはもっと公園が必要だと考えます。","en":"For these two reasons, I believe that cities need more parks."}},{"id":"g2-ja2en-010","q":"結論として、私たちは食品の無駄を減らすために行動すべきです。","q_ja":"日本語の意味に合う英文を選ぶ。","choices":[{"t":"For example, we should take action to reduce food waste.","why":"For example は例示で、結論を示す表現ではない。"},{"t":"In conclusion, we should take action to reduce food waste.","why":"正解。結論として、食品の無駄を減らすための行動を提案している。"},{"t":"In conclusion, we should take action to increase food waste.","why":"increase は増やすという意味で、目的が逆。"},{"t":"In conclusion, we should avoid taking action to reduce food waste.","why":"avoid taking action は行動を避けるという意味で、提案が逆。"},{"t":"In conclusion, we should take action to reducing food waste.","why":"目的を表す不定詞の to の後は原形 reduce を使う。"},{"t":"In conclusion, we should take action because food waste has already disappeared.","why":"食品の無駄がすでになくなったからという、日本語にない理由を加えている。"}],"answer":1,"point":"In conclusion, ... で結論を導き、take action to do で行動の目的を示す。","drive":{"ja":"結論として、私たちは食品の無駄を減らすために行動すべきです。","en":"In conclusion, we should take action to reduce food waste."}}],"paraphrase":[{"id":"g2-paraphrase-001","q":"Using public transportation can help reduce air pollution in cities.","q_ja":"公共交通機関の利用は都市の大気汚染を減らすのに役立つ可能性がある。","choices":[{"t":"Traveling by bus or train can contribute to cleaner air in cities.","why":"正解。公共交通の利用が都市の空気をきれいにする一助になり得るという意味を保っている。"},{"t":"Traveling by bus or train always removes all air pollution from cities.","why":"可能性を、常に汚染をすべてなくすという断定に変えている。"},{"t":"Using public transportation can increase air pollution in cities.","why":"減らすを増やすに変えており、意味が逆である。"},{"t":"Only people living outside cities can use public transportation.","why":"利用者を都市の外の住民だけに限定しており、原文にない。"},{"t":"Using public transportation can helps reduce air pollution in cities.","why":"助動詞 can の後に helps を置いており、文法上の誤りがある。"},{"t":"Cleaner city air makes public transportation less useful.","why":"公共交通が空気の改善に役立つという関係を別の因果関係に変えている。"}],"answer":0,"point":"can help reduce は can contribute to reducing と言い換えられる。","drive":{"ja":"公共交通機関の利用は都市の大気汚染削減に役立つ可能性がある。同じ意味を別の英語で。","en":"Traveling by bus or train can contribute to cleaner air in cities."}},{"id":"g2-paraphrase-002","q":"Students do not have to buy a tablet to join this course.","q_ja":"この講座に参加するために、生徒はタブレットを買う必要はない。","choices":[{"t":"Students are not allowed to buy a tablet for this course.","why":"購入の必要がないことを、購入してはいけないという禁止に変えている。"},{"t":"Every student must buy a tablet before joining this course.","why":"不要な購入を義務に変えており、意味が逆である。"},{"t":"Students do not need to join this course if they own a tablet.","why":"不要なのは端末の購入なのに、講座への参加に変えている。"},{"t":"Buying a tablet is not required for students taking this course.","why":"正解。講座を受ける生徒に購入義務はないという意味を保っている。"},{"t":"Students do not have buying a tablet to join this course.","why":"have to の後は動詞の原形であり、have buying は誤りである。"},{"t":"Students must sell their tablets before taking this course.","why":"タブレットを売る義務は原文にない。"}],"answer":3,"point":"do not have to は「する必要がない」で、禁止を表す must not と異なる。","drive":{"ja":"講座に参加するためにタブレットを買う必要はない。同じ意味を別の英語で。","en":"Buying a tablet is not required for students taking this course."}},{"id":"g2-paraphrase-003","q":"More employees work from home now than they did five years ago.","q_ja":"在宅で働く従業員は、5年前より現在のほうが多い。","choices":[{"t":"Fewer employees work from home now than they did five years ago.","why":"増加を減少に変えており、意味が逆である。"},{"t":"All employees have worked from home for the past five years.","why":"人数の増加を、全員が5年間在宅勤務しているという内容に変えている。"},{"t":"Employees now work at home for more hours each day than five years ago.","why":"人数の比較を、1日あたりの勤務時間の比較に変えている。"},{"t":"The number of employees working from home have increased over the past five years.","why":"主語の中心は単数の number なので、have ではなく has が必要である。"},{"t":"Companies began allowing home working exactly five years ago.","why":"5年前との比較を、制度が始まった時点の説明に変えている。"},{"t":"The number of employees working from home has increased over the past five years.","why":"正解。現在の人数が5年前より増えたという比較を保っている。"}],"answer":5,"point":"人数の比較は the number of ... has increased で言い換えられる。","drive":{"ja":"在宅で働く従業員は5年前より増えている。同じ意味を別の英語で。","en":"The number of employees working from home has increased over the past five years."}},{"id":"g2-paraphrase-004","q":"The town postponed the festival because heavy rain was expected.","q_ja":"大雨が予想されたため、町は祭りを延期した。","choices":[{"t":"The town permanently canceled the festival because heavy rain was expected.","why":"延期を永久的な中止に変えている。"},{"t":"The festival was put off by the town due to the forecast of heavy rain.","why":"正解。大雨の予報が理由で祭りを延期したという意味を保っている。"},{"t":"The town postponed the festival although dry weather was expected.","why":"大雨が理由なのに、乾燥した天候なのに延期したという内容に変えている。"},{"t":"The town expected heavy rain because it had postponed the festival.","why":"大雨の予想と延期の因果関係を逆にしている。"},{"t":"The town postponed the festival because of heavy rain was expected.","why":"because of の後に主語と動詞のある節を直接置いている。"},{"t":"The town held the festival earlier to avoid the expected rain.","why":"日程を遅らせる延期を、前倒しで開催することに変えている。"}],"answer":1,"point":"because の理由は due to と名詞句を使って表せる。","drive":{"ja":"大雨が予想されたため、町は祭りを延期した。同じ意味を別の英語で。","en":"The festival was put off by the town due to the forecast of heavy rain."}},{"id":"g2-paraphrase-005","q":"The new machines are too expensive for this small factory to buy.","q_ja":"新しい機械は高すぎて、この小さな工場には買えない。","choices":[{"t":"This small factory can easily afford the expensive new machines.","why":"買えないという意味を、簡単に買えるに変えている。"},{"t":"The new machines are cheap enough for this small factory to buy.","why":"高すぎるという意味を、買えるほど安いに変えている。"},{"t":"The new machines are so expensive that this small factory cannot afford they.","why":"afford の目的語は they ではなく them が必要である。"},{"t":"This small factory cannot buy the new machines because they are too large.","why":"購入できない理由を価格から大きさに変えている。"},{"t":"The new machines cost so much that this small factory cannot afford them.","why":"正解。価格が高すぎて工場に購入する余裕がないという意味を保っている。"},{"t":"The machines are too expensive for every factory in the country to buy.","why":"対象をこの工場から国内のすべての工場に広げている。"}],"answer":4,"point":"too ... to は so ... that ... cannot で言い換えられる。","drive":{"ja":"新しい機械は高すぎてこの工場には買えない。同じ意味を別の英語で。","en":"The new machines cost so much that this small factory cannot afford them."}},{"id":"g2-paraphrase-006","q":"Unless residents separate their waste, the recycling program will not succeed.","q_ja":"住民がごみを分別しなければ、リサイクル事業は成功しない。","choices":[{"t":"The recycling program will succeed even if residents do not sort their waste.","why":"分別しなくても成功するという逆の条件関係に変えている。"},{"t":"The recycling program will fail if residents sort their waste.","why":"失敗の条件を、分別しない場合から分別する場合に変えている。"},{"t":"The recycling program will fail if residents do not sort their waste.","why":"正解。分別しないことが事業の失敗につながるという条件を保っている。"},{"t":"Residents need not sort their waste for the recycling program to succeed.","why":"成功には分別が必要なのに、分別は不要だという意味に変えている。"},{"t":"The recycling program will fail unless residents sorts their waste.","why":"複数主語 residents に三単現の sorts を使っている。"},{"t":"The recycling program will certainly succeed once residents sort their waste.","why":"分別は成功に必要という内容を、分別だけで成功が確実になるという内容に変えている。"}],"answer":2,"point":"Unless A, B は If not A, B と言い換えられる。","drive":{"ja":"住民がごみを分別しなければ事業は成功しない。同じ意味を別の英語で。","en":"The recycling program will fail if residents do not sort their waste."}},{"id":"g2-paraphrase-007","q":"Despite the higher price, some consumers choose locally grown vegetables.","q_ja":"価格が高くても、地元で育てられた野菜を選ぶ消費者もいる。","choices":[{"t":"All consumers choose locally grown vegetables because they cost less.","why":"一部を全員に変え、価格が高いことも安いことに変えている。"},{"t":"Some consumers avoid locally grown vegetables because of their higher price.","why":"高くても選ぶという意味を、高いから避けるに変えている。"},{"t":"Some consumers choose locally grown vegetables only when they are cheaper.","why":"高くても選ぶという意味を、安い場合に限って選ぶに変えている。"},{"t":"Despite locally grown vegetables cost more, some consumers choose them.","why":"Despite の後に節を直接置いており、Although などが必要である。"},{"t":"Some farmers charge more because consumers refuse to buy local vegetables.","why":"消費者の選択を、農家の値付けと不買の因果関係に変えている。"},{"t":"Although locally grown vegetables cost more, some consumers prefer to buy them.","why":"正解。価格が高いという条件にもかかわらず、一部の消費者が選ぶ意味を保っている。"}],"answer":5,"point":"Despite と名詞句は Although と節で言い換えられる。","drive":{"ja":"価格が高くても地元産の野菜を選ぶ消費者もいる。同じ意味を別の英語で。","en":"Although locally grown vegetables cost more, some consumers prefer to buy them."}},{"id":"g2-paraphrase-008","q":"The community center has been closed since Monday.","q_ja":"地域センターは月曜日からずっと閉まっている。","choices":[{"t":"The community center closed on Monday and has not reopened yet.","why":"正解。月曜日に閉まり、現在も再開していないという継続を保っている。"},{"t":"The community center was closed only on Monday.","why":"月曜日から続く状態を、月曜日だけの閉館に変えている。"},{"t":"The community center has remained open since Monday.","why":"閉まっている状態を、開いている状態に変えている。"},{"t":"The community center will close next Monday.","why":"過去から現在までの状態を、来週の予定に変えている。"},{"t":"The community center has been closed since three days.","why":"since は起点に使うため、期間の three days には for が必要である。"},{"t":"The community center reopened on Monday after a long closure.","why":"閉館の開始日を、再開した日に変えている。"}],"answer":0,"point":"has been closed since は過去の時点から現在まで続く閉館状態を表す。","drive":{"ja":"地域センターは月曜日から現在まで閉まっている。同じ意味を別の英語で。","en":"The community center closed on Monday and has not reopened yet."}},{"id":"g2-paraphrase-009","q":"The school encourages students to walk rather than drive short distances.","q_ja":"学校は短い距離なら車を運転するより歩くように生徒に勧めている。","choices":[{"t":"The school requires every student to walk regardless of the distance.","why":"推奨を義務に変え、短距離という条件もなくしている。"},{"t":"The school encourages students to drive instead of walking short distances.","why":"勧める移動方法を徒歩から車に逆転している。"},{"t":"The school urges students to walk instead of driving when traveling short distances.","why":"正解。短距離では車の運転の代わりに徒歩を勧めるという意味を保っている。"},{"t":"Students encourage the school to stop people from walking short distances.","why":"勧める主体と内容を変えている。"},{"t":"The school encourages students walking rather than driving short distances.","why":"encourage 人 to do の形が必要で、students walking は誤りである。"},{"t":"The school encourages walking only for journeys that are very long.","why":"対象を短い距離から非常に長い距離だけに変えている。"}],"answer":2,"point":"rather than は instead of と動名詞を使って言い換えられる。","drive":{"ja":"学校は短距離の移動では車より徒歩を勧めている。同じ意味を別の英語で。","en":"The school urges students to walk instead of driving when traveling short distances."}},{"id":"g2-paraphrase-010","q":"Online training is not as costly as sending staff to another city.","q_ja":"オンライン研修は、職員を別の都市に派遣するほど費用がかからない。","choices":[{"t":"Online training costs more than sending staff to another city.","why":"費用の大小関係を逆にしている。"},{"t":"Online training and sending staff to another city cost exactly the same.","why":"費用が異なるという比較を、同額に変えている。"},{"t":"Online training is always free for all companies.","why":"比較的安いことを、全企業で常に無料だという内容に変えている。"},{"t":"Online training is less costly as sending staff to another city.","why":"less を使う比較には as ではなく than が必要である。"},{"t":"Training staff online is less expensive than having them travel to another city.","why":"正解。オンライン研修の費用が他都市への派遣より低いという比較を保っている。"},{"t":"Sending staff to another city is less effective than online training.","why":"費用の比較を研修の効果の比較に変えている。"}],"answer":4,"point":"not as costly as は less expensive than と言い換えられる。","drive":{"ja":"オンライン研修は職員を別の都市に派遣するより安い。同じ意味を別の英語で。","en":"Training staff online is less expensive than having them travel to another city."}}],"reason":[{"id":"g2-reason-001","q":"TOPIC: Should cities create more bicycle lanes?\nPosition: Agree","q_ja":"都市は自転車専用レーンをもっと整備すべきか（賛成）","choices":[{"t":"Separate bicycle lanes can reduce the risk of accidents between cyclists and cars.","why":"正解。車との事故を減らせるという安全面の利点が、賛成を支える。"},{"t":"Building bicycle lanes can leave less road space for buses.","why":"道路の空間が減るという欠点で、反対の理由になる。"},{"t":"Some bicycles are blue, while others are red.","why":"自転車の色の話で、専用レーンを増やす理由にならない。"},{"t":"Bicycle lanes are a topic that people sometimes discuss.","why":"話題になるという事実だけで、整備の利点がない。"},{"t":"My cousin saw a bicycle lane near a station yesterday.","why":"個人が見た出来事だけで、一般的な理由にならない。"},{"t":"More bicycle lanes are necessary because cities need more of them.","why":"必要だという主張を繰り返すだけで、根拠がない。"}],"answer":0,"point":"理由には政策によって生まれる一般的な利点を示す。","drive":{"ja":"自転車専用レーンを増やすことに賛成する理由を英語で1文。","en":"Separate bicycle lanes can reduce the risk of accidents between cyclists and cars."}},{"id":"g2-reason-002","q":"TOPIC: Should schools replace all printed textbooks with digital ones?\nPosition: Disagree","q_ja":"学校はすべての紙の教科書をデジタル教科書に置き換えるべきか（反対）","choices":[{"t":"Digital textbooks can make school bags lighter.","why":"デジタル教科書の利点で、賛成の理由になる。"},{"t":"Students study several subjects during the school year.","why":"授業の事実だけで、教材の置き換えの是非につながらない。"},{"t":"Schools should serve more vegetables at lunch.","why":"給食の話で、教科書の形式からずれている。"},{"t":"Keeping printed textbooks allows students to study even when their devices stop working.","why":"正解。端末が故障しても学べるため、紙を残す必要性を示している。"},{"t":"My sister opened a printed textbook after dinner yesterday.","why":"個人の行動だけで、紙が必要な理由を説明していない。"},{"t":"Replacing every textbook is wrong because it is not the right choice.","why":"反対の主張を繰り返すだけで、根拠がない。"}],"answer":3,"point":"全面的な置き換えへの反対は、従来の教材を残す必要性から説明する。","drive":{"ja":"教科書をすべてデジタル化することに反対する理由を英語で1文。","en":"Keeping printed textbooks allows students to study even when their devices stop working."}},{"id":"g2-reason-003","q":"TOPIC: Should companies offer more flexible working hours?\nPosition: Agree","q_ja":"企業は勤務時間をもっと柔軟に選べるようにすべきか（賛成）","choices":[{"t":"Different working hours can make team meetings harder to arrange.","why":"会議を調整しにくいという欠点で、反対の理由になる。"},{"t":"Some office buildings have meeting rooms on the first floor.","why":"設備の話で、柔軟な勤務時間を支持する理由にならない。"},{"t":"I like the idea of flexible hours very much.","why":"好きだという感想だけで、利点を説明していない。"},{"t":"Flexible hours should be offered because they should be available.","why":"同じ主張の繰り返しで、根拠がない。"},{"t":"A flexible schedule will automatically double every company's profits.","why":"勤務時間だけで全企業の利益が倍になるという論理の飛躍がある。"},{"t":"Flexible hours help employees fit medical appointments around their work.","why":"正解。通院と仕事を両立しやすくなるという利点がある。"}],"answer":5,"point":"制度と利点を、誰にどのような効果があるかでつなぐ。","drive":{"ja":"勤務時間を柔軟にすることに賛成する理由を英語で1文。","en":"Flexible hours help employees fit medical appointments around their work."}},{"id":"g2-reason-004","q":"TOPIC: Should supermarkets stop selling fruit in plastic packages?\nPosition: Agree","q_ja":"スーパーはプラスチック包装の果物の販売をやめるべきか（賛成）","choices":[{"t":"Plastic packages can protect soft fruit from damage during transport.","why":"包装を残す利点で、販売中止への反対の理由になる。"},{"t":"Selling fruit without plastic packages can reduce the amount of waste customers throw away.","why":"正解。包装ごみが減るという環境上の利点が、賛成を支える。"},{"t":"Many supermarkets sell apples and oranges.","why":"商品の種類を述べるだけで、包装をやめる理由にならない。"},{"t":"My neighbor bought two apples on Saturday.","why":"個人的な購入の出来事で、一般的な理由にならない。"},{"t":"Supermarkets should play quieter music.","why":"店内の音楽の話で、包装の問題からずれている。"},{"t":"Removing fruit packages will solve every environmental problem.","why":"包装だけですべての環境問題が解決するという言い過ぎ。"}],"answer":1,"point":"環境の話題では、具体的に何の廃棄物が減るかを述べる。","drive":{"ja":"果物のプラスチック包装をやめることに賛成する理由を英語で1文。","en":"Selling fruit without plastic packages can reduce the amount of waste customers throw away."}},{"id":"g2-reason-005","q":"TOPIC: Should local libraries stay open later in the evening?\nPosition: Agree","q_ja":"地域の図書館は夜の開館時間を延ばすべきか（賛成）","choices":[{"t":"Longer opening hours could increase staff costs.","why":"人件費が増えるという欠点で、反対の理由になる。"},{"t":"Libraries usually keep books on shelves.","why":"本の置き方の事実だけで、開館時間を延ばす理由にならない。"},{"t":"I enjoy reading stories about animals.","why":"読書の好みだけで、夜の開館の必要性を示していない。"},{"t":"The library near my house has a green front door.","why":"建物の外見で、開館時間に関係がない。"},{"t":"Later opening hours would allow people who work during the day to use library services.","why":"正解。昼間働く人も利用できるという利点が、賛成を支える。"},{"t":"Libraries need later hours because closing early is not late enough.","why":"時間を延ばす主張の繰り返しで、利点を示していない。"}],"answer":4,"point":"公共施設の利用時間は、利用できる人が増える点を理由にできる。","drive":{"ja":"図書館の夜の開館時間を延ばすことに賛成する理由を英語で1文。","en":"Later opening hours would allow people who work during the day to use library services."}},{"id":"g2-reason-006","q":"TOPIC: Should schools require students to use smartphones for every homework assignment?\nPosition: Disagree","q_ja":"学校はすべての宿題でスマートフォンの使用を必須にすべきか（反対）","choices":[{"t":"Smartphones allow students to send homework to teachers quickly.","why":"提出が速いという利点で、賛成の理由になる。"},{"t":"Smartphones come in different sizes.","why":"端末の大きさの事実だけで、必須化への反対理由にならない。"},{"t":"Students whose families cannot afford smartphones would have difficulty completing their homework.","why":"正解。端末を買えない家庭の生徒が不利になるため、必須化への反対を支える。"},{"t":"Schools should repair their sports fields.","why":"運動場の整備の話で、宿題の端末使用からずれている。"},{"t":"I do not like smartphone homework.","why":"嫌いだという感想だけで、反対の根拠がない。"},{"t":"A smartphone requirement would make all students forget how to read.","why":"必須化ですべての生徒が読む能力を失うという論理の飛躍がある。"}],"answer":2,"point":"必須化への反対は、必要な道具を持たない人への影響から説明できる。","drive":{"ja":"すべての宿題でスマートフォンを必須にすることに反対する理由を英語で1文。","en":"Students whose families cannot afford smartphones would have difficulty completing their homework."}},{"id":"g2-reason-007","q":"TOPIC: Should cities provide free exercise classes for older residents?\nPosition: Agree","q_ja":"都市は高齢の住民に無料の運動教室を提供すべきか（賛成）","choices":[{"t":"Paying instructors could put pressure on the city budget.","why":"市の財政負担という欠点で、反対の理由になる。"},{"t":"Some exercise classes take place in large rooms.","why":"会場の事実だけで、無料提供の理由にならない。"},{"t":"My uncle wore white shoes to a class last week.","why":"個人の服装の話で、制度を支持する理由にならない。"},{"t":"Cities should build more parking spaces for tourists.","why":"観光客向け駐車場の話で、運動教室からずれている。"},{"t":"These classes are a good service because they are good for residents.","why":"良いという評価を繰り返すだけで、具体的な利点がない。"},{"t":"Free classes can help older residents stay active without adding to their living costs.","why":"正解。生活費の負担を増やさず運動できるという利点がある。"}],"answer":5,"point":"健康施策では、参加のしやすさと健康上の効果をつなぐ。","drive":{"ja":"高齢者向け無料運動教室に賛成する理由を英語で1文。","en":"Free classes can help older residents stay active without adding to their living costs."}},{"id":"g2-reason-008","q":"TOPIC: Should towns remove all face-to-face services and provide them only online?\nPosition: Disagree","q_ja":"町は対面窓口をすべてなくし、行政サービスをオンラインだけにすべきか（反対）","choices":[{"t":"Residents without internet access would struggle to get essential services.","why":"正解。ネットを利用できない住民が必要なサービスを受けにくくなる。"},{"t":"Online services let residents complete forms without traveling to an office.","why":"オンライン化の利点で、対面窓口を残す理由ではない。"},{"t":"Town offices often have signs near their entrances.","why":"案内表示の事実だけで、窓口を残す理由にならない。"},{"t":"My brother visited the town office on Tuesday.","why":"個人の訪問の事実だけで、対面サービスの必要性を示していない。"},{"t":"Towns should hold more music festivals.","why":"音楽イベントの話で、行政サービスの提供方法からずれている。"},{"t":"Online-only services are a bad idea because they are not a good idea.","why":"反対の評価を繰り返すだけで、根拠がない。"}],"answer":0,"point":"オンライン限定への反対は、使えない住民への影響を根拠にする。","drive":{"ja":"行政サービスをオンラインだけにすることに反対する理由を英語で1文。","en":"Residents without internet access would struggle to get essential services."}},{"id":"g2-reason-009","q":"TOPIC: Should companies encourage employees to use public transportation?\nPosition: Agree","q_ja":"企業は従業員に公共交通機関の利用を促すべきか（賛成）","choices":[{"t":"Some employees may face longer journeys when buses run infrequently.","why":"通勤時間が延びるという欠点で、反対の理由になる。"},{"t":"Many buses have windows on both sides.","why":"車両の構造の事実で、利用を促す理由にならない。"},{"t":"Fewer employees driving to work can reduce traffic around company offices.","why":"正解。自動車通勤が減ると周辺の交通量が減るため、賛成を支える。"},{"t":"I saw a train while walking yesterday.","why":"個人的な目撃の話で、企業の方針を支持する理由にならない。"},{"t":"Companies should improve the food in their cafeterias.","why":"社員食堂の話で、通勤方法からずれている。"},{"t":"Using buses will immediately remove all air pollution from cities.","why":"バス利用だけで直ちに大気汚染がすべてなくなるという言い過ぎ。"}],"answer":2,"point":"行動の変化と、その結果として減る負担を示すと理由が明確になる。","drive":{"ja":"従業員の公共交通利用を促すことに賛成する理由を英語で1文。","en":"Fewer employees driving to work can reduce traffic around company offices."}},{"id":"g2-reason-010","q":"TOPIC: Should towns turn every public park into a parking lot?\nPosition: Disagree","q_ja":"町はすべての公園を駐車場に変えるべきか（反対）","choices":[{"t":"More parking lots could make it easier for drivers to find spaces.","why":"駐車場の利点で、転用への賛成の理由になる。"},{"t":"Some parks have gates at their entrances.","why":"設備の事実だけで、転用に反対する理由にならない。"},{"t":"I prefer green signs to blue signs.","why":"看板の色の好みで、土地の用途の議論からずれている。"},{"t":"My friend passed a park on her way home yesterday.","why":"個人の行動だけで、公園を残す必要性を説明していない。"},{"t":"Losing parks would leave residents with fewer places to exercise and relax outdoors.","why":"正解。運動や休息の場所が減るため、公園を残す理由になる。"},{"t":"Changing parks into parking lots is wrong because towns should not do it.","why":"反対の主張を繰り返すだけで、理由がない。"}],"answer":4,"point":"既存の施設をなくす提案には、失われる役割を反対理由にする。","drive":{"ja":"すべての公園を駐車場に変えることに反対する理由を英語で1文。","en":"Losing parks would leave residents with fewer places to exercise and relax outdoors."}}],"summary":[{"id":"g2-summary-001","q":"Some towns collect old electronic devices at public buildings. The devices contain materials that can be used again, so collecting them reduces waste. However, personal information may remain on phones and computers. Towns therefore remind residents to remove their data before handing devices over.","q_ja":"一部の町は公共施設で古い電子機器を回収している。資源を再利用してごみを減らせるが、端末に個人情報が残ることがあるため、町は引き渡す前のデータ削除を住民に呼びかけている。","choices":[{"t":"Collecting old devices supports recycling, but residents need to delete personal data before donating them.","why":"正解。資源の再利用と個人情報の削除という両方の要点をまとめている。"},{"t":"Some towns collect old electronic devices at public buildings.","why":"冒頭の丸写しで、回収の利点と注意点が抜けている。"},{"t":"Old phones and computers are collected at public buildings.","why":"具体例と場所だけに偏り、資源の再利用と個人情報への注意が抜けている。"},{"t":"Towns sell donated devices to pay for new public buildings.","why":"売却や建物の建設費については本文にない。"},{"t":"Residents should delete personal information from old devices.","why":"注意点だけで、回収による利点が抜けている。"},{"t":"Collecting old devices guarantees that no electronic waste will remain.","why":"すべての電子ごみがなくなるという保証は本文にない。"}],"answer":0,"point":"主な利点と注意点の両方を要約に残す。","drive":{"ja":"古い電子機器の回収の利点と注意点を英語1文で要約。","en":"Collecting old devices supports recycling, but residents need to delete personal data before donating them."}},{"id":"g2-summary-002","q":"Several schools have started outdoor lessons in nearby parks. Teachers say that seeing plants and insects directly helps students understand science. Yet heavy rain can make these lessons impossible. Schools keep indoor activities ready so that students can continue learning when the weather changes.","q_ja":"いくつかの学校は近くの公園で屋外授業を始めた。植物や昆虫の直接観察は理科の理解を助けるが、大雨では授業ができないことがあるため、天候が変わっても学べるよう室内活動も準備している。","choices":[{"t":"Several schools have started outdoor lessons in nearby parks.","why":"冒頭の丸写しで、学習効果と天候への対応が抜けている。"},{"t":"Students observe plants and insects in parks near their schools.","why":"具体例と場所に偏り、天候の制約と代替活動が抜けている。"},{"t":"Schools have canceled all indoor science classes to save money.","why":"すべての室内授業の中止や節約は本文にない。"},{"t":"Outdoor lessons support science learning, but schools prepare indoor alternatives because bad weather can disrupt them.","why":"正解。理科学習への効果と、悪天候に備えた室内活動の両方をまとめている。"},{"t":"Rain can prevent schools from holding outdoor lessons.","why":"天候の制約だけで、学習効果や備えが抜けている。"},{"t":"Outdoor lessons always teach science better than any indoor activity.","why":"常に室内活動より優れているという比較と断定は本文にない。"}],"answer":3,"point":"具体例をまとめ、効果と実施上の制約を1文につなぐ。","drive":{"ja":"屋外授業の効果と天候への備えを英語1文で要約。","en":"Outdoor lessons support science learning, but schools prepare indoor alternatives because bad weather can disrupt them."}},{"id":"g2-summary-003","q":"Some companies allow employees to choose when they begin work. This helps workers manage family responsibilities and avoid crowded trains. However, teams may struggle to find a time when everyone is available. To solve this problem, these companies require all team members to work during a shared period each day.","q_ja":"一部の企業は始業時刻を選べるようにしている。家庭の用事への対応や混雑した電車の回避に役立つが、全員が集まれる時間を見つけにくいため、毎日共通の勤務時間帯を設けている。","choices":[{"t":"Some companies allow employees to choose when they begin work.","why":"冒頭の丸写しで、利点と調整方法が抜けている。"},{"t":"Workers can manage family duties and avoid crowded trains.","why":"具体的な利点の列挙にとどまり、チームの調整策が抜けている。"},{"t":"Companies pay employees extra for beginning work early.","why":"早く働き始める人への追加手当は本文にない。"},{"t":"Teams sometimes find it difficult to arrange a suitable meeting time.","why":"調整の難しさだけで、制度の利点と解決策が抜けている。"},{"t":"Flexible starting times completely remove every conflict between work and family.","why":"仕事と家庭の問題がすべて解消されるという断定は本文にない。"},{"t":"Flexible starting times benefit workers, while shared working hours help teams coordinate their schedules.","why":"正解。従業員への利点と共通時間帯によるチームの調整をまとめている。"}],"answer":5,"point":"柔軟な制度の利点と課題を解決する工夫をまとめる。","drive":{"ja":"始業時刻を選べる制度の利点と調整方法を英語1文で要約。","en":"Flexible starting times benefit workers, while shared working hours help teams coordinate their schedules."}},{"id":"g2-summary-004","q":"A local shopping street has introduced reusable cups for drinks. Customers return the cups to any participating shop, and the shops wash them for future use. This reduces disposable waste. However, the system depends on customers bringing cups back, so shops explain the return process clearly.","q_ja":"地域の商店街は飲み物用の再使用できるカップを導入した。参加店ならどこでも返却でき、店が洗って再使用するため使い捨てごみが減る。ただし返却が必要なので、店は返却方法を明確に説明している。","choices":[{"t":"A local shopping street has introduced reusable cups for drinks.","why":"冒頭の丸写しで、効果と返却の課題を含んでいない。"},{"t":"A reusable cup system reduces waste, but shops must explain returns to ensure customers bring the cups back.","why":"正解。ごみ削減の効果と返却を促す説明の必要性をまとめている。"},{"t":"Customers can return cups to any participating shop for washing.","why":"返却先と洗浄という具体的な手順だけで、効果と課題が抜けている。"},{"t":"Customers receive free drinks every time they return a cup.","why":"返却時の無料サービスは本文にない。"},{"t":"Reusable cups reduce the amount of disposable waste.","why":"利点だけで、返却を確保するための対応が抜けている。"},{"t":"The cup system eliminates all waste produced by the shopping street.","why":"商店街のごみがすべてなくなるという誇張である。"}],"answer":1,"point":"制度の仕組みは短くまとめ、効果と成功の条件を残す。","drive":{"ja":"再使用カップの効果と返却の必要性を英語1文で要約。","en":"A reusable cup system reduces waste, but shops must explain returns to ensure customers bring the cups back."}},{"id":"g2-summary-005","q":"A city offers online appointments with nurses to residents who live far from clinics. The service saves travel time and makes basic advice easier to obtain. However, nurses cannot perform physical examinations through a screen. They advise residents to visit a clinic when an illness needs a closer check.","q_ja":"ある市は診療所から遠い住民に看護師へのオンライン相談を提供している。移動時間を節約し基本的な助言を得やすくするが、画面越しには身体を診察できないため、詳しい確認が必要な場合は来院を勧めている。","choices":[{"t":"The service saves travel time and makes basic advice easier to obtain.","why":"本文の一文の丸写しで、画面越しの診察の限界が抜けている。"},{"t":"Residents far from clinics can talk to nurses on a screen.","why":"具体的な利用方法だけで、利点と対面診察の必要性が抜けている。"},{"t":"Online nurses send free medicine to every resident after each appointment.","why":"薬の無料配送は本文にない。"},{"t":"Nurses cannot perform physical examinations online.","why":"制約だけで、相談へのアクセス改善と必要時の来院が抜けている。"},{"t":"Online nursing advice improves access for distant residents, but conditions requiring physical examination still need clinic visits.","why":"正解。遠方の住民の相談のしやすさと、身体の診察には来院が必要な点をまとめている。"},{"t":"Online appointments make clinic visits unnecessary for all illnesses.","why":"来院を勧める場合があるという本文に反する。"}],"answer":4,"point":"便利さと限界を残し、必要な対面対応を省かない。","drive":{"ja":"オンライン健康相談の利点と限界を英語1文で要約。","en":"Online nursing advice improves access for distant residents, but conditions requiring physical examination still need clinic visits."}},{"id":"g2-summary-006","q":"A town has opened a shared garden on unused land. Residents grow vegetables together and meet neighbors they rarely spoke to before. This has strengthened local relationships. However, some members have different ideas about garden care, so the group has agreed on clear rules for sharing the work.","q_ja":"ある町は未利用の土地に共同菜園を開いた。住民は野菜を一緒に育て、以前は話す機会の少なかった近隣住民と交流している。地域のつながりは強まったが、手入れの考え方が異なるため、作業分担の明確なルールを決めた。","choices":[{"t":"A town has opened a shared garden on unused land.","why":"冒頭の丸写しで、地域への効果と運営上の対応が抜けている。"},{"t":"Residents grow vegetables and talk to neighbors on previously unused land.","why":"活動と場所の具体例にとどまり、手入れをめぐる問題と対応が抜けている。"},{"t":"A shared garden has improved neighborhood relationships, while agreed rules help residents manage differences over its care.","why":"正解。地域の関係改善と、手入れの意見の違いに対応するルールをまとめている。"},{"t":"The garden provides enough vegetables to feed the entire town.","why":"町全体に十分な食料を供給するとは本文にない。"},{"t":"Some garden members disagree about how to care for the garden.","why":"意見の違いだけで、交流の効果とルールによる対応が抜けている。"},{"t":"Working in the garden has ended all disagreements among local residents.","why":"意見の違いがあるという本文に反し、地域の争いもすべて消えたと誇張している。"}],"answer":2,"point":"活動の具体例より、地域への効果と運営上の対応を優先する。","drive":{"ja":"共同菜園の地域への効果と作業ルールを英語1文で要約。","en":"A shared garden has improved neighborhood relationships, while agreed rules help residents manage differences over its care."}},{"id":"g2-summary-007","q":"A college lends laptop computers to students who cannot buy their own. This allows more students to complete digital assignments at home. However, the number of laptops is limited. The college checks students' needs and lends the devices first to those who have no other way to access a computer.","q_ja":"ある大学は自分でパソコンを買えない学生にノートパソコンを貸している。自宅でデジタル課題に取り組める学生が増えるが、台数が限られるため、必要性を確認し、ほかにパソコンを使う手段のない学生を優先している。","choices":[{"t":"A college lends laptop computers to students who cannot buy their own.","why":"冒頭の丸写しで、台数の制約と優先順位の決め方が抜けている。"},{"t":"Students use borrowed laptop computers to complete digital assignments at home.","why":"利用場面だけで、台数の制約と必要性による配分が抜けている。"},{"t":"The college gives every student a new laptop to keep permanently.","why":"永久に全員へ新品を贈るとは本文にない。"},{"t":"The college does not have enough laptops to lend without setting priorities.","why":"台数と優先順位の話だけで、学習支援という目的が抜けている。"},{"t":"The loan program guarantees that every student will pass every course.","why":"単位取得の保証は本文にない。"},{"t":"A college improves access to digital homework by lending limited laptops according to students' needs.","why":"正解。デジタル課題への取り組みや ,{"t":"support for","why":"動詞 support の目的語の前に for は置かない。"},{"t":"support with","why":"support the view という組み合わせに with は入れない。"}],"answer":0,"point":"I support the view that ... で、支持する立場を述べる。","drive":{"ja":"私は、子どもはお金の管理方法を学ぶべきだという意見を支持します。","en":"I support the view that children should learn how to manage money."}}]}};
const BUILD = "20261108-2067a158";

const TYPE_INFO = {
  reason:      { name: '理由の選択',     hint: '立場を支える理由として正しい文を選ぶ' },
  summary:     { name: '要約の選択',     hint: '段落を1文にまとめた最もよい要約を選ぶ' },
  paraphrase:  { name: '言い換え',       hint: '同じ意味で表現を変えた文を選ぶ' },
  error:       { name: '誤りのない文',   hint: '三単現・時制・冠詞・スペル・語法に誤りのない文を選ぶ' },
  ja2en:       { name: '和文→英文',      hint: '日本語に合う自然な英文を選ぶ' },
  template:    { name: '型の穴埋め',     hint: '序論・結論の定型文の空所を埋める' },
  connector:   { name: 'つなぎ語',       hint: '文と文をつなぐ語を選ぶ' },
  collocation: { name: 'コロケーション', hint: '自然に組み合わさる語を選ぶ' },
};
const TYPES = Object.keys(TYPE_INFO);
const GRADES = { '2': '2級', 'p1': '準1級' };
const BOX_DAYS = [0, 1, 3, 7, 16, 35]; // 正解が続くほど次に出すまでの間隔を空ける（日）

// ---------- 記録 ----------
const KEY = 'eiken-drill-v1';
const store = (() => {
  let s;
  try { s = JSON.parse(localStorage.getItem(KEY)) || {}; } catch { s = {}; }
  s.grade ||= '2';
  s.rec ||= {};
  s.set ||= { pause: 6, rate: 0.95, repeat: 2 };
  s.daily ||= {};
  return s;
})();
function save() { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch {} }
function rec(id) { return store.rec[id] ||= { n: 0, ok: 0, box: 0, due: 0 }; }
function today() { const d = new Date(); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); }
function grade(id, correct) {
  const r = rec(id);
  r.n++; if (correct) r.ok++;
  r.box = correct ? Math.min(r.box + 1, BOX_DAYS.length - 1) : 0;
  r.due = Date.now() + (correct ? BOX_DAYS[r.box] * 864e5 : 10 * 60e3); // 間違えたら10分後から再出題
  r.last = correct ? 1 : 0;
  const t = today(); store.daily[t] = (store.daily[t] || 0) + 1;
  save();
}

// ---------- 出題 ----------
function itemsOf(g, type) { return ((DATA[g] || {})[type] || []).map((it) => ({ ...it, type })); }
function allItems(g, types = TYPES) { return types.flatMap((t) => itemsOf(g, t)); }
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function pick(pool, n) {
  const now = Date.now();
  const due = shuffle(pool.filter((it) => store.rec[it.id] && store.rec[it.id].due <= now))
    .sort((a, b) => rec(a.id).box - rec(b.id).box);
  const fresh = shuffle(pool.filter((it) => !store.rec[it.id]));
  const rest = shuffle(pool.filter((it) => store.rec[it.id] && store.rec[it.id].due > now));
  return [...due, ...fresh, ...rest].slice(0, n);
}
function wrongPool(g) { return allItems(g).filter((it) => store.rec[it.id] && store.rec[it.id].last === 0); }

// ---------- 画面 ----------
const app = document.getElementById('app');
const h = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let session = null;

function home() {

  app.innerHTML = `
    <h1>英検ライティング通勤ドリル</h1>
    <div class="seg">${Object.entries(GRADES).map(([k, v]) =>
      `<button data-g="${k}" class="${k === g ? 'on' : ''}">${v}</button>`).join('')}</div>
    <div class="card muted">今日 ${store.daily[today()] || 0} 問 ／ 解いた問題 ${seen} / ${pool.length} ／ 復習待ち ${dueN}</div>
    <button class="big" id="mix">おまかせ 10問</button>
    <div class="grid">
      <button class="big sub" id="wrong" ${wrong ? '' : 'disabled'}>間違えた問題 ${wrong}</button>
      <button class="big sub" id="drive">運転中モード</button>
    </div>
    <h2>種類を選んで解く</h2>
    <div class="grid">${TYPES.map((t) => {
      const its = itemsOf(g, t);
      const done = its.filter((it) => store.rec[it.id]);
      const ok = done.filter((it) => store.rec[it.id].last === 1).length;
      const pct = its.length ? Math.round((ok / its.length) * 100) : 0;
      return `<button class="tile" data-t="${t}" ${its.length ? '' : 'disabled'}>
        <b>${TYPE_INFO[t].name}</b><small>${its.length ? `${done.length}/${its.length} 問` : '準備中'}</small>
        <div class="bar"><i style="width:${pct}%"></i></div></button>`;
    }).join('')}</div>
    <h2>設定</h2>
    <div class="card">
      <div class="row"><span>運転中モード：答える時間</span>
        <select id="pause">${[3, 4, 6, 8, 10, 15].map((s) => `<option ${s == store.set.pause ? 'selected' : ''}>${s}</option>`).join('')}</select> 秒</div>
      <div class="row"><span>読み上げの速さ</span>
        <select id="rate">${[0.8, 0.9, 0.95, 1, 1.1].map((s) => `<option ${s == store.set.rate ? 'selected' : ''}>${s}</option>`).join('')}</select></div>
      <div class="row"><span>英文を読む回数</span>
        <select id="repeat">${[1, 2, 3].map((s) => `<option ${s == store.set.repeat ? 'selected' : ''}>${s}</option>`).join('')}</select></div>
    </div>
    <p class="muted">版 ${h(BUILD)}</p>`;
  app.querySelectorAll('[data-g]').forEach((b) => b.onclick = () => { store.grade = b.dataset.g; save(); home(); });
  app.querySelector('#mix').onclick = () => start(pick(pool, 10), 'おまかせ');
  app.querySelector('#wrong').onclick = () => start(shuffle(wrongPool(g)).slice(0, 10), '間違えた問題');
  app.querySelector('#drive').onclick = () => driveMenu();
  app.querySelectorAll('[data-t]').forEach((b) => b.onclick = () => start(pick(itemsOf(g, b.dataset.t), 10), TYPE_INFO[b.dataset.t].name));
  for (const k of ['pause', 'rate', 'repeat']) app.querySelector('#' + k).onchange = (e) => { store.set[k] = Number(e.target.value); save(); };
}

function start(items, title) {
  if (!items.length) return;
  session = { items, i: 0, ok: 0, title, wrong: [] };
  question();
  scrollTo(0, 0);
}

function question() {
  const s = session, it = s.items[s.i];
  const order = shuffle(it.choices.map((c, idx) => idx));
  const qHtml = h(it.q).replace(/___/g, '<b style="color:var(--accent)">＿＿＿</b>');
  app.innerHTML = `
    <div class="top"><button id="quit">‹ やめる</button><span class="grow">${h(s.title)}</span><span>${s.i + 1} / ${s.items.length}</span></div>
    <div class="card">
      <div class="label">${TYPE_INFO[it.type].name} — ${TYPE_INFO[it.type].hint}</div>
      <div class="q">${qHtml}</div>
      ${it.q_ja ? `<div class="qja" id="qja" style="display:none">${h(it.q_ja)}</div>` : ''}
    </div>
    <div id="choices">${order.map((idx) => `<button class="choice" data-i="${idx}">${h(it.choices[idx].t)}<div class="why">${h(it.choices[idx].why)}</div></button>`).join('')}</div>
    <div id="after"></div>`;
  app.querySelector('#quit').onclick = home;
  const box = app.querySelector('#choices');
  box.querySelectorAll('.choice').forEach((b) => b.onclick = () => {
    if (box.classList.contains('answered')) return;
    const pickI = Number(b.dataset.i), correct = pickI === it.answer;
    box.classList.add('answered');
    box.querySelector(`[data-i="${it.answer}"]`).classList.add('ok');
    if (!correct) b.classList.add('ng');
    const qja = app.querySelector('#qja'); if (qja) qja.style.display = 'block';
    grade(it.id, correct);
    if (correct) s.ok++; else s.wrong.push(it);
    const last = s.i === s.items.length - 1;
    app.querySelector('#after').innerHTML = `
      <div class="point"><b>${correct ? '正解' : '不正解'}</b>　${h(it.point)}</div>
      <div class="footer"><button class="big" id="next">${last ? '結果を見る' : '次へ'}</button></div>`;
    app.querySelector('#next').onclick = () => { if (last) result(); else { s.i++; question(); scrollTo(0, 0); } };
  });
}

function result() {
  const s = session;
  app.innerHTML = `
    <div class="top"><button id="back">‹ ホーム</button><span class="grow">${h(s.title)}</span><span></span></div>
    <div class="result">${s.ok} / ${s.items.length}</div>
    <p class="muted" style="text-align:center">間違えた問題は、10分後から優先して出ます</p>
    ${s.wrong.length ? `<button class="big" id="retry">間違えた ${s.wrong.length} 問をもう一度</button>` : ''}
    <button class="big sub" id="more">続けて 10問</button>`;
  app.querySelector('#back').onclick = home;
  const r = app.querySelector('#retry'); if (r) r.onclick = () => start(shuffle(s.wrong), 'やり直し');
  app.querySelector('#more').onclick = () => start(pick(allItems(store.grade), 10), 'おまかせ');
}

// ---------- 運転中モード ----------
let drive = null;
const hasTTS = 'speechSynthesis' in window;
const live = new Set(); // 読み上げ中のデータを持ち続ける（iPhone で途中で音が切れるのを防ぐ）
function pickVoice(lang) {
  const v = speechSynthesis.getVoices();
  return v.find((x) => x.lang.replace('_', '-') === lang && x.localService) ||
    v.find((x) => x.lang.replace('_', '-') === lang) || v.find((x) => x.lang.startsWith(lang.slice(0, 2))) || null;
}
function say(text, lang) {
  return new Promise((resolve) => {
    if (!hasTTS || !drive) return resolve(false);
    if (speechSynthesis.speaking || speechSynthesis.pending) speechSynthesis.cancel();
    if (speechSynthesis.paused) speechSynthesis.resume();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = lang; const v = pickVoice(lang); if (v) u.voice = v;
    u.rate = store.set.rate; u.volume = 1;
    live.add(u);
    let done = false;
    const finish = (ok) => { if (done) return; done = true; live.delete(u); clearTimeout(guard); resolve(ok); };
    u.onend = () => finish(true);
    u.onerror = () => finish(false);
    const guard = setTimeout(() => finish(false), text.length * 160 / store.set.rate + 5000); // 終了の合図が来ないときの打ち切り
    speechSynthesis.speak(u);
  });
}
const wait = (ms) => new Promise((r) => { drive && (drive.timer = setTimeout(r, ms)); if (!drive) r(); });

function driveMenu() {
  const g = store.grade;
  const sel = new Set(store.set.driveTypes || ['reason', 'ja2en', 'template', 'connector', 'collocation']);
  app.innerHTML = `
    <div class="top"><button id="back">‹ ホーム</button><span class="grow">運転中モード（${GRADES[g]}）</span><span></span></div>
    <div class="card">
      <p style="margin-top:0"><b>走り出す前に「スタート」を押してください。</b>あとは画面に触れずに続きます。</p>
      <p class="muted">日本語の問い → ${store.set.pause}秒の間（口に出して答える）→ 英語の模範文 ×${store.set.repeat}。<br>
      画面は点けたままになります。ロックすると止まることがあります。止めるのは停車してから。</p>
    </div>
    <h2>出す種類</h2>
    <div class="card">${TYPES.map((t) => `<label class="row"><span>${TYPE_INFO[t].name}（${itemsOf(g, t).length}）</span>
      <input type="checkbox" data-t="${t}" ${sel.has(t) ? 'checked' : ''}></label>`).join('')}</div>
    <div class="footer"><button class="big" id="go">スタート</button></div>`;
  app.querySelector('#back').onclick = home;
  app.querySelector('#go').onclick = () => {
    const types = [...app.querySelectorAll('[data-t]')].filter((c) => c.checked).map((c) => c.dataset.t);
    store.set.driveTypes = types; save();
    const items = pick(allItems(g, types), 9999);
    if (items.length) runDrive(items);
  };
}

async function runDrive(items) {
  drive = { items, i: 0, timer: null, lock: null };
  app.innerHTML = `<div class="drive"><div class="phase" id="ph"></div><div class="text" id="tx"></div>
    <div class="count" id="ct"></div><button class="stop" id="stop">停止</button></div>`;
  document.getElementById('stop').onclick = home;
  await keepAwake();
  const ph = document.getElementById('ph'), tx = document.getElementById('tx'), ct = document.getElementById('ct');
  while (drive && drive.i < drive.items.length) {
    const it = drive.items[drive.i];
    ct.textContent = `${drive.i + 1} 問目 ／ ${TYPE_INFO[it.type].name}`;
    ph.textContent = '問い'; tx.textContent = it.drive.ja;
    await say(it.drive.ja, 'ja-JP'); if (!drive) break;
    ph.textContent = '答えてください'; await wait(store.set.pause * 1000); if (!drive) break;
    ph.textContent = '模範文'; tx.textContent = it.drive.en;
    for (let k = 0; k < store.set.repeat && drive; k++) { await say(it.drive.en, 'en-US'); await wait(900); }
    if (!drive) break;
    drive.i++;
    await wait(800);
  }
  if (drive) { await say('おつかれさまでした。', 'ja-JP'); home(); }
}
async function keepAwake() {
  try { if ('wakeLock' in navigator && drive) drive.lock = await navigator.wakeLock.request('screen'); } catch {}
}
document.addEventListener('visibilitychange', () => { if (drive && document.visibilityState === 'visible') keepAwake(); });
function stopDrive() {
  if (!drive) return;
  clearTimeout(drive.timer);
  try { drive.lock && drive.lock.release(); } catch {}
  drive = null;
  if (hasTTS) speechSynthesis.cancel();
}

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
home();
</script>
