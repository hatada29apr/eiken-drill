y":"正解。draw a distinction betweenで「〜の間に区別を設ける」となり、一時的な変化と長期的な変化を分けて捉える。"},{"t":"sketch","why":"sketchは絵や概略を描く動詞で、明確に区別するという定型表現ではdrawを使う。"},{"t":"trace","why":"traceは経緯や起源などをたどる動詞で、ここで求める二つの現象の区別を表さない。"}],"answer":1,"point":"draw a distinction between A and Bで「ＡとＢを区別する」。distinctionは違いを明確にする際に使う。","level":2,"drive":{"ja":"雇用政策を評価する際、分析担当者は、一時的な雇用の喪失と労働市場の長期的な変化を明確に区別しなければならない。","en":"When evaluating employment policies, analysts must draw a clear distinction between temporary job losses and lasting changes in the labor market."},"explain":"When節は評価の場面、主節は分析者の義務を示す。draw a distinctionは二者を分けて捉える表現で、論述で短期と長期の影響を整理できる。別の言い方: distinguish between A and B。"},{"id":"p1-collocation-206","q":"Regulators must ___ a careful balance between protecting personal data and allowing researchers to use health records for studies of rare diseases.","q_ja":"規制当局は、個人データの保護と、希少疾患の研究のために研究者が診療記録を利用できるようにすることの間で、慎重に均衡を図らなければならない。","choices":[{"t":"weigh","why":"weighは利点や不利益を比較検討する意味では使えるが、weigh a balance betweenで均衡を図るとは言わない。"},{"t":"settle","why":"settle a balanceは未払い残高を精算する意味になり、二つの政策目的の均衡を図ることを表さない。"},{"t":"reconcile","why":"reconcileは対立する二つの事柄を両立させる動詞だが、ここではa balanceを目的語にする組み合わせが合わない。"},{"t":"strike","why":"正解。strike a balance betweenで「〜の間で均衡を図る」となり、データ保護と研究利用の調整を表す。"}],"answer":3,"point":"strike a balance between A and Bで「ＡとＢの間で均衡を図る」。対立する政策目的の調整に使える。","level":2,"drive":{"ja":"規制当局は、個人データの保護と、希少疾患の研究のために研究者が診療記録を利用できるようにすることの間で、慎重に均衡を図らなければならない。","en":"Regulators must strike a careful balance between protecting personal data and allowing researchers to use health records for studies of rare diseases."},"explain":"主語はRegulators、mustが義務を示し、betweenの後に動名詞句が二つ並ぶ。strike a balanceは双方への配慮を表し、論述で保護と研究利用の両立を主張できる。別の言い方: balance A and B。"},{"id":"p1-collocation-207","q":"Residents dissatisfied with a public service may ___ a formal complaint with an independent body, which will investigate how their case was handled.","q_ja":"公共サービスに不満のある住民は、独立機関に正式な苦情を申し立てることができ、その機関は当該案件への対応を調査する。","choices":[{"t":"lodge","why":"正解。lodge a complaint withで「〜に苦情を申し立てる」となり、正式な審査を求める行為を表す。"},{"t":"appeal","why":"appealは決定に対して不服を申し立てる際に使うが、appeal a complaintという組み合わせにはしない。"},{"t":"notify","why":"notifyは通知を受ける人や機関を目的語に取り、notify a complaint withという形にはならない。"},{"t":"protest","why":"protestは対象に抗議する動詞で、protest a complaintでは苦情そのものへの抗議になり、苦情の提出を表さない。"}],"answer":0,"point":"lodge a complaint with＋機関で「機関に苦情を申し立てる」。正式な申立てを表す組み合わせ。","level":2,"drive":{"ja":"公共サービスに不満のある住民は、独立機関に正式な苦情を申し立てることができ、その機関は当該案件への対応を調査する。","en":"Residents dissatisfied with a public service may lodge a formal complaint with an independent body, which will investigate how their case was handled."},"explain":"主語はResidents、動詞はlodgeで、which節は機関の調査を補足する。lodge a complaintは正式な申立てを表し、論述で行政への異議申立ての手段を説明できる。別の言い方: file a complaint。"},{"id":"p1-collocation-208","q":"Businesses that fail to disclose overseas earnings may ___ a financial penalty, even when the omission results from negligence rather than deliberate fraud.","q_ja":"海外収益を開示しない企業は、その不記載が意図的な不正ではなく過失による場合でも、金銭的な罰則を受けることがある。","choices":[{"t":"levy","why":"levy a penaltyは罰金を課す側の行為を表し、この文の企業は罰則を受ける側なので合わない。"},{"t":"exact","why":"exact a penaltyは罰を取り立てる側の行為を表し、違反した企業が罰則を受けるという関係に合わない。"},{"t":"incur","why":"正解。incur a penaltyで「罰則を受ける」となり、開示を怠った企業が不利益を負うことを表す。"},{"t":"impose","why":"impose a penaltyは罰則を課す側の行為を表し、この文で罰則を受ける企業を主語にはできない。"}],"answer":2,"point":"incur a penaltyで「罰則を受ける」。罰を課す側か受ける側かを主語から判断する。","level":3,"drive":{"ja":"海外収益を開示しない企業は、その不記載が意図的な不正ではなく過失による場合でも、金銭的な罰則を受けることがある。","en":"Businesses that fail to disclose overseas earnings may incur a financial penalty, even when the omission results from negligence rather than deliberate fraud."},"explain":"主語はBusinessesで、that節が対象を限定し、even when節が譲歩を示す。incur a penaltyは違反側が負う不利益を表し、論述で規制の効果を説明できる。別の言い方: be penalized。"},{"id":"p1-collocation-209","q":"When reviewing applications for emergency housing, officials must ___ discretion in assessing evidence from families unable to obtain the documents normally required for approval.","q_ja":"緊急住宅の申請を審査する際、担当者は、通常は承認に必要な書類を入手できない家族からの証拠を評価するにあたり、裁量を働かせなければならない。","choices":[{"t":"execute","why":"executeは計画や命令を実行する動詞で、裁量を働かせる場合にdiscretionとは組み合わせない。"},{"t":"exercise","why":"正解。exercise discretionで「裁量を働かせる」となり、個別の事情に応じた判断を表す。"},{"t":"enact","why":"enactは法律などを制定する動詞で、既存の制度の下で裁量を働かせることを表さない。"},{"t":"discharge","why":"dischargeは義務や職務を果たす場合に使うが、discretionを目的語にして裁量を働かせるとは言わない。"}],"answer":1,"point":"exercise discretionで「裁量を働かせる」。exerciseは権限や判断力を行使する意味でも使う。","level":3,"drive":{"ja":"緊急住宅の申請を審査する際、担当者は、通常は承認に必要な書類を入手できない家族からの証拠を評価するにあたり、裁量を働かせなければならない。","en":"When reviewing applications for emergency housing, officials must exercise discretion in assessing evidence from families unable to obtain the documents normally required for approval."},"explain":"When節は審査の場面、主語はofficialsで、in以下が裁量を使う場面を示す。exercise discretionは事情に応じた判断を表し、論述で柔軟な審査を求められる。別の言い方: use their judgment。"},{"id":"p1-collocation-210","q":"Even after outsourcing data storage, public agencies must ___ their legal obligations to protect personal information, since responsibility remains with the original data holder.","q_ja":"データ保存を外部委託した後も、責任は元のデータ保有者に残るため、公的機関は個人情報を保護する法的義務を果たさなければならない。","choices":[{"t":"delegate","why":"delegateは義務などを他者に委ねる意味で、責任が元の保有者に残るため自ら義務を果たすという文意に合わない。"},{"t":"relinquish","why":"relinquishは手放すという意味で、責任が引き続き残ることを理由に義務を果たすという内容と逆になる。"},{"t":"waive","why":"waiveは権利を放棄したり要件を免除したりする動詞で、引き続き負う法的義務を履行することにはならない。"},{"t":"discharge","why":"正解。discharge obligationsで「義務を果たす」となり、外部委託後も残る保護責任を履行することを表す。"}],"answer":3,"point":"discharge one's obligationsで「義務を果たす」。dischargeには責任や職務を履行する意味がある。","level":3,"drive":{"ja":"データ保存を外部委託した後も、責任は元のデータ保有者に残るため、公的機関は個人情報を保護する法的義務を果たさなければならない。","en":"Even after outsourcing data storage, public agencies must discharge their legal obligations to protect personal information, since responsibility remains with the original data holder."},"explain":"主語は公的機関、mustが義務、since節が理由を示す。discharge obligationsは義務の履行を表し、論述で外部委託後の責任を主張できる。別の言い方: fulfill their obligations。"},{"id":"p1-collocation-211","q":"Public transport must expand to ___ growing demand in rapidly developing urban areas.","q_ja":"急速に発展する都市部で増え続ける需要に応えるため、公共交通は拡充されなければならない。","choices":[{"t":"respond","why":"需要に応じるという意味では、respond の後に to が必要。"},{"t":"meet","why":"正解。meet demand で「需要に応える」という自然な組み合わせになる。"},{"t":"cope","why":"需要に対応するという意味では、cope の後に with が必要。"},{"t":"reply","why":"reply は返答するという意味で、需要を満たすことを表さない。"}],"answer":1,"point":"meet demand は「需要に応える」。meet は目的語を直接取る。","level":1,"drive":{"ja":"急速に発展する都市部で増え続ける需要に応えるため、公共交通は拡充されなければならない。","en":"Public transport must expand to meet growing demand in rapidly developing urban areas."},"explain":"公共交通が主語、must expandが述語で、to以下は拡充の目的を示す。meet demandは需要の充足を表し、論述で施策の必要性を説明できる。別の言い方: satisfy demand。"},{"id":"p1-collocation-212","q":"Technology companies must ___ responsibility for protecting the personal data they collect from users.","q_ja":"テクノロジー企業は、利用者から収集した個人データを保護する責任を負わなければならない。","choices":[{"t":"observe","why":"observe は規則などを守る際に使うが、responsibility と組み合わせて責任を負うとは言わない。"},{"t":"express","why":"express は意見や感情を表す語で、責任を負うという意味にはならない。"},{"t":"perform","why":"perform は職務などを遂行する際に使うが、責任を負うという意味では bear responsibility を使う。"},{"t":"bear","why":"正解。bear responsibility for で「〜に対する責任を負う」となる。"}],"answer":3,"point":"bear responsibility for は「〜に対する責任を負う」。bear には抽象的な負担を担う意味がある。","level":1,"drive":{"ja":"テクノロジー企業は、利用者から収集した個人データを保護する責任を負わなければならない。","en":"Technology companies must bear responsibility for protecting the personal data they collect from users."},"explain":"企業が主語、must bearが述語で、they collect以下はデータを修飾する。bear responsibility for＋動名詞で責任の対象を示し、論述で企業の義務を示せる。別の言い方: be responsible for。"},{"id":"p1-collocation-213","q":"Removing subscription fees would help researchers ___ access to publicly funded scientific studies.","q_ja":"購読料を撤廃すれば、研究者が公的資金による科学研究を利用できるようになる。","choices":[{"t":"gain","why":"正解。gain access to で「〜を利用できるようになる」という意味になる。"},{"t":"accomplish","why":"accomplish は仕事や目標を達成する語で、access を得るという組み合わせには使わない。"},{"t":"derive","why":"derive は利益などを何かから得る際に使い、ここでの gain access to の代わりにはならない。"},{"t":"approach","why":"approach は対象に近づくことを表し、access を得るという意味にはならない。"}],"answer":0,"point":"gain access to は「〜にアクセスできるようになる・〜を利用する機会を得る」。","level":1,"drive":{"ja":"購読料を撤廃すれば、研究者が公的資金による科学研究を利用できるようになる。","en":"Removing subscription fees would help researchers gain access to publicly funded scientific studies."},"explain":"料金の撤廃が主語で、wouldは想定される効果を示す。help＋人＋動詞の原形にgain access toを続け、論述で制度変更による利用機会の拡大を述べられる。別の言い方: obtain access to。"},{"id":"p1-collocation-215","q":"Transparent investigations may help ___ public confidence in regulatory agencies accused of concealing evidence of industrial pollution.","q_ja":"透明性のある調査は、産業汚染の証拠を隠したとされる規制機関への国民の信頼を回復するのに役立つ可能性がある。","choices":[{"t":"retrieve","why":"retrieve は保管物や情報などを取り戻す語で、失われた信頼の回復には restore を使う。"},{"t":"restore","why":"正解。restore public confidence で「国民の信頼を回復する」となる。"},{"t":"resume","why":"resume は中断した活動を再開する語で、信頼を回復することは表せない。"},{"t":"reinstate","why":"reinstate は人を復職させたり制度を復活させたりする語で、confidence とは自然に組み合わない。"}],"answer":1,"point":"restore confidence in は「〜への信頼を回復する」。回復する対象に合う動詞を選ぶ。","level":2,"drive":{"ja":"透明性のある調査は、産業汚染の証拠を隠したとされる規制機関への国民の信頼を回復するのに役立つ可能性がある。","en":"Transparent investigations may help restore public confidence in regulatory agencies accused of concealing evidence of industrial pollution."},"explain":"調査が主語、may helpが述語で、accused以下は規制機関を修飾する。restore confidence inで信頼回復の対象を示し、論述で調査の効果を控えめに述べられる。別の言い方: rebuild trust in。"},{"id":"p1-collocation-216","q":"The court's ruling could ___ a precedent for future cases involving the use of personal data by private companies.","q_ja":"その裁判所の判決は、民間企業による個人データの利用をめぐる今後の訴訟の先例となる可能性がある。","choices":[{"t":"settle","why":"settle a case なら訴訟を解決することだが、先例を作る意味で settle a precedent とは言わない。"},{"t":"assign","why":"assign は役割などを割り当てる語で、先例を作るという意味にはならない。"},{"t":"arrange","why":"arrange は手配や配置を表し、判決が先例となることは表さない。"},{"t":"set","why":"正解。set a precedent で「先例を作る」という自然な組み合わせになる。"}],"answer":3,"point":"set a precedent は「先例を作る」。precedent は後の判断のよりどころとなる事例を指す。","level":2,"drive":{"ja":"その裁判所の判決は、民間企業による個人データの利用をめぐる今後の訴訟の先例となる可能性がある。","en":"The court's ruling could set a precedent for future cases involving the use of personal data by private companies."},"explain":"判決が主語、could setが述語で、involving以下は訴訟を修飾する。set a precedentは後の判断に影響する先例を表し、論述で判決の波及効果を示せる。別の言い方: establish a precedent。"},{"id":"p1-collocation-217","q":"Small municipalities could ___ their financial resources to establish a shared emergency service that none could afford independently.","q_ja":"小規模な自治体は、それぞれ単独では費用を賄えない共同の救急サービスを設けるため、財源を出し合うことができる。","choices":[{"t":"pool","why":"正解。pool resources で「資源や資金を出し合う」という意味になる。"},{"t":"pile","why":"pile は物を積み重ねることを表し、複数の自治体が資金を共同で出す意味にはならない。"},{"t":"heap","why":"heap は山のように積み上げる語で、共同事業のために財源を出し合うことは表さない。"},{"t":"stack","why":"stack は物を重ねて置く語で、財源を持ち寄って共同利用することは表さない。"}],"answer":0,"point":"pool resources は「資源・資金を出し合う」。pool は共同利用のために集めるという動詞。","level":2,"drive":{"ja":"小規模な自治体は、それぞれ単独では費用を賄えない共同の救急サービスを設けるため、財源を出し合うことができる。","en":"Small municipalities could pool their financial resources to establish a shared emergency service that none could afford independently."},"explain":"自治体が主語、could poolが述語で、to以下は目的、that節はサービスを修飾する。pool resourcesは資源の共同利用を表し、論述で単独では難しい事業の解決策を示せる。別の言い方: combine resources。"},{"id":"p1-collocation-218","q":"For the report's conclusions to be credible, they must ___ close scrutiny by independent researchers with access to the original data.","q_ja":"報告書の結論が信頼に値するには、元のデータを利用できる独立した研究者による厳密な精査に耐えなければならない。","choices":[{"t":"resist","why":"resist scrutiny は精査を拒んだり妨げたりする方向の意味になり、精査に耐えて信頼性を示すという文脈に合わない。"},{"t":"deflect","why":"deflect scrutiny は精査の目をそらすことであり、検証を受けて結論の信頼性を示すことではない。"},{"t":"withstand","why":"正解。withstand scrutiny は「精査に耐える」で、詳しく調べられても結論が妥当だと認められることを表す。"},{"t":"evade","why":"evade scrutiny は精査を逃れることで、信頼できる結論に求められる条件と逆になる。"}],"answer":2,"point":"withstand scrutiny は「精査に耐える」。検証を避ける意味の語と区別する。","level":3,"drive":{"ja":"報告書の結論が信頼に値するには、元のデータを利用できる独立した研究者による厳密な精査に耐えなければならない。","en":"For the report's conclusions to be credible, they must withstand close scrutiny by independent researchers with access to the original data."},"explain":"For＋名詞＋to不定詞で信頼されるための条件を示し、主節のtheyは結論を指す。withstand scrutinyは検証後も妥当であることを表し、論述で根拠の強さを述べられる。別の言い方: stand up to scrutiny。"},{"id":"p1-collocation-219","q":"The revised funding formula is designed to ___ the imbalance between wealthy districts and communities whose schools depend almost entirely on public support.","q_ja":"改定された資金配分の算定方式は、裕福な地区と、学校がほぼ全面的に公的支援に依存する地域との間の不均衡を是正することを目的としている。","choices":[{"t":"reimburse","why":"reimburse は人や組織に経費を払い戻す語で、不均衡そのものを是正する意味には使えない。"},{"t":"redress","why":"正解。redress the imbalance で「不均衡を是正する」となり、資金配分の偏りを改める文脈に合う。"},{"t":"compensate","why":"compensate は人に補償する際に使い、不均衡を埋め合わせるなら compensate for the imbalance のように for が必要。"},{"t":"repay","why":"repay は借金を返すことや恩に報いることを表し、不均衡を是正することは表さない。"}],"answer":1,"point":"redress an imbalance は「不均衡を是正する」。金銭を返すことではなく、偏りを改めることを表す。","level":3,"drive":{"ja":"改定された資金配分の算定方式は、裕福な地区と、学校がほぼ全面的に公的支援に依存する地域との間の不均衡を是正することを目的としている。","en":"The revised funding formula is designed to redress the imbalance between wealthy districts and communities whose schools depend almost entirely on public support."},"explain":"配分方式が主語で、whose節は地域の学校の財源を説明する。be designed to＋動詞で制度の目的を示し、redressで格差是正を述べ、要約で政策の狙いを示せる。別の言い方: correct the imbalance。"},{"id":"p1-collocation-220","q":"A policy is unlikely to ___ widespread support unless officials explain how its costs will be shared fairly among households with different incomes.","q_ja":"所得の異なる世帯間で費用を公平に分担する方法を当局が説明しなければ、政策が幅広い支持を得る見込みは薄い。","choices":[{"t":"instruct","why":"instruct は人に指示する語で、支持を集めるという意味で support を目的語には取れない。"},{"t":"direct","why":"direct support は支援の向け先を定める際には使えるが、政策が支持を得るというこの文の意味には合わない。"},{"t":"order","why":"order は命令や発注を表し、政策が国民の支持を得ることは表さない。"},{"t":"command","why":"正解。command support は「支持を集める・得る」で、公平性の説明が支持につながるという文脈に合う。"}],"answer":3,"point":"command support は「支持を集める」。command は尊敬や支持を得るという意味でも使う。","level":3,"drive":{"ja":"所得の異なる世帯間で費用を公平に分担する方法を当局が説明しなければ、政策が幅広い支持を得る見込みは薄い。","en":"A policy is unlikely to command widespread support unless officials explain how its costs will be shared fairly among households with different incomes."},"explain":"政策が主語で、unless節は必要条件、how節は説明の内容を示す。command supportをis unlikely toに続け、論述で支持獲得の難しさを示せる。別の言い方: win widespread support。"},{"id":"p1-collocation-101","q":"Public campaigns help ___ awareness of the need to protect personal data online.","q_ja":"啓発活動は、オンラインで個人情報を守る必要性への意識を高めるのに役立つ。","choices":[{"t":"reduce","why":"reduce は「減らす」。個人情報を守るための啓発活動が意識を低下させるという意味になり、文脈に合わない。"},{"t":"raise","why":"正解。raise awareness of で「〜への意識を高める」という自然な組み合わせになる。"},{"t":"solve","why":"solve は問題などを「解決する」ときに使い、awareness（意識）とは組み合わせない。"},{"t":"protect","why":"protect は情報や権利などを「守る」ときに使い、意識を高める意味では awareness と組み合わせない。"}],"answer":1,"point":"raise awareness of で「〜への意識を高める」。啓発活動の目的を述べるときに使える。","level":1,"drive":{"ja":"啓発活動は、オンラインで個人情報を守る必要性への意識を高めるのに役立つ。","en":"Public campaigns help raise awareness of the need to protect personal data online."},"explain":"主語は啓発活動で、help＋動詞の原形が効果を示し、to以下は必要性の内容を説明する。raise awarenessで、情報保護への理解を促す対策を述べる。別の言い方: increase awareness"},{"id":"p1-collocation-102","q":"The spread of false information can ___ a threat to public health during emergencies.","q_ja":"誤った情報の拡散は、緊急時に公衆衛生への脅威となることがある。","choices":[{"t":"solve","why":"solve は問題を「解決する」ときに使い、a threat とは組み合わせない。"},{"t":"gain","why":"gain は利益や支持などを「得る」ときに使い、脅威をもたらす意味では使わない。"},{"t":"draw","why":"draw は注意や関心などを「引く」ときに使い、a threat を目的語にして脅威となる意味では使わない。"},{"t":"pose","why":"正解。pose a threat to で「〜への脅威となる」という自然な組み合わせになる。"}],"answer":3,"point":"pose a threat to で「〜への脅威となる」。社会的な危険や悪影響を説明するときに使える。","level":1,"drive":{"ja":"誤った情報の拡散は、緊急時に公衆衛生への脅威となることがある。","en":"The spread of false information can pose a threat to public health during emergencies."},"explain":"主語は誤情報の拡散で、canは起こり得る危険、during以下は時期を示す。pose a threatで、情報が社会に及ぼす害を論じる。別の言い方: threaten public health"}],"connector":[{"id":"p1-connector-001","q":"The independent review found that the proposed surveillance system would seriously threaten citizens' privacy. ___, the government approved its installation without introducing any additional safeguards against potential abuse.","q_ja":"独立した審査は、提案された監視システムが市民のプライバシーを深刻に脅かすと判断した。それにもかかわらず、政府は悪用を防ぐ追加措置を一切導入せずに設置を承認した。","choices":[{"t":"Nevertheless","why":"正解。プライバシーへの深刻な脅威が判明したのに承認したという、予想に反する展開を示す。"},{"t":"Consequently","why":"「その結果」では、脅威の指摘が保護措置なしの承認につながるという不自然な因果関係になる。"},{"t":"For instance","why":"後文は監視がプライバシーを脅かす具体例ではなく、政府の決定を述べている。"},{"t":"Similarly","why":"「同様に」は共通する傾向を示すが、後文は審査結果に反する対応を述べている。"}],"answer":0,"point":"Nevertheless は、前文から予想される展開に反する事実を「それにもかかわらず」と導く。","drive":{"ja":"監視によるプライバシーへの脅威が判明した。それにもかかわらず政府は承認した。この逆接を英語で表しましょう。","en":"The independent review found that the proposed surveillance system would seriously threaten citizens' privacy. Nevertheless, the government approved its installation without introducing any additional safeguards against potential abuse."},"level":2,"explain":"審査がfoundで脅威を報告し、Neverthelessで政府の承認へ転じる。without＋動名詞は措置の欠如を示し、論述で対応の問題を指摘できる。別の言い方: Even so, the government approved it."},{"id":"p1-connector-002","q":"Repeated droughts have reduced agricultural production across the region, leaving many farmers unable to repay their loans. ___, the government has introduced emergency financial assistance to prevent widespread bankruptcies in rural communities.","q_ja":"度重なる干ばつで地域全体の農業生産が減り、多くの農家が融資を返済できなくなった。その結果、政府は農村地域での相次ぐ破産を防ぐため、緊急の資金援助を導入した。","choices":[{"t":"Conversely","why":"「逆に」は反対の関係を示すが、後文は農家の窮状を受けた対応である。"},{"t":"For example","why":"政府の資金援助は、生産減少や返済困難そのものの具体例ではない。"},{"t":"Consequently","why":"正解。干ばつによる経済的な困難を原因として、政府が支援を導入した結果を示す。"},{"t":"Nevertheless","why":"農家の窮状に対する緊急援助は自然な対応であり、予想に反する展開ではない。"}],"answer":2,"point":"Consequently は、前文の状況が原因となって生じた結果や対応を導く。","drive":{"ja":"干ばつで農家が返済困難になった。その結果、政府は緊急援助を導入した。この因果関係を英語で表しましょう。","en":"Repeated droughts have reduced agricultural production across the region, leaving many farmers unable to repay their loans. Consequently, the government has introduced emergency financial assistance to prevent widespread bankruptcies in rural communities."},"level":2,"explain":"干ばつがhave reducedの主語で、Consequentlyが政府の対応を導く。leaving＋目的語＋形容詞は結果を補い、要約で因果を示せる。別の言い方: Thus, the government offered aid."},{"id":"p1-connector-003","q":"When demand for rental housing rises while supply remains unchanged, rents generally increase throughout the affected area. ___, when demand falls while supply remains unchanged, landlords often lower rents to attract potential tenants.","q_ja":"賃貸住宅の供給が変わらないまま需要が増えると、通常、その地域全体で家賃が上がる。逆に、供給が変わらないまま需要が減ると、家主は入居希望者を引きつけるために家賃を下げることが多い。","choices":[{"t":"Consequently","why":"需要減少時の値下げは、需要増加時の値上げが引き起こす結果ではない。"},{"t":"Conversely","why":"正解。需要の増加と減少という逆の条件で、家賃も逆方向に動く関係を示す。"},{"t":"For instance","why":"需要減少時の値下げは、需要増加時の値上げの具体例ではない。"},{"t":"In other words","why":"後文は前文の言い換えではなく、逆の条件で起こることを述べている。"}],"answer":1,"point":"Conversely は、条件や関係を逆にした場合に成り立つ対照的な内容を導く。","drive":{"ja":"需要が増えると家賃は上がる。逆に、需要が減ると家賃は下がる。この逆の関係を英語で表しましょう。","en":"When demand for rental housing rises while supply remains unchanged, rents generally increase throughout the affected area. Conversely, when demand falls while supply remains unchanged, landlords often lower rents to attract potential tenants."},"level":2,"explain":"When節は需要に関する条件を示し、while supply remains unchangedは両方の場合に供給一定という前提を加える。Converselyは需要増による家賃上昇と需要減による家賃引下げを対比する。別の言い方: With the supply of rental housing unchanged, rents generally rise throughout the affected area when demand rises, whereas landlords often lower rents to attract potential tenants when demand falls."},{"id":"p1-connector-004","q":"Investing in public libraries gives residents free access to reliable information, regardless of their financial circumstances. ___, these institutions provide meeting spaces that encourage cooperation among local organizations working on social issues.","q_ja":"公共図書館への投資により、住民は経済状況にかかわらず信頼できる情報を無料で利用できる。さらに、図書館は社会問題に取り組む地域団体の協力を促す会合の場も提供する。","choices":[{"t":"Nevertheless","why":"会合の場の提供は、情報を無料で利用できることと対立する内容ではない。"},{"t":"In other words","why":"情報へのアクセスと団体間の協力は異なる利点であり、同じ内容の言い換えではない。"},{"t":"Conversely","why":"会合の場の提供は、情報へのアクセスという関係を逆にしたものではない。"},{"t":"Furthermore","why":"正解。情報へのアクセスに加えて、地域団体の協力という別の利点を追加している。"}],"answer":3,"point":"Furthermore は、同じ主張を支える別の理由や利点を「さらに」と追加する。","drive":{"ja":"公共図書館は情報を無料で提供する。さらに、地域団体の協力も促す。この利点の追加を英語で表しましょう。","en":"Investing in public libraries gives residents free access to reliable information, regardless of their financial circumstances. Furthermore, these institutions provide meeting spaces that encourage cooperation among local organizations working on social issues."},"level":1,"explain":"動名詞句がgivesの主語で、Furthermoreが図書館の別の機能を加える。that節は場所の働きを説明し、論述で利点を具体化できる。別の言い方: Libraries also help local groups cooperate."},{"id":"p1-connector-005","q":"The first proposal would finance the entire transport project through higher taxes on local businesses. ___, the second proposal would rely exclusively on payments from passengers using the new service.","q_ja":"第1案は、地元企業への増税で交通事業の費用全額を賄うというものだ。対照的に、第2案は新サービスを利用する乗客からの支払いのみに頼るというものだ。","choices":[{"t":"For example","why":"乗客の支払いによる財源確保は、企業への増税の具体例ではない。"},{"t":"Consequently","why":"第2案の財源は、第1案の増税が引き起こす結果として述べられていない。"},{"t":"In contrast","why":"正解。企業への課税と利用者からの徴収という、二つの案の財源の違いを示す。"},{"t":"Similarly","why":"二つの案は負担する主体が異なり、同じ方式を採るという説明にはならない。"}],"answer":2,"point":"In contrast は、比較する二つの対象の明確な違いを示す。","drive":{"ja":"第1案の財源は企業への課税だ。対照的に、第2案は乗客の支払いに頼る。この比較を英語で表しましょう。","en":"The first proposal would finance the entire transport project through higher taxes on local businesses. In contrast, the second proposal would rely exclusively on payments from passengers using the new service."},"level":1,"explain":"二つのproposalを各文の主語とし、wouldで各案を実施した場合の財源を説明する。In contrastは地元企業への増税と乗客の支払いを対比し、exclusivelyは第二案の財源を乗客の支払いだけに限定する。別の言い方: The first proposal would fund the entire transport project through higher taxes on local businesses, whereas the second would rely solely on payments from passengers using the new service."},{"id":"p1-connector-006","q":"The government should retain the national research program because its discoveries could improve future energy security. ___, its immediate costs are substantial, and taxpayers have legitimate concerns about the allocation of public funds. These concerns deserve careful scrutiny, but they do not outweigh the potential benefits of sustained scientific investment.","q_ja":"研究成果が将来のエネルギー安全保障を改善する可能性があるため、政府は国の研究計画を維持すべきだ。確かに当面の費用は多額で、納税者が公的資金の配分を懸念するのももっともだ。こうした懸念は慎重に検討すべきだが、継続的な科学への投資がもたらす潜在的な利益を上回るものではない。","choices":[{"t":"Admittedly","why":"正解。研究計画を支持する立場を保ちながら、反対側にも費用面で妥当な指摘があると認める。"},{"t":"Consequently","why":"将来の安全保障を改善し得ることが、多額の当面の費用を生む原因だとは述べられていない。"},{"t":"For instance","why":"多額の費用は、エネルギー安全保障を改善する研究成果の具体例ではない。"},{"t":"Similarly","why":"費用への懸念は、研究計画を維持すべき理由と同じ方向の内容ではない。"}],"answer":0,"point":"Admittedly は、自分の主張に不利でも認めるべき点を「確かに」と示す。","drive":{"ja":"研究計画は維持すべきだ。確かに費用への懸念はもっともだが、利益の方が大きい。この譲歩を英語で表しましょう。","en":"The government should retain the national research program because its discoveries could improve future energy security. Admittedly, its immediate costs are substantial, and taxpayers have legitimate concerns about the allocation of public funds. These concerns deserve careful scrutiny, but they do not outweigh the potential benefits of sustained scientific investment."},"level":3,"explain":"政府を主語に研究計画の維持を提言し、Admittedlyで当面の費用の大きさと納税者の正当な懸念を認める。but以下のtheyはThese concernsを指し、その懸念が継続的な科学研究投資の潜在的利益を上回るわけではないと述べる。別の言い方: The government should retain the national research program because its discoveries could improve future energy security, and although its immediate costs are substantial and taxpayers’ legitimate concerns about public-fund allocation deserve careful scrutiny, those concerns do not outweigh the potential benefits of sustained scientific investment."},{"id":"p1-connector-007","q":"Automated systems process routine benefit applications quickly, allowing public agencies to reduce delays for most applicants. ___, human officials must review unusual cases to prevent rigid rules from unfairly excluding eligible residents.","q_ja":"自動化システムは定型的な給付申請を迅速に処理し、行政機関は大半の申請者の待ち時間を短縮できる。とはいえ、硬直的な規則によって受給資格のある住民が不当に排除されないよう、例外的な事例は職員が審査しなければならない。","choices":[{"t":"For example","why":"職員による例外的な事例の審査は、自動処理が迅速であることの具体例ではない。"},{"t":"Consequently","why":"人による審査が必要なのは規則の硬直性を補うためであり、処理が速いことの結果ではない。"},{"t":"In other words","why":"自動化の効率と人による審査の必要性は、同じ内容の言い換えではない。"},{"t":"That said","why":"正解。自動化の利点を認めたうえで、人による審査が必要だという留保を加える。"}],"answer":3,"point":"That said は、直前の内容を受け入れながら「とはいえ」と留保や注意点を加える。","drive":{"ja":"自動化は給付申請の処理を速める。とはいえ、例外的な事例には職員の審査が必要だ。この留保を英語で表しましょう。","en":"Automated systems process routine benefit applications quickly, allowing public agencies to reduce delays for most applicants. That said, human officials must review unusual cases to prevent rigid rules from unfairly excluding eligible residents."},"level":3,"explain":"システムがprocessの主語で、That saidが人の審査へつなぐ。prevent A from doingで防ぐ不利益を示し、留保を支える。別の言い方: Still, officials must review exceptions."},{"id":"p1-connector-008","q":"The new trade agreement removed import duties on essential medical equipment previously subject to substantial taxes. ___, hospitals now pay less for these imports and have more funds available for patient care.","q_ja":"新たな貿易協定により、それまで高額の税が課されていた不可欠な医療機器の輸入関税が撤廃された。その結果、病院の輸入費用は下がり、患者のケアに使える資金が増えた。","choices":[{"t":"Conversely","why":"病院の費用減少は、関税撤廃と逆の関係ではなく、その効果である。"},{"t":"Consequently","why":"正解。関税の撤廃によって輸入費用が下がり、利用可能な資金が増えたという結果を示す。"},{"t":"Nevertheless","why":"関税撤廃後の費用減少は予想される効果であり、逆接にはならない。"},{"t":"For instance","why":"病院の資金増加は、撤廃された輸入関税の具体例ではなく、撤廃の結果である。"}],"answer":1,"point":"Consequently は、制度の変更が費用や資金に及ぼした結果を説明するときにも使う。","drive":{"ja":"医療機器の輸入関税が撤廃された。その結果、病院は患者のケアに回せる資金が増えた。この結果を英語で表しましょう。","en":"The new trade agreement removed import duties on essential medical equipment previously subject to substantial taxes. Consequently, hospitals now pay less for these imports and have more funds available for patient care."},"level":2,"explain":"協定がremovedの主語で、Consequentlyが病院への効果を導く。have＋目的語＋availableで使える資金を示し、要約に役立つ。別の言い方: Thus, hospitals can spend more on care."},{"id":"p1-connector-009","q":"The coastal protection project exceeded its original budget, and independent engineers warned that its benefits had been overstated. ___, the council extended the project without revising its design or explaining how further spending would be justified.","q_ja":"海岸保護事業は当初の予算を超過し、独立した技術者たちは効果が過大評価されていると警告した。それにもかかわらず、議会は設計を見直さず、追加支出の正当性も説明しないまま事業を延長した。","choices":[{"t":"Nevertheless","why":"正解。費用超過と効果への警告にもかかわらず、見直さずに延長したという逆接を示す。"},{"t":"For example","why":"議会による事業延長は、効果が過大評価されていることの具体例として示されていない。"},{"t":"Similarly","why":"議会の対応は技術者の警告と同じ方向ではなく、警告を受けても方針を変えない対応である。"},{"t":"Consequently","why":"効果への警告が、設計を見直さない延長を合理的に引き起こすという因果関係にはならない。"}],"answer":0,"point":"Nevertheless は、問題点が示されても方針や行動が変わらない展開にも使える。","drive":{"ja":"海岸保護事業には費用と効果の問題が指摘された。それにもかかわらず、議会は見直さず延長した。この逆接を英語で表しましょう。","en":"The coastal protection project exceeded its original budget, and independent engineers warned that its benefits had been overstated. Nevertheless, the council extended the project without revising its design or explaining how further spending would be justified."},"level":2,"explain":"技術者が警告、Neverthelessで議会の延長へ転じる。had been overstatedは警告以前の過大評価を示し、要約で時系列を示す。別の言い方: Still, the council extended the project."},{"id":"p1-connector-010","q":"Protecting wetlands preserves habitats for species whose survival depends on stable conditions within these increasingly threatened ecosystems. ___, wetlands absorb excess rainfall, reducing the risk of severe flooding in nearby residential areas.","q_ja":"湿地を保護することは、ますます脅かされる生態系の安定した環境に生存を依存する種の生息地を守ることになる。さらに、湿地は余分な雨水を吸収し、近隣の住宅地で深刻な洪水が起こる危険を減らす。","choices":[{"t":"In contrast","why":"雨水の吸収は生息地保全と対立する性質ではなく、湿地の別の有益な機能である。"},{"t":"In other words","why":"生息地の保全と洪水リスクの軽減は異なる効果であり、言い換えではない。"},{"t":"Furthermore","why":"正解。生物の保護という利点に、洪水リスクの軽減という追加の利点を重ねている。"},{"t":"Nevertheless","why":"雨水を吸収する機能は、種の生息地を保全するという説明に反する内容ではない。"}],"answer":2,"point":"Furthermore で別の利点を追加すると、政策を支持する理由を重ねて説明できる。","drive":{"ja":"湿地の保護は生物の生息地を守る。さらに、湿地は洪水の危険も減らす。この利点の追加を英語で表しましょう。","en":"Protecting wetlands preserves habitats for species whose survival depends on stable conditions within these increasingly threatened ecosystems. Furthermore, wetlands absorb excess rainfall, reducing the risk of severe flooding in nearby residential areas."},"level":2,"explain":"動名詞句がpreservesの主語で、Furthermoreが湿地の別の利点を導く。reducing以下は雨水吸収の結果を補い、論述で効果を具体化できる。別の言い方: Wetlands also reduce flood risks."},{"id":"p1-connector-201","q":"Several rural hospitals lack enough nurses to keep their emergency departments open overnight. ___, residents must travel farther to receive urgent medical treatment during the night.","q_ja":"地方のいくつかの病院では、救急部門を夜間も開けておくための看護師が不足している。その結果、住民は夜間に緊急の治療を受けるため、より遠くまで移動しなければならない。","choices":[{"t":"Consequently","why":"正解。夜間の看護師不足によって、住民の移動距離が長くなるという結果を示す。"},{"t":"Nevertheless","why":"「それにもかかわらず」という逆接だが、遠方への移動は看護師不足に反する結果ではない。"},{"t":"For instance","why":"具体例を導く語だが、後文は看護師不足の例ではなく、その影響を述べている。"},{"t":"In contrast","why":"対照を示す語だが、二つの地域や制度を比較しているわけではない。"}],"answer":0,"point":"Consequently は、前文で述べた原因から生じる結果を導く。","level":1,"drive":{"ja":"地方の病院では夜間の看護師が不足している。その結果、住民は緊急の治療を受けるため、より遠くまで移動しなければならない。因果関係をつなぐ英文を確認する。","en":"Several rural hospitals lack enough nurses to keep their emergency departments open overnight. Consequently, residents must travel farther to receive urgent medical treatment during the night."},"explain":"病院が看護師を欠き、Consequentlyで住民の移動という結果へつなぐ。to receiveは目的を表し、要約で行動の理由も示せる。別の言い方: As a result, residents must travel farther."},{"id":"p1-connector-202","q":"Installing solar panels on public buildings requires a large amount of initial funding. ___, the city will proceed because the project should reduce energy costs over time.","q_ja":"公共の建物への太陽光パネル設置には、多額の初期資金が必要となる。それにもかかわらず、市は長期的な電気代の削減が見込めるため、計画を進める。","choices":[{"t":"Consequently","why":"計画を進める理由は長期的な費用削減であり、初期費用が多額であることの結果ではない。"},{"t":"For this reason","why":"「この理由で」とつなぐと、多額の初期費用を計画推進の理由にしてしまう。"},{"t":"Nevertheless","why":"正解。初期費用という障害があっても計画を進めるという譲歩を示す。"},{"t":"In other words","why":"後文は初期費用についての言い換えではなく、市の判断を述べている。"}],"answer":2,"point":"Nevertheless は、前文から予想される展開に反して成立する内容を導く。","level":1,"drive":{"ja":"太陽光パネルの設置には多額の初期資金が必要だ。それにもかかわらず、市は長期的な電気代の削減を見込み、計画を進める。","en":"Installing solar panels on public buildings requires a large amount of initial funding. Nevertheless, the city will proceed because the project should reduce energy costs over time."},"explain":"動名詞句が主語でrequiresが動詞、後文のbecause節は市の判断の理由を示す。Neverthelessは難点を認めて提案を支持する論述に使える。別の言い方: Even so, the city will proceed."},{"id":"p1-connector-203","q":"Public libraries provide free internet access for residents who cannot afford a home connection. ___, they offer training sessions to help these residents use essential online services.","q_ja":"公共図書館は、自宅のインターネット回線の費用を負担できない住民に無料の接続環境を提供している。さらに、こうした住民が必要なオンラインサービスを使えるよう、講習会も開いている。","choices":[{"t":"Nevertheless","why":"後文も図書館の支援策であり、前文に反する内容ではない。"},{"t":"Furthermore","why":"正解。無料の接続環境に加え、講習会という別の支援策を追加している。"},{"t":"In other words","why":"接続環境の提供と講習会の開催は別の支援であり、同じ内容の言い換えではない。"},{"t":"Conversely","why":"関係を逆転させる語だが、利用者が図書館を支援するという逆の関係は述べていない。"}],"answer":1,"point":"Furthermore は、同じ主張を支える別の情報を追加する。","level":1,"drive":{"ja":"公共図書館は、自宅の回線費用を負担できない住民に無料の接続環境を提供する。さらに、オンラインサービスを利用するための講習会も開く。","en":"Public libraries provide free internet access for residents who cannot afford a home connection. Furthermore, they offer training sessions to help these residents use essential online services."},"explain":"図書館がprovideし、後文のtheyも図書館を指す。Furthermoreで支援策を追加すると、論述で同じ主張の根拠を積み重ねられる。別の言い方: In addition, they offer training."},{"id":"p1-connector-204","q":"The northern district spends most of its transport budget on expanding roads for private vehicles. ___, the southern district gives priority to improving bus services and bicycle routes.","q_ja":"北部地区は交通予算の大半を自家用車向けの道路拡張に充てている。対照的に、南部地区はバスの運行や自転車道の改善を優先している。","choices":[{"t":"Consequently","why":"南部の予算方針が北部の道路拡張によって生じたとは述べられていない。"},{"t":"For instance","why":"南部の公共交通重視は、北部の自家用車向け道路拡張の具体例にはならない。"},{"t":"In other words","why":"二つの地区で優先事項が異なるため、同じ内容の言い換えではない。"},{"t":"In contrast","why":"正解。自家用車向けの道路を重視する地区と、バスや自転車を重視する地区を対比する。"}],"answer":3,"point":"In contrast は、比較する対象のはっきりした違いを示す。","level":1,"drive":{"ja":"北部地区は交通予算の大半を自家用車向けの道路拡張に充てる。対照的に、南部地区はバスと自転車の利用環境を優先する。","en":"The northern district spends most of its transport budget on expanding roads for private vehicles. In contrast, the southern district gives priority to improving bus services and bicycle routes."},"explain":"北部がspends、南部がgivesを述語とし、In contrastで結ぶ。give priority to＋動名詞で政策の優先順位を比較できる。別の言い方: The south, however, prioritizes buses."},{"id":"p1-connector-205","q":"Public confidence in a regulatory agency can encourage businesses to invest, since they expect the rules to remain predictable. ___, sustained business investment can strengthen public confidence by demonstrating that the agency provides a stable environment for economic activity.","q_ja":"規制機関への社会の信頼は、規則の予測可能性への期待を通じ、企業の投資を促しうる。逆に、企業が投資を続けることも、その機関が経済活動に安定した環境を提供していると示すことで、社会の信頼を強めうる。","choices":[{"t":"For instance","why":"後文は信頼が投資を促す例ではなく、投資が信頼を強めるという逆向きの作用を述べる。"},{"t":"Nevertheless","why":"二つの作用は両立しており、後文は前文に反する内容ではない。"},{"t":"Conversely","why":"正解。信頼から投資へという作用を、投資から信頼へと逆向きにしている。"},{"t":"In other words","why":"作用の向きが逆転しているので、前文と同じ内容の言い換えではない。"}],"answer":2,"point":"Conversely は、対照だけでなく、二つの要素の関係が逆向きになる場合にも使う。","level":2,"drive":{"ja":"規制機関への信頼は企業の投資を促しうる。逆に、継続的な投資も、その機関が安定した経済環境を提供していると示すことで、信頼を強めうる。","en":"Public confidence in a regulatory agency can encourage businesses to invest, since they expect the rules to remain predictable. Conversely, sustained business investment can strengthen public confidence by demonstrating that the agency provides a stable environment for economic activity."},"explain":"信頼が投資を促す文から、Converselyで投資が信頼を強める文へ移る。by＋動名詞は手段を示し、要約で相互作用の仕組みを補える。別の言い方: Investment can also build trust."},{"id":"p1-connector-206","q":"The government should introduce independent inspections to ensure that factories comply with environmental regulations, even when enforcement is politically unpopular. ___, these inspections would impose additional administrative costs on smaller manufacturers. Yet those costs are justified by the need to prevent serious pollution.","q_ja":"取り締まりが政治的に不人気でも、工場が環境規制を守るよう、政府は独立した検査を導入すべきだ。確かに、この検査は小規模な製造業者の事務費用を増やすだろう。それでも、深刻な汚染を防ぐ必要性を考えれば、その費用負担は妥当である。","choices":[{"t":"Admittedly","why":"正解。主張に不利な費用負担をいったん認め、次の文で導入を支持する立場を維持している。"},{"t":"In other words","why":"検査導入の提案と費用負担の指摘は、同じ内容の言い換えではない。"},{"t":"Conversely","why":"検査と規制順守の関係を逆向きに説明しているわけではない。"},{"t":"For this reason","why":"検査を導入すべきだという評価そのものが、事務費用を増やす原因になるわけではない。"}],"answer":0,"point":"Admittedly で不利な点を認めた後、Yet などで主張を維持する構成を覚える。","level":2,"drive":{"ja":"政府は環境規制を守らせるため、独立した検査を導入すべきだ。確かに、小規模な製造業者の事務費用は増える。それでも、深刻な汚染を防ぐために必要な負担である。","en":"The government should introduce independent inspections to ensure that factories comply with environmental regulations, even when enforcement is politically unpopular. Admittedly, these inspections would impose additional administrative costs on smaller manufacturers. Yet those costs are justified by the need to prevent serious pollution."},"explain":"政府が検査を導入すべきだと述べ、Admittedlyで負担を認め、Yetで支持に戻る。譲歩してから再主張する型は、論述で反論に応えられる。別の言い方: Granted, inspections would raise costs."},{"id":"p1-connector-207","q":"Local authorities can reduce unnecessary waste by making producers responsible for collecting products that have reached the end of their useful lives. ___, electronics manufacturers could be required to take back discarded devices and recover valuable materials rather than send them to landfill.","q_ja":"地方自治体は、使用期間を終えた製品の回収責任を生産者に負わせることで、不要な廃棄物を減らせる。例えば、電子機器メーカーに、廃棄された機器を引き取り、埋め立てに回さず有用な資源を回収するよう義務付けることが考えられる。","choices":[{"t":"Nevertheless","why":"電子機器の回収義務は前文の方針と一致しており、それに反する話ではない。"},{"t":"Conversely","why":"生産者の回収責任が廃棄物を減らすという関係を、逆向きにしていない。"},{"t":"In other words","why":"製品全般の回収責任を、電子機器という一分野の実施例に具体化しており、同じ範囲の言い換えではない。"},{"t":"For instance","why":"正解。生産者の回収責任という一般的な政策について、電子機器の場合の具体例を示す。"}],"answer":3,"point":"For instance は、一般的な説明を特定の分野や方法で具体化するときに使う。","level":2,"drive":{"ja":"自治体は生産者に使用済み製品の回収責任を負わせ、廃棄物を減らせる。例えば、電子機器メーカーに機器の引き取りと資源回収を義務付ける方法がある。","en":"Local authorities can reduce unnecessary waste by making producers responsible for collecting products that have reached the end of their useful lives. For instance, electronics manufacturers could be required to take back discarded devices and recover valuable materials rather than send them to landfill."},"explain":"自治体による生産者への回収責任の付与を述べ、For instanceで電子機器メーカーの場合を具体化している。could be required toは義務付けの可能性を表し、機器の引き取りと資源回収を求める政策例を示す。別の言い方: Local authorities can reduce unnecessary waste by making producers responsible for collecting products at the end of their useful lives; for example, electronics manufacturers could be obliged to take back discarded devices and recover valuable materials instead of sending them to landfill."},{"id":"p1-connector-208","q":"To prevent the new research fund from supporting commercially viable projects, the committee restricted eligibility to three categories, which the published guidelines define exhaustively. ___, only fundamental research, long-term environmental monitoring, and studies of neglected diseases qualify for support, with all other applications excluded regardless of their scientific merit.","q_ja":"新しい研究基金が商業的に採算の取れる事業を支援するのを防ぐため、委員会は対象を三つの区分に限定し、公表した指針でそれらを漏れなく定義した。すなわち、基礎研究、長期的な環境監視、顧みられてこなかった疾患の研究だけが支援対象であり、それ以外の申請は科学的価値にかかわらず除外される。","choices":[{"t":"For instance","why":"一部の例を挙げる語だが、後文は支援対象の三つの区分をすべて特定している。"},{"t":"Namely","why":"正解。前文の「三つの区分」の中身を、例示ではなく漏れなく特定している。"},{"t":"Nevertheless","why":"対象区分の列挙は、前文の制限に逆らう内容ではない。"},{"t":"Conversely","why":"区分の内容を明示しているだけで、前文の関係を逆転させていない。"}],"answer":1,"point":"Namely は内容の特定、For instance は一部の例示。対象をすべて列挙しているかを読む。","level":3,"drive":{"ja":"研究基金の支援対象は、公表された指針で三つの区分に限定されている。すなわち、基礎研究、長期的な環境監視、顧みられてこなかった疾患の研究だけが対象となる。","en":"To prevent the new research fund from supporting commercially viable projects, the committee restricted eligibility to three categories, which the published guidelines define exhaustively. Namely, only fundamental research, long-term environmental monitoring, and studies of neglected diseases qualify for support, with all other applications excluded regardless of their scientific merit."},"explain":"委員会が対象を限定し、Namely以下で三分野がqualifyの主語となる。onlyで対象を絞る型は、要約で支援範囲を正確に示せる。別の言い方: These are the only eligible fields."},{"id":"p1-connector-209","q":"An international agreement on industrial emissions must include independent verification of national reports if its targets are to provide a reliable basis for coordinated action. ___, governments could claim reductions that have never occurred, undermining mutual trust and allowing persistent violations to remain concealed despite apparently successful progress towards the agreed targets.","q_ja":"産業排出量に関する国際協定で、目標を協調行動の信頼できる基盤とするには、各国の報告を独立して検証する仕組みが不可欠である。そうしなければ、政府は実際には起きていない削減を主張でき、合意した目標に向けて順調に進んでいるように見えても、相互の信頼が損なわれ、継続的な違反が隠されたままになりうる。","choices":[{"t":"Otherwise","why":"正解。必要な独立検証を実施しなかった場合に起こりうる事態を示す。"},{"t":"Consequently","why":"検証を盛り込んだ結果として虚偽報告が可能になるという、逆の因果関係にしてしまう。"},{"t":"Furthermore","why":"単なる情報の追加では、独立検証がない場合という後文の成立条件を示せない。"},{"t":"For instance","why":"後文は独立検証の具体例ではなく、それを欠く場合の危険を述べている。"}],"answer":0,"point":"必要な措置を述べた後の Otherwise は、その措置を取らない場合の帰結を導く。","level":3,"drive":{"ja":"産業排出量の国際協定には、各国の報告を独立して検証する仕組みが必要だ。そうしなければ、実在しない削減を政府が主張でき、違反が隠れたまま相互の信頼が損なわれうる。","en":"An international agreement on industrial emissions must include independent verification of national reports if its targets are to provide a reliable basis for coordinated action. Otherwise, governments could claim reductions that have never occurred, undermining mutual trust and allowing persistent violations to remain concealed despite apparently successful progress towards the agreed targets."},"explain":"協定が検証を含む必要を述べ、Otherwiseで欠如した場合の政府の行動を示す。couldは可能性を表し、論述で危険を断定せず指摘できる。別の言い方: Without it, false claims could go unchecked."},{"id":"p1-connector-210","q":"A trial of automated benefit assessments reduced processing times substantially, providing credible evidence that the technology could alleviate administrative pressure without requiring additional public expenditure. ___, the trial excluded applicants with complex circumstances, so its success does not justify replacing human judgment across the entire welfare system at this stage.","q_ja":"給付審査を自動化する試行で処理時間が大幅に短縮され、この技術が公費の追加支出なしに事務負担を軽減しうるという信頼できる証拠が得られた。とはいえ、この試行では複雑な事情のある申請者が除かれていたため、その成功だけで現段階の福祉制度全体における人の判断の置き換えを正当化することはできない。","choices":[{"t":"Consequently","why":"対象者を限定したことは処理時間短縮の結果ではなく、成果の適用範囲を狭める試行の条件である。"},{"t":"In other words","why":"後文は効率改善の言い換えではなく、結果の一般化に対する留保を述べている。"},{"t":"That said","why":"正解。試行の成果を認めたうえで、対象者の偏りによって全面導入の判断には限界があると留保する。"},{"t":"Conversely","why":"事務負担の軽減が自動化を生むという逆の作用ではなく、前文の評価に条件を付けている。"}],"answer":2,"point":"That said は、直前の評価を認めつつ、その適用範囲や結論に留保を付ける。","level":3,"drive":{"ja":"給付審査の自動化試行は、処理時間と事務負担の改善可能性を示した。とはいえ、複雑な事情のある申請者が対象外だったため、福祉制度全体で人の判断を置き換える根拠にはならない。","en":"A trial of automated benefit assessments reduced processing times substantially, providing credible evidence that the technology could alleviate administrative pressure without requiring additional public expenditure. That said, the trial excluded applicants with complex circumstances, so its success does not justify replacing human judgment across the entire welfare system at this stage."},"explain":"試行が時間を短縮したと述べ、That saidで制約を示し、soで結論へつなぐ。justify＋動名詞は、論述で証拠が政策を支持するか論じる型。別の言い方: Still, the evidence has limits."},{"id":"p1-connector-211","q":"The government reduced funding for public libraries despite growing demand for their services nationwide. ___, several branches were forced to shorten their opening hours to cover essential operating costs.","q_ja":"政府は、全国でサービスの需要が高まっているにもかかわらず、公立図書館への資金を削減した。その結果、いくつかの分館は必要な運営費を賄うため、開館時間を短縮せざるを得なくなった。","choices":[{"t":"Nevertheless","why":"「それにもかかわらず」は予想に反する展開を示すが、開館時間の短縮は資金削減の結果である。"},{"t":"Consequently","why":"正解。資金削減が原因となり、開館時間の短縮という結果が生じている。"},{"t":"For instance","why":"「例えば」は具体例を導くが、後文は図書館への資金削減の例ではなく、その影響である。"},{"t":"In comparison","why":"「比較すると」は比較対象を必要とするが、後文は他の施設などとの比較ではない。"}],"answer":1,"point":"Consequently は、前の文で示した原因から生じる結果を導く。","level":1,"drive":{"ja":"政府は需要の増加にもかかわらず図書館への資金を削減した。その結果、分館は開館時間を短縮せざるを得なくなった。原因から結果につなぐ表現を入れて英文を読みましょう。","en":"The government reduced funding for public libraries despite growing demand for their services nationwide. Consequently, several branches were forced to shorten their opening hours to cover essential operating costs."},"explain":"政府が資金を減らし、Consequentlyで分館の行動へつなぐ。be forced toは外的強制を表し、政策の影響の要約に使える。別の言い方: As a result, libraries had to cut their hours."},{"id":"p1-connector-212","q":"Independent research found that the proposed factory would pose a serious threat to local water supplies. ___, the council approved its construction despite repeated warnings from scientists and residents about the environmental risks.","q_ja":"独立した研究で、計画中の工場が地域の水供給に深刻な脅威をもたらすことが分かった。それにもかかわらず、議会は科学者や住民から環境リスクについて繰り返し警告を受けながら、建設を承認した。","choices":[{"t":"Consequently","why":"「その結果」は警告を理由に建設を承認したという関係になるが、本文は警告に反する決定を述べている。"},{"t":"For instance","why":"「例えば」は研究結果の具体例を導くが、議会による建設承認はその研究結果の例ではない。"},{"t":"In other words","why":"「言い換えると」は同じ内容を述べ直す表現だが、研究結果と議会の決定は別の内容である。"},{"t":"Nevertheless","why":"正解。深刻な環境リスクが判明したのに建設を承認したという、予想に反する展開を示す。"}],"answer":3,"point":"Nevertheless は、前の内容から予想されることに反する事実や判断を導く。","level":2,"drive":{"ja":"工場による水供給への深刻なリスクが判明した。それにもかかわらず、議会は警告を受けながら建設を承認した。予想に反する決定につなぐ表現を入れて英文を読みましょう。","en":"Independent research found that the proposed factory would pose a serious threat to local water supplies. Nevertheless, the council approved its construction despite repeated warnings from scientists and residents about the environmental risks."},"explain":"研究が危険を示し、Neverthelessで議会が承認した逆の展開へつなぐ。despite＋名詞は警告を譲歩として添え、判断への批判に使える。別の言い方: Even so, the council approved the plan."},{"id":"p1-connector-213","q":"The revised eligibility rules exclude households whose savings exceed the threshold, regardless of whether their current income falls below the poverty line. ___, households with savings below that threshold remain eligible even when their current income exceeds the poverty line, provided they satisfy the residency requirement.","q_ja":"改定された受給資格の規則では、現在の所得が貧困線を下回るかどうかに関係なく、貯蓄が基準額を超える世帯は対象外になる。逆に、貯蓄がその基準額を下回る世帯は、居住要件を満たしていれば、現在の所得が貧困線を上回っていても受給資格を維持する。","choices":[{"t":"Conversely","why":"正解。高い貯蓄なら低所得でも対象外となり、逆に低い貯蓄なら高所得でも対象となる、条件と結果の対応を対照させている。"},{"t":"Consequently","why":"「その結果」は因果を示すが、後文の受給資格は前文の世帯の除外によって生じる結果ではない。"},{"t":"Specifically","why":"「具体的には」は前文の詳細を示すが、後文は対象外の世帯の詳述ではなく、反対の条件にある世帯の扱いである。"},{"t":"For this purpose","why":"「この目的のために」は目的と手段を結ぶが、前文には後文の扱いが実現すべき目的が示されていない。"}],"answer":0,"point":"Conversely は条件や関係を反対側から示す。貯蓄と所得のどちらが資格を左右するかを読み分ける。","level":3,"drive":{"ja":"貯蓄が基準額を超えると低所得でも対象外になる。逆に、貯蓄が基準額未満なら、居住要件を満たす限り高所得でも対象となる。反対の条件を示す表現を入れて英文を読みましょう。","en":"The revised eligibility rules exclude households whose savings exceed the threshold, regardless of whether their current income falls below the poverty line. Conversely, households with savings below that threshold remain eligible even when their current income exceeds the poverty line, provided they satisfy the residency requirement."},"explain":"規則が世帯を除外し、Converselyで別世帯の資格を対比する。provided節は居住条件を加え、制度の要約に役立つ。別の言い方: In contrast, households with less saved may qualify."},{"id":"p1-connector-214","q":"Investing in urban trees not only reduces summer temperatures but also improves air quality. ___, it creates habitats for wildlife, providing another environmental benefit for densely populated urban communities.","q_ja":"都市の樹木に投資することは、夏の気温を下げるだけでなく、大気の質も改善する。さらに、野生生物の生息地を生み出し、人口の密集した都市地域に別の環境面の恩恵をもたらす。","choices":[{"t":"Nevertheless","why":"「それにもかかわらず」は予想に反する内容を導くが、後文も樹木への投資の利点を述べている。"},{"t":"For instance","why":"「例えば」は前文の具体例を導くが、生息地の創出は気温低下や大気改善の例ではなく、別の利点である。"},{"t":"Furthermore","why":"正解。気温低下と大気改善に加えて、生息地の創出という別の利点を追加している。"},{"t":"In other words","why":"「言い換えると」は同じ内容の説明になるが、生息地の創出は前文とは異なる利点である。"}],"answer":2,"point":"Furthermore は同じ主張を支える別の情報を追加する。具体例や言い換えと区別する。","level":1,"drive":{"ja":"都市の樹木は気温を下げ、大気を改善する。さらに、野生生物の生息地も生み出す。別の利点を加える表現を入れて英文を読みましょう。","en":"Investing in urban trees not only reduces summer temperatures but also improves air quality. Furthermore, it creates habitats for wildlife, providing another environmental benefit for densely populated urban communities."},"explain":"動名詞句が主語で、Furthermore以下のitも投資を指す。not only A but also Bで効果を並べ、別の利点で主張を補強する。別の言い方: Moreover, it provides wildlife habitats."},{"id":"p1-connector-215","q":"Some cities have introduced financial incentives to encourage residents to choose transport that produces fewer emissions. ___, one municipality offers discounted rail passes to commuters who agree to stop using subsidized parking spaces.","q_ja":"一部の都市は、排出量の少ない交通手段を住民が選ぶよう促すため、金銭的な優遇策を導入している。例えば、ある自治体は、補助金で利用料が抑えられた駐車場の使用をやめることに同意した通勤者に、割引の鉄道定期券を提供している。","choices":[{"t":"For instance","why":"正解。鉄道定期券の割引を、環境負荷の少ない交通手段へ誘導する金銭的優遇策の具体例として示している。"},{"t":"Nevertheless","why":"「それにもかかわらず」は前文からの予想に反する展開を導くが、定期券の割引は前文の施策に沿っている。"},{"t":"In consequence","why":"「その結果」は因果を示すが、後文は優遇策の導入後に生じた効果ではなく、優遇策そのものの例である。"},{"t":"Conversely","why":"「逆に」は反対の条件や方向を示すが、後文の施策も前文と同じ方向の取り組みである。"}],"answer":0,"point":"For instance は一般的な説明の後に具体例を示す。施策の例と施策が生む結果を区別する。","level":2,"drive":{"ja":"都市は排出量の少ない交通手段を選ぶための金銭的優遇策を設けている。例えば、駐車場の利用をやめる通勤者に定期券を割引する自治体がある。具体例を導く表現を入れて英文を読みましょう。","en":"Some cities have introduced financial incentives to encourage residents to choose transport that produces fewer emissions. For instance, one municipality offers discounted rail passes to commuters who agree to stop using subsidized parking spaces."},"explain":"都市が優遇策を導入し、For instanceで実例へつなぐ。who節で通勤者の条件を絞り、施策の対象を具体的に説明できる。別の言い方: For example, one town offers cheaper rail passes."},{"id":"p1-connector-216","q":"Regulators must require independent verification of emission reductions before allowing companies to use the corresponding credits to meet their legal obligations. ___, companies could satisfy those obligations with credits whose claimed environmental benefits have never been substantiated, undermining the integrity of the entire trading scheme.","q_ja":"規制当局は、企業が法的義務を果たすために排出削減枠を利用することを認める前に、削減量について第三者による検証を求めなければならない。そうしなければ、企業は主張された環境上の効果が一度も裏付けられていない削減枠で義務を果たせてしまい、排出量取引制度全体の信頼性を損なうおそれがある。","choices":[{"t":"Consequently","why":"「その結果」では、検証を義務付けることで未検証の枠が使えるという逆の因果になってしまう。"},{"t":"For instance","why":"「例えば」は検証義務の具体例を導くが、後文はその義務を設けなかった場合の危険を述べている。"},{"t":"In other words","why":"「言い換えると」では検証を求める措置と未検証の枠の利用を同じ内容として扱うことになり、意味が一致しない。"},{"t":"Otherwise","why":"正解。前文の検証義務を設けなければ起こり得る事態を示しており、省略された否定条件を補う。"}],"answer":3,"point":"Otherwise は「そうしなければ」という否定条件を表す。前文の措置を実施した結果と混同しない。","level":3,"drive":{"ja":"規制当局は削減枠の利用を認める前に第三者検証を義務付ける必要がある。そうしなければ、未検証の枠で義務を果たせてしまい、制度の信頼性が損なわれる。措置を取らない場合を示す表現を入れて英文を読みましょう。","en":"Regulators must require independent verification of emission reductions before allowing companies to use the corresponding credits to meet their legal obligations. Otherwise, companies could satisfy those obligations with credits whose claimed environmental benefits have never been substantiated, undermining the integrity of the entire trading scheme."},"explain":"当局が検証を求め、Otherwiseで未実施の場合を示す。couldは危険の可能性を表し、提言の必要性を説明できる。別の言い方: Without verification, unreliable credits could be used."},{"id":"p1-connector-217","q":"The government considered replacing local health centers with a single hospital to reduce operating costs. ___, it rejected that proposal and increased funding for existing centers to maintain access in rural areas.","q_ja":"政府は運営費を削減するため、地域の保健医療施設を一つの病院に置き換えることを検討した。その代わりに、その案を退け、農村地域での利用機会を維持するため、既存の施設への資金を増やした。","choices":[{"t":"Consequently","why":"「その結果」は前文を原因とする結果を示すが、後文は検討した集約案に代わって採用した方策を示している。"},{"t":"For instance","why":"「例えば」は施設を集約する取り組みの例を導くが、後文は集約案を退けて既存施設を支援している。"},{"t":"Instead","why":"正解。施設を一つにまとめる案を退け、その代わりに既存施設への資金を増やしている。"},{"t":"Furthermore","why":"「さらに」は方策の追加になるが、後文では前の案を実施せず、別の方策に置き換えている。"}],"answer":2,"point":"Instead は、先に示された案や行動に代わる選択を導く。rejected が置き換えの手掛かりになる。","level":2,"drive":{"ja":"政府は地域の保健医療施設を一つの病院にまとめる案を検討した。その代わりに、その案を退けて既存施設への資金を増やした。代替策を示す表現を入れて英文を読みましょう。","en":"The government considered replacing local health centers with a single hospital to reduce operating costs. Instead, it rejected that proposal and increased funding for existing centers to maintain access in rural areas."},"explain":"政府が集約を検討し、Instead以下のitが却下と増額の主語になる。consider＋動名詞で検討段階を示し、政策転換を説明できる。別の言い方: Instead, it chose to fund existing centers."},{"id":"p1-connector-218","q":"The independent review recommended restricting the purposes for which employers may retain biometric data, rather than limiting how long they retain it. ___, employers would be permitted to retain such data solely for verifying workplace access, while using it to evaluate employee performance would be prohibited.","q_ja":"独立した審査では、雇用主が生体情報を保存する期間を制限するのではなく、保存を認める目的を制限するよう勧告された。具体的には、雇用主による保存は職場への入場確認だけを目的とする場合に認められ、従業員の業績評価への利用は禁止されることになる。","choices":[{"t":"Conversely","why":"「逆に」は反対の関係を示すが、後文は前文の目的制限に沿って、認める用途と禁じる用途を詳述している。"},{"t":"Specifically","why":"正解。期間ではなく目的を制限するという勧告の内容を、入場確認への限定と業績評価への利用禁止として具体化している。"},{"t":"Consequently","why":"「その結果」は勧告によって生じる影響を導くが、後文は勧告の実施後の影響ではなく、勧告自体の具体的な内容である。"},{"t":"Nevertheless","why":"「それにもかかわらず」は勧告に反する展開になるが、後文の用途制限はその勧告と一致している。"}],"answer":1,"point":"Specifically は抽象的な方針の内容を具体化する。方針の詳細と、その実施による結果を区別する。","level":3,"drive":{"ja":"審査では生体情報の保存期間ではなく、保存目的を制限するよう勧告された。具体的には、入場確認のための保存だけを認め、業績評価への利用を禁じる内容である。方針を具体化する表現を入れて英文を読みましょう。","en":"The independent review recommended restricting the purposes for which employers may retain biometric data, rather than limiting how long they retain it. Specifically, employers would be permitted to retain such data solely for verifying workplace access, while using it to evaluate employee performance would be prohibited."},"explain":"Specificallyは保存期間ではなく保存目的を制限するという勧告を具体化し、while節は許可される用途と禁止される用途を対比する。禁止されるのは生体情報の業績評価への利用であり、業績評価そのものではない。別の言い方: The independent review recommended limiting the purposes for which employers may retain biometric data rather than the retention period; specifically, employers would be allowed to retain it only to verify workplace access, while its use to evaluate employee performance would be prohibited."},{"id":"p1-connector-219","q":"The new water treatment system was expensive to install and required considerable public investment. ___, the council adopted it despite the cost because protecting residents from pollution remained its priority.","q_ja":"新しい水処理システムは導入費用が高く、多額の公的投資が必要だった。それにもかかわらず、汚染から住民を守ることを引き続き優先していたため、議会は費用の高さを承知で導入を決めた。","choices":[{"t":"Consequently","why":"「その結果」では高額な費用が導入の理由になるが、本文は費用という障害があっても導入したと述べている。"},{"t":"For instance","why":"「例えば」は高額な費用の具体例を導くが、後文は議会が導入を決めたことを述べている。"},{"t":"In other words","why":"「言い換えると」は同じ内容を述べ直すが、費用の説明と導入の決定は異なる内容である。"},{"t":"Nevertheless","why":"正解。高額な費用という障害にもかかわらず、議会が導入を決めたことを示す。"}],"answer":3,"point":"Nevertheless は障害があっても実行する場合に使う。despite the cost が譲歩の手掛かりになる。","level":1,"drive":{"ja":"水処理システムには多額の公的投資が必要だった。それにもかかわらず、議会は住民を汚染から守るために導入を決めた。障害があっても実行することを示す表現を入れて英文を読みましょう。","en":"The new water treatment system was expensive to install and required considerable public investment. Nevertheless, the council adopted it despite the cost because protecting residents from pollution remained its priority."},"explain":"費用を述べ、Neverthelessで議会の導入判断へつなぐ。because節では動名詞句が主語となり、費用より保護を優先する理由を示す。別の言い方: Even so, the council adopted the system."},{"id":"p1-connector-220","q":"Public agencies should make essential information available to residents who have limited digital skills. ___, local councils could provide printed guides explaining how to apply for housing support and other benefits.","q_ja":"公的機関は、デジタル機器を使う技能が十分でない住民にも必要な情報を届けるべきだ。例えば、地方自治体は住宅支援やその他の給付の申請方法を説明する印刷版の案内を提供できる。","choices":[{"t":"For instance","why":"正解。印刷版の案内を配ることを、デジタル機器に不慣れな住民にも情報を届ける方法の具体例として示している。"},{"t":"Nevertheless","why":"「それにもかかわらず」は前文からの予想に反する内容を導くが、印刷版の案内は前文の提案に沿っている。"},{"t":"Conversely","why":"「逆に」は反対の条件や方向を示すが、後文も情報を届けるという同じ方向の取り組みである。"},{"t":"In other words","why":"「言い換えると」は同じ内容の説明になるが、印刷版の案内は情報提供全体の言い換えではなく、一つの方法である。"}],"answer":0,"point":"For instance は提案を具体例で説明するときにも使う。全体の言い換えと一つの実施方法を区別する。","level":1,"drive":{"ja":"公的機関はデジタル機器に不慣れな住民にも情報を届けるべきだ。例えば、自治体は給付の申請方法を記した印刷版の案内を提供できる。具体的な方法を導く表現を入れて英文を読みましょう。","en":"Public agencies should make essential information available to residents who have limited digital skills. For instance, local councils could provide printed guides explaining how to apply for housing support and other benefits."},"explain":"機関を主語にshouldで提案し、For instanceで例を示す。explaining以下で案内の内容を補い、提言を具体化する。別の言い方: For example, councils can give printed guides."},{"id":"p1-connector-101","q":"The government reduced funding for public libraries, which rely heavily on this financial support. ___, several libraries had to shorten their opening hours to reduce their costs.","q_ja":"政府は公立図書館への資金を削減したが、図書館はこの財政支援に大きく依存している。その結果、いくつかの図書館は費用を削減するために開館時間を短縮せざるを得なかった。","choices":[{"t":"Furthermore","why":"「さらに」は情報を追加する語。ここでは資金削減によって生じた結果を示す。"},{"t":"Consequently","why":"正解。「その結果」という意味で、資金削減が原因となって開館時間が短縮されたことを示す。"},{"t":"In contrast","why":"「対照的に」は違いを示す語。ここでは二つの事柄を対比せず、原因と結果をつなぐ。"},{"t":"For instance","why":"「例えば」は具体例を示す語。開館時間の短縮は資金削減の例ではなく、その結果である。"}],"answer":1,"point":"Consequently は「その結果」。原因を述べた文の後で、それによって起きたことを示す。","level":1,"drive":{"ja":"政府は公立図書館への資金を削減したが、図書館はこの財政支援に大きく依存している。その結果、いくつかの図書館は費用を削減するために開館時間を短縮せざるを得なかった。","en":"The government reduced funding for public libraries, which rely heavily on this financial support. Consequently, several libraries had to shorten their opening hours to reduce their costs."},"explain":"政府がreducedの主語で、which節は財政支援に大きく依存する公立図書館を補足する。Consequentlyは資金削減の結果を導き、had to shorten their opening hoursは経費削減のために開館時間を短縮せざるを得なかったことを表す。別の言い方: The government cut funding for public libraries, which depend heavily on this support, so several libraries had to reduce their opening hours to lower their costs."},{"id":"p1-connector-102","q":"Expanding public transport would require substantial funding at a time when budgets are tight. ___, the government should support the plan because it would improve access to jobs.","q_ja":"予算が厳しい時期に公共交通を拡充するには、多額の資金が必要となる。それでも、仕事に通いやすくなるため、政府はその計画を支援すべきだ。","choices":[{"t":"For instance","why":"「例えば」は具体例を示す語。後の文は資金が必要になる例ではなく、計画への賛成意見である。"},{"t":"Furthermore","why":"「さらに」は同じ方向の情報を追加する語。ここでは資金面の難点を認めたうえで、賛成意見を述べる。"},{"t":"Nevertheless","why":"正解。「それでも」という意味で、資金面の難点があっても計画を支援すべきだと述べる。"},{"t":"Consequently","why":"「その結果」は因果関係を示す語。資金が必要なことが、政府が支援すべき理由になっているわけではない。"}],"answer":2,"point":"Nevertheless は「それでも」。前の文で難点を認めた後に、それでも成り立つ主張を続ける。","level":1,"drive":{"ja":"予算が厳しい時期に公共交通を拡充するには、多額の資金が必要となる。それでも、仕事に通いやすくなるため、政府はその計画を支援すべきだ。","en":"Expanding public transport would require substantial funding at a time when budgets are tight. Nevertheless, the government should support the plan because it would improve access to jobs."},"explain":"動名詞句がwould requireの主語で、Neverthelessが提言へつなぐ。shouldにbecause節で理由を添え、論述で提案を支える。別の言い方: Still, the government should back it."}],"error":[{"id":"p1-error-001","q":"再生可能エネルギー事業への公的投資は、輸入燃料への国の依存を徐々に減らしている。","q_ja":"日本語の意味に合う、文法・語法に誤りのない英文を選ぶ。","choices":[{"t":"Public investment in renewable energy projects are gradually reducing the country’s dependence on imported fuels.","why":"主語の中心は単数扱いの investment なので are を is にする。"},{"t":"Public funding for renewable energy projects is gradually reducing the country’s dependent on imported fuels.","why":"所有格の後には形容詞 dependent ではなく名詞 dependence が必要。"},{"t":"Public investment in renewable energy projects is gradually reducing the country’s dependence on imported fuels.","why":"正解。主語 investment に is が対応し、dependence on の語法も正しい。"},{"t":"Public funding for renewable energy projects is gradually reducing the country’s dependence of imported fuels.","why":"依存の対象には dependence on を使うため of を on にする。"},{"t":"Public investment supports renewable energy projects, what gradually reduce the country’s dependence on imported fuels.","why":"先行詞 projects を受ける非制限用法では what ではなく which を使う。"},{"t":"Public investment in renewable energy projects reduces dependence on imported fuels by financing new power generation equipments.","why":"equipment は不可算名詞なので equipments とはしない。"}],"answer":2,"point":"長い主語では中心となる名詞を見極めて動詞の数を合わせる。","drive":{"ja":"再生可能エネルギー事業への公的投資は、輸入燃料への国の依存を徐々に減らしている。","en":"Public investment in renewable energy projects is gradually reducing the country’s dependence on imported fuels."},"level":1,"explain":"主語は公的投資で、進行形が変化の途中を表す。dependence onは依存先を示し、政策効果の論述に使える。別の言い方: Such investment reduces reliance on imported fuels."},{"id":"p1-error-002","q":"独立した専門家が提供する助言は、政府が人工知能をより効果的に規制するのに役立つ。","q_ja":"日本語の意味に合う、文法・語法に誤りのない英文を選ぶ。","choices":[{"t":"Several advices from independent experts help governments regulate artificial intelligence more effectively through better policy decisions.","why":"advice は不可算名詞なので several advices を several pieces of advice にする。"},{"t":"Advice provided by independent experts helps governments regulate artificial intelligence more effective through better policy decisions.","why":"regulate を修飾するには形容詞 effective ではなく副詞 effectively が必要。"},{"t":"The advice that independent experts provide to national governments help them regulate artificial intelligence more effectively.","why":"主語の中心は不可算名詞 advice なので help を helps にする。"},{"t":"Advice provided by independent experts helps governments deal for the regulation of artificial intelligence more effectively.","why":"対処するという意味では deal with を使うため for を with にする。"},{"t":"Independent experts provide advice, that helps governments regulate artificial intelligence more effectively through better policy decisions.","why":"コンマに続く非制限用法では that ではなく which を使う。"},{"t":"Advice provided by independent experts helps governments regulate artificial intelligence more effectively through better policy decisions.","why":"正解。不可算名詞 Advice に helps が対応し、effectively が regulate を修飾する。"}],"answer":5,"point":"advice は不可算名詞で、動詞は単数として一致させる。","drive":{"ja":"独立した専門家が提供する助言は、政府が人工知能をより効果的に規制するのに役立つ。","en":"Advice provided by independent experts helps governments regulate artificial intelligence more effectively through better policy decisions."},"level":2,"explain":"主語は助言で、過去分詞句が提供者を示す。help＋人＋動詞原形で支援の効果を論じる。別の言い方: Expert advice helps governments regulate AI effectively."},{"id":"p1-error-003","q":"都市の公共交通網の拡大は、低所得地域の住民が雇用の機会を得やすくする。","q_ja":"日本語の意味に合う、文法・語法に誤りのない英文を選ぶ。","choices":[{"t":"The expansion of urban public transport networks improves access to employment opportunities for residents of low-income communities.","why":"正解。単数の expansion に improves が対応し、access to の語法も正しい。"},{"t":"The expansion of urban public transport networks improve access to employment opportunities for residents of low-income communities.","why":"主語の中心は単数の expansion なので improve を improves にする。"},{"t":"Expanding urban public transport networks improves access of employment opportunities for residents living in low-income communities.","why":"利用できる対象には access to を使うため of を to にする。"},{"t":"Residents of low-income communities gain better accesses to employment opportunities through the expansion of urban public transport networks.","why":"機会を利用できることを表す access は不可算名詞なので accesses とはしない。"},{"t":"The expansion of urban public transport networks makes employment opportunities more accessibility to residents of low-income communities.","why":"状態を表すには名詞 accessibility ではなく形容詞 accessible が必要。"},{"t":"Urban public transport networks are expanding, what improves access to employment opportunities for residents of low-income communities.","why":"前の節全体を受ける非制限用法では what ではなく which を使う。"}],"answer":0,"point":"access to は、機会やサービスを利用できることを表す。","drive":{"ja":"都市の公共交通網の拡大は、低所得地域の住民が雇用の機会を得やすくする。","en":"The expansion of urban public transport networks improves access to employment opportunities for residents of low-income communities."},"level":1,"explain":"主語は The expansion of urban public transport networks、動詞は improves。low-incomeはcommunitiesを修飾し、恩恵を受けるのは低所得地域の住民。別の言い方: Expanding urban public transport networks makes employment opportunities more accessible to residents of low-income communities."},{"id":"p1-error-004","q":"2020年、委員会は、提案された環境規制が翌年には製造業者に追加費用を課すだろうと予測した。","q_ja":"日本語の意味に合う、文法・語法に誤りのない英文を選ぶ。","choices":[{"t":"In 2020, the committee predicted that the proposed environmental regulations will impose additional costs on manufacturers the following year.","why":"過去の2020年から見た翌年の予測なので will ではなく would を使う。"},{"t":"In 2020, the committee predicted that the proposed environmental regulations would impose additional costs into manufacturers the following year.","why":"費用を課す相手は impose costs on で表すため into を on にする。"},{"t":"In 2020, the committee’s prediction concerning the proposed environmental regulations were that manufacturers would face additional costs the following year.","why":"主語の中心は単数の prediction なので were を was にする。"},{"t":"In 2020, the committee predicted that the proposed environmental regulations would impose addition costs on manufacturers the following year.","why":"costs を修飾するには名詞 addition ではなく形容詞 additional が必要。"},{"t":"In 2020, the committee predicted that the proposed environmental regulations would impose additional costs on manufacturers the following year.","why":"正解。過去の predicted に対し、翌年の見通しを would impose で表している。"},{"t":"In 2020, the committee assessed the proposed environmental regulations, that it predicted would impose additional costs on manufacturers the following year.","why":"コンマに続く非制限用法では that ではなく which を使う。"}],"answer":4,"point":"過去の時点から見た未来の予測には would を使う。","drive":{"ja":"2020年、委員会は、提案された環境規制が翌年には製造業者に追加費用を課すだろうと予測した。","en":"In 2020, the committee predicted that the proposed environmental re essible."},{"id":"p1-error-219","q":"干ばつ時の水の割り当てに関する透明な基準は、当局が家庭と農業生産者の対立する需要を調整するのに役立つ。","q_ja":"干ばつ時の水の割り当てに関する透明な基準は、当局が家庭と農業生産者の対立する需要を調整するのに役立つ。","choices":[{"t":"The establishment of transparent criteria for allocating water during prolonged droughts help authorities reconcile the competing demands of households and agricultural producers within affected regions.","why":"主語の中心は単数の establishment なので、help は helps にする。"},{"t":"Transparent criteria for allocating water during droughts help authorities balance the competing demands of households and agricultural producers by providing clear guidances for difficult decisions.","why":"指針を表す guidance は不可算名詞なので、guidances は guidance にする。"},{"t":"Transparent criteria for allocating water during droughts enable authorities to reconcile the demands of households to those of agricultural producers when available supplies are limited.","why":"「一方を他方と調整する」は reconcile A with B なので、to は with にする。"},{"t":"Transparent allocation criteria allow authorities to respond with greater flexible when balancing the competing water needs of households and agricultural producers during periods of drought.","why":"with greater の後には名詞が必要なので、flexible は flexibility にする。"},{"t":"Transparent criteria for allocating water help authorities reconcile competing demands during droughts, which limited supplies must meet the needs of both households and agricultural producers.","why":"後続節は主語と目的語がそろっており、時を表す関係副詞が必要なので、which は when にする。"},{"t":"Transparent criteria for allocating water during droughts help authorities reconcile the competing demands of households and agricultural producers when available supplies fall short of demand.","why":"正解。複数主語 criteria に help が対応し、reconcile the competing demands と fall short of demand の語法も自然。"}],"answer":5,"point":"criteria は criterion の複数形。reconcile A with B と、完全な節を導く関係副詞 when を確認する。","level":3,"drive":{"ja":"干ばつ時の水の割り当てに関する透明な基準は、当局が家庭と農業生産者の対立する需要を調整するのに役立つ。","en":"Transparent criteria for allocating water during droughts help authorities reconcile the competing demands of households and agricultural producers when available supplies fall short of demand."},"explain":"主語は基準、動詞はhelpで、when節が供給不足の状況。reconcileは需要の調整を論じるのに適する。別の言い方: Clear rules help balance water needs during shortages."},{"id":"p1-error-220","q":"エネルギー費用に関する信頼できる証拠は、政策立案者が効率的な公共建築物を設計するのに役立つ。","q_ja":"エネルギー費用に関する信頼できる証拠は、政策立案者が効率的な公共建築物を設計するのに役立つ。","choices":[{"t":"Reliable evidence about the energy costs of public buildings help policymakers develop designs that use energy efficiently.","why":"主語の中心は不可算名詞の evidence なので、help は helps にする。"},{"t":"Reliable evidence on energy costs helps policymakers design public buildings that use energy more efficiently.","why":"正解。不可算名詞 evidence に helps が対応し、efficiently が動詞 use を修飾している。"},{"t":"Reliable evidences on energy costs enable policymakers to develop public building designs that use energy more efficiently.","why":"判断の根拠を表す evidence は不可算名詞なので、evidences は evidence にする。"},{"t":"By relying of reliable evidence about energy costs, policymakers design public buildings that consume energy more efficiently.","why":"「〜に頼る」は rely on なので、of は on にする。"},{"t":"Reliable evidence about energy costs supports policymakers in designing public buildings that use energy more efficient.","why":"動詞 use を修飾する副詞が必要なので、efficient は efficiently にする。"},{"t":"Reliable evidence on energy costs helps policymakers, which design public buildings, make those buildings more energy efficient.","why":"人である policymakers を受けるので、which は who にする。"}],"answer":1,"point":"根拠を表す evidence は不可算名詞。動詞を修飾するときは efficient ではなく efficiently を使う。","level":1,"drive":{"ja":"エネルギー費用に関する信頼できる証拠は、政策立案者が効率的な公共建築物を設計するのに役立つ。","en":"Reliable evidence on energy costs helps policymakers design public buildings that use energy more efficiently."},"explain":"主語は証拠、動詞はhelpsで、that節が建物を修飾。help＋人＋原形で根拠の有用性を示す。別の言い方: Evidence helps planners design energy-efficient public buildings."}],"ja2en":[{"id":"p1-ja2en-001","q":"再生可能エネルギーへの移行には多額の初期費用がかかるとはいえ、政府はその長期的な環境上の利益を優先すべきだ。","q_ja":"初期費用の大きさを認めたうえで、長期的な環境上の利益を優先するという主張を選ぶ。","choices":[{"t":"Governments should prioritize the transition to renewable energy despite its environmental benefits, which require substantial initial expenditure over the long term.","why":"環境上の利益を譲歩の対象にし、その利益に初期費用がかかるという修飾関係に変えている。"},{"t":"Although governments prioritize the environmental benefits of renewable energy, the transition should depend primarily on its substantial initial costs in the long term.","why":"利益の優先を譲歩節に移し、主張を初期費用に左右されるべきだという内容に変えている。"},{"t":"Although the transition to renewable energy involves substantial initial costs, governments should prioritize its long-term environmental benefits.","why":"正解。although で譲歩（初期費用）を示し、主節で long-term environmental benefits（長期的な環境上の利益）を優先すべきだと述べている。"},{"t":"Governments should prioritize substantial initial expenditure on renewable energy, although the transition depends on environmental benefits achieved over the long term.","why":"優先する対象を利益から支出へ変え、移行が利益に依存するという別の関係を述べている。"},{"t":"Although renewable energy offers environmental benefits in the long term, governments should give priority to the substantial initial costs of the transition.","why":"譲歩節と主節の内容を入れ替え、環境上の利益より初期費用を優先すべきだとしている。"},{"t":"The transition to renewable energy involves substantial initial costs because governments should prioritize the environmental benefits it offers in the long term.","why":"譲歩を因果に変え、利益を優先すべきことが初期費用の原因だとしている。"}],"answer":2,"point":"Although節には認める事情を置き、主節にはそれでも維持する主張を置く。","drive":{"ja":"再生可能エネルギーへの移行には多額の初期費用がかかるとはいえ、政府はその長期的な環境上の利益を優先すべきだ。","en":"Although the transition to renewable energy involves substantial initial costs, governments should prioritize its long-term environmental benefits."},"level":2,"explain":"Although節で費用を認め、主節で政府の判断を示す。shouldは義務より提言を表し、論述の結論に使える。別の言い方: Despite the cost, they should prioritize these benefits."},{"id":"p1-ja2en-002","q":"独立した監督が欠けているため、公的資金が不適切に使われ、その結果、政府への信頼が損なわれている。","q_ja":"監督の欠如、公的資金の不適切な使用、政府への信頼の低下という因果の順序を確認する。","choices":[{"t":"The misuse of public funds has weakened independent oversight, consequently leading to a decline in the level of public trust in government.","why":"公的資金の不適切な使用が監督を弱めたとしており、最初の原因と結果が逆になっている。"},{"t":"Declining public trust in government has encouraged the misuse of public funds, which has consequently resulted in a lack of independent oversight.","why":"信頼の低下を出発点にし、監督の欠如を最終的な結果にして因果の順序を逆転させている。"},{"t":"Public funds have been misused despite independent oversight, consequently weakening public trust in the government responsible for providing supervision to public institutions.","why":"監督が欠けているという原因を、監督があるにもかかわらずという譲歩に変えている。"},{"t":"The lack of independent oversight results from the misuse of public funds, while declining public trust in government is responsible for both.","why":"監督の欠如を不適切な使用の結果とし、さらに信頼の低下を両方の原因にしている。"},{"t":"Independent oversight is lacking because public trust in government has weakened, consequently causing public funds to be misused by the institutions concerned.","why":"信頼の低下を監督の欠如の原因にしており、日本語の因果の順序と異なる。"},{"t":"The lack of independent oversight has led to the misuse of public funds, consequently undermining public trust in government.","why":"正解。監督の欠如を原因、不適切な使用を中間の結果、信頼の低下をその帰結として示している。"}],"answer":5,"point":"A has led to B, consequently doing Cで、原因から結果、さらにその帰結へとつなぐ。","drive":{"ja":"独立した監督が欠けているため、公的資金が不適切に使われ、その結果、政府への信頼が損なわれている。","en":"The lack of independent oversight has led to the misuse of public funds, consequently undermining public trust in government."},"level":3,"explain":"主語は独立した監督の欠如。has led toが現在までの結果を示し、末尾の分詞句が政府への信頼低下という帰結を添える。別の言い方: A lack of independent oversight has resulted in the misuse of public funds, consequently weakening public trust in government."},{"id":"p1-ja2en-003","q":"政府が国家の安全保障を重視するのに対し、人権団体は市民のプライバシーを守る必要性を強調している。","q_ja":"政府と人権団体がそれぞれ重視する対象を対比する。","choices":[{"t":"Whereas the government places emphasis on national security, human rights organizations stress the need to protect citizens' privacy.","why":"正解。政府の安全保障重視と、人権団体のプライバシー保護重視を対比している。"},{"t":"The government emphasizes national security because human rights organizations insist that citizens' privacy needs protection from threats to the nation.","why":"二者の対比を、プライバシー保護の主張が政府の姿勢の原因になるという因果関係に変えている。"},{"t":"Whereas human rights organizations prioritize national security, the government stresses the need to protect the privacy of individual citizens.","why":"対比する二者の主張を入れ替え、人権団体が安全保障を、政府がプライバシーを重視するとしている。"},{"t":"The government stresses the need for national security, thereby prompting human rights organizations to prioritize the protection of citizens' privacy.","why":"対照的な立場を述べるだけでなく、政府の姿勢が人権団体を動かしたという因果を加えている。"},{"t":"While emphasizing national security, the government urges human rights organizations to stress the need to protect the privacy of individual citizens.","why":"分詞構文の主語を政府にし、人権団体が独自に強調している内容を政府からの要請に変えている。"},{"t":"Human rights organizations emphasize privacy protection on condition that the government places sufficient emphasis on national security in its public policies.","why":"対比を条件に変え、政府が安全保障を重視することを人権団体の主張の条件にしている。"}],"answer":0,"point":"Whereas A, Bは二つの立場を対比する形であり、原因や条件を表す形ではない。","drive":{"ja":"政府が国家の安全保障を重視するのに対し、人権団体は市民のプライバシーを守る必要性を強調している。","en":"Whereas the government places emphasis on national security, human rights organizations stress the need to protect citizens' privacy."},"level":2,"explain":"Whereas節と主節で二者を対比する。the need toは必要な行動を示し、主張の要約に使える。別の言い方: The government stresses security; the groups stress privacy."},{"id":"p1-ja2en-004","q":"以上の理由から、政府は地域間の格差を縮めるために公共交通への投資を優先すべきだと結論づけられる。","q_ja":"提示済みの理由から結論を導き、投資の目的を地域間格差の縮小として示す。","choices":[{"t":"In conclusion, regional disparities should be reduced so that the government has reasons to prioritize investment in public transport across the country.","why":"格差の縮小を投資の目的ではなく、政府が投資を優先する理由を得るための手段に変えている。"},{"t":"For these reasons, prioritizing investment in public transport should enable the government to conclude that regional disparities have already been substantially reduced.","why":"政策提言ではなく、投資を優先すれば格差がすでに縮小したと結論づけられるという内容に変えている。"},{"t":"It follows from reducing regional disparities that the government should provide reasons for prioritizing further investment in public transport across the country.","why":"結論の根拠を提示済みの理由から格差の縮小へ変え、政府に理由の提示を求めている。"},{"t":"For these reasons, it can be concluded that the government should prioritize investment in public transport to reduce regional disparities.","why":"正解。理由に基づく結論を示し、格差を縮めるという目的に向けた投資の優先を提言している。"},{"t":"For these reasons, the government should conclude its investment in public transport so that regional disparities can be reduced throughout the country.","why":"concludeの目的語を投資にしているため、結論を出すのではなく投資を終えるという意味になっている。"},{"t":"In conclusion, the government should prioritize reducing regional disparities in order to establish sufficient reasons for investing further in public transport systems.","why":"投資によって格差を縮める関係を逆にし、投資の理由を作るために格差を縮めるとしている。"}],"answer":3,"point":"For these reasonsで結論を導き、to不定詞で提言する施策の目的を示す。","drive":{"ja":"以上の理由から、政府は地域間の格差を縮めるために公共交通への投資を優先すべきだと結論づけられる。","en":"For these reasons, it can be concluded that the government should prioritize investment in public transport to reduce regional disparities."},"level":2,"explain":"itは形式主語で、that節が結論を担う。受動態で客観的に提言し、toで目的を示す。別の言い方: Thus, they should prioritize transit funding to narrow regional gaps."},{"id":"p1-ja2en-005","q":"温室効果ガスの排出量の削減は、将来の世代が負う経済的負担の軽減につながる。","q_ja":"排出量の削減を名詞句の主語とし、将来世代の経済的負担への効果を述べる。","choices":[{"t":"The reduction of greenhouse gas emissions results from the alleviation of the economic burden that future generations will have to bear.","why":"results fromにより、負担の軽減が排出量削減の原因となり、日本語と因果の向きが逆になっている。"},{"t":"The reduction of greenhouse gas emissions contributes to the alleviation of the economic burden that future generations will have to bear.","why":"正解。削減と軽減を名詞化し、排出量削減が将来世代の負担軽減につながる関係を表している。"},{"t":"The reduction of greenhouse gas emissions contributes to alleviate the economic burden that future generations will be required to bear.","why":"contribute toのtoは前置詞なので、後ろにはalleviationやalleviatingが必要であり、alleviateは置けない。"},{"t":"The reducing of greenhouse gas emissions contributes to the alleviate of the economic burden that future generations will have to bear.","why":"the alleviateという名詞句は作れず、動詞alleviateを名詞alleviationにする必要がある。"},{"t":"The alleviation of greenhouse gas emissions contributes to the reduction of future generations that will bear an increasingly substantial economic burden.","why":"削減の対象を排出量から将来の世代へ移し、負担を軽減するという名詞句の関係を崩している。"},{"t":"The economic burden of reducing greenhouse gas emissions contributes to the alleviation of the responsibilities that future generations will have to bear.","why":"主語を排出量の削減から削減に伴う経済的負担へ変え、軽減する対象も経済的負担から責任へ変えている。"}],"answer":1,"point":"The reduction of A contributes to the alleviation of Bのように、動作を名詞化して因果を述べる。","drive":{"ja":"温室効果ガスの排出量の削減は、将来の世代が負う経済的負担の軽減につながる。","en":"The reduction of greenhouse gas emissions contributes to the alleviation of the economic burden that future generations will have to bear."},"level":3,"explain":"削減が主語で、that節は負担を修飾する。contribute toは効果の一因を示し、断定を抑えた論述に使える。別の言い方: Cutting emissions helps ease their financial burden."},{"id":"p1-ja2en-006","q":"もし政府の補助金がなければ、多くの小規模企業は今、環境に優しい技術を導入する余裕がないだろう。","q_ja":"現在の補助金が存在しないと仮定した場合の、現在の企業の資金面への影響を表す。","choices":[{"t":"If government subsidies had been unavailable, many small businesses would have been unable to afford the adoption of environmentally friendly technology.","why":"仮定法過去完了で過去の補助金と過去の導入可能性を述べており、現在の仮定になっていない。"},{"t":"If government subsidies were unavailable now, many small businesses would have been unable to afford environmentally friendly technology in the past.","why":"現在の条件に対して過去の結果を述べており、現在の導入余力についての仮定になっていない。"},{"t":"If many small businesses could not afford environmentally friendly technology, government subsidies would be unavailable to support their adoption of it.","why":"導入する余裕がないことを条件、補助金がないことを結果にし、仮定の条件と帰結を逆転させている。"},{"t":"If government subsidies had been unavailable, many small businesses would now have sufficient resources to adopt environmentally friendly technology without assistance.","why":"条件を過去に移したうえで、現在は導入資金が十分にあるという帰結に変えている。"},{"t":"If it were not for government subsidies, many small businesses would now be unable to afford the adoption of environmentally friendly technology.","why":"正解。If it were not forで現在の補助金がない状況を仮定し、wouldで現在の帰結を述べている。"},{"t":"If government subsidies are withdrawn next year, many small businesses will be unable to afford environmentally friendly technology in the following years.","why":"現在の事実に反する仮定を、来年の補助金廃止を条件とする将来の予測に変えている。"}],"answer":4,"point":"If it were not for A, 主語 would ...で、現在のAがなければどうなるかを仮定する。","drive":{"ja":"もし政府の補助金がなければ、多くの小規模企業は今、環境に優しい技術を導入する余裕がないだろう。","en":"If it were not for government subsidies, many small businesses would now be unable to afford the adoption of environmentally friendly technology."},"level":3,"explain":"If節で現在を仮定し、主節で企業への影響を示す。affordは資金余力を示し、政策の必要性を論じる。別の言い方: Without subsidies, many firms could not afford this technology."},{"id":"p1-ja2en-007","q":"もし自治体が事前に避難計画を更新していたなら、昨年の洪水でこれほど多くの住民が危険にさらされることはなかっただろう。","q_ja":"過去に実行されなかった対策と、過去に生じた被害についての仮定を表す。","choices":[{"t":"If local authorities updated their evacuation plans now, fewer residents would be exposed to danger during floods occurring in the coming years.","why":"昨年の出来事への反実仮想を、現在の更新と将来の洪水についての仮定に変えている。"},{"t":"If fewer residents had been exposed to danger during last year's floods, local authorities would have updated their evacuation plans in advance.","why":"住民が危険にさらされなかったことを条件、計画の事前更新を帰結にして、条件と結果を逆転させている。"},{"t":"Had local authorities updated their evacuation plans beforehand, so many residents would not have been exposed to danger during last year's floods.","why":"正解。Hadで始まる仮定法過去完了とwould not have beenで、昨年の出来事に反する仮定を表している。"},{"t":"Were local authorities to update their evacuation plans next year, so many residents
