<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>英検脳筋トレ</title>
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="英検脳筋トレ">
<meta name="theme-color" content="#ffffff">
<meta name="color-scheme" content="light">
<style>
  /* 令和の上質: 深い藍のグラデーション＋元気のオレンジ。問題文は白地に黒 */
  :root {
    color-scheme: light;
    --bg: #f6f7fb; --card: #ffffff; --ink: #0b1020; --sub: #5d6578; --faint: #9aa1b2; --line: #eceef4;
    --navy1: #141a46; --navy2: #2b3aa8; --indigo: #3b4fd8; --indigo-soft: #eef0ff;
    --orange1: #ff5f3a; --orange2: #ffa41b; --gold: #f5b83d;
    --ok: #12855a; --okbg: #e8f7ef; --ng: #d23b3b; --ngbg: #fdeeee;
    --r: 18px; --shadow: 0 1px 2px rgba(17,24,61,.05), 0 10px 28px rgba(17,24,61,.07);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased; font-feature-settings: "palt"; }
  body { padding-top: env(safe-area-inset-top); }
  button { font-family: inherit; cursor: pointer; }
  svg.ic { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  /* ヘッダー */
  header.bar { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 10px; padding: 10px 16px;
    background: rgba(246,247,251,.82); backdrop-filter: saturate(180%) blur(16px); -webkit-backdrop-filter: saturate(180%) blur(16px); }
  .logo { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; }
  .logo .mark { width: 30px; height: 30px; border-radius: 9px; background: linear-gradient(135deg, var(--navy1), var(--indigo)); color: #fff;
    display: grid; place-items: center; font-weight: 900; font-size: 15px; box-shadow: 0 4px 12px rgba(43,58,168,.35); }
  .logo b { font-size: 16px; font-weight: 800; letter-spacing: .01em; white-space: nowrap; }
  .logo img { height: 42px; width: auto; display: block; }
  /* キャラクター */
  .mascot { position: absolute; right: -6px; bottom: -8px; width: 132px; height: auto; z-index: 1; filter: drop-shadow(0 8px 18px rgba(0,0,0,.35)); pointer-events: none; }
  .hero .goal, .hero .ttl, .hero .hi { position: relative; z-index: 2; }
  .hero .meta { max-width: calc(100% - 210px); }
  .bubble { position: relative; display: inline-block; background: #fff; color: var(--ink); border-radius: 14px; padding: 8px 12px; font-size: 13.5px; font-weight: 700; box-shadow: var(--shadow); }
  .coach { display: flex; align-items: flex-end; gap: 8px; margin: 6px 0 0; }
  .coach img { width: 74px; height: auto; flex: none; }
  /* キャラクター */
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
  @keyframes flex { 0% { transform: scale(1) rotate(0); } 25% { transform: scale(1.14) rotate(-7deg); } 55% { transform: scale(1.1) rotate(7deg); } 100% { transform: scale(1) rotate(0); } }
  @keyframes jump { 0% { transform: translateY(0) scale(1); } 35% { transform: translateY(-16px) scale(1.1); } 70% { transform: translateY(2px) scale(.97); } 100% { transform: translateY(0) scale(1); } }
  @keyframes shake { 0%, 100% { transform: translateX(0) rotate(0); } 20% { transform: translateX(-6px) rotate(-5deg); } 40% { transform: translateX(6px) rotate(5deg); } 60% { transform: translateX(-4px) rotate(-3deg); } 80% { transform: translateX(4px) rotate(3deg); } }
  @keyframes popIn { 0% { transform: scale(.2); opacity: 0; } 70% { transform: scale(1.12); opacity: 1; } 100% { transform: scale(1); } }
  @keyframes evoOut { 0% { transform: scale(1); filter: none; opacity: 1; } 60% { transform: scale(1.1); filter: brightness(4) saturate(0); opacity: 1; } 100% { transform: scale(.6); filter: brightness(6); opacity: 0; } }
  @keyframes evoIn { 0% { transform: scale(.4); filter: brightness(6); opacity: 0; } 55% { transform: scale(1.18); filter: brightness(2.4); opacity: 1; } 100% { transform: scale(1); filter: none; opacity: 1; } }
  @keyframes rays { from { transform: rotate(0); } to { transform: rotate(360deg); } }
  .chara { display: block; width: 100%; height: auto; user-select: none; -webkit-user-drag: none; }
  .hero .chara-wrap { position: absolute; right: 0; bottom: 8px; width: 116px; z-index: 1; cursor: pointer; }
  .hero .chara-wrap .chara { animation: bob 2.6s ease-in-out infinite; filter: drop-shadow(0 10px 16px rgba(0,0,0,.35)); }
  .chara.flex { animation: flex .7s ease-in-out !important; }
  .hero .say { position: absolute; right: 12px; top: 12px; z-index: 3; max-width: 190px; background: #fff; color: var(--ink); font-size: 12.5px; font-weight: 800;
    border-radius: 14px 14px 4px 14px; padding: 7px 10px; box-shadow: 0 6px 18px rgba(0,0,0,.25); animation: popIn .3s ease-out; }
  .xpbar { position: relative; z-index: 2; margin-top: 14px; max-width: calc(100% - 118px); }
  .xpbar .lab { display: flex; justify-content: space-between; font-size: 11.5px; font-weight: 800; opacity: .9; margin-bottom: 4px; }
  .xpbar .tr { height: 8px; border-radius: 4px; background: rgba(255,255,255,.18); overflow: hidden; }
  .xpbar .tr i { display: block; height: 100%; border-radius: 4px; background: linear-gradient(90deg, #ffd23f, #ff7a3a); transition: width .8s ease-out; }
  .react { width: 46px; flex: none; margin: -6px 0 -6px -4px; }
  .react .chara.jump { animation: jump .6s ease-out; }
  .react .chara.shake { animation: shake .5s ease-in-out; }
  .gain { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 6px 0 2px; font-weight: 900; color: var(--orange1); font-size: 18px; }
  .lvup { text-align: center; font-weight: 900; font-size: 17px; color: var(--navy2); background: linear-gradient(90deg, #fff3d6, #ffe0c2, #fff3d6); border-radius: 14px; padding: 10px; margin: 8px 0; animation: popIn .4s ease-out; }
  .evo { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; text-align: center; color: #fff;
    background: radial-gradient(circle at 50% 42%, #3b4fd8 0%, #141a46 60%, #070a1f 100%); padding: 24px; }
  .evo .rays { position: absolute; left: 50%; top: 40%; width: 760px; height: 760px; margin: -380px 0 0 -380px; opacity: .35;
    background: repeating-conic-gradient(from 0deg, rgba(255,196,60,.9) 0deg 6deg, transparent 6deg 20deg); border-radius: 50%; animation: rays 14s linear infinite;
    -webkit-mask-image: radial-gradient(circle, #000 15%, transparent 70%); mask-image: radial-gradient(circle, #000 15%, transparent 70%); }
  .evo .stage { position: relative; width: 240px; height: 240px; margin: 0 auto; }
  .evo .stage img { position: absolute; inset: 0; }
  .evo .old { animation: evoOut 1.1s ease-in forwards; }
  .evo .new { opacity: 0; animation: evoIn 1s ease-out 1s forwards; }
  .evo h3 { position: relative; font-size: 24px; margin: 18px 0 4px; }
  .evo p { position: relative; margin: 0 0 18px; opacity: .85; }
  .evo .big { position: relative; max-width: 320px; margin: 0 auto; }
  .stages { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; text-align: center; font-size: 10.5px; font-weight: 700; color: var(--sub); }
  .stages .lock .chara { filter: brightness(0) opacity(.18); }
  .stages .now { color: var(--orange1); }
  .stages .now .chara { animation: bob 2.6s ease-in-out infinite; }
  .pick { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 10px; }
  .pick button { border: 2px solid transparent; background: #fff; border-radius: 16px; padding: 8px 6px; box-shadow: var(--shadow); font-size: 12.5px; font-weight: 800; color: var(--ink); }
  .pick button.on { border-color: var(--indigo); background: var(--indigo-soft); }
  /* 読み上げボタン */
  .spk { display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; border: 0; flex: none;
    background: var(--indigo-soft); color: var(--indigo); vertical-align: middle; margin-left: 6px; }
  .spk svg { width: 18px; height: 18px; }
  .spk.playing { background: var(--indigo); color: #fff; }
  .qhead { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .choice .spk { width: 30px; height: 30px; margin: -2px -4px 0 0; }
  .gsw { display: flex; background: #e9ebf3; border-radius: 999px; padding: 3px; }
  .gsw button { border: 0; background: transparent; color: var(--sub); font-size: 12.5px; font-weight: 700; padding: 6px 11px; border-radius: 999px; }
  .gsw button.on { background: #fff; color: var(--ink); box-shadow: 0 1px 4px rgba(17,24,61,.15); }
  .streak { display: flex; align-items: center; gap: 2px; font-weight: 800; color: var(--orange1); font-size: 15px; white-space: nowrap; }
  .streak svg { width: 18px; height: 18px; fill: url(#flameG); stroke: none; }
  main { max-width: 640px; margin: 0 auto; padding: 6px 16px calc(104px + env(safe-area-inset-bottom)); }
  /* メニューバー（すりガラス） */
  nav.tabs { position: fixed; left: 12px; right: 12px; bottom: calc(10px + env(safe-area-inset-bottom)); z-index: 10; max-width: 616px; margin: 0 auto;
    display: flex; padding: 6px; border-radius: 24px; background: rgba(255,255,255,.86);
    backdrop-filter: saturate(180%) blur(18px); -webkit-backdrop-filter: saturate(180%) blur(18px); box-shadow: 0 8px 30px rgba(17,24,61,.14); border: 1px solid rgba(255,255,255,.7); }
  nav.tabs button { flex: 1; border: 0; background: transparent; color: var(--faint); font-size: 10.5px; font-weight: 700; padding: 6px 0 4px;
    display: flex; flex-direction: column; align-items: center; gap: 2px; border-radius: 18px; transition: color .2s, background .2s; }
  nav.tabs button.on { color: var(--indigo); background: var(--indigo-soft); }
  h2 { font-size: 13px; letter-spacing: .08em; margin: 22px 2px 10px; color: var(--sub); font-weight: 800; }
  .card { background: var(--card); border-radius: var(--r); padding: 16px; margin: 12px 0; box-shadow: var(--shadow); }
  /* 切り替え（スライドする白い枠） */
  .seg { display: flex; background: #e9ebf3; border-radius: 14px; padding: 4px; margin-top: 10px; }
  .seg button { flex: 1; border: 0; background: transparent; color: var(--sub); font-size: 14px; font-weight: 700; padding: 10px 4px; border-radius: 11px; transition: all .2s; }
  .seg button.on { background: #fff; color: var(--ink); box-shadow: 0 1px 4px rgba(17,24,61,.14); }
  /* ボタン */
  .big { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; border: 0; border-radius: 18px; padding: 17px; font-size: 17.5px; font-weight: 800;
    letter-spacing: .02em; color: #fff; margin: 12px 0; background: linear-gradient(135deg, var(--orange1), var(--orange2));
    box-shadow: 0 10px 24px rgba(255,95,58,.32), inset 0 1px 0 rgba(255,255,255,.25); transition: transform .08s; }
  .big:active { transform: scale(.98); }
  .big.navy { background: linear-gradient(135deg, var(--navy1), var(--navy2)); box-shadow: 0 10px 24px rgba(43,58,168,.3); }
  .big.sub { background: #fff; color: var(--indigo); box-shadow: var(--shadow); }
  .big:disabled { opacity: .45; box-shadow: none; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .grid .big { margin: 0; }
  /* 種類のタイル */
  .tile { position: relative; background: #fff; border: 0; border-radius: var(--r); padding: 14px; text-align: left; color: var(--ink); font-size: 13px; box-shadow: var(--shadow); }
  .tile .ti { width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center; margin-bottom: 8px; color: #fff; }
  .tile .ti svg { width: 18px; height: 18px; }
  .tile b { display: block; font-size: 15.5px; font-weight: 800; margin-bottom: 3px; }
  .tile small { color: var(--sub); line-height: 1.5; }
  .tile:disabled { opacity: .5; }
  .barl { height: 6px; border-radius: 3px; background: #eef0f5; margin-top: 8px; overflow: hidden; }
  .barl i { display: block; height: 100%; border-radius: 3px; background: linear-gradient(90deg, #22c38e, #12855a); }
  /* 出題 */
  .top { display: flex; align-items: center; gap: 10px; margin: 4px 0 8px; color: var(--sub); font-size: 13.5px; font-weight: 700; }
  .top button { border: 0; background: #fff; color: var(--indigo); font-size: 14px; font-weight: 700; padding: 7px 12px; border-radius: 999px; box-shadow: var(--shadow); }
  .top .grow { flex: 1; text-align: center; }
  .progress { height: 6px; border-radius: 3px; background: #e6e8f0; overflow: hidden; margin: 0 0 12px; }
  .progress i { display: block; height: 100%; background: linear-gradient(90deg, var(--indigo), #7c8cff); border-radius: 3px; transition: width .3s; }
  .q { white-space: pre-wrap; font-size: 18.5px; line-height: 1.65; color: var(--ink); font-weight: 500; }
  .qja { color: var(--sub); font-size: 14px; margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line); }
  .label { font-size: 12.5px; color: var(--sub); margin-bottom: 8px; font-weight: 600; }
  .choice { display: flex; gap: 12px; align-items: flex-start; width: 100%; text-align: left; border: 1.5px solid transparent; background: #fff;
    color: var(--ink); border-radius: 16px; padding: 14px; margin: 10px 0; font-size: 16px; line-height: 1.55; box-shadow: var(--shadow); transition: transform .08s; }
  .choice:active { transform: scale(.99); }
  .choice .lt { flex: none; width: 26px; height: 26px; border-radius: 8px; background: #eef0f6; color: var(--sub); font-size: 13px; font-weight: 800; display: grid; place-items: center; margin-top: 1px; }
  .choice .ct { flex: 1; }
  .choice.ok { border-color: var(--ok); background: var(--okbg); }
  .choice.ok .lt { background: var(--ok); color: #fff; }
  .choice.ng { border-color: var(--ng); background: var(--ngbg); }
  .choice.ng .lt { background: var(--ng); color: #fff; }
  .choice .why { display: none; font-size: 13.5px; color: var(--sub); margin-top: 6px; }
  .answered .choice .why { display: block; }
  .point { display: flex; gap: 10px; align-items: flex-start; padding: 14px; background: #fff; border-radius: 16px; margin: 14px 0; box-shadow: var(--shadow); font-size: 15px; line-height: 1.6; }
  .point .vd { flex: none; font-weight: 900; font-size: 13px; color: #fff; border-radius: 8px; padding: 3px 8px; background: var(--ok); }
  .point .vd.ng { background: var(--ng); }
  .explain { background: linear-gradient(180deg, #fffaf0, #fff6e3); border: 1px solid #f6e3b8; border-radius: 16px; padding: 14px 16px; margin: 14px 0; font-size: 15px; line-height: 1.7; }
  .explain .eh { display: flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 800; color: #9a6700; margin-bottom: 6px; letter-spacing: .05em; }
  .explain .en { font-weight: 700; margin-bottom: 4px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(0, 1fr)); gap: 10px; margin: 12px 0; }
  .stats > div { background: #fff; border-radius: 16px; padding: 12px 6px; text-align: center; box-shadow: var(--shadow); }
  .stats small { display: block; color: var(--sub); font-size: 11.5px; line-height: 1.4; font-weight: 600; }
  .stats b { display: block; font-size: 21px; margin: 2px 0; font-weight: 900; font-variant-numeric: tabular-nums; }
  .timer { font-variant-numeric: tabular-nums; min-width: 76px; text-align: right; }
  .timer.over { color: var(--ng); }
  .lv { display: inline-block; font-size: 10.5px; font-weight: 900; color: #fff; background: linear-gradient(135deg, var(--navy1), var(--indigo)); border-radius: 6px; padding: 2px 7px; margin-right: 4px; letter-spacing: .04em; }
  .blank { color: var(--indigo); }
  .mark { color: var(--indigo); background: var(--indigo-soft); border-radius: 5px; padding: 0 4px; font-weight: 700; }
  .ans { width: 100%; font-size: 18px; padding: 14px; border: 1.5px solid var(--line); border-radius: 14px; background: #fff; color: var(--ink); font-family: inherit; outline: none; }
  .ans:focus { border-color: var(--indigo); box-shadow: 0 0 0 4px rgba(59,79,216,.12); }
  .ans:disabled { opacity: .7; }
  .result { font-size: 46px; font-weight: 900; text-align: center; margin: 10px 0 2px; letter-spacing: -.01em; }
  .muted { color: var(--sub); font-size: 13.5px; line-height: 1.6; }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 12px 0; border-bottom: 1px solid var(--line); font-size: 15px; font-weight: 600; }
  .row:last-child { border-bottom: 0; }
  .setrow { padding: 12px 0; border-bottom: 1px solid var(--line); }
  .setrow:last-child { border-bottom: 0; }
  .setrow > span { display: block; font-size: 14.5px; font-weight: 700; margin-bottom: 8px; }
  .chips { display: flex; flex-wrap: wrap; gap: 7px; }
  .chips button { border: 1.5px solid var(--line); background: #fff; color: var(--ink); font-size: 14px; font-weight: 700; padding: 8px 14px; border-radius: 999px; }
  .chips button.on { border-color: transparent; color: #fff; background: linear-gradient(135deg, var(--navy1), var(--indigo)); box-shadow: 0 4px 12px rgba(43,58,168,.25); }
  .vlist button { display: flex; width: 100%; justify-content: space-between; align-items: center; gap: 8px; text-align: left; border: 0; background: transparent; padding: 11px 2px;
    border-bottom: 1px solid var(--line); font-size: 14.5px; color: var(--ink); }
  .vlist button small { color: var(--sub); font-size: 12px; }
  .vlist button.on { color: var(--indigo); font-weight: 800; }
  .vlist button .ck { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line); flex: none; }
  .vlist button.on .ck { border-color: var(--indigo); background: radial-gradient(circle, var(--indigo) 45%, transparent 50%); }
  .footer { position: fixed; left: 0; right: 0; bottom: 0; z-index: 12; padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    background: linear-gradient(rgba(246,247,251,0), var(--bg) 35%); }
  .footer .big, .footer .grid { max-width: 608px; margin: 0 auto; }
  body.quiz nav.tabs { display: none; }
  /* ホームのヒーロー */
  .hero { position: relative; overflow: hidden; border-radius: 26px; padding: 20px; margin: 8px 0 4px; color: #fff;
    background: radial-gradient(120% 90% at 100% 0%, #5161ff 0%, rgba(81,97,255,0) 55%), linear-gradient(140deg, var(--navy1) 0%, #232c87 55%, var(--navy2) 100%);
    box-shadow: 0 18px 40px rgba(20,26,70,.35); }
  .hero::after { content: none; position: absolute; right: -40px; bottom: -60px; width: 200px; height: 200px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,164,27,.35), rgba(255,164,27,0) 70%); }
  .hero .hi { font-size: 13px; opacity: .8; font-weight: 700; letter-spacing: .06em; }
  .hero .ttl { font-size: 22px; font-weight: 900; margin: 4px 0 14px; letter-spacing: .01em; }
  .hero .goal { display: flex; align-items: center; gap: 16px; position: relative; z-index: 1; }
  .hero .meta { display: grid; gap: 6px; font-size: 13px; }
  .hero .meta div { display: flex; align-items: center; gap: 6px; opacity: .95; }
  .hero .meta b { font-size: 18px; font-weight: 900; font-variant-numeric: tabular-nums; }
  .ring { width: 96px; height: 96px; flex: none; }
  .action { display: flex; align-items: center; gap: 14px; width: 100%; border: 0; text-align: left; background: #fff; border-radius: var(--r);
    padding: 14px 16px; margin: 12px 0; box-shadow: var(--shadow); color: var(--ink); }
  .action .ai { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; color: #fff; flex: none;
    background: linear-gradient(135deg, var(--navy1), var(--indigo)); box-shadow: 0 6px 16px rgba(43,58,168,.3); }
  .action b { display: block; font-size: 16px; font-weight: 800; }
  .action small { color: var(--sub); font-size: 12.5px; }
  .action .go { margin-left: auto; color: var(--faint); }
  .reco { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 14.5px; }
  .reco:last-child { border-bottom: 0; }
  .reco .rl { display: flex; align-items: center; gap: 10px; }
  .reco .dot { width: 30px; height: 30px; border-radius: 10px; display: grid; place-items: center; color: #fff; flex: none; }
  .reco .dot svg { width: 16px; height: 16px; }
  .reco button { border: 0; background: var(--indigo-soft); color: var(--indigo); border-radius: 999px; padding: 8px 14px; font-size: 13.5px; font-weight: 800; white-space: nowrap; }
  .reco button:disabled { opacity: .4; }
  /* 成績 */
  .cal { display: grid; grid-template-rows: repeat(7, 1fr); grid-auto-flow: column; gap: 4px; }
  .cal i { width: 100%; aspect-ratio: 1; border-radius: 4px; background: #eef0f5; }
  .cal i.l1 { background: #c7cffd; } .cal i.l2 { background: #7383f5; } .cal i.l3 { background: var(--navy2); }
  .cal i.today { outline: 2px solid var(--orange1); outline-offset: 1px; }
  .badges { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .badge { text-align: center; padding: 12px 4px; border-radius: 16px; background: #fff; font-size: 12px; box-shadow: var(--shadow); }
  .badge i { display: grid; place-items: center; width: 48px; height: 48px; margin: 0 auto 6px; border-radius: 50%; font-style: normal; font-size: 24px;
    background: #f1f2f6; filter: grayscale(1); opacity: .45; }
  .badge.got i { filter: none; opacity: 1; background: radial-gradient(circle at 30% 30%, #fff6d8, #ffd66b); box-shadow: 0 4px 12px rgba(245,184,61,.45); }
  .badge b { font-weight: 800; }
  .badge small { display: block; color: var(--sub); font-size: 10.5px; margin-top: 2px; }
  table.t { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  table.t td, table.t th { padding: 8px 4px; border-bottom: 1px solid var(--line); text-align: right; font-variant-numeric: tabular-nums; }
  table.t th { color: var(--sub); font-size: 12px; }
  table.t td:first-child, table.t th:first-child { text-align: left; font-weight: 700; }
  /* コツ */
  .tip h3 { display: flex; align-items: center; gap: 8px; font-size: 16px; margin: 0 0 6px; font-weight: 800; }
  .tip h3 .dot { width: 8px; height: 8px; border-radius: 50%; background: linear-gradient(135deg, var(--orange1), var(--orange2)); }
  .tip p, .tip li { font-size: 15px; line-height: 1.75; }
  .tip ul { padding-left: 20px; margin: 6px 0; }
  .tip code { background: var(--indigo-soft); color: var(--navy2); border-radius: 6px; padding: 1px 6px; font-family: inherit; font-weight: 700; }
  .toast { position: fixed; left: 50%; top: calc(14px + env(safe-area-inset-top)); transform: translateX(-50%); z-index: 30; white-space: nowrap;
    background: linear-gradient(135deg, var(--navy1), var(--navy2)); color: #fff; border-radius: 999px; padding: 11px 18px; font-size: 14.5px; font-weight: 700; box-shadow: 0 10px 30px rgba(20,26,70,.35); }
  /* 音声入力回答モード（暗い画面にして運転中のまぶしさを抑える） */
  .drive { position: fixed; inset: 0; z-index: 40; color: #fff; display: flex; flex-direction: column;
    background: radial-gradient(120% 70% at 50% 0%, #1e2670, #070a1f 70%);
    padding: calc(20px + env(safe-area-inset-top)) 22px calc(22px + env(safe-area-inset-bottom)); }
  .drive .phase { font-size: 15px; color: #9fb0ff; font-weight: 800; letter-spacing: .08em; }
  .drive .text { flex: 1; display: flex; flex-direction: column; justify-content: center; font-size: 25px; line-height: 1.55; font-weight: 600; }
  .drive .heard { font-size: 18px; color: var(--gold); margin-top: 16px; min-height: 1.5em; }
  .drive .stop { border: 0; border-radius: 22px; font-size: 24px; font-weight: 900; padding: 24px; color: #fff; background: linear-gradient(135deg, #ef4444, #b91c1c); box-shadow: 0 12px 30px rgba(239,68,68,.35); }
  .drive .sst { text-align: center; color: #7f8bb8; font-size: 12.5px; margin-top: 10px; }
  .drive .count { text-align: center; color: #9fb0ff; margin-bottom: 12px; font-weight: 700; }
</style>

<script>
const DATA = {"2":{"collocation":[{"id":"g2-collocation-001","q":"Too much noise can ___ a negative effect on students who are trying to study.","q_ja":"大きすぎる騒音は、勉強しようとしている生徒に悪い影響を与えることがあります。","choices":[{"t":"do","why":"影響を与えるという意味では do an effect ではなく have an effect を使う。"},{"t":"make","why":"この表現では make a negative effect on ではなく have a negative effect on を使う。"},{"t":"have","why":"正解。have a negative effect on ... で、悪い影響を与える対象を示す。"},{"t":"take","why":"take an effect on という組み合わせでは、影響を与える意味を表せない。"}],"answer":2,"point":"have a negative effect on ... で「〜に悪い影響を与える」。","drive":{"ja":"大きすぎる騒音は、勉強しようとしている生徒に悪い影響を与えることがあります。","en":"Too much noise can have a negative effect on students who are trying to study."},"level":2,"explain":"Too much noiseが主語で、can have a negative effect onは悪影響を及ぼす可能性を表す。who are trying to studyはstudentsを修飾し、影響を受ける生徒を限定する。別の言い方: Too much noise can negatively affect students who are trying to study."},{"id":"g2-collocation-002","q":"The town needs a new plan to ___ the problem of illegal parking.","q_ja":"その町には、違法駐車の問題を解決するための新しい計画が必要です。","choices":[{"t":"solve","why":"正解。solve the problem で、その問題を解決することを表す。"},{"t":"reply","why":"reply は返答するという意味で、reply the problem とは言わない。"},{"t":"arrive","why":"arrive は到着するという意味で、問題を目的語に取れない。"},{"t":"spend","why":"spend は時間やお金を使うときの動詞で、問題を解決する意味にはならない。"}],"answer":0,"point":"solve a problem で「問題を解決する」。","drive":{"ja":"その町には、違法駐車の問題を解決するための新しい計画が必要です。","en":"The town needs a new plan to solve the problem of illegal parking."},"level":1,"explain":"The townが主語、needsが動詞、a new planが目的語となる。to solve the problem of illegal parkingは、新しい計画が違法駐車の問題を解決するためのものであることを示す。別の言い方: The town needs a new plan to resolve the issue of illegal parking."},{"id":"g2-collocation-003","q":"Taking short breaks can ___ stress during a busy school day.","q_ja":"忙しい学校生活の中で短い休憩を取ることは、ストレスを減らすのに役立ちます。","choices":[{"t":"attend","why":"attend は会議などに出席するという意味で、ストレスとは組み合わせない。"},{"t":"borrow","why":"borrow は物などを借りるという意味で、ストレスを減らすことを表さない。"},{"t":"repair","why":"repair は壊れた物などを修理する動詞で、ストレスを減らす意味には使わない。"},{"t":"reduce","why":"正解。reduce stress で、ストレスを減らすことを表す。"}],"answer":3,"point":"reduce stress は、健康や生活習慣の利点を説明するときに使える。","drive":{"ja":"忙しい学校生活の中で短い休憩を取ることは、ストレスを減らすのに役立ちます。","en":"Taking short breaks can reduce stress during a busy school day."},"level":1,"explain":"Taking short breaksという動名詞句が主語で、can reduce stressはストレスを軽減できることを表す。during a busy school dayは、その効果が生じる場面を示す。別の言い方: Taking short breaks can relieve stress during a busy school day."},{"id":"g2-collocation-004","q":"Students should ___ attention to the sources of information they find online.","q_ja":"生徒は、インターネットで見つけた情報の出所に注意を払うべきです。","choices":[{"t":"spend","why":"注意を払うという表現では spend attention to は使わない。"},{"t":"pay","why":"正解。pay attention to ... で、注意すべき対象を示す。"},{"t":"cost","why":"cost は費用などがかかるという意味で、この組み合わせには使わない。"},{"t":"buy","why":"buy は買うという意味で、注意を払うという表現には使わない。"}],"answer":1,"point":"pay attention to ... で「〜に注意を払う」。","drive":{"ja":"生徒は、インターネットで見つけた情報の出所に注意を払うべきです。","en":"Students should pay attention to the sources of information they find online."},"level":1,"explain":"Studentsが主語で、should pay attention toは注意を払うべきだという提言を表す。the sources of information they find onlineが注意の対象で、they find onlineは関係代名詞が省略された関係節。別の言い方: Students should be attentive to the sources of information they find online."},{"id":"g2-collocation-005","q":"Students should ___ a decision about their future based on reliable information.","q_ja":"生徒は、信頼できる情報に基づいて自分の将来について決定を下すべきだ。","choices":[{"t":"do","why":"do a decision とは言わず、決定を下すときは make を使う。"},{"t":"perform","why":"perform は演技や作業などに使い、a decision とは組み合わせない。"},{"t":"make","why":"正解。make a decision で、決定を下すことを表す。"},{"t":"build","why":"build は建物などを造るときに使い、この文では決定を下す意味にならない。"}],"answer":2,"point":"make a decision based on ... で「〜に基づいて決定を下す」。","drive":{"ja":"生徒は、信頼できる情報に基づいて自分の将来について決定を下すべきだ。","en":"Students should make a decision about their future based on reliable information."},"level":1,"explain":"Studentsが主語で、should make a decisionは判断すべきだという提言を表す。about their futureが判断する内容、based on reliable informationが判断の根拠を示す。別の言い方: Students should use reliable information to make a decision about their future."},{"id":"g2-collocation-006","q":"Using both sides of each sheet can help schools ___ the amount of paper they throw away.","q_ja":"紙の両面を使うことは、学校が捨てる紙の量を減らすのに役立ちます。","choices":[{"t":"invite","why":"invite は人などを招く動詞で、紙の量を目的語にして使わない。"},{"t":"attend","why":"attend は行事などに出席する意味で、量を減らす意味にはならない。"},{"t":"lend","why":"lend は貸すという意味で、捨てる紙の量とは組み合わせない。"},{"t":"reduce","why":"正解。reduce the amount of ... で、量を減らすことを表す。"}],"answer":3,"point":"reduce the amount of ... は、ごみや資源の量を減らす話で使える。","drive":{"ja":"紙の両面を使うことは、学校が捨てる紙の量を減らすのに役立ちます。","en":"Using both sides of each sheet can help schools reduce the amount of paper they throw away."},"level":2,"explain":"Using both sides of each sheetが主語で、can help schools reduceは学校による削減を助けられることを表す。they throw awayはpaperを修飾し、削減対象が学校の捨てる紙の量であることを示す。別の言い方: Using both sides of each sheet can help schools cut down on the amount of paper they throw away."},{"id":"g2-collocation-007","q":"Local volunteers can ___ an important role in keeping parks clean.","q_ja":"地域のボランティアは、公園をきれいに保つ上で重要な役割を果たせます。","choices":[{"t":"play","why":"正解。play an important role in ... で、重要な役割を果たす場面を示す。"},{"t":"do","why":"役割を果たすという表現では do a role ではなく play a role を使う。"},{"t":"make","why":"make a role では、この文の「役割を果たす」を表せない。"},{"t":"carry","why":"carry a role という組み合わせでは、役割を果たす意味にならない。"}],"answer":0,"point":"play an important role in ... の in の後には名詞や動名詞を置く。","drive":{"ja":"地域のボランティアは、公園をきれいに保つ上で重要な役割を果たせます。","en":"Local volunteers can play an important role in keeping parks clean."},"level":1,"explain":"Local volunteersが主語で、can play an important roleは重要な役割を果たせることを表す。in keeping parks cleanが活動内容を示し、keep＋目的語＋形容詞で公園を清潔な状態に保つことを述べる。別の言い方: Local volunteers can make an important contribution to keeping parks clean."},{"id":"g2-collocation-008","q":"Students who volunteer regularly can gain valuable ___ outside the classroom.","q_ja":"定期的にボランティア活動をする生徒は、教室の外で貴重な経験を積めます。","choices":[{"t":"experienced","why":"experienced は形容詞で、valuable の後に必要な名詞ではない。"},{"t":"experience","why":"正解。gain valuable experience で、貴重な経験を積むことを表す。"},{"t":"experiencing","why":"experiencing は、ここでは経験の蓄積を表す名詞として使えない。"},{"t":"experiential","why":"experiential は経験に基づくという意味の形容詞で、目的語の名詞にならない。"}],"answer":1,"point":"gain experience で「経験を積む」。経験の蓄積を表す experience は通常数えない。","drive":{"ja":"定期的にボランティア活動をする生徒は、教室の外で貴重な経験を積めます。","en":"Students who volunteer regularly can gain valuable experience outside the classroom."},"level":2,"explain":"Students who volunteer regularlyが主語で、who節が生徒を限定する。can gain valuable experienceは貴重な経験を得られることを表し、outside the classroomがその場所を示す。別の言い方: Students who volunteer regularly can acquire valuable experience outside the classroom."},{"id":"g2-collocation-009","q":"Community events can help residents build strong ___ with their neighbors.","q_ja":"地域の行事は、住民が近所の人々と強いつながりを築くのに役立ちます。","choices":[{"t":"relate","why":"relate は動詞で、strong の後に必要な名詞ではない。"},{"t":"related","why":"related は形容詞や過去分詞で、築くものを表す名詞にならない。"},{"t":"relationships","why":"正解。build strong relationships with ... で、相手と強いつながりを築くことを表す。"},{"t":"relational","why":"relational は形容詞で、build の目的語になる名詞ではない。"}],"answer":2,"point":"build relationships with ... で、人との関係を築くことを表す。","drive":{"ja":"地域の行事は、住民が近所の人々と強いつながりを築くのに役立ちます。","en":"Community events can help residents build strong relationships with their neighbors."},"level":2,"explain":"Community eventsが主語で、can help residents buildは住民の関係づくりを助けられることを表す。strong relationshipsが築く関係の性質、with their neighborsが関係を築く相手を示す。別の言い方: Community events can help residents form strong bonds with their neighbors."},{"id":"g2-collocation-010","q":"Schools can ___ awareness of food waste by showing students how much food is left after lunch.","q_ja":"学校は、昼食後にどれだけ食べ物が残るかを生徒に示すことで、食品の無駄への意識を高められます。","choices":[{"t":"rise","why":"rise は自動詞なので、awareness を目的語に取れない。"},{"t":"grow up","why":"grow up は成長するという意味で、awareness を目的語に取れない。"},{"t":"stand","why":"stand awareness という組み合わせでは、意識を高める意味にならない。"},{"t":"raise","why":"正解。raise awareness of ... で、意識を高める対象を示す。"}],"answer":3,"point":"raise awareness of ... で「〜への意識を高める」。","drive":{"ja":"学校は、昼食後にどれだけ食べ物が残るかを生徒に示すことで、食品の無駄への意識を高められます。","en":"Schools can raise awareness of food waste by showing students how much food is left after lunch."},"level":2,"explain":"Schoolsが主語で、can raise awareness of food wasteは食品廃棄への意識を高められることを表す。by showing以下が手段を示し、how much food is left after lunchが生徒に見せる内容を表す。別の言い方: Schools can increase awareness of food waste by showing students how much food is left after lunch."},{"id":"g2-collocation-201","q":"Students must ___ the safety rules during science lessons.","q_ja":"生徒は理科の授業中、安全規則を守らなければならない。","choices":[{"t":"attend","why":"授業などに出席するという意味で、規則を守るとは言えない。"},{"t":"follow","why":"正解。follow the rules で「規則を守る」という組み合わせになる。"},{"t":"join","why":"活動や団体に加わるという意味で、規則を守るとは言えない。"},{"t":"enter","why":"場所に入ったり大会に参加したりする語で、規則を守る意味にはならない。"}],"answer":1,"point":"follow the rules で「規則を守る」。安全規則や学校の規則にも使える。","level":1,"drive":{"ja":"生徒は理科の授業中、安全規則を守らなければならない。規則を守る、の動詞を答えてください。","en":"Students must follow the safety rules during science lessons."},"explain":"主語はStudents、must＋動詞で義務を述べ、during以下は時を示す。follow the rulesは規則を守る行為を表し、安全対策の提言に使える。別の言い方: obey the safety rules"},{"id":"g2-collocation-202","q":"Community leaders hope to ___ an agreement on the location of a new park.","q_ja":"地域の代表者たちは、新しい公園の場所について合意に達することを望んでいる。","choices":[{"t":"come","why":"合意に達するなら come to an agreement とし、to が必要。"},{"t":"arrive","why":"合意に達するなら arrive at an agreement とし、at が必要。"},{"t":"agree","why":"agree の直後に an agreement を置いて、合意に達するとは言えない。"},{"t":"reach","why":"正解。reach an agreement で「合意に達する」となり、前置詞は不要。"}],"answer":3,"point":"reach an agreement は前置詞なしで「合意に達する」。","level":2,"drive":{"ja":"地域の代表者たちは、新しい公園の場所について合意に達することを望んでいる。合意に達する、の動詞を答えてください。","en":"Community leaders hope to reach an agreement on the location of a new park."},"explain":"主語はCommunity leadersで、hopeの後の不定詞が希望の内容を示す。reach an agreement onは合意する論点を示せるため、協議結果の要約に使える。別の言い方: come to an agreement on"},{"id":"g2-collocation-203","q":"Local farms cannot ___ the growing demand for fresh vegetables without hiring more workers.","q_ja":"地元の農場は、働く人を増やさなければ、生鮮野菜への高まる需要に応えられない。","choices":[{"t":"meet","why":"正解。meet the demand で、必要とされる量を供給して「需要に応える」という意味になる。"},{"t":"respond","why":"需要に対応するなら respond to the demand とし、to が必要。"},{"t":"cope","why":"需要に対処するなら cope with the demand とし、with が必要。"},{"t":"correspond","why":"対応するという意味では correspond to とするため、この形では需要を目的語に取れない。"}],"answer":0,"point":"meet は人に会う意味だけでなく、需要や条件を満たす意味でも使う。","level":3,"drive":{"ja":"地元の農場は、働く人を増やさなければ、生鮮野菜への高まる需要に応えられない。需要に応える、の動詞を答えてください。","en":"Local farms cannot meet the growing demand for fresh vegetables without hiring more workers."},"explain":"主語はLocal farms、cannot meetで不可能を述べ、without以下が欠ける条件を示す。meet demandは供給の充足を表し、人員増の必要性を論じるのに使える。別の言い方: satisfy demand"},{"id":"g2-collocation-204","q":"Companies should ___ their promises to customers about product quality.","q_ja":"企業は製品の品質について顧客にした約束を守るべきだ。","choices":[{"t":"speak","why":"言語を話す場合などに使い、約束を守る意味では promises と組み合わせない。"},{"t":"tell","why":"人に伝えるという意味で、約束を守る意味にはならない。"},{"t":"keep","why":"正解。keep one's promises で「約束を守る」という意味になる。"},{"t":"say","why":"言葉を口にするという意味で、約束を実行して守る意味にはならない。"}],"answer":2,"point":"keep a promise は「約束を守る」。約束が複数なら promises にする。","level":1,"drive":{"ja":"企業は製品の品質について顧客にした約束を守るべきだ。約束を守る、の動詞を答えてください。","en":"Companies should keep their promises to customers about product quality."},"explain":"主語はCompanies、should＋動詞で望ましい行動を述べる。keep promisesは約束の実行を表し、toで相手、aboutで内容を添えて企業の責任を論じられる。別の言い方: honor their promises"},{"id":"g2-collocation-205","q":"Students should not ___ conclusions from a single online article without checking other reliable sources.","q_ja":"生徒は、ほかの信頼できる情報源を確認せずに、ネット記事一つから結論を導くべきではない。","choices":[{"t":"arrive","why":"結論に達するなら arrive at conclusions とし、at が必要。"},{"t":"draw","why":"正解。draw conclusions from で「〜から結論を導く」という意味になる。"},{"t":"jump","why":"早まった結論を出すなら jump to conclusions とし、to が必要。"},{"t":"come","why":"結論に達するなら come to conclusions とし、to が必要。"}],"answer":1,"point":"draw conclusions from は「〜から結論を導く」。draw の直後に conclusions を置く。","level":3,"drive":{"ja":"生徒は、ほかの信頼できる情報源を確認せずに、ネット記事一つから結論を導くべきではない。結論を導く、の動詞を答えてください。","en":"Students should not draw conclusions from a single online article without checking other reliable sources."},"explain":"主語はStudents、should notで戒め、without以下は必要な確認を示す。draw conclusions fromは判断の根拠を示し、情報評価の論述に使える。別の言い方: form conclusions from"},{"id":"g2-collocation-206","q":"Schools should ___ more time teaching students about online safety.","q_ja":"学校はネット上の安全について生徒に教える時間をもっと取るべきだ。","choices":[{"t":"cost","why":"時間がかかるという意味では、時間を要する活動などを主語にするため、この文には合わない。"},{"t":"last","why":"一定の時間続くという意味で、学校が時間を使って教えることは表せない。"},{"t":"charge","why":"料金を請求するという意味で、教えるために時間を使うことは表せない。"},{"t":"spend","why":"正解。spend time doing で「〜することに時間を使う」という意味になる。"}],"answer":3,"point":"spend time の後ろで活動を示すときは、動詞を動名詞にする。","level":1,"drive":{"ja":"学校はネット上の安全について生徒に教える時間をもっと取るべきだ。時間を使う、の動詞を答えてください。","en":"Schools should spend more time teaching students about online safety."},"explain":"主語はSchools、shouldで提言し、teaching以下が時間の使い道を示す。spend time doingは時間配分を表し、教育改善の論述に使える。別の言い方: devote more time to teaching"},{"id":"g2-collocation-207","q":"Colorful posters can ___ people's attention to local recycling programs.","q_ja":"色鮮やかなポスターは、地域のリサイクル活動に人々の注意を引くことができる。","choices":[{"t":"attract","why":"正解。attract people's attention to で「〜に人々の注意を引く」という意味になる。"},{"t":"collect","why":"物を集めるという意味で、注意を引くことを collect attention とは言わない。"},{"t":"attend","why":"注意を向けるなら attend to とするが、この文の語順では使えない。"},{"t":"concentrate","why":"注意を集中させるなら concentrate attention on とし、to とは組み合わせない。"}],"answer":0,"point":"attract attention to は「〜に注意を引く」。注目させる対象は to の後ろに置く。","level":2,"drive":{"ja":"色鮮やかなポスターは、地域のリサイクル活動に人々の注意を引くことができる。注意を引く、の動詞を答えてください。","en":"Colorful posters can attract people's attention to local recycling programs."},"explain":"主語はColorful posters、can attractで可能な効果を述べる。attract attention toはto以下への注目を表し、広報策の論述に使える。別の言い方: draw people's attention to"},{"id":"g2-collocation-208","q":"Small shops ___ strong competition from large online stores.","q_ja":"小規模な店は、大手のオンラインストアとの厳しい競争に直面している。","choices":[{"t":"compete","why":"競争する相手は compete with などで示し、strong competition を直接目的語にはしない。"},{"t":"struggle","why":"苦闘する対象を続けるには struggle with などの前置詞が必要。"},{"t":"face","why":"正解。face competition で「競争に直面する」という自然な組み合わせになる。"},{"t":"rival","why":"匹敵する相手を目的語に取る語で、厳しい競争に直面する意味にはならない。"}],"answer":2,"point":"face competition は「競争に直面する」。face は前置詞なしで対象を続ける。","level":2,"drive":{"ja":"小規模な店は、大手のオンラインストアとの厳しい競争に直面している。競争に直面する、の動詞を答えてください。","en":"Small shops face strong competition from large online stores."},"explain":"主語はSmall shops、動詞はfaceで、from以下が競争相手を示す。face competitionは状況を簡潔に表し、小売業の課題の要約に使える。別の言い方: encounter strong competition"},{"id":"g2-collocation-209","q":"Companies must ___ with safety regulations even when cheaper production methods are available.","q_ja":"企業は、より安い生産方法が利用できる場合でも、安全規則を順守しなければならない。","choices":[{"t":"obey","why":"規則に従う意味では obey safety regulations とし、with は付けない。"},{"t":"comply","why":"正解。comply with regulations で「規則を順守する」という意味になる。"},{"t":"follow","why":"規則に従う意味では follow safety regulations とし、with は付けない。"},{"t":"observe","why":"規則を守る意味では observe safety regulations とし、with は付けない。"}],"answer":1,"point":"comply with は「〜に従う、〜を順守する」。似た意味の obey と違い、with が必要。","level":3,"drive":{"ja":"企業は、より安い生産方法が利用できる場合でも、安全規則を順守しなければならない。後ろに「ウィズ」を続けて順守する意味になる動詞を答えてください。","en":"Companies must comply with safety regulations even when cheaper production methods are available."},"explain":"主語はCompanies、mustで義務を述べ、even when節は譲歩を示す。comply withは規則の順守を表し、安全優先の主張に使える。別の言い方: adhere to safety regulations"},{"id":"g2-collocation-210","q":"Local businesses can ___ jobs for young people in the area.","q_ja":"地元の企業は、地域の若者のために雇用を生み出すことができる。","choices":[{"t":"cause","why":"出来事や結果を引き起こす語で、雇用を生み出す意味では cause jobs としない。"},{"t":"employ","why":"人を雇うという意味で、仕事を表す jobs を目的語にして雇用を生み出すとは言えない。"},{"t":"invent","why":"装置や方法などを発明する語で、雇用を生み出す意味では使わない。"},{"t":"create","why":"正解。create jobs で「雇用を生み出す」という自然な組み合わせになる。"}],"answer":3,"point":"create jobs は「雇用を生み出す」。企業や地域経済について述べるときに使える。","level":1,"drive":{"ja":"地元の企業は、地域の若者のために雇用を生み出すことができる。雇用を生み出す、の動詞を答えてください。","en":"Local businesses can create jobs for young people in the area."},"explain":"主語はLocal businesses、can createで可能な効果を述べ、for以下が恩恵を受ける人を示す。create jobsは雇用の増加を表し、地域経済への利点を論じられる。別の言い方: generate jobs"},{"id":"g2-collocation-211","q":"Students can ___ respect by listening carefully to different opinions.","q_ja":"生徒は異なる意見に注意深く耳を傾けることで、尊敬を得ることができる。","choices":[{"t":"borrow","why":"「借りる」という意味で、尊敬を得ることは表せない。"},{"t":"earn","why":"正解。努力や行動によって尊敬を得ることを表す。"},{"t":"lend","why":"「貸す」という意味で、尊敬を得ることは表せない。"},{"t":"charge","why":"料金を請求するときに使う動詞で、尊敬とはこの形で結び付かない。"}],"answer":1,"point":"「尊敬を得る」は earn respect。行動によって評価を得るときに使う。","level":1,"drive":{"ja":"生徒は異なる意見に注意深く耳を傾けることで、尊敬を得ることができる。","en":"Students can earn respect by listening carefully to different opinions."},"explain":"Studentsが主語、can earnが述語で、by＋動名詞が手段を示す。earn respectは行動への評価を表し、論述で傾聴の利点を説明できる。別の言い方: gain respect"},{"id":"g2-collocation-212","q":"Teachers can ___ advice to students who feel nervous about exams.","q_ja":"教師は試験に不安を感じる生徒に助言できる。","choices":[{"t":"say","why":"say advice という組み合わせでは「助言する」を表さない。"},{"t":"tell","why":"tell は人や話の内容を目的語に取るが、tell advice とは言わない。"},{"t":"speak","why":"speak advice という組み合わせでは「助言する」を表さない。"},{"t":"give","why":"正解。give advice to someone で「人に助言する」を表す。"}],"answer":3,"point":"「人に助言する」は give advice to someone。advice は数えられない名詞。","level":1,"drive":{"ja":"教師は試験に不安を感じる生徒に助言できる。","en":"Teachers can give advice to students who feel nervous about exams."},"explain":"Teachersが主語、can giveが述語で、who節が生徒を限定する。give advice toは助言の相手を示せるため、論述で教師の支援策を述べるのに使える。別の言い方: advise students"},{"id":"g2-collocation-213","q":"Public libraries give residents free ___ to books and computers.","q_ja":"公共図書館では、地域住民が本やコンピューターを無料で利用できる。","choices":[{"t":"access","why":"正解。access to で、本やコンピューターなどを利用できることを表す。"},{"t":"entrance","why":"建物などへの入り口や入場を表す語で、本やコンピューターの利用は表さない。"},{"t":"approach","why":"対象への接近や取り組み方を表し、利用できることは表さない。"},{"t":"arrival","why":"到着を表す語で、資料や機器を利用できることは表さない。"}],"answer":0,"point":"「〜を利用できること」は access to。free access to で「〜を無料で利用できること」。","level":2,"drive":{"ja":"公共図書館では、地域住民が本やコンピューターを無料で利用できる。","en":"Public libraries give residents free access to books and computers."},"explain":"Public librariesが主語、giveが動詞で、人・与えるものが続く。free access toは無料で使える機会を表し、要約で公共施設の利点をまとめられる。別の言い方: free use of"},{"id":"g2-collocation-214","q":"The town plans to ___ a survey to learn how residents use local bus services.","q_ja":"町は、住民による地域のバスの利用状況を知るために調査を実施する予定だ。","choices":[{"t":"consult","why":"人に相談したり資料を参照したりする意味で、調査を実施する意味にはならない。"},{"t":"express","why":"意見や感情を表現するときに使う動詞で、調査の実施は表さない。"},{"t":"conduct","why":"正解。conduct a survey で「調査を実施する」を表す。"},{"t":"observe","why":"観察することを表し、自ら調査を実施するという意味にはならない。"}],"answer":2,"point":"「調査を実施する」は conduct a survey。調査の目的は to 以下で説明できる。","level":2,"drive":{"ja":"町は、住民による地域のバスの利用状況を知るために調査を実施する予定だ。","en":"The town plans to conduct a survey to learn how residents use local bus services."},"explain":"The townが主語、plansが動詞で、how節はlearnの目的語になる。conduct a surveyは調査の実施を表し、論述で政策の根拠を集める方法を示せる。別の言い方: carry out a survey"},{"id":"g2-collocation-215","q":"Schools should ___ importance to practical skills when planning courses that prepare students for future jobs.","q_ja":"学校は、生徒を将来の仕事に備えさせる授業を計画する際、実用的な技能を重視すべきだ。","choices":[{"t":"join","why":"物をつないだり集団に加わったりする意味だが、join importance to とは言わない。"},{"t":"link","why":"物事を関連付ける動詞だが、「重視する」は link importance to では表せない。"},{"t":"fasten","why":"物を固定する意味で、抽象的な重要性を認める表現には使わない。"},{"t":"attach","why":"正解。attach importance to で「〜を重視する」を表す。"}],"answer":3,"point":"「〜を重視する」は attach importance to。attach を物理的な取り付け以外にも使う。","level":3,"drive":{"ja":"学校は、生徒を将来の仕事に備えさせる授業を計画する際、実用的な技能を重視すべきだ。","en":"Schools should attach importance to practical skills when planning courses that prepare students for future jobs."},"explain":"Schoolsが主語、should attachが述語で、that節が授業を修飾する。attach importance toは重視する対象を示し、論述で教育の優先事項を提案できる。別の言い方: value practical skills"},{"id":"g2-collocation-216","q":"Clear signs can help visitors ___ their way around hospitals.","q_ja":"分かりやすい案内表示は、来院者が病院内で道を見つける助けになる。","choices":[{"t":"find","why":"正解。find one's way で、進む道を見つけることを表す。"},{"t":"search","why":"探す意味はあるが、search their way では道を見つけることを表さない。"},{"t":"look","why":"何かを探す場合は look for を使い、look their way とは言わない。"},{"t":"seek","why":"探し求める意味だが、seek their way around という形では使わない。"}],"answer":0,"point":"「道を見つける」は find one's way。find one's way around a place で、その場所の中を移動できること。","level":1,"drive":{"ja":"分かりやすい案内表示は、来院者が病院内で道を見つける助けになる。","en":"Clear signs can help visitors find their way around hospitals."},"explain":"Clear signsが主語で、help＋人＋動詞の原形が支援の内容を示す。find their wayは目的地へ進む道が分かることを表し、論述で案内表示の効果を説明できる。別の言い方: navigate hospitals"},{"id":"g2-collocation-217","q":"Schools should place greater ___ on checking online information so students can judge whether it is reliable.","q_ja":"学校は、生徒がインターネット上の情報の信頼性を判断できるよう、その情報を確かめることにもっと重点を置くべきだ。","choices":[{"t":"pressure","why":"圧力をかける対象には通常、人や組織を置き、checking という活動への重点は表せない。"},{"t":"emphasis","why":"正解。place emphasis on で「〜に重点を置く」を表す。"},{"t":"concern","why":"心配や関心を表すが、place concern on という形で重点を置く意味にはならない。"},{"t":"interest","why":"関心を表すが、place interest on という組み合わせでは使わない。"}],"answer":1,"point":"「〜に重点を置く」は place emphasis on。on の後ろには名詞や動名詞を置く。","level":3,"drive":{"ja":"学校は、生徒がインターネット上の情報の信頼性を判断できるよう、その情報を確かめることにもっと重点を置くべきだ。","en":"Schools should place greater emphasis on checking online information so students can judge whether it is reliable."},"explain":"主語はSchoolsで、so節が目的、whether節が判断内容を示す。place emphasis on＋動名詞は重点を置く活動を示せるため、論述で教育方針を提案できる。別の言い方: focus more on checking"},{"id":"g2-collocation-218","q":"Cities should ___ a balance between new housing and green spaces when planning for a growing population.","q_ja":"都市は、人口増加に備えた計画を立てる際、新しい住宅と緑地のバランスを取るべきだ。","choices":[{"t":"hit","why":"strike と同じく「打つ」という意味はあるが、hit a balance とは言わない。"},{"t":"attack","why":"攻撃する意味で、二つのもののバランスを取ることは表さない。"},{"t":"strike","why":"正解。strike a balance between で「〜の間でバランスを取る」を表す。"},{"t":"knock","why":"たたく意味はあるが、knock a balance という組み合わせにはならない。"}],"answer":2,"point":"「二つのもののバランスを取る」は strike a balance between A and B。","level":3,"drive":{"ja":"都市は、人口増加に備えた計画を立てる際、新しい住宅と緑地のバランスを取るべきだ。","en":"Cities should strike a balance between new housing and green spaces when planning for a growing population."},"explain":"Citiesが主語、should strikeが述語で、when節は主語とbe動詞を省く。strike a balanceは二つを両立させる表現で、論述で開発と環境保護の調整を提案できる。別の言い方: balance A and B"},{"id":"g2-collocation-219","q":"Students should ___ notes of key ideas during classroom discussions.","q_ja":"生徒は授業中の話し合いで、重要な考えをメモすべきだ。","choices":[{"t":"set","why":"物を置くなどの意味だが、set notes ではメモを取ることを表さない。"},{"t":"put","why":"物を置く意味で、put notes だけではメモを取ることを表さない。"},{"t":"lay","why":"物を横に置く意味で、lay notes ではメモを取ることを表さない。"},{"t":"take","why":"正解。take notes で、要点をメモすることを表す。"}],"answer":3,"point":"「メモを取る」は take notes。内容を続けるときは take notes of などを使う。","level":1,"drive":{"ja":"生徒は授業中の話し合いで、重要な考えをメモすべきだ。","en":"Students should take notes of key ideas during classroom discussions."},"explain":"Studentsが主語、should takeが述語で、during句が時を示す。take notes ofは記録する内容を続けられるため、論述で学習方法を具体的に提案できる。別の言い方: write down key ideas"},{"id":"g2-collocation-220","q":"Companies should ___ customer complaints quickly to stop the same problems from happening again.","q_ja":"企業は、同じ問題が再発しないよう、顧客の苦情に速やかに対応すべきだ。","choices":[{"t":"handle","why":"正解。handle complaints で「苦情に対応する」を表す。"},{"t":"perform","why":"作業や役割を実行する動詞で、苦情への対応を表す組み合わせにはならない。"},{"t":"operate","why":"機械を操作したり事業を運営したりする意味で、苦情を目的語には取らない。"},{"t":"behave","why":"振る舞うという意味の動詞で、complaints を直接の目的語に取れない。"}],"answer":0,"point":"「苦情に対応する」は handle complaints。handle は問題や状況に対処する意味でも使う。","level":2,"drive":{"ja":"企業は、同じ問題が再発しないよう、顧客の苦情に速やかに対応すべきだ。","en":"Companies should handle customer complaints quickly to stop the same problems from happening again."},"explain":"Companiesが主語、should handleが述語で、to以下が目的を示す。handle complaintsは対応全般を表し、論述で再発防止につながる企業の行動を述べられる。別の言い方: deal with complaints"}],"connector":[{"id":"g2-connector-001","q":"The new sports center has modern equipment. ___, its membership fee is too high for many students.","q_ja":"新しいスポーツセンターには最新の設備があります。しかし、多くの生徒にとって会費が高すぎます。","choices":[{"t":"Therefore","why":"設備が最新であることから、会費が高すぎるとは直接結論づけられない。"},{"t":"However","why":"正解。設備の良さという利点から、会費の高さという欠点に転じている。"},{"t":"For example","why":"会費の高さは、設備が最新であることの具体例ではない。"},{"t":"In addition","why":"利点の追加ではなく、利用の障害となる欠点を示している。"}],"answer":1,"point":"利点に続けて欠点を示すときは However, ...。","drive":{"ja":"新しいスポーツセンターには最新の設備があります。しかし、多くの生徒にとって会費が高すぎます。","en":"The new sports center has modern equipment. However, its membership fee is too high for many students."},"level":2,"explain":"第1文は新しいスポーツセンターの設備を述べ、第2文のHoweverがそれと対照的な会費の問題を導く。too high for many studentsは、多くの生徒にとって会費が高すぎることを表す。別の言い方: The new sports center has modern equipment, but its membership fee is too high for many students."},{"id":"g2-connector-002","q":"The only bridge to the island is closed, and there are no boats today. ___, visitors cannot reach the island.","q_ja":"島に通じる唯一の橋が閉鎖されており、今日は船もありません。そのため、訪問者は島に行けません。","choices":[{"t":"However","why":"島に行けないことは、前の内容に反する話ではなく結果。"},{"t":"For example","why":"島に行けないことは、橋の閉鎖などの具体例ではなく結果。"},{"t":"In addition","why":"独立した情報の追加ではなく、交通手段がないことから導かれる結論。"},{"t":"Therefore","why":"正解。交通手段がないことを根拠に、島に行けないと結論づけている。"}],"answer":3,"point":"根拠から論理的な結論を導くときは Therefore, ...。","drive":{"ja":"島に通じる唯一の橋が閉鎖されており、今日は船もありません。そのため、訪問者は島に行けません。","en":"The only bridge to the island is closed, and there are no boats today. Therefore, visitors cannot reach the island."},"level":1,"explain":"第1文ではandで、島へ渡る唯一の橋の閉鎖と当日の船の不在を並べる。Thereforeはその二つの事情を受け、訪問者が島へ到達できないという結果を導く。別の言い方: The only bridge to the island is closed, and there are no boats today, so visitors cannot get to the island."},{"id":"g2-connector-003","q":"Students can help the environment in simple ways. ___, they can bring reusable bags when they go shopping.","q_ja":"生徒は簡単な方法で環境を守る手助けができます。例えば、買い物に行くときに繰り返し使える袋を持参できます。","choices":[{"t":"For example","why":"正解。環境を守る簡単な方法の具体例として、袋の持参を挙げている。"},{"t":"However","why":"袋を持参することは、前の内容に反する話ではない。"},{"t":"As a result","why":"袋を持参できることは、前の一般的な説明によって起きた結果ではない。"},{"t":"On the other hand","why":"異なる側面の対比ではなく、一般論と具体例の関係。"}],"answer":0,"point":"一般的な説明の後に具体例を示すときは For example, ...。","drive":{"ja":"生徒は簡単な方法で環境を守る手助けができます。例えば、買い物に行くときに繰り返し使える袋を持参できます。","en":"Students can help the environment in simple ways. For example, they can bring reusable bags when they go shopping."},"level":1,"explain":"第1文で、生徒が簡単な方法で環境保護に役立てることを述べる。For exampleが具体例を導き、when they go shoppingが再利用可能な袋を持参する場面を示す。別の言い方: Students can help protect the environment in simple ways, such as bringing reusable bags when they go shopping."},{"id":"g2-connector-004","q":"Joining a school club helps students make friends. ___, it gives them a chance to learn teamwork.","q_ja":"学校のクラブに入ると、生徒は友達を作りやすくなります。さらに、協力して活動することを学ぶ機会も得られます。","choices":[{"t":"However","why":"どちらもクラブの利点であり、逆の内容ではない。"},{"t":"For example","why":"協力を学ぶことは、友達を作ることの具体例ではなく別の利点。"},{"t":"In addition","why":"正解。友達を作るという利点に、協力を学ぶという利点を加えている。"},{"t":"In contrast","why":"二つの利点を対立させる関係ではない。"}],"answer":2,"point":"同じ主張を支える別の利点を足すときは In addition, ...。","drive":{"ja":"学校のクラブに入ると、生徒は友達を作りやすくなります。さらに、協力して活動することを学ぶ機会も得られます。","en":"Joining a school club helps students make friends. In addition, it gives them a chance to learn teamwork."},"level":1,"explain":"Joining a school clubが第1文の主語で、クラブへの参加が友達づくりに役立つことを表す。第2文のitはその参加を指し、In additionでチームワークを学ぶ機会という利点を加える。別の言い方: Joining a school club helps students make friends and also gives them an opportunity to learn teamwork."},{"id":"g2-connector-005","q":"On the one hand, living alone gives people more freedom. ___, it can make them feel lonely.","q_ja":"一方で、一人暮らしは人々により多くの自由を与えます。他方で、寂しさを感じさせることもあります。","choices":[{"t":"As a result","why":"自由の増加による結果ではなく、一人暮らしの二つの側面を示している。"},{"t":"For example","why":"孤独感は自由が増えることの具体例ではない。"},{"t":"In addition","why":"On the one hand に対応し、別の側面と対比する表現が必要。"},{"t":"On the other hand","why":"正解。On the one hand に対応し、一人暮らしのもう一つの側面を示す。"}],"answer":3,"point":"On the one hand, ... と On the other hand, ... で二つの側面を対比する。","drive":{"ja":"一方で、一人暮らしは人々により多くの自由を与えます。他方で、寂しさを感じさせることもあります。","en":"On the one hand, living alone gives people more freedom. On the other hand, it can make them feel lonely."},"level":1,"explain":"On the one handとOn the other handで、一人暮らしの利点と欠点を対比する。第2文のitはliving aloneを指し、can make them feel lonelyは人を孤独な気持ちにさせる可能性を表す。別の言い方: Living alone gives people more freedom, but it can also make them feel lonely."},{"id":"g2-connector-006","q":"A factory released dirty water into the river. ___, many fish died downstream.","q_ja":"工場が汚れた水を川に流しました。その結果、下流で多くの魚が死にました。","choices":[{"t":"As a result","why":"正解。汚れた水の排出によって起きた結果を示している。"},{"t":"However","why":"魚の死は、汚れた水の排出に反する内容ではない。"},{"t":"For example","why":"魚の死は、水を排出するという行為の具体例ではない。"},{"t":"On the other hand","why":"異なる側面の対比ではなく、原因と結果の関係。"}],"answer":0,"point":"出来事によって起きた結果を続けるときは As a result, ...。","drive":{"ja":"工場が汚れた水を川に流しました。その結果、下流で多くの魚が死にました。","en":"A factory released dirty water into the river. As a result, many fish died downstream."},"level":1,"explain":"第1文はA factoryを主語として、川に汚水を流した出来事を過去形で述べる。As a resultはその結果を導き、第2文は下流で多くの魚が死んだことを表す。別の言い方: A factory discharged dirty water into the river, and consequently many fish died downstream."},{"id":"g2-connector-007","q":"The museum is free to enter. ___, visitors must pay to join its special workshops.","q_ja":"その博物館は無料で入れます。しかし、特別な体験講座に参加するには料金を払う必要があります。","choices":[{"t":"For example","why":"有料の講座は、無料で入れることの具体例ではない。"},{"t":"However","why":"正解。入館は無料だが、講座への参加は有料という違いを示す。"},{"t":"Therefore","why":"入館が無料という情報から、講座が有料だとは結論づけられない。"},{"t":"As a result","why":"講座の参加費は、入館が無料であることによって起きた結果ではない。"}],"answer":1,"point":"However, ... は、前の説明と異なる条件を示すときにも使う。","drive":{"ja":"その博物館は無料で入れます。しかし、特別な体験講座に参加するには料金を払う必要があります。","en":"The museum is free to enter. However, visitors must pay to join its special workshops."},"level":1,"explain":"第1文は博物館への入館が無料であることを述べる。Howeverが対比を導き、must pay to joinで特別ワークショップへの参加には支払いが必要であることを表す。別の言い方: Admission to the museum is free, but visitors have to pay to take part in its special workshops."},{"id":"g2-connector-008","q":"Many skills are useful in daily life. ___, knowing how to cook helps people prepare healthy meals.","q_ja":"日常生活で役立つ技術はたくさんあります。例えば、料理の仕方を知っていると健康的な食事を用意しやすくなります。","choices":[{"t":"As a result","why":"料理の知識は、役立つ技術が多いことによって生じた結果ではない。"},{"t":"However","why":"料理の利点は、日常で役立つ技術があるという説明と矛盾しない。"},{"t":"For example","why":"正解。日常生活で役立つ技術の例として、料理を挙げている。"},{"t":"On the other hand","why":"二つの側面の対比ではなく、一般論と具体例の関係。"}],"answer":2,"point":"For example の後には、前の一般論に当てはまる具体例を置く。","drive":{"ja":"日常生活で役立つ技術はたくさんあります。例えば、料理の仕方を知っていると健康的な食事を用意しやすくなります。","en":"Many skills are useful in daily life. For example, knowing how to cook helps people prepare healthy meals."},"level":1,"explain":"第1文で多くの技能が日常生活に役立つと述べ、For exampleで具体例を導く。第2文はknowing how to cookを主語とし、help＋人＋動詞の原形で健康的な食事の準備に役立つことを示す。別の言い方: Many skills are useful in everyday life. For instance, knowing how to cook helps people make healthy meals."},{"id":"g2-connector-009","q":"Walking to nearby shops costs no money. ___, it provides gentle exercise.","q_ja":"近くの店まで歩くのにはお金がかかりません。さらに、無理のない運動にもなります。","choices":[{"t":"However","why":"費用がかからないことと運動になることは、ともに歩く利点。"},{"t":"Therefore","why":"費用がかからないことが、運動になることの原因ではない。"},{"t":"For example","why":"運動になることは、費用がかからないことの具体例ではない。"},{"t":"In addition","why":"正解。費用の面の利点に、健康の面の利点を加えている。"}],"answer":3,"point":"異なる観点の利点を加えるときも In addition, ... を使える。","drive":{"ja":"近くの店まで歩くのにはお金がかかりません。さらに、無理のない運動にもなります。","en":"Walking to nearby shops costs no money. In addition, it provides gentle exercise."},"level":1,"explain":"Walking to nearby shopsが第1文の主語で、costs no moneyは費用がかからないことを表す。第2文のitはその歩行を指し、In additionで軽い運動になるという利点を加える。別の言い方: Walking to nearby shops is free and also provides light exercise."},{"id":"g2-connector-010","q":"The village has no hospital, and the nearest one is two hours away. ___, a local medical center is clearly needed.","q_ja":"その村には病院がなく、最も近い病院まで二時間かかります。したがって、地域の医療センターが明らかに必要です。","choices":[{"t":"Therefore","why":"正解。病院が遠いことを根拠に、医療センターの必要性を結論づけている。"},{"t":"However","why":"医療センターが必要だという意見は、病院が遠いことに反しない。"},{"t":"For example","why":"医療センターの必要性は、病院までの距離の具体例ではない。"},{"t":"On the other hand","why":"別の側面との対比ではなく、状況に基づく結論。"}],"answer":0,"point":"Therefore, ... の後には、前の根拠から導ける判断を置く。","drive":{"ja":"その村には病院がなく、最も近い病院まで二時間かかります。したがって、地域の医療センターが明らかに必要です。","en":"The village has no hospital, and the nearest one is two hours away. Therefore, a local medical center is clearly needed."},"level":1,"explain":"第1文では村に病院がないことと、最寄りの病院まで2時間かかることをandで並べる。Thereforeが結論を導き、is clearly neededは地元の医療センターが明らかに必要とされていることを表す。別の言い方: The village has no hospital, and the closest hospital is two hours away, so a local medical center is clearly necessary."},{"id":"g2-connector-201","q":"Free sports classes help children stay healthy after school. ___, many families cannot find classes near their homes.","q_ja":"無料のスポーツ教室は、放課後に子どもたちが健康を保つのに役立つ。しかし、多くの家庭は自宅の近くで教室を見つけられない。","choices":[{"t":"For example","why":"「例えば」は具体例を示すが、後半は健康を保つ効果の例ではなく、利用する上での問題点を述べている。"},{"t":"However","why":"正解。教室の利点に対して、近くに教室がないという問題点を示している。"},{"t":"Therefore","why":"「したがって」は結果を示すが、健康に役立つことが、近くに教室がない原因ではない。"},{"t":"In addition","why":"「さらに」は内容を追加するが、ここでは教室の利点から利用上の問題点へ話が転じている。"}],"answer":1,"point":"利点を述べた後に問題点を示すときは、逆接の However を使う。","level":1,"drive":{"ja":"無料のスポーツ教室は子どもの健康に役立ちます。しかし、近くに教室がない家庭もあります。利点と問題点をつなぐ語を答えてください。","en":"Free sports classes help children stay healthy after school. However, many families cannot find classes near their homes."},"explain":"classesが主語、helpが動詞で、Howeverが逆接を示す。help＋人＋動詞の原形は施策の効果を論じるのに使える。別の言い方: Yet many families have no classes nearby."},{"id":"g2-connector-202","q":"The town put brighter lights along its dark roads. ___, drivers could see people crossing the roads more easily.","q_ja":"町は暗い道路沿いに、より明るい照明を設置した。その結果、運転手は道路を横断する人を以前より見つけやすくなった。","choices":[{"t":"However","why":"「しかし」は逆接だが、明るい照明で人が見えやすくなるのは予想に反する内容ではない。"},{"t":"For example","why":"「例えば」は具体例を示すが、後半は照明設置の例ではなく、その効果を述べている。"},{"t":"On the other hand","why":"「一方で」は異なる面を対比するが、ここでは照明設置とその効果をつないでいる。"},{"t":"As a result","why":"正解。照明を明るくしたことによって、人が見えやすくなったという結果を示している。"}],"answer":3,"point":"対策によって起きた変化を続けるときは、結果を表す As a result を使う。","level":1,"drive":{"ja":"町が道路の照明を明るくした結果、運転手は横断する人を見つけやすくなりました。対策と結果をつなぐ語を答えてください。","en":"The town put brighter lights along its dark roads. As a result, drivers could see people crossing the roads more easily."},"explain":"町が照明を設置し、As a resultで運転手の変化を示す。see＋人＋動詞のing形で目撃した動作を表し、対策の効果を具体化できる。別の言い方: Thus, drivers could see pedestrians better."},{"id":"g2-connector-203","q":"Schools can use less paper in several simple ways. ___, they can send school news to parents by email.","q_ja":"学校はいくつかの簡単な方法で紙の使用量を減らせる。例えば、保護者に学校のお知らせを電子メールで送ることができる。","choices":[{"t":"For example","why":"正解。電子メールで知らせることを、紙を減らす具体的な方法の一つとして挙げている。"},{"t":"However","why":"「しかし」は逆接だが、電子メールの利用は紙を減らせるという説明に反していない。"},{"t":"Therefore","why":"「したがって」は結論を導くが、後半は方法が複数あることの結果ではなく、その一例である。"},{"t":"On the other hand","why":"「一方で」は異なる面を対比するが、後半は紙を減らすという同じ内容を具体化している。"}],"answer":0,"point":"複数の方法があると述べてから一つを具体的に示すときは、For example を使う。","level":1,"drive":{"ja":"学校は紙の使用量を減らせます。例えば、お知らせを電子メールで送れます。一般的な説明と具体例をつなぐ語を答えてください。","en":"Schools can use less paper in several simple ways. For example, they can send school news to parents by email."},"explain":"Schoolsが主語、can useが述語で、For example以下が具体例。send＋物＋to＋人で送付先を示し、提案を具体化できる。別の言い方: Schools can email news to parents."},{"id":"g2-connector-204","q":"Public parks give children safe places to play outside. ___, they provide older people with places to meet friends.","q_ja":"公共の公園は、子どもたちに安全に外で遊べる場所を提供する。さらに、高齢者に友人と会う場所も提供する。","choices":[{"t":"Therefore","why":"「したがって」は結果を示すが、子どもの遊び場があることが、高齢者の交流の場を生む原因ではない。"},{"t":"For example","why":"「例えば」は具体例を示すが、高齢者が友人と会うことは、子どもが外で遊ぶことの例ではない。"},{"t":"In addition","why":"正解。子どもの遊び場という利点に、高齢者の交流の場という別の利点を加えている。"},{"t":"However","why":"「しかし」は逆接だが、二つの文はどちらも公園の利点を述べている。"}],"answer":2,"point":"一つの利点に別の利点を加えるときは、追加を表す In addition を使う。","level":1,"drive":{"ja":"公園は子どもの遊び場になります。さらに、高齢者が友人と会う場所にもなります。別の利点を加える語を答えてください。","en":"Public parks give children safe places to play outside. In addition, they provide older people with places to meet friends."},"explain":"parksが主語、giveが動詞で、In additionが利点を追加する。provide＋人＋with＋物で支援内容を示すと、賛成理由を補強できる。別の言い方: Parks also help seniors meet friends."},{"id":"g2-connector-205","q":"A survey showed that many workers missed the last bus because their shifts ended too late. ___, the town decided to run buses for an extra hour on weekdays.","q_ja":"調査で、多くの労働者が勤務の終了時間が遅すぎるために最終バスに乗れないことが分かった。したがって、町は平日のバスの運行を一時間延長することにした。","choices":[{"t":"For example","why":"「例えば」は具体例を示すが、運行時間の延長は乗り遅れの例ではなく、調査を受けた対応である。"},{"t":"Therefore","why":"正解。調査で分かった問題を理由に、町が運行時間の延長を決めたことを示している。"},{"t":"However","why":"「しかし」は逆接だが、運行時間の延長は調査で分かった問題に沿った対応である。"},{"t":"On the other hand","why":"「一方で」は異なる面の対比だが、後半は調査結果を受けた町の判断を述べている。"}],"answer":1,"point":"調査結果や問題点を根拠にした判断を導くときは、Therefore を使う。","level":2,"drive":{"ja":"調査で、仕事が遅く終わるため最終バスに乗れない人が多いと分かりました。町は平日の運行を一時間延長することにしました。根拠と判断をつなぐ語を答えてください。","en":"A survey showed that many workers missed the last bus because their shifts ended too late. Therefore, the town decided to run buses for an extra hour on weekdays."},"explain":"showedの目的語はthat節で、because節は労働者が最終バスに乗れなかった理由を示します。Thereforeは調査結果から判断を導き、decided toは平日の運行を1時間延長すると決めたことを表します。別の言い方: As a consequence of the survey findings, the town decided to extend weekday bus services by one hour."},{"id":"g2-connector-206","q":"Working from home allows employees to spend less time traveling and more time with their families. ___, those who share small apartments may struggle to find a quiet place to work.","q_ja":"在宅勤務によって、従業員は移動にかける時間を減らし、家族と過ごす時間を増やせる。しかし、狭いアパートをほかの人と共有している人は、静かな仕事場所を見つけるのに苦労するかもしれない。","choices":[{"t":"However","why":"正解。在宅勤務の時間面の利点に対して、住環境によって生じる難しさを示している。"},{"t":"As a result","why":"「その結果」は因果関係を示すが、静かな場所がない原因は住環境であり、移動時間の短縮ではない。"},{"t":"For example","why":"「例えば」は具体例を示すが、静かな場所の確保に苦労することは、時間が増える利点の例ではない。"},{"t":"In addition","why":"「さらに」は追加だが、ここでは在宅勤務の利点から、一部の従業員が抱える問題点へ話が転じている。"}],"answer":0,"point":"話題が同じでも、利点から条件によって生じる欠点へ移る場合は However でつなぐ。","level":2,"drive":{"ja":"在宅勤務は移動時間を減らせます。しかし、住環境によっては静かな仕事場所を確保できません。利点と条件付きの問題点をつなぐ語を答えてください。","en":"Working from home allows employees to spend less time traveling and more time with their families. However, those who share small apartments may struggle to find a quiet place to work."},"explain":"動名詞句が主語、allowsが動詞で、However以下は難点。allow＋人＋to不定詞で利点を述べ、欠点と比べると議論が深まる。別の言い方: Yet some workers may lack a quiet workspace."},{"id":"g2-connector-207","q":"Local libraries can support people who are looking for work in a variety of practical ways. ___, some offer classes on writing applications and preparing for interviews.","q_ja":"地域の図書館は、仕事を探している人をさまざまな実用的な方法で支援できる。例えば、応募書類の書き方や面接の準備についての講座を開く図書館もある。","choices":[{"t":"Therefore","why":"「したがって」は結論を示すが、後半は支援が可能なことから導く判断ではなく、支援方法の具体例である。"},{"t":"However","why":"「しかし」は逆接だが、応募や面接の講座は、図書館が求職者を支援できるという説明に沿っている。"},{"t":"On the other hand","why":"「一方で」は対比を示すが、後半は支援とは別の面ではなく、支援の具体的な内容である。"},{"t":"For example","why":"正解。図書館による求職者支援として、応募書類や面接についての講座を具体的に挙げている。"}],"answer":3,"point":"関係代名詞を含む長めの文でも、一般的な支援の説明と具体例の関係を見抜く。","level":2,"drive":{"ja":"図書館は求職者をさまざまな方法で支援できます。例えば、応募書類や面接についての講座を開けます。支援方法の具体例を示す語を答えてください。","en":"Local libraries can support people who are looking for work in a variety of practical ways. For example, some offer classes on writing applications and preparing for interviews."},"explain":"librariesが主語、can supportが述語で、who節が支援対象を限定。例示文のsomeは一部の図書館を指し、要約でも例の範囲を保てる。別の言い方: Some libraries teach interview skills."},{"id":"g2-connector-208","q":"Not every activity in the town's volunteer program requires people to leave their homes to help others. ___, volunteers who cannot travel can check on elderly residents by telephone without visiting them in person. Other activities, such as cleaning parks, do require volunteers to meet outside and work together in groups.","q_ja":"町のボランティア活動のすべてが、ほかの人を助けるために自宅を出ることを必要とするわけではない。例えば、外出できないボランティアは、直接訪問せずに電話で高齢の住民の様子を確認できる。公園の清掃など、ほかの活動では、屋外に集まってグループで協力する必要がある。","choices":[{"t":"However","why":"「しかし」は逆接だが、電話での見守りは、外出が不要な活動もあるという説明を裏付けている。"},{"t":"In addition","why":"「さらに」は別の内容の追加だが、電話での見守りは前の文に含まれる活動の具体例である。"},{"t":"For example","why":"正解。すべての活動で外出が必要なわけではないという部分否定を、電話での見守りで具体化している。"},{"t":"Therefore","why":"「したがって」は結論を示すが、後半は外出不要の活動が存在することからの推論ではなく、その実例である。"}],"answer":2,"point":"Not every は「すべてがそうとは限らない」。例が部分否定のどちら側を示すか確認する。","level":3,"drive":{"ja":"町のボランティア活動は、すべて外出が必要なわけではありません。電話での見守りは自宅ででき、公園の清掃は屋外で行います。部分否定の説明と電話の活動をつなぐ語を答えてください。","en":"Not every activity in the town's volunteer program requires people to leave their homes to help others. For example, volunteers who cannot travel can check on elderly residents by telephone without visiting them in person. Other activities, such as cleaning parks, do require volunteers to meet outside and work together in groups."},"explain":"Not everyが主語を部分否定し、For exampleが在宅活動の例を示す。末文のdo requireは必要性を強調し、要約で活動の違いを示せる。別の言い方: Some activities can be done at home."},{"id":"g2-connector-209","q":"Students who used a new study app improved their test scores over the course of one term. ___, students who studied with printed materials made the same progress, so the app showed no clear advantage.","q_ja":"新しい学習アプリを使った生徒は、一学期の間にテストの点数を伸ばした。しかし、印刷教材で学んだ生徒も同じだけ進歩したため、アプリに明確な優位性は見られなかった。","choices":[{"t":"However","why":"正解。点数の上昇はアプリの効果を期待させるが、比較対象も同じだけ伸びたため、優位性を示せないという展開である。"},{"t":"Therefore","why":"「したがって」は結果を示すが、アプリ利用者の点数上昇によって、印刷教材の利用者の点数が伸びたわけではない。"},{"t":"For example","why":"「例えば」は具体例を示すが、印刷教材の利用者は、アプリを使って伸びた生徒の例には含まれない。"},{"t":"In addition","why":"「さらに」では単なる成果の追加になるが、後半は比較対象の成果を使ってアプリの優位性を否定している。"}],"answer":0,"point":"両方の数値が改善していても、比較対象との違いがなければ優位性を示せない。文末の結論まで読む。","level":3,"drive":{"ja":"アプリを使った生徒の点数は伸びました。しかし、印刷教材の生徒も同じだけ伸び、アプリの優位性は示されませんでした。改善の報告と優位性を否定する比較をつなぐ語を答えてください。","en":"Students who used a new study app improved their test scores over the course of one term. However, students who studied with printed materials made the same progress, so the app showed no clear advantage."},"explain":"Studentsが主語、improvedが動詞で、Howeverで比較し、soで結論を示す。the same progressで成果を比べ、要約で過大評価を防ぐ。別の言い方: Both groups made equal progress."},{"id":"g2-connector-210","q":"A factory plans to replace its old machines with ones that use less energy for each product. If production doubles, however, the factory may still use more energy in total than it does now. ___, the manager should consider both machine efficiency and the number of products being made at the factory.","q_ja":"ある工場は、古い機械を、製品一つを作るのに使うエネルギーがより少ない機械に交換する予定だ。しかし、生産量が倍になれば、工場全体では現在より多くのエネルギーを使う可能性がある。したがって、管理者は機械の効率と作る製品の数の両方を考慮すべきだ。","choices":[{"t":"In addition","why":"「さらに」は独立した内容の追加だが、最後の文は前の二文を根拠に導いた、管理者への提案である。"},{"t":"However","why":"「しかし」は逆接だが、両方を考慮する提案は、効率と生産量で総使用量が変わるという説明に沿っている。"},{"t":"Therefore","why":"正解。製品一つ当たりの効率だけでは総使用量を判断できないため、生産量も考慮すべきだと結論づけている。"},{"t":"For example","why":"「例えば」は具体例を示すが、最後の文は工場で起きた事例ではなく、条件を踏まえた提案である。"}],"answer":2,"point":"製品一つ当たりと全体の量を区別し、複数の条件から導く提案を Therefore でつなぐ。","level":3,"drive":{"ja":"新しい機械は製品一つ当たりのエネルギーを減らせますが、生産量が増えると全体では使用量が増える可能性があります。管理者は効率と生産量の両方を考えるべきです。二つの条件から提案を導く語を答えてください。","en":"A factory plans to replace its old machines with ones that use less energy for each product. If production doubles, however, the factory may still use more energy in total than it does now. Therefore, the manager should consider both machine efficiency and the number of products being made at the factory."},"explain":"If節が条件、主節のmayが可能性を示し、Thereforeで提案を導く。both A and Bで判断材料を並べると、論述で条件を漏らさず示せる。別の言い方: Consider both efficiency and output."},{"id":"g2-connector-211","q":"The town library has no space for more books. ___, the town plans to build a larger library.","q_ja":"町の図書館には、これ以上本を置く場所がない。そのため、町はもっと大きな図書館を建てる予定だ。","choices":[{"t":"For example","why":"「例えば」は具体例を示す語句だが、後半は場所が足りないことへの対応を述べている。"},{"t":"Therefore","why":"正解。場所が足りないことを理由として、より大きな図書館を建てる計画につなげている。"},{"t":"However","why":"「しかし」は逆接を示す語だが、建設計画は場所の不足に対応したもので、逆の内容ではない。"},{"t":"In addition","why":"「さらに」は情報を追加する語句だが、ここでは不足という理由から計画を導いている。"}],"answer":1,"point":"理由を述べた後に判断や計画を示すときは、Therefore（そのため）でつなぐ。","level":1,"drive":{"ja":"町の図書館には、これ以上本を置く場所がない。そのため、町はもっと大きな図書館を建てる予定だ。","en":"The town library has no space for more books. Therefore, the town plans to build a larger library."},"explain":"図書館の場所不足を述べ、Thereforeで町が計画する文へつなぐ。plan to＋動詞は予定を示し、論述で課題への対策を書ける。別の言い方: The town thus plans to build a bigger library."},{"id":"g2-connector-212","q":"Schools can give students opportunities to learn about local jobs outside the classroom. ___, students can visit nearby farms and ask farmers about their work.","q_ja":"学校は、教室の外で地域の仕事について学ぶ機会を生徒に与えられる。例えば、生徒は近くの農場を訪れ、農家の人に仕事について質問できる。","choices":[{"t":"However","why":"農場への訪問は、教室の外で仕事を学ぶ機会と矛盾せず、その一例になっている。"},{"t":"Therefore","why":"後半は前半から導く結論ではなく、学校が用意できる学習機会の具体例である。"},{"t":"In addition","why":"後半は別の利点や方法を追加するのではなく、前半の学習機会を具体的に示している。"},{"t":"For example","why":"正解。農場を訪れて仕事について質問することは、地域の仕事を学ぶ機会の具体例である。"}],"answer":3,"point":"一般的な学習方法から具体的な活動へ進むときは、For example（例えば）を使う。","level":2,"drive":{"ja":"学校は、教室の外で地域の仕事について学ぶ機会を生徒に与えられる。例えば、生徒は近くの農場を訪れ、農家の人に仕事について質問できる。","en":"Schools can give students opportunities to learn about local jobs outside the classroom. For example, students can visit nearby farms and ask farmers about their work."},"explain":"学校が機会を与える文に、For exampleで生徒の活動を続ける。canに続くvisitとaskをandで並べ、論述の具体例を詳しく示す。別の言い方: Students could visit local farms."},{"id":"g2-connector-213","q":"A factory replaced its old machines with new ones that use less electricity for each product. ___, its total electricity use rose because it produced twice as many goods as before.","q_ja":"ある工場は、古い機械を製品一つ当たりの電力使用量が少ない新しい機械に交換した。しかし、生産量が以前の二倍になったため、工場全体の電力使用量は増加した。","choices":[{"t":"However","why":"正解。製品一つ当たりの使用量は減ったのに、全体の使用量は増えたという対比を示している。"},{"t":"Therefore","why":"全体の使用量が増えた原因は生産量の増加であり、省電力の機械への交換から直接導ける結果ではない。"},{"t":"For example","why":"全体の使用量の増加は、製品一つ当たりの使用量が少なくなることの具体例ではない。"},{"t":"In addition","why":"同じ方向の情報を足すのではなく、一つ当たりの減少と全体の増加の食い違いを示している。"}],"answer":0,"point":"一つ当たりの量と全体の量を区別し、予想と反する結果には However（しかし）を使う。","level":3,"drive":{"ja":"ある工場は、古い機械を製品一つ当たりの電力使用量が少ない新しい機械に交換した。しかし、生産量が以前の二倍になったため、工場全体の電力使用量は増加した。","en":"A factory replaced its old machines with new ones that use less electricity for each product. However, its total electricity use rose because it produced twice as many goods as before."},"explain":"工場が機械を交換した文と使用量が増えた文をHoweverで対比する。because節で理由を補い、要約で意外な結果の背景を示せる。別の言い方: Yet total power use rose as production doubled."},{"id":"g2-connector-214","q":"School gardens help students learn how to grow vegetables. ___, they give students a chance to exercise outside.","q_ja":"学校の菜園は、生徒が野菜の育て方を学ぶのに役立つ。さらに、生徒が屋外で体を動かす機会にもなる。","choices":[{"t":"For example","why":"屋外で体を動かすことは、野菜の育て方を学ぶことの具体例ではなく、別の利点である。"},{"t":"However","why":"二つとも学校の菜園の利点であり、逆の内容にはなっていない。"},{"t":"In addition","why":"正解。野菜の育て方を学べるという利点に、体を動かせるという別の利点を加えている。"},{"t":"Therefore","why":"後半は育て方を学ぶことから導く結果ではなく、菜園が持つもう一つの利点である。"}],"answer":2,"point":"同じものについて別の利点を加えるときは、In addition（さらに）を使う。","level":1,"drive":{"ja":"学校の菜園は、生徒が野菜の育て方を学ぶのに役立つ。さらに、生徒が屋外で体を動かす機会にもなる。","en":"School gardens help students learn how to grow vegetables. In addition, they give students a chance to exercise outside."},"explain":"菜園が学習を助ける文に、In additionで別の効果を加える。help＋人＋動詞の原形で支援を表し、論述で教育効果を説明できる。別の言い方: Gardens also let students exercise outdoors."},{"id":"g2-connector-215","q":"A community center moved its evening classes to weekends so that more workers could attend. ___, the number of people taking the classes increased during the following month.","q_ja":"ある地域の施設は、より多くの働く人が参加できるよう、夜の講座を週末に移した。その結果、翌月には講座の受講者数が増えた。","choices":[{"t":"In addition","why":"受講者数の増加は単なる情報の追加ではなく、参加しやすい日程に変えたことの結果である。"},{"t":"As a result","why":"正解。働く人が参加しやすい週末へ変更した結果、受講者数が増えたことを示している。"},{"t":"However","why":"受講者数の増加は変更の目的に沿っており、予想と反する内容ではない。"},{"t":"For example","why":"受講者数の増加は、講座の日程を変更することの具体例ではなく、その後に生じた結果である。"}],"answer":1,"point":"取り組みの後に実際に起きた変化を示すときは、As a result（その結果）を使う。","level":2,"drive":{"ja":"ある地域の施設は、より多くの働く人が参加できるよう、夜の講座を週末に移した。その結果、翌月には講座の受講者数が増えた。","en":"A community center moved its evening classes to weekends so that more workers could attend. As a result, the number of people taking the classes increased during the following month."},"explain":"施設が日程を変えた文に、As a resultで人数が増えた文を続ける。so that節は目的を表し、要約で狙いと実際の効果を区別できる。別の言い方: Consequently, class attendance rose."},{"id":"g2-connector-216","q":"Extending a shopping center's opening hours gives customers more time to shop after they finish work. ___, it requires some employees to work late, which may make caring for their children difficult.","q_ja":"ショッピングセンターの営業時間を延ばすと、客は仕事を終えた後に買い物をする時間をより多く取れる。一方で、一部の従業員は遅くまで働く必要があり、子どもの世話が難しくなることもある。","choices":[{"t":"Therefore","why":"従業員への負担は、客が買い物をする時間を増やせること自体の結果ではなく、営業時間の延長の別の側面である。"},{"t":"For example","why":"従業員が子どもの世話に困ることは、客の買い物時間が増えることの具体例ではない。"},{"t":"In addition","why":"客への利点に同じ方向の情報を足すのではなく、従業員への不利益と対比している。"},{"t":"On the other hand","why":"正解。同じ営業時間の延長について、客への利点と従業員への負担という異なる側面を対比している。"}],"answer":3,"point":"同じ取り組みを異なる立場から比べるときは、On the other hand（一方で）を使う。","level":3,"drive":{"ja":"ショッピングセンターの営業時間を延ばすと、客は仕事を終えた後に買い物をする時間をより多く取れる。一方で、一部の従業員は遅くまで働く必要があり、子どもの世話が難しくなることもある。","en":"Extending a shopping center's opening hours gives customers more time to shop after they finish work. On the other hand, it requires some employees to work late, which may make caring for their children difficult."},"explain":"動名詞の主語が延長を表し、On the other handで負担へ転じる。require＋人＋to不定詞で必要な行動を示し、論述で不利益を説明できる。別の言い方: Yet some staff must work late."},{"id":"g2-connector-217","q":"City buses are a cheap way to travel around town. ___, they are often crowded in the early morning.","q_ja":"市内のバスは、町を安く移動できる交通手段だ。しかし、朝早い時間には混んでいることが多い。","choices":[{"t":"In addition","why":"安く移動できるという利点に別の利点を足すのではなく、混雑するという欠点を示している。"},{"t":"For example","why":"朝の混雑は、安く移動できることの具体例にはなっていない。"},{"t":"However","why":"正解。料金の安さという利点と、朝の混雑という欠点を対比している。"},{"t":"Therefore","why":"安さだけを理由に朝の時間帯の混雑を結論づけることはできず、ここでは利点と欠点を対比している。"}],"answer":2,"point":"利点を述べた後に欠点を示すときは、However（しかし）でつなぐ。","level":1,"drive":{"ja":"市内のバスは、町を安く移動できる交通手段だ。しかし、朝早い時間には混んでいることが多い。","en":"City buses are a cheap way to travel around town. However, they are often crowded in the early morning."},"explain":"バスを主語に安さを述べ、Howeverで混雑と対比する。a way to＋動詞で手段を示し、論述で交通手段を評価できる。別の言い方: Buses are cheap but often crowded in the morning."},{"id":"g2-connector-218","q":"Repairing broken household items can reduce the amount of waste that families throw away. ___, learning repair skills may help people find jobs at local repair shops.","q_ja":"壊れた家庭用品を修理すれば、家庭から出るごみの量を減らせる。さらに、修理の技術を学ぶことは、地域の修理店で仕事を見つける助けにもなり得る。","choices":[{"t":"In addition","why":"正解。ごみを減らすという環境面の利点に、仕事探しに役立つという別の利点を加えている。"},{"t":"Therefore","why":"仕事探しに役立つのは修理の技術であり、ごみが減ることから仕事探しへの効果が導かれるわけではない。"},{"t":"However","why":"ごみの削減と仕事探しへの効果はいずれも利点であり、逆の内容ではない。"},{"t":"For example","why":"仕事探しに役立つことは、ごみの量を減らすことの具体例ではない。"}],"answer":0,"point":"環境面と雇用面など、異なる観点の利点を加える場合にも In addition（さらに）を使う。","level":2,"drive":{"ja":"壊れた家庭用品を修理すれば、家庭から出るごみの量を減らせる。さらに、修理の技術を学ぶことは、地域の修理店で仕事を見つける助けにもなり得る。","en":"Repairing broken household items can reduce the amount of waste that families throw away. In addition, learning repair skills may help people find jobs at local repair shops."},"explain":"修理と技術習得を各文の動名詞主語にし、In additionで利点を重ねる。may helpは可能性を表し、論述で雇用への効果を断定せず示せる。別の言い方: Repair skills may also lead to jobs."},{"id":"g2-connector-219","q":"A town plans to offer online advice, but many older residents cannot use its website without help. ___, the town should keep its telephone service available while it introduces the new online service.","q_ja":"ある町はオンラインで相談に応じる予定だが、高齢の住民の多くは助けがなければ町のウェブサイトを使えない。そ
