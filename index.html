<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>英検用脳筋ドリル</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="脳筋ドリル">
<meta name="theme-color" content="#ffffff">
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --ink: #1d2330; --sub: #5b6475; --line: #dde1e8;
    --accent: #2f6fde; --ok: #1f9d55; --okbg: #e3f6ea; --ng: #d64545; --ngbg: #fbe6e6;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111418; --card: #1b2027; --ink: #e8ebf0; --sub: #9aa3b2; --line: #2c333d;
      --accent: #6c9cff; --ok: #4cc27f; --okbg: #17301f; --ng: #ff7a7a; --ngbg: #3a1b1b; }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", system-ui, sans-serif; }
  body { padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
  main { max-width: 640px; margin: 0 auto; padding: 12px 14px 96px; }
  h1 { font-size: 20px; margin: 8px 0 12px; }
  h2 { font-size: 16px; margin: 18px 0 8px; color: var(--sub); font-weight: 600; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin: 10px 0; }
  .seg { display: flex; gap: 6px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 4px; }
  .seg button { flex: 1; border: 0; background: transparent; color: var(--ink); font-size: 16px; padding: 10px; border-radius: 9px; }
  .seg button.on { background: var(--accent); color: #fff; font-weight: 600; }
  .big { display: block; width: 100%; border: 0; border-radius: 14px; padding: 16px; font-size: 18px; font-weight: 600;
    background: var(--accent); color: #fff; margin: 10px 0; }
  .big.sub { background: var(--card); color: var(--accent); border: 1px solid var(--line); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .tile { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px; text-align: left;
    color: var(--ink); font-size: 15px; }
  .tile b { display: block; font-size: 16px; margin-bottom: 4px; }
  .tile small { color: var(--sub); }
  .bar { height: 6px; border-radius: 3px; background: var(--line); margin-top: 6px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--ok); }
  .top { display: flex; align-items: center; gap: 10px; margin: 4px 0 8px; color: var(--sub); font-size: 14px; }
  .top button { border: 0; background: transparent; color: var(--accent); font-size: 16px; padding: 6px 0; }
  .top .grow { flex: 1; text-align: center; }
  .q { white-space: pre-wrap; font-size: 18px; line-height: 1.55; }
  .qja { color: var(--sub); font-size: 14px; margin-top: 8px; }
  .label { font-size: 13px; color: var(--sub); margin-bottom: 6px; }
  .choice { display: block; width: 100%; text-align: left; border: 1px solid var(--line); background: var(--card);
    color: var(--ink); border-radius: 12px; padding: 13px 14px; margin: 8px 0; font-size: 16px; line-height: 1.45; }
  .choice.ok { border-color: var(--ok); background: var(--okbg); }
  .choice.ng { border-color: var(--ng); background: var(--ngbg); }
  .choice .why { display: none; font-size: 13.5px; color: var(--sub); margin-top: 6px; }
  .answered .choice .why { display: block; }
  .answered .choice { opacity: .92; }
  .point { border-left: 4px solid var(--accent); padding: 10px 12px; background: var(--card); border-radius: 8px; margin: 12px 0; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(0, 1fr)); gap: 8px; margin: 10px 0; }
  .stats > div { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 6px; text-align: center; }
  .stats small { display: block; color: var(--sub); font-size: 12px; line-height: 1.4; }
  .stats b { display: block; font-size: 20px; margin: 2px 0; }
  .timer { font-variant-numeric: tabular-nums; min-width: 72px; text-align: right; }
  .timer.over { color: var(--ng); font-weight: 600; }
  .result { font-size: 40px; font-weight: 700; text-align: center; margin: 18px 0 4px; }
  .muted { color: var(--sub); font-size: 14px; }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: 0; }
  select, input[type=range] { font-size: 16px; }
  .footer { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
    background: linear-gradient(transparent, var(--bg) 30%); }
  .footer .big { max-width: 612px; margin: 0 auto; }
  /* 運転中モード */
  .drive { position: fixed; inset: 0; background: #000; color: #fff; display: flex; flex-direction: column;
    padding: calc(20px + env(safe-area-inset-top)) 20px calc(20px + env(safe-area-inset-bottom)); }
  .drive .phase { font-size: 18px; color: #9ab; }
  .drive .text { flex: 1; display: flex; align-items: center; font-size: 26px; line-height: 1.5; }
  .drive .stop { border: 0; border-radius: 18px; font-size: 26px; font-weight: 700; padding: 26px; background: #c33; color: #fff; }
  .drive .sst { text-align: center; color: #678; font-size: 13px; margin-top: 8px; }
  .drive .count { text-align: center; color: #9ab; margin-bottom: 10px; }
</style>
</head>
<body>
<main id="app"></main>
<script>
const DATA = {"2":{"collocation":[{"id":"g2-collocation-001","q":"Too much noise can ___ a negative effect on students who are trying to study.","q_ja":"大きすぎる騒音は、勉強しようとしている生徒に悪い影響を与えることがあります。","choices":[{"t":"do","why":"影響を与えるという意味では do an effect ではなく have an effect を使う。"},{"t":"make","why":"この表現では make a negative effect on ではなく have a negative effect on を使う。"},{"t":"have","why":"正解。have a negative effect on ... で、悪い影響を与える対象を示す。"},{"t":"take","why":"take an effect on という組み合わせでは、影響を与える意味を表せない。"}],"answer":2,"point":"have a negative effect on ... で「〜に悪い影響を与える」。","drive":{"ja":"大きすぎる騒音は、勉強しようとしている生徒に悪い影響を与えることがあります。","en":"Too much noise can have a negative effect on students who are trying to study."}},{"id":"g2-collocation-002","q":"The town needs a new plan to ___ the problem of illegal parking.","q_ja":"その町には、違法駐車の問題を解決するための新しい計画が必要です。","choices":[{"t":"solve","why":"正解。solve the problem で、その問題を解決することを表す。"},{"t":"reply","why":"reply は返答するという意味で、reply the problem とは言わない。"},{"t":"arrive","why":"arrive は到着するという意味で、問題を目的語に取れない。"},{"t":"spend","why":"spend は時間やお金を使うときの動詞で、問題を解決する意味にはならない。"}],"answer":0,"point":"solve a problem で「問題を解決する」。","drive":{"ja":"その町には、違法駐車の問題を解決するための新しい計画が必要です。","en":"The town needs a new plan to solve the problem of illegal parking."}},{"id":"g2-collocation-003","q":"Taking short breaks can ___ stress during a busy school day.","q_ja":"忙しい学校生活の中で短い休憩を取ることは、ストレスを減らすのに役立ちます。","choices":[{"t":"attend","why":"attend は会議などに出席するという意味で、ストレスとは組み合わせない。"},{"t":"borrow","why":"borrow は物などを借りるという意味で、ストレスを減らすことを表さない。"},{"t":"repair","why":"repair は壊れた物などを修理する動詞で、ストレスを減らす意味には使わない。"},{"t":"reduce","why":"正解。reduce stress で、ストレスを減らすことを表す。"}],"answer":3,"point":"reduce stress は、健康や生活習慣の利点を説明するときに使える。","drive":{"ja":"忙しい学校生活の中で短い休憩を取ることは、ストレスを減らすのに役立ちます。","en":"Taking short breaks can reduce stress during a busy school day."}},{"id":"g2-collocation-004","q":"Students should ___ attention to the sources of information they find online.","q_ja":"生徒は、インターネットで見つけた情報の出所に注意を払うべきです。","choices":[{"t":"spend","why":"注意を払うという表現では spend attention to は使わない。"},{"t":"pay","why":"正解。pay attention to ... で、注意すべき対象を示す。"},{"t":"cost","why":"cost は費用などがかかるという意味で、この組み合わせには使わない。"},{"t":"buy","why":"buy は買うという意味で、注意を払うという表現には使わない。"}],"answer":1,"point":"pay attention to ... で「〜に注意を払う」。","drive":{"ja":"生徒は、インターネットで見つけた情報の出所に注意を払うべきです。","en":"Students should pay attention to the sources of information they find online."}},{"id":"g2-collocation-005","q":"Students should ___ a decision about their future based on reliable information.","q_ja":"生徒は、信頼できる情報に基づいて自分の将来について決定を下すべきだ。","choices":[{"t":"do","why":"do a decision とは言わず、決定を下すときは make を使う。"},{"t":"perform","why":"perform は演技や作業などに使い、a decision とは組み合わせない。"},{"t":"make","why":"正解。make a decision で、決定を下すことを表す。"},{"t":"build","why":"build は建物などを造るときに使い、この文では決定を下す意味にならない。"}],"answer":2,"point":"make a decision based on ... で「〜に基づいて決定を下す」。","drive":{"ja":"生徒は、信頼できる情報に基づいて自分の将来について決定を下すべきだ。","en":"Students should make a decision about their future based on reliable information."}},{"id":"g2-collocation-006","q":"Using both sides of each sheet can help schools ___ the amount of paper they throw away.","q_ja":"紙の両面を使うことは、学校が捨てる紙の量を減らすのに役立ちます。","choices":[{"t":"invite","why":"invite は人などを招く動詞で、紙の量を目的語にして使わない。"},{"t":"attend","why":"attend は行事などに出席する意味で、量を減らす意味にはならない。"},{"t":"lend","why":"lend は貸すという意味で、捨てる紙の量とは組み合わせない。"},{"t":"reduce","why":"正解。reduce the amount of ... で、量を減らすことを表す。"}],"answer":3,"point":"reduce the amount of ... は、ごみや資源の量を減らす話で使える。","drive":{"ja":"紙の両面を使うことは、学校が捨てる紙の量を減らすのに役立ちます。","en":"Using both sides of each sheet can help schools reduce the amount of paper they throw away."}},{"id":"g2-collocation-007","q":"Local volunteers can ___ an important role in keeping parks clean.","q_ja":"地域のボランティアは、公園をきれいに保つ上で重要な役割を果たせます。","choices":[{"t":"play","why":"正解。play an important role in ... で、重要な役割を果たす場面を示す。"},{"t":"do","why":"役割を果たすという表現では do a role ではなく play a role を使う。"},{"t":"make","why":"make a role では、この文の「役割を果たす」を表せない。"},{"t":"carry","why":"carry a role という組み合わせでは、役割を果たす意味にならない。"}],"answer":0,"point":"play an important role in ... の in の後には名詞や動名詞を置く。","drive":{"ja":"地域のボランティアは、公園をきれいに保つ上で重要な役割を果たせます。","en":"Local volunteers can play an important role in keeping parks clean."}},{"id":"g2-collocation-008","q":"Students who volunteer regularly can gain valuable ___ outside the classroom.","q_ja":"定期的にボランティア活動をする生徒は、教室の外で貴重な経験を積めます。","choices":[{"t":"experienced","why":"experienced は形容詞で、valuable の後に必要な名詞ではない。"},{"t":"experience","why":"正解。gain valuable experience で、貴重な経験を積むことを表す。"},{"t":"experiencing","why":"experiencing は、ここでは経験の蓄積を表す名詞として使えない。"},{"t":"experiential","why":"experiential は経験に基づくという意味の形容詞で、目的語の名詞にならない。"}],"answer":1,"point":"gain experience で「経験を積む」。経験の蓄積を表す experience は通常数えない。","drive":{"ja":"定期的にボランティア活動をする生徒は、教室の外で貴重な経験を積めます。","en":"Students who volunteer regularly can gain valuable experience outside the classroom."}},{"id":"g2-collocation-009","q":"Community events can help residents build strong ___ with their neighbors.","q_ja":"地域の行事は、住民が近所の人々と強いつながりを築くのに役立ちます。","choices":[{"t":"relate","why":"relate は動詞で、strong の後に必要な名詞ではない。"},{"t":"related","why":"related は形容詞や過去分詞で、築くものを表す名詞にならない。"},{"t":"relationships","why":"正解。build strong relationships with ... で、相手と強いつながりを築くことを表す。"},{"t":"relational","why":"relational は形容詞で、build の目的語になる名詞ではない。"}],"answer":2,"point":"build relationships with ... で、人との関係を築くことを表す。","drive":{"ja":"地域の行事は、住民が近所の人々と強いつながりを築くのに役立ちます。","en":"Community events can help residents build strong relationships with their neighbors."}},{"id":"g2-collocation-010","q":"Schools can ___ awareness of food waste by showing students how much food is left after lunch.","q_ja":"学校は、昼食後にどれだけ食べ物が残るかを生徒に示すことで、食品の無駄への意識を高められます。","choices":[{"t":"rise","why":"rise は自動詞なので、awareness を目的語に取れない。"},{"t":"grow up","why":"grow up は成長するという意味で、awareness を目的語に取れない。"},{"t":"stand","why":"stand awareness という組み合わせでは、意識を高める意味にならない。"},{"t":"raise","why":"正解。raise awareness of ... で、意識を高める対象を示す。"}],"answer":3,"point":"raise awareness of ... で「〜への意識を高める」。","drive":{"ja":"学校は、昼食後にどれだけ食べ物が残るかを生徒に示すことで、食品の無駄への意識を高められます。","en":"Schools can raise awareness of food waste by showing students how much food is left after lunch."}}],"connector":[{"id":"g2-connector-001","q":"The new sports center has modern equipment. ___, its membership fee is too high for many students.","q_ja":"新しいスポーツセンターには最新の設備があります。しかし、多くの生徒にとって会費が高すぎます。","choices":[{"t":"Therefore","why":"設備が最新であることから、会費が高すぎるとは直接結論づけられない。"},{"t":"However","why":"正解。設備の良さという利点から、会費の高さという欠点に転じている。"},{"t":"For example","why":"会費の高さは、設備が最新であることの具体例ではない。"},{"t":"In addition","why":"利点の追加ではなく、利用の障害となる欠点を示している。"}],"answer":1,"point":"利点に続けて欠点を示すときは However, ...。","drive":{"ja":"新しいスポーツセンターには最新の設備があります。しかし、多くの生徒にとって会費が高すぎます。","en":"The new sports center has modern equipment. However, its membership fee is too high for many students."}},{"id":"g2-connector-002","q":"The only bridge to the island is closed, and there are no boats today. ___, visitors cannot reach the island.","q_ja":"島に通じる唯一の橋が閉鎖されており、今日は船もありません。そのため、訪問者は島に行けません。","choices":[{"t":"However","why":"島に行けないことは、前の内容に反する話ではなく結果。"},{"t":"For example","why":"島に行けないことは、橋の閉鎖などの具体例ではなく結果。"},{"t":"In addition","why":"独立した情報の追加ではなく、交通手段がないことから導かれる結論。"},{"t":"Therefore","why":"正解。交通手段がないことを根拠に、島に行けないと結論づけている。"}],"answer":3,"point":"根拠から論理的な結論を導くときは Therefore, ...。","drive":{"ja":"島に通じる唯一の橋が閉鎖されており、今日は船もありません。そのため、訪問者は島に行けません。","en":"The only bridge to the island is closed, and there are no boats today. Therefore, visitors cannot reach the island."}},{"id":"g2-connector-003","q":"Students can help the environment in simple ways. ___, they can bring reusable bags when they go shopping.","q_ja":"生徒は簡単な方法で環境を守る手助けができます。例えば、買い物に行くときに繰り返し使える袋を持参できます。","choices":[{"t":"For example","why":"正解。環境を守る簡単な方法の具体例として、袋の持参を挙げている。"},{"t":"However","why":"袋を持参することは、前の内容に反する話ではない。"},{"t":"As a result","why":"袋を持参できることは、前の一般的な説明によって起きた結果ではない。"},{"t":"On the other hand","why":"異なる側面の対比ではなく、一般論と具体例の関係。"}],"answer":0,"point":"一般的な説明の後に具体例を示すときは For example, ...。","drive":{"ja":"生徒は簡単な方法で環境を守る手助けができます。例えば、買い物に行くときに繰り返し使える袋を持参できます。","en":"Students can help the environment in simple ways. For example, they can bring reusable bags when they go shopping."}},{"id":"g2-connector-004","q":"Joining a school club helps students make friends. ___, it gives them a chance to learn teamwork.","q_ja":"学校のクラブに入ると、生徒は友達を作りやすくなります。さらに、協力して活動することを学ぶ機会も得られます。","choices":[{"t":"However","why":"どちらもクラブの利点であり、逆の内容ではない。"},{"t":"For example","why":"協力を学ぶことは、友達を作ることの具体例ではなく別の利点。"},{"t":"In addition","why":"正解。友達を作るという利点に、協力を学ぶという利点を加えている。"},{"t":"In contrast","why":"二つの利点を対立させる関係ではない。"}],"answer":2,"point":"同じ主張を支える別の利点を足すときは In addition, ...。","drive":{"ja":"学校のクラブに入ると、生徒は友達を作りやすくなります。さらに、協力して活動することを学ぶ機会も得られます。","en":"Joining a school club helps students make friends. In addition, it gives them a chance to learn teamwork."}},{"id":"g2-connector-005","q":"On the one hand, living alone gives people more freedom. ___, it can make them feel lonely.","q_ja":"一方で、一人暮らしは人々により多くの自由を与えます。他方で、寂しさを感じさせることもあります。","choices":[{"t":"As a result","why":"自由の増加による結果ではなく、一人暮らしの二つの側面を示している。"},{"t":"For example","why":"孤独感は自由が増えることの具体例ではない。"},{"t":"In addition","why":"On the one hand に対応し、別の側面と対比する表現が必要。"},{"t":"On the other hand","why":"正解。On the one hand に対応し、一人暮らしのもう一つの側面を示す。"}],"answer":3,"point":"On the one hand, ... と On the other hand, ... で二つの側面を対比する。","drive":{"ja":"一方で、一人暮らしは人々により多くの自由を与えます。他方で、寂しさを感じさせることもあります。","en":"On the one hand, living alone gives people more freedom. On the other hand, it can make them feel lonely."}},{"id":"g2-connector-006","q":"A factory released dirty water into the river. ___, many fish died downstream.","q_ja":"工場が汚れた水を川に流しました。その結果、下流で多くの魚が死にました。","choices":[{"t":"As a result","why":"正解。汚れた水の排出によって起きた結果を示している。"},{"t":"However","why":"魚の死は、汚れた水の排出に反する内容ではない。"},{"t":"For example","why":"魚の死は、水を排出するという行為の具体 },{"t":"This website supplies parents with informations about a school that opened last year.","why":"語法の誤り。information は不可算名詞なので、informations の複数形の s を取り除く。"}],"answer":4,"point":"information は不可算名詞なので、複数形の s を付けない。","drive":{"ja":"このウェブサイトは、昨年開校した学校についての情報を保護者に提供している。","en":"This website supplies parents with information about a school that opened last year."}},{"id":"g2-error-009","q":"私たちの上司は、会社が先月導入した研修制度を支持している。","choices":[{"t":"Our manager support a training program that the company introduced last month.","why":"三単現のsの誤り。主語 Our manager は三人称単数なので、support を supports にする。"},{"t":"Our manager supports a training program that the company introduced last month.","why":"正解。単数主語に supports が対応し、support の直後に目的語があり、a training program と last month に対応する過去形 introduced も正しい。"},{"t":"Our manager supports a training program that the company introduces last month.","why":"時制の誤り。last month は過去の時を示すので、introduces を introduced にする。"},{"t":"Our manager supports an training program that the company introduced last month.","why":"冠詞の誤り。training は子音で始まる音なので、an を a にする。"},{"t":"Our managre supports a training program that the company introduced last month.","why":"スペルの誤り。「上司」を表す managre は manager とつづる。"},{"t":"Our manager supports for a training program that the company introduced last month.","why":"語法の誤り。動詞 support は目的語を直接続けるので、for を取り除く。"}],"answer":1,"point":"「〜を支持する」は support 〜で表し、目的語の前に for を置かない。","drive":{"ja":"私たちの上司は、会社が先月導入した研修制度を支持している。","en":"Our manager supports a training program that the company introduced last month."}},{"id":"g2-error-010","q":"先月、この図書館は学生にタブレット端末を貸し出すサービスを始めた。","choices":[{"t":"Last month, this library started a service that lend tablets to students.","why":"三単現の誤り。that の先行詞 a service は単数なので lend を lends にする。"},{"t":"Last month, this library starts a service that lends tablets to students.","why":"時制の誤り。Last month は過去なので starts を過去形 started にする。"},{"t":"Last month, this library started an service that lends tablets to students.","why":"冠詞の誤り。service は子音で始まる音なので an を a にする。"},{"t":"Last month, this libary started a service that lends tablets to students.","why":"スペルの誤り。libary は library とつづる。"},{"t":"Last month, this library started a service that lends tablets to students.","why":"正解。Last month に過去形 started、a service に合う三単現の lends、「貸す」は lend 物 to 人。"},{"t":"Last month, this library started a service that borrows tablets to students.","why":"語法の誤り。borrow は「借りる」。「貸す」は lend 物 to 人。"}],"answer":4,"point":"「人に物を貸す」は lend 物 to 人。「借りる」の borrow と区別する。","drive":{"ja":"先月、この図書館は学生にタブレット端末を貸し出すサービスを始めた。","en":"Last month, this library started a service that lends tablets to students."},"q_ja":""}],"ja2en":[{"id":"g2-ja2en-001","q":"私は、学校は生徒にもっと読書を勧めるべきだという意見に賛成です。","q_ja":"日本語の意味に合う英文を選ぶ。","choices":[{"t":"I agree that schools should encourage students to read more.","why":"正解。agree that で、学校が読書を勧めることへの賛成を表している。"},{"t":"I disagree that schools should encourage students to read more.","why":"disagree は反対するという意味で、賛否が逆。"},{"t":"I agree that students should encourage schools to read more.","why":"勧める側と勧められる側が逆。"},{"t":"I agree that schools should encourage students to read less.","why":"less は「より少なく」で、読む量の増減が逆。"},{"t":"I agree that schools should discourage students from reading more.","why":"discourage は思いとどまらせるという意味で、勧めることにならない。"},{"t":"I agree that schools should encourage students read more.","why":"encourage 人 to do の to が抜けている。"}],"answer":0,"point":"I agree that ... で賛成、encourage 人 to do で行動を勧める。","drive":{"ja":"私は、学校は生徒にもっと読書を勧めるべきだという意見に賛成です。","en":"I agree that schools should encourage students to read more."}},{"id":"g2-ja2en-002","q":"私は、すべての宿題をなくすべきだとは思いません。","q_ja":"日本語の意味に合う英文を選ぶ。","choices":[{"t":"I think that all homework should be removed.","why":"否定がなく、すべての宿題をなくすことに賛成している。"},{"t":"I do not think that all homework has already been removed.","why":"すでになくされたかどうかの話で、なくすべきかという判断ではない。"},{"t":"I do not think that all homework should be removed.","why":"正解。I do not think that ... と should で、宿題をすべてなくすべきだという意見への否定を表す。"},{"t":"I do not think that all homework should be increased.","why":"increased は増やされるという意味で、なくすという意味ではない。"},{"t":"I do not think that only some homework should be removed.","why":"only some は一部だけという意味で、すべてという範囲が変わっている。"},{"t":"I do not think that all homework should removed.","why":"受け身の should be removed に必要な be がない。"}],"answer":2,"point":"「〜だとは思わない」は I do not think that ...。","drive":{"ja":"私は、すべての宿題をなくすべきだとは思いません。","en":"I do not think that all homework should be removed."}},{"id":"g2-ja2en-003","q":"オンライン授業は便利ですが、すべての生徒に適しているわけではありません。","q_ja":"日本語の意味に合う英文を選ぶ。","choices":[{"t":"Although online classes are convenient, they suit every student.","why":"すべての生徒に適しているという意味になり、否定が抜けている。"},{"t":"Because online classes are convenient, they do not suit every student.","why":"Because は理由を表し、「便利ですが」という譲歩を示さない。"},{"t":"Although online classes are convenient, no students can attend them.","why":"誰も受講できないという、日本語にない内容になっている。"},{"t":"Although online classes are convenient, they do not suits every student.","why":"do not の後は原形 suit を使う。"},{"t":"Although online classes are inconvenient, they do not suit every student.","why":"inconvenient は不便なという意味で、前半の意味が逆。"},{"t":"Although online classes are convenient, they do not suit every student.","why":"正解。便利さを認めた上で、すべての生徒に合うわけではないと述べている。"}],"answer":5,"point":"Although ... で譲歩を表し、not ... every で部分否定を表す。","drive":{"ja":"オンライン授業は便利ですが、すべての生徒に適しているわけではありません。","en":"Although online classes are convenient, they do not suit every student."}},{"id":"g2-ja2en-004","q":"この方法には費用がかかることは確かですが、時間を節約できます。","q_ja":"日本語の意味に合う英文を選ぶ。","choices":[{"t":"It is true that this method saves money, but it takes time.","why":"費用を節約するが時間がかかるという意味で、利点と欠点が逆。"},{"t":"It is true that this method costs money, but it can save time.","why":"正解。費用がかかることを認め、時間を節約できるという利点を続けている。"},{"t":"It is true that this method costs time, but it can save money.","why":"時間がかかるが費用を節約できるという意味で、内容が逆。"},{"t":"It is true that this method costs money, but it cannot save time.","why":"cannot によって、時間を節約できないという意味になっている。"},{"t":"It is true that this method cost money, but it can save time.","why":"単数主語 this method に対する現在形は costs。"},{"t":"It is true that this method costs money because it can save time.","why":"because は理由を表し、「ですが」という対比を示さない。"}],"answer":1,"point":"It is true that ..., but ... で事実を認めた上で別の論点を述べる。","drive":{"ja":"この方法には費用がかかることは確かですが、時間を節約できます。","en":"It is true that this method costs money, but it can save time."}},{"id":"g2-ja2en-005","q":"公共交通機関が安くなれば、より多くの人がそれを利用するでしょう。","q_ja":"日本語の意味に合う英文を選ぶ。","choices":[{"t":"If public transportation becomes cheaper, fewer people will use it.","why":"fewer people はより少ない人という意味で、増減が逆。"},{"t":"If public transportation becomes more expensive, more people will use it.","why":"more expensive はより高くという意味で、条件が逆。"},{"t":"If public transportation becomes cheaper, more people will avoid it.","why":"avoid は避けるという意味で、利用するという意味ではない。"},{"t":"If public transportation will become cheaper, more people will use it.","why":"この未来の条件を表す if 節では、will become ではなく becomes を使う。"},{"t":"If public transportation becomes cheaper, more people will use it.","why":"正解。料金が下がるという条件と、利用者が増えるという予想を示している。"},{"t":"If public transportation becomes cheaper, more people used it.","why":"used は過去形で、将来の予想を示していない。"}],"answer":4,"point":"未来の条件は If＋現在形、予想する結果は will＋動詞の原形。","drive":{"ja":"公共交通機関が安くなれば、より多くの人がそれを利用するでしょう。","en":"If public transportation becomes cheaper, more people will use it."}},{"id":"g2-ja2en-006","q":"運動は健康を保つのに役立つので、学校は生徒に運動を勧めるべきです。","q_ja":"日本語の意味に合う英文を選ぶ。","choices":[{"t":"Schools should encourage students to exercise although it helps them stay healthy.","why":"although は譲歩で、健康に役立つことを理由として示していない。"},{"t":"Students should encourage schools to exercise because it helps them stay healthy.","why":"勧める側と勧められる側が逆。"},{"t":"Schools should discourage students from exercising because it helps them stay healthy.","why":"discourage は思いとどまらせるという意味で、勧めるという意味ではない。"},{"t":"Schools should encourage students to exercise because it helps them stay healthy.","why":"正解。because の後に、運動を勧める理由を示している。"},{"t":"Schools should encourage students to exercise because it prevents them from staying healthy.","why":"prevents them from staying healthy は健康を保つのを妨げるという意味で、理由が逆。"},{"t":"Schools should encourage students to exercise because it help them stay healthy.","why":"主語 it に対する現在形は helps。"}],"answer":3,"point":"主張の後に because＋理由を置くと、主張の根拠を示せる。","drive":{"ja":"運動は健康を保つのに役立つので、学校は生徒に運動を勧めるべきです。","en":"Schools should encourage students to exercise because it helps them stay healthy."}},{"id":"g2-ja2en-007","q":"例えば、生徒は昼休みに図書館で本を借りることができます。","q_ja":"日本語の意味に合う英文を選ぶ。","choices":[{"t":"For example, students can borrow books from the library during their lunch break.","why":"正解。例示、図書館から借りる行為、昼休みという時を正しく表している。"},{"t":"For example, students can lend books to the library during their lunch break.","why":"lend ... to ... は貸すという意味で、図書館から借りるという意味ではない。"},{"t":"For example, students cannot borrow books from the library during their lunch break.","why":"cannot によって借りられないという意味になっている。"},{"t":"In conclusion, students can borrow books from the library during their lunch break.","why":"In conclusion は結論を示す表現で、「例えば」ではない。"},{"t":"For example, students can buy books from the library during their lunch break.","why":"buy は買うという意味で、借りるという意味ではない。"},{"t":"For example, students can borrowed books from the library during their lunch break.","why":"can の後は原形 borrow を使う。"}],"answer":0,"point":"For example, ... で例を示し、borrow ... from ... で借りる相手や場所を示す。","drive":{"ja":"例えば、生徒は昼休みに図書館で本を借りることができます。","en":"For example, students can borrow books from the library during their lunch break."}},{"id":"g2-ja2en-008","q":"このような活動を通して、若者は地域社会について学ぶことができます。","q_ja":"日本語の意味に合う英文を選ぶ。","choices":[{"t":"Without such activities, young people can learn about their local communities.","why":"Without は「〜なしで」で、「〜を通して」ではない。"},{"t":"Through such activities, young people can teach their local communities about young people.","why":"地域社会に若者について教えるという意味で、学ぶ主体と内容が変わっている。"},{"t":"Through such activities, young people can learn about their local communities.","why":"正解。活動を通して、地域社会について学べることを表している。"},{"t":"Through such activities, young people cannot learn about their local communities.","why":"cannot によって学べないという意味になっている。"},{"t":"Through such activities, young people can learn their local communities.","why":"地域社会について学ぶという意味には learn about の about が必要。"},{"t":"Before such activities, young people can learn about their local communities.","why":"Before は「〜の前に」で、活動を通して学ぶという意味ではない。"}],"answer":2,"point":"Through＋名詞で「〜を通して」、learn about ... で「〜について学ぶ」。","drive":{"ja":"このような活動を通して、若者は地域社会について学ぶことができます。","en":"Through such activities, young people can learn about their local communities."}},{"id":"g2-ja2en-009","q":"これらの二つの理由から、私は都市にはもっと公園が必要だと考えます。","q_ja":"日本語の意味に合う英文を選ぶ。","choices":[{"t":"For these two reasons, I believe that cities need fewer parks.","why":"fewer parks はより少ない公園という意味で、増やす必要性を示していない。"},{"t":"For these two reasons, I do not believe that cities need more parks.","why":"do not believe によって結論の賛否が逆になっている。"},{"t":"For these two reasons, I believe that parks need more cities.","why":"都市と公園の関係が逆。"},{"t":"For these two reasons, I believe that cities needs more parks.","why":"複数主語 cities に対する現在形は need。"},{"t":"Despite these two reasons, I believe that cities need more parks.","why":"Despite は「〜にもかかわらず」で、理由に基づく結論を示さない。"},{"t":"For these two reasons, I believe that cities need more parks.","why":"正解。二つの理由を受け、都市にもっと公園が必要だという結論を述べている。"}],"answer":5,"point":"For these two reasons, ... は二つの理由を受けて結論を示す型。","drive":{"ja":"これらの二つの理由から、私は都市にはもっと公園が必要だと考えます。","en":"For these two reasons, I believe that cities need more parks."}},{"id":"g2-ja2en-010","q":"結論として、私たちは食品の無駄を減らすために行動すべきです。","q_ja":"日本語の意味に合う英文を選ぶ。","choices":[{"t":"For example, we should take action to reduce food waste.","why":"For example は例示で、結論を示す表現ではない。"},{"t":"In conclusion, we should take action to reduce food waste.","why":"正解。結論として、食品の無駄を減らすための行動を提案している。"},{"t":"In conclusion, we should take action to increase food waste.","why":"increase は増やすという意味で、目的が逆。"},{"t":"In conclusion, we should avoid taking action to reduce food waste.","why":"avoid taking action は行動を避けるという意味で、提案が逆。"},{"t":"In conclusion, we should take action to reducing food waste.","why":"目的を表す不定詞の to の後は原形 reduce を使う。"},{"t":"In conclusion, we should take action because food waste has already disappeared.","why":"食品の無駄がすでになくなったからという、日本語にない理由を加えている。"}],"answer":1,"point":"In conclusion, ... で結論を導き、take action to do で行動の目的を示す。","drive":{"ja":"結論として、私たちは食品の無駄を減らすために行動すべきです。","en":"In conclusion, we should take action to reduce food waste."}}],"paraphrase":[{"id":"g2-paraphrase-001","q":"Using public transportation can help reduce air pollution in cities.","q_ja":"公共交通機関の利用は都市の大気汚染を減らすのに役立つ可能性がある。","choices":[{"t":"Traveling by bus or train can contribute to cleaner air in cities.","why":"正解。公共交通の利用が都市の空気をきれいにする一助になり得るという意味を保っている。"},{"t":"Traveling by bus or train always removes all air pollution from cities.","why":"可能性を、常に汚染をすべてなくすという断定に変えている。"},{"t":"Using public transportation can increase air pollution in cities.","why":"減らすを増やすに変えており、意味が逆である。"},{"t":"Only people living outside cities can use public transportation.","why":"利用者を都市の外の住民だけに限定しており、原文にない。"},{"t":"Using public transportation can helps reduce air pollution in cities.","why":"助動詞 can の後に helps を置いており、文法上の誤りがある。"},{"t":"Cleaner city air makes public transportation less useful.","why":"公共交通が空気の改善に役立つという関係を別の因果関係に変えている。"}],"answer":0,"point":"can help reduce は can contribute to reducing と言い換えられる。","drive":{"ja":"公共交通機関の利用は都市の大気汚染削減に役立つ可能性がある。同じ意味を別の英語で。","en":"Traveling by bus or train can contribute to cleaner air in cities."}},{"id":"g2-paraphrase-002","q":"Students do not have to buy a tablet to join this course.","q_ja":"この講座に参加するために、生徒はタブレットを買う必要はない。","choices":[{"t":"Students are not allowed to buy a tablet for this course.","why":"購入の必要がないことを、購入してはいけないという禁止に変えている。"},{"t":"Every student must buy a tablet before joining this course.","why":"不要な購入を義務に変えており、意味が逆である。"},{"t":"Students do not need to join this course if they own a tablet.","why":"不要なのは端末の購入なのに、講座への参加に変えている。"},{"t":"Buying a tablet is not required for students taking this course.","why":"正解。講座を受ける生徒に購入義務はないという意味を保っている。"},{"t":"Students do not have buying a tablet to join this course.","why":"have to の後は動詞の原形であり、have buying は誤りである。"},{"t":"Students must sell their tablets before taking this course.","why":"タブレットを売る義務は原文にない。"}],"answer":3,"point":"do not have to は「する必要がない」で、禁止を表す must not と異なる。","drive":{"ja":"講座に参加するためにタブレットを買う必要はない。同じ意味を別の英語で。","en":"Buying a tablet is not required for students taking this course."}},{"id":"g2-paraphrase-003","q":"More employees work from home now than they did five years ago.","q_ja":"在宅で働く従業員は、5年前より現在のほうが多い。","choices":[{"t":"Fewer employees work from home now than they did five years ago.","why":"増加を減少に変えており、意味が逆である。"},{"t":"All employees have worked from home for the past five years.","why":"人数の増加を、全員が5年間在宅勤務しているという内容に変えている。"},{"t":"Employees now work at home for more hours each day than five years ago.","why":"人数の比較を、1日あたりの勤務時間の比較に変えている。"},{"t":"The number of employees working from home have increased over the past five years.","why":"主語の中心は単数の number なので、have ではなく has が必要である。"},{"t":"Companies began allowing home working exactly five years ago.","why":"5年前との比較を、制度が始まった時点の説明に変えている。"},{"t":"The number of employees working from home has increased over the past five years.","why":"正解。現在の人数が5年前より増えたという比較を保っている。"}],"answer":5,"point":"人数の比較は the number of ... has increased で言い換えられる。","drive":{"ja":"在宅で働く従業員は5年前より増えている。同じ意味を別の英語で。","en":"The number of employees working from home has increased over the past five years."}},{"id":"g2-paraphrase-004","q":"The town postponed the festival because heavy rain was expected.","q_ja":"大雨が予想されたため、町は祭りを延期した。","choices":[{"t":"The town permanently canceled the festival because heavy rain was expected.","why":"延期を永久的な中止に変えている。"},{"t":"The festival was put off by the town due to the forecast of heavy rain.","why":"正解。大雨の予報が理由で祭りを延期したという意味を保っている。"},{"t":"The town postponed the festival although dry weather was expected.","why":"大雨が理由なのに、乾燥した天候なのに延期したという内容に変えている。"},{"t":"The town expected heavy rain because it had postponed the festival.","why":"大雨の予想と延期の因果関係を逆にしている。"},{"t":"The town postponed the festival because of heavy rain was expected.","why":"because of の後に主語と動詞のある節を直接置いている。"},{"t":"The town held the festival earlier to avoid the expected rain.","why":"日程を遅らせる延期を、前倒しで開催することに変えている。"}],"answer":1,"point":"because の理由は due to と名詞句を使って表せる。","drive":{"ja":"大雨が予想されたため、町は祭りを延期した。同じ意味を別の英語で。","en":"The festival was put off by the town due to the forecast of heavy rain."}},{"id":"g2-paraphrase-005","q":"The new machines are too expensive for this small factory to buy.","q_ja":"新しい機械は高すぎて、この小さな工場には買えない。","choices":[{"t":"This small factory can easily afford the expensive new machines.","why":"買えないという意味を、簡単に買えるに変えている。"},{"t":"The new machines are cheap enough for this small factory to buy.","why":"高すぎるという意味を、買えるほど安いに変えている。"},{"t":"The new machines are so expensive that this small factory cannot afford they.","why":"afford の目的語は they ではなく them が必要である。"},{"t":"This small factory cannot buy the new machines because they are too large.","why":"購入できない理由を価格から大きさに変えている。"},{"t":"The new machines cost so much that this small factory cannot afford them.","why":"正解。価格が高すぎて工場に購入する余裕がないという意味を保っている。"},{"t":"The machines are too expensive for every factory in the country to buy.","why":"対象をこの工場から国内のすべての工場に広げている。"}],"answer":4,"point":"too ... to は so ... that ... cannot で言い換えられる。","drive":{"ja":"新しい機械は高すぎてこの工場には買えない。同じ意味を別の英語で。","en":"The new machines cost so much that this small factory cannot afford them."}},{"id":"g2-paraphrase-006","q":"Unless residents separate their waste, the recycling program will not succeed.","q_ja":"住民がごみを分別しなければ、リサイクル事業は成功しない。","choices":[{"t":"The recycling program will succeed even if residents do not sort their waste.","why":"分別しなくても成功するという逆の条件関係に変えている。"},{"t":"The recycling program will fail if residents sort their waste.","why":"失敗の条件を、分別しない場合から分別する場合に変えている。"},{"t":"The recycling program will fail if residents do not sort their waste.","why":"正解。分別しないことが事業の失敗につながるという条件を保っている。"},{"t":"Residents need not sort their waste for the recycling program to succeed.","why":"成功には分別が必要なのに、分別は不要だという意味に変えている。"},{"t":"The recycling program will fail unless residents sorts their waste.","why":"複数主語 residents に三単現の sorts を使っている。"},{"t":"The recycling program will certainly succeed once residents sort their waste.","why":"分別は成功に必要という内容を、分別だけで成功が確実になるという内容に変えている。"}],"answer":2,"point":"Unless A, B は If not A, B と言い換えられる。","drive":{"ja":"住民がごみを分別しなければ事業は成功しない。同じ意味を別の英語で。","en":"The recycling program will fail if residents do not sort their waste."}},{"id":"g2-paraphrase-007","q":"Despite the higher price, some consumers choose locally grown vegetables.","q_ja":"価格が高くても、地元で育てられた野菜を選ぶ消費者もいる。","choices":[{"t":"All consumers choose locally grown vegetables because they cost less.","why":"一部を全員に変え、価格が高いことも安いことに変えている。"},{"t":"Some consumers avoid locally grown vegetables because of their higher price.","why":"高くても選ぶという意味を、高いから避けるに変えている。"},{"t":"Some consumers choose locally grown vegetables only when they are cheaper.","why":"高くても選ぶという意味を、安い場合に限って選ぶに変えている。"},{"t":"Despite locally grown vegetables cost more, some consumers choose them.","why":"Despite の後に節を直接置いており、Although などが必要である。"},{"t":"Some farmers charge more because consumers refuse to buy local vegetables.","why":"消費者の選択を、農家の値付けと不買の因果関係に変えている。"},{"t":"Although locally grown vegetables cost more, some consumers prefer to buy them.","why":"正解。価格が高いという条件にもかかわらず、一部の消費者が選ぶ意味を保っている。"}],"answer":5,"point":"Despite と名詞句は Although と節で言い換えられる。","drive":{"ja":"価格が高くても地元産の野菜を選ぶ消費者もいる。同じ意味を別の英語で。","en":"Although locally grown vegetables cost more, some consumers prefer to buy them."}},{"id":"g2-paraphrase-008","q":"The community center has been closed since Monday.","q_ja":"地域センターは月曜日からずっと閉まっている。","choices":[{"t":"The community center closed on Monday and has not reopened yet.","why":"正解。月曜日に閉まり、現在も再開していないという継続を保っている。"},{"t":"The community center was closed only on Monday.","why":"月曜日から続く状態を、月曜日だけの閉館に変えている。"},{"t":"The community center has remained open since Monday.","why":"閉まっている状態を、開いている状態に変えている。"},{"t":"The community center will close next Monday.","why":"過去から現在までの状態を、来週の予定に変えている。"},{"t":"The community center has been closed since three days.","why":"since は起点に使うため、期間の three days には for が必要である。"},{"t":"The community center reopened on Monday after a long closure.","why":"閉館の開始日を、再開した日に変えている。"}],"answer":0,"point":"has been closed since は過去の時点から現在まで続く閉館状態を表す。","drive":{"ja":"地域センターは月曜日から現在まで閉まっている。同じ意味を別の英語で。","en":"The community center closed on Monday and has not reopened yet."}},{"id":"g2-paraphrase-009","q":"The school encourages students to walk rather than drive short distances.","q_ja":"学校は短い距離なら車を運転するより歩くように生徒に勧めている。","choices":[{"t":"The school requires every student to walk regardless of the distance.","why":"推奨を義務に変え、短距離という条件もなくしている。"},{"t":"The school encourages students to drive instead of walking short distances.","why":"勧める移動方法を徒歩から車に逆転している。"},{"t":"The school urges students to walk instead of driving when traveling short distances.","why":"正解。短距離では車の運転の代わりに徒歩を勧めるという意味を保っている。"},{"t":"Students encourage the school to stop people from walking short distances.","why":"勧める主体と内容を変えている。"},{"t":"The school encourages students walking rather than driving short distances.","why":"encourage 人 to do の形が必要で、students walking は誤りである。"},{"t":"The school encourages walking only for journeys that are very long.","why":"対象を短い距離から非常に長い距離だけに変えている。"}],"answer":2,"point":"rather than は instead of と動名詞を使って言い換えられる。","drive":{"ja":"学校は短距離の移動では車より徒歩を勧めている。同じ意味を別の英語で。","en":"The school urges students to walk instead of driving when traveling short distances."}},{"id":"g2-paraphrase-010","q":"Online training is rive":{"ja":"学校で生徒に野菜を育てさせることに賛成です。学べることを理由に、英語で一文述べてください。","en":"Growing vegetables helps students understand how much care is needed to produce food."}},{"id":"g2-reason-002","q":"TOPIC: Should local libraries replace all printed books with electronic books?\nPosition: Disagree","q_ja":"地域の図書館は紙の本をすべて電子書籍に置き換えるべきか。立場：反対。","choices":[{"t":"Electronic books allow libraries to offer more titles without needing additional shelf space.","why":"棚を増やさず本を増やせるという利点で、置き換えに賛成する理由になる。"},{"t":"Our library lent me a printed book about birds on Saturday last week.","why":"個人が本を借りた出来事だけで、紙の本を残す一般的な理由がない。"},{"t":"Libraries should keep printed books because replacing all of them is not a good idea.","why":"置き換えに反対という主張を言い換えており、理由の中身がない。"},{"t":"Local libraries should display more paintings by artists who live in the area.","why":"地域の絵画の展示についての提案で、本の形式を変えることと関係がない。"},{"t":"People without suitable devices may lose access to books if printed copies disappear.","why":"正解。端末を持たない人が本を読めなくなるおそれが、全面的な置き換えに反対する理由になる。"},{"t":"Printed books and electronic books are both available at some local libraries today.","why":"現在の図書館の状況を述べるだけで、置き換えに反対する理由を示していない。"}],"answer":4,"point":"反対の理由では、提案によって誰にどのような不利益が生じるかを示す。","drive":{"ja":"図書館の紙の本をすべて電子書籍に変えることに反対です。端末を持たない人への影響を英語で一文述べてください。","en":"People without suitable devices may lose access to books if printed copies disappear."}},{"id":"g2-reason-003","q":"TOPIC: Should companies encourage employees to take short exercise breaks during work?\nPosition: Agree","q_ja":"会社は勤務中に短い運動休憩を取るよう従業員に勧めるべきか。立場：賛成。","choices":[{"t":"Short exercise breaks help employees reduce stress and return to work feeling refreshed.","why":"正解。ストレスが減り、気分を切り替えて仕事に戻れるという利点が賛成を支える。"},{"t":"Taking exercise breaks may interrupt important tasks and make it harder to finish work.","why":"仕事が中断するという欠点で、運動休憩に反対する理由になる。"},{"t":"Some employees take short exercise breaks near their desks during the working day.","why":"休憩の様子を述べるだけで、運動休憩を勧める理由にはなっていない。"},{"t":"Companies should encourage
