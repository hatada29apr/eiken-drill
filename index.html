、援助額より、受け入れ側の機関による資源分配の透明性に左右される。同じ意味を別の構文で述べてください。","en":"Transparent resource allocation by recipient institutions matters more for the effectiveness of international aid in reducing poverty than does the amount of assistance supplied."},"explain":"分配が主語、mattersが動詞、than以下が比較対象。doesで動詞の重複を避け、要因の重要度を論じる。別の言い方: Aid outcomes depend more on transparency than on funding."},{"id":"p1-paraphrase-210","q":"Insufficient public funding forces many museums to limit their educational programs for local communities.","q_ja":"公的資金が不十分なため、多くの博物館は地域社会向けの教育プログラムを制限せざるを得ない。","choices":[{"t":"Because public funding is inadequate, many museums have no choice but to restrict community education programs.","why":"正解。原因を示す名詞句をBecause節に変え、forcesをhave no choice but toで言い換えている。"},{"t":"Insufficient public funding compels many museums to limit their educational programs for local communities.","why":"forcesをcompelsに替えただけで、構文を言い換えていない。"},{"t":"Many museums must limit community education programs because the public funding they receive are inadequate.","why":"because節の主語の中心は不可算名詞fundingなので、areではなくisにする。"},{"t":"Many museums receive insufficient public funding because they have limited their educational programs for local communities.","why":"資金不足が教育プログラムの制限を招くという因果関係を逆にしている。"},{"t":"Inadequate public funding leaves many museums with no alternative but to expand their community education programs.","why":"資金不足によりプログラムを制限するという内容を、拡大するという内容に変えている。"},{"t":"A shortage of public funding compels many local communities to limit the educational programs they provide museums.","why":"教育プログラムを制限する主体を博物館から地域社会に変え、提供の向きも逆にしている。"}],"answer":0,"point":"force A to doはA have no choice but to doで、選択の余地がないことを表せる。","level":1,"drive":{"ja":"公的資金が不十分なため、多くの博物館は地域社会向けの教育プログラムを制限せざるを得ない。同じ意味を別の構文で述べてください。","en":"Because public funding is inadequate, many museums have no choice but to restrict community education programs."},"explain":"Because節が原因、博物館が主語、haveが動詞。no choice but toで不可避性を示し、影響を論じる。別の言い方: Underfunding forces museums to cut community programs."},{"id":"p1-paraphrase-211","q":"Public libraries reduce inequality by providing free access to reliable information.","q_ja":"公共図書館は、信頼できる情報を無料で利用できるようにすることで格差を縮小する。","choices":[{"t":"Free access to reliable information at public libraries increases inequality among local residents.","why":"格差を縮小するという原文が、格差を拡大するという意味に変わっている。"},{"t":"By making reliable information freely available, public libraries help narrow the gap in society.","why":"正解。情報の無料提供を手段とし、格差縮小を結果とする関係を、分詞構文で言い換えている。"},{"t":"Public libraries reduce inequality by offering free access to reliable information.","why":"providingを同義語のofferingに替えただけで、構文を言い換えていない。"},{"t":"Providing reliable information without charge enable public libraries to reduce inequality in society.","why":"動名詞句の主語は単数扱いなので、enableではなくenablesが必要。"},{"t":"Public libraries provide free information because inequality in society has already been reduced.","why":"情報提供によって格差が縮小するという因果関係を逆転させている。"},{"t":"Public libraries help reduce inequality by charging residents for access to reliable information.","why":"無料で利用できるという原文が、利用料金を課すという意味に変わっている。"}],"answer":1,"point":"by＋動名詞の手段と結果の関係を保ち、分詞構文で文全体を組み替える。","level":1,"drive":{"ja":"公共図書館は信頼できる情報を無料で提供し、格差を縮小する。同じ意味を構文を変えて英語で述べてください。","en":"By making reliable information freely available, public libraries help narrow the gap in society."},"explain":"By句が手段、図書館が主語、helpが動詞。make＋目的語＋形容詞で状態を示し、論述で効果を示せる。別の言い方: Libraries reduce inequality through free information access."},{"id":"p1-paraphrase-212","q":"The council postponed the housing project because its environmental impact had not been adequately assessed.","q_ja":"環境への影響が十分に評価されていなかったため、議会はその住宅事業を延期した。","choices":[{"t":"The council delayed the housing project because its environmental impact had not been adequately assessed.","why":"postponedを同義語のdelayedに替えただけで、構文を言い換えていない。"},{"t":"An adequate environmental assessment had been completed, which led the council to postpone the housing development project.","why":"影響評価が不十分だったという理由が、十分な評価が完了したという理由に変わっている。"},{"t":"The council's decision to postpone the housing project prevented an adequate assessment of its impact on the environment.","why":"評価不足が延期の原因だったという関係を、延期が評価を妨げたという関係に変えている。"},{"t":"The housing project was postponed because its effects on the environment had not been adequate assessed by the council.","why":"assessedを修飾するには、形容詞adequateではなく副詞adequatelyが必要。"},{"t":"The lack of an adequate environmental impact assessment led the council to put off the housing development project.","why":"正解。評価不足という原因を名詞句で主語にし、延期という結果を保っている。"},{"t":"Insufficient assessment of the housing project's environmental impact led the council to abandon the development rather than delay it.","why":"一時的な延期が、事業そのものの断念に変わっている。"}],"answer":4,"point":"because節の原因は、the lack ofなどの名詞句を主語にして表せる。","level":2,"drive":{"ja":"環境への影響評価が不十分だったため、議会は住宅事業を延期した。同じ意味を構文を変えて英語で述べてください。","en":"The lack of an adequate environmental impact assessment led the council to put off the housing development project."},"explain":"評価不足が主語、ledが動詞。lead＋人＋to不定詞で、要約の原因と結果を結べる。別の言い方: Inadequate assessment made the council delay the project."},{"id":"p1-paraphrase-213","q":"Unless independent oversight is maintained, the reform is unlikely to prevent officials from misusing public funds.","q_ja":"独立した監視が維持されなければ、その改革が公務員による公的資金の不正使用を防ぐ見込みは低い。","choices":[{"t":"Without continued independent oversight, the reform has little prospect of stopping officials from making improper use of public funds.","why":"正解。unless節をwithout句に変え、監視がなければ防止の見込みが低いという条件と程度を保っている。"},{"t":"Continued independent oversight would by itself ensure that the reform successfully prevented officials from making improper use of the available public funds.","why":"監視が必要だという内容から、監視だけで防止を保証できるという内容に飛躍している。"},{"t":"Without continued independent oversight, there is little prospect of the reform prevent officials from making improper use of the available public funds.","why":"前置詞ofに続く動詞は、preventではなく動名詞preventingにする必要がある。"},{"t":"Even if independent oversight is maintained, the reform is unlikely to stop officials from making improper use of the available public funds.","why":"監視がない場合の見通しを、監視がある場合にも防止は見込めないという内容に変えている。"},{"t":"Unless independent oversight is maintained, the reform is unlikely to prevent officials from misusing public money.","why":"fundsを同義語のmoneyに替えただけで、構文を言い換えていない。"},{"t":"If officials cease making improper use of public funds, the reform will probably remove the need to maintain any independent oversight.","why":"監視を条件とする防止の見通しが、不正の停止を条件とする監視の廃止に変わっている。"}],"answer":0,"point":"unlessは必要条件を示すが、その条件が満たされれば結果が保証されるとは限らない。","level":3,"drive":{"ja":"独立した監視が続かなければ、改革で公的資金の不正使用を防ぐ見込みは低い。同じ意味を構文を変えて英語で述べてください。","en":"Without continued independent oversight, the reform has little prospect of stopping officials from making improper use of public funds."},"explain":"Without continued independent oversightは独立した監視が継続しない場合という条件で、主節の主語はthe reformとなる。little prospect of stoppingは公金の不正使用を防ぐ見込みが低いことを示す。別の言い方: Unless independent oversight continues, the reform is unlikely to stop officials from misusing public money."},{"id":"p1-paraphrase-214","q":"Although renewable energy requires initial investment, it reduces fuel costs over time.","q_ja":"再生可能エネルギーには初期投資が必要だが、長期的には燃料費を削減する。","choices":[{"t":"Renewable energy requires initial investment, so its fuel costs rise over time.","why":"燃料費が下がるという原文が、燃料費が上がるという意味に変わっている。"},{"t":"Although renewable energy requires initial investment, it lowers fuel costs over time.","why":"reducesを同義語のlowersに替えただけで、構文を言い換えていない。"},{"t":"Despite require investment at the outset, renewable energy lowers fuel costs over time.","why":"前置詞despiteの後では、requireではなく動名詞requiringが必要。"},{"t":"Renewable energy lowers fuel costs only when no initial investment is required.","why":"初期投資が必要でも削減できるという内容が、投資不要の場合だけ削減できるという内容に変わっている。"},{"t":"Lower fuel costs over time remove the need for investment in renewable energy.","why":"初期投資が必要だという原文に反し、投資の必要がなくなるとしている。"},{"t":"Despite the investment needed at the outset, renewable energy lowers fuel costs over time.","why":"正解。although節をdespiteに続く名詞句に変え、譲歩と長期的な効果を保っている。"}],"answer":5,"point":"Although＋主語＋動詞は、Despite＋名詞句で譲歩の意味を保って言い換えられる。","level":1,"drive":{"ja":"再生可能エネルギーには初期投資が必要だが、長期的には燃料費を削減する。同じ意味を構文を変えて英語で述べてください。","en":"Despite the investment needed at the outset, renewable energy lowers fuel costs over time."},"explain":"Despite句が譲歩、主節は燃料費削減を述べる。neededは投資を修飾し、論述で必要な費用と利点を対比できる。別の言い方: Despite upfront costs, renewables save fuel costs."},{"id":"p1-paraphrase-215","q":"Had the government consulted local residents, it could have avoided much of the opposition to the policy.","q_ja":"政府が地域住民の意見を聞いていれば、その政策に対する反対の多くを避けられた可能性がある。","choices":[{"t":"The government's consultation with local residents enabled it to avoid much of the opposition that would otherwise have arisen over the policy.","why":"実現しなかった過去の仮定が、実際に意見を聞いて反対を回避したという事実に変わっている。"},{"t":"Had the government consulted local residents, it could have avoided much of the resistance to the policy.","why":"oppositionを同義語のresistanceに替えただけで、構文を言い換えていない。"},{"t":"Much of the opposition to the policy might have been avoided if the government had sought views from local residents.","why":"正解。過去の仮定を保ち、倒置をif節に戻して、回避可能だった反対を受動態の主語にしている。"},{"t":"Seeking local residents' views would have guaranteed that the government faced no opposition at all to the policy it intended to introduce.","why":"反対の多くを避けられた可能性が、反対が一切なくなる保証に変わっている。"},{"t":"Much of the opposition to the policy could have been avoided if the government had seek the views of people living locally.","why":"hadの後には過去分詞が必要なので、seekではなくsoughtにする。"},{"t":"If the government were to consult local residents now, much of the opposition to the policy could be avoided before its future introduction.","why":"過去に実現しなかった条件と結果が、現在から未来に向けた仮定に変わっている。"}],"answer":2,"point":"Had＋主語＋過去分詞の倒置は過去の仮定。時点と可能性の強さを保って言い換える。","level":3,"drive":{"ja":"政府が住民の意見を聞いていれば、政策への反対の多くを避けられた可能性がある。同じ意味を構文を変えて英語で述べてください。","en":"Much of the opposition to the policy might have been avoided if the government had sought views from local residents."},"explain":"反対の多くが主語で、受動態にif節が続く。might have＋過去分詞は、論述で過去の別の可能性を控えめに述べる型。別の言い方: Consulting residents might have reduced opposition."},{"id":"p1-paraphrase-216","q":"The shortage of affordable childcare prevents many qualified parents from returning to paid employment.","q_ja":"手頃な料金の保育サービスが不足しているため、資格や能力を持つ多くの親が有給の仕事に復帰できない。","choices":[{"t":"Many qualified parents cannot return to paid employment because affordable childcare services are available in sufficient numbers.","why":"保育サービスの不足が、十分な供給に変わっている。"},{"t":"The shortage of affordable childcare prevents many qualified parents from returning to paid work.","why":"employmentを同義語のworkに替えただけで、構文を言い換えていない。"},{"t":"Many qualified parents' return to paid employment has caused a shortage of childcare services that families can afford.","why":"保育不足が復職を妨げるという関係を、復職が保育不足を引き起こすという関係に逆転させている。"},{"t":"Many parents with qualifications are unable to reenter paid employment because there is not enough affordable childcare.","why":"正解。不足という名詞句をbecause節に変え、妨げられる親を主語にしている。"},{"t":"A shortage of childcare services at affordable prices prevents many parents with relevant qualifications to return to paid employment.","why":"preventは人＋from＋動名詞を取り、to returnは続けられない。"},{"t":"Many qualified parents choose to avoid paid employment even though affordable childcare services are readily available in their communities.","why":"保育不足で復職できないという内容が、保育を利用できても自ら就労を避けるという内容に変わっている。"}],"answer":3,"point":"無生物主語＋preventの文は、人を主語にして原因をbecause節で示せる。","level":2,"drive":{"ja":"手頃な料金の保育が不足し、資格を持つ多くの親が有給の仕事に戻れない。同じ意味を構文を変えて英語で述べてください。","en":"Many parents with qualifications are unable to reenter paid employment because there is not enough affordable childcare."},"explain":"親が主語、because節が理由。be unable toは状況的な不可能を表し、要約で障壁を示せる。別の言い方: A lack of affordable childcare blocks parents' return to work."},{"id":"p1-paraphrase-217","q":"Governments should protect personal data while encouraging technological innovation for the public benefit.","q_ja":"政府は、公益のための技術革新を促すと同時に、個人データを保護すべきだ。","choices":[{"t":"Governments should protect personal information while encouraging technological innovation for the public benefit.","why":"dataを同義語のinformationに替えただけで、構文を言い換えていない。"},{"t":"The protection of personal data should accompany government support for technological innovation that benefits society.","why":"正解。二つの行動を名詞句に変え、個人データ保護と公益に資する技術革新の推進を両立させている。"},{"t":"Government support for technological innovation should replace the protection of personal data for society's benefit.","why":"データ保護との両立が、データ保護を技術革新の支援で置き換えるという内容に変わっている。"},{"t":"The protection of personal data should accompanies government support for technological innovation that benefits society.","why":"助動詞shouldの後は動詞の原形なので、accompaniesではなくaccompanyが必要。"},{"t":"Governments should protect personal data by preventing technological innovation intended to benefit the wider public.","why":"公益のための技術革新を促すという内容が、それを妨げるという内容に変わっている。"},{"t":"Governments should encourage innovation for the public benefit only after personal data protection has been abandoned.","why":"データ保護を同時に行うという内容が、データ保護の放棄を条件とする内容に変わっている。"}],"answer":1,"point":"二つの動作の両立は、それぞれを名詞化し、accompanyで結んで表せる。","level":1,"drive":{"ja":"政府は個人データを保護しながら、社会の利益になる技術革新を促すべきだ。同じ意味を構文を変えて英語で述べてください。","en":"The protection of personal data should accompany government support for technological innovation that benefits society."},"explain":"保護が主語、that節は技術革新を修飾。should accompanyで両立を求め、論述で政策を結べる。別の言い方: Governments should promote innovation and protect data."},{"id":"p1-paraphrase-218","q":"The subsidies did not so much create new jobs as preserve positions that would otherwise have been eliminated.","q_ja":"その補助金は、新しい雇用を生み出したというよりも、補助金がなければ失われていた雇用を維持した。","choices":[{"t":"The subsidies primarily generated additional employment rather than maintaining existing positions that would have disappeared if financial support had not been provided.","why":"中心的な効果が既存雇用の維持だったという内容を、新規雇用の創出だったという内容に逆転させている。"},{"t":"The subsidies did not so much create new jobs as preserve positions that would otherwise have been removed.","why":"eliminatedを同義語のremovedに替えただけで、構文を言い換えていない。"},{"t":"The subsidies mainly protected existing jobs that employers would have retained even without financial support, rather than bringing about any substantial employment growth.","why":"補助金がなければ失われていた雇用が、補助金なしでも維持されていた雇用に変わっている。"},{"t":"The principal effect of the subsidies were to safeguard existing jobs that would otherwise have disappeared, rather than to generate new employment opportunities.","why":"主語の中心語effectは単数なので、wereではなくwasが必要。"},{"t":"The main contribution of the subsidies was to retain jobs that would have disappeared without them, rather than to generate employment.","why":"正解。not so much A as Bを名詞主語の文に変え、主な効果と補助金がなかった場合の結果を保っている。"},{"t":"The subsidies failed to generate any new employment and merely delayed the eventual elimination of existing positions that the funding was intended to protect.","why":"新規雇用が皆無だったと断定し、既存雇用も最終的には失われたという原文にない内容を加えている。"}],"answer":4,"point":"not so much A as Bは主眼がBにあることを表す。Aの完全否定やotherwiseの条件の変化に注意する。","level":3,"drive":{"ja":"補助金の主な効果は新規雇用の創出よりも、補助金なしでは失われた雇用の維持だった。同じ意味を構文を変えて英語で述べてください。","en":"The main contribution of the subsidies was to retain jobs that would have disappeared without them, rather than to generate employment."},"explain":"主な貢献が主語、wasの補語が不定詞句。rather thanは重点を対比し、要約で効果を整理する。別の言い方: Subsidies mainly saved jobs that would otherwise have vanished."},{"id":"p1-paraphrase-219","q":"The more transparent a public institution becomes, the easier it is for citizens to hold it accountable.","q_ja":"公的機関の透明性が高まるほど、市民はその機関に説明責任を果たさせやすくなる。","choices":[{"t":"Increasing transparency in a public institution makes it easier for citizens to demand that the institution answer for its actions.","why":"正解。二重比較級を名詞化した主語に変え、透明性の向上と説明責任を求めやすくなる関係を保っている。"},{"t":"The more transparent a public institution becomes, the easier it is for citizens to hold it responsible.","why":"accountableを同義語のresponsibleに替えただけで、構文を言い換えていない。"},{"t":"Greater transparency in a public institution makes it easier for that institution to require citizens to explain their own behavior.","why":"市民が機関に責任を求める関係を、機関が市民に説明を求める関係に入れ替えている。"},{"t":"As transparency within a public institution increases, citizens find it harder to require the institution to account for its decisions.","why":"透明性が高まるほど説明責任を求めやすくなるという関係が、求めにくくなるという関係に変わっている。"},{"t":"Greater transparency in a public institution enables citizens holding the institution accountable for the decisions it makes on their behalf.","why":"enableは人＋to不定詞を取るので、holdingではなくto holdが必要。"},{"t":"Once a public institution becomes more transparent, citizens no longer need to ask it to justify any of its public decisions.","why":"説明責任を求めやすくなるという内容が、説明を求める必要がなくなるという内容に変わっている。"}],"answer":0,"point":"the＋比較級の相関構文は、変化を表す名詞句＋makes it＋比較級で言い換えられる。","level":2,"drive":{"ja":"公的機関の透明性が高いほど、市民はその行動への説明責任を求めやすい。同じ意味を構文を変えて英語で述べてください。","en":"Increasing transparency in a public institution makes it easier for citizens to demand that the institution answer for its actions."},"explain":"動名詞句が主語、itは不定詞を受ける。make it easierで容易さの変化を示し、論述で効果を示せる。別の言い方: Transparency helps citizens hold institutions accountable."},{"id":"p1-paraphrase-220","q":"Public transport enables residents without cars to reach essential services.","q_ja":"公共交通機関のおかげで、車を持たない住民も必要不可欠なサービスを利用しに行ける。","choices":[{"t":"Residents who own cars need public transport before essential services become available to them.","why":"車を持たない住民が、車を持つ住民に変わっている。"},{"t":"Public transport allows residents without cars to reach essential services.","why":"enablesを同義語のallowsに替えただけで、構文を言い換えていない。"},{"t":"Access to essential services allows residents without cars to operate public transport for others.","why":"公共交通がサービスへの移動を可能にする関係を、サービスの利用が交通の運営を可能にする関係に変えている。"},{"t":"Public transport makes essential services inaccessible to residents who do not own private cars.","why":"サービスに到達できるという内容が、到達できないという内容に変わっている。"},{"t":"Residents who do not own cars are enabled reaching essential services by public transport.","why":"受動態のbe enabledにはto不定詞が続くため、reachingではなくto reachが必要。"},{"t":"Thanks to public transport, essential services are accessible to residents without cars.","why":"正解。enablesの文をthanks toの原因句とサービスを主語にした文に組み替えている。"}],"answer":5,"point":"enable＋人＋to不定詞は、原因を示す句とbe accessible toを使って言い換えられる。","level":1,"drive":{"ja":"公共交通のおかげで、車を持たない住民も必要なサービスを利用しに行ける。同じ意味を構文を変えて英語で述べてください。","en":"Thanks to public transport, essential services are accessible to residents without cars."},"explain":"Thanks to句はアクセスを可能にする原因を示し、主語はessential servicesとなる。accessible to residents without carsは車を持たない住民が利用できることを表す。別の言い方: Public transport allows residents who do not own cars to reach essential services."},{"id":"p1-paraphrase-101","q":"The government increased funding for public transport because it wanted to reduce air pollution.","q_ja":"政府は大気汚染を減らしたかったため、公共交通への資金を増やした。","choices":[{"t":"Public transport received less government funding as part of an effort to reduce air pollution.","why":"原文では資金を増やしているが、この文では資金を減らしている。"},{"t":"A desire to reduce air pollution led the government to increase public transport funding.","why":"正解。大気汚染を減らしたいという目的を名詞の主語にし、資金増加につながったと表している。"},{"t":"The government increased funding for public transport because it wanted to decrease air pollution.","why":"reduceを同義語のdecreaseに替えただけで、構文を変えていない。"},{"t":"The government wanted more air pollution, so it increased the funding available for public transport.","why":"資金を増やした目的が、大気汚染の削減から増加に変わっている。"},{"t":"The government increased public transport funding because of it wanted to reduce air pollution.","why":"because ofの後ろに主語と動詞のある節は置けない。この形ではbecauseを使う。"},{"t":"Public transport companies increased government funding because they wanted to reduce levels of air pollution.","why":"資金を増やした主体が、政府から公共交通の会社に変わっている。"}],"answer":1,"point":"because節の目的は、A desire to do led A to doの形でも表せる。","level":1,"drive":{"ja":"政府は大気汚染を減らしたかったため、公共交通への資金を増やした。目的を名詞の主語にして英語で言い換えてください。","en":"A desire to reduce air pollution led the government to increase public transport funding."},"explain":"主語は願望、ledが因果を示す。lead A to doは政策の動機を要約する型。別の言い方: The government raised transport funding to cut air pollution."},{"id":"p1-paraphrase-102","q":"Although the policy was expensive, it improved access to health care in rural areas.","q_ja":"その政策には費用がかかったが、地方で医療を受けやすくなった。","choices":[{"t":"The costly policy made it more difficult for people in rural areas to receive health care.","why":"原文では医療を受けやすくなったが、この文では受けにくくなっている。"},{"t":"Although the policy was costly, it improved access to health care in rural areas.","why":"expensiveを同義語のcostlyに替えただけで、構文を変えていない。"},{"t":"Despite the policy was expensive, it made health care more accessible in rural areas.","why":"despiteの直後に主語と動詞のある節は置けない。despite its high costなどとする。"},{"t":"The policy improved access to health care in rural areas because it was expensive.","why":"費用がかかっても改善したという譲歩を、費用がかかったから改善したという因果関係に変えている。"},{"t":"Despite its high cost, the policy made health care more accessible in rural areas.","why":"正解。Althoughの節をDespiteと名詞句に変え、費用がかかっても医療を受けやすくなったという意味を保っている。"},{"t":"The policy improved access to health care in rural areas without requiring any spending.","why":"原文では費用がかかったが、この文では支出が一切不要だったとしている。"}],"answer":4,"point":"Althoughの後ろには節、despiteの後ろには名詞句を置いて譲歩を表す。","level":1,"drive":{"ja":"その政策には費用がかかったが、地方で医療を受けやすくなった。despiteを使って英語で言い換えてください。","en":"Despite its high cost, the policy made health care more accessible in rural areas."},"explain":"Despite句は譲歩、主節は成果。make＋目的語＋比較級で政策の改善効果を示す。別の言い方: Though costly, the policy improved rural access to health care."},{"id":"p1-paraphrase-103","q":"If governments do not share information, progress in clean energy will be slower.","q_ja":"各国政府が情報を共有しなければ、クリーンエネルギーの進歩は遅くなる。","choices":[{"t":"Without information sharing among governments, progress in clean energy will proceed at a slower pace.","why":"正解。情報を共有しないという条件をWithoutと名詞句に変え、進歩が遅くなるという意味を保っている。"},{"t":"Clean energy will develop more quickly if governments keep their information instead of sharing it.","why":"情報を共有しない場合の結果が、進歩の減速から加速に変わっている。"},{"t":"If governments do not share knowledge, progress in clean energy will be slower.","why":"informationを同義語のknowledgeに替えただけで、構文を変えていない。"},{"t":"Unless governments shares their information, progress in clean energy will proceed at a slower pace.","why":"主語governmentsは複数なので、動詞はsharesではなくshareにする。"},{"t":"Slower progress in clean energy will lead governments to stop sharing information with one another.","why":"情報を共有しないことが進歩を遅らせるという因果の向きを逆にしている。"},{"t":"Information sharing among governments will slow the pace of progress in clean energy research.","why":"情報を共有しないと遅くなるという原文を、共有すると遅くなるという意味に変えている。"}],"answer":0,"point":"If A do notの条件は、Withoutと動名詞を含む名詞句でも表せる。","level":1,"drive":{"ja":"各国政府が情報を共有しなければ、クリーンエネルギーの進歩は遅くなる。withoutを使って英語で言い換えてください。","en":"Without information sharing among governments, progress in clean energy will proceed at a slower pace."},"explain":"Without句は否定条件、主語は進歩。速度の低下で協力の必要性を論じる。別の言い方: Clean energy will advance more slowly unless governments share information."},{"id":"p1-paraphrase-104","q":"The new law protects personal data and also limits how companies use it.","q_ja":"新しい法律は個人データを保護し、企業によるその利用も制限する。","choices":[{"t":"The new law protects personal data while allowing companies to use it without any limits.","why":"原文では企業の利用を制限するが、この文では制限なしに利用を認めている。"},{"t":"The new law protects personal data and also restricts how companies use it.","why":"limitsを同義語のrestrictsに替えただけで、構文を変えていない。"},{"t":"The new law provides protection for personal data but places no restrictions on company use.","why":"企業による利用にも制限を設けるという原文と異なり、制限を設けないとしている。"},{"t":"The new law not only protects personal data but also restricts its use by companies.","why":"正解。二つの働きをnot onlyとbut alsoでつなぎ、企業による利用をits use by companiesと言い換えている。"},{"t":"The new law provides protection for personal data and places restrict on its corporate use.","why":"placesの目的語には名詞が必要なので、動詞restrictではなく名詞restrictionsを使う。"},{"t":"Companies must protect the new law, which sets limits on how they use personal data.","why":"法律が個人データを保護するという内容を、企業が法律を守る必要があるという内容に変えている。"}],"answer":3,"point":"二つの働きはnot only A but also Bで表せる。AとBの文法上の形をそろえる。","level":1,"drive":{"ja":"新しい法律は個人データを保護し、企業によるその利用も制限する。not onlyとbut alsoを使って英語で言い換えてください。","en":"The new law not only protects personal data but also restricts its use by companies."},"explain":"主語は法律、動詞は二つ。not only A but also Bで形をそろえ、利点を追加する。別の言い方: The law safeguards personal data and limits corporate use."}],"reason":[{"id":"p1-reason-001","q":"TOPIC: Should governments expand public transport subsidies?\nPosition: Agree\nPOINT: Equality\nChoose the general reason that supports the position using the specified POINT.","q_ja":"政府は公共交通への補助金を拡大すべきか（賛成）。指定の観点「公平性」を使って、この立場を支える一般的な理由を選んでください。","choices":[{"t":"Transport subsidies undermine equality when benefits mainly reach affluent urban commuters while disadvantaged residents in remote communities receive little financial assistance.","why":"公平性に触れているが、指定された立場と逆の理由になっている。"},{"t":"Expanded transport subsidies reduce vehicle emissions by encouraging commuters to abandon private cars, thereby improving air quality in crowded urban areas.","why":"同じ政策に関する理由だが、指定された公平性とは別の観点を述べている。"},{"t":"By reducing fares, public subsidies promote equality, enabling residents with limited incomes to access employment opportunities beyond their immediate neighborhoods.","why":"正解。公平性の観点から政策の影響を説明し、賛成の立場を支える一般的な理由になっている。"},{"t":"Public transport subsidies appear in municipal budgets, which classify expenditure according to administrative departments and the services receiving direct financial support.","why":"制度や対象の事実を説明しているだけで、指定された立場を支える理由を示していない。"},{"t":"Governments should expand financial assistance for public transport because providing broader public subsidies for these services is a policy that deserves support.","why":"指定された立場を言い換えているだけで、なぜそうすべきかを説明していない。"},{"t":"When my municipality introduced subsidized bus passes last April, I used mine to attend a recruitment event in a neighboring district.","why":"特定の個人的な体験にとどまり、指定された立場を支える一般的な理由になっていない。"}],"answer":2,"point":"「公平性」が政策によってどう変わるかを説明し、賛成の立場につながる因果関係を示す。","drive":{"ja":"政府は公共交通への補助金を拡大すべきか。賛成の立場で、「公平性」を使った一般的な理由を英語で一文述べてください。","en":"By reducing fares, public subsidies promote equality, enabling residents with limited incomes to access employment opportunities beyond their immediate neighborhoods."},"level":2,"explain":"主語は公的補助金、動詞はpromoteで、冒頭のBy句が手段、分詞句が結果を示す。enable＋人＋toで政策が可能にする行動を論述できる。別の言い方: Subsidies improve access to jobs."},{"id":"p1-reason-002","q":"TOPIC: Should public institutions replace most administrative staff with automated systems?\nPosition: Disagree\nPOINT: Accountability\nChoose the general reason that supports the position using the specified POINT.","q_ja":"公的機関は事務職員の大半を自動化システムで置き換えるべきか（反対）。指定の観点「説明責任」を使って、この立場を支える一般的な理由を選んでください。","choices":[{"t":"Automated systems strengthen accountability by recording administrative decisions consistently, allowing public institutions to investigate errors more thoroughly than conventional paper procedures permit.","why":"説明責任に触れているが、指定された立場と逆の理由になっている。"},{"t":"Replacing administrative staff with automated systems would impose substantial initial costs, diverting limited public resources from essential services for vulnerable local residents.","why":"同じ政策に関する理由だが、指定された説明責任とは別の観点を述べている。"},{"t":"Public institutions maintain administrative records in electronic databases, with separate departments responsible for managing applications relating to various categories of public services.","why":"制度や対象の事実を説明しているだけで、指定された立場を支える理由を示していない。"},{"t":"Public institutions should retain most administrative employees because replacing the majority of these workers with automated systems is an approach they should reject.","why":"指定された立場を言い換えているだけで、なぜそうすべきかを説明していない。"},{"t":"After an automated application system rejected my housing documents last winter, I visited the municipal office and requested clarification from a senior official.","why":"特定の個人的な体験にとどまり、指定された立場を支える一般的な理由になっていない。"},{"t":"Extensive automation may weaken accountability, as citizens affected by incorrect decisions could struggle to identify officials responsible for explaining and correcting them.","why":"正解。説明責任の観点から政策の影響を説明し、反対の立場を支える一般的な理由になっている。"}],"answer":5,"point":"「説明責任」が政策によってどう変わるかを説明し、反対の立場につながる因果関係を示す。","drive":{"ja":"公的機関は事務職員の大半を自動化システムで置き換えるべきか。反対の立場で、「説明責任」を使った一般的な理由を英語で一文述べてください。","en":"Extensive automation may weaken accountability, as citizens affected by incorrect decisions could struggle to identify officials responsible for explaining and correcting them."},"level":3,"explain":"主語は自動化、動詞はmay weakenで、as節が理由を補う。struggle toは実行の難しさを表し、政策の問題点を論述できる。別の言い方: Automation may blur responsibility."},{"id":"p1-reason-003","q":"TOPIC: Should governments provide more funding for basic scientific research?\nPosition: Agree\nPOINT: Innovation\nChoose the general reason that supports the position using the specified POINT.","q_ja":"政府は基礎科学研究への資金提供を増やすべきか（賛成）。指定の観点「技術革新」を使って、この立場を支える一般的な理由を選んでください。","choices":[{"t":"Public investment in basic research fosters innovation by supporting investigations whose uncertain commercial prospects would otherwise discourage private companies from financing them.","why":"正解。技術革新の観点から政策の影響を説明し、賛成の立場を支える一般的な理由になっている。"},{"t":"Increasing public funding could hinder innovation if researchers prioritize administrative requirements over original investigations, reducing their willingness to explore unconventional scientific ideas.","why":"技術革新に触れているが、指定された立場と逆の理由になっている。"},{"t":"Greater funding for basic research would create stable employment for laboratory technicians, helping universities retain qualified personnel despite fluctuations in private sector recruitment.","why":"同じ政策に関する理由だが、指定された技術革新とは別の観点を述べている。"},{"t":"Basic research receives funding from several government agencies, whose annual reports describe the academic institutions and scientific fields included in their grant programs.","why":"制度や対象の事実を説明しているだけで、指定された立場を支える理由を示していない。"},{"t":"Governments should allocate additional resources to basic scientific research because increasing public financial support for this category of research is a desirable policy.","why":"指定された立場を言い換えているだけで、なぜそうすべきかを説明していない。"},{"t":"During my university internship last summer, a government research grant allowed our laboratory to purchase equipment for an experimental project on advanced materials.","why":"特定の個人的な体験にとどまり、指定された立場を支える一般的な理由になっていない。"}],"answer":0,"point":"「技術革新」が政策によってどう変わるかを説明し、賛成の立場につながる因果関係を示す。","drive":{"ja":"政府は基礎科学研究への資金提供を増やすべきか。賛成の立場で、「技術革新」を使った一般的な理由を英語で一文述べてください。","en":"Public investment in basic research fosters innovation by supporting investigations whose uncertain commercial prospects would otherwise discourage private companies from financing them."},"level":3,"explain":"主語は公的投資、動詞はfostersで、by句が手段を示す。whoseは研究の事業性を説明し、otherwiseで支援がない場合を論述できる。別の言い方: Public funding drives innovation."},{"id":"p1-reason-004","q":"TOPIC: Should cities prohibit private cars throughout their central districts?\nPosition: Disagree\nPOINT: Accessibility\nChoose the general reason that supports the position using the specified POINT.","q_ja":"都市は中心地区全域で自家用車の利用を禁止すべきか（反対）。指定の観点「アクセスのしやすさ」を使って、この立場を支える一般的な理由を選んでください。","choices":[{"t":"Prohibiting private cars improves accessibility by allowing cities to redesign central streets for reliable bus services and continuous routes for pedestrians using wheelchairs.","why":"アクセスのしやすさに触れているが、指定された立場と逆の理由になっている。"},{"t":"A comprehensive ban could reduce commercial revenue if customers choose suburban shopping centers, placing additional financial pressure on independent retailers in central districts.","why":"同じ政策に関する理由だが、指定されたアクセスのしやすさとは別の観点を述べている。"},{"t":"Central districts contain offices, shops, and public facilities, while municipal transport maps identify roads connecting these locations with surrounding residential and commercial neighborhoods.","why":"制度や対象の事実を説明しているだけで、指定された立場を支える理由を示していない。"},{"t":"A comprehensive ban would restrict accessibility for residents with mobility impairments, who may depend on private vehicles where suitable public transport remains unavailable.","why":"正解。アクセスのしやすさの観点から政策の影響を説明し、反対の立場を支える一般的な理由になっている。"},{"t":"Cities should reject comprehensive prohibitions on private cars in their central districts because banning these vehicles throughout such areas is an undesirable municipal policy.","why":"指定された立場を言い換えているだけで、なぜそうすべきかを説明していない。"},{"t":"When my city closed a central street to private cars last month, I drove my grandfather to a medical appointment via another neighborhood.","why":"特定の個人的な体験にとどまり、指定された立場を支える一般的な理由になっていない。"}],"answer":3,"point":"「アクセスのしやすさ」が政策によってどう変わるかを説明し、反対の立場につながる因果関係を示す。","drive":{"ja":"都市は中心地区全域で自家用車の利用を禁止すべきか。反対の立場で、「アクセスのしやすさ」を使った一般的な理由を英語で一文述べてください。","en":"A comprehensive ban would restrict accessibility for residents with mobility impairments, who may depend on private vehicles where suitable public transport remains unavailable."},"level":3,"explain":"主語は A comprehensive ban、動詞句は would restrict。who節は移動に障害のある住民について補足し、where節は適切な公共交通がない地域を示す。別の言い方: A comprehensive ban would limit access for residents with mobility impairments, who may rely on private vehicles in areas without suitable public transport."},{"id":"p1-reason-005","q":"TOPIC: Should governments require manufacturers to collect used electronic devices?\nPosition: Agree\nPOINT: Resources\nChoose the general reason that supports the position using the specified POINT.","q_ja":"政府は使用済み電子機器の回収を製造業者に義務づけるべきか（賛成）。指定の観点「資源」を使って、この立場を支える一般的な理由を選んでください。","choices":[{"t":"Mandatory collection may waste resources when transporting small quantities of discarded devices over long distances consumes more fuel than existing local recycling arrangements.","why":"資源に触れているが、指定された立場と逆の理由になっている。"},{"t":"Mandatory collection conserves resources by enabling manufacturers to recover valuable metals from discarded devices, reducing their dependence on the extraction of raw materials.","why":"正解。資源の観点から政策の影響を説明し、賛成の立場を支える一般的な理由になっている。"},{"t":"Requiring manufacturers to collect used electronic devices would create employment in regional processing facilities, potentially supporting communities affected by declining demand for traditional manufacturing.","why":"同じ政策に関する理由だが、指定された資源とは別の観点を述べている。"},{"t":"Electronic devices contain several types of metals, and manufacturers publish product specifications that describe the components incorporated into different models of household equipment.","why":"制度や対象の事実を説明しているだけで、指定された立場を支える理由を示していない。"},{"t":"Governments should impose collection requirements on electronics manufacturers because making these companies responsible for collecting used devices is a measure that should be adopted.","why":"指定された立場を言い換えているだけで、なぜそうすべきかを説明していない。"},{"t":"Last spring, I returned an outdated tablet to its manufacturer, and the collection center sent me a receipt describing the recycling service it provided.","why":"特定の個人的な体験にとどまり、指定された立場を支える一般的な理由になっていない。"}],"answer":1,"point":"「資源」が政策によってどう変わるかを説明し、賛成の立場につながる因果関係を示す。","drive":{"ja":"政府は使用済み電子機器の回収を製造業者に義務づけるべきか。賛成の立場で、「資源」を使った一般的な理由を英語で一文述べてください。","en":"Mandatory collection conserves resources by enabling manufacturers to recover valuable metals from discarded devices, reducing their dependence on the extraction of raw materials."},"level":2,"explain":"主語は回収義務、動詞はconservesで、by句が手段、分詞句が結果を示す。dependence onで資源への依存を表し、政策効果を要約できる。別の言い方: Collection saves raw materials."},{"id":"p1-reason-006","q":"TOPIC: Should universities make all lectures available exclusively online?\nPosition: Disagree\nPOINT: Inequality\nChoose the general reason that supports the position using the specified POINT.","q_ja":"大学はすべての講義をオンラインのみで提供すべきか（反対）。指定の観点「格差」を使って、この立場を支える一般的な理由を選んでください。","choices":[{"t":"Moving all lectures online reduces inequality by allowing students living far from campus to participate without bearing the substantial expense of relocation.","why":"格差に触れているが、指定された立場と逆の理由になっている。"},{"t":"Exclusive online lectures may weaken academic interaction, as spontaneous discussions between students and instructors become harder to maintain through scheduled digital sessions.","why":"同じ政策に関する理由だが、指定された格差とは別の観点を述べている。"},{"t":"Online lectures are delivered through digital platforms, which universities incorporate into course catalogs alongside descriptions of assessment methods and required learning materials.","why":"制度や対象の事実を説明しているだけで、指定された立場を支える理由を示していない。"},{"t":"Universities should reject the exclusive online delivery of all lectures because offering every lecture through online platforms is an educational policy worth opposing.","why":"指定された立場を言い換えているだけで、なぜそうすべきかを説明していない。"},{"t":"Exclusive online provision could deepen inequality, since students lacking reliable internet connections or suitable study environments would face additional barriers to participation.","why":"正解。格差の観点から政策の影響を説明し、反対の立場を支える一般的な理由になっている。"},{"t":"When I attended an online economics lecture from my apartment last semester, construction noise interrupted my concentration during the discussion of international trade.","why":"特定の個人的な体験にとどまり、指定された立場を支える一般的な理由になっていない。"}],"answer":4,"point":"「格差」が政策によってどう変わるかを説明し、反対の立場につながる因果関係を示す。","drive":{"ja":"大学はすべての講義をオンラインのみで提供すべきか。反対の立場で、「格差」を使った一般的な理由を英語で一文述べてください。","en":"Exclusive online provision could deepen inequality, since students lacking reliable internet connections or suitable study environments would face additional barriers to participation."},"level":2,"explain":"主語はオンライン限定の提供、動詞はcould deepenで、since節が理由を示す。lackingが学生を修飾し、不利益を受ける層を論述で特定できる。別の言い方: Online-only classes may widen gaps."},{"id":"p1-reason-007","q":"TOPIC: Should local governments purchase food for public facilities from nearby producers?\nPosition: Agree\nPOINT: Resilience\nChoose the general reason that supports the position using the specified POINT.","q_ja":"自治体は公共施設向けの食料を近隣の生産者から購入すべきか（賛成）。指定の観点「供給体制の強さ」を使って、この立場を支える一般的な理由を選んでください。","choices":[{"t":"Relying on nearby producers weakens supply resilience when a regional crop failure affects multiple suppliers simultaneously, leaving public facilities with limited alternatives.","why":"供給体制の強さに触れているが、指定された立場と逆の理由になっている。"},{"t":"Purchasing food locally supports agricultural employment by providing nearby producers with predictable demand, helping smaller farms maintain their operations despite competitive market conditions.","why":"同じ政策に関する理由だが、指定された供給体制の強さとは別の観点を述べている。"},{"t":"Public facilities purchase food under procurement contracts, which specify delivery schedules and product categories for suppliers participating in local government purchasing programs.","why":"制度や対象の事実を説明しているだけで、指定された立場を支える理由を示していない。"},{"t":"Local purchasing strengthens supply resilience by reducing dependence on distant distribution networks, which may be disrupted by severe weather or fuel shortages.","why":"正解。供給体制の強さの観点から政策の影響を説明し、賛成の立場を支える一般的な理由になっている。"},{"t":"Local governments should source food for public facilities from nearby producers because adopting this purchasing approach is a municipal policy that deserves implementation.","why":"指定された立場を言い換えているだけで、なぜそうすべきかを説明していない。"},{"t":"After a storm delayed deliveries last autumn, I collected vegetables from a nearby farm for the community center where I was volunteering that week.","why":"特定の個人的な体験にとどまり、指定された立場を支える一般的な理由になっていない。"}],"answer":3,"point":"「供給体制の強さ」が政策によってどう変わるかを説明し、賛成の立場につながる因果関係を示す。","drive":{"ja":"自治体は公共施設向けの食料を近隣の生産者から購入すべきか。賛成の立場で、「供給体制の強さ」を使った一般的な理由を英語で一文述べてください。","en":"Local purchasing strengthens supply resilience by reducing dependence on distant distribution networks, which may be disrupted by severe weather or fuel shortages."},"level":3,"explain":"主語は地元での調達、動詞はstrengthensで、which節が流通網を補足する。by reducingで依存を減らす手段を示し、供給安定の仕組みを論述できる。別の言い方: Buying locally protects supply."},{"id":"p1-reason-008","q":"TOPIC: Should police be permitted to use facial recognition without independent approval?\nPosition: Disagree\nPOINT: Privacy\nChoose the general reason that supports the position using the specified POINT.","q_ja":"警察による顔認識技術の使用を独立機関の承認なしに認めるべきか（反対）。指定の観点「プライバシー」を使って、この立場を支える一般的な理由を選んでください。","choices":[{"t":"Without independent oversight, facial recognition threatens privacy by enabling authorities to track individuals across public spaces without demonstrating a legitimate investigative need.","why":"正解。プライバシーの観点から政策の影響を説明し、反対の立場を支える一般的な理由になっている。"},{"t":"Allowing police immediate access to facial recognition protects privacy by helping investigators identify relevant suspects without examining extensive personal records belonging to unrelated citizens.","why":"プライバシーに触れているが、指定された立場と逆の理由になっている。"},{"t":"Unrestricted facial recognition may undermine public confidence when inaccurate matches lead to wrongful questioning, damaging cooperation between police departments and the communities they serve.","why":"同じ政策に関する理由だが、指定されたプライバシーとは別の観点を述べている。"},{"t":"Facial recognition systems compare captured images with stored photographs, and police departments describe their technical equipment in documents concerning operational procedures and procurement.","why":"制度や対象の事実を説明しているだけで、指定された立場を支える理由を示していない。"},{"t":"Police should obtain independent approval before using facial recognition because allowing this technology to operate without such authorization is a practice that requires rejection.","why":"指定された立場を言い換えているだけで、なぜそうすべきかを説明していない。"},{"t":"During a visit to a railway station last year, I noticed a facial recognition camera and asked an officer about its stated operational purpose.","why":"特定の個人的な体験にとどまり、指定された立場を支える一般的な理由になっていない。"}],"answer":0,"point":"「プライバシー」が政策によってどう変わるかを説明し、反対の立場につながる因果関係を示す。","drive":{"ja":"警察による顔認識技術の使用を独立機関の承認なしに認めるべきか。反対の立場で、「プライバシー」を使った一般的な理由を英語で一文述べてください。","en":"Without independent oversight, facial recognition threatens privacy by enabling authorities to track individuals across public spaces without demonstrating a legitimate investigative need."},"level":3,"explain":"主語は facial recognition、動詞は threatens。Without句が監督のない条件を、by enabling以下が問題の仕組みを示す。別の言い方: Without independent oversight, facial recognition endangers privacy by allowing authorities to track people through public spaces without showing a legitimate investigative need."},{"id":"p1-reason-009","q":"TOPIC: Should governments invest more in restoring urban wetlands?\nPosition: Agree\nPOINT: Flooding\nChoose the general reason that supports the position using the specified POINT.","q_ja":"政府は都市部の湿地再生への投資を増やすべきか（賛成）。指定の観点「洪水」を使って、この立場を支える一般的な理由を選んでください。","choices":[{"t":"Restored wetlands could aggravate flooding if poorly planned projects obstruct existing drainage channels, preventing storm water from flowing efficiently away from residential areas.","why":"洪水に触れているが、指定された立場と逆の理由になっている。"},{"t":"Urban wetland restoration supports biodiversity by providing habitats for native species, which often struggle to survive in densely developed areas dominated by concrete surfaces.","why":"同じ政策に関する理由だが、指定された洪水とは別の観点を述べている。"},{"t":"Urban wetlands occupy land within municipal boundaries, and restoration proposals generally include maps showing project locations alongside existing roads, buildings, and drainage infrastructure.","why":"制度や対象の事実を説明しているだけで、指定された立場を支える理由を示していない。"},{"t":"Governments should increase investment in restoring urban wetlands because allocating additional public funds to these restoration projects is an environmental policy that merits support.","why":"指定された立場を言い換えているだけで、なぜそうすべきかを説明していない。"},{"t":"Following heavy rainfall last June, I photographed standing water near a restored wetland and submitted the images to the neighborhood association at its meeting.","why":"特定の個人的な体験にとどまり、指定された立場を支える一般的な理由になっていない。"},{"t":"Wetland restoration alleviates flooding by creating areas that absorb excess rainfall, thereby reducing pressure on drainage systems during periods of intense precipitation.","why":"正解。洪水の観点から政策の影響を説明し、賛成の立場を支える一般的な理由になっている。"}],"answer":5,"point":"「洪水」が政策によってどう変わるかを説明し、賛成の立場につながる因果関係を示す。","drive":{"ja":"政府は都市部の湿地再生への投資を増やすべきか。賛成の立場で、「洪水」を使った一般的な理由を英語で一文述べてください。","en":"Wetland restoration alleviates flooding by creating areas that absorb excess rainfall, thereby reducing pressure on drainage systems during periods of intense precipitation."},"level":3,"explain":"主語は Wetland restoration、動詞は alleviates。that節は雨水を吸収する区域を説明し、thereby reducing以下は排水設備の負荷が軽くなる結果を示す。別の言い方: Restoring wetlands reduces flooding by creating areas that absorb excess rainwater, thereby easing pressure on drainage systems during heavy rainfall."},{"id":"p1-reason-010","q":"TOPIC: Should public libraries eliminate their printed collections entirely?\nPosition: Disagree\nPOINT: Inclusion\nChoose the general reason that supports the position using the specified POINT.","q_ja":"公共図書館は印刷資料を全面的に廃止すべきか（反対）。指定の観点「包摂」を使って、この立場を支える一般的な理由を選んでください。","choices":[{"t":"Entirely digital collections promote inclusion by allowing residents with physical disabilities to borrow materials remotely, removing the need to travel to library buildings.","why":"包摂に触れているが、指定された立場と逆の理由になっている。"},{"t":"Eliminating printed collections may weaken cultural preservation because older publications without digital versions could disappear from community institutions that traditionally safeguard local historical records.","why":"同じ政策に関する理由だが、指定された包摂とは別の観点を述べている。"},{"t":"Eliminating printed collections undermines inclusion by excluding residents who lack digital skills, preventing them from independently accessing information through familiar and accessible formats.","why":"正解。包摂の観点から政策の影響を説明し、反対の立場を支える一般的な理由になっている。"},{"t":"Public libraries classify printed collections according to established cataloging systems, while digital materials appear in electronic databases maintained through contracts with publishing companies.","why":"制度や対象の事実を説明しているだけで、指定された立場を支える理由を示していない。"},{"t":"Public libraries should retain printed collections because completely eliminating printed materials from these institutions is an approach to library management that should be rejected.","why":"指定された立場を言い換えているだけで、なぜそうすべきかを説明していない。"},{"t":"When my local library removed several printed reference books last September, I borrowed an older encyclopedia from another branch to complete a family history project.","why":"特定の個人的な体験にとどまり、指定された立場を支える一般的な理由になっていない。"}],"answer":2,"point":"「包摂」が政策によってどう変わるかを説明し、反対の立場につながる因果関係を示す。","drive":{"ja":"公共図書館は印刷資料を全面的に廃止すべきか。反対の立場で、「包摂」を使った一般的な理由を英語で一文述べてください。","en":"Eliminating printed collections undermines inclusion by excluding residents who lack digital skills, preventing them from independently accessing information through familiar and accessible formats."},"level":2,"explain":"動名詞句が主語、underminesが動詞で、who節が住民を限定する。prevent＋人＋from＋動名詞で利用を妨げる結果を示し、弊害を論述できる。別の言い方: Removing print excludes some readers."},{"id":"p1-reason-201","q":"TOPIC: Should local governments subsidize bus services in rural areas?\nPosition: Agree\nPOINT: Access","q_ja":"地方自治体は地方のバス路線に補助金を出すべきか。賛成。観点は交通手段へのアクセス。","choices":[{"t":"Subsidies may preserve rural routes that require substantial public spending despite carrying relatively few passengers.","why":"利用者の少ない路線を公費で維持する負担を示し、補助金への反対理由になっている。"},{"t":"Financial support for rural buses could encourage operators to maintain services with limited ticket revenue.","why":"運賃収入という運営側の財政の観点で、住民のアクセスを説明していない。"},{"t":"Subsidized buses improve access to essential services for residents who cannot afford private vehicles.","why":"正解。車を持てない住民も必要なサービスを利用できるという一般的な利点を示している。"},{"t":"Rural bus services include routes connecting smaller communities with hospitals and administrative offices in nearby towns.","why":"路線の接続先を述べるだけで、補助金によってアクセスがどう改善するかを示していない。"},{"t":"Public transport subsidies could reduce operators' incentives to improve access for residents in remote communities.","why":"アクセス改善への意欲が弱まるという欠点で、反対の立場を支えている。"},{"t":"Replacing older rural buses with cleaner models would reduce emissions produced by local passenger transport.","why":"環境への効果であり、指定されたアクセスの観点を使っていない。"}],"answer":2,"point":"理由では、補助金によって誰のアクセスがどう改善するかを示す。","level":1,"drive":{"ja":"地方自治体は地方のバス路線に補助金を出すべきか。賛成。観点は交通手段へのアクセス。 この観点を使い、立場を支える一般的な理由を英語で述べてください。","en":"Subsidized buses improve access to essential services for residents who cannot afford private vehicles."},"explain":"Subsidized busesが主語、improveが動詞で、access toが利用できる対象を示す。who節は車を購入できない住民を限定する。別の言い方: Subsidized bus services make essential services more accessible to residents who cannot afford their own vehicles."},{"id":"p1-reason-202","q":"TOPIC: Should employers be allowed to monitor employees' computer screens continuously?\nPosition: Disagree\nPOINT: Privacy","q_ja":"雇用主が従業員の画面を常時監視することを認めるべきか。反対。観点はプライバシー。","choices":[{"t":"Continuous monitoring enables managers to identify unauthorized activities, thereby protecting confidential company information from being shared through personal accounts.","why":"機密情報の保護を利点としており、監視を認める賛成の理由になっている。"},{"t":"Introducing screen monitoring requires employers to purchase specialized software, increasing operating costs even before staff receive training on its use.","why":"導入費用の問題であり、従業員のプライバシー侵害を理由にしていない。"},{"t":"Workplace privacy policies sometimes describe how screen recordings are collected, stored, and reviewed by managers during internal investigations of employee conduct.","why":"規程に書かれる内容の説明だけで、常時監視に反対する理由を示していない。"},{"t":"Routine screen recording offers employers detailed evidence of employee activity, making compliance with restrictions on personal computer use easier to enforce.","why":"従業員の行動を把握できる利点を述べ、常時監視を支持する方向になっている。"},{"t":"Continuous screen monitoring may expose sensitive personal messages, undermining employees' privacy even when their performance fully meets the employer's professional expectations.","why":"正解。仕事上の問題がなくても私的な情報が露出する危険を示し、反対の理由になっている。"},{"t":"Managers could use recorded screen activity to compare individual working methods, allowing them to redesign training sessions for newly recruited staff members.","why":"研修改善という別の観点であり、プライバシーの保護を理由にしていない。"}],"answer":4,"point":"プライバシーを理由に反対するときは、監視によって露出する私的な情報に着目する。","level":2,"drive":{"ja":"雇用主が従業員の画面を常時監視することを認めるべきか。反対。観点はプライバシー。 この観点を使い、立場を支える一般的な理由を英語で述べてください。","en":"Continuous screen monitoring may expose sensitive personal messages, undermining employees' privacy even when their performance fully meets the employer's professional expectations."},"explain":"監視が主語で、may exposeが危険性、分詞句が結果、even when節が譲歩を表す。断定を避けつつ論述で弊害を示せる。別の言い方: Monitoring can violate staff privacy."},{"id":"p1-reason-203","q":"TOPIC: Should governments require suppliers to publish detailed cost breakdowns before bidding for public contracts?\nPosition: Disagree\nPOINT: Competition","q_ja":"政府調達の入札前に、供給業者へ詳細な原価内訳の公開を義務づけるべきか。反対。観点は競争。","choices":[{"t":"Requiring detailed cost disclosure before bidding could enable rival suppliers to anticipate one another's offers, weakening competition for public contracts and potentially inflating government expenditure.","why":"正解。入札前の原価公開が競合の応札額の予測を容易にし、価格競争を弱める可能性を示している。"},{"t":"Public disclosure of suppliers' costs could intensify competition by helping smaller businesses identify contracts for which their operating expenses would give them a substantial commercial advantage.","why":"小規模企業の参入を促す競争上の利点であり、公開義務への賛成理由になっている。"},{"t":"Detailed cost breakdowns distinguish expenditure on labor, materials, and administration, while public procurement documents describe the procedures governing competition among suppliers seeking the same government contract.","why":"文書に含まれる項目と手続の説明であり、公開義務が競争へ与える不利益を示していない。"},{"t":"Preparing detailed cost statements would impose additional administrative burdens on suppliers, diverting staff from production even where existing competition for government contracts remained at its current level.","why":"事務負担を挙げているが、競争への影響は据え置いており、指定された観点による理由ではない。"},{"t":"Publishing comparable cost information before bidding would allow procurement officials to challenge inflated estimates, strengthening competitive pressure on suppliers that previously benefited from limited financial scrutiny.","why":"見積もりへの検証が競争圧力を強めるという利点で、反対の立場を支えていない。"},{"t":"Mandatory publication could reveal commercially sensitive production methods to overseas manufacturers, reducing suppliers' returns on research even if rivalry within public procurement remained equally intense.","why":"研究投資の収益への影響であり、調達における競争が弱まる理由を示していない。"}],"answer":0,"point":"競争の理由では、情報公開の有無から企業間の価格競争への影響までをつなげる。","level":3,"drive":{"ja":"政府調達の入札前に、供給業者へ詳細な原価内訳の公開を義務づけるべきか。反対。観点は競争。 この観点を使い、立場を支える一般的な理由を英語で述べてください。","en":"Requiring detailed cost disclosure before bidding could enable rival suppliers to anticipate one another's offers, weakening competition for public contracts and potentially inflating government expenditure."},"explain":"Requiring以下の動名詞句が主語で、enable A toは競合企業が可能になる行動を示す。weakeningとinflatingは競争低下と政府支出増という結果を表す。別の言い方: Mandatory disclosure of detailed costs before bidding could let competing suppliers predict each other's bids, reducing competition for public contracts and possibly raising government spending."},{"id":"p1-reason-204","q":"TOPIC: Should governments fund insulation improvements in older homes?\nPosition: Agree\nPOINT: Energy","q_ja":"政府は古い住宅の断熱改修に資金を出すべきか。賛成。観点はエネルギー。","choices":[{"t":"Insulation grants require public spending that could otherwise support the construction of new energy facilities.","why":"公費の別の使い道を優先する内容で、断熱改修への支援に反対する方向になっている。"},{"t":"Public support for home insulation would create additional employment opportunities for local construction workers and suppliers.","why":"雇用の利点であり、指定されたエネルギーの観点ではない。"},{"t":"Older homes use various insulation materials in their walls, roofs, and floors to control indoor temperatures.","why":"断熱材の使用箇所の説明だけで、政府が資金を出す理由を示していない。"},{"t":"Installing insulation may involve energy use during manufacturing and transport, adding to the project's environmental burden.","why":"改修に伴うエネルギー負担を述べており、支援への賛成理由になっていない。"},{"t":"Housing improvement grants could increase property values, providing financial benefits for homeowners who later sell their homes.","why":"資産価値の上昇という別の観点で、エネルギー消費との関係を説明していない。"},{"t":"Better insulation reduces household energy consumption by limiting the heat that escapes through walls and roofs.","why":"正解。熱の流出を抑えてエネルギー消費を減らす一般的な効果を示している。"}],"answer":5,"point":"エネルギーの理由は、断熱性能の向上と消費量の減少を因果関係で結ぶ。","level":1,"drive":{"ja":"政府は古い住宅の断熱改修に資金を出すべきか。賛成。観点はエネルギー。 この観点を使い、立場を支える一般的な理由を英語で述べてください。","en":"Better insulation reduces household energy consumption by limiting the heat that escapes through walls and roofs."},"explain":"断熱性能が主語、reducesが動詞で、that節は熱を修飾する。by＋動名詞で削減の仕組みを示し、論述の理由を具体化する。別の言い方: Insulation saves energy by reducing heat loss."},{"id":"p1-reason-205","q":"TOPIC: Should universities make all undergraduate courses available exclusively online?\nPosition: Disagree\nPOINT: Interaction","q_ja":"大学は学部の全授業をオンラインのみで提供すべきか。反対。観点は交流。","choices":[{"t":"Online platforms facilitate interaction between students in different regions, allowing universities to connect learners whose perspectives might otherwise remain unfamiliar to one another.","why":"地域を超えた交流の利点を示しており、オンライン化への賛成理由になっている。"},{"t":"Replacing all classroom teaching with online courses may restrict spontaneous interaction, depriving students of informal discussions that often deepen their understanding of unfamiliar perspectives.","why":"正解。偶発的な交流が減り、多様な見方への理解を深める機会が失われるという反対理由を示している。"},{"t":"University learning platforms often combine discussion boards with video meetings, providing separate digital spaces where interaction takes place during scheduled classes and independent study.","why":"交流の手段を説明するだけで、全面オンライン化に反対する理由になっていない。"},{"t":"Maintaining online courses requires continuing investment in technical support, placing additional financial pressure on universities that have limited resources for maintaining their existing teaching services.","why":"運営費という別の観点であり、学生同士の交流への影響を示していない。"},{"t":"Digital discussion tools allow quieter students to prepare written contributions, widening participation in academic interaction beyond those who readily speak during traditional classroom debates.","why":"交流への参加を広げる利点であり、反対の立場を支えていない。"},{"t":"Courses delivered entirely online reduce the need for campus buildings, allowing universities to devote a greater proportion of their budgets to academic research and scholarships.","why":"施設費の節約という観点であり、交流を理由とした反対意見になっていない。"}],"answer":1,"point":"交流の量だけでなく、偶発的な対話から得られる学習機会にも着目する。","level":2,"drive":{"ja":"大学は学部の全授業をオンラインのみで提供すべきか。反対。観点は交流。 この観点を使い、立場を支える一般的な理由を英語で述べてください。","en":"Replacing all classroom teaching with online courses may restrict spontaneous interaction, depriving students of informal discussions that often deepen their understanding of unfamiliar perspectives."},"explain":"Replacing以下が主語で、may restrictは自発的交流が制限される可能性を示す。deprive A of Bは学生から理解を深める議論の機会を奪うことを表す。別の言い方: Moving all classroom teaching online may limit spontaneous exchanges and deny students informal discussions that often help them understand unfamiliar viewpoints."},{"id":"p1-reason-206","q":"TOPIC: Should governments replace most competitive research grants with equal funding for every research institution?\nPosition: Disagree\nPOINT: Innovation","q_ja":"政府は競争的研究助成の大半を、全研究機関への均等配分に置き換えるべきか。反対。観点は革新。","choices":[{"t":"Equal allocations could sustain unconventional investigations overlooked by grant committees, enabling institutions to pursue innovations whose commercial or scientific value is initially difficult to demonstrate convincingly.","why":"審査で見落とされる革新を支える利点であり、均等配分への賛成理由になっている。"},{"t":"Distributing research budgets equally would simplify administrative procedures for funding agencies, reducing the resources devoted to evaluating proposals even if institutions' capacity for innovation remained broadly unchanged.","why":"審査事務の効率化を述べており、革新への悪影響を理由にしていない。"},{"t":"Competitive grants involve assessments of proposed methods and anticipated outcomes, whereas equal institutional allocations distribute available research funds according to the number of organizations eligible for support.","why":"二つの配分方式の説明だけで、均等配分が革新を妨げる理由を示していない。"},{"t":"Allocating funding equally could leave promising but resource-intensive projects underfunded, limiting innovation where scientific breakthroughs depend on equipment beyond the reach of an institution's standard allocation.","why":"正解。均等配分では有望でも高額な設備を要する研究の資金が不足し、革新が妨げられる可能性を示している。"},{"t":"Replacing competitive awards with predictable institutional funding could encourage researchers to undertake innovative projects whose uncertain outcomes make them difficult to justify within conventional grant application procedures.","why":"不確実な研究を継続できる革新上の利点であり、置き換えを支持している。"},{"t":"Equal funding would reduce financial differences between established and newer institutions, promoting fairness in public support even where the overall rate of scientific innovation did not noticeably change.","why":"機関間の公平性という観点であり、革新への不利益を説明していない。"}],"answer":3,"point":"革新への影響は、配分の公平さと区別し、有望な研究に必要な資源が届くかで考える。","level":3,"drive":{"ja":"政府は競争的研究助成の大半を、全研究機関への均等配分に置き換えるべきか。反対。観点は革新。 この観点を使い、立場を支える一般的な理由を英語で述べてください。","en":"Allocating funding equally could leave promising but resource-intensive projects underfunded, limiting innovation where scientific breakthroughs depend on equipment beyond the reach of an institution's standard allocation."},"explain":"均等配分が主語で、分詞句が結果、where節が革新の制限される状況を示す。leave＋目的語＋補語で資金不足の状態を論じる。別の言い方: Equal funding may hinder costly research."},{"id":"p1-reason-207","q":"TOPIC: Should governments offer free language courses to newly arrived immigrants?\nPosition: Agree\nPOINT: Employment","q_ja":"政府は新たに来た移民へ無料の語学講座を提供すべきか。賛成。観点は雇用。","choices":[{"t":"Language courses improve immigrants' employment prospects by helping them communicate effectively with potential employers and colleagues.","why":"正解。言語能力の向上が採用や職場での意思疎通を助け、就業機会を広げると説明している。"},{"t":"Free language courses require government funding that might otherwise support employment services for existing local residents.","why":"既存住民向けの雇用支援との予算競合を挙げ、講座への反対理由になっている。"},{"t":"Language programs for immigrants include classroom instruction, written exercises, and discussions about communication in various employment settings.","why":"授業内容を述べるだけで、無料提供によって就業がどう改善するかを示していない。"},{"t":"Providing language instruction could help newcomers understand public notices and participate more fully in neighborhood cultural events.","why":"地域参加の利点であり、指定された雇用の観点を使っていない。"},{"t":"Attending lengthy language programs may delay immigrants' entry into employment and reduce their immediate opportunities to earn income.","why":"就業開始の遅れという欠点であり、無料講座の提供に賛成する理由ではない。"},{"t":"Offering free language lessons would help immigrant families understand school communications and discuss educational matters with their children's teachers.","why":"子どもの教育に関する利点で、移民本人の雇用への効果を説明していない。"}],"answer":0,"point":"雇用を理由にするときは、語学学習と採用や職場での意思疎通を結ぶ。","level":1,"drive":{"ja":"政府は新たに来た移民へ無料の語学講座を提供すべきか。賛成。観点は雇用。 この観点を使い、立場を支える一般的な理由を英語で述べてください。","en":"Language courses improve immigrants' employment prospects by helping them communicate effectively with potential employers and colleagues."},"explain":"語学講座が主語、improveが動詞で、by句が手段を示す。help＋人＋動詞原形で就業支援の仕組みを示し、賛成理由を補強する。別の言い方: Language training helps immigrants find work."},{"id":"p1-reason-208","q":"TOPIC: Should cities ban private cars from their central shopping districts?\nPosition: Agree\nPOINT: Pollution","q_ja":"都市は中心部の商業地区で自家用車の通行を禁止すべきか。賛成。観点は汚染。","choices":[{"t":"Restrictions on private cars may divert traffic onto surrounding residential streets, increasing pollution exposure among households located outside the central shopping district.","why":"周辺住宅地への汚染の移転という欠点であり、禁止への反対理由になっている。"},{"t":"Removing private cars would create additional space for outdoor markets, allowing retailers to display goods and attract pedestrians to central shopping streets.","why":"商業空間の活用という利点で、汚染への効果を示していない。"},{"t":"Urban pollution surveys sometimes record vehicle emissions at roadside monitoring stations situated near major intersections within central shopping districts and neighboring residential areas.","why":"測定場所の説明だけであり、自家用車を禁止する理由を示していない。"},{"t":"Traffic restrictions could lengthen delivery routes for local businesses, raising operating costs for shops that depend on frequent shipments of fresh products and supplies.","why":"配送費用という別の観点で、汚染を理由とした賛成意見になっていない。"},{"t":"Excluding private cars would reduce exhaust pollution in busy shopping areas, improving air quality for pedestrians and staff who spend long hours there.","why":"正解。排気による汚染が減り、歩行者や従業員が吸う空気が改善するという理由になっている。"},{"t":"A ban on private cars could increase reliance on older diesel buses, potentially worsening local pollution unless cities also improved the vehicles serving central routes.","why":"代替バスによる汚染悪化の懸念であり、禁止の利点を述べていない。"}],"answer":4,"point":"汚染の理由では、車の排気の減少から空気の質の改善までを説明する。","level":2,"drive":{"ja":"都市は中心部の商業地区で自家用車の通行を禁止すべきか。賛成。観点は汚染。 この観点を使い、立場を支える一般的な理由を英語で述べてください。","en":"Excluding private cars would reduce exhaust pollution in busy shopping areas, improving air quality for pedestrians and staff who spend long hours there."},"explain":"車の排除が主語、would reduceが述語で、分詞句が結果を示す。wouldで政策実施時の効果を予測し、論述で利点を述べる。別の言い方: Banning cars would improve local air quality."},{"id":"p1-reason-209","q":"TOPIC: Should public agencies rely exclusively on automated systems to decide eligibility for welfare benefits?\nPosition: Disagree\nPOINT: Accountability","q_ja":"公的機関は福祉給付の受給資格の判断を自動化システムだけに委ねるべきか。反対。観点は説明責任。","choices":[{"t":"Automated eligibility checks could reduce variations between individual caseworkers, strengthening accountability by generating consistent records of how the same formal criteria were applied across different applications.","why":"判断記録の統一が説明責任を強める利点を述べており、全面自動化への賛成理由になっている。"},{"t":"Replacing caseworkers with automated processing could lower administrative expenditure, releasing funds for additional benefits even if the agency's arrangements for explaining disputed decisions remained exactly as before.","why":"行政費用の削減という観点であり、判断の説明責任に関する反対理由ではない。"},{"t":"Exclusive reliance on automated decisions could obscure who must justify outcomes, weakening accountability when applicants need an official to explain and take responsibility for benefit refusals.","why":"正解。給付拒否の根拠を説明して責任を負う担当者が不明確になる危険を示し、反対の理由になっている。"},{"t":"Welfare agencies maintain eligibility criteria and appeal procedures, while their accountability frameworks specify reporting arrangements for officials involved in reviewing decisions made through manual or automated assessment processes.","why":"制度の構成要素を述べるだけで、全面自動化が説明責任を弱める理由を示していない。"},{"t":"Automated systems could strengthen accountability by preserving detailed decision logs, allowing auditors to trace which eligibility rules produced a refusal without depending on a caseworker's recollection of individual applications.","why":"記録による検証可能性という利点で、全面自動化への反対意見を支えていない。"},{"t":"Automated assessments may overlook unusual household circumstances, excluding vulnerable applicants whose needs fall outside standard categories even where officials remain clearly responsible for explaining and reviewing each resulting decision.","why":"個別事情への対応という観点であり、説明責任は確保されているため指定の理由になっていない。"}],"answer":2,"point":"説明責任では、判断の正確さに加え、誰が根拠を説明し責任を負うかを確認する。","level":3,"drive":{"ja":"公的機関は福祉給付の受給資格の判断を自動化システムだけに委ねるべきか。反対。観点は説明責任。 この観点を使い、立場を支える一般的な理由を英語で述べてください。","en":"Exclusive reliance on automated decisions could obscure who must justify outcomes, weakening accountability when applicants need an official to explain and take responsibility for benefit refusals."},"explain":"Exclusive relianceが主語で、who節は誰が結果を正当化すべきかというobscureの目的語になる。weakening以下は、給付拒否への説明と責任が必要な場面で説明責任が弱まる結果を示す。別の言い方: Relying solely on automated decisions could make responsibility unclear and weaken accountability when applicants need an official to explain and answer for a benefit refusal."},{"id":"p1-reason-210","q":"TOPIC: Should municipalities replace all staffed public service counters with online applications?\nPosition: Disagree\nPOINT: Equality","q_ja":"自治体は有人の行政窓口をすべてオンライン申請に置き換えるべきか。反対。観点は平等。","choices":[{"t":"Online applications promote equality by allowing distant residents to request public services without traveling to municipal offices.","why":"遠方の住民の利用機会を広げる利点であり、オンラインへの置き換えを支持している。"},{"t":"Removing staffed counters would undermine equality by excluding residents who lack internet access or basic digital skills.","why":"正解。ネット環境や操作能力による利用機会の格差を示し、全面移行への反対理由になっている。"},{"t":"Municipal application systems contain forms for public services, while staffed counters provide locations for submitting similar official documents.","why":"申請手段の説明だけであり、平等の観点から全面移行に反対する理由になっていない。"},{"t":"Closing service counters would reduce administrative costs by allowing municipalities to employ fewer staff in public buildings.","why":"行政費用の節約という観点で、平等を理由とする反対意見になっていない。"},{"t":"Digital applications could improve equality for workers whose schedules prevent them from visiting offices during regular opening hours.","why":"勤務時間による不利を減らす利点で、置き換えへの賛成理由になっている。"},{"t":"Maintaining online application systems may create additional security risks when municipalities store sensitive personal records on external computer networks.","why":"情報管理の危険という別の観点であり、利用機会の平等を理由にしていない。"}],"answer":1,"point":"平等を理由にするときは、制度の変更で利用から取り残される人に着目する。","level":1,"drive":{"ja":"自治体は有人の行政窓口をすべてオンライン申請に置き換えるべきか。反対。観点は平等。 この観点を使い、立場を支える一般的な理由を英語で述べてください。","en":"Removing staffed counters would undermine equality by excluding residents who lack internet access or basic digital skills."},"explain":"Removing staffed countersが主語で、would undermineが平等への悪影響を表す。by excluding以下は、ネット接続や基本的な操作技能を欠く住民が排除される仕組みを示す。別の言い方: Eliminating staffed service counters would harm equality by shutting out residents without internet access or basic digital skills."},{"id":"p1-reason-211","q":"TOPIC: Should public libraries extend their evening opening hours?\nPosition: Agree\nPOINT: Access","q_ja":"公立図書館は夜間の開館時間を延ばすべきか。立場：賛成。指定観点：利用のしやすさ。","level":1,"choices":[{"t":"Longer evening hours increase staffing costs, placing additional pressure on public library budgets.","why":"人件費という別の観点であり、利用のしやすさを使った理由ではない。"},{"t":"Public libraries list their evening opening hours alongside access information on their official websites.","why":"開館時間の掲載という事実だけで、時間延長を支持する理由がない。"},{"t":"Extended evening hours improve access to library resources for residents who work during the day.","why":"正解。日中働く住民も資料を利用しやすくなるため、指定観点から賛成を支えている。"},{"t":"Evening access to library collections is available at several branches throughout the local district.","why":"現在の利用状況を述べるだけで、時間を延ばす利点を説明していない。"},{"t":"Later closing times reduce access for morning visitors when libraries compensate by opening later.","why":"午前の利用が難しくなるという欠点で、賛成とは逆の理由になっている。"},{"t":"Residents with limited evening transport may lose reliable access if library services shift toward nighttime.","why":"夜間中心の運営による利用上の不利益を述べており、賛成を支えていない。"}],"answer":2,"point":"指定観点が利用のしやすさなら、誰が利用しやすくなるかを理由に含める。","drive":{"ja":"公立図書館の夜間開館時間の延長に賛成する理由を、利用のしやすさの観点から英語で述べてください。","en":"Extended evening hours improve access to library resources for residents who work during the day."},"explain":"開館時間が主語、improveが動詞で、who節が住民を限定する。access toで利用対象を示し、施策の利点を論じる。別の言い方: Later hours make libraries more accessible."},{"id":"p1-reason-212","q":"TOPIC: Should welfare agencies allow automated systems to make final benefit decisions without human review?\nPosition: Disagree\nPOINT: Accountability","q_ja":"福祉機関は、人による確認なしで自動システムに給付の最終判断を任せるべきか。立場：反対。指定観点：説明責任。","level":3,"choices":[{"t":"Automated systems record each stage of benefit assessment, creating detailed administrative records that agencies retain alongside documents describing their internal accountability procedures for welfare decisions.","why":"記録や手続きの存在という事実だけで、人による確認が必要な理由を示していない。"},{"t":"Standardized automated assessments strengthen accountability by ensuring that identical eligibility rules are applied consistently, regardless of which official would otherwise review an individual welfare application.","why":"一貫した判断を説明責任上の利点として挙げており、自動化に反対する立場とは逆である。"},{"t":"Processing welfare applications automatically reduces administrative expenditure, allowing agencies to redirect limited financial resources toward other public services without expanding their existing teams of caseworkers.","why":"支出削減という別の観点であり、説明責任を使って反対する理由ではない。"},{"t":"Accountability for automated welfare decisions appears in agency guidance, which describes the responsibilities assigned to software providers and public officials during the benefit assessment process.","why":"指針の内容を説明するだけで、人による確認を残す必要性にはつながっていない。"},{"t":"Removing human review weakens accountability because applicants denied benefits may struggle to identify an official responsible for explaining and correcting errors in automated eligibility assessments.","why":"正解。誤判断の説明や訂正に責任を持つ担当者が不明確になることを、反対の理由にしている。"},{"t":"Assigning responsibility to a central software team improves accountability, since agencies gain a single contact for investigating disputed decisions instead of consulting numerous individual caseworkers.","why":"責任の集約を自動化の利点としているため、反対ではなく賛成を支える内容である。"}],"answer":4,"point":"記録の存在と説明責任の確保を区別し、誤判断の説明や訂正を誰が担うかを考える。","drive":{"ja":"福祉給付の最終判断を人の確認なしで自動化することに反対する理由を、説明責任の観点から英語で述べてください。","en":"Removing human review weakens accountability because applicants denied benefits may struggle to identify an official responsible for explaining and correcting errors in automated eligibility assessments."},"explain":"動名詞句が主語で、because節が説明責任の弱まる理由を示す。struggle toは困難を表し、制度の問題点を論じるのに使える。別の言い方: Human review helps ensure accountability."},{"id":"p1-reason-213","q":"TOPIC: Should cities charge households for water according to their actual consumption?\nPosition: Agree\nPOINT: Conservation","q_ja":"都市は家庭の実際の使用量に応じて水道料金を課すべきか。立場：賛成。指定観点：資源の節約。","level":2,"choices":[{"t":"Charging households according to consumption promotes water conservation by giving residents a financial incentive to repair leaks and avoid unnecessary use.","why":"正解。使用量に応じた料金が節水の動機になるという因果関係で、賛成を支えている。"},{"t":"Water conservation programs often include household meters, which record consumption and provide figures used by municipal authorities when preparing regular bills.","why":"計量や請求の仕組みを説明する事実だけで、この料金制度を支持する理由にはなっていない。"},{"t":"Household conservation efforts may weaken under consumption charges if residents regard paying their bills as sufficient justification for maintaining wasteful habits.","why":"料金を払えばよいと考えて節水が弱まるという欠点で、賛成とは逆の理由である。"},{"t":"Consumption charges provide municipal water suppliers with revenue that helps cover the operating expenses of treatment facilities and the salaries of maintenance staff.","why":"事業費の確保という別の観点であり、資源の節約を使った理由ではない。"},{"t":"Municipal water bills display consumption figures together with conservation advice, including instructions for reading meters and reporting suspected leaks to local authorities.","why":"請求書に載る情報という事実のみで、使用量に応じた課金の利点を説明していない。"},{"t":"Consumption charges may discourage essential water use among poorer households, undermining their welfare even when further conservation would offer limited environmental benefits.","why":"生活に必要な水まで控えるおそれを指摘しており、賛成する立場を支えていない。"}],"answer":0,"point":"使用量に応じた料金が節水行動を促すという、制度から効果へのつながりを押さえる。","drive":{"ja":"使用量に応じた家庭の水道料金に賛成する理由を、資源の節約の観点から英語で述べてください。","en":"Charging households according to consumption promotes water conservation by giving residents a financial incentive to repair leaks and avoid unnecessary use."},"explain":"動名詞句が主語、promotesが動詞で、by以下が手段を示す。incentive toは行動の動機を表し、政策の効果を説明できる。別の言い方: Usage-based fees encourage water saving."},{"id":"p1-reason-214","q":"TOPIC: Should local governments increase funding for regional museums?\nPosition: Agree\nPOINT: Tourism","q_ja":"地方自治体は地域の博物館への資金援助を増やすべきか。立場：賛成。指定観点：観光。","level":1,"choices":[{"t":"Regional museums include tourism figures in annual reports submitted to their local government offices.","why":"報告書に観光の数値が載るという事実だけで、増額を支持する理由ではない。"},{"t":"Additional museum funding supports educational programs that help local children understand their cultural heritage.","why":"地域の子どもの教育という別の観点であり、観光を使った理由ではない。"},{"t":"Museum funding for tourism campaigns may divert visitors from other attractions within the same region.","why":"地域内で観光客を奪い合う欠点を示しており、資金援助の増額を支えていない。"},{"t":"Tourism officers and museum directors discuss regional visitor numbers at meetings held every spring.","why":"会議で何を話すかという事実のみで、資金援助を増やす効果がない。"},{"t":"Expensive museum projects may burden local taxpayers without attracting enough tourism to justify public spending.","why":"観光効果に見合わない支出という問題で、賛成とは逆の理由である。"},{"t":"Better museum exhibitions encourage tourism, attracting visitors who also spend money at nearby businesses.","why":"正解。展示の充実が観光客と周辺の消費を増やすため、観光の観点から賛成を支えている。"}],"answer":5,"point":"観光という指定観点では、来訪者を呼び込む効果を資金援助の理由にする。","drive":{"ja":"地域の博物館への資金援助の増額に賛成する理由を、観光の観点から英語で述べてください。","en":"Better museum exhibitions encourage tourism, attracting visitors who also spend money at nearby businesses."},"explain":"展示が主語、encourageが動詞で、attracting以下は結果を示す。who節で消費も補足し、論述で効果を具体化する。別の言い方: Better exhibits draw visitors who spend locally."},{"id":"p1-reason-215","q":"TOPIC: Should governments extend patent protection for prescription medicines?\nPosition: Disagree\nPOINT: Affordability","q_ja":"政府は処方薬の特許保護期間を延長すべきか。立場：反対。指定観点：価格の手頃さ。","level":3,"choices":[{"t":"Extending pharmaceutical patents encourages investment in treatments for neglected conditions, giving companies additional time to recover research expenditure before competing manufacturers enter the same market.","why":"研究投資の促進という別の観点であり、価格の手頃さを使って反対する理由ではない。"},{"t":"Longer patent protection undermines affordability by delaying competition from generic medicines, leaving patients dependent on higher prices for treatments that have no readily available substitutes.","why":"正解。後発薬との競争が遅れ、高価格の薬に頼らざるを得なくなることを反対の理由にしている。"},{"t":"Affordability assessments for patented medicines compare treatment prices with household income, while patent registers separately indicate when competing manufacturers may begin marketing equivalent generic products.","why":"価格評価と特許登録の仕組みという事実だけで、保護期間延長の不利益を説明していない。"},{"t":"Extending patent protection improves affordability when manufacturers use additional revenue to subsidize medicines for poorer patients, reducing what those patients pay throughout the extended protection period.","why":"患者の負担軽減という延長の利点を述べており、反対の立場とは逆である。"},{"t":"Medicine affordability features in parliamentary debates about patent duration, alongside discussions of research incentives, public insurance expenditure, and the timing of entry by generic manufacturers.","why":"議論される項目を並べた事実であり、価格がどう変わるかという理由がない。"},{"t":"Longer pharmaceutical patents support affordability by funding discounts negotiated with public insurers, enabling covered patients to obtain medicines at lower prices during the additional protection period.","why":"延長が価格を下げるという賛成側の理由であり、指定された反対の立場に合わない。"}],"answer":1,"point":"同じ価格の観点でも、競争の遅れによる負担増と値引きによる負担減では支える立場が逆になる。","drive":{"ja":"処方薬の特許保護期間の延長に反対する理由を、価格の手頃さの観点から英語で述べてください。","en":"Longer patent protection undermines affordability by delaying competition from generic medicines, leaving patients dependent on higher prices for treatments that have no readily available substitutes."},"explain":"特許保護が主語、underminesが動詞で、leaving以下が結果を示す。by＋動名詞で悪影響の仕組みを説明できる。別の言い方: Longer patents delay access to cheaper generics."},{"id":"p1-reason-216","q":"TOPIC: Should more employers introduce a shorter working week without reducing pay?\nPosition: Agree\nPOINT: Productivity","q_ja":"賃金を減らさずに週の労働時間を短縮する雇用主は増えるべきか。立場：賛成。指定観点：生産性。","level":2,"choices":[{"t":"Employers assessing a shorter working week often collect productivity data alongside attendance records before deciding whether to continue their experimental schedules.","why":"試行時に集める資料という事実だけで、労働時間短縮を支持する理由ではない。"},{"t":"Shorter working weeks may reduce productivity when employees must handle frequent interruptions while completing the same assignments within a more restricted schedule.","why":"生産性が下がるおそれを示しており、賛成の立場とは逆の理由である。"},{"t":"Maintaining salaries during a shorter working week helps employees cover household expenses while allowing them additional time for family responsibilities and community activities.","why":"家計や生活の利点という別の観点であり、生産性への効果を説明していない。"},{"t":"A shorter working week may enhance productivity by reducing fatigue, enabling employees to concentrate more effectively while carrying out their professional responsibilities.","why":"正解。疲労の軽減が集中力を高めるというつながりで、生産性の観点から賛成を支えている。"},{"t":"Productivity reports from workplace trials contain figures for completed tasks, together with descriptions of the schedules adopted by each participating department.","why":"報告書の内容という事実のみで、短縮によって生産性が上がるとは述べていない。"},{"t":"Reducing weekly hours without adjusting workloads may weaken productivity, as rushed employees make errors that require additional effort to identify and correct.","why":"急いで作業すると修正が増えるという欠点であり、賛成を支える理由ではない。"}],"answer":3,"point":"労働時間そのものではなく、疲労や集中力を通じた生産性への効果を理由にする。","drive":{"ja":"賃金を維持した週の労働時間短縮に賛成する理由を、生産性の観点から英語で述べてください。","en":"A shorter working week may enhance productivity by reducing fatigue, enabling employees to concentrate more effectively while carrying out their professional responsibilities."},"explain":"短い労働週が主語で、enabling以下は結果、while以下は働く間を示す。mayで効果を断定せず、慎重に利点を論じる。別の言い方: Shorter weeks may help staff focus better."},{"id":"p1-reason-217","q":"TOPIC: Should public transport operators stop accepting cash payments?\nPosition: Disagree\nPOINT: Inclusion","q_ja":"公共交通の運営事業者は現金での支払いの受付をやめるべきか。立場：反対。指定観点：包摂。","level":1,"choices":[{"t":"Retaining cash payments promotes inclusion by allowing passengers without bank accounts to use public transport.","why":"正解。銀行口座を持たない人も利用できることを、
