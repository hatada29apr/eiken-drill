<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>英検脳筋トレ</title>
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="英検脳筋トレ">
<meta name="theme-color" content="#ffffff">
<meta name="color-scheme" content="light">
<style>
  /* 令和の上質: 深い藍のグラデーション＋元気のオレンジ。問題文は白地に黒 */
  :root {
    color-scheme: light;
    --bg: #f6f7fb; --card: #ffffff; --ink: #0b1020; --sub: #5d6578; --faint: #9aa1b2; --line: #eceef4;
    --navy1: #141a46; --navy2: #2b3aa8; --indigo: #3b4fd8; --indigo-soft: #eef0ff;
    --orange1: #ff5f3a; --orange2: #ffa41b; --gold: #f5b83d;
    --ok: #12855a; --okbg: #e8f7ef; --ng: #d23b3b; --ngbg: #fdeeee;
    --r: 18px; --shadow: 0 1px 2px rgba(17,24,61,.05), 0 10px 28px rgba(17,24,61,.07);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased; font-feature-settings: "palt"; }
  body { padding-top: env(safe-area-inset-top); }
  button { font-family: inherit; cursor: pointer; }
  svg.ic { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  /* ヘッダー */
  header.bar { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 10px; padding: 10px 16px;
    background: rgba(246,247,251,.82); backdrop-filter: saturate(180%) blur(16px); -webkit-backdrop-filter: saturate(180%) blur(16px); }
  .logo { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; }
  .logo .mark { width: 30px; height: 30px; border-radius: 9px; background: linear-gradient(135deg, var(--navy1), var(--indigo)); color: #fff;
    display: grid; place-items: center; font-weight: 900; font-size: 15px; box-shadow: 0 4px 12px rgba(43,58,168,.35); }
  .logo b { font-size: 16px; font-weight: 800; letter-spacing: .01em; white-space: nowrap; }
  .logo img { height: 42px; width: auto; display: block; }
  /* キャラクター */
  .mascot { position: absolute; right: -6px; bottom: -8px; width: 132px; height: auto; z-index: 1; filter: drop-shadow(0 8px 18px rgba(0,0,0,.35)); pointer-events: none; }
  .hero .goal, .hero .ttl, .hero .hi { position: relative; z-index: 2; }
  .hero .meta { max-width: calc(100% - 210px); }
  .bubble { position: relative; display: inline-block; background: #fff; color: var(--ink); border-radius: 14px; padding: 8px 12px; font-size: 13.5px; font-weight: 700; box-shadow: var(--shadow); }
  .coach { display: flex; align-items: flex-end; gap: 8px; margin: 6px 0 0; }
  .coach img { width: 74px; height: auto; flex: none; }
  /* キャラクター */
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
  @keyframes flex { 0% { transform: scale(1) rotate(0); } 25% { transform: scale(1.14) rotate(-7deg); } 55% { transform: scale(1.1) rotate(7deg); } 100% { transform: scale(1) rotate(0); } }
  @keyframes jump { 0% { transform: translateY(0) scale(1); } 35% { transform: translateY(-16px) scale(1.1); } 70% { transform: translateY(2px) scale(.97); } 100% { transform: translateY(0) scale(1); } }
  @keyframes shake { 0%, 100% { transform: translateX(0) rotate(0); } 20% { transform: translateX(-6px) rotate(-5deg); } 40% { transform: translateX(6px) rotate(5deg); } 60% { transform: translateX(-4px) rotate(-3deg); } 80% { transform: translateX(4px) rotate(3deg); } }
  @keyframes popIn { 0% { transform: scale(.2); opacity: 0; } 70% { transform: scale(1.12); opacity: 1; } 100% { transform: scale(1); } }
  @keyframes evoOut { 0% { transform: scale(1); filter: none; opacity: 1; } 60% { transform: scale(1.1); filter: brightness(4) saturate(0); opacity: 1; } 100% { transform: scale(.6); filter: brightness(6); opacity: 0; } }
  @keyframes evoIn { 0% { transform: scale(.4); filter: brightness(6); opacity: 0; } 55% { transform: scale(1.18); filter: brightness(2.4); opacity: 1; } 100% { transform: scale(1); filter: none; opacity: 1; } }
  @keyframes rays { from { transform: rotate(0); } to { transform: rotate(360deg); } }
  .chara { display: block; width: 100%; height: auto; user-select: none; -webkit-user-drag: none; }
  .hero .chara-wrap { position: absolute; right: 0; bottom: 8px; width: 116px; z-index: 1; cursor: pointer; }
  .hero .chara-wrap .chara { animation: bob 2.6s ease-in-out infinite; filter: drop-shadow(0 10px 16px rgba(0,0,0,.35)); }
  .chara.flex { animation: flex .7s ease-in-out !important; }
  .hero .say { position: absolute; right: 12px; top: 12px; z-index: 3; max-width: 190px; background: #fff; color: var(--ink); font-size: 12.5px; font-weight: 800;
    border-radius: 14px 14px 4px 14px; padding: 7px 10px; box-shadow: 0 6px 18px rgba(0,0,0,.25); animation: popIn .3s ease-out; }
  .xpbar { position: relative; z-index: 2; margin-top: 14px; max-width: calc(100% - 118px); }
  .xpbar .lab { display: flex; justify-content: space-between; font-size: 11.5px; font-weight: 800; opacity: .9; margin-bottom: 4px; }
  .xpbar .tr { height: 8px; border-radius: 4px; background: rgba(255,255,255,.18); overflow: hidden; }
  .xpbar .tr i { display: block; height: 100%; border-radius: 4px; background: linear-gradient(90deg, #ffd23f, #ff7a3a); transition: width .8s ease-out; }
  .react { width: 46px; flex: none; margin: -6px 0 -6px -4px; }
  .react .chara.jump { animation: jump .6s ease-out; }
  .react .chara.shake { animation: shake .5s ease-in-out; }
  .gain { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 6px 0 2px; font-weight: 900; color: var(--orange1); font-size: 18px; }
  .lvup { text-align: center; font-weight: 900; font-size: 17px; color: var(--navy2); background: linear-gradient(90deg, #fff3d6, #ffe0c2, #fff3d6); border-radius: 14px; padding: 10px; margin: 8px 0; animation: popIn .4s ease-out; }
  .evo { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; text-align: center; color: #fff;
    background: radial-gradient(circle at 50% 42%, #3b4fd8 0%, #141a46 60%, #070a1f 100%); padding: 24px; }
  .evo .rays { position: absolute; left: 50%; top: 40%; width: 760px; height: 760px; margin: -380px 0 0 -380px; opacity: .35;
    background: repeating-conic-gradient(from 0deg, rgba(255,196,60,.9) 0deg 6deg, transparent 6deg 20deg); border-radius: 50%; animation: rays 14s linear infinite;
    -webkit-mask-image: radial-gradient(circle, #000 15%, transparent 70%); mask-image: radial-gradient(circle, #000 15%, transparent 70%); }
  .evo .stage { position: relative; width: 240px; height: 240px; margin: 0 auto; }
  .evo .stage img { position: absolute; inset: 0; }
  .evo .old { animation: evoOut 1.1s ease-in forwards; }
  .evo .new { opacity: 0; animation: evoIn 1s ease-out 1s forwards; }
  .evo h3 { position: relative; font-size: 24px; margin: 18px 0 4px; }
  .evo p { position: relative; margin: 0 0 18px; opacity: .85; }
  .evo .big { position: relative; max-width: 320px; margin: 0 auto; }
  .stages { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; text-align: center; font-size: 10.5px; font-weight: 700; color: var(--sub); }
  .stages .lock .chara { filter: brightness(0) opacity(.18); }
  .stages .now { color: var(--orange1); }
  .stages .now .chara { animation: bob 2.6s ease-in-out infinite; }
  .pick { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 10px; }
  .pick button { border: 2px solid transparent; background: #fff; border-radius: 16px; padding: 8px 6px; box-shadow: var(--shadow); font-size: 12.5px; font-weight: 800; color: var(--ink); }
  .pick button.on { border-color: var(--indigo); background: var(--indigo-soft); }
  .intro { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; }
  .intro b { font-size: 16px; } .intro span { grid-column: 1; color: var(--sub); font-size: 13.5px; line-height: 1.6; }
  .intro .chipbtn { grid-row: 1 / span 2; grid-column: 2; }
  .chipbtn { display: inline-flex; align-items: center; gap: 4px; border: 0; background: var(--indigo-soft); color: var(--indigo); border-radius: 999px; padding: 8px 12px; font-weight: 800; font-size: 13.5px; }
  .chipbtn svg { width: 16px; height: 16px; }
  .examcard small { line-height: 1.6; }
  /* 本番形式 */
  .exam .sit { margin: 0 0 8px; font-size: 16px; line-height: 1.6; }
  .exam .qq { margin: 0; font-size: 17px; font-weight: 700; line-height: 1.55; }
  .exam .tag { display: inline-block; font-size: 11px; font-weight: 900; color: #fff; background: var(--navy2); border-radius: 6px; padding: 2px 7px; margin-right: 8px; vertical-align: 2px; }
  .exam .pts { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .exam .ptag { border: 1.5px solid var(--line); border-radius: 999px; padding: 3px 10px; font-weight: 700; font-size: 14px; }
  .exam .psg { margin: 10px 0 0; font-size: 16px; line-height: 1.7; text-indent: 1em; }
  .built { background: #f7f8ff; }
  .built p { margin: 6px 0; font-size: 15.5px; line-height: 1.7; }
  .wc { margin-top: 8px; font-weight: 800; color: var(--sub); text-align: right; font-variant-numeric: tabular-nums; }
  .wc.in { color: var(--ok); } .wc.over { color: var(--ng); }
  #crit { flex-direction: column; } #crit button { text-align: left; border-radius: 14px; font-weight: 600; }
  /* 読み上げボタン */
  .spk { display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; border: 0; flex: none;
    background: var(--indigo-soft); color: var(--indigo); vertical-align: middle; margin-left: 6px; }
  .spk svg { width: 18px; height: 18px; }
  .spk.playing { background: var(--indigo); color: #fff; }
  .qhead { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .choice .spk { width: 30px; height: 30px; margin: -2px -4px 0 0; }
  .gsw { display: flex; background: #e9ebf3; border-radius: 999px; padding: 3px; }
  .gsw button { border: 0; background: transparent; color: var(--sub); font-size: 12.5px; font-weight: 700; padding: 6px 11px; border-radius: 999px; }
  .gsw button.on { background: #fff; color: var(--ink); box-shadow: 0 1px 4px rgba(17,24,61,.15); }
  .streak { display: flex; align-items: center; gap: 2px; font-weight: 800; color: var(--orange1); font-size: 15px; white-space: nowrap; }
  .streak svg { width: 18px; height: 18px; fill: url(#flameG); stroke: none; }
  main { max-width: 640px; margin: 0 auto; padding: 6px 16px calc(104px + env(safe-area-inset-bottom)); }
  /* メニューバー（すりガラス） */
  nav.tabs { position: fixed; left: 12px; right: 12px; bottom: calc(10px + env(safe-area-inset-bottom)); z-index: 10; max-width: 616px; margin: 0 auto;
    display: flex; padding: 6px; border-radius: 24px; background: rgba(255,255,255,.86);
    backdrop-filter: saturate(180%) blur(18px); -webkit-backdrop-filter: saturate(180%) blur(18px); box-shadow: 0 8px 30px rgba(17,24,61,.14); border: 1px solid rgba(255,255,255,.7); }
  nav.tabs button { flex: 1; border: 0; background: transparent; color: var(--faint); font-size: 10.5px; font-weight: 700; padding: 6px 0 4px;
    display: flex; flex-direction: column; align-items: center; gap: 2px; border-radius: 18px; transition: color .2s, background .2s; }
  nav.tabs button.on { color: var(--indigo); background: var(--indigo-soft); }
  h2 { font-size: 13px; letter-spacing: .08em; margin: 22px 2px 10px; color: var(--sub); font-weight: 800; }
  .card { background: var(--card); border-radius: var(--r); padding: 16px; margin: 12px 0; box-shadow: var(--shadow); }
  /* 切り替え（スライドする白い枠） */
  .seg { display: flex; background: #e9ebf3; border-radius: 14px; padding: 4px; margin-top: 10px; }
  .seg button { flex: 1; border: 0; background: transparent; color: var(--sub); font-size: 14px; font-weight: 700; padding: 10px 4px; border-radius: 11px; transition: all .2s; }
  .seg button.on { background: #fff; color: var(--ink); box-shadow: 0 1px 4px rgba(17,24,61,.14); }
  /* ボタン */
  .big { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; border: 0; border-radius: 18px; padding: 17px; font-size: 17.5px; font-weight: 800;
    letter-spacing: .02em; color: #fff; margin: 12px 0; background: linear-gradient(135deg, var(--orange1), var(--orange2));
    box-shadow: 0 10px 24px rgba(255,95,58,.32), inset 0 1px 0 rgba(255,255,255,.25); transition: transform .08s; }
  .big:active { transform: scale(.98); }
  .big.navy { background: linear-gradient(135deg, var(--navy1), var(--navy2)); box-shadow: 0 10px 24px rgba(43,58,168,.3); }
  .big.sub { background: #fff; color: var(--indigo); box-shadow: var(--shadow); }
  .big:disabled { opacity: .45; box-shadow: none; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .grid .big { margin: 0; }
  /* 種類のタイル */
  .tile { position: relative; background: #fff; border: 0; border-radius: var(--r); padding: 14px; text-align: left; color: var(--ink); font-size: 13px; box-shadow: var(--shadow); }
  .tile .ti { width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center; margin-bottom: 8px; color: #fff; }
  .tile .ti svg { width: 18px; height: 18px; }
  .tile b { display: block; font-size: 15.5px; font-weight: 800; margin-bottom: 3px; }
  .tile small { color: var(--sub); line-height: 1.5; }
  .tile:disabled { opacity: .5; }
  .barl { height: 6px; border-radius: 3px; background: #eef0f5; margin-top: 8px; overflow: hidden; }
  .barl i { display: block; height: 100%; border-radius: 3px; background: linear-gradient(90deg, #22c38e, #12855a); }
  /* 出題 */
  .top { display: flex; align-items: center; gap: 10px; margin: 4px 0 8px; color: var(--sub); font-size: 13.5px; font-weight: 700; }
  .top button { border: 0; background: #fff; color: var(--indigo); font-size: 14px; font-weight: 700; padding: 7px 12px; border-radius: 999px; box-shadow: var(--shadow); }
  .top .grow { flex: 1; text-align: center; }
  .progress { height: 6px; border-radius: 3px; background: #e6e8f0; overflow: hidden; margin: 0 0 12px; }
  .progress i { display: block; height: 100%; background: linear-gradient(90deg, var(--indigo), #7c8cff); border-radius: 3px; transition: width .3s; }
  .q { white-space: pre-wrap; font-size: 18.5px; line-height: 1.65; color: var(--ink); font-weight: 500; }
  .qja { color: var(--sub); font-size: 14px; margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line); }
  .label { font-size: 12.5px; color: var(--sub); margin-bottom: 8px; font-weight: 600; }
  .choice { display: flex; gap: 12px; align-items: flex-start; width: 100%; text-align: left; border: 1.5px solid transparent; background: #fff;
    color: var(--ink); border-radius: 16px; padding: 14px; margin: 10px 0; font-size: 16px; line-height: 1.55; box-shadow: var(--shadow); transition: transform .08s; }
  .choice:active { transform: scale(.99); }
  .choice.mk.sel { border-color: var(--navy2); background: var(--indigo-soft); }
  .choice.mk.sel .lt { background: var(--navy2); color: #fff; }
  .mockbar { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 10px; background: var(--navy1); color: #fff; border-radius: 14px; padding: 10px 14px; margin-bottom: 10px; }
  .mockbar b { font-size: 20px; font-variant-numeric: tabular-nums; } .mockbar b.warn { color: var(--orange2); } .mockbar span { flex: 1; font-size: 13px; opacity: .85; }
  .msecs button small { opacity: .7; font-size: 11px; }
  .mq .mqn { display: flex; gap: 8px; margin-bottom: 8px; line-height: 1.6; } .mq .mqn b { flex: none; color: var(--navy2); }
  .mtitle { text-align: center; font-size: 16px; margin: 10px 0 4px; }
  .mail { font-size: 13.5px; color: var(--sub); background: #f6f7fb; border-radius: 10px; padding: 8px 12px; margin-top: 8px; line-height: 1.6; }
  .mnav { display: flex; justify-content: space-between; gap: 10px; margin: 16px 0 8px; } .mnav > * { flex: 1; }
  .linkbtn { background: none; border: 0; color: var(--navy2); text-decoration: underline; font: inherit; cursor: pointer; padding: 4px 0; display: block; text-align: left; }
  .selfrow { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 10px; } .selfrow small { display: block; color: var(--sub); font-size: 12px; }
  .selfrow .seg { flex: none; margin-top: 0; width: 200px; } .selfrow .seg button { padding: 8px 0; }
  .mres { display: grid; grid-template-columns: 92px 1fr 104px; align-items: center; gap: 8px; margin: 6px 0; font-size: 14px; } .mres span { text-align: right; font-variant-numeric: tabular-nums; }
  .mbar { position: relative; height: 12px; background: #eef0f6; border-radius: 6px; overflow: hidden; } .mbar i { position: absolute; inset: 0 auto 0 0; border-radius: 6px; }
  .mbar i.ok { background: #3b82f6; } .mbar i.mid { background: #f5b83d; } .mbar i.low { background: #e05252; } .mbar u { position: absolute; left: 65%; top: 0; bottom: 0; width: 2px; background: var(--ink); }
  .mrev summary { cursor: pointer; font-size: 14px; } .mrev.ng summary { color: var(--ng); } .mrev .choice { cursor: default; }
  .mockcard { display: flex; flex-direction: column; gap: 8px; }
  .card.mini > b { display: block; font-size: 17px; } .card.mini > .muted { display: block; font-size: 13px; margin: 2px 0 8px; }
  .minisk { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; } .minisk button { line-height: 1.3; padding: 8px 4px; }
  .minisk button small { display: block; font-size: 10.5px; opacity: .75; font-weight: 500; margin-top: 2px; }
  .choice .lt { flex: none; width: 26px; height: 26px; border-radius: 8px; background: #eef0f6; color: var(--sub); font-size: 13px; font-weight: 800; display: grid; place-items: center; margin-top: 1px; }
  .choice .ct { flex: 1; }
  .choice.ok { border-color: var(--ok); background: var(--okbg); }
  .choice.ok .lt { background: var(--ok); color: #fff; }
  .choice.ng { border-color: var(--ng); background: var(--ngbg); }
  .choice.ng .lt { background: var(--ng); color: #fff; }
  .choice .why { display: none; font-size: 13.5px; color: var(--sub); margin-top: 6px; }
  .answered .choice .why { display: block; }
  .point { display: flex; gap: 10px; align-items: flex-start; padding: 14px; background: #fff; border-radius: 16px; margin: 14px 0; box-shadow: var(--shadow); font-size: 15px; line-height: 1.6; }
  .point .vd { flex: none; font-weight: 900; font-size: 13px; color: #fff; border-radius: 8px; padding: 3px 8px; background: var(--ok); }
  .point .vd.ng { background: var(--ng); }
  .explain { background: linear-gradient(180deg, #fffaf0, #fff6e3); border: 1px solid #f6e3b8; border-radius: 16px; padding: 14px 16px; margin: 14px 0; font-size: 15px; line-height: 1.7; }
  .explain .eh { display: flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 800; color: #9a6700; margin-bottom: 6px; letter-spacing: .05em; }
  .explain .en { font-weight: 700; margin-bottom: 4px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(0, 1fr)); gap: 10px; margin: 12px 0; }
  .stats > div { background: #fff; border-radius: 16px; padding: 12px 6px; text-align: center; box-shadow: var(--shadow); }
  .stats small { display: block; color: var(--sub); font-size: 11.5px; line-height: 1.4; font-weight: 600; }
  .stats b { display: block; font-size: 21px; margin: 2px 0; font-weight: 900; font-variant-numeric: tabular-nums; }
  .timer { font-variant-numeric: tabular-nums; min-width: 76px; text-align: right; }
  .timer.over { color: var(--ng); }
  .lv { display: inline-block; font-size: 10.5px; font-weight: 900; color: #fff; background: linear-gradient(135deg, var(--navy1), var(--indigo)); border-radius: 6px; padding: 2px 7px; margin-right: 4px; letter-spacing: .04em; }
  .blank { color: var(--indigo); }
  .mark { color: var(--indigo); background: var(--indigo-soft); border-radius: 5px; padding: 0 4px; font-weight: 700; }
  .ans { width: 100%; font-size: 18px; padding: 14px; border: 1.5px solid var(--line); border-radius: 14px; background: #fff; color: var(--ink); font-family: inherit; outline: none; }
  .ans:focus { border-color: var(--indigo); box-shadow: 0 0 0 4px rgba(59,79,216,.12); }
  .ans:disabled { opacity: .7; }
  .result { font-size: 46px; font-weight: 900; text-align: center; margin: 10px 0 2px; letter-spacing: -.01em; }
  .muted { color: var(--sub); font-size: 13.5px; line-height: 1.6; }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 12px 0; border-bottom: 1px solid var(--line); font-size: 15px; font-weight: 600; }
  .row:last-child { border-bottom: 0; }
  .setrow { padding: 12px 0; border-bottom: 1px solid var(--line); }
  .setrow:last-child { border-bottom: 0; }

const TYPES = Object.keys(TYPE_INFO);
const WRITE_TYPES = TYPES.filter((t) => !TYPE_INFO[t].vocab && !TYPE_INFO[t].exam);

// 基礎トレの並び: 本番の段階の順（問いを読む → 序論 → 理由 → 具体例 → つなぎ → 語数／段落の役割 → 要点 → 一般化 → 言い換え）

Position: ${stance}
POINTS: ${(it.use_points || []).join(', ')}${so ? `

【${STEP_ROLE[st.role] || st.role}】に入る1文を選ぶ`,

【${STEP_ROLE[st.role]}】を1文に要約したものを選ぶ`,
      point: STEP_POINT[st.role], drive: { ja: `${STEP_ROLE[st.role]}の要点を、英語で言ってください。`, en: st.t } };

}
const LEVELS = { '1': 'Lv1 基礎', '2': 'Lv2 標準', '3': 'Lv3 発展', 'r': 'ランダム' };

    if (x.o.n) pts.push(`${X + bw / 2},${H - pad - (H - pad * 2) * (x.o.ok / x.o.n)}`);

  const gy = H - pad - ((H - pad * 2) * store.set.goal) / maxN;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%">

      ${TYPES.filter((t) => BASIC_TYPES.includes(t) || (st[t] || {}).n).map((t) => `<tr><td>${TYPE_INFO[t].name}</td><td>${(st[t] || {}).n || 0}</td><td>${pct(st[t])}</td><td>${secAvg(st[t])}</td></tr>`).join('')}</table></div>
    <h2>バッジ（${Object.keys(store.badges).length}/${BADGES.length}）</h2>
    <div class="badges">${BADGES.map((b) => `<div class="badge ${store.badges[b.id] ? 'got' : ''}"><i>${b.icon}</i><b>${b.name}</b><small>${store.badges[b.id] ? store.badges[b.id] : b.how}</small></div>`).join('')}</div>`;
}

const NUM_KEYS = new Set(['goal', 'timeMul', 'rate', 'pause', 'repeat']);

    <h2>学習</h2>

      <div class="setrow"><span>答えたら正解の英文を自動で読み上げる</span>${chips('autoRead', [[false, 'しない'], [true, 'する']], store.set.autoRead)}</div>
      <div class="setrow"><span>読み上げの速さ</span>${chips('rate', [[0.8, 'ゆっくり'], [0.9, 'やや遅い'], [0.95, '標準'], [1.05, '速い']], store.set.rate)}</div>

      <div class="setrow"><span>日本語の声（${store.set.gender === 'male' ? '男性' : '女性'}）</span><div class="vlist">${auto('voiceJa', 'ja-JP')}${ja.map((v) => vrow(v, 'voiceJa')).join('')}</div></div>
      <div class="setrow"><button class="big sub" id="tryv" style="margin:4px 0">${icon('mic')}声を試す</button>
        <p class="muted" style="margin:6px 0 0">もっと自然な声にするには、iPhone の 設定 → アクセシビリティ → 読み上げコンテンツ → 声 で、英語の「Ava」「Zoe」「Evan」「Nathan」、日本語の「Kyoko」「Otoya」などの<b>拡張・プレミアム</b>の声をダウンロードしてください。入れた声の中から、品質の高いものを自動で選びます。</p></div>

  app.querySelectorAll('.chips[data-key]').forEach((box) => box.querySelectorAll('button').forEach((b) => b.onclick = () => {

// ---------- 出題画面 ----------
function start(items, title) {
  if (!items.length) return;
  session = { items, i: 0, ok: 0, title, wrong: [], ms: 0, inTime: 0 };
  document.body.classList.add('quiz');
  question();
  scrollTo(0, 0);
}
// 入力式の判定: 大文字小文字・前後の空白・句読点の違いは無視する。日本語は空白と「〜」・句読点を無視する
const normEn = (x) => String(x).toLowerCase().replace(/[’‘]/g, "'").replace(/[.,!?;:"]/g, '').replace(/\s+/g, ' ').trim();
const normJa = (x) => String(x).replace(/[\s　〜～~、。・「」（）()]/g, '');
function judgeInput(it, text) {
  const norm = TYPE_INFO[it.type].ja ? normJa : normEn;
  const v = norm(text);
  if (!v) return false;
  return [it.choices[it.answer].t, ...(it.accept || [])].some((a) => norm(a) === v);
}
// 問題文を読み上げ用の英語にする: 空所は blank、[[ ]] は外す、（日本語）は読まない、TOPIC: などの見出しは区切りに
function speakableQ(it) {
  return it.q.replace(/___/g, ' blank ').replace(/\[\[|\]\]/g, '').replace(/[（(][^）)]*[）)]/g, '')
    .replace(/^.*【.*$/gm, '').replace(/^(TOPIC|Position|POINT|So far)S?:\s*/gim, '$1. ').replace(/\n+/g, '. ');
}
// 🔊 ボタン（data-say に読む英文を入れる）
const spk = (text) => `<button class="spk" data-say="${h(text)}" aria-label="英語を読み上げる">${icon('speaker')}</button>`;
function bindSpeakers(root) {
  root.querySelectorAll('.spk[data-say]').forEach((b) => b.onclick = (e) => {
    e.stopPropagation(); e.preventDefault();
    root.querySelectorAll('.spk.playing').forEach((x) => x.classList.remove('playing'));
    b.classList.add('playing');
    say(b.dataset.say, 'en-US', true).then(() => b.classList.remove('playing'));
  });
}
const isEnglish = (t) => /[A-Za-z]/.test(t) && !/[ぁ-んァ-ン一-龥]/.test(t);
function qToHtml(it) { return h(it.q).replace(/___/g, '<b class="blank">＿＿＿</b>').replace(/\[\[(.+?)\]\]/g, '<b class="mark">$1</b>'); }
const react = (correct) => `<span class="react">${charaImg(lv(), correct ? 'jump' : 'shake')}</span>`;
function explainBox(it) {
  // 回答例のあとに「なぜこの英文になるのか」を出す
  const alt = /別の言い方[:：]\s*(.+)$/.exec(it.explain || '');
  return `<div class="explain"><div class="eh">${icon('bulb', 'style="width:16px;height:16px"')}この英文の組み立て</div><div class="en">${h(it.drive.en)}${spk(it.drive.en)}</div>${h(it.explain || it.choices[it.answer].why)}${alt ? spk(alt[1]) : ''}</div>`;
}

// ---------- 本番形式（通し） ----------
const ROLE_NAME = { intro: '序論（立場）', reason1: '理由1', example1: '理由1の説明・具体例', reason2: '理由2', example2: '理由2の説明・具体例', conclusion: '結論',
  p1: '第1段落の要約', p2: '第2段落の要約', p3: '第3段落の要約' };
const countWords = (t) => String(t || '').trim().split(/\s+/).filter((w) => /[A-Za-z0-9]/.test(w)).length;
function fullRange(it) { const p1 = store.grade === 'p1'; return it.type === 'essay_full' ? (p1 ? [120, 150] : [80, 100]) : (p1 ? [60, 70] : [45, 55]); }
// 模範解答を段落に分ける（英作文: 序論／理由1＋説明／理由2＋説明／結論、要約: 1段落）
function modelParas(it) {
  const t = Object.fromEntries(it.steps.map((x) => [x.role, x.t]));
  return it.type === 'essay_full' ? [t.intro, `${t.reason1} ${t.example1}`, `${t.reason2} ${t.example2}`, t.conclusion] : [it.steps.map((x) => x.t).join(' ')];
}
function fullHeader(it) {
  const [a, b] = fullRange(it);
  if (it.type === 'essay_full') {
    const read = [it.situation, it.question].filter(Boolean).join(' ');
    return `<div class="card exam">
      ${it.situation ? `<p class="sit">${h(it.situation)}</p>` : ''}
      <div class="qhead"><p class="qq"><span class="tag">TOPIC</span>${h(it.question)}</p>${spk(read)}</div>
      <div class="pts"><span class="tag">POINTS</span>${it.points.map((p) => `<span class="ptag">${h(p)}</span>`).join('')}</div>
      <p class="muted" style="margin:8px 0 0">${store.grade === 'p1' ? `POINTS のうち2つを使い、${a}〜${b}語で` : `POINTS を参考に、${a}〜${b}語で`}意見を書く（模範解答は${it.stance === 'agree' ? '賛成' : '反対'}の立場・${it.use_points.join(' と ')}を使う）</p>
      ${it.q_ja ? `<div class="qja" id="qja" style="display:none">${h(it.q_ja)}</div>` : ''}</div>`;
  }
  return `<div class="card exam"><div class="qhead"><div class="label">次の英文を読んで、${a}〜${b}語で要約する</div>${spk(it.passage.join(' '))}</div>
    ${it.passage.map((p) => `<p class="psg">${h(p)}</p>`).join('')}
    ${it.q_ja ? `<div class="qja" id="qja" style="display:none">要旨: ${h(it.q_ja)}</div>` : ''}</div>`;
}
// 本番の段階 → それを鍛える基礎トレ（具体例・段落の役割の専用ドリルができたら差し替える）
const DRILL_OF = { intro: 'q_read', conclusion: 'template', reason1: 'reason', reason2: 'reason', example1: 'support', example2: 'support', p1: 'para_role', p2: 'summary', p3: 'generalize' };
function drillFor(missed) {
  const FALLBACK = { q_read: 'template', support: 'reason', para_role: 'summary', generalize: 'summary' };
  const t = missed.map((r) => DRILL_OF[r]).map((x) => (itemsOf(store.grade, x).length ? x : FALLBACK[x])).find((x) => x && itemsOf(store.grade, x).length);
  return t ? `<button class="big sub" id="drill" data-t="${t}">${icon('bolt')}「${ROLE_NAME[missed[0]]}」を基礎トレで鍛える（${TYPE_INFO[t].name} 5問）</button>` : '';
}
function fullQuestion() {
  const s = session, it = s.items[s.i], info = TYPE_INFO[it.type], input = store.set.mode === 'input';
  const [lo, hi] = fullRange(it), goal = targetSec(it.type, store.grade), t0 = Date.now();
  const ms = () => Date.now() - t0;
  const top = () => `<div class="top"><button id="quit">やめる</button><span class="grow">${h(s.title)} ${s.i + 1}/${s.items.length}</span><span class="timer" id="timer">0秒</span></div>`;
  const tickStart = () => {
    const el = () => app.querySelector('#timer');
    const tick = () => { const sec = Math.floor(ms() / 1000), e = el(); if (!e) return; const m = Math.floor(sec / 60);
      e.textContent = (m ? `${m}分${sec % 60}秒` : `${sec}秒`) + (goal ? ` / ${Math.round(goal / 60)}分` : ''); e.classList.toggle('over', goal > 0 && sec > goal); };
    tick(); clearInterval(s.tick); s.tick = setInterval(tick, 500);
  };
  const finishAll = (correct) => {
    clearInterval(s.tick);
    const m = ms(), inTime = !goal || m <= goal * 1000;
    s.ms += Math.min(m, 45 * 60e3); if (inTime) s.inTime++;
    grade(it, correct, m, input ? 'input' : null);
    if (correct) s.ok++; else s.wrong.push(it);
  };
  const goNext = () => { if (s.i === s.items.length - 1) result(); else { s.i++; question(); scrollTo(0, 0); } };
  const modelBox = (title) => `<div class="card built"><div class="label">${title}（${countWords(modelParas(it).join(' '))}語）</div>
    ${modelParas(it).map((p) => `<p>${h(p)}</p>`).join('')}${spk(modelParas(it).join(' '))}</div>`;
  const quit = () => app.querySelector('#quit').onclick = () => show(tab);

  if (input) {
    app.innerHTML = `${top()}<div class="progress"><i style="width:${(s.i / s.items.length) * 100}%"></i></div>${fullHeader(it)}
      <div class="card"><textarea id="ans" class="ans" rows="${it.type === 'essay_full' ? 12 : 6}" autocomplete="off" autocorrect="off" autocapitalize="sentences" spellcheck="false" lang="en"
        placeholder="${it.type === 'essay_full' ? '序論 → 理由1 → 理由2 → 結論 の順に書く' : '1段落を1文ずつ、3文で書く'}"></textarea>
        <div class="wc" id="wc">0 語（${lo}〜${hi}語）</div>
        <button class="big" id="submit">書けたので模範解答を見る</button></div><div id="after"></div><div style="height:90px"></div>`;
    quit(); bindSpeakers(app); tickStart();
    const ans = app.querySelector('#ans'), wc = app.querySelector('#wc');
    ans.oninput = () => { const n = countWords(ans.value); wc.textContent = `${n} 語（${lo}〜${hi}語）`; wc.className = 'wc ' + (n < lo ? '' : n <= hi ? 'in' : 'over'); };
    app.querySelector('#submit').onclick = () => {
      if (app.querySelector('#after').innerHTML) return;
      clearInterval(s.tick);
      ans.disabled = true;
      const n = countWords(ans.value), inRange = n >= lo && n <= hi;
      const qja = app.querySelector('#qja'); if (qja) qja.style.display = 'block';
      const crit = it.type === 'essay_full'
        ? [['内容', `立場がはっきりし、${store.grade === 'p1' ? 'POINTS を2つ使った' : ''}理由が2つある`], ['構成', '序論・理由1・理由2・結論の4段落で、つなぎ語がある'], ['語彙', '同じ語の繰り返しを避け、言い換えている'], ['文法', '時制・数・冠詞・三単現に誤りがない']]
        : [['内容', '3段落それぞれの要点が入っている（具体例・数字は入れない）'], ['構成', '段落の流れ（紹介→利点→問題点）をつなぎ語で示した'], ['語彙', '本文の語句をそのまま写さず言い換えた'], ['文法', '時制・数・冠詞・三単現に誤りがない']];
      app.querySelector('#after').innerHTML = `
        <div class="point"><b class="vd ${inRange ? '' : 'ng'}">${n}語</b><span>${inRange ? `語数は範囲内（${lo}〜${hi}語）` : `語数が範囲外（${lo}〜${hi}語）。本番では減点される`}</span></div>
        ${modelBox('模範解答')}
        <div class="card"><div class="label">自己採点（できた観点を押す。本番は各4点×4観点＝16点）</div>
          <div class="chips" id="crit">${crit.map(([k, d], i) => `<button data-c="${i}"><b>${k}</b>：${d}</button>`).join('')}</div>
          <div class="muted" id="est" style="margin-top:8px"></div></div>
        <div class="point"><b class="vd" style="background:var(--indigo)">要点</b><span>${h(it.point)}</span></div>
        <div class="footer"><button class="big" id="next">${s.i === s.items.length - 1 ? '結果を見る' : '次へ'}</button></div>`;
      bindSpeakers(app);
      const est = () => { const k = app.querySelectorAll('#crit .on').length; app.querySelector('#est').textContent = `推定 ${Math.max(0, k * 4 - (inRange ? 0 : 2))} / 16 点`; };
      app.querySelectorAll('#crit button').forEach((b) => b.onclick = () => { b.classList.toggle('on'); est(); });
      est();
      app.querySelector('#next').onclick = () => { finishAll(app.querySelectorAll('#crit .on').length >= 3 && inRange); goNext(); };
    };
    return;
  }

  // 選択式: 段落ごとに4択で選び、英作文・要約を組み上げる
  let k = 0, okN = 0;
  const built = [], missed = [];
  const render = () => {
    const st = it.steps[k];
    const opts = shuffle([{ t: st.t, why: st.why, ok: true }, ...st.wrong.map((w) => ({ ...w, ok: false }))]);
    app.innerHTML = `${top()}<div class="progress"><i style="width:${((s.i + k / it.steps.length) / s.items.length) * 100}%"></i></div>${fullHeader(it)}
      ${built.length ? `<div class="card built"><div class="label">組み立て中（${countWords(built.join(' '))}語）</div><p>${built.map(h).join(' ')}</p></div>` : ''}
      <div class="label" style="margin:14px 2px 0"><span class="lv">${k + 1}/${it.steps.length}</span> ${ROLE_NAME[st.role]}として最もよい文を選ぶ</div>
      <div id="choices">${opts.map((o, i) => `<button class="choice" data-i="${i}"><span class="lt">${'ABCD'[i]}</span><span class="ct">${h(o.t)}<span class="why">${h(o.why)}</span></span></button>`).join('')}</div>
      <div id="after"></div><div style="height:90px"></div>`;
    quit(); bindSpeakers(app);
    const box = app.querySelector('#choices');
    box.querySelectorAll('.choice').forEach((b) => b.onclick = () => {
      if (box.classList.contains('answered')) return;
      const o = opts[Number(b.dataset.i)];
      box.classList.add('answered');
      box.querySelectorAll('.choice').forEach((c) => { if (opts[Number(c.dataset.i)].ok) c.classList.add('ok'); if (isEnglish(opts[Number(c.dataset.i)].t)) c.insertAdjacentHTML('beforeend', spk(opts[Number(c.dataset.i)].t)); });
      if (!o.ok) { b.classList.add('ng'); missed.push(st.role); } else okN++;
      built.push(st.t);
      const last = k === it.steps.length - 1;
      app.querySelector('#after').innerHTML = `<div class="point">${react(o.ok)}<b class="vd ${o.ok ? '' : 'ng'}">${o.ok ? '正解' : '不正解'}</b><span>${h(st.why)}</span></div>
        <div class="footer"><button class="big" id="next">${last ? '完成した文章を見る' : '次の段落へ'}</button></div>`;
      bindSpeakers(app);
      app.querySelector('#next').onclick = () => { if (last) done(); else { k++; render(); scrollTo(0, 0); } };
    });
  };
  const done = () => {
    const correct = okN >= it.steps.length - 1;
    finishAll(correct);
    const qja = it.q_ja;
    app.innerHTML = `${top()}<div class="progress"><i style="width:${((s.i + 1) / s.items.length) * 100}%"></i></div>
      <div class="point">${react(correct)}<b class="vd ${correct ? '' : 'ng'}">${okN}/${it.steps.length}</b><span>${correct ? '組み立て成功！' : 'もう一度、段落の役割を確かめよう'}</span></div>
      ${modelBox(it.type === 'essay_full' ? '完成した英作文（模範解答）' : '完成した要約（模範解答）')}
      ${qja ? `<div class="card muted">${h(qja)}</div>` : ''}
      <div class="point"><b class="vd" style="background:var(--indigo)">要点</b><span>${h(it.point)}</span></div>
      ${drillFor(missed)}
      <div class="footer"><button class="big" id="next">${s.i === s.items.length - 1 ? '結果を見る' : '次へ'}</button></div><div style="height:90px"></div>`;
    quit(); bindSpeakers(app);
    const dr = app.querySelector('#drill'); if (dr) dr.onclick = () => { clearInterval(s.tick); start(pick(itemsOf(store.grade, dr.dataset.t), 5), `${TYPE_INFO[dr.dataset.t].name}（本番の復習）`); };
    const tm = app.querySelector('#timer'); if (tm) tm.textContent = `${Math.round(ms() / 1000)}秒`;
    app.querySelector('#next').onclick = goNext;
    if (store.set.autoRead) say(modelParas(it).join(' '), 'en-US', true);
  };
  tickStart();
  render();
}

function question() {
  if (TYPE_INFO[session.items[session.i].type].full) return fullQuestion();
  const s = session, it = s.items[s.i];
  const info = TYPE_INFO[it.type];
  const input = store.set.mode === 'input' && !info.choiceOnly; // 日本語で選ぶ種類は、入力式でも選択式で出す
  const order = shuffle(it.choices.map((c, idx) => idx));
  app.innerHTML = `
    <div class="top"><button id="quit">やめる</button><span class="grow">${h(s.title)} ${s.i + 1}/${s.items.length}</span><span class="timer" id="timer">0秒</span></div>
    <div class="progress"><i style="width:${(s.i / s.items.length) * 100}%"></i></div>
    <div class="card">
      <div class="label"><span class="lv">Lv${it.level || 2}</span> ${info.name} — ${input && !info.cloze ? info.write : info.hint}</div>
      <div class="qhead"><div class="q">${qToHtml(it)}</div>${spk(speakableQ(it))}</div>
      ${it.q_ja ? `<div class="qja" id="qja" style="display:none">${h(it.q_ja)}</div>` : ''}
    </div>
    ${input ? (info.cloze

const hasTTS = 'speechSynthesis' in window;
const live = new Set(); // 読み上げ中のデータを持ち続ける（iPhone で途中で音が切れるのを防ぐ）
let voiceUnlocked = false;
// 20〜40代の大人らしく聞こえる声だけに絞る（iPhone・Mac の声の名前。前ほど優先）
// おもちゃのような声（Grandma・Bubbles・Zarvox など）や子どもっぽい声は出さない
const CURATED = {
  en: { female: ['Ava', 'Zoe', 'Allison', 'Samantha', 'Susan', 'Serena', 'Kate', 'Karen', 'Moira', 'Tessa', 'Joelle', 'Nicky', 'Aria', 'Jenny'],
        male: ['Evan', 'Nathan', 'Tom', 'Alex', 'Aaron', 'Daniel', 'Oliver', 'Arthur', 'Gordon', 'Lee', 'Rishi', 'Guy', 'Davis'] },
  ja: { female: ['Kyoko', 'O-ren', 'Nanami', 'Ayumi', 'Haruka'], male: ['Otoya', 'Hattori', 'Keita', 'Ichiro'] },
};
const MAX_PER_GENDER = 5;
const baseName = (v) => v.name.replace(/\s*[（(].*$/, '').replace(/^Microsoft\s+|\s+(Online|Desktop).*$/gi, '').trim();
function describeVoice(v) {
  const s = v.name + ' ' + v.voiceURI, b = baseName(v).toLowerCase();
  const lang2 = v.lang.slice(0, 2).toLowerCase(), c = CURATED[lang2] || { female: [], male: [] };
  const fi = c.female.findIndex((x) => x.toLowerCase() === b), mi = c.male.findIndex((x) => x.toLowerCase() === b);
  const score = /premium|プレミアム|neural|natural/i.test(s) ? 3 : /enhanced|拡張|siri/i.test(s) ? 2 : 1;
  return { g: fi >= 0 ? '女性' : mi >= 0 ? '男性' : '不明', order: fi >= 0 ? fi : mi >= 0 ? mi : 99, curated: fi >= 0 || mi >= 0,
    q: score === 3 ? '最高品質' : score === 2 ? '高品質' : '標準', score };
}
// その言語で選べる声（性別ごとに品質の高い順に最大5人）
function voicesFor(lang2, gender) {
  if (!hasTTS) return [];
  const want = gender === 'male' ? '男性' : '女性';
  const seen = new Set();
  return speechSynthesis.getVoices().filter((v) => v.lang.toLowerCase().startsWith(lang2))
    .map((v) => ({ v, d: describeVoice(v) })).filter((x) => x.d.curated && x.d.g === want)
    .sort((a, b) => (b.d.score - a.d.score) || (a.d.order - b.d.order) || ((b.v.lang === 'en-US') - (a.v.lang === 'en-US')))
    .filter((x) => { const k = x.v.name; if (seen.has(k)) return false; seen.add(k); return true; })
    .slice(0, MAX_PER_GENDER).map((x) => x.v);
}
function pickVoice(lang) {
  if (!hasTTS) return null;
  const lang2 = lang.slice(0, 2), chosen = lang2 === 'en' ? store.set.voiceEn : store.set.voiceJa;
  const all = speechSynthesis.getVoices().filter((v) => v.lang.toLowerCase().startsWith(lang2));
  if (chosen) { const v = all.find((x) => x.name === chosen); if (v) return v; }
  // 選んだ性別の中で一番品質の高い声。なければ反対の性別、それもなければ何でも
  return voicesFor(lang2, store.set.gender)[0] || voicesFor(lang2, store.set.gender === 'male' ? 'female' : 'male')[0]
    || all.find((v) => v.lang.replace('_', '-') === lang) || all[0] || null;
}
function say(text, lang, force = false) {
  return new Promise((resolve) => {
    if (!hasTTS || (!drive && !force)) return resolve(false);
    // 前の読み上げが残っているときだけ取り消す。取り消した直後に話すと iPhone では捨てられることがあるので少し待つ
    const busy = speechSynthesis.speaking || speechSynthesis.pending;
    if (busy) speechSynthesis.cancel();
    if (speechSynthesis.paused) speechSynthesis.resume();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = lang; const v = pickVoice(lang); if (v) u.voice = v;
    u.rate = store.set.rate; u.volume = 1;
    live.add(u);
    let done = false;
    const finish = (ok) => { if (done) return; done = true; live.delete(u); clearTimeout(guard); resolve(ok); };
    u.onstart = () => sayStatus('読み上げ中');
    u.onend = () => { sayStatus('待機'); finish(true); };
    u.onerror = (e) => { sayStatus('エラー: ' + e.error); finish(false); };
    const guard = setTimeout(() => finish(false), text.length * 160 / store.set.rate + 5000); // 終了の合図が来ないときの打ち切り
    // 最初の1回はボタンを押した処理の中で同期的に呼ぶ必要がある（iPhone は、押した直後でないと音を出さない）
    if (busy) setTimeout(() => speechSynthesis.speak(u), 120); else speechSynthesis.speak(u);

}
function sayStatus(t) { const el = document.getElementById('sst'); if (el) el.textContent = '音声: ' + t; }

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
// iPhone では、音声入力を作り直したり止めて再開したりすると、2回目からマイクが無音になる（2026-11-11 実機）。
// 一度だけ始めて聞き続ける方式（continuous）だけが使えたので、モードの間ずっと開いたままにし、
// 答えを待つ間に聞こえた声だけを受け取る。読み上げ中に聞こえた声は捨てる。
function startMic() {
  if (!SR || !drive || !drive.voice) return;
  const r = new SR();
  r.lang = 'en-US'; r.interimResults = true; r.continuous = true; r.maxAlternatives = 1;
  drive.rec = r; drive.accept = false; drive.buf = ''; drive.part = ''; drive.lastHeard = 0; drive.micDead = false;
  r.onresult = (e) => {
    if (!drive || drive.rec !== r || !drive.accept) return;
    let part = '';
    for (let k = e.resultIndex; k < e.results.length; k++) {
      const t = e.results[k][0].transcript;
      if (e.results[k].isFinal) drive.buf = (drive.buf + ' ' + t).trim(); else part += t;
    }
    drive.part = part; drive.lastHeard = Date.now();
    const el = document.getElementById('heard'); if (el) el.textContent = '🎙️ ' + (drive.buf + ' ' + part).trim();
  };
  r.onerror = (e) => { if (drive && drive.rec === r && /not-allowed|service-not-allowed|audio-capture/.test(e.error)) drive.micDead = e.error; };
  r.onend = () => { if (drive && drive.rec === r) { drive.micDead ||= 'ended'; drive.rec = null; } };
  try { r.start(); } catch (e) { drive.micDead = 'start-failed'; drive.rec = null; }
}
// ms のあいだ（話し終えて1.6秒たったらそこで）答えを受け取る
async function listen(ms) {
  if (!drive || !drive.rec || drive.micDead) return { ok: false, why: drive && drive.micDead || 'no-api' };
  await new Promise((r) => setTimeout(r, 350)); // 読み上げの残響を拾わないよう少し待つ
  if (!drive) return { ok: false, why: 'stopped' };
  drive.buf = ''; drive.part = ''; drive.lastHeard = 0; drive.accept = true;
  sayStatus('聞いています');
  const t0 = Date.now();
  while (drive && !drive.micDead && Date.now() - t0 < ms) {
    if (drive.lastHeard && Date.now() - drive.lastHeard > 1600) break;
    await new Promise((r) => setTimeout(r, 150));
  }
  if (!drive) return { ok: false, why: 'stopped' };
  drive.accept = false;
  const text = (drive.buf + ' ' + drive.part).trim();
  return { ok: !!text, text, why: drive.micDead || (text ? '' : 'silence') };
}
// 模範文の大事な語（短い機能語を除く）をどれだけ言えたか
const STOP = new Set('a an the to of in on at for and or but is are was were be been it this that these those i we you they he she its their our my your with as by from can will would should could do does did not no so if than then there'.split(' '));
const words = (s) => normEn(s).split(' ').filter((w) => w && !STOP.has(w));
function matchScore(model, heard) {
  const m = words(model), hs = new Set(words(heard));
  if (!m.length) return 0;
  return m.filter((w) => hs.has(w) || hs.has(w.replace(/s$/, '')) || hs.has(w + 's')).length / m.length;
}

    for (let k = 0; k < store.set.repeat && drive; k++) { await say(it.drive.en, 'en-US'); await wait(900); }
    if (!drive) break;
    if (store.set.readExplain && it.explain) { ph.textContent = '解説'; tx.textContent = it.explain; await say(it.explain.replace(/別の言い方[:：].*$/, ''), 'ja-JP'); if (!drive) break; }
    drive.i++;
    await wait(800);
  }
  if (drive) { await say('おつかれさまでした。', 'ja-JP'); show('home'); }
}
async function keepAwake() {
  try { if ('wakeLock' in navigator && drive) drive.lock = await navigator.wakeLock.request('screen'); } catch {}
}
document.addEventListener('visibilitychange', () => { if (drive && document.visibilityState === 'visible') keepAwake(); });
function stopDrive() {
  if (!drive) return;
  clearTimeout(drive.timer);
  try { const r = drive.rec; drive.rec = null; r && r.stop(); } catch {} // abort はしない（マイクが無音になる）
  try { drive.lock && drive.lock.release(); } catch {}
  drive = null;
  if (hasTTS) speechSynthesis.cancel();
}

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
// 確認用: index.html#problems のように開くと、そのタブから始まる。#question は出題画面の見本
withGrade(() => {
  checkBadges();
  const hsh = location.hash.slice(1);
  if (hsh === 'question' || hsh === 'answered') {
    show('problems'); start(pick(allItems(store.grade, ['reason']), 10), '理由の選択');
    if (hsh === 'answered') { const it = session.items[0]; app.querySelector(`.choice[data-i="${it.answer}"]`).click(); }
  }
  else show(TABS.some(([k]) => k === hsh) || hsh === 'settings' ? hsh : 'home');
});
