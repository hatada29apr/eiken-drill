住民の意見を反映するため参加へのアクセス拡大が必要だと述べる。別の言い方: Participatory budgeting increases public involvement, but participation must be more accessible to represent a wider range of residents."},{"id":"p1-summary-218","level":2,"q":"Several cities encourage restaurants to donate unsold meals to community organizations rather than discard them. These partnerships reduce food waste while supporting households facing financial pressure. In one program, volunteers collect meals after the evening service. Yet unpredictable supplies make it difficult for organizations to plan their support. Donation schemes therefore complement regular assistance but should not be treated as a dependable replacement for established food support services.","q_ja":"いくつかの都市は、飲食店が売れ残った食事を捨てず、地域団体に寄付するよう促している。この連携は食品廃棄を減らし、家計の厳しい世帯を支援する。ある取り組みでは、夜の営業後にボランティアが食事を回収する。しかし、供給が予測できないため、団体は支援の計画を立てにくい。そのため、食事の寄付は通常の支援を補うものではあっても、既存の食料支援に確実に取って代わるものと考えるべきではない。","choices":[{"t":"Redistributing surplus restaurant food limits waste and assists disadvantaged households, but uncertain availability means donations should supplement rather than replace reliable forms of food assistance.","why":"正解。廃棄削減と生活支援の利点を示し、供給の不確実性から既存支援を補完する役割だとまとめている。"},{"t":"These partnerships reduce food waste while supporting households facing financial pressure, yet unpredictable supplies make it difficult for organizations to plan their support for recipients.","why":"本文の二つの箇所をほぼそのままつなぎ、既存支援を補う位置づけを自分の言葉でまとめていない。"},{"t":"Volunteers collecting meals after evening service reduce restaurant waste and support struggling households, although unpredictable donations cannot provide a reliable substitute for established food assistance.","why":"要点の対比は含むが、夜の営業後にボランティアが回収するという具体例を残している。"},{"t":"Restaurant donations reduce food waste and help low income households, while city storage facilities stabilize supplies enough for community groups to replace existing assistance programs.","why":"市の保管施設によって供給が安定するという本文にない情報を加え、既存支援の代替になるとしている。"},{"t":"Partnerships between restaurants and community organizations redirect unsold meals to households under financial pressure, providing a practical use for food that businesses would otherwise discard.","why":"寄付の仕組みと利点だけを詳しく述べ、供給が不安定なため支援の代替にはならないという要点を落としている。"},{"t":"Unpredictable restaurant donations prevent community organizations from planning food assistance, making redistribution schemes unsuitable for supporting households despite their contribution to reducing commercial food waste.","why":"計画が難しいことから寄付は支援に不適切だと結論づけており、補完的な役割を認める本文より否定が強すぎる。"}],"answer":0,"point":"補完することと代わりになることを区別し、供給の不安定さとの因果関係を残す。","drive":{"ja":"次の段落の要点を英語1文で。飲食店の余剰食品の寄付は廃棄を減らし生活を支えるが、供給が不安定なので既存の食料支援を補うものと考えるべきである。","en":"Redistributing surplus restaurant food limits waste and assists disadvantaged households, but uncertain availability means donations should supplement rather than replace reliable forms of food assistance."},"explain":"Redistributing以下が主語で、limitsとassistsが廃棄削減と困窮世帯への支援を示す。but以下は供給が不確実なため既存支援の代替ではなく補完にすべきだと述べる。別の言い方: Redistributing surplus restaurant meals reduces waste and helps disadvantaged households, but unpredictable supplies mean donations should supplement reliable food assistance rather than replace it."},{"id":"p1-summary-219","level":3,"q":"Public transport authorities sometimes assess bus services mainly by passenger totals. This approach favors busy routes, yet overlooks the social value of less crowded services. A village bus carrying twelve passengers may provide the only connection to essential facilities for residents without cars. Subsidizing such routes does not necessarily indicate poor management; it may reflect a deliberate commitment to accessibility. Funding decisions should therefore consider the consequences of losing a service alongside conventional measures of operational efficiency.","q_ja":"公共交通当局は、バス路線を主に乗客数で評価することがある。この方法は利用者の多い路線を有利にするが、空いている路線の社会的な価値を見落とす。十二人を乗せる村のバスが、車のない住民にとって不可欠な施設へ行く唯一の交通手段かもしれない。そのような路線への補助は必ずしも経営の失敗を示さず、移動機会の確保を重視する意図的な判断かもしれない。したがって、資金配分では、従来の運行効率の指標とともに、路線を失う影響も考慮すべきである。","choices":[{"t":"Subsidizing such routes does not necessarily indicate poor management; it may reflect a deliberate commitment to accessibility, so funding decisions should consider the consequences of losing a service.","why":"本文の文や節をほぼそのまま使っており、乗客数による評価の限界と社会的価値を十分に言い換えていない。"},{"t":"Transport funding should balance efficiency against accessibility, since a village bus carrying twelve passengers may offer residents without cars their only connection to essential facilities beyond their immediate community.","why":"評価の論理は捉えているが、村のバスと十二人という具体例や数字を残している。"},{"t":"Assessing transport subsidies requires attention to social access as well as passenger totals, while national minimum service laws establish which lightly used routes authorities must preserve for isolated residents.","why":"国の最低運行基準を定めた法律が維持路線を決めるという、本文にない制度を加えている。"},{"t":"Passenger totals encourage transport authorities to favor busy routes when comparing services, giving operational efficiency greater influence over funding allocations than the needs of residents in less populated communities.","why":"乗客数中心の評価の偏りを詳しく述べるだけで、補助の意義と廃止の影響を含めた判断という結論を落としている。"},{"t":"Lightly used bus routes provide essential access that outweighs operational efficiency, so preserving these services deserves priority over investment in busy routes when authorities distribute limited public transport funding.","why":"空いている路線の維持を混雑路線への投資より優先すべきだと一律に順位づけし、両面を考慮するという本文を超えている。"},{"t":"Transport subsidies should reflect both operating efficiency and the social costs of withdrawal, since lightly used routes may provide indispensable access that passenger figures alone fail to capture.","why":"正解。少ない乗客数では測れない移動手段の価値を示し、効率と廃止の社会的影響を併せて判断するという結論をまとめている。"}],"answer":5,"point":"利用者数が少ないことと社会的価値が低いことを区別し、資金配分の複数の評価軸を残す。","drive":{"ja":"次の段落の要点を英語1文で。利用者の少ないバスでも不可欠な移動手段である場合があるため、補助金は運行効率だけでなく廃止による社会的影響も考慮して判断すべきである。","en":"Transport subsidies should reflect both operating efficiency and the social costs of withdrawal, since lightly used routes may provide indispensable access that passenger figures alone fail to capture."},"explain":"should reflect both A and Bは補助金の判断に運行効率と廃止の社会的費用の両方を反映すべきだと示す。since節は低利用路線が乗客数だけでは捉えられない不可欠なアクセスを提供し得ると説明する。別の言い方: Transport subsidies should consider efficiency and the social consequences of closure, because lightly used routes may offer essential access that passenger counts do not reveal."},{"id":"p1-summary-220","level":1,"q":"Some cities offer free language classes to help newcomers use public services and find work in their communities. Lessons often include practice with medical appointments. However, parents may be unable to attend because they have nobody to care for their children. Providing childcare alongside classes would allow more residents to benefit from this support and join local life.","q_ja":"一部の都市は、新しく移り住んだ人々が行政サービスを利用し、地域で仕事を見つけられるよう、無料の語学教室を提供している。授業には診察予約の練習が含まれることも多い。しかし、子どもを預ける相手がいないため参加できない保護者もいる。授業と併せて保育を提供すれば、より多くの住民がこの支援を利用し、地域生活に参加できるだろう。","choices":[{"t":"Some cities offer free language classes to help newcomers use public services and find work in their communities.","why":"冒頭の文をそのまま写しており、保護者の参加を支える保育の必要性をまとめていない。"},{"t":"Classes practicing medical appointments help newcomers settle locally, but childcare is needed to make participation easier for parents.","why":"参加支援の必要性は含むが、診察予約の練習という具体例を残している。"},{"t":"Language programs help newcomers settle locally, while city payments to grandparents provide the childcare needed for wider participation.","why":"祖父母への市の給付で保育を確保するという、本文にない具体的な仕組みを加えている。"},{"t":"Language education supports newcomers' integration, but childcare provision is needed to enable more parents to access opportunities.","why":"正解。語学教育による地域への参加と、保護者が受講するための保育支援を具体例なしで言い換えている。"},{"t":"Free language lessons prepare newcomers to communicate when seeking local services and employment opportunities in their new communities.","why":"語学教室の目的だけを詳しく述べ、保護者が参加できない事情と保育による対応を落としている。"},{"t":"Combining language classes with childcare removes the barriers newcomers face when seeking employment and joining their local communities.","why":"保育を組み合わせれば就職や地域参加の障壁がなくなると断定しており、参加を広げるという本文より強すぎる。"}],"answer":3,"point":"支援の目的と、その支援を利用しやすくするための条件を両方残す。","drive":{"ja":"次の段落の要点を英語1文で。語学教育は移住者の地域参加を支えるが、より多くの保護者が受講するには保育の提供が必要である。","en":"Language education supports newcomers' integration, but childcare provision is needed to enable more parents to access opportunities."},"explain":"Language educationが主語で、supportsは新住民の社会統合への支援を示す。but以下はより多くの親が学習機会を利用するため保育の提供が必要だと述べる。別の言い方: Language learning helps newcomers integrate, but childcare is necessary to let more parents benefit from these opportunities."},{"id":"p1-summary-101","grade":"p1","type":"summary","level":2,"q":"Local governments are funding digital support at public offices. Trained staff help residents use online services, making public support easier to obtain. For example, older people learn to apply for housing assistance on office computers. This support also reduces waiting times because fewer applications contain mistakes. Residents without internet access receive help as well. Consequently, digital support improves access to public services and helps offices process requests faster.","q_ja":"地方自治体は公共窓口でのデジタル支援に資金を出している。研修を受けた職員が住民によるオンラインサービスの利用を手伝い、公的支援を受けやすくしている。例えば、高齢者は窓口のコンピューターで住宅支援の申請方法を学ぶ。申請の不備が減るため、この支援は待ち時間も短縮する。インターネットを利用できない住民も支援を受ける。その結果、デジタル支援は公共サービスの利用を容易にし、窓口での申請処理を速める。","choices":[{"t":"Digital support improves access to public services and helps offices process requests faster by reducing application mistakes.","why":"本文の結論をほぼそのまま使っており、要点を自分の言葉に言い換えていない。"},{"t":"Public investment in digital assistance improves access to essential services while reducing delays for people needing support.","why":"正解。公的支援の利用のしやすさと処理の迅速化を、具体例を省いて別の表現でまとめている。"},{"t":"Teaching older people to request housing assistance on office computers improves service access and speeds up application processing.","why":"高齢者が窓口のコンピューターで住宅支援を申請するという具体例が残っており、段落全体を一般化していない。"},{"t":"Online guidance makes public services more accessible and speeds up applications while allowing governments to close local offices.","why":"利用のしやすさと処理の迅速化に加え、本文にない窓口の閉鎖を述べている。"},{"t":"Residents receive guidance on using online services from trained staff at public offices even without home internet access.","why":"支援を受ける方法だけをまとめており、申請の不備が減って処理が速くなるという要点が抜けている。"},{"t":"Government funding for digital guidance ensures that every resident receives public assistance immediately without making any application mistakes.","why":"利用や処理の改善を、全住民が不備なく直ちに支援を受けられるという保証にまで言い過ぎている。"}],"answer":1,"point":"具体例を省き、公共サービスを利用しやすくなることと処理が速くなることの両方を言い換える。","drive":{"ja":"次の段落の要点を英語1文で。公的なデジタル利用支援は、公共サービスを利用しやすくし、手続きの待ち時間も減らす。","en":"Public investment in digital assistance improves access to essential services while reducing delays for people needing support."},"explain":"Public investment が主語、improves が動詞。while reducing は「〜しながら」を表す分詞の構文で、同じ主語の二つ目の効果を添える。要約で効果を二つ並べるときに使える。別の言い方: Public funding for digital assistance makes essential services easier to reach and shortens waiting times for those who need help."},{"id":"p1-summary-102","grade":"p1","type":"summary","level":2,"q":"Many towns are improving public buildings to save energy. Better windows and heating systems reduce running costs, leaving more money for public services. One town replaced windows in three libraries and used the savings to buy books. Nevertheless, these improvements require substantial spending at the start. Towns must plan their budgets carefully so that the cost of construction does not reduce funding for essential services.","q_ja":"多くの町が省エネルギーのために公共施設を改修している。性能のよい窓や暖房設備は運営費を減らし、公共サービスに使える資金を増やす。ある町は図書館3館の窓を交換し、節約した資金で本を購入した。それでも、こうした改修には初めに多額の支出が必要になる。工事費によって不可欠なサービスへの予算が減らないよう、町は慎重に予算を計画しなければならない。","choices":[{"t":"Replacing windows in three libraries saves energy and provides money for books although construction requires careful financial planning.","why":"図書館3館の窓や本の購入という具体例と数字を残しており、公共施設全体の話としてまとめていない。"},{"t":"Energy improvements to public buildings pay for themselves immediately and provide enough savings to cover every public service.","why":"初期費用への注意が必要なのに、すぐに費用を回収し、すべての公共サービスを賄えると言い過ぎている。"},{"t":"Better windows and heating systems reduce running costs, leaving more money for public services despite substantial spending initially.","why":"本文の窓や暖房設備についての文をほぼ写しており、要点を別の表現にまとめていない。"},{"t":"Improving energy efficiency lowers public spending and supports services while national grants cover the full cost of construction.","why":"国の補助金が工事費の全額を賄うという、本文にない資金源を加えている。"},{"t":"Renovating public buildings reduces energy costs and protects services although the initial expense requires careful budget planning.","why":"正解。改修による経費削減とサービス維持の利点、初期費用に備える必要を、具体例を省いてまとめている。"},{"t":"Public buildings use less energy after improvements to their windows and heating systems, freeing money for additional services.","why":"設備の改善と節約という利点だけを説明し、初期費用と慎重な予算計画の必要性を落としている。"}],"answer":4,"point":"経費削減という利点だけでなく、初期費用への備えという注意点も残す。","drive":{"ja":"次の段落の要点を英語1文で。公共施設の改修はエネルギー費を減らしてサービスを支えるが、初期費用を考えた慎重な予算計画が必要だ。","en":"Renovating public buildings reduces energy costs and protects services although the initial expense requires careful budget planning."},"explain":"は対象英文がないため確定できない。"},{"id":"p1-summary-103","grade":"p1","type":"summary","level":2,"q":"Public universities are sharing expensive research equipment. Sharing reduces the need for separate purchases and gives smaller institutions access to advanced tools. For instance, four universities use a single machine to examine water pollution. This arrangement supports research without increasing public spending. However, researchers may need the same equipment at the same time. Clear booking rules are therefore necessary to give each institution a fair chance to use it.","q_ja":"公立大学は高価な研究設備を共同利用している。共同利用によって個別に購入する必要が減り、小規模な機関も高度な機器を使えるようになる。例えば、4大学が1台の装置で水質汚染を調べている。この仕組みは公的支出を増やさずに研究を支える。しかし、研究者が同じ時期に同じ設備を必要とする場合がある。そのため、各機関に公平な利用機会を与えるには、明確な予約ルールが必要である。","choices":[{"t":"Shared research equipment lowers public spending and expands scientific opportunities provided that institutions coordinate its use fairly.","why":"正解。設備の共同利用による節約と研究機会の拡大、公平な利用調整という条件を言い換えてまとめている。"},{"t":"Sharing reduces the need for separate purchases and gives smaller institutions access to advanced tools under clear booking rules.","why":"本文の共同利用の利点を説明する文をほぼ写しており、表現を十分に言い換えていない。"},{"t":"Sharing scientific tools reduces university costs and widens research access while private companies take responsibility for managing bookings.","why":"民間企業が予約管理を担当するという、本文にない運営方法を付け加えている。"},{"t":"Four universities examine water pollution with a single machine, limiting equipment costs while requiring fair arrangements for shared access.","why":"4大学、1台の装置、水質汚染の調査という具体例と数字を残している。"},{"t":"Smaller institutions gain access to advanced scientific tools through equipment sharing, enabling them to conduct research with other universities.","why":"小規模機関の研究機会という利点に偏り、購入費の節約と公平な利用ルールの必要性をまとめていない。"},{"t":"Common equipment removes financial barriers to university research and guarantees immediate access whenever scientists need to use advanced tools.","why":"費用の障壁がなくなり、必要なときに必ずすぐ使えると断定しており、利用が重なるという問題も無視している。"}],"answer":0,"point":"共同利用の利点をまとめたうえで、公平な利用調整が必要という条件も残す。","drive":{"ja":"次の段落の要点を英語1文で。研究設備の共同利用は公的支出を抑えて研究機会を広げるが、機関同士で公平に利用を調整する必要がある。","en":"Shared research equipment lowers public spending and expands scientific opportunities provided that institutions coordinate its use fairly."},"explain":"は対象英文がないため確定できない。"},{"id":"p1-summary-104","grade":"p1","type":"summary","level":2,"q":"Some cities offer financial support for repairing household products. These payments help families save money and reduce waste by keeping products in use longer. In one city, residents receive twenty dollars toward repairing a broken washing machine. However, financial support alone is not enough. Without trained repair workers nearby, residents may still replace damaged products. The policy therefore needs a reliable local repair service to achieve its aims.","q_ja":"一部の都市は家庭用品の修理に金銭的な支援を提供している。この支給は、製品を長く使い続けることで家計の節約とごみの削減に役立つ。ある都市では、住民は壊れた洗濯機の修理に20ドルの支援を受ける。しかし、金銭的な支援だけでは十分ではない。近くに熟練した修理業者がいなければ、住民は結局、壊れた製品を買い替えることがある。そのため、この政策が目的を達成するには、地域で信頼できる修理サービスが必要である。","choices":[{"t":"Residents receiving twenty dollars for washing machine repairs save money and reduce waste if skilled repair workers are available.","why":"20ドルの支援や洗濯機の修理という具体例を残しており、政策の要点を一般化していない。"},{"t":"These payments help families save money and reduce waste by keeping products in use longer with trained repair workers.","why":"支給の効果を述べた本文の文をほぼそのまま使っており、要点を別の表現に言い換えていない。"},{"t":"Financial aid for repairs cuts living costs and waste while requiring shops to offer every resident free replacement products.","why":"店に無料の代替製品を提供させるという、本文にない義務を加えている。"},{"t":"Repair subsidies reduce household expenses and material waste although their success depends on access to skilled workers.","why":"正解。修理支援による家計負担とごみの削減、熟練した修理業者の必要性を、具体例を省いてまとめている。"},{"t":"Financial support encourages families to keep household products longer, helping them spend less money and throw away fewer items.","why":"製品を長く使う利点だけを説明しており、地域の修理業者が必要という政策の条件が抜けている。"},{"t":"City repair payments end household product waste and ensure that families never need to buy replacement goods in future.","why":"ごみがなくなり、今後は買い替えが一切不要になると言い過ぎており、修理業者が必要という条件も落としている。"}],"answer":3,"point":"修理支援の効果と、その効果を実現するために必要な人材の両方を残す。","drive":{"ja":"次の段落の要点を英語1文で。修理への補助は家計負担とごみを減らすが、効果を上げるには熟練した修理業者を利用できる必要がある。","en":"Repair subsidies reduce household expenses and material waste although their success depends on access to skilled workers."},"explain":"は対象英文がないため確定できない。"}],"template":[{"id":"p1-template-001","q":"I am firmly ___ that governments should establish ethical guidelines for technologies capable of influencing public opinion.","q_ja":"私は、世論に影響を及ぼし得る技術に対して、政府が倫理指針を定めるべきだと固く確信している。","choices":[{"t":"committed","why":"「尽力している」という意味で、取り組む対象は通常、前置詞を使って示す。この形では確信を表せない。"},{"t":"convinced","why":"正解。確信していることを表す定型表現で、後ろの節に自分の立場を示せる。"},{"t":"dedicated","why":"「専念している」という意味で、専念する対象を示す前置詞が必要。この形では確信を表せない。"},{"t":"devoted","why":"「献身的な」という意味で、献身の対象を示す前置詞が必要。この形では確信を表せない。"}],"answer":1,"point":"序論では、固く確信していることを表す定型文の後ろに主張を置き、続く二つの本論で根拠を示す。","drive":{"ja":"序論で、政府は世論に影響する技術の倫理指針を定めるべきだと、固い確信を示してください。","en":"I am firmly convinced that governments should establish ethical guidelines for technologies capable of influencing public opinion."},"level":1,"explain":"Iが主語、am convincedが述語で、that節が確信の内容を示す。capable of＋動名詞で技術の能力を限定し、論述の対象を明確にする。別の言い方: able to influence public opinion"},{"id":"p1-template-002","q":"There are two main ___ why I support allocating more public funding to scientific research that addresses environmental challenges.","q_ja":"環境問題に取り組む科学研究への公的資金の配分増加を私が支持するのには、主に二つの理由がある。","choices":[{"t":"causes","why":"出来事を引き起こす原因を指す。自分の支持理由を後ろの節で示す定型表現には合わない。"},{"t":"factors","why":"結果に影響する要因を指す。自分が支持する理由を示すこの定型表現には合わない。"},{"t":"points","why":"論点や要点を指す。支持する理由を後ろの節で説明するこの形には合わない。"},{"t":"reasons","why":"正解。自分が支持する理由を示す定型表現になり、二つの本論段落を予告できる。"}],"answer":3,"point":"序論の末尾で主な理由が二つあると予告し、本論の第1段落と第2段落で一つずつ説明する。","drive":{"ja":"序論の末尾で、環境問題に取り組む科学研究への公的資金の増加を支持する理由が二つあると予告してください。","en":"There are two main reasons why I support allocating more public funding to scientific research that addresses environmental challenges."},"level":1,"explain":"There areで理由の存在を示し、why節で支持する理由を限定する。support＋動名詞なら、論述で支持する行為を名詞と同じ位置に置ける。別の言い方: favor increasing public funding"},{"id":"p1-template-003","q":"In ___ of these points, I believe that international cooperation is essential to ensuring equitable access to essential medicines.","q_ja":"これらの論点を踏まえると、必要不可欠な医薬品への公平なアクセスを確保するには国際協力が不可欠だと私は考える。","choices":[{"t":"light","why":"正解。前後の前置詞と組み合わせると「～を踏まえて」という定型表現になり、本論を受けて結論を導ける。"},{"t":"sight","why":"視界を表す名詞。前後の前置詞と組み合わせても、論点を考慮するという意味にはならない。"},{"t":"perspective","why":"視点を表す名詞。この前置詞の組み合わせでは「～を踏まえて」という定型表現にならない。"},{"t":"focus","why":"焦点を表す名詞。この前置詞の組み合わせでは、論点を踏まえて結論を導く表現にならない。"}],"answer":0,"point":"結論では「これらの論点を踏まえて」という定型表現で本論を受け、序論で示した立場を再提示する。","drive":{"ja":"結論で、これらの論点を踏まえると、医薬品への公平なアクセスには国際協力が不可欠だと述べてください。","en":"In light of these points, I believe that international cooperation is essential to ensuring equitable access to essential medicines."},"level":2,"explain":"I believeのthat節が主張で、文頭句が判断の根拠を示す。essential toのtoは前置詞なので動名詞が続き、論述で必要条件を述べられる。別の言い方: necessary for ensuring fair access"},{"id":"p1-template-004","q":"Taking these arguments into ___, I conclude that public transport should receive sustained investment to reduce dependence on private vehicles.","q_ja":"これらの議論を考慮すると、自家用車への依存を減らすため、公共交通機関に継続的な投資を行うべきだと私は結論づける。","choices":[{"t":"attention","why":"注意を表す名詞。この動詞と前置詞の組み合わせでは「考慮に入れる」という表現にならない。"},{"t":"concern","why":"懸念や関心を表す名詞。この位置では「考慮に入れる」という定型表現を作れない。"},{"t":"account","why":"正解。前の動詞と前置詞に続けると「～を考慮に入れる」という定型表現になる。"},{"t":"regard","why":"配慮を表す名詞だが、この動詞と前置詞の組み合わせでは使わない。"}],"answer":2,"point":"結論の冒頭を「これらの議論を考慮すると」という分詞構文にすると、本論から主張の再提示へつなげられる。","drive":{"ja":"結論で、これらの議論を考慮すると、車への依存を減らすために公共交通への継続的な投資が必要だと述べてください。","en":"Taking these arguments into account, I conclude that public transport should receive sustained investment to reduce dependence on private vehicles."},"level":1,"explain":"文頭の分詞構文の意味上の主語はIで、that節が結論を示す。to reduceは投資の目的を表し、論述で提案と目標を結び付ける。別の言い方: considering these arguments"},{"id":"p1-template-005","q":"On ___, I believe that stricter regulation of personal data is necessary to protect citizens from commercial exploitation.","q_ja":"総合的に判断すると、商業的な搾取から市民を守るには、個人データに関する規制の強化が必要だと私は考える。","choices":[{"t":"equilibrium","why":"均衡を表す名詞だが、この前置詞の後ろでは「総合的に判断すると」という定型表現にならない。"},{"t":"balance","why":"正解。直前の前置詞と組み合わせると、複数の点を比較して下す総合的な判断を示せる。"},{"t":"stability","why":"安定を表す名詞。この位置では、議論を総合して判断するという意味にならない。"},{"t":"proportion","why":"比率や釣り合いを表す名詞。この位置では、総合的な判断を示す定型表現にならない。"}],"answer":1,"point":"結論で総合的な判断を示す定型表現を使うと、検討した論点を受けて自分の立場を再確認できる。","drive":{"ja":"結論で、総合的に判断すると、市民を商業的な搾取から守るために個人データの規制強化が必要だと述べてください。","en":"On balance, I believe that stricter regulation of personal data is necessary to protect citizens from commercial exploitation."},"level":2,"explain":"I believeのthat節で規制の必要性を述べ、文頭句で総合判断と示す。protect A from Bで守る対象と脅威を分け、論述で対策の目的を具体化する。別の言い方: all things considered"},{"id":"p1-template-006","q":"To ___ up, governments should expand access to vocational education, which enables workers to adapt to technological change.","q_ja":"要約すると、労働者が技術の変化に適応できるよう、政府は職業教育を受ける機会を拡大すべきである。","choices":[{"t":"count","why":"数を数えるという意味。この組み合わせでは、議論を要約して結論を示す表現にならない。"},{"t":"total","why":"合計するという意味。この組み合わせでは、議論を要約する定型表現にならない。"},{"t":"add","why":"足し合わせるという意味。この組み合わせでは、後ろの主張を議論の要約として導入できない。"},{"t":"sum","why":"正解。後ろの語と組み合わせると「要約すると」という定型表現になり、結論の主張を導ける。"}],"answer":3,"point":"結論の冒頭で議論を要約すると示し、主張を再提示する。関係詞の非制限用法で主張の意味を補足できる。","drive":{"ja":"結論で、要約すると、技術の変化に労働者が適応できるよう政府は職業教育の機会を拡大すべきだと述べてください。","en":"To sum up, governments should expand access to vocational education, which enables workers to adapt to technological change."},"level":1,"explain":"governmentsが主語、should expandが述語で、which節が職業教育を補足する。enable A to doで可能になる行動を示し、論述で政策の効果を説明する。別の言い方: allow workers to adapt"},{"id":"p1-template-007","q":"In ___, I remain convinced that reducing economic inequality requires not only financial assistance but also investment in education.","q_ja":"結論として、経済格差を縮小するには金銭的な支援だけでなく教育への投資も必要だと、私は引き続き確信している。","choices":[{"t":"conclusion","why":"正解。直前の前置詞と組み合わせると「結論として」という定型表現になり、立場の再提示を導ける。"},{"t":"closure","why":"終結を表す名詞だが、この位置では論述の結論を導く定型表現にならない。"},{"t":"completion","why":"完了を表す名詞。この位置では「結論として」という意味の定型表現にならない。"},{"t":"ending","why":"終わりを表す名詞。この前置詞と組み合わせても、結論を導入する定型表現にはならない。"}],"answer":0,"point":"結論では序論の立場を再提示し、「～だけでなく～も」という構文で本論の二つの観点を簡潔にまとめられる。","drive":{"ja":"結論として、経済格差の縮小には金銭的支援だけでなく教育への投資も必要だと、確信を改めて示してください。","en":"In conclusion, I remain convinced that reducing economic inequality requires not only financial assistance but also investment in education."},"level":1,"explain":"that節は動名詞句が主語、requiresが動詞で、Iの確信の内容を示す。not only A but also Bで名詞句を並べ、論述で対策を併記する。別の言い方: both aid and investment"},{"id":"p1-template-008","q":"I support greater transparency in public spending on the ___ that citizens are entitled to scrutinize how their taxes are used.","q_ja":"市民には税金の使途を精査する権利があることを根拠に、私は公的支出の透明性を高めることを支持する。","choices":[{"t":"motives","why":"行動の動機を指す名詞。この形では、後ろの節を主張の根拠として導入する定型表現にならない。"},{"t":"causes","why":"出来事の原因を指す名詞。この形では、後ろの節を支持の根拠として導入できない。"},{"t":"grounds","why":"正解。前の前置詞と冠詞、後ろの接続詞を合わせると「～という根拠で」という定型表現になる。"},{"t":"origins","why":"物事の起源を指す名詞。この形では、主張の根拠を示す定型表現にならない。"}],"answer":2,"point":"序論では「～という根拠で」という定型表現により、立場とその基本的な根拠を示せる。本論で根拠を詳しく展開する。","drive":{"ja":"序論で、市民には税金の使途を精査する権利があることを根拠に、公的支出の透明性向上を支持してください。","en":"I support greater transparency in public spending on the grounds that citizens are entitled to scrutinize how their taxes are used."},"level":3,"explain":"I supportが主節で、on the grounds that以下が支持の根拠を示す。how節をscrutinizeの目的語にして、論述で確認すべき内容を示せる。別の言い方: be entitled to examine tax use"},{"id":"p1-template-009","q":"Having considered these arguments, I have ___ to the conclusion that international institutions should strengthen their efforts to resolve regional conflicts.","q_ja":"これらの議論を検討した結果、国際機関は地域紛争の解決に向けた取り組みを強化すべきだという結論に私は至った。","choices":[{"t":"arrived","why":"結論に至ることを表す場合、後ろには別の前置詞を用いる。ここにある前置詞とは組み合わせない。"},{"t":"come","why":"正解。後ろの前置詞と名詞句を合わせると「～という結論に至る」という定型表現になる。"},{"t":"reached","why":"結論に達することを表せるが、結論を表す名詞句を直接続けるため、ここにある前置詞が余分になる。"},{"t":"approached","why":"近づくという意味で、対象の名詞句を直接続ける。この形では「結論に至った」を表せない。"}],"answer":1,"point":"結論では、議論を検討済みであることを完了形の分詞構文で示し、「結論に至る」という定型表現につなげられる。","drive":{"ja":"結論で、これらの議論を検討した結果、国際機関は地域紛争の解決に向けた取り組みを強化すべきだという結論に至ったと述べてください。","en":"Having considered these arguments, I have come to the conclusion that international institutions should strengthen their efforts to resolve regional conflicts."},"level":2,"explain":"Having consideredは主語Iによる先行の検討を示し、that節が結論の内容を表す。have comeで今得ている結論を示し、論述の締めに使える。別の言い方: I have reached the conclusion that"},{"id":"p1-template-010","q":"I firmly believe that maintaining the independence of scientific research is ___ the utmost importance when governments allocate public funds.","q_ja":"政府が公的資金を配分する際、科学研究の独立性を維持することが極めて重要だと、私は固く信じている。","choices":[{"t":"with","why":"付随や手段などを示す前置詞。この位置では、後ろの名詞句と合わせて「極めて重要な」を表せない。"},{"t":"at","why":"地点や水準などを示す前置詞。この名詞句とは組み合わせず、「極めて重要な」という表現にはならない。"},{"t":"by","why":"手段や行為者などを示す前置詞。この位置では、後ろの名詞句と合わせて重要性を表せない。"},{"t":"of","why":"正解。後ろの名詞句と組み合わせると「極めて重要な」という意味になり、重要性を強調できる。"}],"answer":3,"point":"序論では固い信念を示す定型文に、重要性を表す前置詞と抽象名詞の表現を組み合わせ、主張を明確にできる。","drive":{"ja":"序論で、公的資金の配分に際して科学研究の独立性を維持することが極めて重要だと、固い信念を示してください。","en":"I firmly believe that maintaining the independence of scientific research is of the utmost importance when governments allocate public funds."},"level":2,"explain":"I believeのthat節では動名詞句が主語で、when節が資金配分の場面を示す。of＋抽象名詞で性質を表し、論述で重要性を強調する。別の言い方: extremely important"},{"id":"p1-template-201","q":"From my ___, governments should invest more in reliable public transport to reduce inequality.","q_ja":"私の見解では、政府は格差を減らすため、信頼できる公共交通機関への投資を増やすべきだ。","choices":[{"t":"outlook","why":"見方や見通しを表す名詞だが、見解を示す定型表現は from my perspective。"},{"t":"perspective","why":"正解。from my perspective は「私の見解では」という、序論で立場を示す表現。"},{"t":"attitude","why":"態度や考え方を表す名詞だが、from my attitude は「私の見解では」の定型表現にならない。"},{"t":"stance","why":"立場を表す名詞だが、この形で見解を導くときは perspective を使う。"}],"answer":1,"point":"序論で自分の見解を導く表現として From my perspective, ... を覚える。","level":1,"drive":{"ja":"私の見解では、政府は格差を減らすため、信頼できる公共交通機関への投資を増やすべきだ。","en":"From my perspective, governments should invest more in reliable public transport to reduce inequality."},"explain":"主語はgovernments、動詞はshould investで、to以下は目的を示す。From my perspectiveで判断の視点を明示し、論述の立場を示せる。別の言い方: in my view"},{"id":"p1-template-202","q":"Taking these considerations into ___, I maintain that local authorities should prioritize affordable housing when allocating limited public funds.","q_ja":"これらの点を考慮すると、自治体は限られた公的資金を配分する際、手頃な価格の住宅を優先すべきだと私は考える。","choices":[{"t":"regard","why":"考慮や配慮に関係する名詞だが、take ... into regard という組み合わせにはしない。"},{"t":"notice","why":"注意を表す名詞だが、take notice of ... と使い、take ... into notice とはしない。"},{"t":"attention","why":"注意を表す名詞だが、注意を向けるなら pay attention to ... とし、この構文には入らない。"},{"t":"account","why":"正解。take ... into account は「〜を考慮に入れる」で、結論の判断を導ける。"}],"answer":3,"point":"結論では Taking these considerations into account, ... で、論じた点を踏まえて立場を再提示できる。","level":2,"drive":{"ja":"これらの点を考慮すると、自治体は限られた公的資金を配分する際、手頃な価格の住宅を優先すべきだと私は考える。","en":"Taking these considerations into account, I maintain that local authorities should prioritize affordable housing when allocating limited public funds."},"explain":"分詞構文で考慮の前提を示し、I maintainのthat節に主張を置く。take A into accountは論点を判断に反映する型で、結論に使える。別の言い方: take A into consideration"},{"id":"p1-template-203","q":"In the final ___, I maintain that protecting judicial independence is essential to ensuring public institutions remain accountable, even during periods of instability.","q_ja":"結局のところ、不安定な時期であっても公的機関が説明責任を果たし続けるには、司法の独立を守ることが不可欠だと私は考える。","choices":[{"t":"analysis","why":"正解。in the final analysis は「結局のところ」で、議論を総合した結論を示す定型表現。"},{"t":"examination","why":"検討や試験を表す名詞だが、in the final examination では最終試験などを指し、結論を導く決まり文句にならない。"},{"t":"inspection","why":"検査を表す名詞で、in the final inspection は最終検査の場面を表し、議論の総括にはならない。"},{"t":"investigation","why":"調査を表す名詞で、in the final investigation は特定の最終調査を指し、「結局のところ」という定型表現ではない。"}],"answer":0,"point":"In the final analysis, ... は個別の検査ではなく、議論全体を踏まえた最終判断を導く。","level":3,"drive":{"ja":"結局のところ、不安定な時期であっても公的機関が説明責任を果たし続けるには、司法の独立を守ることが不可欠だと私は考える。","en":"In the final analysis, I maintain that protecting judicial independence is essential to ensuring public institutions remain accountable, even during periods of instability."},"explain":"I maintainのthat節では動名詞句が主語で、isが動詞。essential toの後は動名詞を置き、結論で必要条件を強調できる。別の言い方: ultimately"},{"id":"p1-template-204","q":"I am firmly ___ that public funding should support research into clean energy.","q_ja":"公的資金はクリーンエネルギーの研究を支えるべきだと、私は固く確信している。","choices":[{"t":"committed","why":"専念している状態を表す形容詞だが、be committed to ... と使い、that 節を直接続けない。"},{"t":"dedicated","why":"献身的な状態を表す形容詞だが、be dedicated to ... と使い、that 節を直接続けない。"},{"t":"convinced","why":"正解。be firmly convinced that ... は「〜だと固く確信している」で、序論の立場を明確にする。"},{"t":"devoted","why":"熱心に取り組む状態を表す形容詞だが、be devoted to ... と使い、that 節を直接続けない。"}],"answer":2,"point":"I am firmly convinced that ... で、根拠を続ける前に強い確信を表せる。","level":1,"drive":{"ja":"公的資金はクリーンエネルギーの研究を支えるべきだと、私は固く確信している。","en":"I am firmly convinced that public funding should support research into clean energy."},"explain":"I am convincedに確信の内容を示すthat節が続く。firmlyで確信を強め、shouldで政策提言を述べる型は論述の立場を鮮明にする。別の言い方: be certain that"},{"id":"p1-template-205","q":"I am of the ___ that stricter oversight of personal data is necessary to protect citizens from commercial exploitation.","q_ja":"市民を商業的な搾取から守るためには、個人データへの監督を強化する必要があるというのが私の意見だ。","choices":[{"t":"judgment","why":"判断を表す名詞だが、自分の判断を示すなら in my judgment などを使い、be of the judgment that とはしない。"},{"t":"opinion","why":"正解。be of the opinion that ... は「〜という意見である」という、序論で使える表現。"},{"t":"conclusion","why":"結論を表す名詞だが、come to the conclusion that ... とし、be of the conclusion that とはしない。"},{"t":"assumption","why":"想定を表す名詞だが、on the assumption that ... とし、be of the assumption that とはしない。"}],"answer":1,"point":"I am of the opinion that ... は、that 節で自分の立場を述べる序論の型。","level":2,"drive":{"ja":"市民を商業的な搾取から守るためには、個人データへの監督を強化する必要があるというのが私の意見だ。","en":"I am of the opinion that stricter oversight of personal data is necessary to protect citizens from commercial exploitation."},"explain":"I am of the opinionが骨組みで、that節は意見の内容、to以下は目的を示す。be of＋名詞で考えを示す型は、論述の冒頭で立場を述べるのに使える。別の言い方: hold the view that"},{"id":"p1-template-206","q":"On ___, I remain convinced that the long-term benefits of subsidizing preventive healthcare outweigh the initial burden on taxpayers and public institutions.","q_ja":"総合的に判断すると、予防医療に補助金を出す長期的な利益は、納税者と公的機関の当初の負担を上回ると、私は依然として確信している。","choices":[{"t":"proportion","why":"割合や釣り合いを表す名詞だが、on proportion は利点と負担を比較した総合判断を導く表現にならない。"},{"t":"comparison","why":"比較を表す名詞だが、on comparison は on balance のように「総合的に判断すると」を表す定型句ではない。"},{"t":"measure","why":"尺度や程度を表す名詞だが、on measure は議論を比較して結論を示す定型句ではない。"},{"t":"balance","why":"正解。on balance は利点と不利な点を比較したうえで「総合的に判断すると」を表す。"}],"answer":3,"point":"On balance, ... は利点と負担を比較した結論に使い、単なる追加理由は導かない。","level":3,"drive":{"ja":"総合的に判断すると、予防医療に補助金を出す長期的な利益は、納税者と公的機関の当初の負担を上回ると、私は依然として確信している。","en":"On balance, I remain convinced that the long-term benefits of subsidizing preventive healthcare outweigh the initial burden on taxpayers and public institutions."},"explain":"I remain convincedにthat節が続き、節内はbenefitsが主語、outweighが動詞。比較後の結論なのでOn balanceで利害を総合した判断と示せる。別の言い方: all things considered"},{"id":"p1-template-207","q":"For the reasons ___ above, I believe public libraries deserve continued financial support.","q_ja":"上で述べた理由から、公共図書館は継続的な財政支援を受けるに値すると私は考える。","choices":[{"t":"mentioned","why":"正解。the reasons mentioned above は「上で述べた理由」で、本文の理由を結論で受ける。"},{"t":"remarked","why":"言及するという意味に近いが、理由に言及するなら remark on the reasons となり、この受け身の形にはできない。"},{"t":"spoken","why":"話すことに関係する語だが、理由について話すなら speak about the reasons などとし、reasons spoken above とはしない。"},{"t":"told","why":"伝えることを表す語だが、tell は人や話などと組み合わせ、the reasons told above は理由の振り返りとして不自然。"}],"answer":0,"point":"For the reasons mentioned above, ... で、二つの理由段落を受けて結論の立場を述べる。","level":1,"drive":{"ja":"上で述べた理由から、公共図書館は継続的な財政支援を受けるに値すると私は考える。","en":"For the reasons mentioned above, I believe public libraries deserve continued financial support."},"explain":"I believeの後はthatを省いた節で、mentioned aboveはreasonsを修飾する。過去分詞で既述の理由をまとめ、結論の根拠を簡潔に示せる。別の言い方: for the reasons stated earlier"},{"id":"p1-template-208","q":"I would like to ___ my position that international cooperation is essential for addressing environmental challenges that extend beyond national borders.","q_ja":"国境を越える環境問題に対処するには国際協力が不可欠であるという私の立場を、改めて述べたい。","choices":[{"t":"replicate","why":"複製するという意味の動詞だが、意見としての立場を改めて述べるときは reiterate を使う。"},{"t":"duplicate","why":"複製するという意味の動詞で、主張を言葉で再提示するというこの文の意図には合わない。"},{"t":"reiterate","why":"正解。reiterate my position は「自分の立場を改めて述べる」で、結論の再主張に使える。"},{"t":"reproduce","why":"再現するという意味の動詞だが、ここでは立場の再現ではなく、主張を改めて述べる reiterate が適切。"}],"answer":2,"point":"結論で I would like to reiterate my position that ... と置くと、序論の立場を再提示できる。","level":2,"drive":{"ja":"国境を越える環境問題に対処するには国際協力が不可欠であるという私の立場を、改めて述べたい。","en":"I would like to reiterate my position that international cooperation is essential for addressing environmental challenges that extend beyond national borders."},"explain":"I would like to reiterateが骨組みで、最初のthat節は立場の内容、次のthat節は課題を修飾する。reiterateで再提示と示せば、結論で主張に戻れる。別の言い方: restate my position"},{"id":"p1-template-209","q":"By ___ of conclusion, I reaffirm my belief that regulating artificial intelligence requires international standards that protect fundamental rights while allowing responsible innovation.","q_ja":"結びとして、人工知能の規制には、責任ある技術革新を認めつつ基本的権利を守る国際基準が必要だという私の考えを、改めて表明する。","choices":[{"t":"means","why":"by means of は「〜という手段によって」で、conclusion を続けても「結びとして」という定型句にはならない。"},{"t":"way","why":"正解。by way of conclusion は「結びとして」という、論述の結論を導く定型表現。"},{"t":"method","why":"方法を表す名詞だが、by method of conclusion は結論を導く定型表現ではない。"},{"t":"manner","why":"方法や様式を表す名詞だが、by manner of conclusion は「結びとして」の定型表現ではない。"}],"answer":1,"point":"By way of conclusion, ... の by way of はここでは「〜として」で、手段を表す by means of と区別する。","level":3,"drive":{"ja":"結びとして、人工知能の規制には、責任ある技術革新を認めつつ基本的権利を守る国際基準が必要だという私の考えを、改めて表明する。","en":"By way of conclusion, I reaffirm my belief that regulating artificial intelligence requires international standards that protect fundamental rights while allowing responsible innovation."},"explain":"I reaffirmが主節で、beliefの内容をthat節で説明し、while以下は権利保護と革新の両立を示す。By way of conclusionは論述を締める合図になる。別の言い方: in conclusion"},{"id":"p1-template-210","q":"In ___ of these points, governments should ensure equal access to essential health services.","q_ja":"これらの点を踏まえて、政府は不可欠な医療サービスを平等に利用できるようにすべきだ。","choices":[{"t":"sight","why":"視覚に関係する名詞だが、in sight of は見える範囲を表し、論拠を踏まえた判断は示さない。"},{"t":"vision","why":"視野や展望を表す名詞だが、in vision of は論拠を受けて結論を導く表現ではない。"},{"t":"outlook","why":"見通しや考え方を表す名詞だが、in outlook of という形で「〜を踏まえて」とは言わない。"},{"t":"light","why":"正解。in light of ... は「〜を踏まえて」で、本文の論拠から結論を導ける。"}],"answer":3,"point":"In light of these points, ... で、本文で示した二つの論拠を結論の判断につなぐ。","level":1,"drive":{"ja":"これらの点を踏まえて、政府は不可欠な医療サービスを平等に利用できるようにすべきだ。","en":"In light of these points, governments should ensure equal access to essential health services."},"explain":"主語はgovernments、動詞はshould ensureで、equal accessが目的語。In light ofで判断の根拠を示せば、論述で証拠から提言へつなげられる。別の言い方: in view of these points"},{"id":"p1-template-211","q":"I ___ believe that governments should protect public services for the following two reasons.","q_ja":"私は、次の二つの理由から、政府は公共サービスを守るべきだと強く考える。","choices":[{"t":"tightly","why":"「きつく」という意味で、信念の強さを表す定型表現には使わない。"},{"t":"stiffly","why":"「堅苦しく」という意味で、強い確信を述べる表現には合わない。"},{"t":"firmly","why":"正解。強い立場を示す「強く信じる」という定型表現になる。"},{"t":"rigidly","why":"「融通が利かないほど厳格に」という意味で、確信を示す定型表現には合わない。"}],"answer":2,"point":"４段落構成の序論では、強く信じるという表現で立場を示し、続く二つの理由を予告できる。","level":1,"drive":{"ja":"序論で、政府は公共サービスを守るべきだと強く考え、理由を二つ示すと述べてください。","en":"I firmly believe that governments should protect public services for the following two reasons."},"explain":"主語Iと動詞believeに続くthat節が主張を示し、文末で理由を二つ予告する。firmlyは確信の強さを添え、論述の立場を明確にする。別の言い方: strongly believe"},{"id":"p1-template-212","q":"In ___ of these points, I believe that public investment in renewable energy is justified.","q_ja":"これらの点を踏まえると、再生可能エネルギーへの公的投資は妥当だと私は考える。","choices":[{"t":"light","why":"正解。「これらの点を踏まえて」という結論の定型表現になる。"},{"t":"insight","why":"「洞察」という名詞だが、この位置では「踏まえて」という定型表現にならない。"},{"t":"outlook","why":"「見通し」という名詞だが、この前置詞の組み合わせでは使わない。"},{"t":"perspective","why":"「観点」という名詞だが、この形では「これらの点を踏まえて」を表せない。"}],"answer":0,"point":"４段落構成の結論では、これらの点を踏まえて、という型で本論の二つの理由を受ける。","level":1,"drive":{"ja":"結論で、これらの点を踏まえると再生可能エネルギーへの公的投資は妥当だと述べてください。","en":"In light of these points, I believe that public investment in renewable energy is justified."},"explain":"冒頭で判断の根拠を示し、I believeのthat節で投資は妥当だと述べる。in light ofは既出の論点を結論の根拠として受けるのに適する。別の言い方: considering these points"},{"id":"p1-template-213","q":"I am of the ___ that public transport deserves greater financial support from national governments.","q_ja":"公共交通には国の政府からの財政支援をさらに充実させるべきだと私は考える。","choices":[{"t":"attitude","why":"「態度」という名詞だが、この型で意見を述べる語にはならない。"},{"t":"judgment","why":"「判断」という名詞だが、この前置詞を伴う意見表明の定型表現には合わない。"},{"t":"thought","why":"「考え」という名詞だが、この型で自分の意見を述べる際には使わない。"},{"t":"opinion","why":"正解。「私は〜という意見である」という序論の定型表現になる。"}],"answer":3,"point":"４段落構成の序論では、私は〜という意見である、という型に主張を続けられる。","level":1,"drive":{"ja":"序論で、公共交通への国の財政支援をさらに充実させるべきだという意見を述べてください。","en":"I am of the opinion that public transport deserves greater financial support from national governments."},"explain":"主語Iにam of the opinionが続き、that節が意見の中身を示す。be of the opinionは論述で自分の判断を改まった調子で提示できる。別の言い方: hold the view"},{"id":"p1-template-214","q":"It ___ to reason that governments should protect access to essential services, regardless of household income.","q_ja":"世帯収入にかかわらず、政府が必要不可欠なサービスの利用機会を守るべきなのは当然だ。","choices":[{"t":"rises","why":"「上がる」という動詞だが、「当然である」を表すこの定型表現には使わない。"},{"t":"stands","why":"正解。「〜は理にかなっている、当然である」という定型表現になる。"},{"t":"mounts","why":"「増す、登る」という動詞だが、この型では当然の判断を示せない。"},{"t":"climbs","why":"「登る」という動詞だが、この組み合わせは意見表明の定型表現にならない。"}],"answer":1,"point":"４段落構成の序論では、理にかなっているという型で主張を提示できるが、自明といえる内容に用いる。","level":1,"drive":{"ja":"序論で、所得にかかわらず必要不可欠なサービスの利用機会を政府が守るのは当然だと述べてください。","en":"It stands to reason that governments should protect access to essential services, regardless of household income."},"explain":"Itは形式主語で、that節が当然とされる内容を示す。stand to reasonは論述で道理にかなう判断を述べ、regardless ofは所得による例外を認めない。別の言い方: be only logical"},{"id":"p1-template-215","q":"Taking these considerations into ___, I maintain that stricter oversight of automated decision-making is necessary to protect the public interest.","q_ja":"これらの点を考慮に入れると、公共の利益を守るため、自動化された意思決定への監督を強化する必要があると私は考える。","choices":[{"t":"report","why":"「報告」という名詞だが、「考慮に入れる」という定型表現にはならない。"},{"t":"record","why":"「記録」という名詞だが、この型では検討事項を考慮する意味にならない。"},{"t":"account","why":"正解。「これらの点を考慮に入れて」という結論の定型表現になる。"},{"t":"statement","why":"「声明、記述」という名詞だが、この動詞と前置詞の組み合わせには合わない。"}],"answer":2,"point":"４段落構成の結論では、これらの点を考慮に入れて、という分詞構文で理由を受け、主張を再提示できる。","level":2,"drive":{"ja":"結論で、これらの点を考慮に入れ、公共の利益を守るには自動化された意思決定への監督強化が必要だと述べてください。","en":"Taking these considerations into account, I maintain that stricter oversight of automated decision-making is necessary to protect the public interest."},"explain":"冒頭の分詞構文の主語はIで、maintainのthat節が主張、to不定詞が目的を示す。take into accountは検討内容を踏まえて結論を導く型。別の言い方: take into consideration"},{"id":"p1-template-216","q":"I take the ___ that international cooperation is essential for addressing environmental damage that extends beyond the borders of individual countries.","q_ja":"一国の国境を越えて広がる環境被害に対処するには、国際協力が不可欠だと私は考える。","choices":[{"t":"view","why":"正解。「私は〜という見解を取る」という序論の定型表現になる。"},{"t":"outlook","why":"「見通し」という名詞だが、この型で主張を導く定型表現にはならない。"},{"t":"judgment","why":"「判断」という名詞だが、この動詞で見解を示す定型表現には合わない。"},{"t":"perception","why":"「認識」という名詞だが、この型では自分の見解を提示できない。"}],"answer":0,"point":"４段落構成の序論では、私は〜という見解を取る、という型の後に主張を置ける。","level":2,"drive":{"ja":"序論で、一国の国境を越える環境被害に対処するには国際協力が不可欠だという見解を述べてください。","en":"I take the view that international cooperation is essential for addressing environmental damage that extends beyond the borders of individual countries."},"explain":"I take the viewのthat節が主張を示し、後のthat節は環境被害を修飾する。take the viewは論述で立場を示せ、for addressingで協力が必要な用途を限定する。別の言い方: believe"},{"id":"p1-template-217","q":"I ___ to the view that governments should require greater transparency from companies whose digital services influence public access to information.","q_ja":"情報を得る機会に影響を及ぼすデジタルサービスを提供する企業に対し、政府は透明性の向上を求めるべきだという見解に私は賛成する。","choices":[{"t":"enroll","why":"「登録する」という動詞で、見解への賛同を示すこの定型表現には使わない。"},{"t":"register","why":"「登録する、記録する」という動詞で、この型では見解への賛同を表せない。"},{"t":"enlist","why":"「入隊する、協力を得る」という動詞で、見解に賛同する意味にはならない。"},{"t":"subscribe","why":"正解。この前置詞と組み合わせると「〜という見解に賛同する」を表す。"}],"answer":3,"point":"４段落構成の序論では、見解に賛同するという型を使って立場を示せる。ここでの動詞は購読の意味ではない。","level":2,"drive":{"ja":"序論で、情報へのアクセスに影響するデジタルサービス企業に政府が透明性の向上を求めるべきだという見解への賛同を述べてください。","en":"I subscribe to the view that governments should require greater transparency from companies whose digital services influence public access to information."},"explain":"主語Iにsubscribeが続き、that節は見解の内容、whose節は企業の特徴を示す。subscribe toは論述で提示された見解への賛同を明示できる。別の言い方: agree with"},{"id":"p1-template-218","q":"On ___, I remain convinced that the long-term benefits of preventive healthcare justify sustained public funding, even when immediate financial pressures make such investment politically difficult.","q_ja":"総合的に判断すると、当面の財政難によって投資が政治的に難しくなっても、予防医療の長期的な利益は継続的な公的支出を正当化すると私は確信している。","choices":[{"t":"proportion","why":"「比率、釣り合い」という名詞だが、この前置詞との組み合わせで総合判断は示せない。"},{"t":"balance","why":"正解。利点と難点を比較して「総合的に判断すると」と述べる定型表現になる。"},{"t":"symmetry","why":"「対称、均整」という名詞だが、この型で賛否を踏まえた判断は表せない。"},{"t":"equilibrium","why":"「均衡」という名詞だが、この前置詞との組み合わせは結論の定型表現にならない。"}],"answer":1,"point":"４段落構成の結論では、総合的に判断すると、という型を使い、譲歩節で難点を認めながら立場を再提示できる。","level":3,"drive":{"ja":"結論で、当面の財政難による政治的な難しさを認めつつ、総合的には予防医療の長期的な利益が継続的な公的支出を正当化すると述べてください。","en":"On balance, I remain convinced that the long-term benefits of preventive healthcare justify sustained public funding, even when immediate financial pressures make such investment politically difficult."},"explain":"I remain convincedのthat節で確信を述べ、even when節で困難な状況を認める。on balanceは利点と難点を比較した論述の結論に使う。別の言い方: all things considered"},{"id":"p1-template-219","q":"By ___ of conclusion, I would emphasize that protecting scientific independence is essential if publicly funded research is to retain credibility while addressing urgent social needs.","q_ja":"結びとして、公的資金による研究が差し迫った社会の需要に応えながら信頼性を保つには、科学の独立性を守ることが不可欠だと強調したい。","choices":[{"t":"route","why":"「道筋」という名詞だが、この型で「結びとして」という役割は示せない。"},{"t":"course","why":"「進路、過程」という名詞だが、この前置詞の組み合わせは結論を導く定型表現にならない。"},{"t":"way","why":"正解。この前置詞の組み合わせで「結びとして」という定型表現になる。"},{"t":"path","why":"「道、方針」という名詞だが、この型は締めくくりを導く表現にはならない。"}],"answer":2,"point":"４段落構成の結論では、結びとして、という型で主張を締めくくれる。後半の条件節は、信頼性を保つための条件を示す。","level":3,"drive":{"ja":"結論で、結びとして、公的資金による研究が社会の需要に応えつつ信頼性を保つには科学の独立性が不可欠だと強調してください。","en":"By way of conclusion, I would emphasize that protecting scientific independence is essential if publicly funded research is to retain credibility while addressing urgent social needs."},"explain":"I would emphasizeのthat節で主張し、if節で条件、whileで同時進行を示す。by way of conclusionは結びを導き、be toは実現を目指す内容を示す。別の言い方: in conclusion"},{"id":"p1-template-220","q":"The arguments above lend ___ to my conviction that independent oversight should accompany the expansion of surveillance technologies, particularly where individual privacy is difficult to safeguard.","q_ja":"以上の議論は、特に個人のプライバシーを守るのが難しい場面では、監視技術の拡大に独立した監督を伴わせるべきだという私の確信を裏付ける。","choices":[{"t":"weight","why":"正解。この動詞と組み合わせると、主張や確信に説得力を与えることを表す。"},{"t":"mass","why":"「質量、大きな塊」という名詞だが、確信に説得力を与える定型表現には使わない。"},{"t":"volume","why":"「体積、量」という名詞だが、この型で主張の裏付けを示すことはできない。"},{"t":"density","why":"「密度」という名詞だが、この動詞との組み合わせで説得力は表せない。"}],"answer":0,"point":"４段落構成の結論では、以上の議論が確信を裏付ける、という型で本論の理由と立場を結び付けられる。","level":3,"drive":{"ja":"結論で、以上の議論は、特にプライバシー保護が難しい場面で監視技術の拡大に独立した監督を伴わせるべきだという確信を裏付けると述べてください。","en":"The arguments above lend weight to my conviction that independent oversight should accompany the expansion of surveillance technologies, particularly where individual privacy is difficult to safeguard."},"explain":"主語は先の議論、動詞はlendで、that節は確信の内容、where節は該当する状況を示す。lend weight toは論述で根拠が主張の説得力を増す関係を表す。別の言い方: give support to"}],"vocab_ej":[{"id":"p1-vocab_ej-001","q":"Independent inspections help [[enhance]] public confidence in the safety of nuclear power plants.","q_ja":"独立した立場からの検査は、原子力発電所の安全性に対する国民の信頼を高めるのに役立つ。","choices":[{"t":"〜を取り替える","why":"「取り替える」は replace の意味で、信頼の程度を高めることとは異なる。"},{"t":"〜を高める","why":"正解。enhance は質や価値などを高める意味で、ここでは国民の信頼を強めることを表す。"},{"t":"〜を取り囲む","why":"「取り囲む」は形の似た encircle などの意味で、enhance の意味ではない。"},{"t":"〜を見積もる","why":"「見積もる」は estimate の意味で、信頼を高めるという文意に合わない。"}],"answer":1,"point":"enhance public confidence で「国民の信頼を高める」。質・効果・価値などを高める際に使う。","level":1,"accept":["高める","向上させる","〜を向上させる","強める","〜を強める"],"drive":{"ja":"独立した立場からの検査は、原子力発電所の安全性に対する国民の信頼を高めるのに役立つ。","en":"Independent inspections help enhance public confidence in the safety of nuclear power plants."},"explain":"主語は検査で、help＋動詞の原形が信頼向上への貢献を述べる。enhanceは好ましい性質を強める語で、論述で施策の効果を示せる。別の言い方: boost public confidence"},{"id":"p1-vocab_ej-002","q":"Governments should [[phase out]] subsidies for fossil fuels gradually, allowing businesses enough time to invest in cleaner sources of energy.","q_ja":"政府は、企業がより環境負荷の低いエネルギー源に投資するための十分な時間を確保できるよう、化石燃料への補助金を段階的に廃止すべきだ。","choices":[{"t":"段階的に導入する","why":"これは phase in の意味で、phase out は制度などを段階的に終わらせることを表す。"},{"t":"一時的に停止する","why":"phase out は再開を前提とした一時停止ではなく、廃止に向けて徐々に減らすことを表す。"},{"t":"対象別に配分する","why":"補助金の配分方法を変える意味はなく、補助金自体をなくしていくという文意である。"},{"t":"段階的に廃止する","why":"正解。phase out は徐々に使用や実施をやめる意味で、企業に移行期間を与えるという後半ともつながる。"}],"answer":3,"point":"phase out は「段階的に廃止する」。導入を表す phase in と区別する。","level":2,"accept":["徐々に廃止する","〜を段階的に廃止する","段階的になくす","徐々になくす"],"drive":{"ja":"政府は、企業がより環境負荷の低いエネルギー源に投資するための十分な時間を確保できるよう、化石燃料への補助金を段階的に廃止すべきだ。","en":"Governments should phase out subsidies for fossil fuels gradually, allowing businesses enough time to invest in cleaner sources of energy."},"explain":"主語は政府で、shouldが提言、allowing以下が廃止に伴う結果を示す。phase outは移行期間を含むため、論述で実行可能な政策を提案できる。別の言い方: gradually eliminate"},{"id":"p1-vocab_ej-003","q":"Although automation requires substantial initial investment, subsequent savings in operating costs may [[offset]] that expense without reducing the amount companies must pay at the outset.","q_ja":"自動化には多額の初期投資が必要だが、その後の運営費の節約によって、企業が当初支払わなければならない額を減らすことなく、その支出を相殺できる可能性がある。","choices":[{"t":"〜を相殺する","why":"正解。offset は別の利益などで負担を埋め合わせる意味で、後の節約が初期支出を補うことを表す。"},{"t":"〜を値引きする","why":"当初の支払額は減らないと明記されており、初期費用そのものを値引きする意味ではない。"},{"t":"〜を先送りする","why":"後の節約で支出を埋め合わせるのであり、初期費用の支払いを延期するとは述べていない。"},{"t":"〜を算定する","why":"費用を計算するという意味はなく、節約額が支出を埋め合わせる関係を表している。"}],"answer":0,"point":"offset an expense は「支出を相殺する」。支出自体の値引きや支払いの延期とは区別する。","level":3,"accept":["相殺する","埋め合わせる","〜を埋め合わせる","補う","〜を補う"],"drive":{"ja":"自動化には多額の初期投資が必要だが、その後の運営費の節約によって、企業が当初支払わなければならない額を減らすことなく、その支出を相殺できる可能性がある。","en":"Although automation requires substantial initial investment, subsequent savings in operating costs may offset that expense without reducing the amount companies must pay at the outset."},"explain":"Although節で初期負担を認め、主節では節約が支出を補う可能性を述べる。offsetは費用と便益を対応させる語で、論述で負担への反論に使える。別の言い方: compensate for"},{"id":"p1-vocab_ej-004","q":"Strict limits on construction help [[preserve]] natural habitats that would otherwise disappear as cities expand.","q_ja":"建設を厳しく制限することは、そうしなければ都市の拡大に伴って失われてしまう自然の生息地を保全するのに役立つ。","choices":[{"t":"〜を観察する","why":"「観察する」は observe の意味で、生息地を失われないように守ることとは異なる。"},{"t":"〜を予測する","why":"「予測する」は形の似た predict の意味で、preserve の意味ではない。"},{"t":"〜を保全する","why":"正解。preserve は損なわれたり失われたりしないよう守る意味で、建設の制限によって生息地を残すことを表す。"},{"t":"〜を予約する","why":"「予約する」は形の似た reserve の意味で、この文の preserve には当てはまらない。"}],"answer":2,"point":"preserve natural habitats で「自然の生息地を保全する」。文化遺産などを守る場合にも使う。","level":1,"accept":["保全する","保護する","〜を保護する","守る","〜を守る","保存する"],"drive":{"ja":"建設を厳しく制限することは、そうしなければ都市の拡大に伴って失われてしまう自然の生息地を保全するのに役立つ。","en":"Strict limits on construction help preserve natural habitats that would otherwise disappear as cities expand."},"explain":"主語は建設制限で、helpが保全への貢献、関係節が失われ得る生息地を説明する。preserveは消失を防ぐ語で、論述で保護策の必要性を示せる。別の言い方: protect natural habitats"},{"id":"p1-vocab_ej-005","q":"Companies handling personal information must [[comply with]] privacy regulations, even when doing so increases the cost of developing new digital services.","q_ja":"個人情報を扱う企業は、新たなデジタルサービスの開発費が増える場合でも、プライバシーに関する規制を遵守しなければならない。","choices":[{"t":"〜を遵守する","why":"正解。comply with は規則や要求などに従う意味で、企業が規制を守る必要性を述べている。"},{"t":"〜を編集する","why":"「編集する」は形の似た compile と混同しやすい意味で、comply with は規制の編集を表さない。"},{"t":"〜と競争する","why":"「競争する」は compete with の意味で、規制に従うという文意には合わない。"},{"t":"〜を補完する","why":"「補完する」は complement の意味で、規制の不足を補うという文ではない。"}],"answer":0,"point":"comply with regulations で「規制を遵守する」。前置詞 with と一緒に覚える。","level":2,"accept":["遵守する","守る","〜を守る","従う","〜に従う","順守する","〜を順守する"],"drive":{"ja":"個人情報を扱う企業は、新たなデジタルサービスの開発費が増える場合でも、プライバシーに関する規制を遵守しなければならない。","en":"Companies handling personal information must comply with privacy regulations, even when doing so increases the cost of developing new digital services."},"explain":"主語は個人情報を扱う企業で、mustが義務、even when節が不利な状況を示す。comply withは規則への服従を表し、論述で企業の責任を述べられる。別の言い方: adhere to"},{"id":"p1-vocab_ej-006","q":"Replacing trained inspectors with cheaper automated checks could [[compromise]] passenger safety if the system failed to detect faults that experienced staff would normally identify.","q_ja":"訓練を受けた検査員を低コストの自動検査に置き換えると、経験豊かな職員なら通常見つけられる欠陥をシステムが検知できない場合、乗客の安全を損なうおそれがある。","choices":[{"t":"〜で折り合う","why":"compromise には「妥協する」という意味もあるが、ここでは安全を目的語に取り、安全への悪影響を表す。"},{"t":"〜を保証する","why":"欠陥を見逃す可能性を述べているため、安全を確実にするという意味ではない。"},{"t":"〜を損なう","why":"正解。compromise は安全性などを損なう意味でも使われ、ここでは検知の失敗が安全を脅かすことを表す。"},{"t":"〜を評価する","why":"安全性を測定・評価するという意味はなく、検査方法の変更によって生じる危険を述べている。"}],"answer":2,"point":"compromise safety は「安全を損なう」。compromise の「妥協する」という意味と文型で区別する。","level":3,"accept":["損なう","危うくする","〜を危うくする","脅かす","〜を脅かす","低下させる"],"drive":{"ja":"訓練を受けた検査員を低コストの自動検査に置き換えると、経験豊かな職員なら通常見つけられる欠陥をシステムが検知できない場合、乗客の安全を損なうおそれがある。","en":"Replacing trained inspectors with cheaper automated checks could compromise passenger safety if the system failed to detect faults that experienced staff would normally identify."},"explain":"動名詞句が主語で、couldが危険の可能性、if節がその条件を示す。compromiseは安全を目的語に取ると悪影響を表し、論述で効率化のリスクを指摘できる。別の言い方: endanger passenger safety"},{"id":"p1-vocab_ej-007","q":"Local authorities need sufficient funding to [[implement]] policies aimed at reducing inequality in access to education.","q_ja":"地方自治体が教育を受ける機会の格差を縮めるための政策を実施するには、十分な資金が必要である。","choices":[{"t":"〜を暗示する","why":"「暗示する」は形の似た imply の意味で、政策を実行に移すこととは異なる。"},{"t":"〜を輸入する","why":"「輸入する」は形の似た import の意味で、implement の意味ではない。"},{"t":"〜を検討する","why":"ここでは政策を考慮する段階ではなく、実際に実行するための資金を述べている。"},{"t":"〜を実施する","why":"正解。implement は計画や政策などを実行に移す意味で、必要な資金についての文脈に合う。"}],"answer":3,"point":"implement policies で「政策を実施する」。計画を考える段階から実行に移す動詞。","level":1,"accept":["実施する","実行する","〜を実行する","実行に移す","〜を実行に移す"],"drive":{"ja":"地方自治体が教育を受ける機会の格差を縮めるための政策を実施するには、十分な資金が必要である。","en":"Local authorities need sufficient funding to implement policies aimed at reducing inequality in access to education."},"explain":"主語は地方自治体で、needが必要性、不定詞が資金の目的を示す。implementは政策を実行に移す語で、論述で実施に必要な条件を論じられる。別の言い方: put policies into practice"},{"id":"p1-vocab_ej-008","q":"Unpaid internships may [[constitute]] a barrier to social mobility, since applicants from poorer households often cannot afford to work without a salary.","q_ja":"低所得世帯の応募者は無給で働く経済的余裕がないことが多いため、無給のインターンシップは社会的地位を向上させるうえでの障壁となる可能性がある。","choices":[{"t":"〜に貢献する","why":"「貢献する」は形の似た contribute to の意味で、constitute a barrier は障壁そのものになることを表す。"},{"t":"〜に相当する","why":"正解。constitute はあるものに当たる、またはそれを成すという意味で、ここでは障壁となることを表す。"},{"t":"〜に相談する","why":"「相談する」は形の似た consult の意味で、障壁を成すという文意には合わない。"},{"t":"〜を取り除く","why":"無給で働けない人の機会を制限するという文であり、障壁をなくす意味ではない。"}],"answer":1,"point":"constitute a barrier は「障壁となる」。constitute は「構成する」のほか「〜に相当する」も表す。","level":2,"accept":["相当する","〜に当たる","当たる","〜となる","〜を成す","構成する"],"drive":{"ja":"低所得世帯の応募者は無給で働く経済的余裕がないことが多いため、無給のインターンシップは社会的地位を向上させるうえでの障壁となる可能性がある。","en":"Unpaid internships may constitute a barrier to social mobility, since applicants from poorer households often cannot afford to work without a salary."},"explain":"主語は無給実習で、mayが可能性、since節が障壁となる理由を示す。constituteは何に当たるかを示す語で、要約で制度の問題点を簡潔に示せる。別の言い方: pose a barrier"},{"id":"p1-vocab_ej-009","q":"Although the pilot reduced delays, the report offered only [[qualified]] support for expansion, noting that costs in rural areas remained uncertain.","q_ja":"試験的な導入によって遅延は減ったものの、報告書は、農村部での費用が依然として不確かなことを指摘し、拡大には留保付きの支持しか示さなかった。","choices":[{"t":"資格を備えた","why":"qualified は人について「資格のある」とも訳すが、ここで修飾しているのは人ではなく支持である。"},{"t":"全面的である","why":"only と費用への懸念が示すように支持には制限があり、全面的な賛成という意味ではない。"},{"t":"留保を伴った","why":"正解。qualified support は懸念や条件を伴う限定的な支持で、費用が不確かな点と対応する。"},{"t":"数値で示した","why":"「数値で示した」は quantified などに対応し、形の似た qualified のこの用法とは異なる。"}],"answer":2,"point":"qualified support は「留保付きの支持」。人の資格を表す qualified とは、修飾する名詞で区別する。","level":3,"accept":["留保付きの","留保つきの","条件付きの","条件つきの","限定的な","制限のある"],"drive":{"ja":"試験的な導入によって遅延は減ったものの、報告書は、農村部での費用が依然として不確かなことを指摘し、拡大には留保付きの支持しか示さなかった。","en":"Although the pilot reduced delays, the report offered only qualified support for expansion, noting that costs in rural areas remained uncertain."},"explain":"Although節が成果を認め、主節が報告書の支持、noting以下が留保の理由を示す。qualifiedは支持の範囲を限る語で、要約で賛成の程度を正確に伝えられる。別の言い方: support with reservations"},{"id":"p1-vocab_ej-010","q":"Investment in preventive healthcare may reduce public spending [[in the long run]] despite its initial costs.","q_ja":"予防医療への投資は、初期費用がかかるものの、長期的には公的支出を減らす可能性がある。","choices":[{"t":"長期的に見れば","why":"正解。in the long run は長い期間で考えた場合を表し、初期費用と将来の節約を対比している。"},{"t":"短期的に見れば","why":"これは in the short run の意味で、long が表す時間の長さと逆になる。"},{"t":"実施に先立って","why":"実施前という意味はなく、投資の効果を長い期間で評価する表現である。"},{"t":"定期的に繰り返し","why":"繰り返す頻度を表す熟語ではなく、長期的な結果について述べている。"}],"answer":0,"point":"in the long run は「長期的には」。当面の費用と将来の効果を比較する論述で使える。","level":1,"accept":["長期的には","長期的に","長い目で見れば","長い目で見ると","長期的な観点では"],"drive":{"ja":"予防医療への投資は、初期費用がかかるものの、長期的には公的支出を減らす可能性がある。","en":"Investment in preventive healthcare may reduce public spending in the long run despite its initial costs."},"explain":"主語は予防医療への投資で、may reduceが効果の可能性、despiteが費用との逆接を示す。in the long runは評価の時間軸を定め、論述で将来の便益を示せる。別の言い方: in the long term"},{"id":"p1-vocab_ej-011","q":"Universities seeking to [[retain]] experienced researchers should provide stable employment, as short contracts may encourage them to accept positions at institutions abroad.","q_ja":"経験豊かな研究者を引き留めようとする大学は、短期契約だと研究者が海外の機関の職に就くよう促しかねないため、安定した雇用を提供すべきだ。","choices":[{"t":"〜を再訓練する","why":"「再訓練する」は形の似た retrain の意味で、ここでは研究者の技能を訓練し直す話ではない。"},{"t":"〜を引き留める","why":"正解。retain は保持する意味で、人を目的語に取るここでは研究者に組織にとどまってもらうことを表す。"},{"t":"〜を採用する","why":"新しく雇うことではなく、所属する研究者が海外へ移るのを防ぐという文意である。"},{"t":"〜を呼び戻す","why":"すでに去った人を戻すという意味はなく、研究者が離れずに残るようにすることを表す。"}],"answer":1,"point":"retain researchers は「研究者を引き留める」。retain は人・情報・権利などを保持する場合に使う。","level":2,"accept":["引き留める","引き止める","〜を引き止める","つなぎ留める","〜をつなぎ留める","確保し続ける"],"drive":{"ja":"経験豊かな研究者を引き留めようとする大学は、短期契約だと研究者が海外の機関の職に就くよう促しかねないため、安定した雇用を提供すべきだ。","en":"Universities seeking to retain experienced researchers should provide stable employment, as short contracts may encourage them to accept positions at institutions abroad."},"explain":"主語は研究者を残したい大学で、shouldが提言、as節がその理由を示す。retainは在籍者を保つ語で、論述で人材流出への対策を述べられる。別の言い方: keep experienced researchers"},{"id":"p1-vocab_ej-012","q":"Although officials support the proposed dam, final approval remains [[subject to]] an independent review confirming that the project would not damage habitats downstream.","q_ja":"当局者は提案されているダムを支持しているが、最終承認には、その事業が下流の生息地を損なわないことを独立した審査で確認するという条件が依然として付いている。","choices":[{"t":"〜を話題とする","why":"subject の「主題」という名詞の意味との混同で、承認と審査の条件関係を表せない。"},{"t":"〜を免除される","why":"審査を受けなくてよいという意味ではなく、承認には審査による確認が必要だと述べている。"},{"t":"〜の影響を受けやすい","why":"subject to は悪天候などの影響を受けやすい場合にも使うが、ここでは承認に必要な条件を示す。"},{"t":"〜を条件とする","why":"正解。subject to はここでは条件付きであることを表し、当局者の支持だけでは最終承認にならない。"}],"answer":3,"point":"approval is subject to a review は「承認は審査を条件とする」。影響を受けやすいという別義と区別する。","level":3,"accept":["条件とする","〜が条件である","〜を条件としている","〜を必要条件とする","〜を前提とする"],"drive":{"ja":"当局者は提案されているダムを支持しているが、最終承認には、その事業が下流の生息地を損なわないことを独立した審査で確認するという条件が依然として付いている。","en":"Although officials support the proposed dam, final approval remains subject to an independent review confirming that the project would not damage habitats downstream."},"explain":"Although節が支持を認め、主節のremainsが承認条件の継続を示す。subject toは審査が必要な条件だと表し、要約で支持と承認を区別できる。別の言い方: conditional on"},{"id":"p1-vocab_ej-201","q":"Public investment in reliable transport can [[promote]] economic growth by connecting workers with more jobs.","q_ja":"信頼できる交通機関への公共投資は、働く人々をより多くの仕事と結び付けることで、経済成長を促進できる。","choices":[{"t":"〜を促進する","why":"正解。仕事へのアクセスを改善し、経済成長を後押しするという意味。"},{"t":"〜を制限する","why":"成長の範囲を狭める意味になり、成長を後押しするという文意と逆。"},{"t":"〜を測定する","why":"成長の規模を数値で調べる意味で、成長を促すことではない。"},{"t":"〜を予測する","why":"今後の成長を見通す意味で、成長を後押しすることではない。"}],"answer":0,"point":"promote は政策や投資が成長・発展などを「促進する」と述べるときに使う。","level":1,"accept":["促進する","成長を促す","〜を後押しする","後押しする"],"drive":{"ja":"信頼できる交通機関への公共投資は、働く人々をより多くの仕事と結び付けることで、経済成長を促進できる。","en":"Public investment in reliable transport can promote economic growth by connecting workers with more jobs."},"explain":"主語は公共投資、動詞はcan promoteで、by＋動名詞が手段を示す。promote＋成長は、意見論述で政策の効果を述べるのに使える。別の言い方: boost economic growth"},{"id":"p1-vocab_ej-202","q":"By providing a shared database, the government aims to [[facilitate]] cooperation between researchers who are developing more efficient methods of recycling.","q_ja":"政府は、共有データベースを提供することで、より効率的なリサイクル方法を開発している研究者間の協力を円滑にすることを目指している。","choices":[{"t":"〜に資金を出す","why":"資金提供を意味する訳だが、facilitate 自体に費用を支払う意味はない。"},{"t":"〜を義務付ける","why":"協力を強制する意味になるが、ここでは協力を進めやすくすること。"},{"t":"〜を円滑にする","why":"正解。情報を共有できるようにして、研究者間の協力を進めやすくするという意味。"},{"t":"〜の成果を測る","why":"協力の結果を評価する意味で、協力を進めやすくすることではない。"}],"answer":2,"point":"facilitate は活動を直接行うことではなく、その活動が進みやすい条件を整えること。","level":2,"accept":["円滑にする","〜を容易にする","容易にする","〜を促進する","促進する","協力を進めやすくする"],"drive":{"ja":"政府は、共有データベースを提供することで、より効率的なリサイクル方法を開発している研究者間の協力を円滑にすることを目指している。","en":"By providing a shared database, the government aims to facilitate cooperation between researchers who are developing more efficient methods of recycling."},"explain":"主語は政府、動詞はaimsで、冒頭のBy句は手段、who節は研究者の説明。aim to＋動詞は、要約で政策の狙いを示せる。別の言い方: make cooperation easier"},{"id":"p1-vocab_ej-203","q":"A lack of independent inspections may [[render]] strict environmental rules ineffective, since undetected violations allow companies to continue polluting rivers without facing penalties.","q_ja":"独立した検査がないことで、厳しい環境規則も実効性を失う可能性がある。発見されない違反によって、企業は罰則を受けずに河川の汚染を続けられるからだ。","choices":[{"t":"〜を明らかにする","why":"規則の実態を示す意味ではなく、目的語を特定の状態にする用法。"},{"t":"〜をある状態にする","why":"正解。render＋目的語＋形容詞で、目的語をその形容詞が表す状態にする。"},{"t":"〜を別の物に替える","why":"規則を他のものと交換する意味ではなく、ineffective が結果の状態を示す。"},{"t":"〜を元の形に戻す","why":"以前の状態への復元を意味する訳だが、この構文は結果として生じる状態を表す。"}],"answer":1,"point":"render＋目的語＋形容詞は「目的語を〜の状態にする」。後ろの形容詞まで読んで意味を取る。","level":3,"accept":["ある状態にする","〜の状態にする","〜にする","実効性を失わせる"],"drive":{"ja":"独立した検査がないことで、厳しい環境規則も実効性を失う可能性がある。発見されない違反によって、企業は罰則を受けずに河川の汚染を続けられるからだ。","en":"A lack of independent inspections may render strict environmental rules ineffective, since undetected violations allow companies to continue polluting rivers without facing penalties."},"explain":"主語は検査の欠如、動詞はmay renderで、since節が理由を示す。render＋目的語＋形容詞は、論述で制度が機能しなくなる結果を表せる。別の言い方: make the rules ineffective"},{"id":"p1-vocab_ej-204","q":"To protect personal information, governments should [[restrict]] access to sensitive data held by public agencies.","q_ja":"個人情報を守るため、政府は公的機関が保有する機密データへのアクセスを制限すべきだ。","choices":[{"t":"〜を許可する","why":"アクセスを認める意味で、利用できる範囲を狭める restrict とは異なる。"},{"t":"〜を記録する","why":"アクセスの履歴を残す意味で、アクセス自体を制限することではない。"},{"t":"〜を回復する","why":"失われたアクセスを取り戻す意味で、個人情報保護のための制限ではない。"},{"t":"〜を制限する","why":"正解。機密データを利用できる人や範囲を限るという意味。"}],"answer":3,"point":"restrict は利用・行動などの範囲を「制限する」。完全に禁止するとは限らない。","level":1,"accept":["制限する","〜を限定する","限定する","アクセスを制限する"],"drive":{"ja":"個人情報を守るため、政府は公的機関が保有する機密データへのアクセスを制限すべきだ。","en":"To protect personal information, governments should restrict access to sensitive data held by public agencies."},"explain":"主語は政府、動詞はshould restrictで、冒頭のTo句が目的を示す。held以下はデータを修飾し、論述で規制対象を具体化できる。別の言い方: limit access"},{"id":"p1-vocab_ej-205","q":"The council may [[withdraw]] financial support from the housing project if an independent review finds that its costs exceed the expected public benefits.","q_ja":"独立した審査で住宅事業の費用が予想される公共の利益を上回ると分かった場合、議会はその事業への資金援助を打ち切る可能性がある。","choices":[{"t":"〜の支給を延期する","why":"支給の時期を遅らせる意味だが、withdraw はここでは援助そのものを取りやめること。"},{"t":"〜の提供を打ち切る","why":"正解。withdraw support from で、対象への支援を撤回するという意味。"},{"t":"〜の総額を引き出す","why":"withdraw には預金を引き出す意味もあるが、ここでの目的語は資金援助であり預金ではない。"},{"t":"〜の使途を調査する","why":"資金の使い道を調べる意味ではなく、援助を撤回するという意味。"}],"answer":1,"point":"withdraw は目的語が support なら「支援を撤回する」、money などなら「お金を引き出す」。","level":2,"accept":["提供を打ち切る","〜を撤回する","撤回する","支援を打ち切る","資金援助を取りやめる"],"drive":{"ja":"独立した審査で住宅事業の費用が予想される公共の利益を上回ると分かった場合、議会はその事業への資金援助を打ち切る可能性がある。","en":"The council may withdraw financial support from the housing project if an independent review finds that its costs exceed the expected public benefits."},"explain":"主語は議会、動詞はmay withdrawで、if節が条件、that節が審査の判断内容を示す。mayは、要約で支援打ち切りの可能性を断定せず伝える。別の言い方: end financial support"},{"id":"p1-vocab_ej-206","q":"Unequal access to medical care may [[stem from]] the concentration of specialists in major cities, even when national insurance provides similar coverage for urban and rural residents.","q_ja":"国の保険制度が都市部と農村部の住民に同程度の保障を提供していても、医療を受ける機会の格差は、専門医が大都市に集中していることに起因する可能性がある。","choices":[{"t":"〜に起因する","why":"正解。専門医の集中を原因として、医療へのアクセス格差が生じるという因果関係。"},{"t":"〜につながる","why":"格差が専門医の集中を生むという逆向きの因果関係になり、stem from の意味と異なる。"},{"t":"〜と相関する","why":"単に関連して変化する意味ではなく、from の後ろが発生源や原因を表す。"},{"t":"〜を抑制する","why":"stem には流れなどを食い止める意味もあるが、stem from は原因に由来するという熟語。"}],"answer":0,"point":"Ａ stem from Ｂ は「ＡはＢに起因する」。from の後ろに原因が来るので因果の向きに注意する。","level":3,"accept":["起因する","〜に由来する","由来する","〜から生じる","〜が原因で生じる"],"drive":{"ja":"国の保険制度が都市部と農村部の住民に同程度の保障を提供していても、医療を受ける機会の格差は、専門医が大都市に集中していることに起因する可能性がある。","en":"Unequal access to medical care may stem from the concentration of specialists in major cities, even when national insurance provides similar coverage for urban and rural residents."},"explain":"主語は医療機会の格差、動詞はmay stem fromで、even when節が譲歩を示す。結果＋stem from＋原因で、論述の因果関係を整理できる。別の言い方: result from"},{"id":"p1-vocab_ej-207","q":"Affordable childcare reduces the financial [[burden]] on families and enables more parents to remain in employment.","q_ja":"手頃な料金の保育は家庭の経済的負担を減らし、より多くの親が働き続けられるようにする。","choices":[{"t":"収入","why":"家庭が得るお金のことで、支出によって生じる重荷を表す burden とは異なる。"},{"t":"支援","why":"家庭を助ける援助のことで、ここで減らされる経済的な重荷ではない。"},{"t":"負担","why":"正解。financial burden は、支出などによって生じる経済的な重荷を指す。"},{"t":"予算","why":"使う予定の金額を表す語で、支払いによる重荷そのものではない。"}],"answer":2,"point":"burden は「負担」。financial burden on families で「家庭にかかる経済的負担」を表す。","level":1,"accept":["経済的負担","経済的な負担","重荷","金銭的な負担"],"drive":{"ja":"手頃な料金の保育は家庭の経済的負担を減らし、より多くの親が働き続けられるようにする。","en":"Affordable childcare reduces the financial burden on families and enables more parents to remain in employment."},"explain":"主語は手頃な保育で、reducesとenablesをandで結ぶ。enable＋人＋to不定詞は、論述で負担軽減が就業継続を可能にする効果を示せる。別の言い方: financial strain"},{"id":"p1-vocab_ej-208","q":"When assessing the value of a new railway, policymakers should [[take into account]] the environmental costs as well as the expected ticket revenue.","q_ja":"新しい鉄道の価値を評価する際、政策立案者は予想される運賃収入に加え、環境への負荷も考慮すべきだ。","choices":[{"t":"〜を計算し直す","why":"金額などを再計算することに意味を限定しており、判断材料に含めるという熟語の意味とは異なる。"},{"t":"〜の説明を求める","why":"根拠の説明を要求する意味で、評価の際に要素を考慮することではない。"},{"t":"〜の費用を払う","why":"費用を負担する意味ではなく、環境への負荷を評価に織り込むという意味。"},{"t":"〜を考慮に入れる","why":"正解。運賃収入だけでなく、環境への負荷も判断材料に含めるという意味。"}],"answer":3,"point":"take into account は「〜を考慮に入れる」。費用の計算だけでなく、判断材料全般に使える。","level":2,"accept":["考慮に入れる","〜を考慮する","考慮する","〜を勘案する","判断材料に含める"],"drive":{"ja":"新しい鉄道の価値を評価する際、政策立案者は予想される運賃収入に加え、環境への負荷も考慮すべきだ。","en":"When assessing the value of a new railway, policymakers should take into account the environmental costs as well as the expected ticket revenue."},"explain":"主語は政策立案者、動詞はshould takeで、When句が評価時を示す。as well asで収入に環境負荷も加え、論述で多面的な判断を促せる。別の言い方: consider"},{"id":"p1-vocab_ej-209","q":"Although digital platforms widen access to information, users remain [[susceptible to]] misleading claims when recommendation systems repeatedly present material that confirms beliefs they already hold strongly.","q_ja":"デジタルプラットフォームは情報へのアクセスを広げるが、推薦システムが利用者の既に強く抱いている考えを裏付ける内容を繰り返し提示すると、利用者は依然として誤解を招く主張の影響を受けやすい。","choices":[{"t":"〜の影響を見抜ける","why":"主張が与える影響を認識できるという意味ではなく、影響を受けやすい性質を表す。"},{"t":"〜に対処する力がある","why":"問題に対応できる能力を表す訳だが、susceptible to は影響に対する弱さを示す。"},{"t":"〜の影響を受けやすい","why":"正解。既存の考えを裏付ける内容の反復により、誤解を招く主張に左右されやすいという意味。"},{"t":"〜の影響を受けている","why":"既に影響が生じていると断定する訳で、影響を受けやすい傾向を示す原文とは異なる。"}],"answer":2,"point":"susceptible to は「〜の影響を受けやすい」。実際に影響を受けたという断定とは区別する。","level":3,"accept":["影響を受けやすい","〜に左右されやすい","左右されやすい","〜に影響されやすい","影響されやすい"],"drive":{"ja":"デジタルプラットフォームは情報へのアクセスを広げるが、推薦システムが利用者の既に強く抱いている考えを裏付ける内容を繰り返し提示すると、利用者は依然として誤解を招く主張の影響を受けやすい。","en":"Although digital platforms widen access to information, users remain susceptible to misleading claims when recommendation systems repeatedly present material that confirms beliefs they already hold strongly."},"explain":"Although節で利点を認め、主節はusers remain、when節は影響を受けやすい状況を示す。remain＋形容詞は、論述で改善後も残る弱点を指摘できる。別の言い方: easily influenced by"},{"id":"p1-vocab_ej-210","q":"Equal access to basic healthcare should be a [[priority]] when governments decide how to spend taxes.","q_ja":"政府が税金の使い道を決める際には、基本的な医療を受ける機会の平等を優先事項とすべきだ。","choices":[{"t":"優先事項","why":"正解。他の課題より先に重視すべき事柄を表す。"},{"t":"前提条件","why":"判断が成り立つための条件を指す語で、先に重視すべき課題とは異なる。"},{"t":"実施手順","why":"政策を進める順序や方法を指す語で、優先して取り組む事柄ではない。"},{"t":"評価基準","why":"成果などを判断する物差しを指す語で、先に重視すべき事柄ではない。"}],"answer":0,"point":"priority は「優先事項」。be a priority で、優先して取り組むべき課題だと述べる。","level":1,"accept":["優先する事項","優先すべき事項","優先課題","優先して取り組む課題"],"drive":{"ja":"政府が税金の使い道を決める際には、基本的な医療を受ける機会の平等を優先事項とすべきだ。","en":"Equal access to basic healthcare should be a priority when governments decide how to spend taxes."},"explain":"主語は基本的な医療を受ける機会の平等で、should be a priorityは、それを優先事項とすべきだと述べる。when節は、政府が税金の使い道を決める場面を示す。別の言い方: Equal access to basic healthcare should be given priority when governments decide how to spend taxes."},{"id":"p1-vocab_ej-211","q":"Public housing should remain [[affordable]] for families whose incomes have not kept pace with inflation.","q_ja":"公営住宅は、収入の伸びが物価上昇に追いついていない家庭にも手の届く価格であり続けるべきだ。","choices":[{"t":"供給量が十分な","why":"供給量が十分かどうかではなく、家庭が住宅費を払えるかどうかを述べている。"},{"t":"手の届く価格の","why":"正解。収入が物価上昇に追いつかない家庭でも、費用を負担できるという意味。"},{"t":"収益性の高い","why":"住宅の事業収益を述べる訳で、住民にとっての負担の軽さを表さない。"},{"t":"入居条件の厳しい","why":"入居資格の厳しさではなく、住宅費の負担可能性が焦点になっている。"}],"answer":1,"point":"affordable は「手の届く価格の」。住宅や公共交通などの費用を論じるときに使う。","level":1,"accept":["手頃な価格の","手ごろな価格の","無理なく払える","負担できる価格の","購入や利用が可能な価格の"],"drive":{"ja":"公営住宅は、収入の伸びが物価上昇に追いついていない家庭にも手の届く価格であり続けるべきだ。","en":"Public housing should remain affordable for families whose incomes have not kept pace with inflation."},"explain":"公営住宅が主語、should remainが述語で、whose節は家庭の収入を説明する。remain＋形容詞で状態の維持を表し、論述で住宅費の負担軽減を求められる。別の言い方: reasonably priced"},{"id":"p1-vocab_ej-212","q":"Before approving the development, local authorities should assess its [[adverse]] effects on wetlands, which support a wide range of species.","q_ja":"開発を承認する前に、地方当局は、多様な生物種を支える湿地に対する開発の悪影響を評価すべきだ。","choices":[{"t":"予期されない","why":"adverse は悪い影響を表し、その影響が予想できるかどうかは表さない。"},{"t":"相互に及ぼす","why":"相互作用ではなく、開発が湿地にもたらす悪い影響について述べている。"},{"t":"徐々に現れる","why":"影響が現れる速さは示されておらず、adverse は影響の有害さを表す。"},{"t":"悪影響を及ぼす","why":"正解。adverse effects で、環境などに不利益や害をもたらす影響を意味する。"}],"answer":3,"point":"adverse は「有害な・不利な」。adverse effects で「悪影響」となる。","level":2,"accept":["有害な","不利な","好ましくない","悪い影響を与える","害を及ぼす"],"drive":{"ja":"開発を承認する前に、地方当局は、多様な生物種を支える湿地に対する開発の悪影響を評価すべきだ。","en":"Before approving the development, local authorities should assess its adverse effects on wetlands, which support a wide range of species."},"explain":"Before以下で承認前と示し、主節で当局の評価義務、which節で湿地の役割を補足する。adverse effectsは政策の弊害を論じるのに適する。別の言い方: harmful effects"},{"id":"p1-vocab_ej-213","q":"Although national guidelines define eligibility, local officials have [[discretion]] over the amount of emergency aid, allowing them to respond to differences in household circumstances.","q_ja":"国の指針が受給資格を定めているものの、緊急援助の額については地方の担当者に裁量があり、世帯ごとの事情の違いに対応できる。","choices":[{"t":"独自に判断する権限","why":"正解。援助額を世帯の事情に合わせて決められるため、ここでは裁量権を意味する。"},{"t":"情報を慎重に扱う姿勢","why":"discretion には慎重さという意味もあるが、ここでは援助額を決める権限を指す。"},{"t":"個々の違いを見分ける力","why":"違いを見分ける能力自体ではなく、事情に応じて援助額を決められることを述べている。"},{"t":"決定理由を説明する義務","why":"説明する義務ではなく、指針の範囲内で判断する権限を意味する。"}],"answer":0,"point":"have discretion over は「〜について裁量権がある」。discretion の「慎重さ」という意味と区別する。","level":3,"accept":["裁量","裁量権","自由裁量","自分で判断する権限","独自の判断で決める権限"],"drive":{"ja":"国の指針が受給資格を定めているものの、緊急援助の額については地方の担当者に裁量があり、世帯ごとの事情の違いに対応できる。","en":"Although national guidelines define eligibility, local officials have discretion over the amount of emergency aid, allowing them to respond to differences in household circumstances."},"explain":"Although節で国の基準を認め、主節で地方の裁量、allowing以下でその結果を示す。have discretion overで政策運用の柔軟性を論じられる。別の言い方: have authority to decide"},{"id":"p1-vocab_ej-214","q":"Digital public services must be [[accessible]] to older residents who lack advanced computer skills.","q_ja":"デジタル化された公共サービスは、高度なコンピューター技能を持たない高齢の住民にも利用しやすいものでなければならない。","choices":[{"t":"利用が義務の","why":"利用しやすさを表す語であり、サービスの利用を義務づける意味ではない。"},{"t":"情報を蓄える","why":"情報を蓄積する機能ではなく、高齢者がサービスを利用できるかを述べている。"},{"t":"利用しやすい","why":"正解。技能が十分でない住民にも、サービスを使いやすくするという文脈。"},{"t":"操作が複雑な","why":"操作の複雑さは利用を妨げるため、accessible の意味と逆になる。"}],"answer":2,"point":"accessible to は「〜にとって利用しやすい」。サービスへのアクセスの公平性を論じる際に使える。","level":1,"accept":["使いやすい","利用できる","容易に利用できる","アクセスしやすい","利用が容易な"],"drive":{"ja":"デジタル化された公共サービスは、高度なコンピューター技能を持たない高齢の住民にも利用しやすいものでなければならない。","en":"Digital public services must be accessible to older residents who lack advanced computer skills."},"explain":"公共サービスが主語、must beが述語で、who節は高齢住民を限定する。accessible toで利用する側を明示し、論述で技能格差への配慮を求められる。別の言い方: easy to use"},{"id":"p1-vocab_ej-215","q":"Some economists argue that governments should [[abolish]] tax breaks that benefit wealthy households without encouraging investment in the wider economy.","q_ja":"経済全体への投資を促さずに裕福な世帯を優遇する税制上の優遇措置は、政府が廃止すべきだと主張する経済学者もいる。","choices":[{"t":"廃止する","why":"正解。abolish は制度や慣行を正式になくすことを表す。"},{"t":"凍結する","why":"凍結は一時的に止めることであり、制度自体をなくす abolish とは異なる。"},{"t":"改定する","why":"内容を改めることではなく、優遇措置そのものを廃止するという意味。"},{"t":"新設する","why":"制度を新しく設けることは、制度をなくす abolish と逆の意味になる。"}],"answer":0,"point":"abolish は「制度・慣行などを廃止する」。一時停止や部分的な改定とは区別する。","level":2,"accept":["を廃止する","撤廃する","を撤廃する","制度をなくす","正式になくす"],"drive":{"ja":"経済全体への投資を促さずに裕福な世帯を優遇する税制上の優遇措置は、政府が廃止すべきだと主張する経済学者もいる。","en":"Some economists argue that governments should abolish tax breaks that benefit wealthy households without encouraging investment in the wider economy."},"explain":"経済学者が主語、argueの目的語がthat節で、次のthat節は優遇措置を限定する。abolishで制度の撤廃を提言でき、without以下で効果の欠如を示す。別の言い方: do away with"},{"id":"p1-vocab_ej-216","q":"While acknowledging that automation may eliminate certain jobs, researchers [[contend]] that investment in retraining would enable displaced workers to find employment in newly expanding industries.","q_ja":"自動化によって一部の仕事がなくなる可能性を認めつつ、研究者たちは、再訓練への投資により、職を失った労働者が新たに成長している産業で仕事を見つけられるようになると主張している。","choices":[{"t":"競い合っている","why":"contend には競うという意味もあるが、ここでは that 節の内容を主張する意味。"},{"t":"仮に想定している","why":"単なる仮定の提示ではなく、再訓練への投資の効果について見解を主張している。"},{"t":"主張している","why":"正解。contend that で、後ろに続く内容が正しいという立場を述べる。"},{"t":"事実を実証している","why":"contend は主張を表すだけで、その内容が証拠によって実証されたことまでは意味しない。"}],"answer":2,"point":"contend that は「〜と主張する」。競争を表す contend with や contend for と区別する。","level":3,"accept":["主張する","と主張する","論じている","という見解を述べている","と論じる"],"drive":{"ja":"自動化によって一部の仕事がなくなる可能性を認めつつ、研究者たちは、再訓練への投資により、職を失った労働者が新たに成長している産業で仕事を見つけられるようになると主張している。","en":"While acknowledging that automation may eliminate certain jobs, researchers contend that investment in retraining would enable displaced workers to find employment in newly expanding industries."},"explain":"While以下で研究者が弊害を認め、主節のcontendがthat節の見解を導く。contend thatなら要約で筆者の主張を示し、wouldで想定上の効果を表せる。別の言い方: argue that"},{"id":"p1-vocab_ej-217","q":"Consumers may be [[reluctant]] to share personal data when companies fail to explain its intended use.","q_ja":"企業が個人データの利用目的を説明しないと、消費者はそのデータの共有に消極的になるかもしれない。","choices":[{"t":"強く求められている","why":"企業などから要求されているという意味ではなく、消費者自身のためらいを表している。"},{"t":"十分に慣れている","why":"経験や慣れではなく、データを共有したくないという気持ちを表す。"},{"t":"進んで行いたがる","why":"積極的に行いたいという意味は、reluctant が表す消極的な姿勢と逆になる。"},{"t":"気が進まない","why":"正解。利用目的が不明なため、個人データの共有をためらうという意味。"}],"answer":3,"point":"be reluctant to do は「〜するのに気が進まない・〜することに消極的だ」。","level":1,"accept":["消極的な","したがらない","ためらう","乗り気でない","気乗りしない"],"drive":{"ja":"企業が個人データの利用目的を説明しないと、消費者はそのデータの共有に消極的になるかもしれない。","en":"Consumers may be reluctant to share personal data when companies fail to explain its intended use."},"explain":"消費者が主語、may beが述語で、when節はためらう状況を示す。be reluctant toで行動への消極性を表し、論述で説明不足と不信感を結び付けられる。別の言い方: be hesitant to"},{"id":"p1-vocab_ej-218","q":"When evaluating online information, citizens need to [[distinguish]] evidence from opinion, particularly when both appear together in reports about controversial scientific developments.","q_ja":"オンラインの情報を評価する際、市民は証拠と意見を区別する必要があり、議論を呼ぶ科学上の進展についての報道に両者が一緒に現れる場合は特にそうである。","choices":[{"t":"関連づける","why":"証拠と意見を結びつけるのではなく、両者の違いを見分けることを述べている。"},{"t":"区別する","why":"正解。distinguish A from B で「ＡとＢを区別する」という意味になる。"},{"t":"優先する","why":"証拠を重視するという解釈はできても、distinguish 自体は優先順位をつける意味ではない。"},{"t":"抜き出す","why":"情報を文中から抜き出す作業ではなく、証拠と意見の性質の違いを見分けることが焦点。"}],"answer":1,"point":"distinguish A from B は「ＡとＢを区別する」。情報の信頼性を論じる文で使える。","level":2,"accept":["を区別する","見分ける","を見分ける","識別する","違いを見分ける"],"drive":{"ja":"オンラインの情報を評価する際、市民は証拠と意見を区別する必要があり、議論を呼ぶ科学上の進展についての報道に両者が一緒に現れる場合は特にそうである。","en":"When evaluating online information, citizens need to distinguish evidence from opinion, particularly when both appear together in reports about controversial scientific developments."},"explain":"When以下は市民が情報を評価する場面、主節は区別の必要性を示す。distinguish A from Bで比較対象を明示し、論述で情報を吟味する姿勢を示せる。別の言い方: tell A apart from B"},{"id":"p1-vocab_ej-219","q":"Even if a pilot program proves effective, its high operating costs may [[preclude]] nationwide expansion unless the government secures a reliable source of additional funding.","q_ja":"試験的な事業の効果が確認されても、政府が信頼できる追加財源を確保しない限り、高い運営費のために全国展開が不可能になるかもしれない。","choices":[{"t":"時期を遅らせる","why":"preclude は単に実施時期を遅らせるより強く、全国展開を不可能にすることを表す。"},{"t":"規模を縮小する","why":"規模を小さくする意味ではなく、全国展開という選択肢を成り立たなくする意味。"},{"t":"実施を見合わせる","why":"実施を控えるという判断ではなく、費用が原因で実施できなくなることを表す。"},{"t":"不可能にする","why":"正解。preclude は何かが起こる可能性をなくすことを表し、ここでは高い費用が全国展開を妨げる。"}],"answer":3,"point":"preclude は「〜を不可能にする・〜が起こるのを妨げる」。単なる延期や規模縮小より強い意味。","level":3,"accept":["を不可能にする","実現できなくする","実現を不可能にする","実現を妨げる","可能性をなくす"],"drive":{"ja":"試験的な事業の効果が確認されても、政府が信頼できる追加財源を確保しない限り、高い運営費のために全国展開が不可能になるかもしれない。","en":"Even if a pilot program proves effective, its high operating costs may preclude nationwide expansion unless the government secures a reliable source of additional funding."},"explain":"Even if節で効果を仮定し、主節で費用の障害、unless節で財源確保という例外条件を示す。preclude＋名詞で論述の実現可能性を検討できる。別の言い方: make ... impossible"},{"id":"p1-vocab_ej-220","q":"Urban planners must [[anticipate]] future population growth when designing transport networks that will serve expanding communities.","q_ja":"都市計画の担当者は、拡大する地域社会を支える交通網を設計する際、将来の人口増加を予測しなければならない。","choices":[{"t":"予測する","why":"正解。将来の人口増加を前もって見越し、交通網の設計に備えるという意味。"},{"t":"促進する","why":"人口増加を速めることではなく、将来どの程度増えるかを見越すことを表す。"},{"t":"抑制する","why":"人口増加を抑える施策ではなく、増加を見越した交通網の設計を述べている。"},{"t":"集計する","why":"すでに得られた数値を合計することではなく、まだ起きていない変化を予測する意味。"}],"answer":0,"point":"anticipate は「〜を予測する・見越す」。将来の変化を見込んだ政策や計画について使う。","level":1,"accept":["を予測する","見越す","を見越す","予想する","前もって予想する"],"drive":{"ja":"都市計画の担当者は、拡大する地域社会を支える交通網を設計する際、将来の人口増加を予測しなければならない。","en":"Urban planners must anticipate future population growth when designing transport networks that will serve expanding communities."},"explain":"都市計画担当者が主語、must anticipateが述語で、when以下は設計時、that節は交通網の役割を示す。anticipate＋名詞で将来を見据えた政策を提言できる。別の言い方: foresee"}],"vocab_je":[{"id":"p1-vocab_je-001","q":"Local authorities should ___（配分する） more funds to public transport to improve access to essential services.","q_ja":"地方自治体は、不可欠なサービスを利用しやすくするため、公共交通により多くの資金を配分すべきだ。","choices":[{"t":"accumulate","why":"「蓄積する」という意味で、資金を公共交通に配分することを表さない。"},{"t":"allocate","why":"正解。allocate funds to は、特定の用途に資金を配分することを表す。"},{"t":"generate","why":"「生み出す」という意味で、既存の資金の配分を表さない。"},{"t":"withdraw","why":"「引き出す・撤回する」という意味で、資金を配分することを表さない。"}],"answer":1,"point":"allocate A to B で「AをBに配分する」。公的資金の使い道を述べる際に使える。","level":1,"accept":["devote","assign"],"drive":{"ja":"地方自治体は、不可欠なサービスを利用しやすくするため、公共交通により多くの資金を配分すべきだ。","en":"Local authorities should allocate more funds to public transport to improve access to essential services."},"explain":"主語は自治体で、should＋動詞が提言、末尾のto不定詞が目的を示す。allocate A to Bで配分先を明示し、政策の具体策を論じる。別の言い方: devote funds to public transport。"},{"id":"p1-vocab_je-002","q":"The expansion of automated services may ___（引き起こす） new forms of inequality unless governments support workers whose jobs are disappearing.","q_ja":"政府が仕事を失いつつある労働者を支援しなければ、自動化されたサービスの拡大は新たな形の不平等を引き起こす可能性がある。","choices":[{"t":"give way to","why":"「～に取って代わられる」という意味で、不平等を発生させることを表さない。"},{"t":"make up for","why":"「～を埋め合わせる」という意味で、不平等を引き起こすことを表さない。"},{"t":"keep pace with","why":"「～に遅れずについていく」という意味で、原因と結果の関係を表さない。"},{"t":"give rise to","why":"正解。give rise to は、問題や変化などを引き起こすことを表す。"}],"answer":3,"point":"give rise to の後ろには結果を表す名詞を置き、社会的な変化の影響を説明する。","level":2,"accept":["cause","lead to","bring about"],"drive":{"ja":"政府が仕事を失いつつある労働者を支援しなければ、自動化されたサービスの拡大は新たな形の不平等を引き起こす可能性がある。","en":"The expansion of automated services may give rise to new forms of inequality unless governments support workers whose jobs are disappearing."},"explain":"主語はサービスの拡大で、mayが可能性、unless節が支援しない場合の条件を示す。give rise toで変化と結果を結び、社会問題の原因を説明できる。別の言い方: bring about。"},{"id":"p1-vocab_je-003","q":"The long-term benefits of preventive healthcare may ___（上回る） its initial costs, even when the savings are difficult to measure during the first few years.","q_ja":"予防医療の長期的な利益は、最初の数年間は節約額を測定しにくい場合でも、初期費用を上回る可能性がある。","choices":[{"t":"outweigh","why":"正解。outweigh は、比較した際に利益などの価値や重要性が費用などを上回ることを表す。"},
