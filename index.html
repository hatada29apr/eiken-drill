<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>英検ドリル</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="英検ドリル">
<style>
  body { font-family: system-ui, sans-serif; margin: 16px; font-size: 18px; line-height: 1.6; }
  .row { padding: 10px; margin: 8px 0; border-radius: 8px; background: #eee; }
  .ok { background: #d8f5d8; } .ng { background: #f8d6d6; }
  button { font-size: 20px; padding: 14px; width: 100%; margin: 8px 0; border-radius: 10px; }
  #note { color: #555; font-size: 15px; }
</style>
</head>
<body>
<h1>英検ドリル 動作確認</h1>
<div id="js" class="row ng">① JavaScript: 動いていません（この行が赤のままなら、JSが無効な開き方です）</div>
<div id="ls" class="row">② 記録の保存: 確認中…</div>
<div id="voices" class="row">③ 読み上げの声: 確認中…</div>
<button id="en">④ 英語を読み上げる</button>
<button id="ja">⑤ 日本語を読み上げる</button>
<button id="seq">⑥ 自動で続けて読み上げる（運転中モードの試験・約15秒）</button>
<div id="seqout" class="row">⑥ の結果: 未実行</div>
<div id="sa" class="row">⑦ ホーム画面からの起動: 確認中…</div>
<div id="sw" class="row">⑧ オフラインの準備: 確認中…</div>
<div id="wl" class="row">⑨ 画面を消さない機能: 確認中…</div>
<p id="note">④〜⑥で声が出たかを教えてください。②の数字は、ページを開き直すたびに1ずつ増えれば正常です。<br>
⑦⑧は、ホーム画面に追加して、そこから開いたときに確認します。最後に機内モードにして、ホーム画面から開けるかも試してください。</p>
<script>
  const $ = (id) => document.getElementById(id);
  const js = $('js'); js.textContent = '① JavaScript: 動いています'; js.className = 'row ok';

  try {
    const n = Number(localStorage.getItem('probe-count') || 0) + 1;
    localStorage.setItem('probe-count', String(n));
    $('ls').textContent = '② 記録の保存: 動いています（開いた回数 ' + n + ' 回目）';
    $('ls').className = 'row ok';
  } catch (e) {
    $('ls').textContent = '② 記録の保存: 使えません（' + e.name + '）';
    $('ls').className = 'row ng';
  }

  const hasTTS = 'speechSynthesis' in window;
  function listVoices() {
    if (!hasTTS) { $('voices').textContent = '③ 読み上げ: この開き方では使えません'; $('voices').className = 'row ng'; return; }
    const v = speechSynthesis.getVoices();
    const en = v.filter(x => x.lang.startsWith('en')).length;
    const ja = v.filter(x => x.lang.startsWith('ja')).length;
    $('voices').textContent = '③ 読み上げの声: 英語 ' + en + ' 個 / 日本語 ' + ja + ' 個';
    $('voices').className = 'row ' + (en && ja ? 'ok' : (v.length ? '' : 'ng'));
  }
  listVoices();
  if (hasTTS) speechSynthesis.onvoiceschanged = listVoices;

  function say(text, lang) {
    return new Promise((resolve) => {
      if (!hasTTS) return resolve(false);
      const u = new SpeechSynthesisUtterance(text);
      u.lang = lang;
      u.rate = 0.95;
      u.onend = () => resolve(true);
      u.onerror = () => resolve(false);
      speechSynthesis.speak(u);
    });
  }
  const wait = (ms) => new Promise(r => setTimeout(r, ms));

  $('en').onclick = () => say('I agree that people should use public transportation more often.', 'en-US');
  $('ja').onclick = () => say('公共交通機関をもっと使うべきだという意見に賛成です。', 'ja-JP');
  $('seq').onclick = async () => {
    $('seqout').textContent = '⑥ 実行中…画面に触らずに待ってください';
    const a = await say('問題。理由を英語で言ってください。', 'ja-JP');
    await wait(3000);
    const b = await say('It reduces traffic jams in big cities.', 'en-US');
    await wait(1000);
    const c = await say('It reduces traffic jams in big cities.', 'en-US');
    const ok = a && b && c;
    $('seqout').textContent = '⑥ の結果: ' + (ok ? '最後まで自動で進みました' : '途中で止まりました');
    $('seqout').className = 'row ' + (ok ? 'ok' : 'ng');
  };

  const standalone = navigator.standalone === true || matchMedia('(display-mode: standalone)').matches;
  $('sa').textContent = '⑦ ホーム画面からの起動: ' + (standalone ? 'はい' : 'いいえ（Safari で開いています）');
  $('sa').className = 'row ' + (standalone ? 'ok' : '');

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').then(() => navigator.serviceWorker.ready).then(() => {
      $('sw').textContent = '⑧ オフラインの準備: できています'; $('sw').className = 'row ok';
    }).catch(e => { $('sw').textContent = '⑧ オフラインの準備: 失敗（' + e.message + '）'; $('sw').className = 'row ng'; });
  } else { $('sw').textContent = '⑧ オフラインの準備: この開き方では使えません'; $('sw').className = 'row ng'; }

  $('wl').textContent = '⑨ 画面を消さない機能: ' + ('wakeLock' in navigator ? '使えます' : '使えません');
  $('wl').className = 'row ' + ('wakeLock' in navigator ? 'ok' : 'ng');
</script>
</body>
</html>
